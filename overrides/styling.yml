  # --- ES-brand audit (2026-07-12): whole-string pins (deliberately NOT
  # acronym tokens — token forms would restyle other records' fold keys) ---
  GPR: GPR               # Derbi GPR (Gran Premio Replica) — bare "GPR" must not title-case to "Gpr" (motorcycle derbi/gpr; only Derbi carries the token). NOT an acronym: token GPR would restyle "Gpr NUDE50" and orphan its renames.yml key
  EC: EC                 # Gas Gas EC (Enducross) family — official all-caps (gasgas.com); whole-string, only gas-gas/ec matches
  TXT: TXT               # Gas Gas TXT trials — official all-caps; whole-string, only gas-gas/txt matches
  TX: TX                 # Gas Gas TX (1998 trials) — also correct for LEVC TX and Van Hool TX, the only other whole-string matches
  SM: SM                 # Gas Gas SM supermoto family — also correct for Citroën SM (official) and Aprilia/Sisu SM codes, the only other matches
  "2.5I": 2.5i           # Sherco's injected 4T enduro era uses lowercase i (2.5i Enduro, 2008-2011)
  "3.0I": 3.0i           # same series (RDW 290/304cc)
  "4.5I": 4.5i           # same series (449cc)
  MR: MR                 # Rieju MR enduro family (MR 250/300, 2021+) keeps caps (rieju.com); side effect: re-cases Toyota's whole-string "Mr" (MR2 truncation), equally correct
  E-TANGO: e-Tango       # Rieju's official lowercase e- prefix (https://rieju.com/us/electric/112/527/etango) — e-tron precedent
  EXE II: EXE II         # Nerva EXE II — maker/press all-caps (https://www.motociclismo.es/pruebas/nerva-exe-ii-segunda-version-scooter-electrico-espanol_310667_102.html); numbered two-wheeler generations stay separate records (ktm/duke-ii precedent)
  EXE: EXE               # Nerva's all-caps model name — future gen-1 "EXE" rows must not title-case to "Exe"; no whole-string collisions catalog-wide
  I4: i4                 # Irizar official lowercase-i coach range (https://www.irizar.com/en/products-technologies/all-models); BMW i4 shares the same official casing
  I6: i6                 # Irizar official casing; also the merge target of the Irizar "16" rename
  I8: i8                 # Irizar official casing; BMW i8 shares it
  "480 ES": 480 ES        # Volvo 480 ES — spaced official launch name (1986). Whole-string pin, deliberately NOT an ES acronym token: token ES orphaned Gas Gas "Es: ES 700" (gb/nz evidence lost, spotcheck caught it) and un-folded the entire Lexus ES family (liveness gate fired on 8 aliases) — measured 2026-07-25, GPR-precedent applies
  MGA: MGA               # MG MGA (1955-62) — one closed token (en.wikipedia MG_MGA); whole-string pin, blast radius 1 (only car/mg/mga displays Mga catalog-wide, dossier-verified)
  MGB: MGB               # same closed-token rule (en.wikipedia MG_MGB); blast radius 2 (car/mg + car/leyland MGBs, both genuine); does NOT touch the MotoGB make mgb — make casing lives in makes/aliases.yml
  XDC: XDC               # DAF XDC — a REAL New Generation vocational model, presented at IAA 2022 and in production from early 2023 (https://www.daf.global/en-us/trucks/new-generation-daf-xfc-and-xdc); the raws corroborate DAF's own shape, "XDC 410 FAD" (model, power, axle code). Published today as "Xdc" because smart_case has no token for it. WHOLE-STRING pin, blast radius 1 (truck/daf/xdc is the only id displaying Xdc catalog-wide, measured 2026-08-01) — deliberately NOT an acronyms: token, which NAMING §9 requires a full-catalog sweep for. Slug unchanged: slugify("XDC") == slugify("Xdc") == xdc
  CLE: CLE               # Mercedes-Benz CLE-Class coupé/cabriolet, the 2023 C-Class/E-Class coupé successor — https://www.mercedes-benz.com/en/vehicles/passenger-cars/cle/ . Published today as "Cle" because smart_case has no token for it while its ENTIRE cohort does (CLA, CLS, GLC, GLE, GLS are acronyms: tokens, lines 132-138). WHOLE-STRING pin per the XDC/XFC precedent below, deliberately NOT an acronyms: token — NAMING §9 requires a full-catalog sweep for those, and the ES-token orphaning (see "480 ES") is what it costs to skip one. RE-VERIFIED 2026-08-02 against a fresh six-kind build, not inherited: blast radius 1 (car/mercedes-benz/cle is the ONLY record catalog-wide whose name contains the token "Cle"), and NO key in renames.yml / moves.yml / aliases.yml / body_types.yml contains it, so nothing goes silently inert. Slug unchanged — slugify("CLE") == slugify("Cle") == "cle" — so no id churn, no retirement, no alias. Raised now because pipeline G-1c puts 680 more gb vehicles behind the misspelling (uk_dft's AMG CLASS aggregate carries "AMG CLE53AMG NT ED PRM+MHV4M+A" and "AMG CLE 53 AMG PREM MHEV 4M+ A"); the defect predates it
  XFC: XFC               # DAF XFC — same launch, same source, same shape ("XFC 530 FT"); same whole-string pin, blast radius 1 (truck/daf/xfc). NB truck/daf/xb is the same class (DAF's model overview lists XB 170…310) and is deliberately LEFT ALONE here — it is a 2-vehicle record and widening a stylings batch the reviewer did not ask for is how these pins rot; the one-line proposal is in the PR body
  # --- ELECTRIC-VAN e-PREFIX, sourced 2026-08-01 (S4W). Both marques write a
  # LOWERCASE e joined to a capitalised nameplate; every register that preserves
  # case in its model column already writes it that way, and only the upcasing
  # registers (es_dgt, lu_snca, uk_dft, most nl_rdw rows) lose it. Same class as
  # E-TRON/E-TANGO above: a manufacturer-official lowercase prefix, pinned as a
  # whole string so it cannot re-case any other record's rename key.
  ESPRINTER: eSprinter   # Mercedes-Benz official casing — https://www.mbvans.com/en/esprinter "Prepare to experience the all-electric eSprinter" (12 occurrences on the page, all eSprinter). Corroborated raw-side: fi_traficom writes "eSprinter" (n=55) and nl_rdw "eSprinter" (n=66). Blast radius 5, all correct: car/van/truck mercedes-benz/esprinter (published) + candidates bus/mercedes-benz/esprinter and van/feniks/esprinter (a converter on the same Mercedes base — same word, same marque casing)
  ECITAN: eCitan         # Mercedes-Benz official casing — MB UK price list "The Mercedes-Benz eCitan. Electric Panel Van model." (https://www.ciceley.com/wp-content/uploads/2025/01/ecitan-panel-van-compressed.pdf, cover + "specifications of the eCitan"; the tailgate badge in the same brochure reads eCitan). Corroborated raw-side: fi_traficom writes "eCitan" (n=65), nl_rdw "eCitan" (n=7). Blast radius 1: van/mercedes-benz/ecitan
  EDELIVER 5: eDeliver 5 # SAIC MAXUS official casing — the marque's own global range lists "eDeliver 9 / eDeliver 7 / eDeliver 5 / eDeliver 3" under Commercial Vehicles (https://en.saicmaxus.com/, https://en.saicmaxus.com/car/edeliver7.shtml). Blast radius 1: van/maxus/edeliver-5
  EDELIVER 7: eDeliver 7 # same source; blast radius 1: van/maxus/edeliver-7
  EDELIVER 9: eDeliver 9 # same source; corroborated raw-side: nl_rdw writes "eDeliver 9" (n=1) and fi_traficom "eDeliver 9" (n=2). Blast radius 2, both correct: the maxus eDeliver 9 rows (which this pin re-unites with the E-DELIVER 9 spelling via the renames.yml fold) + candidate car/ldv/edeliver-9 (LDV is Maxus's former UK marque — same vehicle, same official casing)
  XXX: XXX               # Talaria XXX — a REAL e-motorbike model, not a placeholder. Raw RDW pairs it explicitly: "TL2500, XXX" (https://talaria.bike/), n=6. NOTE: this pin is currently BELT-AND-BRACES, not the load-bearing fix — what actually produces "XXX" today is renames.yml `Talaria: TL2500: XXX`, whose value is used verbatim without smart_case. This entry only matters if that rename is ever removed, at which point case_token would yield "Xxx". It sat at column 0 (outside `stylings:`) from 2026-07-25 until 2026-07-26 and was inert the whole time, while its comment claimed credit for the correct output — see lint 1a-bis.
  # --- D-2, Opel's electric line (2026-08-02, S4W). Pairs with the pipeline's
  # ELECTRIC_NAMEPLATES pin: that pin makes collapse_variant emit the electric
  # product name instead of letting the -[A-G] generation strip erase it. Only
  # ONE of its five values needs a display pin — "Combo Electric" / "Mokka
  # Electric" / "Movano Electric" already survive smart_case unchanged (measured),
  # and "Rocks-e" round-trips to "Rocks-E", which is exactly what
  # moped/opel/rocks-e publishes today.
  AMPERA-E: Ampera-e     # Opel Ampera-e (2017-19) — sold and DISCONTINUED before Opel's 2023 "-e → Electric" rename, so the historic form is the only name this car ever had (https://en.wikipedia.org/wiki/Opel_Ampera). REQUIRED, not cosmetic: smart_case("Ampera-e") returns "Ampera-E" (measured on the patched normalizer), so WITHOUT this pin the published display of car/opel/ampera-e REGRESSES from today's "Ampera-e". Today's correct display comes from the renames.yml `Ampera EV: Ampera-e` VALUE, used verbatim — the path the normalizer pin now bypasses for 2,856 of that record's 2,861 vehicles. Whole-string pin, blast radius 1: car/opel/ampera-e is the only id in dist/vehicles.csv whose model_name upcases to AMPERA-E (car/opel/ampera, car/vauxhall/ampera and gas-gas/pampera* are unaffected). Deliberately NOT an acronyms token (NAMING §9). Slug unchanged: slugify("Ampera-e") == slugify("Ampera-E") == ampera-e

acronyms:
  # --- S2W acronym tranche 2 (2026-07-26): marque TYPE CODES ---
  # Selected by a rule narrower than the detector's: a token qualifies only if it
  # is not a word in any language likely to appear in a nameplate. The pin is
  # GLOBAL across every make and kind, so "the catalog spells it in caps
  # somewhere" is not sufficient.
  # DELIBERATELY EXCLUDED — real nameplate words that merely LOOK like codes:
  #   PRO BOY BOB MAX PAN APE BIG ZIP DAX EVO JET CUB. "Fat Boy", "Fat Bob",
  #   "Pan America", "Big Chief", "Super Cub", Piaggio Ape/Zip, Honda Dax are
  #   all correct today; pinning these would break 80+ good records.
  # ALSO EXCLUDED — LE, the proven collision: indian/"Ftr R Carbon Le" wants LE
  #   (Limited Edition) while moto-guzzi/"Le Mans" wants Le (French article).
  #   One global token cannot serve both — the 480-ES lesson.
  # ALSO EXCLUDED — MK: British usage is "Mk III", not "MK III".
  - GSX   # Suzuki's sport family prefix (GSX-R, GSX-S, GSX650F) — 25 records
  - CVO   # Harley-Davidson Custom Vehicle Operations — 20 records
  - YZF   # Yamaha's supersport prefix (YZF-R1, YZF-R125) — 14 records
  - ZX    # Kawasaki's Ninja ZX series — 12 records
  - MT    # Yamaha MT (Master of Torque) naked family; also Dnepr MT-9 — 9 records
  - FTR   # Indian FTR (Flat Track Racer) — 6 records
  - FLHT  # Harley Electra Glide frame code — 5 records
  - DSR   # Zero Motorcycles DSR — 5 records
  - XLH   # Harley Sportster frame code — 4 records
  - DR    # Suzuki DR dual-sport family — 4 records
  - SU    # Yamaha model-code suffix (MTN690-SU) — 4 records
  - ZZ    # Kawasaki ZZ-R, Suzuki ZZ — 3 records
  - ST    # Ducati ST sport-tourer, Harley Road Glide ST — 13 records
  # --- Roman numerals (S2W, 2026-07-26, B-001 acronym worklist) ---
  # Safe as GLOBAL token pins because no marque spells a numeral as a word:
  # smart_case turns raw "III" into "Iii", which is wrong in every marque that
  # uses it (Triumph Rocket III, Moto Guzzi California III, Norton Commando Mk
  # III, KTM Duke II, SYM Fiddle II...). 17 two-wheeler records plus the
  # four-wheel half — the acronyms list is global, so this necessarily crosses
  # ownership; flagged to S4W in NEGOTIATION for veto on their half.
  # DELIBERATELY NOT ADDED: IX. Jaguar Mark IX wants caps but Hyundai ix35 is
  # officially LOWERCASE, so one global pin cannot serve both — same collision
  # that made "480 ES" a whole-string pin instead of an ES token. IV/VI/VII/XII
  # are not attested as defects and are not pinned speculatively.
