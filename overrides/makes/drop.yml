# Makes to DROP for the given kind (they belong to another kind, or are
# coachbuilders/converters that pollute passenger-car data).
#
# Shape: kind → list of raw UPPERCASE make strings (as sources emit them),
# each with a reason. Dropping here only affects that kind's build — e.g.
# IVECO is dropped from `car` but is a legitimate `van`/`truck` make.
#
# Provenance: seeded from the RDW MVP curation (scripts/build.rb DROP_MAKES,
# validated against live RDW pulls 2026-06); grows per-source as reconciliation
# surfaces leakage. RDW "Personenauto" famously includes camper/kombi
# conversions registered as cars — see Dossier §4.2.

car:
  - IVECO           # truck/van maker; leaks into car data via camper conversions
  - MAN             # truck maker; camper conversions
  - DAF             # truck maker; classic-car tail + conversions
  - SCANIA          # truck maker
  - VOLVO TRUCKS    # RDW splits from VOLVO; trucks kind picks it up
  - ADRIA MOBIL     # motorhome coachbuilder
  - KNAUS           # caravan/motorhome builder
  - WEINSBERG       # motorhome builder
  - HYMER           # motorhome builder
  - DETHLEFFS       # motorhome builder
  - HOBBY           # caravan builder
  - FORD-CNG-TECHNIK  # Ford gas-conversion outfitter (RDW quirk), not a make
  - BURSTNER        # motorhome builder (UK/DE sources)
  - BÜRSTNER        # motorhome builder (diacritic variant)
  - CARTHAGO        # motorhome builder
  - CHAUSSON        # motorhome builder
  - PILOTE          # motorhome builder
  - RAPIDO          # motorhome builder
  - WESTFALIA       # camper converter (VW California's ancestor lives under VW)
  - AUTO-SLEEPERS   # UK motorhome converter (VEH0120)
  - AUTOTRAIL       # UK motorhome builder
  - SWIFT           # UK caravan/motorhome builder — NOT the Suzuki Swift (that's a model)
  - ELDDIS          # UK motorhome builder
  - COACHMEN        # US RV builder
  - WINNEBAGO       # US RV builder
  # Motorhome/camper coachbuilders surfaced by FI/ES ingestion (registered as
  # M1 "cars" in those registers — audit 2026-07-05):
  - ETRUSCO         # motorhome brand (Hymer group) — FI/ES M1 registrations
  - MOBILVETTA      # motorhome brand (SEA group)
  - MCLOUIS         # motorhome brand (SEA group)
  - XGO             # motorhome brand (Rimor)
  - RANDGER         # motorhome brand (FI registrations)
  - FIAT/HYMER      # RDW/FI compound base-vehicle+builder string
  - REMETZ          # NL hearse/limo coachbuilder
  - ALLIED VEHICLES LTD  # UK wheelchair-accessible converter
  - BENIMAR         # motorhome builder (ES — *51 code rows too)
  - ROLLER-TEAM     # motorhome builder (IT)
  - ROLLER TEAM     # spelling variant of the above
  - BUNKERVAN       # ES camper converter
  - GIOTTILINE      # motorhome builder (IT)
  - ELNAGH          # motorhome builder (SEA group)
  - RIMOR           # motorhome builder (IT)
  - CHALLENGER      # motorhome brand (Trigano) — NOT the Dodge Challenger (model, not make)
  - ITINEO          # motorhome brand (Rapido group)
  - SUNLIGHT        # motorhome brand (Erwin Hymer)
  - LAIKA           # motorhome builder (Hymer group)
  - MALIBU          # motorhome brand (Carthago) — NOT the Chevrolet Malibu (model)
  - POSSL           # camper converter (DE)
  - PÖSSL           # diacritic variant of the above
  - GLOBECAR        # camper brand (Pössl group)
  - LMC             # motorhome builder (Erwin Hymer)
  - NIESMANN+BISCHOFF  # motorhome builder (Hymer group)
  - FRANKIA         # motorhome builder (Pilote group)
  - RAPIDO          # motorhome builder (FR) — second listing guards the FI spelling
  # --- motorhome coachbuilders surfaced by the 2026-07-05 dataset audit
  # (kind_mismatch, high-confidence); matched against the RESOLVED make so
  # entity-string variants ("MC LOUIS SPA" → "Mc Louis") drop with one entry.
  - CAPRON          # Erwin Hymer Group (Carado/Sunlight motorhomes)
  - CONCORDE        # Concorde Reisemobile (DE luxury motorhomes)
  - EURA MOBIL      # Eura Mobil (DE, Ducato-based motorhomes)
  - KARMANN-MOBIL   # motorhome brand of Eura Mobil (itself dropped above) — 796/799 NL Personenauto rows are inrichting=kampeerwagen (opendata.rdw.nl merk census 2026-07-26); "eine Marke und kein eigenständiges Unternehmen" (https://de.wikipedia.org/wiki/Karmann-Mobil); whole catalogue is Davis/Dexter/Duncan floorplans (https://www.karmann-mobil.de/). drop_fold covers the "KARMANN MOBIL" raw; plain KARMANN (the Ghia coachbuilder) folds to "karmann" and is NOT affected
  - LA STRADA       # La Strada Fahrzeugbau (DE campervans)
  - LAIKA CARAVANS S.P.A.  # Laika (IT motorhomes) — corporate string
  - LAIKA           # Laika bare form
  - MC LOUIS        # McLouis (IT motorhome coachbuilder, Fiat Ducato)
  - MOOVEO          # Mooveo (Pilote group motorhomes)
  - MORELO          # Morelo Reisemobile (DE liner motorhomes)
  - NIESMANN BISCHOFF  # spelling variant (no + sign)
  - MOONVEO         # observed misspelling guard
  - SUN LIVING      # Adria Mobil entry-level motorhomes
  - WINGAMM         # Wingamm (IT monocoque campers)
  - ADRIA           # Adria Mobil (SI motorhomes/caravans) — 126 car-kind rows were motorhomes
  - AUTOSTAR        # Autostar (FR motorhomes)
  # --- junk make strings (audit, high-confidence) ---
  - FACTORY BUILT   # placeholder registration string, not a marque
  - EIGENBOUW       # Dutch "self-build" — kit/amateur builds, not a marque
  # --- motorhome/caravan builders still published as car makes (2026-07-25).
  # Same class as the BENIMAR/BUNKERVAN/BÜRSTNER/PÖSSL entries above: campers on
  # a van or truck base are registered M1 ("Personenauto") in NL/ES/FI, so the
  # builder surfaces as a car make. Each line below was MEASURED against the RDW
  # open register (CC0) on 2026-07-25 rather than inferred from the brand name:
  #   https://opendata.rdw.nl/resource/m9d7-ebf2.json?$select=voertuigsoort,inrichting,count(*)&$where=merk='<MERK>'&$group=voertuigsoort,inrichting
  # Counts below are Personenauto rows carrying inrichting=kampeerwagen.
  - KABE            # 79/79 kampeerwagen (plus 676 caravan trailers) — Swedish caravan/motorhome builder (https://www.kabe.se/)
  - TRIGANO         # kampeerwagen rows only; Europe's largest RV group, and every catalogued model (Autoroller, Carioca, Granduca, Riviera, Pegaso, T-Line) is a motorhome floorplan (https://www.trigano.fr/)
  - CI              # 166/166 kampeerwagen — Caravans International (https://www.ci-camper.com/)
  - BAVARIA         # 217/218 kampeerwagen (1 MPV) — Bavaria Camp motorhomes; catalogued models are floorplan codes (F060XDG, I074LGJ, K600G)
  - JOINT           # 254/254 kampeerwagen — Joint motorhomes (Rimor group)
  - SEA             # 186/186 kampeerwagen — S.E.A. / Elnagh group motorhomes (IT)
  - DREAMER         # 147/148 kampeerwagen — Dreamer campervans (Rapido group, https://www.dreamer-camper.com/)
  - FORSTER         # 148/148 kampeerwagen — Forster motorhomes (Eura Mobil group)
  - FLEURETTE       # 113 kampeerwagen — Fleurette motorhomes (FR, https://www.fleurette.fr/)
  - KNAUS TABBERT   # parent group of the already-dropped KNAUS; the compound form escaped that entry (https://www.knaustabbert.de/)
  - FENDT           # Fendt-Caravan motorhomes/caravans. NB the RDW rows under merk=FENDT are agricultural trailers (the tractor marque) — neither reading is a car, so the car-kind drop is correct either way, but do NOT extend it to other kinds without checking which Fendt you have.
  - FIAT-PILOTE     # Pilote motorhome conversion on a Fiat Ducato base; PILOTE alone is already dropped, the compound escaped it
  - FIAT-FLEURETTE  # as above, Fleurette conversion on a Ducato base
  - FIAT DUCATO AFFINITY # as above — "Affinity Camper Van" is the model, the make string is chassis+converter
  # --- motorhome coachbuilders surfaced by the ES-brand audit (2026-07-12);
  # matched against the RESOLVED make (BENIMAR/BUNKERVAN precedent) ---
  - MONCAYO         # Caravanas Moncayo (Villanueva de Gállego, Zaragoza; defunct 2011) — NL RDW rows 100% inrichting=kampeerwagen; ES M1 leakage (https://opendata.rdw.nl/resource/m9d7-ebf2.json?merk=MONCAYO)
  - PLA             # P.L.A. srl motorhome coachbuilder (IT, Giottiline group) — NL RDW rows 100% kampeerwagen (PLA 390, HS75…); camper-typical multi-stage TANs
  - ILUSION         # Ilusion Caravaning motorhomes (Pinseque, Zaragoza) — NL RDW rows 100% kampeerwagen (590/690/695; https://ilusioncaravaning.com/)

moped: []           # no drops yet; curation TBD when the kind ships

motorcycle:
  - POLARIS         # ATV/side-by-side maker leaking into moto registries; revisit if quads become a kind
  # NAMING.md line 33 already lists EIGENBOUW under "not a marque at all → drop
  # for that kind"; it had simply never been implemented. Dutch for "self-built"
  # — RDW's placeholder for home-built machines. The one published record is
  # motorcycle/eigenbouw/softail (nl_rdw): a home-built Softail-style chopper.
  # NOT moved to Harley-Davidson — a self-built frame in a Softail style is not
  # a Harley, and inventing that provenance is worse than dropping the row.
  # Scoped to motorcycle because that is where it publishes; if a build ever
  # surfaces it under moped, add it there too rather than assuming kind-blind
  # drops (every entry in this file is kind-scoped, deliberately — see car:).
  - EIGENBOUW

van:
  # motorhome coachbuilders leaking into the van kind — same class as the car
  # drops above; measured 2026-07-25 on a fresh build (G18: 11 records across 6
  # makes were escaping the car-only scoping)
  - HYMER           # 1 van record; motorhome builder (already dropped from car)
  - AUTO-TRAIL      # 1 van record; UK motorhome builder — one entry suffices, drop matching FOLDS separators/diacritics (the reachability test rejects redundant variants)
  - CHAUSSON        # 1 van record; motorhome builder (already dropped from car)
truck:
  # motorhome coachbuilders leaking into the truck kind (G18) — these are
