# makes/converters.yml — body converters that are PUBLISHED as a make, whose register
# rows are conversions of another maker's vehicle.
#
# Shape:  <make display>: <evidence>
#
# es_dgt re-homes a converter row onto the base-vehicle make (MATRABA [463,30)) only
# when the converter is NOT already a published make of the kind; a make listed here
# is re-homed anyway (pipeline EsDgt#rebase_converter, Overrides#converter_makes),
# still behind the landing gate (the row must reach a published record). Its own
# published records retire onto the base vehicle (moves.yml + former_ids.yml).
#
# Owner ruling 2026-11-10 (2026.11.4 held item 7): "re-home converter makes already
# published onto the base vehicle; retire the converter-make records with former_ids
# to the base, unless the converter is a genuine manufacturer with its own
# nameplates — decide per make with evidence." Measured Jul–Sep 2026 (published
# makes carrying a different base make): Zago Automotive 190 rows, Mebauto 101.
# KEPT as makes, each with its own nameplates: Socage (aerial platforms "20D/24D
# Speed"), the bus coachbuilders (Irizar, Unvi, Ferqui, Indcar, Beulas, Higer —
# the coachbuilder IS the bus make by catalog convention), the camper builders
# (Panama, Bürstner, Bravia).

Zago Automotive: '"Conversiones VAN: Consigue la agilidad de un turismo y la capacidad de carga de una furgoneta" — converts Opel Corsa, Dacia Sandero/Duster/Jogger, VW Transporter/Crafter, Ford Transit Courier (https://www.zagoautomotive.com/, accessed 2026-11-10)'
Mebauto: '"CARROCERÍAS MEBAUTO" — Valencia bodybuilder ("Servicios de homologación"); its DGT rows are Toyota Proace, VW Crafter, Ford Transit, MAN TGE, Citroën Jumpy bodies (https://www.mebauto.com/, accessed 2026-11-10)'
