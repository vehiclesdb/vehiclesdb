# attested.yml — ATTESTED ADMISSION (owner ruling 2026-11-09; DECISIONS.md
# "Attested admission").
#
# A real nameplate that the register evidence cannot carry over the publication
# floor (car 1,000 single-source, van/motorcycle/moped 300, truck 150, bus 50)
# publishes when BOTH hold:
#   1. at least one MINTING register vehicle reaches it through the normal
#      classify path (attach-only au/ch/il/no rows do not count) — name it in
#      the comment as `<source> <count>`;
#   2. a tier-1 (manufacturer, incl. its heritage site/museum) or tier-2 (trade
#      press, auction house, official body) source names the model. Wikipedia
#      is tier 3 and cannot attest.
# The build FAILS (validate gate `attested`) on an entry no minting register
# row reaches; scripts/lint_overrides.rb checks the shape below. An entry never
# mints a record, never revives a former_ids alias source, and never bypasses
# drop/kind rules.
#
# SHAPE (append freely; keep makes alphabetical inside a kind):
#   <kind>:
#     <canonical make, as renames.yml spells the block>:
#       <published nameplate>: <source URL>  # <source> <n> …; <what the page says>; (accessed YYYY-MM-DD) [tier 1|2]
#       <published nameplate>: {url: <source URL>, evidence: attach_only}  # au_bitre <n> …; attach-only evidence …
#
# ATTACH-ONLY FORM (owner ruling 2026-11-10, DECISIONS.md): the mapping value
# admits a sourced nameplate whose only register evidence is attach-only
# (au/il/ch/no/ro). Rule 1 below then reads "at least one register vehicle".
#
# Not attested yet (no tier-1/2 source found, 2026-11-09): Alfa Romeo 8C 2900A
# (nl_rdw 1, "ALFA 8C 2900A BOTTICELLA") — only book titles and a private
# museum name it.

