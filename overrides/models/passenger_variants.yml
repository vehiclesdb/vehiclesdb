# Passenger versions of van-based nameplates — the evidence-gated exemption
# from the make-blind `car:` list in drop_patterns.yml.
#
# RULING: DECISIONS.md "Passenger versions of van-based MPVs publish in kind
# car" (2026-11-09). Precedents: NAMING.md §3 ("The same nameplate may exist in
# several kinds; each kind's files stand alone"), car/mercedes-benz/v-class
# beside van/mercedes-benz/v-class, and PROPOSAL-kind-boundary.md Q1 (decided
# 2026-07-25: `kind` is the LEGAL axis — derive it from the EU category).
#
# WHY THIS FILE EXISTS. drop_patterns.yml drops every van nameplate from the
# car build on the premise "they belong to kind van, whose build ingests them
# via kind_maps instead". That premise is false for the PASSENGER rows: the ES
# van build ingests N1 only, so Spain's M1 rows of these nameplates reached NO
# kind (Ford Tourneo Courier 756 + Tourneo Custom 441 + Tourneo Connect 191 ES
# M1 regs Jul–Sep 2026, zero `es` anywhere in the dataset), and a passenger
# consumer filtering `kind: car` could not find a Berlingo, a Caddy Life or a
# Rifter in any country. Measured: research/passenger-vans.md (2026-11-09).
#
# HOW IT WORKS (pipeline: overrides.rb#passenger_lift, normalizer.rb#classify,
# reconciler.rb#passenger_gate!):
#   1. Each entry is MAKE-SCOPED and names one drop_patterns.yml `car:` source
#      string VERBATIM (`lift:`). For that make only, the car drop union becomes
#      "every car pattern except the lifted ones" — "TRANSIT TOURNEO" still hits
#      \bTRANSIT\b and stays dropped. A `lift:` that is not verbatim a car drop
#      pattern makes the build RAISE (an inert lift reads like a gate "no").
#   2. `publish:` is the CLOSED list of nameplates the lifted rows may resolve to
#      after renames/moves; anything else is dropped exactly as before and
#      logged ("passenger lift car: … resolved OUTSIDE their publish: list").
#      This is what keeps the big-van CONVERSION bases out of `car` even where a
#      lift shares their pattern (Ford: \bTRANSIT\b lifts ONLY Transit Custom).
#   3. Publication is decided by EVIDENCE at build time, not by this list: the
#      car record publishes only if, in at least one register whose car/van line
#      is the EU M1/N1 category at row level (`split_countries`), it holds
#      >= min_car_count vehicles AND >= min_car_share of that country's car+van
#      total. Every verdict is logged ("passenger gate car/<id>: PASS es …").
#   4. van/... ids are untouched (additive only). Lifted ids are exempt from the
#      97% cross-kind dominance prune, so a passenger-dominated nameplate cannot
#      prune its own published van record.
#
# NOT LIFTED, deliberately — the camper/kombi CONVERSION bases, whose M1 rows
# are motorhomes and ambulances, not private cars (ES DGT RD 2822 field #53,
# Jul–Sep 2026: Ducato M1 = 86 of 109 "32" autocaravana; Master M1 3.9% of the
# nameplate; Crafter 3.8%; Boxer 1.6%; Jumper 3.1%; Movano 1.1%): SPRINTER,
# CRAFTER, DUCATO, MASTER, BOXER, JUMPER, MOVANO, DAILY, TGE, INTERSTAR,
# DELIVER 7, big TRANSIT, and TRANSPORTER (its passenger body publishes as
# car/volkswagen/caravelle already; ES M1 share 17%).

gate:
  min_car_count: 100   # noise floor: the owner's brief (2026-11-09) — ">= 100 M1 rows in a source window"; below it a share is a handful of rows
  min_car_share: 0.25  # the owner's brief — ">= 25% M1 share"; the lowest ES share among the nameplates that are passenger products by name (Proace City Verso / Combo Life / Kangoo, 25-36%) sits right above it
  split_countries: [es, fi, gb, lu, nl]  # registers whose car/van kind comes from the M1/N1 line at ROW level: es_dgt EU category bytes [426,4) (es_dgt.rb CATEGORY_TO_KIND), fi_traficom ajoneuvoluokka M1/N1, lu_snca CATEU, nl_rdw voertuigsoort + europese_voertuigcategorie, uk_dft BodyType Cars/LGV. NOT de (FZ 10.1 is an all-M1 table: no van side), nz ("PASSENGER CAR/VAN" is one class), no (attach-only, cannot decide membership), car-only sources (no van side to share against)

car:
  # ── compact MPV-vans: the factory passenger version carries the nameplate ──
  - { make: Volkswagen, lift: '\bCADDY\b', publish: [Caddy] }      # Caddy Life/Style/Maxi Kombi. ES DGT Jul–Sep 2026: M1 1,465 / N1 697 (67.8% M1); M1 RD 2822 code 10 turismo 950, 31 mixto 509, 32 autocaravana 4. FI M1 7,417 / N1 8,912 stock
  - { make: Volkswagen, lift: '\bCADDYMAXI\b', publish: [Caddy] }  # fused UK-DfT genmodel of the same nameplate (drop_patterns.yml note); renames.yml `Caddymaxi: Caddy` folds it, so it publishes nowhere else
  - { make: Citroën, lift: '\bBERLINGO\b', publish: [Berlingo, E-Berlingo] }  # ES M1 1,633 / N1 2,169 (43.0%), M1 = "BERLINGO TALLA M/XL" passenger trims (RD 2822 10: 1,318). UK Cars 61,123 + "Berlingo Multispace" 99% Cars. FI 55% M1. E-Berlingo = the electric passenger Berlingo (van/citroen/e-berlingo exists)
  - { make: Citroën, lift: '\bJUMPY\b', publish: [Jumpy] }        # Jumpy Combi (M1 9-seat). ES M1 150 / N1 1,216 (11.0%) — expected to FAIL the gate; listed so the evidence, not a hand-pick, decides. Its passenger twin publishes as car/citroen/spacetourer already
  - { make: Peugeot, lift: '\bRIFTER\b', publish: [Rifter, E-Rifter] }  # passenger-only nameplate (the Partner's MPV). ES M1 1,366 / N1 1,238 (52.5%); UK Cars 19,018 / LGV 4 (100%); NL Personenauto 99.7%; FI M1 98.8%. Published only as van/peugeot/rifter until now
  - { make: Peugeot, lift: '\bPARTNER\b', publish: [Partner] }    # Partner Tepee (passenger, to 2018). ES M1 212 / N1 1,376 (13.4%); FI M1 718 / N1 1,359 (34.6%); UK Cars 21,680 (10.9%). Gate decides
  - { make: Peugeot, lift: '\bEXPERT\b', publish: [Expert] }      # Expert Combi (M1). ES M1 124 / N1 868 (12.5%) — expected to FAIL; passenger twin is car/peugeot/traveller (exists)
  - { make: Renault, lift: '\bKANGOO\b', publish: [Kangoo] }      # Kangoo (passenger) vs Kangoo Van/Express. ES M1 818 / N1 1,774 (31.6%); M1 RD 2822 31 mixto 599, 10 turismo 219. UK Cars 17.4%, NL Personenauto 32.8% stock
  - { make: Renault, lift: '\bTRAFIC\b', publish: [Trafic] }      # Trafic Combi/SpaceClass (M1). ES M1 325 / N1 1,695 (16.1%) — expected to FAIL the 25% share
  - { make: Renault, lift: '\bEXPRESS\b', publish: [Express] }    # Express (2021-) is van-only in ES (M1 0 / N1 11); listed for completeness of the evidence test — expected to FAIL
  # ── Ford: Tourneo is the passenger brand, Transit the commercial one ──
  - { make: Ford, lift: '\bTOURNEO\b', publish: [Tourneo Courier, Tourneo Custom, Tourneo Connect, Grand Tourneo Connect, Tourneo] }  # Tourneo = Ford's passenger line. ES M1/N1 Jul–Sep 2026: Tourneo Courier 756/0, Tourneo Custom 441/0, Tourneo Connect 191/0 — 100% M1 and ZERO `es` on the van records
  - { make: Ford, lift: '\bCONNECT\b', publish: [Tourneo Connect, Grand Tourneo Connect] }  # "TOURNEO CONNECT" hits \bCONNECT\b as well as \bTOURNEO\b; lifting only TOURNEO would leave the residual CONNECT pattern dropping it. "TRANSIT CONNECT" stays dropped (it still hits \bTRANSIT\b, which is lifted for Transit Custom only)
  - { make: Ford, lift: '\bTRANSIT\b', publish: [Transit Custom] }  # Transit Custom Kombi (factory 9-seat M1). ES M1 625 / N1 1,049 (37.3%); M1 RD 2822 31 mixto 398, 10 turismo 226, 0 autocaravana. ONLY Transit Custom is published: the big Transit (M1 8.8%, 22 autocaravana) and Transit Connect/Courier still resolve outside `publish:` and stay dropped
  # ── mid-size: the M1 version is a factory people-carrier ──
  - { make: Mercedes-Benz, lift: '\bVITO\b', publish: [Vito] }      # Vito Tourer (M1 8/9-seat). ES M1 718 / N1 716 (50.1%), raw "VITO TOURER" 490+66. The V-Class precedent: car/mercedes-benz/v-class already publishes beside van/mercedes-benz/v-class
  - { make: Mercedes-Benz, lift: '\bVIANO\b', publish: [Viano] }    # Viano (2003-2014), the V-Class's predecessor and passenger-only. ES M1 157 / N1 2 (98.7%; used imports/re-registrations)
  - { make: Mercedes-Benz, lift: '\bCITAN\b', publish: [Citan] }    # Citan Tourer (M1). ES M1 191 / N1 266 (41.8%); raw "CITAN TOURER" 133
  - { make: Mercedes-Benz, lift: '\bT[- ]?CLASS\b', publish: [T-Class] }  # T-Class = the passenger Citan (2022-). car/mercedes-benz/t-class ALREADY publishes [ch,fi,lu,nl] via other spellings; this lets the dropped "T-CLASS"/"T CLASS" raws join it. ES writes "CLASE T" (84 M1, 100%), which no drop pattern matches
  - { make: Toyota, lift: '\bPROACE\b', publish: [Proace, Proace City] }  # Proace (City) Verso = the passenger versions; collapse_variant strips " VERSO…", so they resolve to Proace / Proace City. ES M1: Proace 404 / N1 788 (33.9%); Proace City 632 / N1 1,904 (24.9%; raw "PROACE CITY VERSO" 576 M1 is 100% M1). Proace Max (Ducato-class) is deliberately NOT in `publish:`
  - { make: Opel, lift: '\bCOMBO\b', publish: [Combo, Combo Electric] }  # Combo Life (M1). ES M1 462 / N1 837 (35.6%). renames.yml folds `Combo Life: Combo`; Combo Electric is the electric nameplate split off by the ELECTRIC_NAMEPLATES pin
  - { make: Vauxhall, lift: '\bCOMBO\b', publish: [Combo, Combo Electric] }  # UK files the Opel Combo under Vauxhall (uk_dft); same nameplate, same gate
  - { make: Opel, lift: '\bVIVARO\b', publish: [Vivaro, Vivaro Electric] }  # Vivaro Combi (M1). ES M1 182 / N1 460 (28.3%). The passenger twin Zafira Life already publishes as car/opel/zafira-life
  - { make: Vauxhall, lift: '\bVIVARO\b', publish: [Vivaro, Vivaro Electric] }  # UK twin of the Opel entry above
  - { make: Nissan, lift: '\bTOWNSTAR\b', publish: [Townstar] }   # Townstar (5/7-seat Kombi). ES M1 365 / N1 102 (78.2%); DE FZ 4.2 2,862 Pkw in 2025 (de_kba_fz10.yml)
  - { make: Nissan, lift: '\bNV\d', publish: [NV200] }            # NV200 Combi / Evalia (M1). ES M1 46 / N1 19 — below the count floor in ES; gate decides on the other split registers
  - { make: Dacia, lift: '\bLODGY\b', publish: [Lodgy] }          # Lodgy is a passenger-only MPV (2012-2022): NL Personenauto 3,531 / Bedrijfsauto 0 (100%), FI M1 454 / N1 4 (99.1%), ES M1 32 / N1 0. Published in NO kind before this file
  - { make: Dacia, lift: '\bDOKKER\b', publish: [Dokker] }        # Dokker (passenger) vs Dokker Van. NL Personenauto 1,868 / N1 4,121 (31.2% stock); ES M1 29 / N1 4
  - { make: Fiat, lift: '\bDOBLO\b', publish: [Doblo] }           # Doblo (passenger). ES M1 57 / N1 717 (7.4%); UK Cars 12,846 / LGV 35,376 (26.6%). Gate decides
  - { make: Fiat, lift: '\bSCUDO\b', publish: [Scudo] }           # Scudo Combi. ES M1 34; its passenger twin is car/fiat/ulysse (exists). Expected to FAIL
  - { make: Fiat, lift: '\bTALENTO\b', publish: [Talento] }       # Talento Combi (Trafic twin). ES M1 7 / N1 27. Expected to FAIL
