# attach_only_ids.yml — PER-ID ATTACH-ONLY for a MINTING source (pipeline
# Reconciler#attach_row?). Shape: `<source key>: { "<kind>/<make>/<model>": "<reason>" }`.
# A listed id's rows from that source enrich it if it publishes on OTHER
# evidence and can never mint it.
#
# it_aci — coordinator ruling R2 (2026-10-10): "the 76 new ids ship MINTED only
# if a fresh Opus I-11 pass corroborates each id with a cited source; any id
# that fails goes attach-only/DEBT". The pass (independent Opus, 2026-10-10)
# returned 67 PASS / 9 FAIL; these are the 9, each with its reason and the page
# it rests on. The fix each one needs (a fold or a move) touches other
# registers' rows, so it is a DEBT.md row, not a line here.
