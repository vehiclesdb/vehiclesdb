# models/moves.yml — CROSS-MAKE model moves.
#
# Shape:  "<Make>|<Model>": "<TargetMake>|<TargetModel>"
#
# WHY THIS FILE EXISTS. Several national registers put the TYPE-APPROVAL HOLDER
# in the make column rather than the marque, because "make" is derived from a
# manufacturer key printed on the registration document. Germany's KBA assigns
# `Marke` from the HSN (Herstellerschlüsselnummer):
# https://www.kba.de/DE/Statistik/Fahrzeuge/Marken_Hersteller/markenHersteller_node.html
#
# A rename cannot fix this (the correct nameplate lives under a different make)
# and a `null` drop throws away real registration evidence. Before this file
# existed the only options were "publish it under the wrong marque" or "delete
# it", and the second is what PR #1 chose for the German Cupras — ~26,500
# registrations.
#
# RULES (all three cost someone a red test or a bad merge, so they are load-bearing):
#   1. Keys are POST-rename, POST-casing pairs, exactly like rename keys.
#      "Hyundai|GV70", never "Hyundai|Gv70" — a wrong-form key is silently inert.
#   2. A `null` rename in renames.yml BEATS a move, by design (an explicit drop
#      is a stronger statement than a routing rule). Retiring a null and adding
#      the move must therefore happen in the SAME change.
#   3. Only move when the register is unambiguously filing ONE marque's model
#      under another. Do NOT move a row that POOLS two marques' models — see the
#      SEAT Leon/Ateca note below.

# ── Cupra registered under SEAT (KBA HSN 7593 "SEAT (E)") ────────────────────
# Cupra has no HSN of its own, so every Cupra in Germany is filed as a SEAT.
# Verified in KBA FZ 6.1 (HSN/TSN → Handelsname, 1 Jan 2024): HSN 7593 rows read
# 'FORMENTOR', 'BORN', 'CUPRA ATECA,ATECA', 'CUPRA LEON'.
# https://www.kba.de/SharedDocs/Downloads/DE/Statistik/Fahrzeuge/FZ6/fz6_2024.xlsx
# Each target already exists on the Cupra side, so these are pure re-attachments.
"SEAT|Formentor": "Cupra|Formentor"   # Cupra-exclusive since 2020 (first Cupra-only model); 7,658 DE registrations Jan-May 2026
"SEAT|Born": "Cupra|Born"             # Cupra Born, never badged SEAT (https://www.cupraofficial.com/cars/born); 6,785 DE
"SEAT|Tavascan": "Cupra|Tavascan"     # Cupra Tavascan (https://www.cupraofficial.com/cars/tavascan); 6,009 DE
"SEAT|Terramar": "Cupra|Terramar"     # Cupra Terramar (https://www.cupraofficial.com/cars/terramar); 6,016 DE
"SEAT|Raval": "Cupra|Raval"           # CUPRA Raval, premiered 2026-04-09, built at Martorell (https://www.cupraofficial.com/cars/raval); 44 DE
# NOT moved, deliberately: KBA's `SEAT/LEON` and `SEAT/ATECA` rows POOL the SEAT
# and Cupra versions of one nameplate (FZ 6.1 shows 'CUPRA LEON' and
# 'CUPRA ATECA,ATECA' under the same HSN). Moving them would hand SEAT's own
# volume to Cupra; splitting is impossible from an aggregate row. They stay with
# SEAT, which is where the majority of the volume belongs.

# ── Genesis registered under Hyundai (KBA HSN 8252 "HYUNDAI MOTOR (ROK)") ────
# Genesis is a separate marque with its own German retail network
# (https://www.genesis.com/de/de.html) but has no HSN, so KBA files it under
# Hyundai. FZ 6.1 HSN 8252 rows read 'GV60, GENESIS GV60', 'GV70, GENESIS GV70',
# 'G80, GENESIS G80,GENESIS', 'G90,GENESIS G90'. FZ 10.1 has no GENESIS make row.
# All four targets already exist under the genesis make.
"Hyundai|GV60": "Genesis|GV60"        # Genesis GV60 EV; 206 DE registrations Jan-May 2026
"Hyundai|GV70": "Genesis|GV70"        # covers the ICE GV70; the EV is catalogued as "Electrified GV70"; 132 DE
"Hyundai|G80": "Genesis|G80"          # 5 DE
"Hyundai|G90": "Genesis|G90"          # 1 DE — not in the official German lineup (EV-only there), so almost certainly an import; the marque is Genesis either way

# ── Cupra models written with the marque IN the model string ─────────────────
# NL/NZ registries emit "SEAT" + "CUPRA LEON"/"CUPRA ATECA". Unlike KBA's bare
# `LEON`/`ATECA` rows (which POOL the SEAT and Cupra versions and therefore stay
# with SEAT), these strings name the marque explicitly, so they can be routed
# without ambiguity. PR #1 dropped them for want of this mechanism; the moves
# recover that evidence.

# NOT MOVABLE, and worth knowing why: NL/NZ emit "SEAT" + "CUPRA LEON", but the
# make-prefix strip removes the embedded brand BEFORE moves run, so the row
# arrives as "Leon" — indistinguishable from a genuine SEAT Leon. A move keyed
# "SEAT|Cupra Leon" is unreachable (proved by test_override_key_reachability),
# and moving a bare "SEAT|Leon" would hand SEAT`s own volume to Cupra. Recovering
# these needs the prefix strip to preserve what it stripped, which is a
# normalizer change, not a curation one. Filed rather than guessed.
# ── historic corporate entity in the make column ─────────────────────────────
# Auto Union was the pre-1985 corporate name of the group that became Audi AG;
# registers that kept the entity name emit it as the make while the model string
# names the actual marque. https://en.wikipedia.org/wiki/Auto_Union
"Auto Union|80": "Audi|80"          # the Audi 80 is an Audi, not an "Auto Union Audi 80". NB keyed on the PRODUCED form: the embedded-brand strip turns "Audi 80" into "80" before moves run (test_override_key_reachability caught the naive key)

# ══ TWO-WHEELER MOVES (S2W-authored; staged in MOVES-S2W-staging.yml because
# moves.yml did not exist on main yet, then folded in here) ══
# ─── WHY THESE EXIST ─────────────────────────────────────────────────────────
# RDW files Vespas under `merk=PIAGGIO` because **Piaggio is the type-approval
# holder** and the register's make column is approval-derived — the same
# mechanism the 4W session documented for KBA's HSN (Cupra under SEAT, Genesis
# under Hyundai). Measured 2026-07-25 over
# https://opendata.rdw.nl/resource/m9d7-ebf2.json (CC0):
#
#   merk=PIAGGIO carrying a Vespa badge: 130 distinct names, 79,569 registrations
#     "VESPA SPRINT" 39,644 · "VESPA PRIMAVERA" 17,792 · "VESPA SPRINT 50" 13,596
#     "VESPA GTS" 3,537 · "VESPA PRIMAVERA 50" 3,482
#
# 46 of those reached publication as `piaggio/vespa-*` records — the wrong make
# AND an embedded brand — while the correct `vespa` make already holds 88 records
# with the same nameplates. `strip_make_prefix` cannot catch it: it strips the
# MAKE (PIAGGIO), and the embedded brand here is VESPA.
#
# A rename cannot cross makes and a null would delete 79,569 registrations' worth
# of real evidence — exactly the trap PR #1 fell into with the Cupras. Hence
# moves.
#
# ─── AUTHORING NOTES ─────────────────────────────────────────────────────────
# * Keys are POST-rename, POST-casing pairs. Verified against a real build, not
#   assumed — `pipeline/tests/test_override_key_reachability.rb` re-asserts it.
# * 16 targets already exist under `vespa` and the move UNIONS the evidence;
#   30 create the nameplate under its real marque, which is where it belongs.
# * Target casing is left EXACTLY as the existing `vespa` records have it
#   ("Gts", "Gtv"), so a move never silently changes a second thing. Fixing
#   "Gts" -> "GTS" is a styling change and belongs in its own PR with a
#   blast-radius sweep.
# * Each moved id needs a former_ids entry — run
#   `ruby scripts/propose_former_ids.rb <old> <new>` after the rebuild; the
#   generator now reads moves.yml as intent, so it will propose all 46.
#
# ─── NOT MOVED, deliberately ─────────────────────────────────────────────────
# * `motorcycle/piaggio/vespa` — the bare brand-as-model row (fi|gb|lu|nl|nz|ua).
#   There is no single Vespa model to move it to, so it is unresolvable exactly
#   like PR #1's `SEAT: Cupra: null`. It needs a null drop with that precedent
#   cited, NOT a move; left out here so the decision is visible rather than
#   buried in a 46-line block.
# * KTM/Husqvarna — the raws exist (`"HUSQVARNA FE 350"` n=3, `"HUSQVARNA TE 300"`
#   n=8 under merk=KTM) but neither reached publication, so there is nothing to
#   move today. Re-check after any threshold change.
"Piaggio|Vespa 50": "Vespa|50"                                                # moped, merges into existing vespa nameplate [nl|nz]
