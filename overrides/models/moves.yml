"Jaguar|Defender": "Land Rover|Defender"                      # 3 vehicles (es, nl), van kind. Target van/land-rover/defender carries es,fi,gb,lu,nl / 126,728 vehicles (https://en.wikipedia.org/wiki/Land_Rover_Defender)
