IVA:
  # IVA MOBILITY CONVENTION (§11.2), from the manufacturer's own store
  # (https://www.ivamobility.com/en/collections/scooters):
  #   * the series prefix is "E-GO" — hyphen, caps — then the model:
  #     E-GO S3 / S4 / S4 2.0 / S5 / S8
  #   * the NC line is NCS / NCE / NCE Pro / NCE S / NCF / NCF Delivery
  #   * plus "IVA Lux Electric 2.0"
  # smart_case renders "E-GO" as "E-Go", so the caps need pinning per model.
  #
  # HEADS UP for whoever works this make next: MOST of its records are
  # DISCONTINUED or OEM-code models (RA9015, RA9011, VENTI 50, RIO 50, IBIZA,
  # VENICE, LX02, LHU, DAGUIWANG, ZN50QT-E, TY50QT-G…) and IVA publishes
  # nothing about them. For those THE REGISTER IS THE ONLY EVIDENCE, and that
  # is the honest ceiling — do not mint a canonical from a retailer listing.
  E-Go S2: E-GO S2                     # manufacturer styles the series "E-GO"
  # The NC line, all-caps per the manufacturer store. FORWARD-LOOKING: every NC
