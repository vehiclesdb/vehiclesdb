# former_ids.yml — MIGRATION ALIASES for corrected model ids.
#
# Shape:  "<kind>/<make>/<old-model-slug>": "<kind>/<make>/<new-model-slug>"
#
# WHY THIS FILE EXISTS
# SCHEMA.md §Versioning: "Removing or renaming a published `id` ... is the only
# thing that counts as breaking — it requires a major schema bump plus a
# migration alias". AGENTS.md: "Ids are append-only." When a bug FABRICATED an
# id, correcting it is right but consumers pinned to the old id (the gem,
# jsDelivr, HuggingFace) would 404 silently. Each line here is that migration
# alias: the pipeline emits it as `former_ids` on the successor record, so an
# old id stays resolvable forever.
#
# HARD RULES (asserted by validate.rb's gate and lint_dataset.rb)
#   1. An old id may appear here ONLY if it no longer exists in the build. Never
#      map an id that still lives: `car/audi/89` SURVIVES (the Netherlands
#      genuinely registers the B3 Audi 80 as "89") and merely lost bogus German
#      evidence to `car/audi/a3` — claiming it as a former id of the A3 would
#      tell every consumer that a live id is an alias of a different car.
#   2. APPEND-ONLY and ACCUMULATING. A record corrected twice keeps both old
#      ids, or the migration path decays after one release.
#   3. Same kind, same make — with ONE named exception, added 2026-07-25.
#
#      The rule's purpose is to stop a MODEL that was filed under the wrong
#      marque being papered over with an alias instead of relocated: that is a
#      `moves.yml` concern, and the two makes both stay alive.
#
#      A MAKE MERGE is the opposite situation and `moves.yml` cannot express it.
#      When two make ids turn out to be one marque (`zero` + `zero-motorcycles`,
#      `emax` + `e-max`), the losing make ceases to exist entirely and every id
#      under it changes slug. Consumers pinned to `motorcycle/zero/sr-f` 404
#      unless something aliases it, and moves.yml relocates nameplates BETWEEN
#      TWO LIVE MAKES — there is no live source make left to move from.
#
#      So a cross-make entry is permitted IF AND ONLY IF the old make no longer
#      appears in the build at all. That condition is what makes the alias
#      unambiguous: with `zero` gone, `motorcycle/zero/sr-f` can mean exactly
#      one thing. If the old make still exists, this is a moves.yml problem and
#      an alias here would be a lie about a live id (rule 1's failure mode).
#      Verify the make is gone against a build, not against intent.
#   4. Successor must carry a SUPERSET of the old id's country evidence — if
#      evidence went missing, that is a different bug and must not be papered
#      over with an alias.
#
# HOW TO REGENERATE (never hand-write in bulk)
#   ruby scripts/propose_former_ids.rb <old dist/vehicles.csv> <new dist/vehicles.csv>
# It proposes only mechanical pairs (slug identical modulo non-alphanumerics)
# and reports everything else as NEEDS-REVIEW for explicit authoring.
#
# NOT IN HERE, DELIBERATELY: genuine REMOVALS. 97 ids disappeared in the
# 2026-07-25 build with no successor — the Bürstner / Pössl / Niesmann+Bischoff
# motorhome floorplan codes that were only ever published because the drop
# matcher could not see through German transliteration (ö→oe, ü→ue). Those are
# deletions of records that should never have existed in the car kind, they have
# no successor to alias to, and they are recorded in CHANGELOG.md instead.
#
# ---------------------------------------------------------------------------
# RELEASE 2026-07-25 — two-wheeler nameplate spacing correction (1,050 ids).
# Cause: normalizer.rb collapsed every letter/digit boundary and used that
# collapsed key as the DISPLAY name, so 821 of 967 word-glued two-wheeler names
# were strings that appear in no source ("AN 400 BURGMAN" -> "AN400BURGMAN").
# Verified per-record against RDW handelsbenaming raws (CC0) on 2026-07-25.
# Comment on each line is: old display -> new display [country evidence].
# ---------------------------------------------------------------------------
