# zx-12r · SIGNED OFF, and the reason took THREE attempts to get right. Read
# this before touching it, because two of my three stories were wrong.
#
#  (1) "gone from every source"  — FALSE. `grep -rlF cache/` cannot read
#      inside a zip and fi_traficom_register.zip is one: it holds
#      e1-92/61-00065/02 on 7 rows, "Kawasaki;ZX-12R-ZXT20A/1199", 2005-2007.
#  (2) "a fold defect, evidence not carried" — ALSO WRONG. `ninja-zx-12r` is
#      live WITH fi, so Finnish rows do reach it; these particular ones do not.
#  (3) What is actually true: those 7 rows carry the model string
#      "ZX-12R-ZXT20A/1199", which classify() resolves to
#      kawasaki/zx-12r-zxt20a-1199 — an id that DOES NOT PUBLISH (sub-threshold,
#      confirmed absent from build/out). Finland`s OTHER ZX-12R rows spell it
#      "ZX-12R", resolve to Ninja ZX-12R, and carry different approvals.
#
# So the approval is IN THE CORPUS and NOT IN THE CATALOG, and no fold decision
# can change that: it is stranded on a row whose id is below threshold. The
# gate`s "leaves the CATALOG entirely" is correct — verified by scanning every
# live record`s tan set, which returns nothing.
#
# ⚠ This is a DIFFERENT CAUSE from z800abs and zx-6r above, which are genuine
# rolling-window expiries (zero hits anywhere, compressed or not). Same
# remedy, different cause, and the distinction matters: an expiry is permanent,
# whereas THIS returns by itself the day zx-12r-zxt20a-1199 clears threshold or
# a rename folds that string onto the nameplate. Filed in DEBT as the better
# fix — fold the code-with-displacement string, do not accept the loss forever.
"motorcycle/kawasaki/zx-12r":
  to: "motorcycle/kawasaki/ninja-zx-12r"
  accepted_xref_loss: ["e1-92/61-00065/02"]  # stranded on a sub-threshold id, NOT expired — see the three-attempt note above
