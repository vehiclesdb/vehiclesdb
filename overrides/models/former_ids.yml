# ── XREF-LOSS SIGN-OFF, 2026-08-18 · the FIRST use of `accepted_xref_loss:` ──
# Main's weekly build has been red since 2026-08-10 and three of its eleven
# gate failures are these aliases. Read the measurement before adding a fourth
# entry here, because the bar this sets is "the evidence left upstream", not
# "the fold was inconvenient to re-cut".
#
# WHAT THE GATE SAW. Each retired id published `tan` values in release
# 2026.08.x that its successor does not publish now, and the gate reports them
# as leaving the catalog entirely. That is true, and it is not the fold.
#
# WHAT ACTUALLY HAPPENED, measured four ways:
#   1. All four approvals are LU-ONLY — `grep -rlF` over the whole cache tree
#      returns lu_snca files and nothing else. No fi, nl, es, gb or ua row
#      carries any of them.
#   2. Within LU they appear in exactly ONE monthly delta, April 2026
#      (lu_delta_202604.xml / lu_delta_2026-05.xml, the two naming schemes for
#      the same month). The May, June and July deltas carry zero of the four.
#   3. lu_snca serves a ROLLING THREE-MONTH WINDOW. The release that published
#      these ids ran on `lu 2026-04…2026-06`; today's build derives
#      `lu 2026-05…2026-07`. April has rolled out of the window, so the rows
#      that carried these approvals are gone from the source.
#   4. The freshly fetched lu_delta_202607.xml (39 MB, fetched 2026-08-18)
#      carries none of them either.
#
# WHY RE-CUTTING THE FOLD CANNOT HELP, which is the gate's other option: an
# unfolded `z800abs` would be rebuilt from the SAME current rows, and those
# rows no longer exist. It would publish on fi+nl without these approvals and
# the catalog would lose them identically. The gate's own diagnosis proves the
# counterfactual: it computed "leave the CATALOG entirely" over this build, so
# no live record carries them under any id. The fold is where the loss is
# NOTICED, not where it is caused.
#
# ⚠ THE STRUCTURAL QUESTION THIS RAISES IS FILED IN DEBT, and it matters more
# than these three lines: a rolling-window source means EVERY future fold of an
# LU-sourced id will need a sign-off like this, for approvals that were real
# when we published them. Type approvals are the cross-source join key
# (PRD-3 D7) — arguably they should ACCUMULATE across releases the way
# archive/registrations accumulates snapshots, instead of being recomputed from
# whatever window the source happens to serve today. Until that is ruled on,
# sign-offs like these are the honest record; they are not a pattern to spread
# without reading the four measurements above for the case at hand.
"motorcycle/kawasaki/z800abs":
  to: "motorcycle/kawasaki/z800"
  accepted_xref_loss: ["RTI*2002/24*2909*02"]  # A-1 · ABS fold. 1 of 4 tan. LU-April only.
