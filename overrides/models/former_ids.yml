# --- 2026-07-25, S2W: two MAKE merges (see rule 3's named exception above) ----
# `zero` -> `zero-motorcycles`: UK/NZ/UA register the marque as bare "ZERO",
# NL/ES/FI/LU as "ZERO MOTORCYCLES". Merged toward the longer form because the
# manufacturer's own pages carry no "Zero <model>" product string — body copy is
# the bare model code and the brand appears only as "Zero Motorcycles" /
# "Zero Motorcycles, Inc." (https://zeromotorcycles.com/model/zero-dsrx, 2026).
# Every successor below GAINED evidence (verified per id against a build diff,
# gains noted); nothing lost a country, so rule 4 holds with room to spare.
"motorcycle/zero/ds": "motorcycle/zero-motorcycles/ds"        # gb,nz -> +nl
"motorcycle/zero/dsr": "motorcycle/zero-motorcycles/dsr"      # gb,nz -> +nl
"motorcycle/zero/fx": "motorcycle/zero-motorcycles/fx"        # gb,nz -> +es,nl (merged into a pre-existing id)
"motorcycle/zero/s": "motorcycle/zero-motorcycles/s"          # gb,nz,ua -> +nl
"motorcycle/zero/sr": "motorcycle/zero-motorcycles/sr"        # fi,gb,nz,ua -> +nl
"motorcycle/zero/sr-f": "motorcycle/zero-motorcycles/sr-f"    # gb,nz -> +nl
"motorcycle/zero/sr-s": "motorcycle/zero-motorcycles/sr-s"    # gb,ua -> +nl
# Same merge, but these two are MODEL-level: RDW writes merk "ZERO MOTORCYCLES"
# (plural) with handelsbenaming "ZERO MOTORCYCLE XB" (singular), so the exact
# prefix strip missed and the first-token fallback left "Motorcycle" in the
# nameplate. Fixed by renames.yml; the old fabricated ids still need aliases.
"moped/zero-motorcycles/motorcycle-xb": "moped/zero-motorcycles/xb"              # es,fi,nl unchanged
"motorcycle/zero-motorcycles/motorcycle-xe": "motorcycle/zero-motorcycles/xe"    # es,nl -> +fi,gb
# `emax` -> `e-max`: RDW carries both merk spellings for one marque in the same
# file; the brand writes itself hyphenated ("e-max", manufacturer manual and
# Vmoto's own copy). Rekeying the make also required rekeying its renames block
# from `Emax:` to `E-Max:` — see the note there.
"moped/emax/110s": "moped/e-max/110s"    # fi,nl unchanged
"moped/emax/90s": "moped/e-max/90s"      # fi,nl unchanged (merged into a pre-existing id)
