# D-1 (2026-08-01) BMW M split: the M cars are nameplates, so normalizer.rb#bmw
# emits M2/M3/M4/M5/M6/M8 and de-spaces a leading "M <one digit>". car/bmw/m-3
# and car/bmw/m-5 existed ONLY because the old /^M(\d)\b/ could not match a
# spaced or hyphenated badge — they are the same record under a broken spelling,
# not distinct products. Availability subset verified against the branch build
# (NAMING §2, mandatory before retirement): no country loses evidence.
"car/bmw/m-3":         "car/bmw/m3"         # fi,nl ⊂ m3 (ar,ca,es,fi,gb,lu,nl,nz,th,ua,us)
"car/bmw/m-5":         "car/bmw/m5"         # es,fi,nl ⊂ m5 (ar,ca,es,fi,gb,ie,lu,nl,nz,ua,us)
