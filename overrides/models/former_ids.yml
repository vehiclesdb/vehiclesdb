# 2026-08-01 — wave-7 MARQUE CLEAN pass: Saab + Porsche + Bentley (138 ids).
#
# Three folds with three different pieces of evidence, all of them the marque's
# own:
#
#   SAAB (64).  data#141 minted car/saab/9-3 and car/saab/9-5 hours before this
#     pass: junk? had been deleting both on every build since the catalog
#     existed, because a bare "9-3" has no letters and the hyphen disqualifies
#     it from the "2-4 digits" escape. The 26 "9-3 <trim>" / "9-5 <trim>"
#     records that published all along off the SAME registers are therefore not
#     siblings of the nameplates — they ARE the nameplates, wearing a trim word
#     that smuggled a letter past the heuristic. Saab's own trim ladder
#     (Linear / Vector / Arc / Aero) is the evidence:
#     https://en.wikipedia.org/wiki/Saab_9-3 . The 900/9000/9x families follow
#     the same rule: body letters (CS/CD/CSE/CDE), equipment levels (S/SE/GL)
#     and engine badges (V4/T16/Turbo/i) are not models.
#
#   PORSCHE (41).  GENERATION CODES ARE NOT NAMEPLATES. Porsche's own press kit
#     enumerates "Third/Fourth/Fifth/Sixth/Seventh/Eighth generation Porsche 911
#     (964)/(993)/(996)/(997)/(991)/(992)" —
#     https://newsroom.porsche.com/en/press-kits/60-Years-Porsche-911.html —
#     and 964 is "known internally as the type 964". 986/987 are the Boxster's
#     type numbers and 356 A/B/C are four series of one "model line 356"
#     (Porsche's own phrase). The same axis as Skoda's Octavia A5/A7.
#
#   BENTLEY (33).  Bentley's range page lists the products and the Continental
#     GT page groups the rest under "The Continental GT Range ... available in
#     a choice of five stunning models" —
#     https://www.bentleymotors.com/en/models/continental-gt.html . Bentley's
#     own press wording names the boundary: "a benchmark model identified by
#     its NAMEPLATE, an Azure variant ..., and a Speed model ...".
#
# Measured on a real build against pipeline origin/main (validate: ALL GATES
# GREEN): 0 (country,source) pairs lost on any of the 138; 9 country GAINS on
# 9 survivors; cross_kind_prune! output byte-identical to the control build in
# all six kinds; 0 ids removed under any other make, in any kind.
#
# HELD, deliberately, and stated in the PR body: the 9-4X/9-7X marque spelling
# (closing it mints van/saab/9-7x for a full-size SUV at grand=31, BELOW
# cross_kind_prune!'s grand>=100 floor, so the safety net cannot clean it up)
# and the Bentley Mark VI cluster (DEBT's filed U7 Roman-numeral class).
# ---------------------------------------------------------------------------

