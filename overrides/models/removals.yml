# ── THE ie_cso RANK CORRECTION (pipeline#89, 2026-07-27) — one id, and the whole story is in its evidence. CSO's TEM20 cube ships two statistics per row, the count (TEM20C01) and the model's RANK (TEM20C02), both in the same VALUE column; the adapter summed both from the day it landed. Ireland's ingested figures were +176.9% (234,362 real cars vs 648,954 published over the window) and every model gained ~3,000 of rank. Found by the EV report's own-pipeline audit (pipeline aux/marketing/report-01-ev-europe.md §6.2), fixed by pinning the statistic.
"car/kia/ev": "DEMOTED to the candidate queue by the ie_cso rank correction (pipeline#89): its ONLY evidence was the CSO TEM20 label \"KIA EV\", published at ie:1,590 — which was 56 real cars plus 1,534 RANK ORDINALS the adapter was summing as if they were vehicles (measured on cache/ie_tem20.csv over the 23 months present, 2024-07..2026-05). The real 56 is far below the car publication threshold (1,000) and below the single-source hysteresis floor (1,000/3 = 333), so it falls out — which is the correction working, not churn. It is a REAL record (Ireland genuinely licensed 56 cars under that label; CSO also carries Kia EV 3/4/5/6/9 as separate labels, so this short form is not a rename of any of them and no alias target would be honest). Sits in build/candidates/car.jsonl at ie:56 and returns AUTOMATICALLY with corroboration — do NOT hand-restore. NB no other published id vanished on this fix: the other 236 Irish (make,model) rows all kept enough real evidence."

