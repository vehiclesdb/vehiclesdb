"car/mg/coupe": "body class, not a nameplate (nl+nz, 6 registrations). NAMING §7.6."
"car/mg/convertible": "body class, not a nameplate (nl+nz, 5 registrations). NAMING §7.6."
"car/mg/mk": "U7 ROMAN-NUMERAL TRUNCATION ARTIFACT (nl+nz, 5 registrations). The raws are 'MK II', 'MK III', 'MK II 1.6 A': normalizer.rb VARIANT_SUFFIXES[5] (/ (II|III|IV|VI{0,3})\\b.*/) strips the spaced Roman numeral BEFORE the rename lookup, so no nameplate token remains and no rename key can ever see the numeral. Curation cannot fix it — DEBT.md 'U7 variant-strip Roman collapse'. If U7 is repaired these rows resolve themselves onto real MG nameplates."
"car/mg/rover": "company name in the model column, not a model (fi+nl, 4 registrations): 'MG ROVER' is the MG Rover Group 2000-2005 — https://en.wikipedia.org/wiki/MG_Rover_Group . No nameplate is asserted, so no alias target is honest."
"car/mg/mg1": "INTERIM, and a NORMALIZER defect rather than a curation verdict (nl+nz, 8 registrations). normalizer.rb#mg's second branch `return \"MG#{$1}\" if m =~ /\\A(\\d)\\b/` matches at a decimal point, so 'MGF 1.8i' (nl 2), 'MG Metro 1.3 GS' (nz 2) and three litre-only strings all become a fabricated 'MG1'. MG has never built an MG1. Reported as a pipeline finding; this entry is superseded the moment that branch is scoped, and the destroyed rows then land on MGF/Metro."
"car/mg/mg2": "INTERIM, same normalizer defect (fi+nl+nz, 9 registrations): '2.0'/'2.0I'/'2.0 SL'/'2.0 TURBO' (nz 6), a 2-door cabriolet body code '2 D CABRIOLET-GHN3/2310' (fi — GHN3 is the MGB body code) and two RDW '2 AXLE- RIGID BODY' strings all become a fabricated 'MG2'. MG has never built an MG2. Reported as a pipeline finding, not patched here."
"car/austin/saloon": "body class, not a nameplate (nl+nz, 16 registrations). NAMING §7.6."
"car/austin/sedan": "body class, not a nameplate: nz_nzta writes 'SEDAN' 9 times (nl+nz, 10 registrations). NAMING §7.6."
"car/austin/sports": "body class, not a nameplate (nl+nz, 13 registrations). NAMING §7.6."
"car/austin/tourer": "body class, not a nameplate (nl 'TOURER' 2, nz 'TOURER' 22 and 'TOURER 7HP' 1 — nl+nz, 25 registrations). NAMING §7.6."
"car/austin/roadster": "body class, not a nameplate (nl+nz, 5 registrations). NAMING §7.6."
"car/austin/pick-up": "body class, not a nameplate (nl+nz, 5 registrations). The key also fires in the van kind on nl_rdw 'PICK UP' (n=1, sub-threshold, so it publishes nothing there). NAMING §7.6."
"car/austin/morris": "the SIBLING MARQUE's name in the model column with no nameplate attached (nl 1, nz 1). Austin and Morris were both BMC marques and the registrar wrote the wrong one; nothing here says WHICH Morris, so no alias target is honest."
"car/austin/rover": "company name in the model column, not a model (fi+nz+ua, 3 registrations): 'AUSTIN ROVER' is the Austin Rover Group 1982-1988 — https://en.wikipedia.org/wiki/Austin_Rover_Group ."
"car/austin/mk": "U7 ROMAN-NUMERAL TRUNCATION ARTIFACT **with mixed content** (nl+nz, 17 registrations). Same VARIANT_SUFFIXES[5] strip as car/mg/mk, but here the swallowed raws span two marques and two cars: 'MK III 3000' and 'MK II HEALEY 3000' are Austin-Healeys, 'MK III 1300' is an Austin 1300 Mk III, 'MK III 3 LITER' is an Austin 3-Litre. No single honest survivor exists, which is why this one is nulled where the Austin-Healey block's own `Mk` key could be folded. DEBT.md 'U7 variant-strip Roman collapse'."
# ── wave-5 dossier: MITSUBISHI + MAZDA. Two strings that are not nameplates at
# any altitude and have no honest fold target. Never a silent drop: each carries
# its MEASURED population from the corpus replay (recording-proxy replay of
# VDB::Normalizer#classify over origin/main, 2026-08-01), so a reviewer can see
# exactly what is being retired and reverse it with one line.
#
# A THIRD candidate — car/mazda/xedos (fi+gb, 259 vehicles) — was proposed by
# the dossier on the NAMING §7.6 BMW letter-label precedent and is DELIBERATELY
# NOT TAKEN here. 259 registrations is not small, 252 of them are a single
# uk_dft genmodel (`MAZDA XEDOS`) that is the DfT truncating SOMETHING, and a
# null that deletes real registrations with no honest target is not
# organize-never-delete (the same reasoning that spared Ford's bare body-style
# records and MG's `roadster`). The id stays LIVE and the argument is filed in
# the PR body for a future reviewed pass; what would close it is a DfT VEH0120
# re-parse at the finer Model granularity, and if it lands the correct action is
# a FOLD, not a resurrection.
"car/mitsubishi/cto": "three-letter registry stub with no resolvable nameplate; RDW's one row (https://opendata.rdw.nl/resource/m9d7-ebf2.json?merk=MITSUBISHI&handelsbenaming=CTO, 2026-08-01) is a 1,997 cc sedan of 1,545 kg first registered 2004 — a spec shared by the Lancer, Galant and Space Wagon of that year, so no alias target is honest. Measured population 2 registrations across [nl, nz] (nl_rdw, nz_nzta) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."
"car/mazda/coupe": "bare body word, not a nameplate at any altitude; RDW's one row (https://opendata.rdw.nl/resource/m9d7-ebf2.json?merk=MAZDA&handelsbenaming=COUPE, 2026-08-01) is a 1,300 cc coupe first registered 1992 — a 323 coupe — and the NZ half of the record carries no further token, so no single alias target is honest. Measured population 240 registrations across [nl, nz] (nl_rdw, nz_nzta) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."

# ── wave-5 ITALIAN pass (FERRARI · ALFA ROMEO · MASERATI), 2026-08-01.
# FIVE PUBLISHED RECORDS with NO honest successor. Every other id this pass
# retires has one and is aliased in former_ids.yml; these five are factory type
# codes, the make word left in the model column, or a GEARBOX — none of them a
# nameplate at any altitude, so an alias would tell a consumer that a live
# nameplate used to be called this, which is false.
#
# The 115 further type-code ids this pass drops (Ferrari F1xx/F1xx-xx tipo
# numbers, Alfa Tipo 105/115/116/119 platform numbers, Maserati AM1xx/M138 and
# the nl_rdw 33xB2xx Biturbo variant codes) are CANDIDATES, never published, so
# they need no ledger line here; their measured populations are on their null
# lines in renames.yml. Full inventory: 120 ids, 293 vehicles, nl/fi/nz/us.
#
# NOT RESOLVED BY RESEMBLANCE, and that is the point. Each tipo code maps to
# exactly one nameplate IN PRINCIPLE and mapping them would recover ~215
# vehicles onto real records — but Ferrari Classiche's tipo register serves an
# empty body to every fetch and maserati.com/…/heritage returns HTTP 403, so
# there is no source. NAMING §7.5: "a code mapped by resemblance is a
# fabrication with a comment attached". The populations are recorded so a
# future pass holding a real tipo table can restore them.
"car/ferrari/f131": "Ferrari factory TIPO number that shipped as a nameplate, not a model designation a buyer ever saw. F131 is an internal type code in the same family as the F133/F129/F119/F110/F116 codes nl_rdw writes into the model column; it maps to exactly one car in principle, but Ferrari Classiche's tipo register is the authority and every ferrari.com URL returned an empty body on 2026-08-01 (/en-EN/auto/past-models, /corporate, /museums), so resolving it would be resemblance, not evidence (NAMING §7.5). No alias target is honest. Measured population 3 registrations across [fi, nl] (fi_traficom, nl_rdw) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."
"car/alfa-romeo/romeo": "the MAKE WORD left in the model column, not a nameplate. Raw rows are literally 'ROMEO' and 'ALFA ROMEO' under make ALFA ROMEO; strip_make_prefix removes only the first token when the raw make is the fragment 'ALFA', leaving 'Romeo' behind. There is no Alfa Romeo model called Romeo, and the rows span every era, so no alias target is honest — the committed 'Romeo Gtv: GTV' line already rescues the one subset that carries a nameplate. Measured population 21 registrations across [nl, nz] (nl_rdw, nz_nzta) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."
"car/alfa-romeo/alfa": "the MAKE WORD left in the model column, same mechanism as car/alfa-romeo/romeo above. No Alfa Romeo model is called 'Alfa'. Measured population 2 registrations across [nl, nz] (nl_rdw, nz_nzta) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."
"car/alfa-romeo/giulietta-spider-10103": "a real nameplate with the factory TIPO number concatenated onto it — 10103 is the Tipo designation of the 750/101-series Giulietta Spider, not part of any badge. NOTHING IS LOST: the nameplate half is already the live published record car/alfa-romeo/giulietta-spider, so the evidence has a home; only the tipo-suffixed duplicate id goes. Not aliased, because the concatenation was never a designation a consumer could have been shown. Measured population 3 registrations across [fi, nl] (fi_traficom, nl_rdw) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."
"car/maserati/cambio-corsa": "a GEARBOX published as a model. 'Cambiocorsa' is Maserati's electrohydraulic paddle-shift transmission, offered on the M138 Coupé and Spyder beside the manual 'GT' trim; these rows carry the transmission and no model at all. Two routes were tried and both failed: the sibling row 'CAMBIOCORSA SPYDER' names its car and IS folded to Spyder in renames.yml, but the bare rows carry no body or model token, and RDW's open handelsbenaming aggregate has no approval number on them to join against. Folding them to Coupe or Spyder would be a coin flip on 5 vehicles. Measured population 5 registrations across [nl, nz] (nl_rdw, nz_nzta) in the wave-5 corpus replay (origin/main classify, 2026-08-01)."

# ── wave-6 Kia + Škoda CLEAN (2026-08-01) — the make written into the model column.
"car/skoda/skoda": "the MAKE written into the model column. Measured population on pipeline origin/main (e68e790) over the full corpus, 2026-08-01: 2 vehicles / 2 rows / 2 countries — es_dgt \"SKODA\" (es, 1) and nl_rdw \"SKODA\" (nl, 1). Dropped rather than renamed because NO honest target exists: the row identifies a manufacturer and nothing else, and Škoda has 30 live nameplates the vehicle could be. Same adjudication as the settled \"Landrover: null\" line. It is NOT a former_ids alias — a drop is a different decision from a merge (#111 posture), and if a register ever supplies a model token these rows come back on their own."

# ── wave-8 Pontiac + Aston Martin + BYD CLEAN (2026-08-01) — the make written into the model column.
"car/aston-martin/martin": "the MAKE written into the model column, not a nameplate. Aston's own make-prefix strip cannot catch it: normalizer.rb strips against the raw make, the canonical make and the raw make's FIRST TOKEN — \"ASTON\" — which does not match a model column containing only \"MARTIN\" (NAMING §8.2's stated failure mode, the \"TRRS One\" under make \"TRS\" case). Measured population on pipeline origin/main (2d2f160) over the full 378,275-row corpus, 2026-08-01: 4 vehicles / 2 rows / 2 countries — nl_rdw \"ASTON MARTIN\"/\"MARTIN\" (nl) and nz_nzta \"MARTIN\" (nz). Corroboration does not clear this class: two registers share the same prefix-strip failure when the badge is two words. Dropped rather than renamed because no honest target exists — the row names a manufacturer and Aston has 27 live nameplates the car could be. The four SIBLING strings that DO name a car are rescued rather than dropped, in the same change: \"Martin Vantage\" -> Vantage, \"Martin Dbs\" -> Dbs, \"MARTINDB11\" -> DB11, and \"Aston-Martin 1\" -> null (1 nl vehicle, raw \"ASTON-MARTIN 1,5 LITRE\", never published as an id). It is NOT a former_ids alias — a drop is a different decision from a merge — and if a register ever supplies a model token these rows come back on their own."

# ── 2026.08.1 HYSTERESIS SECOND PASS (S2W half), 2026-08-01 ──────────────────
# 72 gate failures appeared on main the moment 2026.08.1 published. NONE were
# caused by the changes merged that night: a control build of the pipeline at
# 2fb22d0 — BEFORE pipeline#115 and #116 — produces 85 failures and 72 vanishing
# ids against the SAME released catalog, versus 72 and 71 on current main. The
# set vanishing only on current main is EMPTY.
#
# They are the documented hysteresis lag: reconciler `publishable?` branches on
# `prev[key]`, the source count the id was LAST PUBLISHED with, so an id that
# loses evidence publishes once more on the old grace and only the NEXT release
# demands the full threshold. The standing rule is to run the disposition pass
# TWICE — once at merge, once after the release that consumes it. This is the
# second pass, and it had not been run.
#
# Owner-ruled split (NEGOTIATION, answer to Turn 233): S2W authors its makes,
# S4W theirs. NOT in this batch, deliberately: the 16 yamaha stubs ride the
# yamaha §A fold apply so the manifests can cite ids the same change creates,
# and peugeot/elyseo is S4W-owned.
#
# TWO reasons appear below and they are different events. "series stub retired"
# means the evidence redistributed onto real designations that are LIVE NOW,
# and each line names them with vehicle counts. "DEMOTED" means no live
# successor exists at all — nothing redistributed, the record simply fell below
# threshold — and those lines deliberately assert nothing about whether the id
# was a nameplate or a type code, because that was not measured.
#
# Successor search is HYPHEN-INSENSITIVE. A prefix-only match reported
# motorcycle/suzuki/drz as having no successor when it has four (dr-z400,
# dr-z400s, dr-z400sm, dr-z400smu) — which would have shipped a demotion line
# for an id whose rows demonstrably went somewhere.
