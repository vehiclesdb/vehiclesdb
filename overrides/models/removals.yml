"motorcycle/zundapp/werke": "not a vehicle: the raw register row is 'ZUENDAPP | ZUNDAPP WERKE', i.e. the manufacturer's own legal name (Zuendapp-Werke GmbH) recorded where a model belongs. strip_make_prefix removed the make and published the residue as a nameplate. No alias target is honest because no machine was ever named this; its presence implies at least one upstream record had an empty or malformed model field."
"car/audi/ag": "not a vehicle: the raw register row is verbatim 'AUDI AG' in both es_dgt and fi_traficom, i.e. the company's legal name recorded where a model belongs; strip_make_prefix left the residue 'Ag'. It also carries an EU type-approval cross-reference, which makes it a misfiled approval row rather than a machine. Two registers carrying it is a shared clerk habit, not corroboration that a vehicle exists. Verified from the raws by S4W; second instance of the class after motorcycle/zundapp/werke."
