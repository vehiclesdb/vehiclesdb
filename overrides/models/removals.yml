# removals.yml — the EXPLICIT REMOVAL MANIFEST for the id-contract gate.
#
# SCHEMA.md says removing a published id is the only breaking change, and the
# no-vanish gate (pipeline validate gate 7) enforces it: every published id
# absent from a new build must carry a former_ids alias to a LIVE id, or an
# entry HERE with a reviewed reason. This file is therefore the honest ledger
# of every id that ceases to exist WITHOUT a successor — junk that was never a
# vehicle, parser fabrications, kind hygiene, and threshold demotions.
#
# Shape:  "<kind>/<make>/<slug>": "<reason a consumer could read>"
#
# RULES:
#   - an entry here is a REVIEWED decision; the gate trusts it completely, so
#     never bulk-add entries to make the gate green (the spotchecks rule).
#   - DEMOTED entries are NOT junk: they are real records below the publication
#     threshold after corrections removed fabricated/misattributed evidence.
#     They live in build/candidates/ and return AUTOMATICALLY when real
#     corroboration arrives. Do not hand-restore them; do not delete their
#     entries (the gate needs them until they return).
#   - generated 2026-07-25 from a classified build diff (1,495 gone ids →
#     912 aliases in former_ids.yml + the 558 entries below + 0 unexplained).

