# Model-string DROP patterns, per kind. Ruby regex source strings (case
# applied against the UPCASED raw model string). A hit drops the row for that
# kind — used to keep other kinds' nameplates from leaking in.
#
# The `car` list exists because registries' "passenger car" classes include
# camper & kombi CONVERSIONS of vans registered as cars (RDW "Personenauto"
# quirk — Dossier §4.2; same pattern seen in UK VEH0120 and LU). Those
# nameplates are real — they belong to kind `van`, whose build ingests them
# via kind_maps instead. Dropping here ≠ dropping from the dataset.

car:
  - '\bSPRINTER'      # Mercedes van. No trailing \b: fi_traficom writes FUSED grades ("SPRINTER313 CDI" — R→3 is no word boundary, so the bounded form missed 5 M1 raw shapes, measured wave 3); prefix-bounded is still safe, no nameplate contains the word
  - '\bTRANSIT\b'     # Ford van family (incl. TOURNEO CONNECT etc. below)
  - '\bTRANSPORTER\b' # VW T-series van. NB 2026-07-26: car/volkswagen/transporter now EXISTS deliberately — it is the wave-3 fold target for T1–T6/KASTENWAGEN/BESTEL/KOMBIWAGEN/SYNCRO raws, which never contain TRANSPORTER and so never trip this drop (dossier-trims-vw-seat.md §3.0, GATE-1 resolution 1). Do NOT extend this drop to those raw shapes: drop_patterns fire on the RAW before renames (normalizer.rb:114), so the extension would kill the folds and orphan the minted id.
  - '\bCRAFTER\b'     # VW van
  - '\bCADDY\b'       # VW van — RDW even has "CADDY MODIFIED PARTITION WALL" (25,250 rows measured)
  - '\bCADDYMAXI\b'   # fused UK-DfT genmodel of the same van; without this the kind-blind Caddymaxi->Caddy fold mints car/volkswagen/caddy in pre-drift cache states (the cross-kind prune has a >=100 guard these few rows sit under) — caught by the pinned Caddy spotcheck on #67
  - '\bBERLINGO\b'    # Citroën van (passenger Berlingo handled under van kind)
  - '\bKANGOO\b'      # Renault van
  - '\bPARTNER\b'     # Peugeot van
  - '\bRIFTER\b'      # Peugeot van (passenger)
  - '\bDOBLO\b'       # Fiat van
  - '\bDUCATO\b'      # Fiat large van (top camper base)
  - '\bJUMPER\b'      # Citroën large van
  - '\bJUMPY\b'       # Citroën mid van
  - '\bBOXER\b'       # Peugeot large van — NOTE: "Boxer" is also a Bajaj MOTORCYCLE (Kenya boda-boda staple); kind context keeps these apart
  - '\bEXPERT\b'      # Peugeot mid van
  - '\bVITO\b'        # Mercedes van
  - '\bVIANO\b'       # Mercedes passenger van
  - '\bMASTER\b'      # Renault large van
  - '\bTRAFIC\b'      # Renault mid van
  - '\bMOVANO\b'      # Opel large van
  - '\bDOKKER\b'      # Dacia van
  - '\bLODGY\b'       # Dacia MPV-van
  - '\bSCUDO\b'       # Fiat van
  - '\bNV\d'          # Nissan NV200/NV300/NV400 vans
  - '\bPROACE\b'      # Toyota van
  - '\bCOMBO\b'       # Opel van
  - '\bVIVARO\b'      # Opel van
  - '\bTOURNEO\b'     # Ford passenger van
  - '\bCONNECT\b'     # Ford Transit/Tourneo Connect
  - '\bEXPRESS\b'     # Renault Express van
  - '\bTALENTO\b'     # Fiat van (Trafic twin)
  - '\bTGE\b'         # MAN TGE van (VW Crafter twin)
  - '\bDAILY\b'       # Iveco Daily (belt & braces alongside make drop)
  - '\bT[- ]?CLASS\b' # Mercedes T-Class small van (passenger Citan)
  - '\bCITAN\b'       # Mercedes small van
  - '\A10-11\s?C\z'   # VW "10-11C": Finnish register type code for vintage Beetles, not a nameplate (measured 2026-07-05)
  # --- commercial vehicles inside Germany's PASSENGER-CAR table (KBA FZ 10.1),
  # surfaced 2026-07-25 once the xlsx parser fix made KBA model names readable.
  # Mechanism: motorhomes built on truck chassis are registered as M1 in Germany
  # (same reason the motorhome coachbuilders in makes/drop.yml appear as "car
  # makes"), and some van derivatives are car-registered. Every nameplate below
  # already exists in its correct kind, so dropping it from `car` loses nothing.
  - '\bACTROS\b'      # Mercedes heavy truck — 13 DE car-class registrations Jan-May 2026; truck/mercedes-benz/actros is canonical
  - '\bAROCS\b'       # Mercedes construction truck, same mechanism (9 units); truck/mercedes-benz/arocs is canonical
  - '\bTOWNSTAR\b'    # Nissan van (Kangoo twin) — van/nissan/townstar is canonical
  - '\bINTERSTAR\b'   # Nissan van (Master twin) — van/nissan/interstar is canonical
  - '\bDELIVER\s?7\b' # Maxus Deliver 7 van — van/maxus/deliver-7 is canonical
  # --- Mercedes W901-W906 SPRINTER chassis-code registrations in passenger-car
  # classes (grijs-kenteken / KAMPEERAUTO campers; fi+nl+ua, 325 rows measured).
  # The raws spell the CHASSIS CODE ("906 AC 30", "902.6 KA", bare "906"), so the
  # \bSPRINTER\b pattern above never sees them, and the wave-3 trim-fold renames
  # ("906": Sprinter etc.) would otherwise mint car/mercedes-benz/sprinter against
  # the pinned spotcheck "Sprinter is kind=van/truck; must not leak into cars" —
  # the exact CADDYMAXI mechanism (#67) two entries up. Kind van carries this
  # volume natively. (Mercedes trim dossier wave 3, §3.0 C resolved per spotcheck.)
  # SEPARATOR AND BOUNDARY RELAXED 2026-08-21. Was:
  #     \A90[1-6][\s.-]+\d*\s*(KA|AC|BA|OK)\b
  # which required a separator after the chassis number and a word boundary
  # after the body code. The register writes FUSED forms and the renames block
  # right beside it already keys them — "906BA35", "906OK30", "906BA50" have no
  # separator at all, and "906 BA35" has one but glues the body code to its
  # size, so the trailing \b lands between "A" and "3" and never matches. All
  # four escaped this drop, reached the renames, folded to "Sprinter", and minted
  # car/mercedes-benz/sprinter against the pinned spotcheck.
  #
  # This is the SAME trap already documented on the \bSPRINTER entry at the top
  # of this list ("No trailing \b: fi_traficom writes FUSED grades") — a drop
  # pattern is a RAW-string match, and registers vary separators freely. Where
  # a fused spelling exists, the bounded form is the one that is wrong.
  - '\A90[1-6](?:[\s.-]+\d*\s*|)(KA|AC|BA|OK)'  # chassis + body-code forms, separator optional and no trailing boundary: "906 AC 30", "906 KA 35", "902 KA", "906 BA35", "906BA35", "906OK30", "906BA50"
  - '\A90[1-6][.-]\d' # dotted/hyphened chassis sub-codes: "903.6 308CDI", "902.6 KA", "905.6", "904.6 413CDI" (nl personenauto carries the whole W90x zoo, n=1 each — measured)
  - '\A906\z'         # bare W906. NOTE make-blind: would also hit a bare Porsche "906" raw (none in any corpus to date). Bare "903"/"904" are deliberately NOT dropped — porsche/904 is a live id fed by the bare raw; stray Mercedes car-class "903"/"904" rows are single-source n~1 and cannot pass the 2-source/threshold entry rule
  # MAKE-SCOPED (mapping shape, pipeline#… — a bare string stays make-blind).
  # Bare "903"/"904" are the W903/W904 Sprinter chassis codes, and renames.yml
  # folds them to "Sprinter" for the van/truck kinds where they belong (raw
  # "903" x22 fi+nl, "904" x6). Renames are KIND-BLIND, so the same fold fired
  # in the car kind and minted car/mercedes-benz/sprinter on [fi,nl] against the
  # pinned spotcheck — with body_types ["hatchback"], which is the tell.
  #
  # This could not be written as a bare pattern: `porsche/904` is a LIVE id
  # [nl,nz] fed by the identical raw, and a make-blind `\A90[34]\z` would delete
  # it. That is why the previous note here said 903/904 were deliberately left
  # undropped and leaned on "single-source n~1 cannot pass the 2-source rule" —
  # a premise the 2026-08-21 refresh falsified, since the leaked record is
  # exactly [fi,nl]. MEASURED, not argued: deleting the two rename keys instead
  # clears this spotcheck but mints van/mercedes-benz/903 and
  # truck/mercedes-benz/904 as live chassis-code nameplates (experiment build
  # 32446885634) — one failure removed, two added.
  - { make: Mercedes-Benz, pattern: '\A90[34]\z' }
  - '\b(SPINTER|SPRINER|SRINTER)\b'  # Sprinter MISSPELLINGS in passenger-car classes (fi M1 "SPINTER" x15, "SPINTER 310CDI PROSTYLE TREND", "SRINTER 316CDI-3.5T-906633/367" — measured); the van/truck-kind misspelling rows fold to van/truck sprinter via renames, untouched by this car-kind drop

van: []
motorcycle: []
moped: []
truck:
  - '\A80-13\s?A?\z'  # Iveco-Magirus "80-13A": chassis config code that survives series collapse (digit-leading, no letter stem)
bus: []
