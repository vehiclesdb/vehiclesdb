# ── 2026.11.7: Citroën writes the Méhari with its accent. A display pin, not a styling.yml entry: renames.yml
# folds "Mehari 2+2" onto the literal "Mehari", so a styling of the raw MEHARI would leave the record with two
# competing spellings of one slug. The slug (and id) stays `mehari`, so "mehari" keeps matching everywhere.
# The car/van pair is deliberate (the two-seat commercial version registers as a van) and stays two records.
"car/citroen/mehari": "Méhari"   # was "Mehari"; https://www.citroenorigins.com/en/cars/mehari (Citroën's heritage site; fetched 2026-11-11: page heading "Méhari", "Years of production From 1968 to 1987" (accessed 2026-11-11))
"van/citroen/mehari": "Méhari"   # was "Mehari"; same Citroën page https://www.citroenorigins.com/en/cars/mehari (accessed 2026-11-11); van twin of car/citroen/mehari
