# gate_acks.yml — ADJUDICATED exceptions to the id-contract gate (validate 7).
#
# A gate finding lands here ONLY after a maintainer has investigated it and
# decided the flagged state is correct. Each entry names the gate, the finding,
# and the reasoning — so the gate stays loud for everything else while a
# reviewed judgment call does not ring the bell forever. Never add an entry to
# make a build green; that is the spotchecks rule and it applies here doubly.
#
# Shape:
#   move_split:
#     "<kind>|<move key>": "<why the flagged twin is deliberately NOT co-moved>"

move_split:
  "moped|Piaggio|Vespa 50": >-
    ADJUDICATED (S2W, NEGOTIATION Turn 36): the badge-free candidate
    `piaggio/50` is a bare "50" under merk=PIAGGIO, which is NOT provably the
    Vespa 50 — Piaggio's own 50cc range (Ciao, Si, Zip) registers identically.
    Moving it would claim every bare Piaggio 50 for Vespa, which is the
    approval-holder over-merge the clusters exist to prevent. The ambiguity is
    documented as one of the two Piaggio rows judged too ambiguous to move;
    revisit only with raw-level evidence (TAN or handelsbenaming detail).

# Delta-gate acks (validate gate 4): ADJUDICATED step-changes with a CEILING.
#
#   delta:
#     "truck": { max_new: 1400, why: "…the measurement, not the intent…" }
#
# The ack is a ceiling, not a blank check — growth past max_new still fails.
# REMOVE EACH ENTRY IN THE RELEASE THAT CONSUMES IT: one release rebuilds
# catalog/, so the counter it was written against resets to ~0 and the ack
# would then be silently covering a step-change nobody adjudicated.
#
# NONE ARE OPEN. The van (wave-3 VW trim folds), truck (series-collapse stub
# fix) and car (a night of merged marque waves, 6,238→4,949) acks were all
# consumed by release 2026.08.1 and removed here, per their own instructions.
# Verified by re-running the build against the rebuilt catalog with this
# section empty: delta gate green on all six kinds, no ack required.
