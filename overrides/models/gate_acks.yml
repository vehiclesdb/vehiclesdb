# gate_acks.yml — ADJUDICATED exceptions to the id-contract gate (validate 7).
#
# A gate finding lands here ONLY after a maintainer has investigated it and
# decided the flagged state is correct. Each entry names the gate, the finding,
# and the reasoning — so the gate stays loud for everything else while a
# reviewed judgment call does not ring the bell forever. Never add an entry to
# make a build green; that is the spotchecks rule and it applies here doubly.
#
# Shape:
#   move_split:
#     "<kind>|<move key>": "<why the flagged twin is deliberately NOT co-moved>"

move_split:
  "moped|Piaggio|Vespa 50": >-
    ADJUDICATED (S2W, NEGOTIATION Turn 36): the badge-free candidate
    `piaggio/50` is a bare "50" under merk=PIAGGIO, which is NOT provably the
    Vespa 50 — Piaggio's own 50cc range (Ciao, Si, Zip) registers identically.
    Moving it would claim every bare Piaggio 50 for Vespa, which is the
    approval-holder over-merge the clusters exist to prevent. The ambiguity is
    documented as one of the two Piaggio rows judged too ambiguous to move;
    revisit only with raw-level evidence (TAN or handelsbenaming detail).

# Delta-gate acks (validate gate 4): ADJUDICATED step-changes with a CEILING.
# Remove each entry in the release that consumes it.
delta:
  "van": { max_new: 900, why: "wave-3 VW trim folds retire 86 van ids (dossier-trims-vw-seat.md; the whole VW van kind is 4 nameplates + Taro) landing on a catalog that also has not yet absorbed the already-merged Citroën/Opel + hygiene waves — measured 1077->834 in the verification build; adjudicated S4W 2026-07-26, the #89 precedent" }
  "truck": { max_new: 1400, why: "series-collapse stub fix un-pools ~300 real truck models from single-letter stubs (F/L/B/K/G…) — measured 1026->1320 in the control build; adjudicated S4W 2026-07-26, audit RESULTS §New-1" }
  "car":
    max_new: 5100
    why: >-
      THE COMMITTED catalog/ HAS NOT ABSORBED A NIGHT OF MERGED MARQUE WAVES,
      and the car counter crossed 20% on the wave-8 Pontiac + Aston Martin +
      BYD apply. Attribution measured on two builds of the SAME pipeline
      (2d2f160) on 2026-08-01, not estimated: committed catalog/car/models.json
      = 6,238; a CONTROL build of data origin/main (7e8850c, no branch changes)
      = 5,024, i.e. **19.46% — already 0.54pp from the gate before this branch
      existed**; the wave-8 TREATMENT build = 4,945, i.e. 20.73%. So this
      branch contributes 79 car ids / 1.27pp of a 20.73% total, and ~94% of the
      delta is the already-merged Alfa/Chevrolet/Italian/JLR/Kia/Mazda/
      Mitsubishi/Saab/Porsche/Bentley/Vauxhall/Subaru/Jeep waves waiting for a
      release to rebuild catalog/. Every one of wave 8's 79 retired car ids is
      accounted for — 81 former_ids aliases generated by scripts/
      propose_former_ids.rb from the control-vs-treatment diff (0 dead override
      keys, 0 evidence-loss cases) plus one removals.yml manifest entry
      (car/aston-martin/martin), with ZERO unexplained disappearances. The
      ceiling is set just above the CONTROL count so that a later wave which
      shrinks car further still passes while any unexpected GROWTH still fails.
      REMOVE THIS ACK IN THE RELEASE THAT CONSUMES IT — one release rebuilds
      catalog/ and the counter resets to ~0. Adjudicated S4W 2026-08-01 on the
      #89 / wave-3 van and wave-7 truck precedents directly above.
