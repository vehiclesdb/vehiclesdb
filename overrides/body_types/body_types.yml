  Toyota|Alphard: mpv              # car/toyota/alphard was hatchback: Opens 'a large MPV'; infobox body style '5-door MPV' — https://en.wikipedia.org/wiki/Toyota_Alphard (fetched 2026-10-10) [wikipedia]
  Mitsubishi|Shogun: suv           # car/mitsubishi/shogun was hatchback,wagon: Pajero/Shogun page: 'a full-size SUV'; 4th gen infobox '3-door SUV','5-door SUV' — https://en.wikipedia.org/wiki/Mitsubishi_Pajero (fetched 2026-10-10) [wikipedia]
