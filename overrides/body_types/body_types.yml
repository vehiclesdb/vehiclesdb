  Ford|F-150: pickup               # car/ford/f-150 was hatchback,wagon: ford.com titles it '2026 Ford F-150® Truck' and says 'F-150® pickups have got your back' — https://www.ford.com/trucks/f150/ (fetched 2026-10-10) [manufacturer]; every generation is the half-ton F-Series pickup — https://en.wikipedia.org/wiki/Ford_F-Series_(thirteenth_generation) [wikipedia]
  Ram|1500: pickup                 # car/ram/1500 was hatchback: Opens 'a full-size pickup truck manufactured by Stellantis North America' — https://en.wikipedia.org/wiki/Ram_1500 (fetched 2026-10-10) [wikipedia]
  GMC|1500: pickup                 # car/gmc/1500 was hatchback: Chevrolet Silverado/GMC Sierra range of trucks; infobox '4-door crew cab (...2004-present for 1500)' — https://en.wikipedia.org/wiki/GMC_Sierra (fetched 2026-10-10) [wikipedia]
  Xiaomi|SU7 Max: sedan            # car/xiaomi/su7-max was mpv via the same [mpv, 'Max\b'] keyword; Max is a trim of the SU7, 'a full-size four-door sedan EV', infobox '4-door sedan' — https://en.wikipedia.org/wiki/Xiaomi_SU7 (fetched 2026-10-10) [wikipedia; mi.com 403]
  Xiaomi|YU7 Max: suv              # car/xiaomi/yu7-max was mpv via the [mpv, 'Max\b'] keyword; YU7 'a battery electric mid-size SUV', infobox '5-door coupe SUV', Max = top variant — https://en.wikipedia.org/wiki/Xiaomi_YU7 (fetched 2026-10-10) [wikipedia]
  Deepal|S05 Max: suv              # car/deepal/s05-max was mpv via the [mpv, 'Max\b'] keyword; S05 'a compact crossover SUV', infobox '5-door SUV', Max = a trim (TH/ID launches) — https://en.wikipedia.org/wiki/Deepal_S05 (fetched 2026-10-10) [wikipedia]

