  Hyundai|Santa FE: suv            # car/hyundai/santa-fe was hatchback,wagon: Page title: 'The Adventurous Compact SUV' (2027 Santa Fe; accessed 2026-10-10) — https://www.hyundaiusa.com/us/en/vehicles/santa-fe (fetched 2026-10-10) [manufacturer]
  Perodua|Alza: mpv                # car/perodua/alza was hatchback: Opens 'B-segment multi-purpose vehicle (MPV)'; infobox lists '5-door wagon' — https://en.wikipedia.org/wiki/Perodua_Alza (fetched 2026-10-10) [wikipedia]
