  # --- ES-brand audit (2026-07-12) ---
  SEAT|600: sedan                # classic rear-engined 2-door saloon (1957-73); the make-unscoped "600" set entry (meant for the Fiat 600e revival) was poisoning it
  SEAT|Exeo: sedan               # Audi A4 B7-based saloon (Exeo ST = the wagon secondary); no hatchback Exeo existed
  EBRO|S700: suv                 # mid-size SUV (Chery Tiggo 7 platform, built ex-Nissan Barcelona) — DGT-only rows were default-typed hatchback
  EBRO|S800: suv                 # 7-seat SUV (Chery Tiggo 8 platform), same revival family
  EBRO|S400: suv                 # compact SUV (Chery Tiggo 4 Pro base) — key is the post-rename nameplate (S400 Hev → S400)
  # --- Lexus TX (2026-08-02, S4W; dossier §A.2 L1 mints car/lexus/tx) ---
  Lexus|TX: suv                  # "This three-row SUV provides seating for up to seven passengers" — https://pressroom.lexus.com/a-new-era-of-three-row-luxury-the-first-ever-lexus-tx/ (fetched 2026-08-02). REQUIRED, not cosmetic: normalizer.rb's Lexus family rule tests /\A(NX|RX|UX|GX|LX|RZ|LBX)/ for :suv and has no TX arm, the TX has no nl_rdw rows so the registry-signal layer never fires, and the record therefore falls to the default :hatchback — which is what car/lexus/tx-350 and car/lexus/tx-500h publish TODAY (measured, dist/vehicles.csv v2026.08.0). Curated here rather than in the Ruby family rule per AGENTS.md ("string FACTS are overrides"); layer 1 outranks the family rule either way
  # --- DEVQ A2 (2026-10-10, S4W): category errors in the top-300 cars by registration mass ---
  # Root cause unless the line says otherwise: no override/keyword/set matched and there was no registry body
  # signal (US/AU/Asian-register-only rows), so body_type_for fell to its default :hatchback
  # (normalizer.rb:459) — the Lexus TX class above. Make-scoped on purpose: a name-only set entry
  # would also retype Fiat/MG/Triumph "1500". Sweep: top-300 by registrations-2026.10.0 mass;
  # evidence tier in [brackets]; Wikipedia only where the maker page 403/404d or states no body.
  Honda|CR-V: suv                  # car/honda/cr-v was hatchback: Opens 'compact crossover SUV'; infobox body style '5-door SUV' — https://en.wikipedia.org/wiki/Honda_CR-V (fetched 2026-10-10) [wikipedia]
  MG|ZS: suv                       # car/mg/zs was hatchback: 2017+ ZS 'a subcompact crossover'; the 2001-05 ZS was a small family car (2017+ dominates) — https://en.wikipedia.org/wiki/MG_ZS (fetched 2026-10-10) [wikipedia] — the record also holds the 2001-05 ZS saloon/hatch, but the 2017+ crossover dominates the live fleet
  Perodua|Bezza: sedan             # car/perodua/bezza was hatchback: Infobox body style '4-door sedan'; 'a city car' — https://en.wikipedia.org/wiki/Perodua_Bezza (fetched 2026-10-10) [wikipedia]
  Ford|EcoSport: suv               # car/ford/ecosport was hatchback: Opens 'subcompact crossover SUV'; infobox body style '5-door SUV' — https://en.wikipedia.org/wiki/Ford_EcoSport (fetched 2026-10-10) [wikipedia]
  Proton|Saga: sedan               # car/proton/saga was hatchback: 2008-present (2nd/3rd gen) infobox '4-door saloon'; hatchback only 2003-08 LMST — https://en.wikipedia.org/wiki/Proton_Saga (fetched 2026-10-10) [wikipedia]
  Toyota|Land Cruiser: suv         # car/toyota/land-cruiser was hatchback,wagon: Toyota UK page title 'The Ultimate SUV' (accessed 2026-10-10); Wikipedia class 'Full-size SUV' — https://www.toyota.co.uk/new-cars/land-cruiser (fetched 2026-10-10) [manufacturer]
  Mitsubishi|ASX: suv              # car/mitsubishi/asx was hatchback,wagon: 'The ASX is the perfect family SUV, with 5 seats...' (accessed 2026-10-10) — https://www.mitsubishi-motors.co.uk/asx (fetched 2026-10-10) [manufacturer]
