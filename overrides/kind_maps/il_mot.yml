# il_mot — Israel Ministry of Transport vehicle registers on data.gov.il.
#
# Three datasets feed three sections. Each section is keyed on the dataset's
# OWN class column. Counts are ACTIVE vehicles measured 2026-10-02 (full
# census through the datastore API, not a sample).
#
# THE THREE OUTCOMES (same contract as no_svv_pkk.yml):
#   a kind   mapped
#   null     a DECLARED skip, reason on the same line — logged once, never warned
#   absent   UNDECLARED — warned loudly every build
#
# Source: https://data.gov.il/dataset/degem-rechev-wltp (5e87a7a1),
#         https://data.gov.il/dataset/motorcycle (bf9df4e2),
#         https://data.gov.il/dataset/heavy-truck (cd3acc5c)

kinds:
  # ── car + van: `sug_degem` of the Ministry's active-count roll-up ──────────
  sug_degem:
    P: car        # פרטי, private — 4,010,986 active
    M: van        # מסחרי, commercial ≤3,500 kg — 176,728 active

  # ── two-wheelers: `sug_rechev_EU_cd` of the motorcycle register ───────────
  # NOT EU L-categories: these are ISRAELI LICENCE TIERS. L1 holds 48,506
  # petrol vehicles of 51-125 cm³ (licence A2, ≤14.6 hp) and only 704 of
  # ≤50 cm³; L2 is mostly 126-500 cm³ (A1, ≤47 hp); L3 is unrestricted (A).
  # Moped vs motorcycle is therefore decided IN THE ADAPTER from engine size
  # (≤50 cm³) or, for electrics, power (≤4 kW = 5.36 hp) — the EU L1e bounds.
  sug_rechev_EU_cd:
    L1: motorcycle  # 55,061 — split to moped by cm³/power
    L2: motorcycle  # 103,082
    L3: motorcycle  # 32,922
    L7: null        # 1,051 — a tier OUTSIDE the L1-L3 licence ladder (all 1,051 electric, median 10.2 hp); what body it is was not verified, so it is declared rather than guessed into a 2W kind

  # ── truck + bus: `tkina_EU` of the heavy register (a REAL EU category) ────
  tkina_EU:
    N2: truck     # 100,799
    N3: truck     # 48,701
    M2: bus       # 18,446
    M3: bus       # 24,810
    M1: null      # 13,913 — M1 passenger vehicles in the heavy register; cars come from the roll-up (sug_degem), and a second car feed from one country would double-source it
    N1: null      # 4,360 — light commercials, same reason; vans come from the roll-up
    O1: null      # 65,558 trailer
    O2: null      # 56,130 trailer
    O3: null      # 592 trailer
    O4: null      # 24,021 trailer
    O5: null      # 413 trailer (Israeli extension of the O class)
    T1: null      # 38,530 agricultural tractor
    T2: null      # 26,182 agricultural tractor
    "": null      # blank category — no class to map

# ── make splits: a Hebrew make label that also files ANOTHER marque ──────────
# Applied by il_mot ONLY (pipeline/sources/il_mot.rb#make_split), car/van rows,
# after the model cell is cleaned. `match` selects the cells, `make` is the
# marque they belong to (a Latin raw make, resolved like any source's), `strip`
# removes the marque words from the cell, `rewrite` repairs the register's
# 15-character truncations so normalizer.rb#mini folds them. An empty model
# after stripping is dropped and logged. Found by the I-11 verifier on
# vehiclesdb-pipeline#254 (2026-10-10): 5,365 vehicles were attaching to
# car/bmw/cooper* and car/nissan/infiniti. Raw cells and active counts below are
# from the 2026-10-09 roll-up (5e87a7a1).
make_splits:
  "ב מ וו":   # BMW label; MINI is a BMW Group marque and Israel files it here: COOPER S 1,171, COOPER 1,141, MINI ONE 788, MINI COOPER 679, ONE 664, COUNTRYMAN COOP 582, COOPER SE 410, JOHN COOPER WOR 295 … (6,556 of 58,411) — https://www.mini.com/en_MS/home/range.html (accessed 2026-10-10) [manufacturer]
    - match: '\A(?:MINI|COOPER|ONE\b|COUNTRYMAN|CLUBMAN|PACEMAN|ACEMAN|JCW|JOHN COOPER|M C S COUNTRY)'   # BMW-label cells naming a MINI model; no BMW nameplate starts with these words (checked over all ב מ וו car/van cells 2026-10-10)
      make: MINI          # ACEMAN added (I-11 round 2, S-5): ACEMAN SE 114, ACEMAN E 4 — the 2024 MINI Aceman, live as car/mini/aceman
      kinds: [car, van]
      rewrite:
        - ['COUNTRYM\w*|CONTRYM\w*|\bCOUNTR\b', 'COUNTRYMAN']   # truncations: "MINI S COUNTRYM" 54, "MINICOUNTRYMAN" 52, "MINI C S COUNTR" 16, "MINI S CONTRYM"
        - ['PACEMA\b', 'PACEMAN']                              # "MINI JCW PACEMA" 1
        - ['\bCAB\b', 'CABRIO']                                # "MINI COOPER CAB" 89, "MINI COOP S CAB" 31 → normalizer folds CABRIO to Convertible
  "ניסאן":    # Nissan label; Infiniti is Nissan's premium marque and Israel files it here: INFINITI 825, INFINITI Q50 561, INFINITI Q30 513, INFINITI QX60 294 … — https://www.infiniti-global.com/ (accessed 2026-10-10) [manufacturer]
    - match: '\AINFIN(?:ITI|TTI|ITY)\b'   # 2,876 active incl. the misspellings INFINTTI, INFINTTI M, INFINITY HYBRID; the model follows the marque word
      make: Infiniti
      kinds: [car, van]
      strip: ['\AINFIN(?:ITI|TTI|ITY)\b']   # bare "INFINITI" (825) and "INFINITI HYBRID" carry no nameplate → dropped / unattached, never a Nissan
    - match: '\AQX?\d\d\b'   # Infiniti nameplates filed WITHOUT the marque word (I-11 round 2, S-5): QX55 194, QX50 81, QX60 74, Q50 HYBRID 15, Q70 HYBRID 1; Nissan sells no Q<digits> model (QASHQAI does not match) — https://www.infiniti-global.com/ (accessed 2026-10-10) [manufacturer]
      make: Infiniti
      kinds: [car, van]
  "פיאט":     # Fiat label; Abarth is a Stellantis marque registered under Fiat in Israel: ABARTH 500 362, FIAT 500 ABARTH 238, 500 ABARTH 30, ABARTH124SPIDER 13, PUNTO ABARTH 15 — https://www.abarth.com/ (accessed 2026-10-10) [manufacturer]
    - match: 'ABARTH?'   # incl. the truncation "ABART 500E"
      make: Abarth
      kinds: [car, van]
      strip: ['\AFIAT\b', 'ABARTH?']   # "FIAT 500 ABARTH" → 500, "ABARTH500" → 500, "PUNTO ABARTH" → PUNTO
    - match: '\ARENEGADE\b'   # the Jeep Renegade (464 active) is filed under the Fiat label — built by FCA at Melfi beside the Fiat 500X (I-11 round 2, S-5); live as car/jeep/renegade — https://www.jeep.com/renegade.html (accessed 2026-10-10) [manufacturer]
      make: Jeep
      kinds: [car, van]

