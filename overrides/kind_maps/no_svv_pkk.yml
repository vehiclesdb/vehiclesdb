# no_svv_pkk — Statens vegvesen *Periodisk kjøretøykontroll* (PKK), Norway.
#
# Keyed on `Kjøretøy Gruppeavgift` — the register's OWN vehicle-group string
# (column 8 of 203), not on the EU category. Both are present in every row and
# the group is the better key for two measured reasons: it separates bodies the
# EU category fuses (a motorhome and a saloon are both M1), and it is the axis
# the publisher actually curates.
#
# MEASURED over the full 12-quarter corpus (2023 Q1 – 2025 Q4, 6,591,286 rows),
# 2026-09-12. Counts below are ALL rows, including `Etterkontroll`
# re-inspections; the adapter ingests only `Periodisk` (4,341,199 rows).
#
# ⚠ A SINGLE QUARTER SHOWS 42 GROUPS. THE CORPUS HAS 47. Anyone re-deriving
# this map from one file will silently drop five. That is also why an
# undeclared value is warned rather than skipped: see the adapter's kind_for.
#
# THE THREE OUTCOMES:
#   a kind        mapped
#   null          a DECLARED skip with its reason on the same line. Silent in
#                 the build (it is a decision on the record, reported in one
#                 census line), never a warning.
#   absent        UNDECLARED — censused and warned loudly every build.
#
# NORWAY CANNOT FEED motorcycle OR moped. Two-wheelers are not subject to PKK
# and there is no motorcycle group among the 47 values.

kinds:
  # ── car ───────────────────────────────────────────────────────────────────
  PERSONBIL: car                          # 5,057,272 · M1 4,750,182 / M1G 307,090 — the passenger fleet

  # ── van (N1) ──────────────────────────────────────────────────────────────
  VAREBIL KL 2: van                       #   911,221 · N1 753,303 / N1G 157,918 — the main light-commercial class
  VAREBIL KL 1: van                       #    28,580 · N1 15,692 / N1G 12,888
  VAREBIL: van                            #     3,508 · N1 3,148 / N1G 360 — unsuffixed legacy spelling
  VAREBIL KL 1(?): van                    #       802 · N1 802 — the "(?)" is UPSTREAM, verbatim in the register, not a typo here
  VAREBIL, MOTORREDSKAP: van              #         2 · N1 2 — van with mounted machinery; still an N1 van

  # ── truck (N2/N3) ─────────────────────────────────────────────────────────
  # Every LASTEBIL variant is a rigid goods vehicle and every one is N2/N3
  # throughout the corpus, so these are flat rather than category-split.
  LASTEBIL MED PLAN: truck                #    75,624 · N3 40,660 / N3G 20,906 / N2 13,463 / N2G 555
  LASTEBIL: truck                         #    73,747 · N3 62,865 / N3G 7,982 / N2 2,405 / N2G 493
  LASTEBIL, LUKKET: truck                 #    61,561 · N3 38,647 / N2 21,951 — box body
  TREKKBIL: truck                         #    43,142 · N3 41,345 / N3G 1,757 — tractor UNITS (the prime mover), a truck
  LASTEBIL, TANK: truck                   #     5,248 · N3 5,054
  LASTEBIL, BERGING: truck                #     4,707 · N3 2,215 / N2 2,210 — recovery
  LASTEBIL, OLJETANK: truck               #     2,327 · N3 2,286
  LASTEBIL, MOTORKRAN: truck              #       954 · N3G 939 — truck-mounted crane, still a truck chassis
  LASTEBIL, MOTORREDSKAP: truck           #       482 · N3 386 / N2 96
  LASTEBIL, MOTORREDSKAP, MOTORSPRØYTE: truck   #  61 · N3 61 — fire pump
  LASTEBIL, MOTORREDSKAP, MOTORKRAN: truck      #  20 · N3 14 / N2 6
  LASTEBIL, MOTORREDSKAP, MOTORSTIGE: truck     #   4 · N3 2 / N2 2 — turntable ladder

  # ── bus (M2/M3) ───────────────────────────────────────────────────────────
  # Norway ships the class numeral in Roman, Arabic AND letter forms, plus one
  # combined value. All are the same axis; all are buses.
  BUSS KL II: bus                         #    23,941 · M3 23,935
  BUSS KL B: bus                          #    20,303 · M2 14,466 / M3 5,465
  BUSS KL I: bus                          #    12,338 · M3 12,332
  BUSS KL III: bus                        #     7,266 · M3 7,266
  BUSS: bus                               #     1,527 · M2 916 / M3 611 — unsuffixed legacy spelling
  BUSS KL 3: bus                          #       560 · M3 550 — Arabic-numeral twin of KL III
  BUSS KL 2: bus                          #       254 · M3 254
  BUSS KL A: bus                          #       149 · M2 101 / M3 48
  BUSS KL 1: bus                          #       114 · M3 105
  BUSS KL 2 OG 3: bus                     #        99 · M3 87 / M2 12 — dual-certified

  # ── the one class that genuinely spans two kinds ──────────────────────────
  # KOMBINERT BIL ("combined vehicle") is goods+passenger. The dossier recorded
  # it as M1 and therefore a car; MEASURED IT IS NOT — it is N1-dominant
  # (13,122 of 15,483 = 84.8%). Split on the EU category, which is the stable
  # legal truth, exactly as nl_rdw splits Bedrijfsauto (PRD-3 §6.1).
  KOMBINERT BIL:                          #    15,483 total
    by_eu_category:
      N1: van                             #    13,122
      N1G: van                            #        12
      N2: truck                           #     2,213
      N3: truck                           #       133

  # ── DECLARED SKIPS: no kind exists for these ──────────────────────────────
  # Trailers and semi-trailers (EU category O1–O4). We have no trailer kind and
  # inventing one from an inspection register is not the way to get one.
  SEMITRAILER: null                       #    61,917 · O4 61,704
  PÅHENGSVOGN: null                       #    36,639 · O4 35,938 — drawbar trailer
  SLEPVOGN: null                          #    30,771 · O4 30,693 — full trailer
  SEMITRAILER MED TANK: null              #     4,447 · O4 4,447
  SLEPVOGN MED TANK: null                 #     3,304 · O4 3,304
  PÅHENGSVOGN MED TANK: null              #     1,220 · O4 1,201
  PÅHENGSVOGN, TEMPO100: null             #       376 · O2 302 / O1 74
  PÅHENGSVOGN, CAMPING, TEMPO100: null    #       263 · O2 237 — caravan
  PÅHENGSVOGN, CAMPING: null              #       112 · O2 88 — caravan
  SEMITRAILER, CAMPING: null              #         4 · O2 2 / O3 2
  PÅHENGSVOGN MED TANK, TEMPO100: null    #         1 · O2 1
  # Agricultural tractors and self-propelled machinery (T1/T5/TR/MR).
  TRAKTOR: null                           #    15,490 · T5 9,136 / T1 6,115 / TR 239
  M.REDSKAP KRAN: null                    #       430 · MR 430 — self-propelled crane, not a road vehicle kind

  # ── DECLARED SKIPS: PARKED ON AN OWNER RULING, NOT ON A MISSING KIND ───────
  # These four are M1-dominant bodies that our six kinds can technically hold.
  # They are skipped because mapping them would MINT MAKES, and the catalog
  # already disagrees with itself about where such makes belong.
  #
  # THE EVIDENCE, measured 2026-09-12: PKK carries the COACHBUILDER as the make
  # (`HYMER`, `DETHLEFFS`, `BÜRSTNER`, `ADRIA`, `KNAUS`, `CARTHAGO`…). None of
  # those is a catalog make. But the catalog DOES already carry them — as
  # MODELS under the base-vehicle make: `fiat/hymer`, `citroen/burstner`,
  # `fiat/adria`, `citroen/dethleffs` and ~40 more. And it files them
  # inconsistently: 18 such ids under `car`, 11 under `van`, 11 under `truck`,
  # 1 under `moped`. So there is no convention to follow, and mapping
  # CAMPINGBIL would mint `hymer/*` as a NEW MAKE in direct contradiction of
  # the coachbuilder-as-model pattern already shipped.
  #
  # Skipping costs 85,014 rows of the 6.59M corpus (1.3%) and mints nothing
  # wrong. The ruling the owner is being asked for is ONE question:
  # is a motorhome/ambulance/hearse a make of its own, a model of its chassis
  # make, or out of scope? Ingesting Norway does not depend on the answer.
  CAMPINGBIL: null                        #    80,730 · M1 80,636 — motorhome; coachbuilder-as-make (see above)
  AMBULANSE: null                         #     3,787 · M1 3,065 / M1G 673 / M3 49 — mostly van-based (Sprinter/Transit) despite M1
  BEGRAVELSESBIL: null                    #       427 · M1 323 / N1 66 — hearse, coachbuilt
  LEILIGHETSAMBULANSE: null               #        70 · M1 66 — "apartment ambulance" (patient transport)
  PERSONBIL, MOTORREDSKAP, MOTORSPRØYTE: null   #   2 · M1 2 — a fire pump on a passenger chassis; 2 rows, no useful nameplate
