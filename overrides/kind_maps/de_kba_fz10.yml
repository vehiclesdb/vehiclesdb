# DE KBA FZ 10.1 source mapping — Modellreihe → kind.
#
# Dataset: "Neuzulassungen von Personenkraftwagen nach Marken und Modellreihen"
# https://www.kba.de/DE/Statistik/Produktkatalog/produkte/Fahrzeuge/fz10/fz10_gentab.html
# Licence: DL-DE/BY-2.0 (pinned as de_kba).
#
# ── WHY THIS FILE EXISTS: Germany was missing from 2,550 records ─────────────
#
# FZ 10.1 is a PASSENGER-CAR table, but "Personenkraftwagen" means EU class M1,
# and M1 is defined purely by seat count (≤8 besides the driver) with NO mass
# ceiling — so it includes:
#   * passenger versions of vans (Caddy Life, Multivan, Transit Custom Kombi…),
#     which carry M1 type approvals disjoint from their N1 siblings; and
#   * motorhomes, including 26-tonne liners on Actros chassis, as M1 special
#     purpose "SA / Wohnmobil" (71,575 units = 2.5% of German Pkw in 2025).
# KBA methodology: https://www.kba.de/DE/Statistik/Fahrzeuge/fz_methodik/fz_methodische_erlaueterungen_202402_pdf.pdf
# M1 definition: 2007/46/EC Annex II, now Reg. (EU) 2018/858 Annex I.
#
# `overrides/models/drop_patterns.yml` drops those van nameplates from the car
# kind with the comment "they belong to kind van, whose build ingests them via
# kind_maps instead" — but no kind_map existed for this source and it only fed
# the car kind, so the rows were dropped and NOTHING picked them up. Measured
# 2026-07-25 on the published catalog: **0 of 1,120 van records, 0 of 1,045 truck
# records and 0 of 385 bus records carried `de` evidence**, while Germany
# registered 19,375 Caddy and 29,057 Transporter M1 vehicles in 2025 alone.
#
# The mapping below routes each Modellreihe to the kind whose catalogued
# nameplate it actually is. Every entry was derived by resolving the KBA string
# through the real normalizer and checking which kind already holds that id —
# not from a hand-written guess. Counts are Jan–May 2026 YTD registrations.
#
# NOT ROUTED, deliberately: rows that are ~100% motorhome (Actros, Arocs,
# Atego, Unimog, Volvo FH, MAN TGL/TGM/TGS/TGX, Iveco Stralis/Eurocargo,
# DAF XF). FZ 11.1 — the same population cut by segment — places 100% of those
# registrations in segment WOHNMOBILE, matching FZ 10.1 to the unit. They are
# campers on a truck chassis, not trucks sold as trucks, so routing them to the
# truck kind would assert a truck market that does not exist. They stay dropped.
#
# FUTURE IMPROVEMENT: joining FZ 11.1 (same publisher, same DL-DE/BY-2.0
# licence) would make this principled instead of enumerated — its `UTILITIES`
# segment is exactly "the M1 versions of nameplates that also have N1 versions",
# i.e. KBA's own car/van boundary. Enumerating is the interim.

kinds:
  # FZ 10.1 has no vehicle-class column: every row is M1 by construction, so the
  # kind comes from the nameplate (see by_model below) with car as the default.
  Personenkraftwagen: car

by_model:
  # --- passenger versions of vans ---
  # Originally all routed to `van`, "where the nameplate already exists and
  # Germany is currently absent". Since 2026-11-09 (DECISIONS.md "Passenger
  # versions of van-based MPVs publish in kind car"; PROPOSAL-kind-boundary.md (decided 2026-07-25)
  # Q1: kind follows the EU category) every row of this M1-only table goes to
  # `car` when the nameplate's car record publishes under the passenger-variant
  # evidence gate (overrides/models/passenger_variants.yml). The DE evidence
  # MOVES with it: the van twin keeps its id but no longer carries `de` from
  # this table (KBA's N1 tables are not ingested). Rows whose car twin does not
  # publish (Jumpy, Expert, Trafic, Vivaro, Scudo — gate FAIL) or whose KBA
  # Modellreihe names the commercial nameplate (TRANSIT, TRANSIT CONNECT,
  # TRANSIT COURIER — the car `publish:` list for Ford excludes them) and the
  # camper bases (DUCATO, SPRINTER, CRAFTER, BOXER, MASTER, MOVANO, DAILY, TGE,
  # TRANSPORTER) stay `van`.
  DUCATO: van            # 16,040 — Fiat Ducato; also the single most-registered German motorhome base
  TRANSPORTER: van       # 15,042 — absorbs Multivan/Caravelle/California (KBA has no separate rows for those)
  TRANSIT CUSTOM: car    #  8,438 — FLIPPED van→car 2026-11-09: FZ 10.1 rows are all M1, and car/ford/transit-custom now publishes (passenger_variants.yml; gate PASS es 623 M1 = 39.0%). KBA files the Tourneo Custom inside this Modellreihe, so the row cannot be split further
  CADDY: car             #  7,914 — Caddy Life/Style/Maxi; disjoint Pkw TSNs from Caddy Cargo. FLIPPED van→car 2026-11-09: car/volkswagen/caddy publishes (gate PASS es 69.0% M1, fi 45.5%, lu 58.3%)
  TRANSIT: van           #  4,835 — the "TRANSIT, TOURNEO" row resolves here (Tourneo is the passenger Transit)
  SPRINTER: van          #  3,969
  TRANSIT CONNECT: van   #  3,086
  CITAN: car             #  2,557 — FLIPPED van→car 2026-11-09: M1 Citan Tourer; car/mercedes-benz/citan publishes (gate PASS es 43.7% M1)
  JUMPY: van             #  2,227
  VITO: car              #  2,194 — FLIPPED van→car 2026-11-09: M1 Vito Tourer; car/mercedes-benz/vito publishes (gate PASS es 51.8% M1) — the V-Class precedent
  EXPERT: van            #  1,726
  TRANSIT COURIER: van   #  1,710
  PROACE: car            #  1,498 — FLIPPED van→car 2026-11-09: M1 Proace (City) Verso; resolves to car/toyota/proace (gate PASS es 47.5% M1)
  KANGOO: car            #  1,408 — FLIPPED van→car 2026-11-09: car/renault/kangoo publishes (gate PASS es 33.4%, nl 37.5%, lu 27.4% passenger)
  CRAFTER: van           #  1,345
  BOXER: van             #    977
  TOWNSTAR: car          #    857 — genuine M1 model: 2,862 Pkw registrations in FZ 4.2 for 2025, 5/7-seat Kombi, priced incl. VAT. FLIPPED van→car 2026-11-09: car/nissan/townstar publishes (gate PASS es 80.0% M1)
  BERLINGO: car          #    722 — FLIPPED van→car 2026-11-09: car/citroen/berlingo publishes (gate PASS es/fi/lu/nl)
  TRAFIC: van            #    688
  COMBO: car             #    497 — FLIPPED van→car 2026-11-09: M1 Combo Life; car/opel/combo publishes once the ES trim folds land (gate: es 35.6% M1 Jul–Sep 2026)
  TGE: van               #    489 — MAN TGE, the VW Crafter twin (a van, unlike MAN's TG* trucks)
  MASTER: van            #    455
  DAILY: van             #    426
  RIFTER: car            #    282 — FLIPPED van→car 2026-11-09: the Rifter is a passenger-only nameplate (gb 100%, nl 99.7%, fi 98.5% passenger); car/peugeot/rifter publishes
  MOVANO: van            #    124
  DOBLO: car             #     13 — FLIPPED van→car 2026-11-09: car/fiat/doblo publishes (gate PASS gb 26.7% Cars)
  INTERSTAR: van         #      6 — no factory Pkw version (0 in FZ 4.2); these are bodybuilder conversions, but the nameplate is a van
  VIVARO: van            #      4
  SCUDO: van             #      4
  DELIVER 7: van         #      1 — one camper conversion; the nameplate is a van (maxus.de lists it under Nutzfahrzeuge only)
