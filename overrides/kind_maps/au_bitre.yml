# AU BITRE *Road Vehicles Australia* source mapping — vehicle_type → kind.
# Dataset: https://data.gov.au/data/dataset/road-vehicles-australia-january-2025
# Resource: "Registered road vehicles by vehicle type, year of manufacture,
#           motive power, make and model, 31 January 2025" (CSV, 6,077,032 B)
# Licence:  CC BY 3.0 AU (pinned as au_bitre).
#
# The whole vocabulary, MEASURED over all 102,502 data rows on 2026-09-12
# (vehicles = summed no_vehicles; rows = CSV cells):
#
#   Total                          22,305,347       1 row    ← AGGREGATE, skipped
#   Passenger vehicles             16,079,749  39,533 rows
#   Light commercial vehicles       4,195,963  11,498 rows
#   Motorcycles                       981,893  18,602 rows
#   Heavy rigid trucks                403,860  11,558 rows
#   Light rigid trucks                263,339   2,550 rows
#   Articulated trucks                128,592   4,925 rows
#   Campervans                        103,551   4,545 rows
#   Light buses                        55,760   1,125 rows
#   Heavy buses                        48,963   2,772 rows
#   Non-freight-carrying vehicles      43,677   5,393 rows
#   ─────────────────────────────────────────────────────
#   sum excluding Total            22,305,347  = the Total row exactly
#
# Ten real values plus `Total`. EVERY ONE IS MAPPED — nothing here routes to
# null, which is unusual for this project and is explained under
# "Non-freight-carrying vehicles" below.
#
# `Total` IS NOT IN THIS MAP ON PURPOSE. It is an aggregate row carrying the
# national fleet with make/model = "-", and the adapter skips it by name before
# consulting this file. Ingesting it would mint a 22.3-million-vehicle phantom
# nameplate — the same defect class as KBA's 70 "totals" rows. A key here with
# no value is treated as "declared and deliberately unmapped"; a key MISSING
# entirely raises a build warning, because that means BITRE's vocabulary moved
# and a human has to look.
#
# ── moped: AUSTRALIA CONTRIBUTES ZERO, and this is a sourcing fact ───────────
#
# `Motorcycles` is not subdivided and BITRE publishes NO engine-capacity column
# against make and model in any of its 18 resources — the attribute exists in
# NEVDIS and is simply never crossed with the nameplate. There is therefore no
# cc threshold to split on, and inferring one from model strings would be
# fabrication. All 981,893 two-wheelers land as `motorcycle`. Moped identities
# continue to come from NL/FI/ES.
#
# ── Non-freight-carrying vehicles → truck, decided by reading the rows ───────
#
# The source research contradicted itself here — the country report mapped this
# class to `truck` and the yield analysis mapped it to `null (plant/special)`,
# a 43,677-vehicle disagreement. Settled empirically rather than by preference,
# by listing what is actually in the class:
#
#   ISUZU FTS 1,860 · HINO FD 1,255 · HINO GT 1,212 · SCANIA P SERIES 1,124
#   ISUZU FRR 1,079 · HINO FG 1,061 · ISUZU FVZ 955 · FUSO FK 802
#   ISUZU FSR 796 · IVECO ACCO 751 · VOLVO FM 700 · DAF CF RANGE 652 …
#
# Those are real truck nameplates wearing special-purpose bodies (tippers,
# cranes, fire tenders), not plant. The genuine plant makes in the class —
# FRANNA 2,668 · TEREX 1,141 · LIEBHERR 898 · TADANO 688 — all publish
# `model = "UNKNOWN"` and are therefore already removed by the adapter's
# null-token filter, with no mapping decision required.
#
# Measured split: of the 43,677 vehicles, 9,365 (21.4%) are dropped by the
# UNKNOWN/null filter and 34,312 survive as 580 real (make, model) pairs.
# Mapping the class to null would have discarded those 580 pairs — including
# `volvo/fm`, a nameplate the catalog already publishes — to avoid plant that
# the null filter removes anyway. So: `truck`.
#
# ── Light commercial vehicles → van: RULED (coordinator ruling 3, 2026-10-02) ─
#
# 4,195,963 vehicles, the second-largest class. `van` follows the house
# precedent (uk_dft maps "Light goods vehicles" → van; same regulatory
# bracket), and the owner's delegate ruled it so. The class is dominated by
# UTES (HILUX, RANGER, TRITON, NAVARA, D-MAX) — the catalog already files
# those as van ids (van/toyota/hilux, van/ford/ranger …), and AU attaches to
# them: van/toyota/hilux gains au 915,472.
#
# THE 24-ID KIND MIGRATION DOES NOT HAPPEN, measured 2026-10-03. It was a
# property of AU MINTING: with AU's mass voting in cross-kind dominance, 23
# ids left their kind (measured 2026-10-03: car 14 · van 4 · truck 1 · bus 2 ·
# moped 2 — the 2026-09-12 build counted 24 (the ruling's figure), including 16 utes car→van and 4 SUVs van→car). au_bitre ships ATTACH-ONLY (see the
# adapter), and attach-only evidence does not vote in dominance (_mint_counts),
# so 0 ids move, 0 vanish, and 0 former_ids aliases are written — an alias may
# never name a live id. The cost of the ruling under attach-only: an LCV row
# whose nameplate the catalog files only as `car` (holden/colorado) attaches
# nowhere; the classified list of such kind twins is the spec for the PR that
# lifts attach-only.

kinds:
  Passenger vehicles: car
  Light commercial vehicles: van    # ruling 3 (2026-10-02); utes dominate — see header
  Campervans: van
  Motorcycles: motorcycle           # no moped split exists in this source — see header
  Heavy rigid trucks: truck
  Light rigid trucks: truck
  Articulated trucks: truck
  Non-freight-carrying vehicles: truck  # real truck nameplates; the plant in here is model=UNKNOWN
  Light buses: bus
  Heavy buses: bus

# ── by_model: KIND ROUTES for single nameplates (pipeline au_bitre.rb#rerouted_kind) ──
# Owner ruling 2026-11-10 (2026.11.4 held item 5): "AU van rows that are really
# trucks — implement a van→truck routing, curated and evidence-backed; wrong
# kind is an accuracy bug." Key = the exact raw "MAKE|MODEL" (upcased); value =
# the kind. These cab-over light trucks sit in BITRE's "Light commercial
# vehicles" class; each already publishes as a truck record (truck/<make>/<model>).
# NOT routed (needs its own ruling): Isuzu NPR/NQR/NKR — van/isuzu/npr is a
# published record from N1 (≤3.5 t) rows in other registers.
by_model:
  van:   # rows arriving in BITRE "Light commercial vehicles"; the same nameplate in another class is untouched
    # ── 2026.11.5: AUSTRALIAN UTES onto their car records (owner ruling 2026-11-09: "AU utes stay attached to
    #    their car records, with no van ids"; DECISIONS.md names Colorado and Falcon). An explicit, reviewed list:
    #    a generic "no van record" rule was reverted after review (it moved genuine vans — Kia Pregio, Ford
    #    Econovan — and people-movers). Each line: the nameplate is sold as a ute in Australia.
    "HOLDEN|COLORADO": car   # au 176,319 — Holden's ute (owner-named); https://www.goauto.com.au/used-car-research/holden/colorado.html (accessed 2026-11-10)
    "FORD|FALCON": car       # au 125,598 — the Falcon Ute (owner-named); GoAuto lists "Falcon Ute" https://www.goauto.com.au/used-car-research/ford/falcon.html (accessed 2026-11-10)
    "HOLDEN|COMMODORE": car  # au 15,350 — the Commodore ute; GoAuto "Commodore ute" https://www.goauto.com.au/used-car-research/holden/commodore.html (accessed 2026-11-10)
    "HOLDEN|CREWMAN": car    # au 14,411 — Holden's crew-cab Commodore ute; https://www.goauto.com.au/used-car-research/holden/crewman.html (accessed 2026-11-10)
    "HOLDEN|KINGSWOOD": car  # au 1,069 — the Kingswood ute / panel van; https://www.goauto.com.au/used-car-research/holden/kingswood.html (accessed 2026-11-10)
    "MAZDA|B2600": car       # au 15,037 — Mazda B-series (Bravo) ute: "the pickup and cab-chassis bodied Mazda" https://www.goauto.com.au/used-car-research/mazda/bravo.html (accessed 2026-11-10)
    "MAZDA|B3000": car       # au 84,084 — Mazda B-series (Bravo) ute; same page
    "MAZDA|B4000": car       # au 844 — Mazda B-series (Bravo) ute; same page
    "ISUZU|NPS": truck     # au 334 — Isuzu AU: NPS/NQS 4x4 light-duty truck (https://www.isuzu.com.au/news/news-articles/trucksales-reviews-the-2026-nps-nqs-models/, accessed 2026-11-10)
    "ISUZU|ELF": truck     # au 246 — Isuzu AU: "Isuzu Elf truck range, also known outside of Japan as the N Series" (https://www.isuzu.com.au/news/news-articles/nations-most-popular-truck-range-turns-60/, accessed 2026-11-10)
    "HYUNDAI|MIGHTY": truck  # au 138 — Hyundai AU: "MIGHTY Electric truck" (https://www.hyundai.com/au/en/news/vehicles/hyundai-confirms-pricing-servicing-warranty-and-dealer-details-for-mighty-electric-truck, accessed 2026-11-10)
    "NISSAN|ATLAS": truck  # au 275 — Nissan press release "Nissan Atlas F24" light-duty truck (https://global.nissannews.com/en/releases/100924-01-e, accessed 2026-11-10)
    "MAZDA|TITAN": truck   # au 147 — Mazda: "all-new Titan cab-over truck series" (https://newsroom.mazda.com/en/publicity/release/2000/200005/0525ae.html, accessed 2026-11-10)
    "MAZDA|T3000": truck   # au 129 — Titan payload code (renames.yml Mazda T3000 → Titan); same Mazda release
    "MAZDA|T3500": truck   # au 683 — Titan payload code; same Mazda release
    "MAZDA|T4000": truck   # au 402 — Titan payload code; same Mazda release
    "MAZDA|T4100": truck   # au 15 — Titan payload code; same Mazda release
    "MAZDA|T4600": truck   # au 343 — Titan payload code; same Mazda release
