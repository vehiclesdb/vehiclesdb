# plates/mt.yml — Malta (PRD-PLATES gate L1, wave 2).
#
# THE INTERESTING THING ABOUT MALTA IS THE LETTER BLOCK, AND IT IS PUBLISHED.
# Most small jurisdictions allocate class-marking letters by unpublished
# administrative practice. Malta does not: regulation 31 of S.L. 368.02, headed
# "Particular registration marks", enumerates the blocks in binding subsidiary
# legislation, block by block, with the vehicle class each denotes. That
# regulation is quoted verbatim in the series below and is the backbone of this
# file. Everything here is primary — legislation.mt, consolidated to 23-01-2026
# — and no secondary source was needed except for ONE table, flagged where it
# appears.
#
# ============================================================================
# THE INSTRUMENT CHAIN, AND A CORRECTION TO THE OBVIOUS GUESS
# ============================================================================
# Plates are NOT under Cap. 65 (the Traffic Regulation Ordinance, 1931). They
# were until 2004 and are not now; L.N. 476 of 2004 reg. 52 deleted the plate
# regulations out of S.L. 65.11. All current plate law is in ONE instrument:
#
#   * CAP. 368 — Motor Vehicles Registration and Licensing Act (Act X of 1994,
#     in force 1-1-1994). The parent Act. Art. 20 is the regulation-making
#     power; art. 8(4) creates the weekend/high-emission regime; art. 25 (added
#     by Act XIII of 2015) creates the vintage regime.
#   * S.L. 368.02 — Registration and Licensing of Motor Vehicles Regulations,
#     originating as L.N. 198 of 2009, deemed in force 1-1-2009 (save reg. 6(3),
#     1-8-2009). THE MASTER INSTRUMENT. Reg. 30 + First Schedule (mark formats
#     and fees), reg. 31 (the letter blocks), reg. 32 (display), reg. 34 +
#     Second Schedule (plate specification), reg. 36/36A (trade and temporary
#     plates), reg. 6C/6D (weekend and vintage).
#     Amended by L.N. 110 and 195 of 2011, 127 of 2013, 178 and 342 of 2015,
#     125 of 2017, 139 of 2018, 265 of 2022, 340 of 2024, 160 and 262 of 2025,
#     21 of 2026, and by Act XV of 2009 and Act XXI of 2020.
#   * S.L. 499.59 — Taxi Services Regulations (L.N. 369 of 2010), which govern
#     the taxi mark and are the ONLY place Maltese law encodes geography.
#
# THE REVOCATION CHAIN, walked instrument by instrument, because it is what
# dates the series:
#   Motor Vehicles Regulations 1948
#     -> repealed by L.N. 128 of 1994 (Motor Vehicles Regulations 1994, S.L.
#        65.11), made by the COMMISSIONER OF POLICE with the Traffic Control
#        Board under s.17 of the Ordinance;
#     -> L.N. 114 of 2004, Vehicles Identification Plates Regulations, IN FORCE
#        9 MARCH 2004 — the FIRST published prescription of the three-letter,
#        three-digit format;
#     -> L.N. 476 of 2004, in force 1 MAY 2004 (Malta's EU accession day),
#        which revoked L.N. 114 of 2004 and introduced the EU band;
#     -> L.N. 198 of 2009 reg. 45 revoked L.N. 476 of 2004; it is today's
#        S.L. 368.02.
#
# ============================================================================
# THE BIG SOURCED NEGATIVE: BEFORE 2004 MALTA PUBLISHED NO PLATE FORMAT
# ============================================================================
# The same finding this wave made in Cyprus, reached the same way — by reading
# the delegating provision rather than by failing to find a schedule. L.N. 128
# of 1994, reg. 32, verbatim:
#
#   "Each identification number and letter shall be assigned to a motor vehicle
#    by the Commissioner of Police. The dimensions of any letter figure of the
#    identification number of any motor vehicle, the total width of the space
#    taken by any such letter figure and the space between any two such letter
#    figures shall be those as may be determined FROM TIME TO TIME BY THE
#    COMMISSIONER OF POLICE on the advice of the Traffic Control Board or, in
#    the case of public transport vehicles, by the Public Transport Authority."
#
# And reg. 31: "Every motor vehicle shall bear an identification number which
# will be allotted to it and issued by the Commissioner of Police" — with no
# format prescribed anywhere.
#
# CONSEQUENCE: the 1952, 1979 and 1995 series changes were ADMINISTRATIVE
# DECISIONS of the Commissioner of Police under a delegating regulation. There
# is no instrument to date them from. Every pre-2004 series below is therefore
# `matching: recall-only` with `period_evidence: secondary-dated`, and their
# boundaries are observational, not legislated. That is a well-evidenced gap:
# all 30 Cap. 65 subsidiary instruments and both Cap. 368 ones were enumerated
# and the whole 1948->2009 revocation chain was walked to establish it.
#
# ============================================================================
# THREE SECONDARY CLAIMS THIS FILE REFUTES FROM THE PRIMARY
# ============================================================================
# 1. "GVH = Department of Health." FALSE. Reg. 31(2): GVH is Government
#    HEAVY vehicles, GVN is other Government vehicles. There is no health block.
# 2. "Trailers begin with TR." FALSE — there is no Maltese trailer mark at all.
#    Reg. 32(4) makes a trailer display THE TOWING VEHICLE'S mark.
# 3. "Malta mandates FE-Schrift." NOT IN LAW. No typeface is named anywhere in
#    Maltese plate law; see the font block on mt-standard-2004.
# A fourth, "vintage plates went silver-on-black in 2017", is off by a year AND
# omits an entire intermediate design — they were GREEN from 2015 and became
# silver-on-black in 2018. Both steps are instrument-dated below.
#
# ============================================================================
# WHAT MALTESE LAW DOES **NOT** SPECIFY — a sourced negative worth shipping
# ============================================================================
# The Second Schedule to S.L. 368.02 prescribes NO OVERALL PLATE DIMENSIONS,
# NO CHARACTER HEIGHT and NO CHARACTER STROKE WIDTH. It gives two diagrams
# (bitmaps reading "MAL 777", with no dimensional annotations), a 5 mm black
# border, "metal material", the colours, and detailed geometry for the EU band
# ONLY. The 520 x 110 mm that circulates for Malta is NOT a Maltese legal
# requirement; it is the European convention. This file therefore carries no
# `design.plate` dimensions for any series, and that absence is deliberate and
# sourced rather than a gap in research.
#
# COLOUR POLICY: the Second Schedule names plate colours in words ("black
# characters ... on white reflective material", "silver characters on a black
# background", "red characters") with no chromaticity data. The ONE numeric
# colour in Maltese plate law is the euroband blue, given as a MUNSELL
# reference — "Retro-reflecting blue background (Munsell reference 5, 9 pb
# 3,4/15,1)" — which is a colour-order-system notation, not an sRGB value and
# not a CIE box. It is recorded verbatim on the band as `color_spec_munsell`;
# the hex beside it stays `hex_basis: observed`.
jurisdiction: mt
authority:
  name: Transport Malta / Authority for Transport in Malta — Motor Vehicles Registration and Licensing Act (Cap. 368) and S.L. 368.02
  url: "https://legislation.mt/eli/sl/368.2/eng"
binding: vehicle

letter_blocks:
  note: >-
    THE CENTRE OF THIS FILE. S.L. 368.02 reg. 31, "Particular registration
    marks", is the published allocation of letter blocks to vehicle classes.
    Reg. 31(1) opens: "Registration marks allotted to vehicles used for hire or
    for reward shall include the following Roman Alphabet letters followed by
    three numbers". Note the drafting convention that runs through it: "a
    letter followed by the letters XX" means a VARIABLE leading letter plus a
    fixed two- or three-letter block, so the printed mark is four characters
    (e.g. a route bus is [letter]BUS); where the text says only "the letters
    XXX", the block is the whole letter group. That distinction is what makes
    the regex families below three-or-four letters wide.
  source: "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31, consolidated to 23-01-2026; text served as PDF from https://legislation.mt/getpdf/6980741263aaee247463a137"
  hire_or_reward:            # reg. 31(1), each entry quoted from the regulation
    - { block: BUS, leading_letter: true, meaning: "route buses", verbatim: "a letter followed by the letters BUS in the case of route buses" }
    - { block: PY, leading_letter: true, meaning: "passenger transport vehicles other than route buses (coaches)", verbatim: "a letter followed by the letters PY in the case of passenger transport vehicles other than route buses" }
    - { block: LY, leading_letter: true, meaning: "light passenger transport vehicles", verbatim: "a letter followed by the letters LY in the case of light passenger transport vehicles" }
    - { block: XY, leading_letter: true, meaning: "vintage buses", verbatim: "a letter followed by the letters XY in the case of vintage buses" }
    - { block: QZ, leading_letter: true, meaning: "motor vehicles used for hire or leasing", verbatim: "a letter followed by the letters QZ in the case of motor vehicles used for hire or leasing" }
    - { block: HQ, leading_letter: true, meaning: "carriage of goods by hauliers operating nationally", verbatim: "a letter followed by the letters HQ in the case of vehicles used for the carriage of goods by hauliers operating nationally" }
    - { block: OY, leading_letter: true, meaning: "open-top buses", verbatim: "a letter followed by the letters OY in respect of open-top buses" }
    - { block: RY, leading_letter: true, meaning: "trackless trains", verbatim: "a letter followed by the letters RY in respect of trackless trains" }
    - { block: HRS, leading_letter: false, meaning: "motor hearses", verbatim: "the letters HRS in the case of motor hearses" }
    - { block: CABS, leading_letter: false, meaning: "electric mini cabs", verbatim: "the letters CABS in the case of electric mini cabs" }
    - { block: TEY, leading_letter: false, meaning: "electric trolley vehicles", verbatim: "the letters TEY in respect of electric trolley vehicles", added_by: "L.N. 139 of 2018" }
    - { block: MHY, leading_letter: false, meaning: "Malta heritage buses", verbatim: "the letters MHY in respect of Malta heritage buses", added_by: "L.N. 139 of 2018" }
    - { block: CSH, leading_letter: false, meaning: "car sharing vehicles", verbatim: "the letters CSH in respect of car sharing vehicles", added_by: "L.N. 139 of 2018" }
    - { block: "TAXI M", leading_letter: false, meaning: "taxis operated in Malta", note: "reg. 31(1) writes 'the letters TAXI M followed by three numerical figures'; S.L. 499.59 puts the M AFTER the digits and governs — see mt-taxi-2010" }
    - { block: "TAXI G", leading_letter: false, meaning: "taxis operated in Gozo", note: "same conflict as TAXI M" }
  official:                  # reg. 31(2)-(7)
    - { block: GVH, meaning: "Government Department, HEAVY vehicles", verbatim: "the three Roman Alphabet letters GVH followed by three numbers in the case of heavy vehicles", correction: "NOT 'Department of Health' — that is a persistent secondary error" }
    - { block: GVN, meaning: "Government Department, other vehicles", verbatim: "the letters GVN followed by three numbers in the case of other vehicles" }
    - { block: GVP, meaning: "Police Department", verbatim: "Motor vehicles registered and licensed in the name of the Police Department shall be allotted registration marks with the three Roman Alphabet letters GVP followed by three numbers" }
    - { block: GVA, meaning: "Armed Forces of Malta", verbatim: "Motor vehicles registered and licensed in the name of the Armed Forces of Malta shall be allotted registration marks with the three Roman Alphabet letters GVA followed by three numbers" }
    - { block: CD, leading_letter: false, meaning: "diplomatic representations in Malta", verbatim: "the letters CD followed by another letter and three numbers" }
    - { block: DMS, meaning: "staff of diplomatic missions", verbatim: "the letters DMS followed by three numbers" }
    - { block: GV, leading_letter: true, meaning: "N1 vehicles with a seating capacity of not more than two persons", verbatim: "The registration marks for N1 vehicles with a seating capacity of not more than two persons shall be a letter followed by the letters GV and three numbers", note: "so a BARE [x]GV mark is a small van, NOT a government vehicle — the government blocks are the three-letter GVN/GVH/GVP/GVA. This is the subtlest trap in the Maltese system" }
  ministerial:
    block: "GM"
    verbatim: "any motor vehicle assigned to a Government Minister and bearing, instead of its identification number, the letters G.M."
    source_reg: "S.L. 368.02 reg. 17(3); the same wording goes back to L.N. 128 of 1994 reg. 28(2)"
    note: >-
      THE INSTRUMENT PRINTS IT WITH FULL STOPS — "G.M." — and the mark REPLACES
      the identification number rather than accompanying it. The full stop is
      not in this dataset's serial alphabet and is in the forgiving set
      (plates/_meta/separators.yml), so the block is recorded here as GM. Not
      authored as a series: reg. 17(3) prescribes no digits and the mark is a
      substitution for a number rather than a number, so there is no pattern to
      write. Secondary sources describe a "GM 99" form; no instrument supports
      the two digits.
  lapsed:
    note: "blocks that were prescribed and then withdrawn — kept because plates issued under them remain on the road, exactly as the period discipline in PRD-PLATES §2.4 requires for decode rows"
    blocks:
    - { block: BY, meaning: "route buses", period: "2004-2018", note: "replaced by BUS by L.N. 139 of 2018 s.4(a). The familiar DBY / EBY / FBY marks of the old Malta buses are instances of this rule with a varying leading letter — not three separate blocks" }
    - { block: CY, meaning: "coaches", period: "2004-2011", note: "replaced by PY by L.N. 110 of 2011 s.6(b)" }
    - { block: MY, meaning: "minibuses and midibuses", period: "2004-2011", note: "replaced by LY" }
    - { block: SY, meaning: "special minibuses", period: "2004-2011", note: "replaced by XY" }
    - { block: VY, meaning: "vans", period: "2004-2011", note: "replaced by the GV N1 rule" }
    - { block: GY, meaning: "public hire vehicles driven by the service operator or his employee (chauffeur-driven)", period: "2004-2011", note: "deleted by L.N. 110 of 2011 s.6(f). Cap. 368 Fifth Schedule Category E(4) still refers to a mark 'having one letter followed by the letters GY prior to the 1st January, 2010'" }
    - { block: TY, meaning: "taxicars in Malta", period: "2004-2011", note: "replaced by TAXI M" }
    - { block: WY, meaning: "taxicars in Gozo", period: "2004-2011", note: "replaced by TAXI G. TY/WY were the earlier Malta/Gozo geographic pair" }
    - { block: K, leading_letter: false, meaning: "self-drive motor vehicles including motor cycles", period: "2004-2011", note: "'two letters followed by the letter K'; deleted by L.N. 110 of 2011. Cap. 368 Fifth Schedule Category E(3) refers to it 'prior to the 1st January, 2010'" }
    - { block: RIP, meaning: "motor hearses", period: "2004-2009", note: "replaced by HRS in L.N. 198 of 2009" }
    - { block: TF, meaning: "vehicles exempt from duty and/or registration tax", period: "2004-2009", note: "L.N. 476 of 2004 reg. 33(6): 'the first two letters TF followed by another letter and three numbers'. Dropped entirely in 2009 — so the widely-repeated 'TF = tax-free' is true only of 2004-2009 plates" }
  not_found:
    note: >-
      Claims searched for in Cap. 368, S.L. 368.02, L.N. 198/2009, L.N. 476/2004
      and L.N. 128/1994, with zero hits in every instrument:
      POSTA (mobile post offices) — no instrument;
      TR / TRL (trailers) — no instrument, and affirmatively contradicted by
      reg. 32(4), which makes a trailer carry the TOWING vehicle's mark;
      any AGRICULTURAL series — "agricultural tractor" is defined in reg. 2 but
      no plate series attaches to it;
      any distinct MOPED series — mopeds fall under the general motorcycle rule;
      the historical YELLOW rental and RED taxi/bus PLATE colours — the nearest
      primary is a DOOR-MARKING rule (S.L. 499.59 reg. 24(5)) requiring the
      taxi's progressive number painted black-on-white in Malta and
      red-on-white in Gozo, 75 mm high, which must not be conflated with plate
      colour.

series:

  # =========================================================================
  # THE CURRENT ORDINARY SERIES — three letters, a gap, three digits.
  # =========================================================================
  - id: mt-standard-2004
    class: standard
    categories: [car, van, truck, motorcycle]
    period: { start: 2004 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} \d{3}\z'
      charset:
        notes: >-
          NO LETTER EXCLUSIONS. Malta prescribes "three Roman Alphabet
          characters" and excludes nothing — no vowel rule, no I/O/Q rule. That
          is a sourced negative and it is unusual for Europe; contrast Spain
          (20 letters), Italy (22), Greece (14) and Cyprus (12). Consequently
          there is no regex_strict: `regex` already IS the sourced grammar, the
          §2.7 case where a strict twin would add nothing.
        digits: "three Arabic numerals; no range stated, so no leading-zero claim is made"
      pattern_source: >-
        First Schedule to S.L. 368.02, "Standard Alphanumeric Format (Random)",
        verbatim: "Composed of two sets of three characters each, the first set
        composed of three Roman Alphabet characters and the second set composed
        of three Arabic numerals, e.g. XXX 111." The wording originates in the
        First Schedule to L.N. 114 of 2004.
      progression: >-
        RANDOM, and the instrument says so in the format's own name — "Standard
        Alphanumeric Format (RANDOM)". There is no sequential progression to
        infer an era from, which makes a Maltese standard mark undatable from
        the string alone. The one piece of structure is the first letter, and it
        encodes a MONTH rather than a year or a place — see month_encoding.
      separator_note: >-
        No separator glyph is prescribed. The First Schedule's own example is
        written "XXX 111" with a gap and the Second Schedule requires "a
        watermark in the space between the letters and the numbers" — so the gap
        is a real, specified feature of the plate that is occupied by a security
        watermark, not merely typographic whitespace. The emitted SPACE is the
        correct encoding, and it is the same situation as the Italian marchio
        and the German Plaketten: something sits IN the gap, and it is not part
        of the serial.
    month_encoding:
      rule_verbatim: "Where the registration mark is of the Standard Alphanumeric Format (Random) type, the first letter shall stand for the month in which the licence of the vehicle shall be renewed."
      rule_source: "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02, First Schedule, final line; introduced by L.N. 195 of 2011 when it substituted the First Schedule"
      rule_evidence: instrument-in-force
      note: >-
        THE MOST MISREPORTED FACT ABOUT MALTESE PLATES. The leading letter is a
        CALENDAR code — the month the annual licence falls due — and is
        routinely described as a regional code. It is not: Malta encodes no
        geography in an ordinary mark at all (see region_encoding). Note the
        consequence for a parse API: the leading letter is the ONE decodable
        field of a Maltese standard mark, and what it decodes to is a renewal
        month, which changes nothing about where or when the vehicle was
        registered.
      table_evidence: secondary-wikipedia
      table_note: >-
        THE RULE IS PRIMARY; THE MAPPING BELOW IS NOT. S.L. 368.02 states THAT
        the first letter stands for the renewal month but does not publish WHICH
        letter means which month — the assignment is presumably administrative.
        The twelve rows below are therefore `secondary-wikipedia` and are the
        only secondary data in this file. They are internally consistent
        (A-L cover January-December, M-X repeat the cycle, Y and Z extend it to
        January and February, exhausting all 26 letters exactly), which is
        corroboration but not a source.
      table_source: "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Malta  # revision 1365210379 of 2026-07-21T00:33:53Z, fetched as wikitext 2026-08-02. secondary-wikipedia"
      months:
        - { month: 1,  name: January,   letters: [A, M, Y] }
        - { month: 2,  name: February,  letters: [B, N, Z] }
        - { month: 3,  name: March,     letters: [C, O] }
        - { month: 4,  name: April,     letters: [D, P] }
        - { month: 5,  name: May,       letters: [E, Q] }
        - { month: 6,  name: June,      letters: [F, R] }
        - { month: 7,  name: July,      letters: [G, S] }
        - { month: 8,  name: August,    letters: [H, T] }
        - { month: 9,  name: September, letters: [I, U] }
        - { month: 10, name: October,   letters: [J, V] }
        - { month: 11, name: November,  letters: [K, W] }
        - { month: 12, name: December,  letters: [L, X] }
    design:
      plate:
        note: >-
          NO PLATE DIMENSIONS EXIST IN MALTESE LAW — a sourced negative, not a
          gap. The Second Schedule requires only that the plate be rectangular
          and "correspond with either diagram No 1 or diagram No 2 shown below";
          the diagrams are bitmaps showing specimen plates reading "MAL 777"
          with no dimensional annotations. No overall size, no character height
          and no stroke width appear anywhere. The 520 x 110 mm commonly quoted
          for Malta is the European convention, not a Maltese requirement, and
          is deliberately NOT recorded here as a fact.
      material: "metal — Second Schedule, verbatim: 'The plate shall be made from metal material.'"
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      foreground_note: >-
        Second Schedule, verbatim: "The registration mark, with the exception of
        vintage vehicles and vehicles registered in terms of article 8(4) of the
        Act, shall be formed of black characters and shall be exhibited on white
        reflective material in such a way that the black characters will at all
        times appear on a white background."
      border: { color: "#000000", width: 5, unit: mm, note: "Second Schedule, verbatim: 'The periphery of the plate shall be marked all around by a black border having a stroke width of 5 millimetres.'" }
      security: { watermark: true, note: "Second Schedule: 'There shall be a watermark in the space between the letters and the numbers.' The watermark occupies the printed gap — see format.separator_note" }
      content_restriction: >-
        Second Schedule, verbatim and with its own typo preserved: "The plate on
        which a registration mark is exhibited shall not contain any words,
        letters, numbers, emblems or other marks of any kind other THEN those
        required under these regulations." [sic — "other then"]. So Malta
        forbids dealer legends, national emblems and slogans on the plate by
        express prohibition, which is a stronger position than most.
      band:
        side: left
        color: "#003399"
        hex_basis: observed
        color_spec_munsell: "5, 9 pb 3,4/15,1"
        content: eu-stars+M
        h_min: 98
        w: [40, 50]
        unit: mm
        note: >-
          The best-specified object in Maltese plate law, and the only place it
          gives geometry. Second Schedule, verbatim: "Colours: 1.
          Retro-reflecting blue background (Munsell reference 5, 9 pb 3,4/15,1)
          2. 12 retro-reflecting yellow stars 3. Retro-reflecting distinguishing
          sign of Malta, of a white colour"; "The blue background shall be not
          less than 98mm in height, with a width of not less than 40 mm and not
          more than 50 mm"; "The centrepoints of the 12 stars shall form a
          circle with a 15 mm radius and the straight forming the apexes of the
          stars shall be 4 mm to 5 mm in length"; "The distinguishing sign of
          Malta shall have a height of 20 mm and a stroke width of between 4 mm
          and 5 mm, and shall appear underneath the circle of stars." Reduced
          proportionally on two-line and motorcycle plates. NOTE the Munsell
          reference: it is a colour-order-system notation, NOT an sRGB value and
          NOT a CIE box, so it constrains a colour without yielding a hex — the
          hex beside it stays `observed`, exactly as the Spanish CIE boxes do.
          The distinguishing sign is the letter M, and it is WHITE by
          specification rather than taking the ground colour — which is the
          opposite of the Greek and Cypriot rule.
        statutory_hook: "S.L. 368.02 reg. 32(2), verbatim: 'Besides the registration mark, the plate shall also bear the international distinguishing sign of Malta in accordance with Council Regulation (EC) No 2411/98 on the recognition in intra-Community traffic of the distinguishing signs of the Member States in which motor vehicles and their trailers are registered.'"
      font:
        name: "not named by any instrument"
        note: >-
          REFUTED SECONDARY CLAIM. Malta is widely said to mandate FE-Schrift.
          No typeface is named anywhere in Maltese plate law — the entire Second
          Schedule was read and its diagram pages rendered as images to check
          for annotations. Unlike Cyprus, which at least publishes drawn
          specimens, Malta publishes neither a name nor a dimensioned drawing.
          The letterforms are therefore, on the face of the law, unconstrained.
          PRD-PLATES §6 posture: the render layer picks a free face and records
          the substitution, because there is no statutory drawing to derive from.
        license: "n/a — nothing prescribed"
      rear_differs: false
    region_encoding: none
    region_encoding_note: >-
      NONE IN AN ORDINARY MARK — a sourced negative. Malta encodes no geography
      in the standard series; the leading letter is a renewal MONTH (see
      month_encoding), which is the fact most often misreported as a regional
      code. The ONLY geographic encoding anywhere in Maltese plate law is the
      taxi M/G suffix for Malta and Gozo (see mt-taxi-2010), and its lapsed
      predecessor pair TY/WY.
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02, consolidated to 23-01-2026 (PDF: https://legislation.mt/getpdf/6980741263aaee247463a137): reg. 30 + First Schedule (the Standard Alphanumeric Format and the renewal-month rule); reg. 31 (letter blocks); reg. 32(2) (the EU distinguishing sign); reg. 34 + Second Schedule (plate specification, colours, border, watermark, band geometry). Accessed 2026-08-02"
      - "https://legislation.mt/eli/ln/2004/114/eng  # L.N. 114 of 2004, Vehicles Identification Plates Regulations — THE PERIOD START: 'These regulations shall come into force on the 9th March 2004', and the First Schedule's first published statement of the three-letter/three-digit format"
      - "https://legislation.mt/eli/ln/2004/476/eng  # L.N. 476 of 2004, in force 1-5-2004: introduced the EU band in its Second Schedule and revoked L.N. 114 of 2004; reg. 52 also deleted the plate rules from the 1994 Motor Vehicles Regulations"
      - "https://legislation.mt/eli/ln/2009/198/eng  # L.N. 198 of 2009: 'deemed to have come into force on the 1st January, 2009 save for sub-regulation (3) of regulation 6 which shall come into force on the 1st August, 2009'; reg. 45 revoked L.N. 476 of 2004. Carried the format and band forward unchanged"
      - "https://legislation.mt/eli/cap/368/eng  # Cap. 368, Motor Vehicles Registration and Licensing Act (Act X of 1994, in force 1-1-1994): art. 20 the regulation-making power"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Malta  # secondary-wikipedia, ONE item only: the letter-to-month mapping table in month_encoding.months, which no instrument publishes. Revision 1365210379 of 2026-07-21T00:33:53Z"
    notes: >-
      THE CURRENT MALTESE SERIES. PERIOD START 9 MARCH 2004, the commencement of
      L.N. 114 of 2004, which is the first instrument ever to prescribe a plate
      FORMAT in Malta. A GRANULARITY NOTE THE SCHEMA FORCES AND THAT IS WORTH
      STATING: the EU band did not arrive with that instrument but with L.N. 476
      of 2004 on 1 MAY 2004, Malta's EU accession day — so there was a
      seven-week window in which this exact format was issued WITHOUT the band.
      That is a genuine design difference and under PRD-PLATES §2.3 it would
      merit its own series, but `period` is modelled in INTEGER YEARS and both
      dates fall in 2004, so the two are indistinguishable in this schema and
      are recorded as one series with the sequence written into the sources
      above. The three-letter/three-digit shape itself is older than 2004 —
      administratively from about 1995 (see mt-standard-1995) — so 2004 dates
      the LEGISLATION, not the look. NOTHING IN THE STRING DATES A MALTESE
      PLATE: allocation is expressly random.

  # =========================================================================
  # TAXIS — the only geography in Maltese plate law, and a live conflict.
  # =========================================================================
  - id: mt-taxi-2010
    class: taxi
    categories: [car]
    period: { start: 2010 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "TAXI 999 L"
      regex: '\ATAXI \d{3} [A-Z]\z'
      regex_strict: '\ATAXI \d{3} [GM]\z'
      charset:
        notes: "the suffix is M for Malta or G for Gozo and nothing else; regex_strict carries that closed pair, which `regex` cannot because the lint's generator emits all 26 letters for an L"
        digits: "001 onwards; see progression for the three separate ranges"
      progression: >-
        S.L. 499.59 reg. 24 splits the numbering three ways, verbatim: taxis
        already licensed in MALTA when the regulations commenced take "three
        numbers from '001' to '200' followed by the letter 'M'"; taxis licensed
        in GOZO take "three numbers commencing from '001' onwards followed by
        the letter 'G'"; and taxis granted a NEW Malta licence after
        commencement take "three numbers commencing from '201' onwards followed
        by the letter 'M'". So on the Malta side the number band 001-200 versus
        201+ separates pre- from post-2010 licences, which is a genuine age
        signal — the only one in the Maltese system.
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      note: >-
        No distinct taxi PLATE colour is prescribed. The Second Schedule's
        black-on-white rule excepts only vintage and art. 8(4) vehicles, so
        taxis take the ordinary colours. The red/black distinction that exists
        for Maltese taxis is a DOOR MARKING, not a plate: S.L. 499.59 reg. 24(5)
        requires the progressive number "painted by the licence holder in black
        on a white background in respect of taxis licensed to be used only in
        Malta and in red on a white background in respect of taxis licensed to
        be used only in Gozo", 75 mm high and not more than 60 mm wide. Recorded
        here precisely so a render layer does not colour the plate.
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: inline
    region_encoding_mechanism: >-
      THE ONLY GEOGRAPHIC ENCODING IN MALTESE PLATE LAW. Suffix M = the island
      of Malta; suffix G = Gozo. Two rows, so inline rather than a decode file.
      Its lapsed predecessor was a PREFIX pair on the ordinary format: [x]TY for
      taxicars in Malta and [x]WY for taxicars in Gozo (L.N. 476 of 2004 reg.
      33(1)(vii)-(viii), carried into L.N. 198 of 2009 reg. 31(1)(vii)-(viii)),
      replaced by TAXI M / TAXI G by L.N. 110 of 2011.
    region_codes:
      - { code: M, area: "Malta (island)" }
      - { code: G, area: "Gozo" }
    sources:
      - "https://legislation.mt/eli/sl/499.59/eng  # S.L. 499.59, Taxi Services Regulations (L.N. 369 of 2010), reg. 24(1)-(3): the TAXI + three digits + M/G form and the three numbering bands; reg. 24(5) the door-marking rule. Commencement stated on the consolidation: 1st November 2010; 1st May 2011; 1st November 2011. PDF: https://legislation.mt/getpdf/6131f456a77e7700c82a9fb7"
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31(1)(v)-(vi) and its First Schedule, which defers to the Taxi Services Regulations — 'Composed as prescribed in the Taxi Services Regulations. (S.L. 499.59)' — and sets the taxi plate fee at EUR 60 per pair"
    notes: >-
      A LIVE CONFLICT BETWEEN TWO INSTRUMENTS, RECORDED AND RESOLVED RATHER THAN
      AVERAGED. S.L. 368.02 reg. 31(1)(v) describes the mark as "the letters
      TAXI M followed by three numerical figures" — letter BEFORE the digits.
      S.L. 499.59 reg. 24(1) describes it as "TAXI" followed by three numbers
      "followed by the letter 'M'" — letter AFTER the digits. They cannot both
      be right. The resolution is internal to the instruments: the First
      Schedule to S.L. 368.02 expressly defers the taxi mark's composition to
      S.L. 499.59, so the Taxi Services Regulations govern and the real printed
      form is TAXI 123 M. This file follows that, and records the conflict so a
      verifier meeting reg. 31(1)(v) does not think the dataset is wrong.
      PERIOD: 2010, the commencement of S.L. 499.59; the regulations carry three
      commencement dates (1-11-2010, 1-5-2011, 1-11-2011) for different Parts
      and the plate provision is not separately dated among them, so the
      earliest is taken and the ambiguity is recorded here.

  # =========================================================================
  # THE HIRE-OR-REWARD FAMILY — one recall-only union over fifteen blocks.
  # =========================================================================
  - id: mt-hire-reward-2009
    class: taxi
    categories: [bus, coach, van, truck, car]
    period: { start: 2009 }
    period_evidence: enacted-commencement
    matching: recall-only
    format:
      pattern: "LLLL 999"
      regex: '\A[A-Z]{3,4} \d{3}\z'
      pattern_note: >-
        A UNION OVER THE reg. 31(1) BLOCKS, hence recall-only. The family spans
        three-letter fixed blocks (HRS, TEY, MHY, CSH) and four-letter
        leading-letter-plus-block marks ([x]BUS, [x]PY, [x]LY, [x]XY, [x]QZ,
        [x]HQ, [x]OY, [x]RY) plus the four-letter CABS, so the regex accepts
        three or four letters and three digits. A match says only "this string
        has the shape of a Maltese hire-or-reward mark" — it cannot tell you
        which block, and it will also match plenty of strings that are not in
        any block. The blocks themselves are enumerated, verbatim and with their
        meanings, in the file-level letter_blocks section; that table is the
        real content and this series is the matcher for it. Taxis are excluded
        here and modelled separately because their form differs (mt-taxi-2010).
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
      note: "no distinct colour is prescribed for any hire-or-reward class — the Second Schedule's black-on-white rule excepts only vintage and art. 8(4) vehicles"
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31(1), every block quoted verbatim in letter_blocks.hire_or_reward"
      - "https://legislation.mt/eli/ln/2011/110/eng  # L.N. 110 of 2011 s.6: the 2011 rewrite (CY->PY, MY->LY, SY->XY, VY->GV, GY deleted, TY/WY->TAXI M/TAXI G, CABS added)"
      - "https://legislation.mt/eli/ln/2018/139/eng  # L.N. 139 of 2018 (Government Gazette 19,984, 27-04-2018) s.4: BY->BUS, and the addition of TEY, MHY and CSH"
    notes: >-
      MALTA'S PUBLIC-TRANSPORT AND HIRE MARKS, as one recall-only series over a
      published block list. CLASS CAVEAT, and it is now the THIRD time this wave
      has hit it: `_meta/classes.yml` has no class for "public service /
      hire-or-reward", so `taxi` is recorded as the nearest member and badly
      understates a family that is mostly buses, coaches, hearses, trolleys and
      car-sharing vehicles. Greece's Δ.Χ. and Cyprus's yellow class have exactly
      the same problem. A `public-service` class is flagged as a vocabulary gap
      from all three files. PERIOD: 2009, the commencement of the instrument
      that carries the current reg. 31; individual blocks arrived and lapsed at
      dated points recorded in letter_blocks, and the 2004-2009 predecessor list
      is recorded there too under `lapsed` rather than authored as its own
      series, because its plates are on the same base design.

  # =========================================================================
  # OFFICIAL SERIES — GVN/GVH/GVP/GVA, and the N1 [x]GV trap.
  # =========================================================================
  - id: mt-government-2009
    class: government
    categories: [car, van, truck, bus]
    period: { start: 2009 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "GVL 999"
      regex: '\AGV[A-Z] \d{3}\z'
      regex_strict: '\AGV[AHNP] \d{3}\z'
      charset:
        notes: >-
          The four official three-letter blocks of reg. 31(2)-(4): GVN
          (Government Department, other vehicles), GVH (Government Department,
          HEAVY vehicles), GVP (Police Department), GVA (Armed Forces of Malta).
          regex_strict carries exactly those four; `regex` is the GV+any-letter
          shape, which is deliberately looser because reg. 31(7) puts ordinary
          N1 small vans on a [letter]GV mark and a consumer needs to see the
          collision rather than have it hidden.
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
      note: "no distinct colour: Malta marks officialdom by letter block only, unlike Cyprus, which gives Ministry vehicles an orange plate"
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31(2) (GVH heavy / GVN other), reg. 31(3) (GVP police), reg. 31(4) (GVA Armed Forces), all quoted verbatim in letter_blocks.official; reg. 31(7) the [x]GV N1 rule"
    notes: >-
      MALTESE OFFICIAL MARKS. TWO TRAPS, both sourced. FIRST: GVH is GOVERNMENT
      HEAVY VEHICLES, not the Department of Health — the "health" reading is a
      persistent secondary error and there is no health block at all. SECOND,
      and subtler: reg. 31(7) allots "a letter followed by the letters GV and
      three numbers" to N1 vehicles with not more than two seats, so an ordinary
      small van carries a mark like XGV 123 that LOOKS official and is not. The
      discriminator is position — the government blocks are three letters
      beginning GV (GVN 123), the van rule is a letter then GV (XGV 123) — and
      it is why this series' `regex` is written GV + one letter rather than as
      an alternation: a parse API must be able to see both readings of a
      GV-containing Maltese mark and rank them, not have one silently hidden.
      Police and the Armed Forces are inside this scheme, unlike Cyprus, whose
      Καν. 6(21)(β) expressly excludes both from its government plate.

  - id: mt-diplomatic-2009
    class: diplomatic
    categories: [car, van]
    period: { start: 2009 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "CDL 999"
      regex: '\ACD[A-Z] \d{3}\z'
      charset: { notes: "reg. 31(5), verbatim: 'the letters CD followed by another letter and three numbers'. The trailing letter is unconstrained, so `regex` is already the sourced grammar and no strict twin is needed" }
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31(5)"
    notes: >-
      DIPLOMATIC REPRESENTATIONS IN MALTA. Note that Malta, unlike Cyprus and
      Spain, gives diplomatic vehicles NO distinct colour — the mark is the only
      signal. No per-mission decode is published: the trailing letter is not
      stated to encode the mission, and this file makes no such claim.

  - id: mt-diplomatic-staff-2009
    class: consular
    categories: [car, van]
    period: { start: 2009 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "DMS 999"
      regex: '\ADMS \d{3}\z'
      charset: { notes: "reg. 31(6), verbatim: 'the letters DMS followed by three numbers'" }
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 31(6)"
    notes: >-
      STAFF OF DIPLOMATIC MISSIONS — a separate block from the CD mark of the
      missions themselves, which is a distinction many jurisdictions do not
      draw. CLASS CAVEAT: recorded as `consular` because the controlled
      vocabulary distinguishes only diplomatic from consular and DMS is neither
      exactly — it is mission STAFF rather than a consular post. Introduced with
      L.N. 198 of 2009; it does not appear in the 2004 list.

  # =========================================================================
  # VINTAGE — two instrument-dated designs, and the 2017 folklore corrected.
  # =========================================================================
  - id: mt-vintage-green-2015
    class: historic
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2015, end: 2018 }
    period_evidence: instrument-dated-both-ends
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} \d{3}\z'
      charset: { notes: "the ordinary Standard Alphanumeric mark; vintage status changes the plate's COLOURS, not its grammar" }
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#007A33"
      foreground_note: "L.N. 178 of 2015 s.17, verbatim: 'The plate on which the registration mark of a vintage vehicle is exhibited shall carry green characters.' The ground is not restated and remains the Second Schedule's white."
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/ln/2015/178/eng  # L.N. 178 of 2015 (Government Gazette 19,436, 05-06-2015) s.17: the GREEN characters rule; s.16 set the changeover fee at EUR 17.50 per plate 'for the replacement of vintage vehicle plates carrying black characters with new plates carrying green characters' — which also establishes that vintage plates were ORDINARY BLACK ON WHITE before 2015"
      - "https://legislation.mt/eli/ln/2018/139/eng  # L.N. 139 of 2018 s.7(b): THE END — substitutes the green rule with the silver-on-black rule"
      - "https://legislation.mt/eli/cap/368/eng  # Cap. 368 art. 25 (added by Act XIII of 2015): the vintage regime — 30 years or older from date of manufacture, a vintage vehicle classification committee, and 'Vintage vehicles which are older than fifty years shall be exempt from the payment of registration tax when they are registered for the first time in Malta'"
    notes: >-
      THE GREEN VINTAGE PLATE, 2015-2018 — a design that most secondary accounts
      of Malta omit entirely, jumping straight from black-on-white to
      silver-on-black and dating the latter to 2017. Both halves of that are
      wrong and both are corrected from the instruments: the intermediate design
      existed, it was green characters, and the silver-on-black change is 2018.
      Note also what L.N. 178 of 2015 s.16 incidentally proves by prescribing a
      swap fee from BLACK to GREEN plates: before June 2015 there was no special
      vintage plate at all. This series is instrument-dated at both ends, which
      is why it is one of the few in this wave carrying
      `instrument-dated-both-ends`.

  - id: mt-vintage-silver-2018
    class: historic
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2018 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} \d{3}\z'
      charset: { notes: "the ordinary Standard Alphanumeric mark; only the colours differ" }
    design:
      background: { color: "#000000", finish: non-retroreflective, hex_basis: observed }
      foreground: "#C0C0C0"
      foreground_note: >-
        L.N. 139 of 2018 s.7(b), verbatim, substituting the 2015 wording: 'The
        plate on which the registration mark of a vintage vehicle is exhibited
        shall carry silver characters on a black background.' This is the one
        Maltese plate whose GROUND colour changes, and the Second Schedule
        confirms it: the vintage and art. 8(4) plates keep 'the same dimensions
        and composition of all other registration plates' except for 'the colour
        of the characters, the periphery of the plate and, in the case of
        vintage vehicles, the colour of the plate'.
      border: { color: "#C0C0C0", width: 5, unit: mm, note: "the Second Schedule excepts 'the periphery of the plate' from the ordinary rule for these classes, so the border is not black here; its colour is not separately stated and silver is inferred from the character colour — recorded as an inference, not a citation" }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/ln/2018/139/eng  # L.N. 139 of 2018 (Government Gazette 19,984, 27-04-2018) s.7(b): the silver-on-black rule; s.6 updated the swap-fee wording from black->green to green->silver"
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 Second Schedule as consolidated (carries the silver-on-black text) and reg. 6D(7), added by L.N. 178 of 2015 and substituted by L.N. 160 of 2025: 'The registration mark allotted by the Authority to vehicles which are registered as vintage vehicles in accordance with article 25 of the Act is to be displayed on a vehicle registration plate having such specifications as established in the Second Schedule'"
      - "https://legislation.mt/eli/cap/368/eng  # Cap. 368 art. 25 (Act XIII of 2015, amended by Act XVIII of 2021 and Act IX of 2025): the 30-year threshold and the 50-year tax exemption"
    notes: >-
      THE CURRENT MALTESE VINTAGE PLATE — silver on black, from L.N. 139 of 2018
      (gazetted 27-04-2018), NOT 2017 as commonly stated. Eligibility is a
      ROLLING 30-year rule from date of manufacture under Cap. 368 art. 25, with
      a classification committee — which is worth contrasting with Cyprus, whose
      black historic plate is keyed to a FIXED calendar date (registration on or
      before 31-12-1974) and whose eligible population therefore shrinks every
      year while Malta's grows.

  # =========================================================================
  # THE WEEKEND / HIGH-EMISSION PLATE — a genuine `seasonal` class.
  # =========================================================================
  - id: mt-weekend-2015
    class: seasonal
    categories: [car, motorcycle]
    period: { start: 2015 }
    period_evidence: enacted-commencement
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} \d{3}\z'
      charset: { notes: "the ordinary Standard Alphanumeric mark; the restriction is marked by character colour alone" }
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#CE1126"
      foreground_note: "Second Schedule, verbatim: 'The plate on which the registration mark of a vehicle registered for use on the road in Malta solely and exclusively on Saturdays, Sundays, national holidays and other public holidays in terms of article 8(4) of the Act shall carry red characters.'"
      border: { color: "#CE1126", width: 5, unit: mm, note: "as with the vintage plate, the Second Schedule excepts 'the periphery of the plate' for this class; the colour is inferred from the characters and is not separately stated" }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/cap/368/eng  # Cap. 368 art. 8(4): the restricted-use registration category"
      - "https://legislation.mt/eli/ln/2015/178/eng  # L.N. 178 of 2015: added S.L. 368.02 reg. 6C and the Second Schedule's red-characters rule"
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 6C as amended by L.N. 265 of 2022 and L.N. 21 of 2026: M1 vehicles at or above 200 g/km CO2 NEDC / 220 g/km WLTP, and motorcycles of 801cc and above"
    notes: >-
      A RESTRICTED-USE PLATE MARKED ONLY BY THE COLOUR OF ITS CHARACTERS, and a
      genuinely good fit for the `seasonal` class in _meta/classes.yml — which
      was written for German Saisonkennzeichen but describes this exactly: a
      validity-window plate. Malta's window is weekly rather than annual. The
      regime is an EMISSIONS measure: reg. 6C confines it to M1 vehicles at or
      above 200 g/km CO2 (NEDC) or 220 g/km (WLTP), and to motorcycles of 801cc
      and above. A DISCREPANCY BETWEEN ACT AND REGULATION, recorded not
      reconciled: Cap. 368 art. 8(4) states the window as including "Fridays as
      from 18.00 onwards", while reg. 6C says "Fridays" and separately prohibits
      parking "on Friday before 18:00hrs". Both texts are in force; a consumer
      needing the exact window must read both.

  # =========================================================================
  # PERSONALISED AND SPECIAL FORMATS — the outer legal bound, recall-only.
  # =========================================================================
  - id: mt-personalised-2011
    class: personalized
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2011 }
    period_evidence: enacted-commencement
    matching: recall-only
    format:
      pattern: "LLL999"
      regex: '\A[A-Z0-9]{1,9}\z'
      pattern_note: >-
        THE OUTER LEGAL BOUND, hence recall-only, and it is genuinely this wide.
        S.L. 368.02 reg. 30(2), verbatim: "The registration mark may take any of
        the special numeric, special alphabetical or special alphanumeric
        formats specified in the First Schedule and can be composed of up to a
        MAXIMUM OF NINE CHARACTERS." The First Schedule defines them: Special
        Numeric Format, "Composed solely of any Arabic numeral"; Special
        Alphabetical Format, "Composed of any character of the Roman Alphabet";
        Special Numeric and Alphabetical, "Composed of a mixture of numeric and
        alphabetical". So one to nine characters, letters and/or digits, in any
        arrangement. A match here is a shape hit and nothing more — this regex
        subsumes almost every other Maltese series and must never be used to
        assert that a string IS a Maltese plate. `pattern` shows a
        representative six-character form only.
      progression: "none — owner-chosen"
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", width: 5, unit: mm }
      band: { side: left, color: "#003399", hex_basis: observed, content: eu-stars+M }
    region_encoding: none
    region_encoding_note: "none, and note that a personalised mark DEFEATS the renewal-month rule of the standard series, since the First Schedule ties that rule to the Standard Alphanumeric Format (Random) type only"
    sources:
      - "https://legislation.mt/eli/sl/368.2/eng  # S.L. 368.02 reg. 30(2)-(4) and the First Schedule (substituted by L.N. 195 of 2011, amended by L.N. 110 of 2011, 178 of 2015 and 139 of 2018): the special formats, the nine-character maximum, the fees, and the transfer rules"
      - "https://legislation.mt/eli/ln/2011/195/eng  # L.N. 195 of 2011: substituted the First Schedule wholesale — the instrument that dates this series"
    notes: >-
      MALTESE SPECIAL AND PERSONALISED MARKS. Fees, from the First Schedule and
      recorded because they are the clearest evidence of the tiering: Standard
      Alphanumeric (Random) EUR 70 per pair; Standard Alphanumeric
      (Personalised), "where the choice of the characters and numerals shall lie
      with the person requesting the Numbers", EUR 200 per pair; each of the
      three Special formats EUR 1,500 per pair; duplicate plates EUR 35 each.
      TRANSFERABILITY IS THE INTERESTING RULE, reg. 30(4): random marks are NOT
      transferable independently of the vehicle, PERSONALISED marks ARE, and
      other marks transfer on payment of EUR 466 with exemptions for transfers
      causa mortis, between spouses, ascendants or direct collaterals, and
      between a company and its director or majority shareholder. A RESIDUAL
      GAP, recorded: reg. 30(3) provides that marks "shall be made available to
      the public in such manner as the Authority may from time to time establish
      by means of a NOTICE IN THE GAZETTE", so which specific marks are released
      is administrative and is not on legislation.mt. The nine-character maximum
      also means Malta is the one jurisdiction in this wave whose statutory
      bound is materially wider than its ordinary series, which is exactly what
      `regex_statutory` exists for elsewhere — here the width is so great that a
      separate recall-only series is the honest encoding rather than a twin on
      mt-standard-2004.

  # =========================================================================
  # THE PRE-LEGISLATION SERIES — administrative, hence recall-only.
  # =========================================================================
  - id: mt-standard-1995
    class: standard
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 1995, end: 2004 }
    period_evidence: secondary-dated
    matching: recall-only
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} ?\d{3}\z'
      pattern_note: "recall-only because no instrument prescribed a format before 9-3-2004; see the file header. The optional gap reflects that no separator was prescribed either"
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: none, note: "the EU band arrives with L.N. 476 of 2004 on 1-5-2004; it cannot have been prescribed for this series" }
    region_encoding: none
    sources:
      - "https://legislation.mt/eli/ln/1994/128/eng  # L.N. 128 of 1994 (Motor Vehicles Regulations 1994, S.L. 65.11) regs. 31-32 — THE SOURCED NEGATIVE: the mark and all character dimensions are 'determined from time to time by the Commissioner of Police on the advice of the Traffic Control Board'. No format is prescribed. PDF: https://legislation.mt/getpdf/60225bddbc8272018c134581"
      - "https://legislation.mt/eli/ln/2004/114/eng  # L.N. 114 of 2004 — the END of the unlegislated era: the first published format, in force 9-3-2004"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Malta  # secondary-wikipedia: the c.1995 introduction of the three-letter/three-digit system. Revision 1365210379 of 2026-07-21T00:33:53Z. NO primary exists for this boundary"
    notes: >-
      THE THREE-LETTER FORMAT BEFORE IT WAS LEGISLATED. Same shape as
      mt-standard-2004 and no instrument behind it: under L.N. 128 of 1994 the
      Commissioner of Police set the format administratively. The 1995 start is
      a secondary date with no gazette reference and should be treated as
      observational. The end, by contrast, IS instrument-dated — 9 March 2004,
      when L.N. 114 of 2004 first prescribed the format in law — and the two
      entries overlap in 2004 for that reason, with distinct notes. A consumer
      cannot distinguish a 1998 plate from a 2005 one by its STRING; the
      discriminator is the EU band on the physical plate.

