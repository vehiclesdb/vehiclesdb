    matching: strict
    format:
      pattern: "V-LLL-999"
      regex: '\AV-[A-Z]{3}-\d{3}\z'
      charset: { index: [V], notes: "art. 8 § 3, 3°: the professional plate's index is 'V' and the first letter of its three-letter group is neither 'M' nor 'S'" }
    design:
      plate: { w: 520, h: 110, unit: mm }
      plate_variants:
        - { w: 340, h: 210, unit: mm }
