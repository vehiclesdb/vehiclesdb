    matching: strict
    format:
      pattern: "A99999"
      regex: '\AA\d{5}\z'
      charset:
        notes: >-
          The A prefix is PRIMARY (art. 114), which also allows AE, AP and AU. The
          article says the AE (school bus), AP and AU forms have been treated as A
