        nationwide switch. THE TWO DATES DISAGREE (6 vs 19 May 1998) AND ARE NOT
        AVERAGED HERE: the White Paper is the better evidence for the 希望番号 launch,
        the encyclopaedia for the class-code rollout, and both are cited so a
        verifier can resolve it.

