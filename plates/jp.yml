        2018-10-01, 2020-05-11, 2023-10-23 and 2025-05-07. matching is RECALL-ONLY
        for the nl-export reason: the plate carries whatever number the vehicle
        already has, so the regex is the union of the one-, two- and
        three-character class-code shapes and a match is a shape hit and nothing
        more. The legal hook is the closing clause of Form No. 1 remark (3),
