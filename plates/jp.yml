          - { n: 2, name: "分類番号", en: "class code", script: "Latin/digits", in_projection: true }
          - { n: 3, name: "平仮名又はローマ字", en: "use-category mark", script: "Hiragana", in_projection: false, decode: "plates/_decode/jp-use-marks.yml" }
          - { n: 4, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true }
      design:
        plate: { w: 330, h: 165, unit: mm }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        artwork: { monotone: "included in the issue fee", full_colour: "available on a donation of 1,000 yen or more (MLIT)", motif: "GREEN×EXPO 2027 (2027 International Horticultural Expo)" }
        emblem: { present: true, rendered: placeholder, note: "The whole point of the plate is its artwork, and PRD-PLATES §3's placeholder rule therefore governs the render: no design is reproduced, and none was licence-researched." }
        rear_differs: false
      region_encoding: "plates/_decode/jp-office-marks.yml"
      sources:
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第一号様式（自動車登録番号標）（第十一条関係） remark (3) closing clause 「…とするほか、国土交通大臣の定めるところによる。」 — the delegation this programme hangs on; the ministerial notice itself was NOT pinned"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第十一条 + 第一号様式: the base plate the artwork is laid over is unchanged, which is why the number itself is the ordinary one"
        - "https://www.mlit.go.jp/jidosha/zugaranumber_top/  # GREEN×EXPO 2027 特別仕様ナンバープレート: 「交付期間 2025年7月14日～2027年11月30日」, 「申込受付 2025年6月9日～」, eligible 自家用登録車/事業用登録車/自家用軽自動車"
      notes: >-
        THE GREEN×EXPO 2027 SPECIAL-SPECIFICATION PLATE (特別仕様ナンバープレート), issued 14
        July 2025 to 30 November 2027 with applications from 9 June 2025 — MLIT
        publishes all three dates. It is modelled separately from the national and
        regional programmes because 特別仕様 is MLIT's own third category, it runs to
        its own calendar, and its donation stream is earmarked for expo-related
        transport rather than for road safety or regional tourism. Like its
        siblings it is a design laid over an existing number, so matching is
        recall-only.

