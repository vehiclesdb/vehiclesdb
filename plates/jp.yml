        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第二十五条第一項 + 第三号様式: remark (1) (the four printed elements), remark (2) (the SEPARATE office table), remark (4) (「白地に黒文字とし、斜線は赤色とすること」)"
      notes: >-
        THE RED-DIAGONAL PLATE. Its office table is NOT the registration table:
        Form No. 3 remark (2) prints its own list of roughly sixty 運輸支局/自動車検査登録事務所
        marks, containing none of the ご当地ナンバー place names, and Forms No. 5 and No.
        15 both adopt it by reference. A decoder that resolves 知床 or 富士山 on a
        red-striped plate has used the wrong table. That table is not transcribed
        into _decode in this pass — recorded gap — because it is printed inside a
        drawing PDF in a two-column layout that does not extract cleanly.
        period.start 1951 is the Act's own promulgation year and is an
        enabling-statute claim about the PERMIT REGIME (第三十四条), not about this
        plate's design.

