          - { n: 2, name: "運輸支局等を表示する文字", en: "office place-name mark", script: "Han/Hiragana", in_projection: false, decode: "plates/_decode/jp-office-marks.yml", statute: "第六十三条の四第一項第二号 + 第二項" }
          - { n: 3, name: "平仮名又はローマ字", en: "use-category mark", script: "Hiragana", in_projection: false, statute: "第六十三条の四第一項第三号 — again NO appendix is cited" }
          - { n: 4, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true, statute: "第六十三条の四第一項第四号" }
      design:
        plate: { w: 230, h: 125, unit: mm }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        emblem: { present: false }
        rear_differs: false
        characters:
        serial_height_mm: 60
        top_line_height_mm: 30
        office_mark_width_mm: 22
        office_mark_width_4char_mm: 17
        note: "Form No. 14 remarks (4)-(6) and the drawing: 230 x 125 mm, and NO BORDER — the single visual difference from the >250 cc plate at Form No. 13, whose remark (3) prescribes one."
        font:
        name: "statutory drawing (no named typeface)"
        statutory_basis: "道路運送車両法施行規則 第六十三条の二第四項: 検査対象外軽自動車の車両番号標 is 第十四号様式."
        licence: "as Form No. 1 — cite, build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      sources:
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第六十三条の四第一項: FOUR fields, and uniquely the class code comes FIRST, before the office mark"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第六十三条の二第四項 + 第十四号様式 remark (3) (「事業用自動車にあつては緑地に白文字とし、自家用自動車にあつては白地に緑文字とすること」) and the drawing (230 x 125 mm, no border)"
        - "https://laws.e-gov.go.jp/law/326AC0000000185  # 第九十七条の三: 検査対象外軽自動車 are not inspected; the user notifies the District Transport Bureau and is assigned a vehicle number"
      notes: >-
        126-250 cc MOTORCYCLES (軽二輪), AND THE ONLY JAPANESE NUMBER WHOSE CLASS
        CODE COMES FIRST. 第六十三条の四第一項 orders the fields class code, office mark,
        use mark, serial — so the projection is `6 20-46` with the digit LEADING,
        where every other Japanese series puts the office mark first. Two
        statutory silences make this series weaker than its siblings and both are
        on the face of the rule: the class-code item cites NO appendix (unlike
        別表第二 and 別表第二の四) and the use-mark item cites NO appendix (unlike 別表第三 and
        別表第二の五). The permitted values of both fields are therefore unsourced. Form
        No. 14's drawing shows 6 in its worked example, which is an illustration
        and is not asserted here as a rule. matching is RECALL-ONLY in
        consequence: the regex admits every digit because nothing sourced narrows
        it, so a match is a shape hit and not a class claim.

