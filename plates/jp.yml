# plates/jp.yml — Japan (PRD-PLATES gate L3).
#
# EVERY format, class, colour and dimension claim in this file is read off one
# of three instruments, in the original Japanese, from the e-Gov Laws Search
# consolidated texts and the Form drawings they carry:
#
#   * 道路運送車両法 — Road Transport Vehicle Act, Act No. 185 of 1 June 1951.
#     The enabling statute. 第十九条 obliges display of the registration number
#     plate; 第七十三条第一項 does the same for kei and motorcycle VEHICLE
#     numbers; 第九十七条の三 for 126-250 cc motorcycles.
#   * 自動車登録規則 — Automobile Registration Regulations, Ministry of
#     Transport Ordinance No. 7 of 20 February 1970, in force 1 March 1970
#     (附則 1), repealing the 1951 Regulations of the same name. 第十三条 is the
#     composition rule; 別表第一 the place-name list; 別表第二 the class codes;
#     別表第三 the use marks.
#   * 道路運送車両法施行規則 — Enforcement Regulations, Ministry of Transport
#     Ordinance No. 74 of 16 August 1951. 第十一条 + Form No. 1 = the registered
#     plate; 第四十五条 + Forms No. 12/13 = kei and >250 cc motorcycle plates;
#     第六十三条の二 + Forms No. 14/15 = 126-250 cc motorcycles and their
#     temporary plates; 第二十五条/第二十六条の六 + Forms No. 3/5 = temporary
#     operation and dealer-transport plates; 別表第二の四/第二の五 = the kei
#     class codes and use marks; 別表第三 = the motorcycle use marks.
#
# ---------------------------------------------------------------------------
# 1. THE COMPOSITION IS FOUR FIELDS, AND IT IS ENACTED IN FULL.
# ---------------------------------------------------------------------------
# 自動車登録規則 第十三条第一項, verbatim:
#
#   「自動車登録番号は、次に掲げる文字をその順序により組み合わせて定めるものとする。
#     一　自動車の使用の本拠の位置を管轄する運輸監理部又は運輸支局（…）を表示する文字
#     　　（別表第一）
#     二　自動車の種別及び用途による分類番号を表示する二字以下のアラビア数字又は最初の
#     　　字がアラビア数字であつて、その他の字がアラビア数字若しくはローマ字若しくは
#     　　これらの組合せである三字（別表第二）
#     三　自動車運送事業の用に供するかどうかの別等を表示する平仮名又はローマ字（別表第三）
#     四　四けた以下のアラビア数字」
#
# Translation (ours): a registration number is the combination, in that order,
# of (1) characters indicating the transport office having jurisdiction over
# the vehicle's base of use (Appendix Table 1); (2) a class code of TWO OR
# FEWER Arabic numerals, OR THREE characters of which the first is an Arabic
# numeral and the rest are Arabic numerals, Roman letters, or a combination
# (Appendix Table 2); (3) a hiragana or Roman letter indicating whether the
# vehicle is used for a motor carrier business, etc. (Appendix Table 3); and
# (4) FOUR OR FEWER Arabic numerals.
#
# Item 2 is doing a great deal of work and is the key to Japanese era
# inference. It sanctions THREE grammars at once — one or two digits, three
# digits, and three characters containing Roman letters — and this file cuts
# them into three series apiece because they began on three different dates.
#
# ---------------------------------------------------------------------------
# 2. THE ASCII-PROJECTION RULE — how a kanji-and-hiragana plate is modelled
#    inside a dataset whose serial alphabet is A-Z and 0-9.
# ---------------------------------------------------------------------------
# PRD-PLATES §2.6 fixes the serial alphabet at A-Z 0-9 and the emitted
# separators at "-" and " ". A Japanese plate prints kanji and hiragana. The
# line drawn here, and it is drawn once for the whole file:
#
#   `format.pattern`, `format.regex` and the twins describe THE ASCII
#   PROJECTION of the plate — the statutory fields whose characters lie in the
#   serial alphabet, concatenated IN THE STATUTORY ORDER of 第十三条, with a
#   single space (U+0020, an emitted separator) standing at each position where
#   a non-Latin field sits between two Latin ones.
#
# So 「品川　300　あ　20-46」 projects to `300 20-46`, and its regex is
# '\A3\d{2} \d{2}-\d{2}\z'. The office mark and the use mark are NOT
# dropped from the dataset — they are carried on every series in
# `format.fields[]`, with the script recorded, and resolved by two decode
# tables that are themselves primary law:
#
#   plates/_decode/jp-office-marks.yml   (別表第一, 140 rows, 138 distinct marks)
#   plates/_decode/jp-use-marks.yml      (別表第三 x2 + 別表第二の五, four sets)
#
# THE ONE PLACE THE PROJECTION IS NOT LOSSY IS ALSO THE INTERESTING ONE: where
# the use-mark field holds a ROMAN letter rather than a hiragana — the
# duty-exempt foreign-owner sets (ＥＨＫＭＴＹ / ＡＢ) and the ＣＬＶ+hiragana
# motorcycle combination — that letter IS in the serial alphabet and therefore
# appears in the projection. `300 Y 20-46` is a real projected string and
# jp-registered-usforces is its series.
#
# ---------------------------------------------------------------------------
# 3. THE PRINTED SERIAL, AND WHY THE DOT IS NOT A SEPARATOR.
# ---------------------------------------------------------------------------
# Field 4 is 「四けた以下のアラビア数字」 — four or fewer digits. The statutory
# drawing shows the four-digit case with a HYPHEN between the second and third
# digit (`20-46`), which is an emitted separator and is what `pattern` spells.
# The drawing ALSO shows the three-or-fewer case (Form No. 1 figure その三):
# the empty leading positions are filled with CENTRED DOTS, dimensioned in the
# drawing as circles of 12 mm diameter (18 mm on the 440 mm plate). Those dots
# are PADDING, not punctuation and not digits: they carry no information, they
# are not in `_meta/separators.yml`, and every regex in this file is written
# for the four-digit printed form with the shorter forms recorded in notes.
# A consumer normalising a photographed plate should delete the dots before
# matching — which is safe precisely because they encode nothing.
#
# ---------------------------------------------------------------------------
# 4. THE COLOUR MATRIX IS STATUTORY. This is not folklore, and it is not a
#    "convention": it is a remark in a ministerial-ordinance Form.
# ---------------------------------------------------------------------------
#   Form No. 1  remark (3): 「自動車登録番号標の塗色は、事業用自動車にあつては緑地に
#                            白文字とし、自家用自動車にあつては白地に緑文字とするほか、
#                            国土交通大臣の定めるところによる。」
#   Form No. 12 remark (3): 「車両番号標の塗色は、事業用自動車にあつては黒地に黄文字と
#                            し、自家用自動車にあつては黄地に黒文字とするほか、国土交通
#                            大臣の定めるところによる。」
#   Form No. 13 remark (3): 「車両番号標の塗色は、事業用自動車にあつては緑地に白文字、
#                            枠は白色とし、自家用自動車にあつては白地に緑文字、枠は緑色
#                            とすること。」
#   Form No. 14 remark (3): 「車両番号標の塗色は、事業用自動車にあつては緑地に白文字と
#                            し、自家用自動車にあつては白地に緑文字とすること。」
#
# i.e. registered private = green on white; registered for-hire = white on
# green; kei private = black on yellow; kei for-hire = yellow on black;
# >250 cc motorcycles = the registered colours PLUS a border in the opposite
# colour; 126-250 cc motorcycles = the registered colours, no border.
#
# TWO CONSEQUENCES THIS FILE ACTS ON. First, "事業用/自家用" is a legal use
# category, not a body type, and it is ALSO what selects the use-mark set — so
# the colour and the hiragana are two readings of one fact, which is why
# commercial issue is modelled as a `variants:` sub-entry on each series rather
# than as a parallel series: the ASCII projection is identical, only the colour
# and the use-mark set change (PRD-PLATES §2.3's own test). Second, the closing
# words 「国土交通大臣の定めるところによる」 delegate everything else — the
# illuminated (字光式) plate, the figure plates, the large-plate colours — to a
# ministerial notice that was NOT pinned in this pass. Every hex below is
# therefore `hex_basis: observed` inside a statutorily NAMED colour, the same
# posture plates/gb.yml takes for BS AU 145e and plates/de.yml for
# "grünes Kennzeichen". No chromaticity claim is made.
#
# ---------------------------------------------------------------------------
# 5. REGEX POLICY (identical to plates/gb.yml and plates/nl.yml).
# ---------------------------------------------------------------------------
# `format.regex` is the LINT-ROUND-TRIPPABLE regex: the lint generates serials
# from `format.pattern` (9 -> any digit, L -> any letter) and requires the
# regex to accept every one, so `regex` can never be narrower than the
# pattern's own alphabet. Where the statutory grammar is narrower than what the
# pattern DSL can spell, the grammar goes in `regex_strict`. That happens
# exactly once by construction: the 大型特殊 grid row's leading digit is 9,
# which the DSL reserves as its digit token, so `pattern` cannot pin it — see
# jp-registered-large-special-*, whose `regex_strict` carries the real leading
# 9 and whose `matching:` stays strict.
jurisdiction: jp
authority:
  name: "国土交通省 (Ministry of Land, Infrastructure, Transport and Tourism) — 地方運輸局/運輸監理部/運輸支局/自動車検査登録事務所 for registered vehicles; 軽自動車検査協会 (Light Motor Vehicle Inspection Organization) administers kei inspection"
  url: "https://www.mlit.go.jp/jidosha/jidosha_tk6_000036.html"
binding: vehicle
binding_note: >-
  The number attaches to the VEHICLE and to its 使用の本拠の位置 (base of use),
  not to the owner. 自動車登録規則 第十三条第二項 keeps an existing number valid
  when the office's jurisdiction is later redrawn, or when the base of use
  moves within a municipality affected by such a change — so a place-name mark
  can outlive the boundary that produced it, and a vehicle is not re-plated on
  a house move until some other registration event forces the issue.
instrument:
  act:
    citation: "道路運送車両法（昭和二十六年法律第百八十五号） — Road Transport Vehicle Act, Act No. 185 of 1951"
    promulgated: "1951-06-01"
    key_articles: "第十一条 (plate issue + sealing), 第十九条 (display obligation, registered vehicles), 第二十条 (destruction/return), 第五十九条-第六十条 (inspection; vehicle numbers for kei and >250 cc motorcycles), 第七十三条第一項 (display obligation, vehicle numbers), 第九十七条の三 (126-250 cc motorcycles)"
    source: "https://laws.e-gov.go.jp/law/326AC0000000185"
  registration_regulations:
    citation: "自動車登録規則（昭和四十五年運輸省令第七号） — Automobile Registration Regulations, MOT Ordinance No. 7 of 1970"
    promulgated: "1970-02-20"
    in_force: "1970-03-01"
    in_force_text: "附則 １: 「この省令は、昭和四十五年三月一日から施行する。」 ２: 「自動車登録規則（昭和二十六年運輸省令第六十二号）は、廃止する。」"
    key_provisions: "第十三条 (composition), 別表第一 (office marks), 別表第二 (class codes), 別表第三 (use marks)"
    source: "https://laws.e-gov.go.jp/law/345M50000800007"
  enforcement_regulations:
    citation: "道路運送車両法施行規則（昭和二十六年運輸省令第七十四号） — Enforcement Regulations, MOT Ordinance No. 74 of 1951"
    promulgated: "1951-08-16"
    key_provisions: "第十一条 + 第一号様式/第一号様式の二, 第二十五条 + 第三号様式, 第二十六条の六 + 第五号様式, 第三十六条の十七/十八, 第四十五条 + 第十二号様式/第十三号様式, 第六十三条の二 + 第十四号様式/第十五号様式, 第六十三条の四, 別表第二の四, 別表第二の五, 別表第三"
    source: "https://laws.e-gov.go.jp/law/326M50000800074"
  alphabet_amendment:
    citation: "平成二十八年十二月二十八日国土交通省令第八十七号 — MLIT Ordinance No. 87 of 28 December 2016"
    in_force_text: "附則第一条: 「この省令は、平成二十九年一月一日から施行する。ただし、第一条（第一号様式備考（６）の改正規定を除く。）、第二条、第三条及び第四条（第十三条第一項第二号の改正規定及び別表第二の改正規定を除く。）の規定は、平成二十九年四月一日から施行する。」"
    effect: >-
      Read the proviso carefully, because it splits the same reform across two
      dates. The general commencement is 1 JANUARY 2017. The delayed
      1 April 2017 commencement expressly EXCLUDES (a) the amendment to Form
      No. 1 remark (6) and (b) the amendments to 自動車登録規則 第十三条第一項
      第二号 and 別表第二 — so the three-character class code carrying Roman
      letters, and the plate-geometry remark that makes room for it, took
      effect for REGISTERED vehicles on 2017-01-01, while the corresponding
      Enforcement-Regulations changes (including the kei table 別表第二の四)
      took effect on 2017-04-01.
    source: "https://laws.e-gov.go.jp/law/345M50000800007  # 附則（平成二八年一二月二八日国土交通省令第八七号）第一条; e-Gov revision ids 345M50000800007_20170401_428M60000800087 and 326M50000800074_20170401_428M60000800087"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts, cited once and referenced per series.
# ---------------------------------------------------------------------------
common:
  projection:
    rule: "pattern/regex describe the ASCII projection: statutory fields in A-Z 0-9, in 第十三条 order, one space per intervening non-Latin field. See header §2."
    worked_example: "「品川　300　あ　20-46」 -> `300 20-46`; 「品川　300　Y　20-46」 -> `300 Y 20-46`; 「山形　い　20-46」 (>250 cc motorcycle, no class code) -> `20-46`; 「6　山形　い　20-46」 (126-250 cc motorcycle, class code FIRST) -> `6 20-46`."
  class_codes:
    note: >-
      別表第二 (registered vehicles, re 第十三条) and 別表第二の四 (kei, re
      第三十六条の十七) are the closed statutory lists of class codes. Both are
      printed in FULL-WIDTH characters (１ = U+FF11, Ａ = U+FF21); the plate is
      embossed and the dataset's regexes are half-width ASCII, which is the
      §2.6 serial alphabet. Both tables are small and closed, so they are
      inlined here rather than given a _decode file (PRD-PLATES §2.4).
    registered_rows:
      - range: "１　貨物の運送の用に供する普通自動車"
        codes: "１、１０から１９まで、１００から１９９まで、１０Ａから１９Ｚまで、１Ａ０から１Ｚ９まで及び１ＡＡから１ＺＺまで"
      - range: "２　人の運送の用に供する乗車定員１１人以上の普通自動車"
        codes: "２、２０から２９まで、２００から２９９まで、２０Ａから２９Ｚまで、２Ａ０から２Ｚ９まで及び２ＡＡから２ＺＺまで"
      - range: "３　人の運送の用に供する乗車定員１０人以下の普通自動車"
        codes: "３、３０から３９まで、３００から３９９まで、３０Ａから３９Ｚまで、３Ａ０から３Ｚ９まで及び３ＡＡから３ＺＺまで"
      - range: "４　貨物の運送の用に供する小型自動車"
        codes: "４、６、４０から４９まで、６０から６９まで、４００から４９９まで、６００から６９９まで、４０Ａから４９Ｚまで、６０Ａから６９Ｚまで、４Ａ０から４Ｚ９まで、６Ａ０から６Ｚ９まで、４ＡＡから４ＺＺまで及び６ＡＡから６ＺＺまで"
      - range: "５　人の運送の用に供する小型自動車"
        codes: "５、７、５０から５９まで、７０から７９まで、５００から５９９まで、７００から７９９まで、５０Ａから５９Ｚまで、７０Ａから７９Ｚまで、５Ａ０から５Ｚ９まで、７Ａ０から７Ｚ９まで、５ＡＡから５ＺＺまで及び７ＡＡから７ＺＺまで"
      - range: "６　散水自動車、広告宣伝用自動車、霊きゆう自動車その他特種の用途に供する普通自動車及び小型自動車"
        codes: "８、８０から８９まで、８００から８９９まで、８０Ａから８９Ｚまで、８Ａ０から８Ｚ９まで及び８ＡＡから８ＺＺまで"
      - range: "７　大型特殊自動車（次号に規定するものを除く）"
        codes: "９、９０から９９まで、９００から９９９まで、９０Ａから９９Ｚまで、９Ａ０から９Ｚ９まで及び９ＡＡから９ＺＺまで"
      - range: "８　自動車抵当法第２条ただし書に規定する大型特殊自動車"
        codes: "０、００から０９まで、０００から０９９まで、００Ａから０９Ｚまで、０Ａ０から０Ｚ９まで及び０ＡＡから０ＺＺまで"
    kei_rows:
      - range: "１　貨物の運送の用に供する自動車"
        codes: "４０から４９まで、４００から４９９まで、６００から６９９まで、４０Ａから４９Ｚまで、６０Ａから６９Ｚまで、４Ａ０から４Ｚ９まで、６Ａ０から６Ｚ９まで、４ＡＡから４ＺＺまで及び６ＡＡから６ＺＺまで"
      - range: "２　人の運送の用に供する自動車"
        codes: "５０から５９まで、５００から５９９まで、７００から７９９まで、５０Ａから５９Ｚまで、７０Ａから７９Ｚまで、５Ａ０から５Ｚ９まで、７Ａ０から７Ｚ９まで、５ＡＡから５ＺＺまで及び７ＡＡから７ＺＺまで"
      - range: "３　散水自動車、広告宣伝用自動車、霊きゆう自動車その他特種の用途に供する自動車"
        codes: "８０から８９まで、８００から８９９まで、８０Ａから８９Ｚまで、８Ａ０から８Ｚ９まで及び８ＡＡから８ＺＺまで"
    kei_collision: >-
      THE SINGLE MOST IMPORTANT DECODE FACT IN THE JAPANESE SYSTEM, and it is a
      collision rather than a code. Compare 別表第二 row 5 (registered 小型 passenger)
      「５、７、５０から５９まで、７０から７９まで、５００から５９９まで、７００から
      ７９９まで…」 with 別表第二の四 row 2 (KEI passenger) 「５０から５９まで、５００
      から５９９まで、７００から７９９まで…」. The multi-character blocks are
      IDENTICAL. The same holds for goods (4/6) and for special-purpose (8); the
      only differences are that the registered table additionally opens each row
      with a bare single character, and that the kei goods row has no 60-69
      two-digit block. So a class code of 500 does NOT tell a decoder whether it is
      looking at a 小型乗用車 on a white plate or a kei car on a yellow one — and
      the two plates are THE SAME SIZE, 330 x 165 mm, because Form No. 1 and Form
      No. 12 give the same dimensions. COLOUR IS THE ONLY DISCRIMINATOR, and it is
      statutory (Form No. 1 remark (3) against Form No. 12 remark (3)). A parse API
      given a class code and a serial but no colour must return BOTH the
      jp-registered-small-* and the jp-kei-* candidates; this dataset makes that
      possible by carrying them as separate series with identical regexes and
      different `design.background`. Enthusiast sources report a practical
      partition inside the shared range (kei clustering at 58x); NO PRIMARY for any
      such partition was secured and none is asserted.
    grammar_finding: >-
      Each three-character range decomposes as leading digit + two characters
      each of which may be a digit OR a Roman letter: 「３００から３９９まで」
      (digit,digit) + 「３０Ａから３９Ｚまで」 (digit,letter) + 「３Ａ０から３Ｚ９
      まで」 (letter,digit) + 「３ＡＡから３ＺＺまで」 (letter,letter) is the
      complete cross-product, so the statutory three-character class code is
      exactly `d[0-9A-Z]{2}`. That is what makes the alnum series' regexes
      exact rather than approximate.
    alphabet_gap: >-
      別表第二 permits Ａ through Ｚ without exclusion. Enthusiast sources report
      that only a subset is actually issued (the letters that cannot be misread
      as digits). NO PRIMARY for any such restriction was secured in this pass,
      so no `regex_strict` narrowing the class-code alphabet appears anywhere in
      this file, and the restriction is recorded as an open question rather than
      asserted. A verifier who pins the notice should add the twins then.
    source: "https://laws.e-gov.go.jp/api/1/lawdata/345M50000800007  # 別表第二 verbatim; https://laws.e-gov.go.jp/api/1/lawdata/326M50000800074  # 別表第二の四 verbatim; both accessed 2026-08-02"
  colours:
    registered_private: "白地に緑文字 — green characters on white (Form No. 1 remark (3))"
    registered_forhire: "緑地に白文字 — white characters on green (Form No. 1 remark (3))"
    kei_private: "黄地に黒文字 — black characters on yellow (Form No. 12 remark (3))"
    kei_forhire: "黒地に黄文字 — yellow characters on black (Form No. 12 remark (3))"
    motorcycle_private: "白地に緑文字、枠は緑色 — green on white with a GREEN border (Form No. 13 remark (3))"
    motorcycle_forhire: "緑地に白文字、枠は白色 — white on green with a WHITE border (Form No. 13 remark (3))"
    temporary: "白地に黒文字、斜線は赤色 — black on white with a RED DIAGONAL STRIPE (Form No. 3 remark (4))"
    dealer: "白地に黒文字、枠は赤色 — black on white with a RED FRAME (Form No. 5 remark (3))"
    imperial: "銀色地に金文字 — gold characters on a silver ground, 梨地 (matte) with the drawn pattern (Form No. 1-2 remarks (2)-(3))"
    hex_basis_note: >-
      The instrument NAMES every colour and NUMBERS none. Every hex in this
      file is `hex_basis: observed` inside a statutorily named colour; the
      chromaticity, if it is written down anywhere, is in the ministerial
      notice that Form No. 1 remark (3) and Form No. 12 remark (3) both defer to
      (「国土交通大臣の定めるところによる」), which was not pinned — recorded gap.
    source: "https://laws.e-gov.go.jp/law/326M50000800074  # Forms No. 1, 1-2, 3, 5, 12, 13, 14, 15 and their 備考"
  dimensions:
    large: { w: 440, h: 220, unit: mm, name: "大型番号標" }
    medium: { w: 330, h: 165, unit: mm, name: "中型番号標" }
    small: { w: 230, h: 125, unit: mm, name: "小型番号標" }
    source_primary: "https://laws.e-gov.go.jp/law/326M50000800074  # the Form drawings themselves carry the figures: Form No. 1 shows 330 (440) x 165 (220); Form No. 12 shows 330 x 165; Forms No. 13 and 14 show 230 x 125"
    source_corroboration: "https://www.n-p.or.jp/plate_size.html  # 一般社団法人全国自動車標板協議会 (National Automobile License Plate Council) size chart: 大型標板 44 cm x 22 cm, 中型標板 33 cm x 16.5 cm, 小型標板 23 cm x 12.5 cm — an exact match to the drawings, from the body that manufactures the plates"
    threshold: "The 440 x 220 mm plate is not optional and not a size class the owner picks: Form No. 1 remark (4) proviso ties it to 普通自動車 of >= 8,000 kg gross vehicle weight, >= 5,000 kg maximum load, or >= 30 seats."
