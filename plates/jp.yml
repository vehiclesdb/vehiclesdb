          - { n: 3, name: "平仮名", en: "use-category mark", script: "Hiragana", in_projection: false, decode: "plates/_decode/jp-use-marks.yml" }
          - { n: 4, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true }
      design:
        plate: { w: 330, h: 165, unit: mm }
        plate_variants:
          - { w: 440, h: 220, unit: mm, note: "大型番号標 — Form No. 1 remark (4) proviso: 普通自動車 of 8,000 kg or more gross vehicle weight, 5,000 kg or more maximum load, or 30 or more seats. The drawing carries both sets of dimensions, the large one in parentheses throughout (remark (7))." }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        emblem: { present: false }
        rear_differs: false
        characters:
          serial_height_mm: 80
          top_line_height_mm: 40
          office_mark_width_mm: 30
          office_mark_width_4char_mm: 22
          class_code_width_4char_mm: 23
          note: >-
            Form No. 1 remarks (4)-(6) and the statutory drawing. Widths shrink when
            the office mark is four characters (尾張小牧, 伊勢志摩) and shrink again
            when the class code is three characters rather than two; remark (5)
            gives a separate 33 x 28 mm box to a three-character mark whose second
            character is ケ. On the 440 x 220 mm plate every figure in parentheses
            applies instead.
        font:
          name: "statutory drawing (no named typeface)"
          statutory_basis: "道路運送車両法施行規則 第十一条: 「自動車登録番号標は、第一号様式による。」 — the glyphs are the drawing in Form No. 1, exactly the British and German posture (PRD-PLATES §6). No typeface is named anywhere in the instrument."
          licence: "e-Gov Laws Search publishes the instrument and its Form drawings; the drawings are Japanese government works published inside a ministerial ordinance. Cite and build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      sources:
        - "https://laws.e-gov.go.jp/api/1/lawdata/345M50000800007  # 別表第二: every row's code list begins with the bare single character (１、２、３、４、６、５、７、８、９、０) before the two- and three-character blocks"
        - "https://laws.e-gov.go.jp/law/345M50000800007  # 第十三条第一項第二号: 「二字以下のアラビア数字」 — 'two or fewer', which is what admits the one-character form"
        - "https://ja.wikipedia.org/wiki/日本のナンバープレート  # secondary: single-digit class codes gave way to two-digit codes from October 1967, nationwide by April 1971"
      notes: >-
        THE OLDEST SHAPE STILL IN THE STATUTE. Every row of 別表第二 opens with a BARE
        SINGLE CHARACTER before its two- and three-character blocks, so a
        one-digit class code remains a lawful Japanese registration number in 2026
        — it is simply not issued any more. matching is RECALL-ONLY and
        deliberately so: this one regex is the union of all eight statutory ranges
        (1, 2, 3, 4, 5, 6, 8, 9 and 0 are between them every digit), so a match
        says only 'this string has a shape Japan has issued', never which class
        the vehicle is. Splitting it into eight single-digit series would have
        produced eight regexes of the form '\\A3 \\d{2}-\\d{2}\\z' whose union is
        exactly this one, at the cost of eight ids that no consumer can tell apart
        from a plate photograph. It is here for recall, and for the honest
        statement that Japan never withdrew the form.

    - id: jp-registered-usforces
      class: standard
      categories: [car, van, truck]
      period: { start: 1970 }
      period_evidence: instrument-in-force
      matching: strict
      format:
        pattern: "999 L 99-99"
        regex: '\A\d[0-9A-Z]{2} [A-Z] \d{2}-\d{2}\z'
        regex_strict: '\A\d[0-9A-Z]{2} [EHKMTY] \d{2}-\d{2}\z'
        charset:
          use_marks: "ＥＨＫＭＴＹよ (別表第三 group 4) — six Latin capitals and one hiragana"
          ascii_use_marks: "EHKMTY"
          note: "The hiragana member よ cannot appear in the ASCII projection and is therefore outside both regexes; a plate carrying よ is this series but will not match. Recorded as a known incompleteness rather than papered over."
        fields:
          - { n: 1, name: "運輸支局等を表示する文字", en: "office place-name mark", script: "Han/Hiragana", in_projection: false, decode: "plates/_decode/jp-office-marks.yml" }
          - { n: 2, name: "分類番号", en: "class code", script: "Latin/digits", in_projection: true, statute: "自動車登録規則 第十三条第一項第二号 + 別表第二 — the ORDINARY class codes; this series is defined by field 3, not field 2" }
          - { n: 3, name: "ローマ字", en: "use-category mark", script: "Latin", in_projection: true, statute: "自動車登録規則 第十三条第一項第三号 + 別表第三 group 4", form: "one of ＥＨＫＭＴＹよ" }
          - { n: 4, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true }
      design:
        plate: { w: 330, h: 165, unit: mm }
        plate_variants:
          - { w: 440, h: 220, unit: mm, note: "大型番号標 — Form No. 1 remark (4) proviso: 普通自動車 of 8,000 kg or more gross vehicle weight, 5,000 kg or more maximum load, or 30 or more seats. The drawing carries both sets of dimensions, the large one in parentheses throughout (remark (7))." }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        emblem: { present: false }
        rear_differs: false
        characters:
          serial_height_mm: 80
          top_line_height_mm: 40
          office_mark_width_mm: 30
          office_mark_width_4char_mm: 22
          class_code_width_4char_mm: 23
          note: >-
            Form No. 1 remarks (4)-(6) and the statutory drawing. Widths shrink when
            the office mark is four characters (尾張小牧, 伊勢志摩) and shrink again
            when the class code is three characters rather than two; remark (5)
            gives a separate 33 x 28 mm box to a three-character mark whose second
            character is ケ. On the 440 x 220 mm plate every figure in parentheses
            applies instead.
        font:
          name: "statutory drawing (no named typeface)"
          statutory_basis: "道路運送車両法施行規則 第十一条: 「自動車登録番号標は、第一号様式による。」 — the glyphs are the drawing in Form No. 1, exactly the British and German posture (PRD-PLATES §6). No typeface is named anywhere in the instrument."
          licence: "e-Gov Laws Search publishes the instrument and its Form drawings; the drawings are Japanese government works published inside a ministerial ordinance. Cite and build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      sources:
        - "https://laws.e-gov.go.jp/api/1/lawdata/345M50000800007  # 別表第三 group 4: 「日本国籍を有しない者が所有する自家用自動車で、法令の規定により関税又は消費税が免除されているもの及び別に国土交通大臣が指定するもの」 -> ＥＨＫＭＴＹよ"
        - "https://laws.e-gov.go.jp/law/345M50000800007  # 第十三条第一項第三号: the use-mark field is 「平仮名又はローマ字」 — Roman letters are on the face of the rule, not an exception to it"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第一号様式（自動車登録番号標）（第十一条関係） remark (3): the colours are the ordinary 自家用 colours; nothing in the Form distinguishes this series visually except the mark itself"
      notes: >-
        THE ONE JAPANESE PLATE WHOSE ASCII PROJECTION IS COMPLETE. Everywhere else
        in this file the use-mark field is hiragana and drops out of the
        projection; here 別表第三 group 4 fills it with a Latin capital, which IS in
        the §2.6 serial alphabet, so `300 Y 20-46` is a fully projected Japanese
        plate. The category is statutory and is about CUSTOMS, not about armed
        forces: 「日本国籍を有しない者が所有する自家用自動車で、法令の規定により関税又は消費税が免除されているもの」 — privately
        owned vehicles of non-Japanese nationals exempted from customs duty or
        consumption tax, plus anything the Minister separately designates. class
        is recorded as `standard` rather than `military` for exactly that reason:
        _meta/classes.yml defines military as an armed-forces REGISTRATION SYSTEM,
        and this is an ordinary civil registration with a distinguishing use mark.
        The plate is popularly the 'Y plate' after its most-photographed member.
        period.start is the 1970 Regulations' in-force date and is an instrument
        date, not the date the arrangement began.

