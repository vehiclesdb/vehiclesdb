        class, 6 being the overflow block opened when 4 filled. TWO-DIGIT CLASS
        CODE ERA. 自動車登録規則 第十三条第一項第二号 sanctions 「二字以下のアラビア数字」 and 別表第二 lists the
        two-digit block for this range explicitly. period.start is the in-force
        date of the 1970 Regulations (1 March 1970) and carries period_evidence:
        instrument-in-force for exactly the reason PRD-PLATES states — it is a
        CONSOLIDATION documenting an older practice, not the date the practice
        began. Two-digit codes are universally dated to October 1967 (first
        prefectures) and April 1971 (nationwide) by secondary sources; neither was
        pinned to an instrument in this pass and neither is asserted as the start.
        period.end 1999 is likewise secondary: ja.wikipedia dates the nationwide
        switch to three digits to 14 May 1999, and no two-digit code has been
        ISSUED since. Plates already carrying one remain valid indefinitely, which
        is why this series is `ended` rather than withdrawn, and why it still
        matters to a parse API in 2026.

