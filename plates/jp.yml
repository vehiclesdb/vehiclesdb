    - id: jp-motorcycle-over250
      class: motorcycle
      categories: [motorcycle]
      period: { start: 1970 }
      period_evidence: instrument-in-force
      matching: strict
      format:
        pattern: "99-99"
        regex: '\A\d{2}-\d{2}\z'
        fields:
          - { n: 1, name: "運輸支局等を表示する文字", en: "office place-name mark", script: "Han/Hiragana", in_projection: false, decode: "plates/_decode/jp-office-marks.yml", statute: "道路運送車両法施行規則 第三十六条の十八第一項第一号 + 第二項" }
          - { n: 2, name: "平仮名又はローマ字", en: "use-category mark", script: "Hiragana", in_projection: false, decode: "plates/_decode/jp-use-marks.yml", statute: "道路運送車両法施行規則 第三十六条の十八第一項第二号 + 別表第三" }
          - { n: 3, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true, statute: "道路運送車両法施行規則 第三十六条の十八第一項第三号" }
      design:
        plate: { w: 230, h: 125, unit: mm }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        border: { color: "#00693E", width_mm: 8, note: "Form No. 13 remark (3): 「自家用自動車にあつては白地に緑文字、枠は緑色とすること」 — the border is PRESCRIBED, not decorative, and its colour inverts with the plate's. The 8 mm width is read off the drawing." }
        emblem: { present: false }
        rear_differs: false
        characters:
        serial_height_mm: 60
        top_line_height_mm: 30
        office_mark_width_mm: 22
        office_mark_width_4char_combination_mm: 17.5
        note: "Form No. 13 remarks (4)-(6) and the drawing: 230 x 125 mm overall, 22 mm office-mark width, dropping to 17.5 mm where a four-character office mark meets a two-character use mark, in which case the Roman letter of the combination is 19 mm wide."
        font:
        name: "statutory drawing (no named typeface)"
        statutory_basis: "道路運送車両法施行規則 第四十五条第一項第三号: 二輪の小型自動車の車両番号標 is 第十三号様式."
        licence: "as Form No. 1 — cite, build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      region_encoding_mechanism: >-
        Field 1 is the same statutory office mark as every other Japanese
        number, by the cross-reference in 第三十六条の十八第二項 to 第三十六条の十七第二項 and thence
        to 自動車登録規則 別表第一.
      variants:
      - class: taxi
        design: { background: { color: "#00693E", finish: painted, hex_basis: observed }, foreground: "#FFFFFF", border: { color: "#FFFFFF" } }
        note: >-
          事業用 issue. Form No. 13 remark (3) inverts BOTH the plate and its border:
          「事業用自動車にあつては緑地に白文字、枠は白色とし」. The use-mark set inverts too
          — 別表第三 group 1 gives ゆりれ.
        sources:
          - "https://laws.e-gov.go.jp/law/326M50000800074  # 第十三号様式 remark (3)"
      sources:
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第三十六条の十八第一項: 二輪の小型自動車の車両番号 is THREE fields — office mark, use mark, and four-or-fewer digits. There is NO class code."
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第四十五条第一項第三号 + 第十三号様式 remark (3) (colours + border) and remarks (4)-(6) + the drawing (230 x 125 mm)"
        - "https://laws.e-gov.go.jp/law/326AC0000000185  # 第七十三条第一項 (display obligation for 二輪の小型自動車), 第六十条第一項 (the number is assigned on first inspection)"
      notes: >-
        MOTORCYCLES OVER 250 cc, AND THE SHORTEST STATUTORY COMPOSITION IN JAPAN:
        第三十六条の十八第一項 lists THREE fields, not four. There is no class code on this
        plate at all, which is why its ASCII projection is the bare serial and why
        this regex cannot distinguish a Japanese motorcycle from any other
        jurisdiction's two-plus-two digit mark. The plate's identity is carried
        almost entirely by its GEOMETRY AND BORDER — 230 x 125 mm with a
        prescribed green border on white — which is exactly the case PRD-PLATES
        §3's render layer exists to serve. matching is `strict` because the regex
        is the sourced grammar of the projected field, not a widened union;
        consumers should nonetheless treat a bare 99-99 hit as weak evidence and
        lean on `design`.

