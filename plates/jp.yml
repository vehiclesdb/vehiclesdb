      notes: >-
        THE TWO-CHARACTER USE MARK, AND THE ONLY ORDINARY PRIVATE JAPANESE PLATE
        THAT PRINTS A LATIN CAPITAL. 別表第三 group 2 gives private motorcycles a
        second form: a character from {Ｃ, Ｌ, Ｖ} FOLLOWED BY one of the ordinary
        hiragana — Cあ, Lあ, Vあ and so on — which multiplies the available serial
