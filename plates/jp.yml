    - id: jp-imperial
      class: government
      categories: [car]
      period: { start: 1951 }
      period_evidence: instrument-in-force
      matching: recall-only
      format:
        pattern: "9"
        regex: '\A\d\z'
        fields:
          - { n: 1, name: "皇", en: "the character 皇 (kō, 'imperial'), upper line", script: "Han", in_projection: false }
          - { n: 2, name: "数字", en: "serial, lower line", script: "digits", in_projection: true }
      design:
        background: { color: "#C0C0C0", finish: "梨地 (matte, 'pear-skin')", hex_basis: observed }
        foreground: "#D4AF37"
        emblem: { present: true, rendered: placeholder, note: "Form No. 1-2 remark (2): 「自動車登録番号標は、梨地に図示の紋様を配し、自動車登録番号は、浮出しとすること。」 — a drawn 紋様 (pattern) is part of the plate. PRD-PLATES §3's placeholder rule applies with unusual force here: the design is imperial insignia and no licence position was researched." }
        rear_differs: false
        characters:
        stroke_width_mm: 4
        note: "Form No. 1-2 remark (4): 「文字は、幅4ミリメートルとすること。」 — a STROKE width, not a character width, and the only such figure in the Japanese Forms."
      region_encoding: "none"
      sources:
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第十一条第二項: 「宮内庁の所管に属する自動車であつて、専ら天皇、皇后又は皇太后の用に供すべきものの自動車登録番号標は、第一号様式の二による。」"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第一号様式の二 remarks (1)-(5): 「上段の『皇』及び下段の数字をもつて表示する」; 梨地 + drawn pattern; 「銀色地に金文字」; 4 mm stroke"
      notes: >-
        THE IMPERIAL PLATE, and it is a ministerial-ordinance provision rather
        than a courtesy: 第十一条第二項 requires Form No. 1-2 for vehicles under the
        Imperial Household Agency used exclusively by the Emperor, Empress or
        Empress Dowager. Gold characters on a silver matte ground, with a drawn
        pattern, an upper-line 「皇」 and a lower-line numeral. matching is
        RECALL-ONLY and must be: the identifying element is the character 皇, which
        is not in the serial alphabet, so the ASCII projection is a bare digit and
        a regex match on it says nothing at all. This is the clearest case in the
        dataset of a plate whose identity survives the projection only in `design`
        and `fields`. The Form does not state how many digits the number may have
        — 「下段の数字」 without a count — so no width claim is made.

