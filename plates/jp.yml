          class_code_note: "別表第二 row: ５　人の運送の用に供する小型自動車"
        fields:
          - { n: 1, name: "運輸支局等を表示する文字", en: "office place-name mark", script: "Han/Hiragana", in_projection: false, decode: "plates/_decode/jp-office-marks.yml", statute: "自動車登録規則 第十三条第一項第一号" }
          - { n: 2, name: "分類番号", en: "class code", script: "Latin/digits", in_projection: true, statute: "自動車登録規則 第十三条第一項第二号 + 別表第二", form: "three Arabic numerals" }
          - { n: 3, name: "平仮名又はローマ字", en: "use-category mark", script: "Hiragana", in_projection: false, decode: "plates/_decode/jp-use-marks.yml", statute: "自動車登録規則 第十三条第一項第三号 + 別表第三" }
          - { n: 4, name: "四けた以下のアラビア数字", en: "serial", script: "digits", in_projection: true, statute: "自動車登録規則 第十三条第一項第四号" }
      design:
        plate: { w: 330, h: 165, unit: mm }
        plate_variants:
          - { w: 440, h: 220, unit: mm, note: "大型番号標 — Form No. 1 remark (4) proviso: 普通自動車 of 8,000 kg or more gross vehicle weight, 5,000 kg or more maximum load, or 30 or more seats. The drawing carries both sets of dimensions, the large one in parentheses throughout (remark (7))." }
        background: { color: "#FFFFFF", finish: painted, hex_basis: observed }
        foreground: "#00693E"
        emblem: { present: false }
        rear_differs: false
        characters:
          serial_height_mm: 80
          top_line_height_mm: 40
          office_mark_width_mm: 30
          office_mark_width_4char_mm: 22
          class_code_width_4char_mm: 23
          note: >-
            Form No. 1 remarks (4)-(6) and the statutory drawing. Widths shrink when
            the office mark is four characters (尾張小牧, 伊勢志摩) and shrink again
            when the class code is three characters rather than two; remark (5)
            gives a separate 33 x 28 mm box to a three-character mark whose second
            character is ケ. On the 440 x 220 mm plate every figure in parentheses
            applies instead.
        font:
          name: "statutory drawing (no named typeface)"
          statutory_basis: "道路運送車両法施行規則 第十一条: 「自動車登録番号標は、第一号様式による。」 — the glyphs are the drawing in Form No. 1, exactly the British and German posture (PRD-PLATES §6). No typeface is named anywhere in the instrument."
          licence: "e-Gov Laws Search publishes the instrument and its Form drawings; the drawings are Japanese government works published inside a ministerial ordinance. Cite and build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      region_encoding_mechanism: >-
        Field 1 is the place-name mark and it resolves through the statutory
        table in plates/_decode/jp-office-marks.yml. It names the OFFICE of the
        vehicle's base of use at the moment the number was assigned — not the
        keeper's address, and not necessarily the current location: 第十三条第二項
        preserves a number across a boundary redraw. The class code carries no
        geography at all.
      variants:
      - class: taxi
        design: { background: { color: "#00693E", finish: painted, hex_basis: observed }, foreground: "#FFFFFF" }
        note: >-
          事業用 (for-hire) issue of the SAME class code and the SAME projected
          format, on the inverted colours Form No. 1 remark (3) prescribes:
          白地に緑文字 for 自家用, 緑地に白文字 for 事業用. It is a sub-entry and not
          a series because the ASCII projection is identical (PRD-PLATES §2.3:
          "a color-only variant of the same format+period is a sub-entry").
          What changes with the colour is the USE-MARK SET, which is a decode
          fact: 別表第三 group 1 (あいうえかきくけこを) for 事業用 against group 2
          (さすせそたちつてとなにぬねのはひふほまみむめもやゆらりるろ) for 自家用.
          The `taxi` class flag is the nearest term in _meta/classes.yml; the
          Japanese category is 自動車運送事業の用に供する自動車, which covers taxis,
          route and charter buses and licensed freight carriers alike.
        sources:
          - "https://laws.e-gov.go.jp/law/326M50000800074  # 第一号様式（自動車登録番号標）（第十一条関係） remark (3): the two-colour rule, verbatim in common.colours"
          - "https://laws.e-gov.go.jp/law/345M50000800007  # 別表第三 groups 1 and 2 — the two use-mark sets the colour selects"
      sources:
        - "https://laws.e-gov.go.jp/law/345M50000800007  # 自動車登録規則 第十三条第一項: the four-field composition, and 別表第二 (第十三条関係): the class-code ranges quoted in common.class_codes"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第一号様式（自動車登録番号標）（第十一条関係） remark (3): 「自動車登録番号標の塗色は、事業用自動車にあつては緑地に白文字とし、自家用自動車にあつては白地に緑文字とするほか、国土交通大臣の定めるところによる。」 and remarks (4)-(7) + the drawing: 330 x 165 mm, (440 x 220) for the vehicles in the remark (4) proviso"
        - "https://laws.e-gov.go.jp/api/1/lawdata/345M50000800007  # 別表第二 row for this range, verbatim in common.class_codes.registered_rows"
        - "https://www.mlit.go.jp/hakusyo/transport/heisei10/topic/11.html  # 運輸白書 平成10年: 「１０年５月６日より、全国２６地域で希望ナンバー制を実施した」 + the 26 areas and the 26 lottery numbers"
        - "https://ja.wikipedia.org/wiki/日本のナンバープレート  # secondary: 分類番号3桁化 dated 1998-05-19 (pilot) and 1999-05-14 (nationwide) — tagged secondary, see notes"
      notes: >-
        5 and 7 are ONE statutory range; the 7 block is the overflow, which is why
        a 7-series plate is not a different kind of car from a 5. THREE-DIGIT
        NUMERIC CLASS CODE — the current ordinary issue. The period claim is the
        weakest in this file and is labelled accordingly. What IS primary: the
        運輸白書 (Ministry of Transport White Paper) for 1998 records that the 希望番号制
        (desired-number system) started 「１０年５月６日より、全国２６地域で」 — 6 May 1998, in 26
        named areas — and the desired-number system is what the third digit exists
        to serve. What is NOT primary: the 3-digit rollout dates themselves.
        ja.wikipedia gives 19 May 1998 for the pilot areas and 14 May 1999 for the
        nationwide switch. THE TWO DATES DISAGREE (6 vs 19 May 1998) AND ARE NOT
        AVERAGED HERE: the White Paper is the better evidence for the 希望番号 launch,
        the encyclopaedia for the class-code rollout, and both are cited so a
        verifier can resolve it.

