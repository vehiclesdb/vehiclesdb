        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第二十六条の六第一項 + 第五号様式: remark (1) (office mark above, four-or-fewer digits below, plus the frame), remark (2) (the Form No. 3 office table), remark (3) (「白地に黒文字とし、枠は赤色とすること」), remark (8) (275 mm mounting-hole spacing on the large plate), remark (9) (a moulded plastic plate may omit the holes)"
      notes: >-
        THE RED-FRAMED TRADE PLATE (回送運行許可番号標), issued to dealers and transporters
        against a 回送運行許可証 so that unregistered vehicles can be moved. It is the
        plate most often confused with the temporary-operation plate, and the
        instrument separates them cleanly: a red FRAME here (Form No. 5 remark
        (3)) against a red DIAGONAL there (Form No. 3 remark (4)). Two details
