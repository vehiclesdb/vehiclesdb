        - "https://laws.e-gov.go.jp/api/1/lawdata/345M50000800007  # 別表第二 row for this range, verbatim in common.class_codes.registered_rows"
        - "https://www.mlit.go.jp/hakusyo/transport/heisei10/topic/11.html  # 運輸白書 平成10年: 「１０年５月６日より、全国２６地域で希望ナンバー制を実施した」 + the 26 areas and the 26 lottery numbers"
        - "https://ja.wikipedia.org/wiki/日本のナンバープレート  # secondary: 分類番号3桁化 dated 1998-05-19 (pilot) and 1999-05-14 (nationwide) — tagged secondary, see notes"
      notes: >-
        ONE statutory range, TWO leading digits: 4 and 6 are the same vehicle
        class, 6 being the overflow block opened when 4 filled. THREE-DIGIT
        NUMERIC CLASS CODE — the current ordinary issue. The period claim is the
        weakest in this file and is labelled accordingly. What IS primary: the
        運輸白書 (Ministry of Transport White Paper) for 1998 records that the 希望番号制
        (desired-number system) started 「１０年５月６日より、全国２６地域で」 — 6 May 1998, in 26
        named areas — and the desired-number system is what the third digit exists
        to serve. What is NOT primary: the 3-digit rollout dates themselves.
