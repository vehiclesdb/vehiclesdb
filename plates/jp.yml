        licence: "as Form No. 1 — cite, build to, never redistribute (PRD-PLATES §6)."
      region_encoding: "plates/_decode/jp-office-marks.yml"
      sources:
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第三十六条の十八第一項第二号: the use-mark field for a motorcycle over 250 cc is 「平仮名又はローマ字」 and points at this same 別表第三"
        - "https://laws.e-gov.go.jp/law/326M50000800074  # 第十三号様式 remarks (3)-(6): colours, border and the widths that apply when a Roman letter stands in the use-mark position"
        - "https://laws.e-gov.go.jp/api/1/lawdata/326M50000800074  # 別表第三 group 4: 「日本国籍を有しない者が所有する自家用自動車で、法令の規定により関税又は消費税が免除されているもの及び別に国土交通大臣が指定するもの」 -> ＡＢＥＨＫＭＴＹよ"
      notes: >-
        THE WIDEST DUTY-EXEMPT SET OF THE THREE. A registered vehicle gets ＥＨＫＭＴＹよ
        and a kei one gets ＡＢ; a motorcycle over 250 cc gets the UNION, ＡＢＥＨＫＭＴＹよ,
        which is the only place the two alphabets meet. Its projected shape
        collides exactly with jp-motorcycle-over250-combination's — both project
        to a Latin capital, a space and the serial — and the two are told apart
        only by WHICH capital: {Ｃ, Ｌ, Ｖ} for the ordinary combination against
        {Ａ,Ｂ,Ｅ,Ｈ,Ｋ,Ｍ,Ｔ,Ｙ} here. The sets are disjoint, which is why both series
        can carry a `regex_strict` that genuinely discriminates, and why a
        consumer must read the strict twins rather than the round-trippable regex
        to tell them apart.

    - id: jp-motorcycle-126-250
