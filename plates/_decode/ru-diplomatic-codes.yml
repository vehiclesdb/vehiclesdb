  rows checked). The list's earlier history was not read. `period.start: 2017`
  on a row means "in the 2017 list", not "first assigned in 2017".
# `name` is the instrument's wording, verbatim. `name_en` is EDITORIAL.
# `row` is the instrument's row number in its section.

