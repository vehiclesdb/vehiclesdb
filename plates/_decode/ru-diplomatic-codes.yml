# plates/_decode/ru-diplomatic-codes.yml — the three-digit codes on Russian red
# plates (ГОСТ Р 50577-2018 types 9, 10 and 11).
#
# SOURCE: Приложение № 2 to Приказ МВД России от 05.10.2017 № 766 — «Перечень
# цифровых кодов, применяемых на государственных регистрационных знаках для
# обозначения транспортных средств, принадлежащих дипломатическим
# представительствам, консульским учреждениям, в том числе возглавляемым
# почетными консульскими должностными лицами, международным
# (межгосударственным) организациям и их сотрудникам, аккредитованным при
# Министерстве иностранных дел Российской Федерации». Read from the SIGNED
# SCANS on publication.pravo.gov.ru: the 2017 order and all nine orders that
# changed this appendix (№ 730/2018, № 222/2019, № 130/2020, № 269/2021,
# № 660/2021, № 553/2022, № 810/2022, № 267/2023, № 896/2024, № 253/2025,
# № 942/2025). OCR'd locally; uncertain cells checked on the page image.
#
# THREE SECTIONS, as the instrument has them: I states (001-172), II
# international organisations (499-568), III honorary consular posts (900).
# Codes are assigned by МВД "по согласованию с МИД России" (order п. 2.3).
#
# HOW THE CODE IS USED (ГОСТ Р 50577-2018 п. 3.3; order п. 2.1-2.2):
#   type 9  — "222 ММ 0 55": code, the series «CD», one digit, region code.
#             «CD» — "для легковых автомобилей глав дипломатических представительств"
#             (cars of heads of diplomatic missions).
#   type 10 — "222 М 000 55": code, series «D» or «T», three digits, region code.
#             «D» — missions, consular posts (including honorary-consul-led),
#             international organisations and their staff "имеющих дипломатические
#             или консульские карточки" (holding diplomatic or consular cards).
#             «T» — staff of missions, consular posts (except honorary-consul-led
#             ones) and international organisations "имеющих служебные карточки
#             или удостоверения" (holding service cards or certificates).
#   type 11 — "М 222 / 00 55": motorcycles, series letter then code.
#   Honorary consuls: one vehicle only (order п. 2.4, added by № 553 of 2022).
#
# THE CODE IS ROW-STABLE, NOT ROW-NUMBERED: gaps in the code sequence (046, 059,
# 084, 085, 092, 096, 102, 104, 106, ...) are printed gaps. Rows are closed by
# period, never deleted from this file, so an older plate still decodes.
# One code has been RE-USED: 171 (see the rows).
#
# INSTRUMENT ANOMALY, recorded not corrected: the signed 2017 order prints
# «Демократическая Республика Конго» against BOTH 042 and 077.
