# ---------------------------------------------------------------------------
# 8. CODES CREATED AFTER THE ANNEX — the 2022 Papua provinces.
#    NOT IN PERPOL 7/2021. Each is sourced to the police or to press quoting
#    them, and tiered accordingly. Perpol 7/2021 has not been amended to add
#    them as far as this pass found (see §VERIFIER in plates/id.yml).
# ---------------------------------------------------------------------------
post_annex_codes:
  - code: PY
    province: Papua Barat Daya
    replaces: PB
    since: "2024-05"
    since_precision: month
    evidence: secondary-press-citing-agency
    source: "https://oto.detik.com/berita/d-7501604/kode-pelat-nomor-di-3-provinsi-papua-diubah  # detikOto 21 Aug 2024: 'Dikutip situs resmi Korlantas Polri, Pemprov Papua Barat Daya pada bulan Mei lalu menjelaskan kode awal pelat nomor provinsi yang sebelumnya PB berubah menjadi PY. Sedangkan kode PB masih difungsikan untuk pelat nomor kendaraan di Papua Barat.' The Korlantas page quoted was not located. Accessed 2026-11-25"
  - code: PS
    province: Papua Selatan
    replaces: PA
    since: "2024-07"
    since_precision: month
    evidence: secondary-press-citing-agency
    source: "https://oto.detik.com/berita/d-7501604/kode-pelat-nomor-di-3-provinsi-papua-diubah  # detikOto 21 Aug 2024: 'sejak Juli, pelat nomor kendaraan di Papua Selatan berubah dari PA menjadi PS. Sedangkan PA masih dipakai di provinsi Papua.' Accessed 2026-11-25"
  - code: PT
    province: Papua Tengah
    replaces: PA
    since: "2024-08-19"
    since_precision: day
    evidence: secondary-press-citing-agency
    source: "https://papua.antaranews.com/berita/727031/pemprov-papua-tengah-hadirkan-plat-nomor-kendaraan-kode-pt  # ANTARA Papua 20 Aug 2024: 'penyerahan plat kendaraan nomor \"PT 1\" oleh Dirlantas Polda Papua kepada Penjabat Gubernur Papua Tengah Ribka Haluk ... Senin (19/8)'; detikOto d-7501604 (21 Aug 2024) corroborates PA -> PT. Accessed 2026-11-25"
  - code: PG
    province: Papua Pegunungan
    replaces: PA
    since: "2024-10-24"
    since_precision: day
    evidence: secondary-press-quoting-police
    source: "https://rri.co.id/wamena/regional/1070172/pemprov-papua-pegunungan-launching-plat-nomor-kendaraan-pg  # RRI Wamena (the state broadcaster) 25 Oct 2024: 'Pemerintah Provinsi Papua Pegunungan resmi melaunching nomor registrasi kendaraan bermotor dari PA menjadi PG' on Thursday 24/10/2024, with the Direktur Lalu Lintas Polda Papua, Kombes Pol Abrianto Pardede, quoted: 'hari ini resmi bahwa Provinsi Papua Pegunungan adalah PG'. Accessed 2026-11-25"
    corroboration: "https://www.ceposonline.com/papua-pegununungan/1995235616/hari-ini-provinsi-papua-pegunungan-resmi-gunakan-kode-kendaraan-pg  # Cenderawasih Pos 25 Oct 2024, same ceremony and the same police quote. Accessed 2026-11-25"

# ---------------------------------------------------------------------------
# 9. WITHDRAWN CODES — no longer issued. Rows are closed, never deleted, so
#    old plates stay decodable. Secondary tier unless stated.
# ---------------------------------------------------------------------------
withdrawn_codes:
  - code: DS
    area: "Papua (the whole of western New Guinea, later the provinces Papua and Papua Barat)"
    replaced_by:
      - { code: PB, area: "Papua Barat", when: "2013-05", evidence: secondary-wikipedia }
      - { code: PA, area: "Papua", when: "2016-07-01", evidence: official-press }
    origin: "added in the 1920s for western Papua, per both articles (secondary-wikipedia)"
    sources:
      - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # 'DS: Papua (sebelum Juli 2016) dan Papua Barat (sebelum Mei 2013)'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
      - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # 'DS – Papua, prior to 2016'; no date for Papua Barat. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
      - "https://www.jpnn.com/news/resmi-nomor-polisi-di-papua-bukan-ds-lagi  # JPNN, 2 Jul 2016: Papua's code changed 'Dari semula DS, kini menjadi PA', marked by the Kapolda Papua handing plate PA 1 to the provincial government on Friday 1 July 2016 (the police's 70th anniversary). Evidence: official-press (a police ceremony reported by press). Accessed 2026-11-25"
    disagreement: "The two articles agree on DS -> PA in 2016; only id.wikipedia dates the Papua Barat change (May 2013). No source for the PB date was read."
  - code: DF
    area: "Timor Timur (East Timor), as an Indonesian province"
    ended: "with the territory's separation from Indonesia; neither article gives a date"
    sources:
      - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # 'DF: Timor Timur (telah menjadi negara sendiri)'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
      - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # 'DF – East Timor'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
  - code: BR
    area: "Kalimantan Barat (the western Borneo residency)"
    replaced_by:
      - { code: KB, area: "Kalimantan Barat", when: "not dated in either article", evidence: secondary-wikipedia }
    sources:
      - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # 'BR: Kalimantan Barat (telah berganti menjadi KB)'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
      - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # 'BR – ex Borneo Residency, Western region'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
withdrawn_codes_note: >-
  The province-split codes of 2024 (PY, PS, PT, PG) did NOT withdraw PA or
  PB, which remain in use for the rump provinces (section 8). Other code
  reassignments the articles mention in passing (for example the colonial
  DA covering both South and East Kalimantan before KT, KH and KU existed)
  are recorded in section 10, not here, because no withdrawal date is
  given for them.

# ---------------------------------------------------------------------------
# 10. COLONIAL AND EARLY CODES — history, secondary tier throughout.
#     Both articles give the residency-based code list of the 1917 system,
#     citing the Java Motor Club's handbook (KITLV copy, not downloaded in
#     this pass). They differ in several rows; both readings are kept.
# ---------------------------------------------------------------------------
colonial_codes:
  evidence: secondary-wikipedia
  sources:
    - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # section 'Sejarah'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
    - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # section 'History > Colonial era'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
  cited_primary_not_read: "https://kitlv-docs.library.leiden.edu/open/371342406.pdf  # Java Motor Club, 'Handboek voor automobilisten en motorwielrijders', cited by both articles for the list. Not downloaded; a verifier should read it and replace this section's tier."
  before_1917:
    period: { start: 1900, end: 1917 }
    note: >-
      Plates appear in the Dutch East Indies in 1900 with a regional code and
      a number but no official standard, not always front and rear (some on
      the side). Example codes given: CH Cirebon, SB Surabaya, SOK the east
      coast of Sumatra; and IN for government vehicles, on an elliptical plate
      with the number on a rectangular plate below.
  system_1917:
    note: >-
      From 1917, under the "Voorschriften omtrent den inhoud der aanvragen om
      nummer- en rijbewijzen ..." (the regulation on applications for number
      and driving licences, the assignment of numbers and letters, and the
      registers), codes follow the residency (karesidenan), first on Java and
      then elsewhere. The current region codes descend from this list.
    codes:
      - { code: A,  area: "Banten" }
      - { code: B,  area: "Batavia" }
      - { code: D,  area: "Priangan (Preanger Regencies)" }
      - { code: E,  area: "Cirebon" }
      - { code: G,  area: "Pekalongan" }
      - { code: H,  area: "Semarang" }
      - { code: K,  area: "Rembang", id_wikipedia: "Rembang/Pati", en_wikipedia: "Rembang" }
      - { code: L,  area: "Surabaya", id_wikipedia: "L/W Surabaya", en_wikipedia: "L Surabaya; W not listed" }
      - { code: M,  area: "Madura" }
      - { code: N,  area: "Pasuruan", id_wikipedia: "Pasuruan", en_wikipedia: "Pasuruan, Malang" }
      - { code: P,  area: "Besuki" }
      - { code: R,  area: "Banyumas" }
      - { code: T,  area: "Karawang", id_wikipedia: "Karawang", en_wikipedia: "not listed" }
      - { code: AA, area: "Kedu" }
      - { code: AB, area: "Yogyakarta" }
      - { code: AD, area: "Surakarta" }
      - { code: AE, area: "Madiun" }
      - { code: AG, area: "Kediri" }
      - { code: BA, area: "the west coast of Sumatra" }
      - { code: BB, area: "Tapanuli" }
      - { code: BD, area: "Bengkulu" }
      - { code: BE, area: "Lampung" }
      - { code: BG, area: "Palembang" }
      - { code: BH, area: "Jambi" }
      - { code: BK, area: "East Sumatra" }
      - { code: BL, area: "Aceh" }
      - { code: BM, area: "Riau" }
      - { code: BN, area: "Bangka" }
      - { code: BP, area: "disputed", id_wikipedia: "Belitung", en_wikipedia: "Riau Islands" }
      - { code: BR, area: "West Kalimantan (withdrawn, see section 9)" }
      - { code: DA, area: "South and East Kalimantan" }
      - { code: DB, area: "Manado" }
      - { code: DD, area: "Sulawesi" }
      - { code: DE, area: "Ambon" }
      - { code: DG, area: "Ternate" }
      - { code: DH, area: "Timor" }
      - { code: DK, area: "Bali and Lombok" }
    disagreements:
      - "K: id.wikipedia 'Rembang/Pati', en.wikipedia 'Rembang'."
      - "L/W: id.wikipedia lists W with L for Surabaya; en.wikipedia lists only L."
      - "N: en.wikipedia adds Malang; id.wikipedia gives Pasuruan only."
      - "T (Karawang): in id.wikipedia's list, absent from en.wikipedia's."
      - "BP: id.wikipedia Belitung, en.wikipedia Riau Islands (today BP is Kepulauan Riau and Belitung is under BN)."
  added_by_1920s:
    note: "Until the 1920s codes were added as residencies were split; both articles give F for Bogor, S for Bojonegoro and DS for western Papua as examples."
    codes:
      - { code: F,  area: "Bogor" }
      - { code: S,  area: "Bojonegoro" }
      - { code: DS, area: "western Papua (withdrawn 2013/2016, see section 9)" }
  after_1945: >-
    Both articles say the colonial format and codes stayed in use after
    independence, the expiry line being added in the early 1980s (see
    plates/id.yml common.history).

# ---------------------------------------------------------------------------
