# plates/_decode/id-region-codes.yml — Indonesian region codes (kode wilayah),
# registration codes (kode registrasi) and the other decodable parts of an
# Indonesian registration number (NRKB). Referenced by plates/id.yml.
#
# ===========================================================================
# THE SOURCE, AND WHY THIS TABLE IS PRIMARY WHEN MOST OF id.yml IS NOT
# ===========================================================================
# Peraturan Kepolisian Negara Republik Indonesia Nomor 7 Tahun 2021 tentang
# Registrasi dan Identifikasi Kendaraan Bermotor (Perpol 7/2021), set and
# promulgated 5 May 2021, Berita Negara 2021 No. 476, in force on promulgation
# (Pasal 92). Pasal 6(3): the region code "diterbitkan berdasarkan wilayah
# registrasi Ranmor"; Pasal 6(8) puts the format of the region code, the number
# and the series letters "dalam Lampiran yang merupakan bagian tidak
# terpisahkan" of the regulation. Lampiran A ("Penentuan kode wilayah
# berdasarkan wilayah Regident Ranmor", PDF pages 81-95) is that table: 34
# provinces, 57 codes, each with the regencies and cities it covers.
#
# Every row in `codes` was checked line by line against the page images of
# Korlantas' own copy of the regulation (PDF pages 81-95), not only against a
# text extraction. Area names are kept EXACTLY AS PRINTED, typos included
# ("Kab. Malajengka", "Kab. Serdang Begadai", "Provinsi Kalimatan Barat"),
# because the printed string is the evidence; what each odd string means is
# said in that row's `printed_text_notes`, never by silently correcting it.
#
# ===========================================================================
# WHAT THE ANNEX DOES NOT CONTAIN — READ BEFORE USING THIS FOR A PARSE API
# ===========================================================================
# 1. NO SUB-AREA (SUFFIX-LETTER) TABLE. The letters after the number are a
#    progressive series in the regulation (Lampiran C.3: A to Z, then AA, then
#    AAA). Which letters a Polda reserves for which regency is set by each
#    Kapolda (Pasal 6(7): letter series beyond two letters "dan wilayah
#    penggunaannya ditetapkan dengan Keputusan Kepala Kepolisian Daerah atas
#    persetujuan Kakorlantas Polri"; Lampiran E.1, F.4 and G.3: "seri huruf
#    yang diatur oleh Kapolda"). None of those Kapolda decisions was found
#    published. The only complete suffix tables in circulation are
#    encyclopaedia tables under a ShareAlike licence, which this dataset cannot
#    carry (AGENTS.md). So a decoder can name the PROVINCE and the LIST of
#    regencies a code covers, and nothing finer. `sub_area_suffixes` below
#    records the gap.
# 2. NOT EVERY MUNICIPALITY IS LISTED. Several cities that exist are absent as
#    lines of their own (Kota Batu, Kota Mojokerto, Kota Pasuruan, Kota
#    Probolinggo, Kota Blitar among them); the annex lists a city only where it
#    chose to. Absence from `areas_printed` is not evidence that a place uses
#    another code.
# 3. THE ANNEX PREDATES THE 2022 PAPUA PROVINCES. It lists only PA and PB.
#    The codes the four new provinces issue are in `post_annex_codes`, each
#    with its own (non-regulation) source and tier.
#
# Historic codes (the colonial residency letters, codes withdrawn with
# province changes before 2021) are NOT carried: every account of them found
# in this pass rests on a ShareAlike encyclopaedia article. Recorded gap.
jurisdiction: id
topic: region-codes
authority:
  name: "Kepolisian Negara Republik Indonesia — Korps Lalu Lintas (Korlantas Polri), Direktorat Registrasi dan Identifikasi"
  url: "https://korlantas.polri.go.id/"
sources:
  - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Perpol 7/2021, Korlantas' own copy, 107 pp: Pasal 6 (grammar), Lampiran A (region codes, PDF pp. 81-95), B (registration codes, p. 95), C (number blocks and letter series, pp. 96-98), D (CD/CC, pp. 98-103), E-J (special allocations, pp. 103-106), K (trial series, p. 106), L (cross-border operating codes, p. 107, image). Accessed 2026-11-25. Evidence: primary (statute)"
  - "https://bapenda.jabarprov.go.id/JDIH/Peraturan_Polri/PERATURAN_POLRI_NOMOR_7_TAHUN_2021.pdf  # second complete copy of the same regulation (West Java revenue agency JDIH), used for the text layer. Accessed 2026-11-25"
  - "https://oto.detik.com/berita/d-7501604/kode-pelat-nomor-di-3-provinsi-papua-diubah  # detikOto, 21 Aug 2024, citing the Korlantas website: PB -> PY for Papua Barat Daya (May 2024), PA -> PS for Papua Selatan (from July 2024), PT for Papua Tengah (plate 'PT 1' handed to the acting governor). Evidence: secondary press citing the agency. Accessed 2026-11-25"
period: { start: 2021 }
period_evidence: instrument-in-force
period_note: >-
  2021 is the regulation now in force, not the date any code was first
  allotted. Most codes are far older (Perkap 4/2006 Lampiran A printed the same
  kind of table; its scan's text layer is unreadable and it was not image-read
  in this pass). Treat every row as "in force when read" and do not infer an
  allotment year from it.

# ---------------------------------------------------------------------------
# 1. REGISTRATION CODES (kode registrasi) — Lampiran B, PDF p. 95.
#    These take the place of the region code for four kinds of user, per
#    Pasal 6(4): "Kode registrasi ... diterbitkan berdasarkan kepentingan
#    pengguna Ranmor". Each has its own series in plates/id.yml.
# ---------------------------------------------------------------------------
registration_codes:
  - code: CD
    meaning: "NRKB Ranmor Korps Diplomatik — diplomatic corps"
    series: id-diplomatic-cd-2006
  - code: CC
    meaning: "NRKB Ranmor Korps Konsulat — consular corps"
    series: id-consular-cc-2006
  - code: CH
    meaning: "NRKB STNK/TNKB Khusus Ranmor Konsul Kehormatan — honorary consuls (issued as a 'special' registration)"
    series: id-honorary-consul-ch-2021
  - code: RI
    meaning: "NRKB STNK/TNKB Khusus Ranmor Dinas Presiden, Wakil Presiden, Ketua Lembaga Tinggi Negara dan Pejabat Setingkat Menteri — President, Vice-President, heads of the high state bodies and officials of ministerial rank"
    series: id-state-ri-2006

# ---------------------------------------------------------------------------
# 2. NUMBER BLOCKS BY VEHICLE TYPE — Lampiran C.1 and C.2, PDF p. 96.
#    Pasal 6(5): the number has 1 to 4 digits "yang ditentukan berdasarkan
#    jenis Ranmor". The blocks below are the ALLOCATION ORDER the annex
#    prescribes. They tell a reader what a number most likely is; they are not
#    printed as a validity rule, and vanity numbers (Pasal 7) can be chosen.
# ---------------------------------------------------------------------------
number_blocks:
  national:
    - { from: 1,    to: 1999, vehicle: "Mobil Penumpang — passenger car" }
    - { from: 2000, to: 6999, vehicle: "Sepeda Motor — motorcycle" }
    - { from: 7000, to: 7999, vehicle: "Mobil Bus — bus" }
    - { from: 8000, to: 8999, vehicle: "Mobil Barang — goods vehicle" }
    - { from: 9000, to: 9999, vehicle: "Kendaraan Khusus — special-purpose vehicle" }
  polda_metro_jaya:
    note: >-
      Lampiran C.2, "Khusus untuk wilayah hukum Polda Metro Jaya" — the Jakarta
      police area, which issues B. The fourth row is PRINTED as "Mobil
      Penumpang" for 8000-8999, a second passenger-car block; read in context
      (the national table, and the fifth row "Mobil barang dan Kendaraan
      Khusus") it is very probably a slip for goods vehicles. Kept as printed;
      see §VERIFIER in plates/id.yml.
    blocks:
      - { from: 1,    to: 2999, vehicle: "Mobil Penumpang — passenger car" }
      - { from: 3000, to: 6999, vehicle: "Sepeda Motor — motorcycle" }
      - { from: 7000, to: 7999, vehicle: "Mobil Bus — bus" }
      - { from: 8000, to: 8999, vehicle: "Mobil Penumpang (as printed)" }
      - { from: 9000, to: 9999, vehicle: "Mobil barang dan Kendaraan Khusus — goods and special-purpose vehicles" }
  earlier_instrument: >-
    Perkap 4/2006 Pasal 6(3)-(4) already allocated the number "sesuai kelompok
    jenis kendaraan bermotor" through its Lampiran B (and Lampiran C for Polda
    Metro Jaya). The scan's table is not legible enough to transcribe; its four
    readable rows match the national split above with 8000-9999 as one block.
    Not tabulated.

# ---------------------------------------------------------------------------
# 3. THE LETTER SERIES — Lampiran C.3, PDF pp. 96-98.
# ---------------------------------------------------------------------------
letter_series:
  rule: >-
    When the numbers of a block are used up, numbering restarts at the start of
    the block with a series letter, in order A to Z ("sesuai urutan huruf A
    sampai dengan Z"). After Z, two letters may be used ("apabila seri huruf
    telah sampai pada huruf Z, maka penomoran dapat menggunakan 2 (dua) seri
    huruf"): AA, AB, ... After ZZ, three letters ("apabila seri huruf telah
    sampai pada huruf ZZ, maka penomoran dapat menggunakan 3 (tiga) seri
    huruf"): AAA, AAB, ... Pasal 6(7) adds that series of more than two
    letters, and where they are used, are fixed by Kapolda decision with
    Korlantas approval.
  per_series_capacity:
    passenger_car: "1-1999 per letter series (1-2999 in Polda Metro Jaya)"
    motorcycle: "2000-6999 per letter series, i.e. 5000 registrations"
    bus: "7000-7999, 1000 per series"
    goods_vehicle: "8000-8999, 1000 per series"
    special_vehicle: "9000-9999, 1000 per series"
  worked_examples_printed:
    - "Kode Wil.-1 s.d. 1999, then Kode Wil.-1 A s.d. 1999 A, then 1 B ... (passenger cars)"
    - "Kode Wil.-2000 s.d. 6999, then 2000 A s.d. 6999 A (motorcycles)"
    - "1 Z s.d. 1999 Z, then 1 AA, then 1 AB (two letters)"
    - "1 ZZ s.d. 1999 ZZ, then 1 AAA, then 1 AAB (three letters)"
  printed_slips: >-
    The 'Kode Wil.-' hyphen in the worked examples joins a placeholder to the
    number; it is not evidence of a printed separator. The two-letter and
    three-letter examples reuse the same registration-count ranges
    (51.974-53.973 ...), which cannot both be right; the arithmetic of the
    examples is illustrative only.
  alphabet: >-
    No letter is excluded anywhere in the regulation ("A sampai dengan Z").
    The trial-plate combinations in section 5 are reserved by Lampiran K, which
    implies an ordinary series does not use them; no other reservation is
    printed.

# ---------------------------------------------------------------------------
# 4. NUMBERS RESERVED FOR OFFICE-HOLDERS — Lampiran H, I and J (PDF pp.
#    105-106), with the 2006 predecessor. These ride on government (red)
#    registrations; see id-government-red-1993.
# ---------------------------------------------------------------------------
office_numbers:
  province:
    source: "Perpol 7/2021 Lampiran H"
    rows:
      - { number: 1, letters: none, holder: "Gubernur — governor" }
      - { number: 2, letters: none, holder: "Wakil Gubernur — vice-governor" }
      - { number: 3, letters: none, holder: "Ketua DPRD Provinsi — speaker of the provincial assembly" }
      - { number: "4-99", letters: none, holder: "other provincial officials in order of precedence" }
  dki_jakarta:
    source: "Perpol 7/2021 Lampiran I"
    rows:
      - { number: 1, letters: DKI, holder: "Gubernur" }
      - { number: 2, letters: DKI, holder: "Wakil Gubernur" }
      - { number: 3, letters: DKI, holder: "Ketua DPRD Provinsi" }
      - { number: "4-150", letters: DKI, holder: "other officials of DKI Jakarta in order of precedence" }
  regency_city:
    source: "Perpol 7/2021 Lampiran J"
    rows:
      - { number: 1, letters: "the regency's or city's allocated series", holder: "Bupati / Walikota" }
      - { number: 2, letters: "the regency's or city's allocated series", holder: "Wakil Bupati / Wakil Walikota" }
      - { number: 3, letters: "the regency's or city's allocated series", holder: "Ketua DPRD Kabupaten/Kota" }
      - { number: "4-30", letters: "the regency's or city's first allocated series", holder: "other officials in order of precedence" }
    note: >-
      Lampiran J is the one place the regulation itself says a regency or city
      HAS its own allocated letter series ("seri huruf alokasi
      kabupaten/kota") — confirming that sub-area letters exist, without
      saying what they are.
  state:
    source: "Perpol 7/2021 Lampiran F.2-F.3; Perkap 4/2006 Pasal 10(1)"
    rows:
      - { number: 1, code: RI, holder: "Presiden — President (Lampiran F.2 prints 'RI 1'; Perkap 4/2006 Pasal 10(1)a)" }
      - { number: 2, code: RI, holder: "Wakil Presiden — Vice-President (Perkap 4/2006 Pasal 10(1)b)" }
    note: >-
      Further RI numbers go to the heads of the high state bodies and officials
      of ministerial rank and are "dikoordinasikan dengan Kementerian
      Sekretariat Negara" (Lampiran F.3); no allocation list is published.
  earlier_2006:
    source: "Perkap 4/2006 Pasal 10(2)-(3)"
    note: >-
      The 2006 order differed: in a province 1 governor, 2 speaker of the
      provincial assembly, 3 head of the high prosecutor's office, 4 chief
      judge of the high court, 5 onward other officials, all without series
      letters; in a regency or city the same order with the regency's series
      letters. The vice-governor had no reserved number in 2006.

# ---------------------------------------------------------------------------
# 5. SERIES LETTERS THAT MARK A CLASS, NOT A PLACE
# ---------------------------------------------------------------------------
class_letters:
  trial_tckb:
    source: "Perpol 7/2021 Lampiran K.1 and K.3; Perkap 4/2006 Pasal 14(2)"
    two_letter: [XX, XY, YY, YX]
    three_letter: [XXX, XYY, YYX, YXY, YYY, YXX]
    note: >-
      The three-letter set is printed exactly as above — six of the eight X/Y
      combinations; XXY and XYX are not in it. It is for a Polda "yang telah
      diizinkan menggunakan 3 (tiga) huruf seri" once the two-letter series
      are used up. See id-trial-tckb-2006.
  customs_deferred_2006:
    source: "Perkap 4/2006 Pasal 13(3)"
    letters: "AX to ZX — the letters after the number 'menggunakan kode AX sampai dengan ZX'"
    period: { start: 2006, end: 2021 }
    note: >-
      Vehicles imported with customs duty deferred (Formulir B). Perpol 7/2021
      (Lampiran E.1) no longer fixes these letters and leaves the series to the
      Kapolda. See id-customs-deferred-2006.
  cross_border_operating_codes:
    source: "Perpol 7/2021 Lampiran L, PDF p. 107 (printed as an image; read from the page image)"
    codes:
      AK: "Angkutan antar negara — international transport"
      MK: "Misi kemanusiaan — humanitarian mission"
      PN: "Pertemuan antar negara — intergovernmental meeting"
      MS: "Pariwisata, olahraga, misi sosial — tourism, sport, social mission"
      PAM: "Pengamanan pejabat negara asing — security for a visiting foreign official"
    note: "Printed on the silver TNKB LBN of a foreign vehicle temporarily operated in Indonesia. See id-crossborder-lbn-2021."

# ---------------------------------------------------------------------------
# 6. SUB-AREA SUFFIX LETTERS — NOT SHIPPED
# ---------------------------------------------------------------------------
sub_area_suffixes:
  shipped: false
  reason: >-
    The allocation of letter series to regencies is a Kapolda decision under
    Pasal 6(7) (and Lampiran J confirms each regency has one) but no such
    decision was found published by the police. The tables in circulation
    are ShareAlike-licensed encyclopaedia content and cannot enter this
    CC-BY dataset. A Polda's table will be added here, per Polda, when it can
    be cited to the police or to press that attributes it to them.

