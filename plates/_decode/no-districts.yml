# plates/_decode/no-districts.yml — the Norwegian two-letter prefix allocation.
#
# THE SOURCE IS PRIMARY AND THAT IS THE POINT. Secondary compilations of this
# table circulate widely; this file is transcribed mechanically from Statens
# vegvesen's own published table, "Bokstavkombinasjoner fra trafikkstasjon",
# on the authority's Skiltserier page. No enthusiast list and no encyclopedia
# was used for any row. 396 combinations, 402 assignments, read 2026-08-02.
#
# READ THE THREE CAVEATS BEFORE DECODING ANYTHING WITH THIS FILE.
#
# 1. THE AUTHORITY ITSELF SAYS "OFTEN", NOT "ALWAYS". Verbatim, from the page
#    that carries the table: "Bokstavkombinasjonen baserer seg ofte på hvilken
#    trafikkstasjon som har utstedt registreringsnummeret." An owner may
#    request a combination from another station — the practice is common
#    enough that Norwegian newspapers write about "Bærumskilt" being the
#    country's most sought-after series — so a hit here is a claim about where
#    the number was ISSUED, and only probably that. It is never a claim about
#    where the vehicle or its owner is.
#
# 2. THE MAPPING IS NOT A FUNCTION. Six combinations appear against TWO
#    stations in the authority's own table: CU (Jessheim and Lillestrøm),
#    EX (Finnsnes and Hammerfest), FZ (Elverum and Hamar), LD (Horten and
#    Tønsberg), NA (Larvik and Sandefjord), VS (Støren and Trondheim). They
#    are recorded as published, both rows kept. Every value is therefore a
#    LIST, uniformly, so a consumer never has to branch on the shape.
#
# 3. IT IS A SNAPSHOT, AND THE GEOGRAPHY HAS BEEN DECAYING FOR YEARS.
#    Individual rows carry no dates because the authority publishes none —
#    the table shows the allocation as it stands, not as it stood. Allocation
#    has demonstrably drifted: the county structure behind the "Fylke" column
#    is itself post-2020 (Innlandet, Vestland, Agder and Troms/Finnmark are
#    the merged counties, and Norway split several of them again in 2024
#    without the table following), and geographic distribution stopped
#    entirely for FOUR-DIGIT plates on 9 February 2017 (secondary-wikipedia).
#    Rows are never deleted on principle — a combination withdrawn from the
#    list stays decodable for plates already issued — but this file cannot
#    tell you WHEN a row became true.
#
# WHAT THIS MEANS FOR A PARSE API: treat a hit as a low-confidence issuing-
# station hint on a five-digit plate, and as no signal at all on a four-digit
# plate issued after 2017-02-09. Do not surface it as "registered in X".
jurisdiction: no
topic: districts
authority:
  name: Statens vegvesen
  url: "https://www.vegvesen.no/kjoretoy/eie-og-vedlikeholde/skilt/skiltserier/"
period: { start: 1971 }
period_evidence: statutory-date
period_note: >-
  1971 dates the two-letter REGISTRATION ORDER, not any row: forskrift om bruk
  av kjøretøy (FOR-1990-01-25-92) § 2-17 names the order "fra og med 1. april
  1971". The ALLOCATION below is a 2026-08-02 reading of the authority's live
  table; no row is individually dated, and none should be treated as having
  been true on any particular past date. See caveat 3 in the header.
sources:
  - "https://www.vegvesen.no/kjoretoy/eie-og-vedlikeholde/skilt/skiltserier/  # Statens vegvesen, 'Skiltserier': the 'Bokstavkombinasjoner fra trafikkstasjon' table (every row below), the 'Felles bokstavkombinasjoner' table (see `common` below), the 'ofte' caveat and the number ranges. Accessed 2026-08-02"
  - "https://lovdata.no/dokument/SF/forskrift/1990-01-25-92/KAPITTEL_2  # FOR-1990-01-25-92 § 2-17: the two-letter order dates from 1 April 1971. Accessed 2026-08-02"
  - "https://no.wikipedia.org/wiki/Kjennemerke_for_motorkj%C3%B8ret%C3%B8y_i_Norge  # secondary-wikipedia (rev. 2026-07-16): geographic distribution ceased for four-digit plates on 9 February 2017; the I/M/O/Q letter exclusions and the limited use of G and W; the SS/NS avoidance. Accessed 2026-08-02"

# ---------------------------------------------------------------------------
# NATIONWIDE COMBINATIONS — allocated by what the vehicle IS, not by where the
# number was issued. Verbatim headings from the authority's "Felles
# bokstavkombinasjoner" table. These override the geographic table: an EL
# number carries no district meaning at all.
# ---------------------------------------------------------------------------
common:
  electric:
    label: "Elektriskdrevet kjøretøy"
    combinations: [EL, EK, EV, EB, EC, ED, EE, EF, EH, EJ, EN, EP, ER, EA, EU]
  gas:
    label: "Gassdrevet kjøretøy"
    combinations: [GA]
  hydrogen:
    label: "Hydrogendrevet kjøretøy"
    combinations: [HY]
  diplomatic:
    label: "Ambassadekjøretøy (Corps Diplomatique)"
    combinations: [CD]

# ---------------------------------------------------------------------------
# THE LETTER ALPHABET, as a fact about the table rather than a rule.
# Across all 396 combinations: the FIRST letter is drawn from
# A B C D E F H J K L N P R S T U V X Y Z (20 letters — G and W never lead),
# the SECOND adds W. I, M, O and Q appear in neither position, and Æ, Ø and Å
# cannot be written in this dataset's serial alphabet at all.
# no.wikipedia (secondary-wikipedia) gives the reason — "Bokstavene I, M, O,
# Q, Æ, Ø og Å brukes ikke på grunn av likheten med andre bokstaver eller
# sifre" — and adds that G is reserved (GA, gas) and W limited to four-digit
# plates and prøveskilt. The observation above is derived from the authority's
# own table; the reason is Wikipedia's.
# ---------------------------------------------------------------------------
alphabet:
  first_letter: [A, B, C, D, E, F, H, J, K, L, N, P, R, S, T, U, V, X, Y, Z]
  second_letter: [A, B, C, D, E, F, H, J, K, L, N, P, R, S, T, U, V, W, X, Y, Z]
  never_used: [I, M, O, Q]
  basis: derived-from-authority-table

