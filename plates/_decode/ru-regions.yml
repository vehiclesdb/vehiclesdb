# plates/_decode/ru-regions.yml — the Russian region codes ("код региона регистрации").
#
# THE SOURCE, AND IT IS PRIMARY: Приложение № 1 to Приказ МВД России от 05.10.2017
# № 766 «О государственных регистрационных знаках транспортных средств» —
# «Перечень цифровых кодов регионов Российской Федерации, применяемых на
# государственных регистрационных знаках транспортных средств и другой
# специальной продукции, необходимой для допуска транспортных средств и их
# водителей к участию в дорожном движении». Every row and every code change below
# was read from the SIGNED SCANS on the official publication portal
# (publication.pravo.gov.ru): the 2017 order and the three orders that changed
# this appendix (№ 130 of 2020, № 553 and № 810 of 2022). The scans have no text
# layer; they were OCR'd locally and every cell that changed was checked against
# the page image. Row numbers are the instrument's own; row 86 was repealed in
# 2020, which is why the numbering jumps from 85 to 87.
#
# WHO ASSIGNS: ГОСТ Р 50577-2018 п. 3.10 — "Закрепление цифровых кодов за
# регионами регистрации в отношении регистрационных знаков типов 1 - 4В, 9 - 11,
# 15 - 28 ... производится Министерством внутренних дел Российской Федерации."
# Military plates (types 5-8, 17) carry Ministry of Defence codes instead
# (п. 3.10, third paragraph; п. 3.5 note 2). THIS TABLE DOES NOT DECODE THEM.
#
# ---------------------------------------------------------------------------
# WHAT A CODE DECODES TO — read before decoding anything.
# ---------------------------------------------------------------------------
decodes_to: >-
  Since 1 January 2020: the region of the OWNER'S place of registration at the
  moment the number was assigned. Правила государственной регистрации (постановление
  Правительства РФ от 21.12.2019 № 1764) п. 39, verbatim: "Присвоение
  государственного регистрационного номера транспортного средства осуществляется
  в соответствии с цифровым кодом региона места регистрации владельца
  транспортного средства." (Assignment follows the code of the region where the
  owner is registered.) An owner may register in any office (283-ФЗ ст. 8 ч. 1
  п. 2), so the code says nothing about where the plate was made or handed over.
does_not_decode_to: >-
  Where the vehicle is now, or where its current owner lives. 283-ФЗ ст. 8 ч. 1
  п. 3 lets an owner keep a number or pass it on with the vehicle, and Правила
  п. 45 keeps a released number for one year. For numbers assigned before
  1 January 2020 this file does not state what the code meant (the issuing
  unit's region, by every secondary account; no primary read in this pass).
three_digit_codes:
  rule: >-
    A three-digit code is any digit 1-9 followed by one of the region's two-digit
    codes, and it is permitted on TYPE 1 plates only. The note to Приложение № 1,
    as amended by приказ МВД № 130 of 11.03.2020, verbatim: "На государственных
    регистрационных знаках транспортных средств, отнесенных к типу 1,
    допускается применять в трехзначном коде региона в качестве первой цифры
    кода цифры «1» - «9»." The note says which first digits are allowed and
    nothing more; reading the last two digits as the region's own code is how
    the note is applied and is how every reported three-digit code is formed
    (all codes in `three_digit_reported` below end in their row's two-digit code),
    but the sentence does not say it in so many words.
  history:
    - { from: "2017-12-21", to: "2020-03-26", first_digit: "1 or 7", instrument: "№ 766 original note: «цифру «1» или «7»»" }
    - { from: "2020-03-26", to: null, first_digit: "1-9", instrument: "№ 130 of 11.03.2020 (in force 26.03.2020 per Garant)" }
  before_2017: >-
    Three-digit codes existed before order № 766 (the predecessor order № 282
    of 28.03.2002 listed them per region, e.g. Moscow 177/197/199 per
    Wikipedia). Order № 282's appendices were NOT read in this pass, so no
    pre-2017 three-digit code is asserted here except as `three_digit_reported`.
  decode: "Strip the first digit of a three-digit code and decode the remaining two."
  first_digit_means: "Nothing the instrument assigns. It is a capacity extension, not a sub-region."
two_digit_never_listed:
  codes: ["20", "91"]
  note: >-
    Neither appears in Приложение № 1 at any revision since 2017. Chechnya's row
    carries 95. Wikipedia (secondary) says 20 was Chechnya's original code,
    annulled, and that 91 is used only on Kaliningrad's metal transit plates;
    neither statement was checked against a primary.
  evidence: secondary-wikipedia

# ---------------------------------------------------------------------------
# THE TERRITORIES: the same wording for every row it applies to.
# ---------------------------------------------------------------------------
# Six rows of the instrument name territories of Ukraine: «Республика Крым» (82)
# and «г. Севастополь» (92), both in the 2017 original, and «Донецкая Народная
# Республика» (80), «Луганская Народная Республика» (81), «Херсонская область»
# (84) and «Запорожская область» (85), added by приказ МВД № 810 of 31.10.2022.
# They are recorded EXACTLY as the Russian instrument prints them, with the
# instrument and its date, because that is what a plate carrying the code was
# issued under. `iso_3166_2` on those rows is the Ukrainian subdivision code,
# matching plates/_decode/ua-regions.yml, where the same territories are recorded
# under the Ukrainian instrument.
territory_note: >-
  Code assigned by a Russian Ministry of Internal Affairs order. The territory is
  internationally recognised as part of Ukraine, and Ukraine continues to list it
  in its own plate-code table (plates/_decode/ua-regions.yml). This row records
  the Russian instrument and does not describe the territory's status.

# ---------------------------------------------------------------------------
# CODES THAT MOVED — the trap for anyone decoding an older plate.
# ---------------------------------------------------------------------------
reassigned_codes:
  note: >-
    Codes 80, 81, 84, 85 and 88 were, in the 2017 original, additional codes of
    Zabaykalsky Krai (80), Perm Krai (81), Krasnoyarsk Krai (84, 88) and Irkutsk
    Oblast (85). Order № 130 (2020) removed them from those regions; order № 553
    (2022) gave all five, with 94, to "territories outside the Russian Federation
    served by Russian internal-affairs bodies"; order № 810 (2022, in force
    16.11.2022) moved 80, 81, 84 and 85 to the rows named above and left 88 and
    94 on the "territories outside" row. A plate with one of these codes
    therefore decodes differently depending on when it was issued; see
    `code_history` on each row. Wikipedia (secondary) gives the original holders
    as the former autonomous okrugs merged into those regions (Agin Buryat 80,
    Komi-Permyak 81, Taymyr 84, Ust-Orda Buryat 85, Evenk 88) and code 94 as
    Baikonur; not checked against a primary.
  evidence: instrument-in-force

