cross_check: "https://pddmaster.ru/documents/prikaz-766/d103-pr1  # consolidated Приложение № 1, «Редакция от 9 декабря 2025 года»: same codes as this file. Its row numbers carry two typos (two rows numbered 21; 86 missing because repealed). The free view of base.garant.ru/71850536/53f89421bbdaf741eb2d1ecc4ddb4c33/ still shows the PRE-2020 codes (Perm 59, 81; Krasnoyarsk 24, 84, 88) and must not be used. Accessed 2026-11-26"
period: { start: 2017 }
period_evidence: instrument-in-force
period_note: >-
  2017 is the instrument now carrying the table (in force 21.12.2017), not the
  date the codes began. Most two-digit codes date from the 1993 standard's
  introduction on 1 January 1994 (за рулём 9/1993 reported 89 regions); the
  predecessor list (приказ МВД № 282 of 28.03.2002 and before) was not read.
# `subject` is the instrument's own wording, verbatim. `subject_en` and
# `iso_3166_2` are EDITORIAL additions by this dataset; ISO codes were not checked
# against the ISO register in this pass. `codes` = the codes the row carries today.
# `code_history` appears only where a row's codes changed since 2017.
# `three_digit_reported` = three-digit codes Wikipedia reports as issued, with the
# month it gives (secondary-wikipedia); the instrument itself lists none.
# `soviet_1980_letters` = the letter index the region used on 1980-1994 Soviet
# plates per Wikipedia; parenthesised = it used its parent region's letters.

