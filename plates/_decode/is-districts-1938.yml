# plates/_decode/is-districts-1938.yml — the Icelandic DISTRICT-letter index
# used until the 1 January 1989 cutover.
#
# THE PRIMARY IS MISSING AND THAT IS RECORDED, NOT PAPERED OVER. Every row
# below is `secondary-wikipedia`. The search for a primary was substantial and
# it failed; the reader is entitled to know exactly how:
#
#   * reglugerd.is holds NO pre-1988 Icelandic vehicle-registration regulation.
#     Searches on "skráningu ökutækja", "skráningu bifreiða", "skráningarmerki"
#     and "einkennisstafir", plus year filters for 1968, 1987 and 1988, return
#     nothing earlier than reglugerð 523/1988 — and 523/1988's own page carries
#     no text at all ("Texti ekki kominn") and no date fields.
#   * reglugerð 78/1997, which repealed 523/1988, contains no letter index in
#     either its body or its viðauki.
#   * Samgöngustofa's verklagsreglur pages (which en.wikipedia cites for the
#     modern rules) now 302 to a generic island.is landing page — the deep
#     registration-rules pages did not survive the site migration.
#   * THE BEST UNCLOSED LEAD, named here so the next pass starts ahead: Hagtíðindi
#     1989 (vol. 74 no. 10, p. 360) states that the 1988 regulations replaced an
#     older instrument it cites as "nr. 40 19. ..." — the day and month are cut
#     off at the snippet boundary. That regulation is the most likely home of
#     the letter index. Reaching it needs Stjórnartíðindi B-deild page images:
#     timarit.is serves search results but returns HTTP 403 on /page/, the
#     island.is gazette search is a JavaScript SPA with no server-rendered
#     results, and web.archive.org was unreachable from this pass.
#
# WHAT THE LETTERS ACTUALLY MEAN, and why this table is not a "county" table in
# the Norwegian sense: the letter recorded the district in which the OWNER had
# his legal domicile, not the vehicle's home. A vehicle sold across district
# lines was RE-PLATED with a new number, and an owner could keep his number and
# move it to a new vehicle. That is precisely the property the 1989 reform
# abolished when it made the fastanúmer permanent to the vehicle — so this
# table decodes an owner's district at the time of issue, and nothing else.
#
# SCOPE OF THE DATE. 1938 is when each district was reduced to a SINGLE letter
# and the enamel plates appeared; Icelandic vehicles carried district
# ABBREVIATIONS before that (from 1914, beginning with Bifreiðafélag
# Reykjavíkur's "Br1"), which this table does not cover. The 1950 change from
# enamel to struck plates changed the material, not the index.
jurisdiction: is
topic: districts
authority:
  name: Sýslumenn (issuing); Samgöngustofa (successor registry)
  url: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003"
period: { start: 1938, end: 1989 }
period_evidence: statutory-date-end-secondary-start
period_note: >-
  THE TWO ENDS ARE EVIDENCED VERY DIFFERENTLY, and the difference matters.
  END — 1 JANUARY 1989 is PRIMARY and is stated in two instruments that are
  reachable, even though the instrument that made the change (reglugerð
  523/1988, set 15 December 1988) has no retrievable text: reglugerð 78/1997
  34. gr. provides that "Ökutæki sem skráð voru fyrir 1. janúar 1989 mega áfram
  bera skráningarmerki af eldri gerð", and reglugerð 751/2003 VII. kafli splits
  its transitional articles at exactly that date (28. gr. for vehicles
  registered 1989-2003, 29. gr. for those registered before 1 January 1989).
  START — 1938 is secondary-wikipedia only, and is the year each district was
  cut to one letter; no instrument was retrieved.
sources:
  - "https://is.wikipedia.org/wiki/N%C3%BAmeraplata  # secondary-wikipedia: EVERY letter row below; the 1938 single-letter reform and enamel plates (black ground, white characters); the 1950 change to struck plates; the 1 January 1989 cutover to white plates with blue characters; and the owner-domicile rule that re-plated a vehicle sold between districts. The article cites RÚV (2021-03-08) and fornbill.is. Accessed 2026-08-02"
  - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): corroborates the same index, adds the gloss that plates followed the OWNER and had to be replaced on moving district, and that from 1 January 1989 further use of the old plates was forbidden except on vehicles already carrying them. Accessed 2026-08-02"
  - "https://www.reglugerd.is/reglugerdir/allar/nr/78-1997  # PRIMARY: reglugerð 78/1997 34. gr. 'Notkun eldri skráningarmerkja' — the pre-1989 boundary, and the sunset dates 31 December 1997 (bifhjól, eftirvagnar) and 31 December 1998 (others). Accessed 2026-08-02"
  - "https://www.reglugerd.is/reglugerdir/allar/nr/523-1988  # PRIMARY but EMPTY: the 1989 cutover instrument, 'Reglugerð um skráningu ökutækja', set 15 December 1988, amended by 493/1989 and 312/1996, repealed by 78/1997 — body text absent ('Texti ekki kominn') and no date fields published. Cited to evidence the gap, not the content. Accessed 2026-08-02"

# ---------------------------------------------------------------------------
# THE INDEX, keyed by letter — the decode direction. `district` is the
# Icelandic name as the source gives it; `kind` separates the genuinely
# geographic rows from the four that are not places at all.
# ---------------------------------------------------------------------------
letters:
  A:  { district: "Akureyrarkaupstaður og Eyjafjarðarsýsla", kind: district }
  B:  { district: "Barðastrandarsýsla", kind: district }
  D:  { district: "Dalasýsla", kind: district }
  E:  { district: "Akraneskaupstaður", kind: district }
  F:  { district: "Siglufjarðarkaupstaður", kind: district }
  G:  { district: "Hafnarfjarðarkaupstaður og Gullbringu- og Kjósarsýsla", kind: district }
  H:  { district: "Húnavatnssýsla", kind: district }
  "Í": { district: "Ísafjarðarkaupstaður og Ísafjarðarsýsla", kind: district }
  J:  { district: "Íslenskir starfsmenn á Keflavíkurflugvelli", kind: employer, note: "Icelandic staff at Keflavík airport — an employer category, not a place." }
  JO: { district: "Erlendir starfsmenn á Keflavíkurflugvelli", kind: employer, note: "Foreign staff at Keflavík airport. One of the two two-letter codes in the index." }
  K:  { district: "Sauðárkrókskaupstaður og Skagafjarðarsýsla", kind: district }
  L:  { district: "Rangárvallasýsla", kind: district }
  M:  { district: "Mýra- og Borgarfjarðarsýsla", kind: district }
  N:  { district: "Neskaupstaður", kind: district }
  "Ó": { district: "Ólafsfjarðarkaupstaður", kind: district }
  P:  { district: "Snæfells- og Hnappadalssýsla", kind: district }
  R:  { district: "Reykjavík", kind: district, note: "By far the largest series — the default assumption for an unidentified old Icelandic plate." }
  S:  { district: "Seyðisfjarðarkaupstaður og Norður-Múlasýsla", kind: district }
  T:  { district: "Strandasýsla", kind: district }
  U:  { district: "Suður-Múlasýsla", kind: district }
  V:  { district: "Vestmannaeyjakaupstaður", kind: district }
  VL: { district: "Varnarliðið", kind: military, note: "The US Defence Force in Iceland. Defunct — the force left in 2006." }
  VLE: { district: "Ökutæki hermanna", kind: military, note: "Vehicles of individual US servicemen. Defunct." }
  X:  { district: "Árnessýsla", kind: district }
  Y:  { district: "Kópavogur", kind: district }
  Z:  { district: "Austur- og Vestur-Skaftafellssýsla", kind: district, note: "en.wikipedia gives the shorter 'Skaftafellssýsla'; is.wikipedia gives both halves. Recorded in the fuller form, with the disagreement noted rather than resolved." }
  "Þ": { district: "Þingeyjarsýsla", kind: district }
  "Ö": { district: "Keflavíkurkaupstaður", kind: district }
  "Ø": { district: "Keflavíkurkaupstaður", kind: district, note: "A VARIANT SPELLING OF Ö, not a separate district — and the only code in the whole index using a letter outside the Icelandic alphabet. Recorded because plates were struck both ways." }

letters_never_used: [C, "Á", "Ð", "É", W, "Ý", "Æ"]
letters_never_used_note: >-
  An observation about the index as published, NOT a sourced rule: no
  instrument stating an Icelandic letter-exclusion policy was retrieved, and
  reglugerð 751/2003 (the modern regulation, which IS readable) contains no
  excluded-letter provision either. Note that four of the codes in use — Í, Ó,
  Þ and Ö — are outside this dataset's serial alphabet (A-Z, 0-9), so a
  consumer matching old Icelandic plates cannot express them in a dataset
  regex. That is a real limitation of the pre-1989 series and is why
  `is-district-1938` in plates/is.yml is `recall-only`.

unicode_caveat: >-
  Í, Ó, Þ, Ö and Ø are keys in this table but are NOT members of
  _meta/separators.yml's serial alphabet. This decode file may carry them
  because it is a lookup table, not a pattern; no regex in plates/is.yml
  attempts to match them. A consumer decoding a photographed pre-1989 plate
  must handle those five glyphs outside the regex tier.
