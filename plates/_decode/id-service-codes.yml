# ---------------------------------------------------------------------------
# 3. PARLIAMENT (DPR) PLATES — from May 2021, id.wikipedia only
# ---------------------------------------------------------------------------
dpr_plates:
  evidence: secondary-wikipedia
  since: "2021-05"
  note: >-
    id.wikipedia: in May 2021 the House of Representatives (DPR) launched
    special plates with the DPR badge, criticised at the time and reportedly
    not coordinated with the police. The number is two groups joined by a
    hyphen: the member's or office's number, then the parliamentary group
    (fraksi) number or a committee/body in Roman numerals. NOT a series in
    plates/id.yml: no police source treats these as registrations, and the
    article does not say whether they replace or accompany the TNKB.
  scheme:
    - { number: "1-00", holder: "Speaker (Ketua)" }
    - { number: "2-00 to 5-00", holder: "Deputy Speakers" }
    - { number: "6-xx", holder: "group chair (Ketua Fraksi)" }
    - { number: "7-xx", holder: "group secretary" }
    - { number: "8-xx", holder: "group treasurer" }
    - { number: "xx-01 to xx-09", holder: "parliamentary groups: 01 PDIP, 02 Golkar, 03 Gerindra, 04 NasDem, 05 PKB, 06 Demokrat, 07 PKS, 08 PAN, 09 PPP" }
    - { number: "6-I to 6-XI", holder: "chairs of Commissions I-XI" }
    - { number: "7-I to 10-XI", holder: "deputy chairs of Commissions I-XI" }
    - { number: "xx-XII to xx-XVII", holder: "XII ethics council, XIII legislation, XIV inter-parliamentary cooperation, XV household affairs, XVI budget, XVII state financial accountability" }
    - { number: "6-XVIII to 11-XVIII", holder: "Secretariat General: 6 Secretary General, 7 head of the expertise body, 8 deputy for sessions, 9 deputy for administration, 10 inspector general, 11 head of general affairs" }
    - { number: "(member number)-(group number)", holder: "members" }

# ---------------------------------------------------------------------------
# 4. ARMED FORCES, DEFENCE MINISTRY AND POLICE SERVICE PLATES
#    Registered by the services themselves, outside Perpol 7/2021 (Pasal
#    70(2) only names the category). NOT series in plates/id.yml.
# ---------------------------------------------------------------------------
military_police:
  evidence: secondary-wikipedia
  format:
    military: >-
      en.wikipedia: armed forces and defence-ministry vehicles use
      'NNNNN-SS' — a registration number, a hyphen, and a unit code of two
      digits or Roman numerals. Corroborated in shape by CNN Indonesia (22 Apr
      2024, secondary-press): "Nomor kendaraan TNI terbagi menjadi dua bagian
      yang dipisahkan oleh tanda strip (-)", registration number on the left,
      two-digit unit code on the right. The digit count (five) is
      en.wikipedia's alone.
    police: >-
      Both articles list police unit codes (00 headquarters, then a Roman
      numeral per regional police, Polda); neither states the number part's
      length. Not modelled.
    why_not_a_series: >-
      The registration-number length rests on one article, the police number
      form on none, and the services' own instruments were not found; a
      regex would be a guess (PRD-PLATES §2.7).
  colours:
    evidence: secondary-wikipedia
    source_note: "en.wikipedia only; id.wikipedia shows photographs without stating colours. CNN Indonesia (22 Apr 2024, secondary-press) corroborates the ground colours (Mabes TNI red, army green with a star, navy light blue with an anchor, air force dark blue) and differs on two emblems: the Mabes TNI plate has no emblem (\"merah tanpa lambang\"), and the air force mark is \"segi lima putih berbingkai merah\" (a white pentagon framed in red), not a roundel. Letter colour is not stated by CNN."
    rows:
      - { service: "armed forces headquarters (Mabes TNI)", plate: "yellow on red" }
      - { service: "army", plate: "yellow on green, with a yellow star at the top" }
      - { service: "navy", plate: "yellow on light blue, with a yellow anchor" }
      - { service: "air force", plate: "yellow on dark blue, with a red-and-white roundel" }
      - { service: "ministry of defence", plate: "yellow on red, with the ministry's insignia" }
      - { service: "police", plate: "yellow on black" }
  unit_codes_comparison: >-
    Both articles list unit codes per service; they agree on most rows. Rows
    marked `comparison` are where they do not: a code in one article only,
    or the same code with a different unit. Unit names are given as each
    article gives them (id in Indonesian, en in English).
  services:
    TNI:
      unit: "Tentara Nasional Indonesia (armed forces headquarters and joint bodies)"
      codes:
        - { code: "00", id_wikipedia: "Markas Besar TNI", en_wikipedia: "Armed Forces Headquarters" }
        - { code: "01", id_wikipedia: "Sekolah Staf dan Komando", en_wikipedia: "Staff and Command School" }
        - { code: "02", id_wikipedia: "Akademi TNI", en_wikipedia: "Military Academy" }
        - { code: "03", id_wikipedia: "Komando Pertahanan Udara Nasional", en_wikipedia: "(not listed)", comparison: "in one article only" }
        - { code: "09", id_wikipedia: "Badan Pembinaan Hukum TNI", en_wikipedia: "Legal Development Agency" }
        - { code: "10", id_wikipedia: "Badan Perbekalan TNI", en_wikipedia: "Military Supply Agency" }
        - { code: "14", id_wikipedia: "Pasukan Pengamanan Presiden", en_wikipedia: "(not listed)", comparison: "in one article only" }
        - { code: "15", id_wikipedia: "Komando Pendidikan dan Latihan", en_wikipedia: "(not listed)", comparison: "in one article only" }
        - { code: "14 or V", id_wikipedia: "(not listed)", en_wikipedia: "Presidential Security Force (PASPAMPRES)", comparison: "in one article only" }
    AD:
      unit: "TNI Angkatan Darat (army)"
