# plates/_decode/id-service-codes.yml — Indonesian state, official, military
# and police plate codes that the regulation does NOT print. SECONDARY TIER.
#
# ===========================================================================
# READ THIS FIRST
# ===========================================================================
# Perpol 7/2021 creates these categories (RI and the "special" plates in
# Lampiran B and F; TNI and Polri service vehicles in Pasal 70(2)) but prints
# none of the codes below. Everything here comes from the two Wikipedia
# articles, tagged `secondary-wikipedia` with the revision, under the owner's
# PRD-PLATES §4 override (2026-08-02), or from press quoting the police where
# that is stated. Nothing here claims instrument tier, and wherever the
# regulation or a police statement speaks, it wins.
#
# None of these lists becomes a matchable series unless its grammar is
# clear (plates/id.yml): the RF and ZZ letters, the RI sub-numbers and the
# INDONESIA plates are series there (recall-only); the parliament, military
# and police schemes are NOT, because their serial grammar is only partly
# described.
#
# Sources:
#   id: https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020
#   en: https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720
jurisdiction: id
topic: service-codes
authority:
  name: "Korlantas Polri for RI and special plates; the armed forces (TNI) and the police (Polri) for their own service plates"
  url: "https://korlantas.polri.go.id/"
sources:
  - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # section 'Pelat nomor khusus' (state officials, DPR, armed forces, police). Accessed 2026-11-25. period_evidence: secondary-wikipedia"
  - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # sections 'Special code examples > State officials' and 'Special plate designs > Military and police vehicles'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
evidence: secondary-wikipedia
period: { start: 2024 }
period_evidence: secondary-wikipedia
period_note: "2024 is the as-of date of the articles' lists (id.wikipedia's RI list is headed 'per Oktober 2024'), not when any code began."

# ---------------------------------------------------------------------------
# 1. RF SUFFIX LETTERS (special plates for officials, until 2023)
# ---------------------------------------------------------------------------
rf_letters:
  series: id-special-rf-2012
  rows:
    - { letters: RFS, holder: "civil officials", evidence: secondary-wikipedia }
    - { letters: RFO, holder: "civil officials below echelon II", evidence: secondary-wikipedia }
    - { letters: RFH, holder: "civil officials below echelon II", evidence: secondary-wikipedia }
    - { letters: RFQ, holder: "civil officials below echelon II", evidence: secondary-wikipedia }
    - { letters: RFT, holder: "armed forces (TNI)", evidence: secondary-wikipedia }
    - { letters: RFD, holder: "army (Angkatan Darat)", evidence: secondary-wikipedia }
    - { letters: RFL, holder: "navy (Angkatan Laut)", evidence: secondary-wikipedia }
    - { letters: RFU, holder: "air force (Angkatan Udara)", evidence: secondary-wikipedia }
    - { letters: RFP, holder: "police (Polri)", evidence: official-press, note: "also named by the Dirregident Korlantas (detikOto, 22 Dec 2023: 'RFP kini menjadi ZZP')" }
  comparison: "id.wikipedia and en.wikipedia give the same eight RF combinations and the same meanings."
  not_exclusive: >-
    id.wikipedia also reports RFA-RFZ among the ORDINARY series of Jakarta
    Timur (see plates/_decode/id-region-codes.yml, sub_area_suffixes.
    rf_in_ordinary_series), so RF letters alone do not prove a special plate.
  replacement: >-
    en.wikipedia: Korlantas announced on 27 January 2023 that RF would end in
    October 2023; by July 2023 ZZ had replaced it, first seen in the Riau
    Islands in May 2023. The police-sourced dates and ZZ letters are in
    plates/id.yml (id-special-zz-2023).

# ---------------------------------------------------------------------------
# 2. RI NUMBERS AND THE INDONESIA PLATES
# ---------------------------------------------------------------------------
state_plates:
  statute_part: >-
    Perpol 7/2021 Lampiran F.2-F.3 (statute): RI and a number without
    letters, for the President, Vice-President, heads of the high state
    bodies and officials of ministerial rank, numbers coordinated with the
    State Secretariat; printed example RI 1. Perkap 4/2006 Pasal 10(1): RI 1
    President, RI 2 Vice-President. Nothing below goes beyond that at
    statute tier.
  sub_numbers: >-
    id.wikipedia's list uses SUB-NUMBERS joined by a hyphen (RI 5-1 to RI 5-7
    for the deputy speakers of the MPR, RI 24-2 onward for ministers under a
    coordinating minister). That shape is outside the regulation's words
    ("nomor urut registrasi tanpa seri huruf") and is carried in plates/id.yml
    as the recall-only series id-state-ri-subnumbered-2024.
  indonesia_plates: >-
    Both articles: the President's and Vice-President's cars carry
    "INDONESIA 1" and "INDONESIA 2" on ceremonial occasions (en.wikipedia)
    instead of RI 1 and RI 2. id.wikipedia adds that RI plates are always
    black like private plates while INDONESIA plates are always red like
    government plates. CONFLICT: Korlantas' own 2026 colour list, as quoted
    by detikOto, says "Pelat putih RI" (white). Since 2022 private plates
    are white, so "like private plates" and "white" may both describe the
    current RI plate; the article's "black" is likely the pre-2022 state.
    Series: id-state-indonesia-ceremonial.
  list_as_of: "2024-10, per id.wikipedia; the article notes the numbers change with each cabinet ('sering berganti ... disesuaikan dengan jumlah anggota Kabinet')"
  struck_through_note: "struck_through marks an entry the article shows struck out (an office vacated or abolished)."
  rows:
    - { number: "RI 1", holder: "Presiden Indonesia" }
    - { number: "RI 2", holder: "Wakil Presiden Indonesia" }
    - { number: "RI 3", holder: "Ibu Negara Indonesia (Istri Presiden)", struck_through: true }
