# plates/_decode/gr-prefectures.yml — the Greek two-letter area code table.
#
# WHAT THIS TABLE IS. On an ordinary Greek plate the serial is three letters, a
# hyphen and four digits (ΥΑ οικ. 4700/330/2004 art. 1 para. 2). The FIRST TWO
# of those three letters identify the issuing Directorate of Transport, and the
# third letter is the sub-series inside it. This file decodes that two-letter
# prefix.
#
# PROVENANCE — READ THIS BEFORE TRUSTING A ROW. The rows below are
# `secondary-wikipedia`. They are NOT from the statutory annex, and the file
# says so at every row via `evidence:` on the table rather than by dressing a
# secondary as an instrument.
#
# THE PRIMARY EXISTS AND IS NAMED; IT WAS NOT REACHABLE IN THIS PASS. The
# allocation is a STATUTORY ANNEX (παράρτημα) to ΥΑ 19800/1982 «Πινακίδες
# αριθμού κυκλοφορίας αυτοκινήτων οχημάτων και ρυμουλκουμένων» (ΦΕΚ Β' 455 of
# 1-7-1982), and it is LIVE — amended by ministerial decision as Directorates
# exhaust their combinations. Two such amendments were located and confirm both
# the annex's existence and its subject matter:
#   * ΥΑ 282069/2023, ΦΕΚ Β' 5645 of 25-9-2023 — retitled "Τροποποίηση της υπ'
#     αρ. 19800/1982 απόφασης"; reallocates three-letter combinations to named
#     Directorates (Central Athens, Piraeus, Elefsina and others).
#   * ΥΑ 178239/2024, ΦΕΚ Β' 5096 of 9-9-2024 — same form, same subject,
#     motorcycle combinations.
# ΥΑ οικ. 4700/330/2004 art. 1 para. 5 is the provision that KEEPS the annex
# alive across the 2004 redesign, verbatim: "Η κατανομή των γραμμάτων για τις
# διάφορες κατηγορίες των αυτοκινήτων, μοτοσικλετών και ρυμουλκούμενων,
# παραμένει ως έχει." ("The allocation of the letters for the various
# categories of cars, motorcycles and trailers remains as it is.")
#
# WHAT WAS TRIED, so the next pass does not repeat it:
#   * e-nomothesia.gr carries the consolidated 19800/1982, but behind a
#     subscriber paywall. Its own page says so: "Στο αρχικό κείμενο διατάξεων
#     έχουν επέλθει Νομοθετικές μεταβολές που δεν εμφανίζονται στους επισκέπτες
#     αλλά μόνο στους Συνδρομητές" ("legislative changes ... are not shown to
#     visitors, only to Subscribers"). The AMENDMENT pages are free; the base
#     text is not.
#   * The Wayback Machine copy of that same page was fetched and carries the
#     identical paywall notice — so this is not a transient block and no
#     archived free copy exists at that URL.
#   * et.gr's ΦΕΚ download endpoints (/api/DownloadFeksApi/, /api/DownloadFek/,
#     the idocs-nph viewer) answered 301 or 404 for every constructed fek_pdf
#     id, and search.et.gr is a JavaScript application that returns no
#     server-rendered results to a plain fetch.
#   * Two web search engines were exhausted or CAPTCHA-gated during the pass.
# THE NEXT STEP THAT WOULD WORK: drive et.gr's search UI in a real browser and
# download ΦΕΚ Β' 455/1982 (the annex itself) and ΦΕΚ Β' 5096/2024 (a recent
# amendment, likely a cleaner scan) as PDFs. That would upgrade this whole file
# from `secondary-wikipedia` to `instrument-in-force`, and it is the single
# highest-value follow-up in the Greek slice.
#
# SCRIPT DISCIPLINE — the reason this file has two code columns.
#   * `printed` is what the plate actually shows: GREEK capitals, e.g. ΡΚ =
#     U+03A1 U+039A.
#   * `code` is what this dataset matches on: LATIN capitals, e.g. PK =
#     U+0050 U+004B, because plates/_meta/separators.yml fixes the dataset's
#     serial alphabet as Latin A-Z and 0-9.
# The mapping is by IDENTICAL PRINTED GLYPH, never by phonetics. Greek Ρ (Rho)
# becomes Latin P, not R; Η (Eta) becomes H, not E; Υ (Upsilon) becomes Y, not
# U; Χ (Chi) becomes X, not C. Rhodes is ΡΚ on the plate and PK in this file.
# A phonetic transliteration would silently produce a decode table that never
# matches a real plate, and the error is invisible on screen because the glyphs
# are identical. Every row below was produced by a mechanical glyph map applied
# to the source bytes, not by retyping.
#
# A SOURCE DEFECT, RECORDED RATHER THAN SMOOTHED: four rows (AY, BZ, EK and one
# of the two NX rows) are spelled in LATIN capitals in the source article while
# the other 191 are spelled in Greek. The normaliser accepted both and produced
# the same `code`; `printed` reproduces the source's own script for those four,
# so the inconsistency stays visible instead of being tidied away.
#
# MAXIMAL-MUNCH / UNIQUENESS CAVEAT — the table is NOT a function of the prefix
# alone. `NX` appears TWICE with different meanings: a Thessaloniki motorcycle
# allocation, and a nationwide "prefecture goods transport" truck allocation.
# A parse API must therefore key on (prefix, vehicle category), never on the
# prefix by itself, or it will report Thessaloniki for a national haulage
# plate. This is the Greek analogue of the two-table trap recorded in
# plates/_decode/it-provinces.yml.
#
# PERIOD DISCIPLINE (PRD-PLATES §2.4). 34 of the 195 rows are combinations that
# are ALLOCATED BUT NOT YET IN ISSUE (`status: allocated-not-yet-issued`). They
# are kept, not dropped, because they are the forward half of the allocation —
# but a consumer must not report them as observed geography, and a validator
# must not treat a match on one as evidence the plate exists. Rows are closed
# by status, never deleted.
#
# WHAT THIS TABLE DOES NOT COVER: the third letter's sub-allocation (the `note`
# column records the fragments the source gives — omitted triples, colour
# variants for tax-free and state cars — but there is no complete third-letter
# table here), and the pre-2004 two-letter series (gr-provincial-1972), whose
# codes are NOT assumed to match these.
jurisdiction: gr
topic: prefectures
evidence: secondary-wikipedia
authority:
  name: "Υπουργείο Υποδομών και Μεταφορών — the allocation annex (παράρτημα) to ΥΑ 19800/1982 (ΦΕΚ Β' 455/1-7-1982), as amended; NOT the source of the rows below"
  url: "https://www.yme.gov.gr/"
sources:
  - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Greece  # EVERY ROW BELOW: code, area, seat, vehicle category and in-issue/not-yet-issued status. Revision 1367180219 of 2026-08-01T14:31:31Z, fetched as wikitext via action=raw on 2026-08-02 and transformed by a mechanical Greek-to-Latin glyph map. secondary-wikipedia"
  - "https://www.e-nomothesia.gr/kat-aytokinita/pinakides-kuklophorias/ya-282069-2023.html  # ΥΑ 282069/2023 (ΦΕΚ Β' 5645/25-9-2023), 'Τροποποίηση της υπ' αρ. 19800/1982 απόφασης' — evidence that the allocation annex EXISTS, is statutory and is amended by ministerial decision. Accessed 2026-08-02"
  - "https://www.e-nomothesia.gr/kat-aytokinita/pinakides-kuklophorias/ya-178239-2024.html  # ΥΑ 178239/2024 (ΦΕΚ Β' 5096/9-9-2024), same form — the motorcycle combinations. Accessed 2026-08-02"
  - "https://www.dsanet.gr/Epikairothta/Nomothesia/yaoik4700-330_04.htm  # ΥΑ οικ. 4700/330/2004 art. 1 para. 5: the allocation 'παραμένει ως έχει' — the provision that carries the 1982 annex forward. Accessed 2026-08-02"
period: { start: 2004 }
period_evidence: secondary-wikipedia
period_note: >-
  2004 is the year the CURRENT three-letter series these codes belong to took
  effect (ΥΑ οικ. 4700/330/2004, in force 1-5-2004). The two-letter prefixes
  themselves are older — they descend from the allocation annex of ΥΑ
  19800/1982 and many were in use throughout the 1982-2004 series — but no
  per-code start date was sourced for any row, so no row carries its own
  period. Dating individual codes requires the annex and its amendment chain.

# code:       the two-letter prefix in LATIN capitals — what a regex matches
# printed:    the same prefix in GREEK capitals — what the plate shows
# area:       the prefecture / nationwide function the prefix denotes
# seat:       the Directorate's seat, where the source distinguishes it
# categories: the vehicle categories the prefix is allocated to (the NX
#             collision is why this field is load-bearing, not decorative)
# status:     in-issue | allocated-not-yet-issued
# note:       third-letter and colour fragments as the source gives them
