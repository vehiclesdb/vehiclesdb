# plates/_decode/id-diplomatic-codes.yml — the country and organisation codes
# printed after CD (and, by the regulation's own example, CC) on Indonesian
# diplomatic and consular plates.
#
# SOURCE: Perpol 7/2021 Lampiran D.4, PDF pp. 99-103 — "susunan kode negara
# dengan kode registrasi CD untuk Korps diplomatik dan perwakilan tetap ASEAN".
# A CLOSED, PRIMARY list of 130 rows, printed in the regulation itself, which
# is why it is a _decode file (PRD-PLATES §2.4) on the model of
# se-diplomatic.yml. Codes and printed names were taken from the annex text
# layer and checked against the page images (p. 102 in full); the text layer's
# OCR noise in the organisation names ("Proaramme", "Omanization", "Or9anization",
# "ClFOR\", "lOM") is repaired to what the page shows. Every other printed
# spelling is kept, including the regulation's own slips ("Kazakhtan",
# "Inter-Paliamentary").
#
# HOW A CODE IS USED (Lampiran D.1-D.2), verbatim examples:
#   "Contoh: Ranmor Korps Diplomatik Amerika Serikat" -> CD | 12 | 5
#   "Contoh: Ranmor Korps Konsulat Amerika Serikat"   -> CC | 12 | 10
# i.e. registration code, country code, then a running number. The CC example
# reuses the CD table's code for the United States; the table's heading names
# only CD. That CC always takes the same code as CD is therefore an INFERENCE
# from one example, recorded as such (see §VERIFIER in plates/id.yml). The
# honorary-consul example in Lampiran F.5 ("CH 130 1", Azerbaijan) likewise
# uses this table's code 130.
#
# THE GAPS ARE PRINTED, NOT TRANSCRIPTION LOSSES. The table's row numbers run
# 1 to 130 without a break while the codes skip 46, 91, 119 and 124 (Iran 45 is
# followed by Malaysia 47, and so on). The regulation does not say why. Codes 1
# to 11 are not used either. A decoder should treat these as unassigned in the
# 2021 table, not as errors.
#
# WHAT IS ON THE LIST BESIDES STATES: 29 rows are international organisations
# or missions, including the UN agencies with offices in Jakarta, the ASEAN
# Secretariat (100), the ASEAN Foundation (111), the European Union (99), the
# ICRC (97) — and Indonesia's own permanent mission to ASEAN (92, "Perutusan
# Tetap Republik Indonesia (PTRI) ASEAN"), which the heading's words
# "perwakilan tetap ASEAN" explain: Jakarta hosts the ASEAN Secretariat, so the
# permanent missions to ASEAN register here too.
#
# THE ASSIGNING AUTHORITY: Lampiran D.3 — CD and CC registrations
# "dikoordinasikan dengan Kementerian Luar Negeri" (the foreign ministry). A
# code that later leaves the list does not make older plates undecodable; rows
# are closed by period, never deleted.
jurisdiction: id
topic: diplomatic-codes
authority:
  name: "Korlantas Polri, in coordination with Kementerian Luar Negeri (Lampiran D.3)"
  url: "https://korlantas.polri.go.id/"
sources:
  - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Perpol 7/2021 Lampiran D.1-D.4, PDF pp. 98-103 (examples 'CD 12 5', 'CC 12 10'; the 130-row code table); Lampiran F.5, p. 105 ('CH 130 1'). Accessed 2026-11-25. Evidence: primary (statute)"
corroboration: "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # id.wikipedia section 'Korps diplomatik dan konsuler' lists the same 130 codes with the same gaps (checked mechanically 2026-11-25); names differ only in wording (for example AIPO for code 106, where the annex prints AIPA). period_evidence: secondary-wikipedia"
period: { start: 2021 }
period_evidence: instrument-in-force
period_note: >-
  2021 is the regulation read. Perkap 4/2006 Pasal 11(4) already put the
  diplomatic and consular codes in an annex (its Lampiran C), which was not
  legible in the scan obtained; whether the numbering was the same in 2006 is
  open.
unassigned_in_table: [46, 91, 119, 124]
