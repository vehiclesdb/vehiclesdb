# plates/_decode/cn-issuing-offices.yml — China's 发牌机关代号 (issuing-office
# letter codes), the second element of a civil Chinese registration number.
#
# VERIFIED 2026-11-26 (PRD-PLATES § 5.3). The first wave (2026-08-02) built this
# table from GA 36-2007 Annex A, the only edition it could read. The verification
# pass read the Annex A of GA 36-2014 and of the CURRENT GA 36-2018 (both from
# Wikimedia Commons republications of the published standard) and the twelve
# Annex A changes of GA 36-2018 第2号修改单 (2026-02-28, read only through a
# non-government republication), and checked every row by machine diff and by
# eye. Each row now says which editions print it (`editions`, with XG2 for the
# 2026 amendment), whether it is current, and its evidence tier:
#   instrument-in-force             printed in GA 36-2018 Annex A as read
#   instrument-amendment-republished  added by 第2号修改单, read via gzparking.com
#   instrument-superseded           printed only in GA 36-2007 (or overridden)
#
# WHAT IS AUTHORITATIVE FOR THE LETTERS. The normative Annex A (规范性附录) of
# GA 36 — "发牌机关代号见附录 A" (§ 5.8.1) — as amended by 修改单. Local
# announcements (e.g. 郑州市人民政府 for 豫V, 2020) show letters entering use
# between editions under § 5.8.3; the 2026 amendment then wrote several of them
# into Annex A. No secondary list was used for any row.
#
# THE RULES (GA 36-2018, verbatim):
#   § 5.8.1 "发牌机关即车辆登记机关,为省、自治区、直辖市公安厅、局和地、市、州、盟
#           公安局、处公安机关交通管理部门。发牌机关代号见附录 A。"
#   § 5.8.2 "直辖市公安机关交通管理部门使用发牌机关代号为 A 至 Z,应按照英文字母顺序
#           依次启用新的发牌机关代号,并在启用前 30 天报公安部交通管理局备案,经确认后
#           方可使用。" — Beijing, Tianjin, Shanghai and Chongqing: one row each,
#           all 26 letters, NO per-letter place meaning.
#   § 5.8.3 "设区的市或者相当于同级的公安机关交通管理部门报经公安部交通管理局批准同意
#           后可启用新的发牌机关代号。对于废止或者废止后重新启用发牌机关代号的,要报经
#           公安部交通管理局批准同意。" — the allocation is open; letters are added and
#           withdrawn between editions.
#
# WHAT CHANGED SINCE THE 2007 SNAPSHOT (each on its row):
#   GA 36-2014: 巢湖 Q and 西藏 H (驻四川双流) and J (驻青海格尔木) deleted; 襄樊 renamed
#     襄阳; a footnote defining "O" added (前言, verbatim on the rows).
#   GA 36-2018: 成都 gains G; 儋州 F added; the Shandong provincial office holds "O"
#     and "W" (footnote i).
#   第2号修改单 (2026-02-28): 冀X 雄安新区; 苏州 E U; 杭州 A M; 宁波 B N; 济南 A S;
#     临沂 Q W; 莱芜 S deleted; 郑州 A V; 武汉 A W; 西安 A U; 西咸新区 U; the
#     Shandong provincial office's W deleted.
#   Printed oddities recorded, not applied: 固原 is printed C in 2014 and 2018
#     (吴忠 is C; 2007 printed D); 双鸭山市 is printed 双鸭市 in 2007 and 2018.
#   Place names are as printed: 2018 still prints 铜仁地区, 毕节地区, 海东地区,
#     吐鲁番地区, 哈密地区 and the Tibetan 地区 although those have since become 市.
#
# CAUTIONS A PARSE API MUST CARRY:
#   * The code is the ISSUING OFFICE at registration, not the owner's address.
#   * Several cities hold more than one code; each is a row.
#   * "O" is national: every province's own provincial vehicle office (and, in
#     Shandong, its traffic police corps office). Annex A footnote g (2014 on)
#     says what it is for — public-security service vehicles that are not on 警
#     plates. That is the sourced content of the "O 牌"; nothing more is asserted.
#   * "Z" is both an ordinary prefecture code (川Z 眉山) and, per footnote h, the
#     粤Z code for the Hong Kong / Macau cross-boundary plate.
#   * I and O are valid OFFICE letters (the municipal rows print all 26); the I/O
#     exclusion applies to the serial only (§ 5.9).
#   * The 2018 CONSULATE plate and the EMERGENCY plate carry no office letter;
#     the police plate's letter is issued provincially. Do not decode those here.
