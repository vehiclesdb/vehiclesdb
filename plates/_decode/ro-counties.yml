# plates/_decode/ro-counties.yml — Romania's registration-mark territorial codes.
#
# PROVENANCE, STATED FIRST AND WITHOUT DECORATION. Unlike
# plates/_decode/it-provinces.yml and plates/_decode/at-districts.yml, whose rows
# are enacted law read off Normattiva and RIS, THE 41 COUNTY ROWS BELOW ARE
# `secondary-wikipedia`. The statutory annex exists and is named in `authority`;
# it was NOT reachable in this pass, and every URL tried and every failure mode
# is recorded in `primary_attempts` below so the next pass starts from a map.
# Every row carries `evidence_tier: secondary-wikipedia` inline. No row in this
# file claims `instrument-in-force`, and a reviewer who fingerprints this table
# against Wikipedia SHOULD find a match — that is the declared provenance, not a
# defect.
#
# THREE STRUCTURAL FACTS THIS FILE EXISTS TO CARRY
#
# 1. BUCHAREST IS NOT A COUNTY ROW, AND THAT IS WHY IT IS NOT IN THE COUNTY
#    TABLE. Romania's territorial code is a ONE-letter code for the capital and a
#    TWO-letter code for each of the 41 counties, and the two take DIFFERENT
#    SERIAL FORMATS: a county plate carries two digits between the code and the
#    three letters, Bucharest carries three. That is a real format fork inside
#    one jurisdiction, it is modelled as separate SERIES in plates/ro.yml, and
#    this file keeps `municipality` structurally apart from `counties` so a
#    decoder cannot silently treat "B" as though it were a 42nd county row. The
#    ordering and the split below are this dataset's, chosen to make the fork
#    visible; they are not any source's arrangement.
#
# 2. THERE IS NO MAXIMAL-MUNCH PROBLEM, AND THAT IS WORTH SAYING OUT LOUD.
#    Spain's pre-2000 province codes are one, two or three letters and a decoder
#    must try longest-first (see plates/_decode/es-provinces.yml). Romania looks
#    like it should have the same trouble — "B" is Bucharest while "BC", "BH",
#    "BN", "BR", "BT", "BV" and "BZ" are all counties — but it does not, because
#    the DIGIT BLOCK ALWAYS FOLLOWS THE CODE. In "B12ABC" the character after B
#    is a digit, so the code is one letter; in "BC12ABC" it is a letter, so the
#    code is two. The rule is mechanical and total, and it survives separator
#    stripping (PRD-PLATES §2.6), which is exactly when a decoder needs it most.
#
# 3. THESE ARE NOT THE PRE-1992 CODES. The communist-era system used a different
#    territorial letter set built on the administrative regions of the day — the
#    much-repeated example is that the Craiova area ran under "OL" for Oltenia —
#    and it also placed the letters in the MIDDLE of the mark rather than at the
#    front. This table decodes the 1992-and-later mark only. Applying it to a
#    pre-1992 Romanian plate will produce confident nonsense; ro-communist-1966
#    in plates/ro.yml carries no reference to this file for that reason.
jurisdiction: ro
topic: counties
authority:
  name: "Regulamentul de aplicare a Ordonanţei de urgenţă a Guvernului nr. 195/2002 privind circulaţia pe drumurile publice, aprobat prin H.G. nr. 1.391 din 4 octombrie 2006 — the instrument whose annex carries the official list of indicative"
  url: "https://legislatie.just.ro/Public/DetaliiDocument/79058"
  note: >-
    Named as the CARRIER of the official list, not as the source of the rows
    below. Art. 23 of the Regulament composes the mark from "indicativul
    judeţului sau al municipiului Bucureşti" plus an order number plus three
    letters, and the indicative themselves are set out in the instrument's annex.
    That annex was not retrieved — see `primary_attempts`.

evidence:
  tier: secondary-wikipedia
  source: "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Romania  # the 41 county code-to-name pairs and the Bucharest code, re-expressed in this schema's own shape and ordering. Accessed 2026-08-02"
  what_is_secondary: "every code, every county name, and the count of 41 + 1"
  what_is_not_secondary: >-
    The COMPOSITION RULE — that the mark begins with the indicative of the county
    or of the municipality of Bucharest — is the Regulament's own words and is
    cited as such in plates/ro.yml. What is secondary here is the CONTENTS of the
    list, not the fact that the law keeps one.

