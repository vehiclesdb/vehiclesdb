period: { start: 1992 }
period_evidence: secondary-wikipedia
period_note: >-
  The code set below belongs to the system introduced in 1992. Two period
  cautions a decoder must carry. (1) LOWER BOUND: these codes do not decode
  pre-1992 marks at all (header fact 3). (2) STABILITY: Romania's county
  boundaries have not been re-cut since 1968, so unlike the Italian province
  sigle (four withdrawn in 2017) and the German district codes (reinstated in
  waves), this table has no known withdrawn rows and no known period-closed rows.
  That is an ABSENCE OF EVIDENCE of churn rather than sourced evidence of
  stability, and it is recorded as the former.

iso_3166_2_correspondence:
  status: UNVERIFIED
  claim_not_made: >-
    The 41 two-letter codes below LOOK like the subdivision codes of ISO
    3166-2:RO with the "RO-" prefix removed, and if that correspondence held it
    would give this table a second, non-Wikipedia, structured route. THIS FILE
    DOES NOT RELY ON IT AND DOES NOT ASSERT IT. The ISO register was not fetched
    in this pass, so the correspondence is an unchecked hypothesis, and an
    unchecked hypothesis dressed as corroboration would be worse than no
    corroboration at all — two sources that were never actually compared are one
    source with a false witness. Recorded here as the FIRST task for a verifier:
    fetch the ISO 3166-2:RO register, diff it against these rows, and either
    upgrade the tier or record where they diverge.

# ---------------------------------------------------------------------------
# THE CAPITAL — one letter, three digits, its own series in plates/ro.yml.
# ---------------------------------------------------------------------------
municipality:
  code: B
  name: "București"
  name_en: Bucharest
  type: "municipiu (the capital, which is not a județ)"
  serial_digits: 3
  serial_digits_history:
    - { digits: 2, note: "the original 1992 form, B 99 LLL — see ro-bucharest-1992 / ro-bucharest-2007" }
    - { digits: 3, note: "adopted when the two-digit space was exhausted — see ro-bucharest-2010" }
  evidence_tier: secondary-wikipedia
  note: >-
    THE FORMAT FORK. Every other territorial code in Romania takes two digits;
    Bucharest takes three. The reason is capacity, not law: art. 23 of the
    Regulament prescribes "numărul de ordine, format din cifre arabe" and fixes
    NO number of digits at all, so the capital was able to lengthen its order
    number without any amendment. That is why plates/ro.yml carries a
    `regex_statutory` wider than its `regex` for the standard series — the
    statute is genuinely wider than what is issued, and Bucharest is the proof.

# ---------------------------------------------------------------------------
# THE 41 COUNTIES — ordered by CODE, this dataset's ordering. Two letters each,
# two digits in the serial, without exception.
# ---------------------------------------------------------------------------
