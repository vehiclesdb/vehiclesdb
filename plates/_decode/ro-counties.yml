# ---------------------------------------------------------------------------
# Decoder cautions.
# ---------------------------------------------------------------------------
decoder_cautions:
  - id: place-of-registration-not-residence
    text: >-
      The Romanian indicative denotes where the vehicle is REGISTERED. It is
      therefore semantically unlike the Italian right-hand sticker (the holder's
      province of RESIDENCE, and legally not part of the plate at all) and unlike
      the French SIV département band (owner-CHOSEN, decoding to nothing). A
      Romanian indicative is real geography. It is still not a claim about where
      the vehicle IS, only about where it was put on the register.
  - id: ilfov-is-not-bucharest
    text: >-
      IF (Ilfov) is the county that SURROUNDS Bucharest and is a separate
      indicative with the ordinary two-digit format. A decoder that folds IF into
      B, or renders IF as "Bucharest area", is wrong on both the code and the
      format.
  - id: no-code-is-a-word
    text: >-
      Unlike Italy, whose Rome sigla is the literal word "Roma" and forces a
      special case into every parser, every Romanian code here is exactly one or
      two letters. There is no four-letter exception and no mixed-case row.
  - id: three-letter-group-is-not-a-code
    text: >-
      The THREE letters at the end of a Romanian mark are a serial group, not a
      territorial code, even when they spell a plausible abbreviation. Certain
      combinations are reported to be reserved for institutions (POL, DEP, SNT,
      SRI, GUV); those are reservations inside the serial space and are recorded
      in plates/ro.yml, not here, because they decode to an INSTITUTION and not
      to a place.
