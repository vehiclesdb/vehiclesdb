# plates/_decode/hr-cities.yml — Croatian registracijska područja (registration areas).
#
# THE SOURCE FINDING, and it is the Anlage-5d case rather than the German one:
# THE CODE LIST IS IN THE REGULATION. Članak 52. stavak 2. of the Pravilnik o
# registraciji i označavanju vozila (NN 130/2017), verbatim: "Popis oznaka
# registracijskih područja nalazi se u Prilogu 1. koji je tiskan uz ovaj
# Pravilnik i njegov je sastavni dio." Prilog 1 is a closed, primary, 34-row
# table printed inside the pravilnik, listing for each two-letter code the
# gradovi (towns) and općine (municipalities) it covers. Every row below is
# extracted MECHANICALLY from that annex as published on
# narodne-novine.nn.hr — not transcribed by hand and not taken from any
# secondary compilation.
#
# THIRTY-FOUR CODES, not the "36+" that circulates on the enthusiast web. The
# annex numbers them 1-34 and the `annex_no` field preserves that numbering.
#
# ---------------------------------------------------------------------------
# THE CAVEAT THAT MAKES THIS TABLE HONEST — READ IT BEFORE DECODING ANYTHING.
# It lives HERE, in the table, and not only in prose in plates/hr.yml, because
# a consumer who loads this file and never reads the dossier is exactly the
# consumer who will get it wrong.
# ---------------------------------------------------------------------------
decodes_to: >-
  The registration area whose stanica za tehnički pregled vozila issued THIS
  MARK, which is the area of the then-owner's prebivalište / boravište /
  sjedište AT THE MOMENT OF ISSUE (čl. 5 st. 1 NN 130/2017). It is NOT a claim
  about where the vehicle is now, nor about where its CURRENT owner lives.
does_not_decode_to: >-
  The current owner's residence; the place of manufacture; the place of the
  technical inspection (čl. 5 st. 2 expressly permits an inspection station
  OUTSIDE the area to issue a mark bearing the owner's own area code).
caveat_2016:
  date: "2016-07-04"
  instrument: "Pravilnik o izmjenama i dopunama Pravilnika o registraciji i označavanju vozila, NN 45/2016, čl. 5 and čl. 10"
  what_changed: >-
    Until 3 July 2016 the SELLER of a vehicle had to deregister it and hand the
    plates back, and the plates could pass to the buyer only "ako su
    kupoprodajnim ugovorom ili pisanom izjavom ... ustupljene kupcu I AKO SE PRI
    PROMJENI VLASNIŠTVA NE MIJENJA REGISTRACIJSKO PODRUČJE" (NN 151/2008
    čl. 40 st. 3) — the same-area condition was written into the rule, so a
    surviving mark was strong evidence about the CURRENT owner's area.
    NN 45/2016 čl. 5 replaced that article outright: "U slučaju prodaje ili
    drugog načina promjene vlasništva na vozilu, novi vlasnik vozila dužan je u
    roku od 15 dana od stjecanja vozila registrirati vozilo na svoje ime ili ga
    odjaviti" — the duty moved to the BUYER and the surrender of the plates
    dropped out of the sale case entirely. The rule is carried forward verbatim
    as čl. 48 st. 1 of NN 130/2017.
  effect_on_this_table: >-
    For any mark that has changed hands on or after 2016-07-04, the code is
    evidence about the area of the owner AT FIRST ISSUE and about nobody since.
    A parse API must NOT report the code as the current holder's area. The link
    is not severed — čl. 25 st. 1 NN 130/2017 still issues NEW marks "za vozilo
    koje se registrira u drugom registracijskom području" — but it is no longer
    refreshed on every change of owner, and čl. 47 st. 7 additionally lets a
    surrendered plate be taken over by "druga osoba na temelju ovjerene izjave
    vlasnika registarskih pločica o ustupanju", i.e. by a different person.
  confidence_rule: >-
    current-area: unsound after 2016-07-04. area-at-issue: sound.
    Consumers that cannot date a mark must degrade to area-at-issue.
# ---------------------------------------------------------------------------
jurisdiction: hr
topic: cities
authority:
  name: "Pravilnik o registraciji i označavanju vozila, Prilog 1 (POPIS OZNAKA REGISTRACIJSKIH PODRUČJA) — Ministarstvo unutarnjih poslova"
  url: "https://narodne-novine.nn.hr/clanci/sluzbeni/2017_12_130_2993.html"
sources:
  - "https://narodne-novine.nn.hr/clanci/sluzbeni/2017_12_130_2993.html  # NN 130/2017 (27.12.2017.), Pravilnik o registraciji i označavanju vozila — čl. 52 st. 2 (the delegation) and Prilog 1 'POPIS OZNAKA REGISTRACIJSKIH PODRUČJA', all 34 rows with their gradovi and općine. Accessed 2026-08-02"
  - "https://narodne-novine.nn.hr/clanci/sluzbeni/2008_12_151_4118.html  # NN 151/2008 (23.12.2008.) — the PREVIOUS base pravilnik, čl. 52 st. 2 and its own 34-row POPIS, diffed against the 2017 annex to produce `changed_2008_2017` below. Accessed 2026-08-02"
  - "https://narodne-novine.nn.hr/clanci/sluzbeni/2016_05_45_1165.html  # NN 45/2016 (13.5.2016.) — čl. 5 (the ownership-transfer rule that produced caveat_2016) and čl. 10 (stupa na snagu 4. srpnja 2016.). Accessed 2026-08-02"
period: { start: 2018 }
period_evidence: enacted-commencement
period_note: >-
  2018, not 2017: NN 130/2017 was published on 27 December 2017 but its own
  čl. 59 says "stupa na snagu 1. siječnja 2018. godine" (with a handful of
  provisions deferred to 20 May 2018). The gazette date is not the period.
  The CODES themselves are far older — most of them are unchanged since the
  1993 system — but per-code start dates are a recorded gap: the popis attached
  to the Pravilnik o registraciji vozila na motorni pogon i priključnih vozila
  (NN 12/93, 22/93, 19/96, 149/02) was not reachable in this pass, and the 1993
  pravilnik's own čl. 34 expressly kept the OLD popis alive for a transitional
  period, so the 1990s code set is not asserted here.

# ---------------------------------------------------------------------------
# THE DIACRITIC PROBLEM — a PRD-PLATES §2.6 finding, recorded, not folded away.
# ---------------------------------------------------------------------------
diacritics:
  affected_codes: ["ČK", "KŽ", "PŽ", "ŠI", "VŽ", "ŽU"]
  finding: >-
    Six of the 34 codes are printed on the plate with a caron. Č, Š and Ž are
    NOT in the dataset's serial alphabet (plates/_meta/separators.yml declares
    it as A-Z 0-9), so no `format.pattern` or `format.regex` in plates/hr.yml
    can spell them: the area-code position is written `[A-Z]{2}` there and is
    therefore NARROWER than the issuing grammar for these six areas. Per
    PRD-PLATES §2.7 that is still `matching: strict` — narrower is strict — but
    a consumer matching a photographed Croatian plate MUST either ASCII-fold the
    input or widen the class itself. Extending the serial alphabet is a schema
    amendment (§2.6), not a data entry, and is NOT attempted here.
  authority_acknowledges_it: >-
    Čl. 22 st. 7 NN 130/2017 refuses a by-choice mark "ako drugom vozilu već
    nije dodijeljen registarski broj zbog kojeg može doći do DUPLIRANJA PRILIKOM
    TRANSLITERACIJE registarskih brojeva" — the regulation itself contemplates
    transliteration collisions. `code_ascii` below is our fold (Č->C, Š->S,
    Ž->Z); within the current 34 it is collision-free, which we checked.
  ascii_fold_collision_warning: >-
    ŠI folds to SI, and SI was itself a Croatian area code in the earlier system
    (Sisak, before SK). The fold is unambiguous against the CURRENT table and
    ambiguous against the historical one. Since the historical table is a
    recorded gap above, a consumer decoding an old plate must treat SI as
    unresolved rather than as Šibenik.

# ---------------------------------------------------------------------------
# What moved between the 2008 annex and the 2017 annex, from diffing the two
# primaries. Recorded because decode tables rot (PRD-PLATES §9) and because it
# shows the annex is maintained at the MUNICIPALITY level, not the code level.
# ---------------------------------------------------------------------------
changed_2008_2017:
  codes_added: []
  codes_removed: []
  method: "set-diff of the two annex texts, computed rather than read; the first hand-written version of this block asserted three changes that the diff does not support and one that a line-break artefact in the 2008 HTML had invented, and was replaced"
  code_set: "IDENTICAL in both annexes — all 34, same letters, same annex numbering. Nothing was added and nothing was withdrawn between 2008 and 2018."
  coverage_gained:
    KA: ["općina Kamanje"]
    PU: ["grad Vodnjan (promoted from općina)", "općina Guntana", "općina Tar-Vabriga"]
    ŠI: ["općina Tribunj", "općina Murter renamed Murter-Kornati"]
    VU: ["općina Štitar"]
    ZD: ["općina Kolan", "općina Vrsi"]
    RI: ["općina Lopar"]
  coverage_lost:
    ŽU: ["općina Gunja", "općina Vrbanja"]
  promotions:
    KT: "Popovača promoted to grad; Jasenovac demoted from grad to općina"
    PŽ: "Kutjevo promoted from općina to grad"
    VK: "Otok promoted from općina to grad"
    ZG: "Sveta Nedelja (općina) becomes the grad Sveta Nedjelja — a spelling change as well as a promotion"
  annex_defects_reproduced:
    - "KT lists Popovača TWICE in the 2017 annex — once as a grad and once as an općina. Reproduced as printed; not silently deduplicated."
    - "VŽ prints the općina as 'Martijabec' in the 2017 annex where the 2008 annex printed 'Donji Martijanec'. Read as a typo in the instrument, reproduced as a finding rather than corrected (the at-districts 'BH- Tamsweg' precedent)."
    - "Casing drifts between the two annexes ('Dubrovačko Primorje'/'Dubrovačko primorje', 'Vinodolska Općina'/'Vinodolska općina', 'Zlatar-Bistrica'/'Zlatar Bistrica'). The 2017 spelling is the one carried below."
  gap: "per-row (per-code and per-municipality) validity periods. The annex is republished whole and carries no dates of its own."

