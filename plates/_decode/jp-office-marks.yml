# plates/_decode/jp-office-marks.yml — the Japanese regional office marks (地名).
#
# WHAT THIS TABLE IS. Every Japanese registration number opens with a
# 運輸監理部・運輸支局・自動車検査登録事務所 を表示する文字 — the characters that
# display the transport bureau, transport branch office or vehicle inspection
# and registration office in whose jurisdiction the vehicle is BASED. Unlike
# the German district list (a Bundesanzeiger publication) and the British
# memory tags (a DVLA leaflet), THIS TABLE IS ENACTED LAW: it is 別表第一
# (Appended Table 1) of the 自動車登録規則 (Automobile Registration Regulation,
# 昭和四十五年運輸省令第七号 / Ministry of Transport Ordinance No. 7 of 1970),
# referred to by name in Article 13 item 1 of that ordinance. Every row below
# is that table, in the ordinance's own order, with the `area` column quoted
# verbatim in Japanese.
#
# ONE TABLE, FOUR NUMBER SYSTEMS. 別表第一 is also the table the OTHER Japanese
# plate families read from: 道路運送車両法施行規則 § 36-17(2) applies it to
# 検査対象軽自動車 (kei cars), § 36-18(2) to 二輪の小型自動車 (motorcycles over
# 250 cm3), and § 63-4(2) to 検査対象外軽自動車 (125-250 cm3 motorcycles).
# One decode table therefore serves every series in plates/jp.yml.
#
# THE SCRIPT LINE (PRD-PLATES §2.6). These marks are written in kanji and
# hiragana. They are NOT in the dataset's serial alphabet (A-Z 0-9), so they
# can never appear in a `format.pattern` or a `format.regex`; plates/jp.yml
# carries them as a `format.fields[]` entry with `script: kanji-hiragana` and
# points at this file. The `romaji` column below is a DATASET-ADDED
# transliteration for Latin-alphabet consumers — see `romaji_basis`.
#
# WHAT THE MARK MEANS, AND WHAT IT DOES NOT. Article 13(1) item 1 keys the mark
# to 「自動車の使用の本拠の位置」 — the position of the vehicle's BASE OF USE,
# not the owner's address and not where the vehicle is now. Article 13(2) then
# freezes the mark against later boundary changes, verbatim: 「運輸監理部又は運輸
# 支局の管轄区域が変更された場合においては、当該変更前に法の規定により登録された
# 自動車登録番号については、…前項に規定する基準に適合しないこととなつたときであ
# つても、同項に規定する基準に適合するものとみなす」 — a mark issued before a
# boundary change stays valid afterwards. A decoder must therefore treat a mark
# as evidence of the base of use AT FIRST REGISTRATION (or last renumbering),
# never as a current-location signal. This is the same caution plates/gb.yml
# records for DVLA memory tags and PRD-PLATES §2.4 records for the French SIV.
#
# ROWS ARE NEVER DELETED. No mark has been withdrawn from 別表第一 in any
# revision e-Gov publishes (2017-04-01 onward): the table has only grown,
# 117 rows -> 135 -> 140. Where a mark was ADDED, the row carries the
# enforcement date of the amending ordinance as `from` (see `period_evidence`
# below) — that is an instrument date, not a guess.
#
# Referenced by plates/jp.yml via `region_encoding` on every road series.
jurisdiction: jp
topic: office-marks
authority:
  name: 国土交通省 (Ministry of Land, Infrastructure, Transport and Tourism, MLIT)
  url: "https://laws.e-gov.go.jp/law/345M50000800007"
instrument:
  citation: "自動車登録規則 別表第一（第十三条関係） — Automobile Registration Regulation (Ministry of Transport Ordinance No. 7 of 20 February 1970), Appended Table 1 (relating to Article 13)"
  law_id: "345M50000800007"
  promulgated: "1970-02-20"
  consolidated_at: "2026-04-01"
  consolidation_revision_id: "345M50000800007_20260401_508M60000800041"
  enabling_article: >-
    自動車登録規則 § 13(1) item 1, verbatim: 「自動車の使用の本拠の位置を管轄する
    運輸監理部又は運輸支局（使用の本拠の位置が自動車検査登録事務所の管轄区域に属する
    場合にあつては、当該自動車検査登録事務所。次項において同じ。）を表示する文字
    （別表第一）」 — "characters displaying the Transport Administration Department
    or Transport Branch Office having jurisdiction over the position of the base
    of use of the motor vehicle (or, where that position falls within the
    jurisdiction of a Motor Vehicle Inspection and Registration Office, that
    office) (Appended Table 1)". Translation is this dataset's; the Japanese is
    the authority.
sources:
  - "https://laws.e-gov.go.jp/law/345M50000800007  # 自動車登録規則 § 13 and 別表第一 — every row below, verbatim; accessed 2026-08-02"
  - "https://laws.e-gov.go.jp/api/2/law_data/345M50000800007_20260401_508M60000800041?law_full_text_format=xml  # the machine-readable consolidation this file was transcribed from (e-Gov API v2), accessed 2026-08-02"
  - "https://laws.e-gov.go.jp/api/2/law_revisions/345M50000800007  # the revision list that dates the 2020 and 2025 additions; accessed 2026-08-02"
  - "https://www.mlit.go.jp/jidosha/jidosha_tk6_000036.html  # MLIT, 図柄ナンバープレート（地方版）— corroborates the 2020-05-11 (17 regions) and 2025-05-07 (5 regions) waves and names them; accessed 2026-08-02"
  - "https://www.mlit.go.jp/report/press/content/001856564.pdf  # MLIT press release of 令和7年1月17日 naming the five 2025 marks (十勝・日光・江戸川・南信州・安曇野) and recording that 青森県田舎館村 was moved into the 弘前 area — which is exactly what this table 弘前 row says in its own words; accessed 2026-08-02"
licence: >-
  e-Gov 法令検索 publishes Japanese statutes and ordinances; Japanese law is an
  edict of government. The Japanese text quoted here is the instrument's own.
  MLIT pages are 国土交通省 publications.
period: { start: 1970 }
period_evidence: enabling-instrument
period_note: >-
  1970 is the promulgation of the 自動車登録規則 itself (昭和45年運輸省令第7号,
  1970-02-20), which is the instrument this table lives in. It is NOT a claim
  that the office-mark scheme began in 1970: Japanese plates carried a place
  name long before the 1970 ordinance consolidated the rule, and no primary for
  the scheme's own start was secured in this pass (recorded gap — see
  dossier-jp.md). PER-ROW `from` values are different and stronger: they are
  the enforcement dates of the amending ordinances e-Gov publishes.
row_period_evidence:
  "2017": >-
    instrument-in-force-upper-bound — 2017-04-01 (平成28年国土交通省令第87号,
    promulgated 2016-12-28) is the EARLIEST consolidation e-Gov holds for this
    ordinance. 117 of the 140 rows are already present in it, so 2017 is an
    UPPER BOUND on their introduction, never a start date. Most are far older.
  "2020": >-
    enabling-instrument — 18 rows (17 distinct marks; 知床 appears under both
    the 釧路 and 北見 offices) first appear in the consolidation in force
    2020-05-11 (令和2年国土交通省令第45号, promulgated 2020-04-10). MLIT's
    figure-plate page names the same 17 as the 「第2弾」 wave of ご当地ナンバー,
    交付開始 令和2年5月11日 — instrument and authority page agree to the day.
  "2025": >-
    enabling-instrument — 5 rows first appear in the consolidation in force
    2025-05-07 (令和7年国土交通省令第59号, promulgated 2025-04-30): 十勝, 日光,
    江戸川, 南信州, 安曇野. MLIT's press release of 令和7年1月17日 announces the
    same five for 交付開始 令和7年5月頃, and adds that 青森県田舎館村 was moved
    into the 弘前 area — which is exactly what the 弘前 row's `area` text says.
romaji_basis: >-
  DATASET-ADDED, NOT SOURCED. 別表第一 is written entirely in kanji and hiragana
  and contains no Latin transliteration. The `romaji` field is a modified
  Hepburn rendering added by this dataset so that a Latin-alphabet consumer can
  index the table; long vowels are written WITHOUT macrons (Kyoto, Osaka, Kobe,
  Koto, Shonan, Joetsu, Kitakyushu) because the dataset's own alphabet is
  ASCII. Treat `mark` as normative and `romaji` as advisory.
duplicate_marks_note: >-
  Two marks appear on TWO rows each and both duplications are real: 知床 is
  issued by BOTH the 釧路 and the 北見 offices (Shiretoko straddles them), and
  富士山 by BOTH the 山梨 and the 沼津 offices (Mt Fuji straddles Yamanashi and
  Shizuoka). 140 rows, 138 distinct marks. A decoder keyed on the mark alone
  therefore resolves those two to a PAIR of offices, not to one.
counts: { rows: 140, distinct_marks: 138 }
