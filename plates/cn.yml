    - "外发〔2017〕10号 《关于开展驻华使团外交车辆换牌工作的通知》 — cited in GA 36-2018 § 2 and 表 1 as the scope of the 2018 embassy plate; text not located"
    - "《警车管理规定》, 公安部令第89号, as amended by 公安部令第174号 (施行 2025-12-29) — police plates"
    - "《临时入境机动车和驾驶人管理规定》, 公安部令第90号 (施行 2007-01-01) — temporary-entry plates"
    - "《国务院办公厅关于国家综合性消防救援车辆悬挂应急救援专用号牌有关事项的通知》, 国办发〔2018〕114号 — emergency-rescue plates"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts, cited once and referenced per series.
# ---------------------------------------------------------------------------
common:
  registration_number_elements:
    order: [province_han, office_letter, serial, classification_han]
    note: >-
      GA 36-2018 § 3.2. Departures, all sourced: the embassy plate has NO province
      and NO office letter (3-digit mission number + 3-digit serial + 使, 图 2);
      the 2018 consulate plate has a province but NO office letter (province +
      3-digit mission number + 2-position serial + 领, 图 3); the emergency
      MOTORCYCLE plate puts 应急 first (国办发〔2018〕114号).
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 § 3.2, 图 2, 图 3 (Commons republication); accessed 2026-11-26"
  province_han:
    decode: "plates/_decode/cn-provinces.yml"
    count: 31
    note: "GA 36-2018 § 5.7 表 2 — 31 rows, identical in character and order to GA 36-2007's. GA 36-92 表 2 had 30 (no 渝)."
  office_letter:
    alphabet: "A-Z"
    includes_i_and_o: true
    decode: "plates/_decode/cn-issuing-offices.yml"
    rules: >-
      GA 36-2018 § 5.8.2, verbatim: "直辖市公安机关交通管理部门使用发牌机关代号为 A
      至 Z,应按照英文字母顺序依次启用新的发牌机关代号,并在启用前 30 天报公安部交通管理
      局备案,经确认后方可使用。" § 5.8.3: "设区的市或者相当于同级的公安机关交通管理部门
      报经公安部交通管理局批准同意后可启用新的发牌机关代号。对于废止或者废止后重新启用
      发牌机关代号的,要报经公安部交通管理局批准同意。" The allocation is open; Annex A
      is amended by 修改单 (第2号 changed twelve entries).
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 § 5.8 and 附录 A 表 A.1; accessed 2026-11-26"
  serial:
    letters_excluded: [I, O]
    max_letters: 2
    widths_defined: [2, 3, 4, 5, 6]
    combinations_source: "GA 36-2018 表 3 (widths per class), 表 4 (sixteen 4/5-position combinations), 表 5 and 表 6 (6-position NEV, 表 6 as replaced by 第2号修改单)"
    release_rule: >-
      § 5.9.2 a), verbatim: "序号用数字和字母组合方式的使用应按表 4 的规定依次有序使用。已
      使用的序号总量与序号理论容量的比例超过 60% 时,经省级公安机关交通管理部门批准并报
      公安部交通管理局备案后,可启用下一种组合方式。" A letter-bearing serial implies a
      later combination within one office code; owner self-composition
      (第四十三条) makes any year inference unsafe, and none is made.
    recycling_rule: "§ 5.9.2 b) and § 5.9.3 b): '机动车登记中收回的号牌,其机动车登记编号 12 个月后应重新启用。' (GA 36-2007 § 5.9.2 b) and GA 36-2014: '6 个月后可重新使用')"
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 § 5.9; accessed 2026-11-26"
  classification_han:
    note: >-
      GA 36-2018 § 5.10, verbatim and complete: "a) 领馆汽车号牌和领馆摩托车号牌为"领";
      b) 使馆汽车号牌和使馆摩托车号牌为"使"; c) 警用汽车号牌和警用摩托车号牌为"警";
      d) 教练汽车号牌和教练摩托车号牌为"学"; e) 挂车号牌为"挂"; f) 香港特别行政区入出
      内地车辆号牌为"港"; g) 澳门特别行政区入出内地车辆号牌为"澳"; h) 试验车的临时行驶
      车号牌为"试"; i) 特型车的临时行驶车号牌为"超"。"
    characters:
      - { han: 领, script: Han, pinyin: "lǐng", meaning: "consular post (驻华领事机构)" }
      - { han: 使, script: Han, pinyin: "shǐ",  meaning: "embassy, international-organisation office (驻华大使馆、国际组织驻华代表机构)", position_note: "LEADING on 1992-2018 plates (使014·578), TRAILING on the 2018 plate (224·578使)" }
      - { han: 警, script: Han, pinyin: "jǐng", meaning: "police vehicle" }
      - { han: 学, script: Han, pinyin: "xué",  meaning: "driving-instruction vehicle" }
      - { han: 挂, script: Han, pinyin: "guà",  meaning: "trailer" }
      - { han: 港, script: Han, pinyin: "gǎng", meaning: "Hong Kong vehicle entering/leaving the mainland" }
      - { han: 澳, script: Han, pinyin: "ào",   meaning: "Macau vehicle entering/leaving the mainland" }
      - { han: 试, script: Han, pinyin: "shì",  meaning: "test vehicle (temporary plate since 2007; metal 试验汽车 plate 1992-2007)" }
      - { han: 超, script: Han, pinyin: "chāo", meaning: "over-dimension/over-mass special vehicle, temporary plate" }
      - { han: 应急, script: Han, pinyin: "yìngjí", meaning: "national comprehensive fire-and-rescue vehicle", source_note: "not in GA 36 — created by 国办发〔2018〕114号" }
      - { han: 境, script: Han, pinyin: "jìng", meaning: "vehicle from outside the border (境外汽车), 1992-2007 only", source_note: "GA 36-92 § 3.5 (京A·F023境); absent from GA 36-2007" }
      - { han: 临, script: Han, pinyin: "lín", meaning: "temporary-travel plate, 1992-2007 only", source_note: "GA 36-92 § 3.22 figure ('临'字); absent from the 2007 and later temporary plates" }
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 § 5.10; accessed 2026-11-26"
  materials:
    metal: "GA 36-2018 § 6.1.1.1: aluminium only, to GB/T 3880.1, aluminium content not less than 99.60%; tensile strength 80-120 MPa; one face oxidised or resin-coated 5-8 μm; at least 1.2 mm thick for the large-vehicle rear and trailer plates, at least 1.0 mm for all others (2007 also allowed steel)"
    paper: "§ 6.1.1.2: temporary-entry plates on 200-220 g/m² watermarked paper, laminated; temporary-travel plates on offset paper of 120 g/m² or more (QB/T 1012) (2007: 125 g white card)"
    surface: "§ 6.1.2: retroreflective film to GA 666; the province-character identifier, or the NEV identifier, is pre-printed inside the film"
    embossing: "§ 6.7.3: a stiffening rib raised at least 1 mm all round; characters and separator raised at least 1 mm — at least 1.2 mm on both NEV plates"
    production_serial: "§ 6.3: every metal plate face carries a unique production serial (2-digit province code to GB/T 2260 + 1 check character + 10-digit sequence, 13 characters), a 14-character check code and a QR code (GB/T 18284), laser-etched inside the film; on the front, except the cross-boundary, embassy and consulate plates, where it is on the back"
    sine_curves: "§ 6.5: both NEV plates carry two sine curves laser-etched inside the film, with a dynamic depth effect (§ 6.6.1 g))"
    hidden_marks: "§ 6.2.1: characters and separator stamped with nationally uniform anti-counterfeit dies; a stamped mark identifying the maker around the province character and the office letter"
    tolerances: "§ 6.7.1: outline ±0.5 mm on the 88x60 plate, ±0.5% on every other size; § 6.7.2: character size ±1%"
    service_temperature: "§ 6.10: -40 °C to 60 °C without cracking or warping"
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 §§ 6.1-6.10; accessed 2026-11-26"
  installation:
    metal: "GA 36-2018 § 10.1: front plate centre or right of the front (direction of travel), rear plate centre or left of the rear; horizontal, within 15° of vertical (motorcycle plates may tilt up to 30°); every mounting hole fitted with a GA 804 fastener unless the vehicle makes it impossible; a plate frame must stay more than 5 mm from the characters and must not cover the production serial; no light source that hinders reading"
    paper: "§ 10.2 (as amended by 第1号修改单): temporary-entry car plate inside the windscreen, right side; temporary-entry motorcycle plate carried; temporary-travel plate stuck at the lower left or right of the windscreen, and for a passenger car a second one at the lower left of the rear window; void three days after the metal plates are received"
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 § 10; accessed 2026-11-26"
  enlarged_number: "GA 36-2018 § 12: goods vehicles of 4,500 kg or more (except semi-trailer tractors), truck-chassis special vehicles (except fire engines), trailers over 3,500 kg and buses of 6 m or longer carry the number enlarged on the rear of the body; dump trucks of 12,000 kg or more also on both sides; characters at least 2.5 times the small-car plate's"
  colour_basis:
    note: >-
      GA 36-2018 names colours and numbers only three: the red paint is GB/T 3181
      大红 (R03) (§ 6.9.1), and the paper plates' grounds are GB/T 3181 天(酞)蓝
      (PB09) and 棕黄 (YR06) (§ 6.6.2). Every other colour (the reflective grounds
      and characters) is sent to GA 666 (§ 6.9.2), whose text was not located.
      EVERY hex value in this file is therefore `hex_basis: observed`.
    named_colours_source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1, §§ 6.6.2, 6.9; accessed 2026-11-26"
  typeface:
    note: >-
      No named typeface. GA 36-2018 § 6.2.1 requires characters stamped with
      "全国统一的防伪专用模具", and § 7.2.1 checks them by overlay against "标准字符
      图像" that the standard does not print. GA 36-2014's foreword records
      "删除了附录'字样'中金属材料号牌的字符字样": the glyph drawings that GA 36-92
      (附录 C) and GA 36-2007 (附录 B) printed are no longer in the standard. The
      character BOXES are dimensioned in every 2018 figure and are recorded per
      series under design.layout.
  history:
    note: "Systems before and beside the 92 pattern. Recorded as history, not as series, where no primary fixes the serial grammar."
    systems:
      - name: "86 pattern (86式)"
        years: "from 1986 until replaced by the 92 pattern"
        description: "two-line plate: province name plus a two-digit area code above, five characters below; green small-car and red large-car plates"
        period_evidence: secondary-wikipedia
        source: "https://zh.wikipedia.org/wiki/中华人民共和国民用机动车号牌  # zh Wikipedia, revision 95587350: '第一行字符较小，以“省级行政区名称+两位数地区代码”的方式表明发证机关…第二行为5位阿拉伯数字、拉丁字母混排…小型汽车号牌为绿底白字，大型汽车号牌为红底白字…由于此种车牌于1986年首次发放，因此又被称为86式'; no primary instrument located — GA 36-2018 前言 lists no edition before GA36—1992; accessed 2026-11-26"
      - name: "2002 pattern (2002式), the personalised trial"
        years: "issued 2002-08-12 to 2002-08-21 in 北京、天津、杭州、深圳, suspended 2002-08-22"
        description: "owner-composed numbers; the press reports Beijing issued more than ten thousand in eight working days; new registrations reverted to the 92 pattern"
        period_evidence: secondary-press-contemporaneous
        source: "http://web.archive.org/web/20170321084838/https://www.chinanews.com/2002-08-22/26/214418.html  # 中新网 2002-08-22, '发放仅有8天 北京2002式机动车号牌今起暂停发放': '因故障从8月22日起本市暂停办理2002式机动车号牌，根据公安部有关规定，新车上号牌仍发放九二式号牌。除去双休日，自8月12日以来，北京、天津、杭州、深圳四城市作为试点城市发放2002式号牌只有8天，北京共发放新式号牌万余副。'; accessed 2026-11-26"
        format_status: "the serial grammar (zh Wikipedia: '由六位拉丁字母或数字组成') has no primary in hand, so no series id is minted for it"

series:

  # =========================================================================
  # THE CIVIL 92-PATTERN CORE. GA 36-2018 表 1 is the closed classification;
  # each series quotes its row and its 式样 figure.
  # =========================================================================

  - id: cn-small-car-1992
    class: standard
    categories: [car, van]
    period: { start: 1992 }
    period_evidence: enabling-instrument
    period_note: "GA 36-92 (实施 1992-07-01) 表 1 row 2 小型汽车 440x140 蓝底白字白框线, § 3.2 figure 京A·F0236 — the same plate, same size, same layout as today"
    standard_edition: "GA 36-2018 表 1 row 4; 图 1; Annex B.3"
    matching: strict
    format:
      pattern: "L99999"
      regex: '\A[A-Z][- ]?[A-Z0-9]{5}\z'
      regex_strict: '\A[A-Z][- ]?(?:\d{5}|[A-HJ-NP-Z]\d{4}|\d[A-HJ-NP-Z]\d{3}|\d{2}[A-HJ-NP-Z]\d{2}|\d{3}[A-HJ-NP-Z]\d|\d{4}[A-HJ-NP-Z]|[A-HJ-NP-Z]{2}\d{3}|[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d{2}|[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]\d|[A-HJ-NP-Z]\d{3}[A-HJ-NP-Z]|\d[A-HJ-NP-Z]{2}\d{2}|\d[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d|\d[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]|\d{2}[A-HJ-NP-Z]{2}\d|\d{2}[A-HJ-NP-Z]\d[A-HJ-NP-Z]|\d{3}[A-HJ-NP-Z]{2})\z'
      regex_strict_note: "GA 36-2018 表 4 five-position column, all sixteen combinations (= at most two letters, anywhere, never O or I). Before 2014 only eleven were defined and before 2007 only a leading letter; every older serial is inside this union."
      charset:
        office_letter: "A-Z (I and O included)"
        serial_letters_excluded: [I, O]
      progression: "表 4 combinations open in order once the previous is 60% used (§ 5.9.2 a))"
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "<province><office letter>·<5-position serial>"
        printed_example: "京A·F0236"
        printed_example_source: "GA 36-2018 图 1 and Annex B.3 (the standard's own specimen)"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][·\- ]?[A-Z0-9]{5}\z'
        regex_informational_note: "NOT part of the § 2.6 contract and NOT lint-validated. The Han class is the 31 characters of cn-provinces.yml in 表 2 order."
    design:
      plate: { w: 440, h: 140, unit: mm }
      count: 2
      background: { color: "#1C3F94", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      border: { color: "#FFFFFF", note: "白框线" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: false
      layout:
        source: "GA 36-2018 图 1 (单位为毫米)"
        characters: { count: 7, w: 45, h: 90, gap: 12, note: "province character, office letter and five serial characters, every box 45 x 90" }
        separator: { w: 10, h: 10, gap_each_side: 12, centre_from_top: 65 }
        margins: { left: 15, top: 25, bottom: 25 }
        corner_radius: 10
        keyline: "1.5 and 3 dimensioned at the edge (rib/keyline)"
        mounting: "four slots 15 mm long with R4 ends, centres 12.5 mm from the top and bottom edges, horizontally 100 mm from the left edge and 210 mm apart"
      note: >-
        GA 36-2018 表 1 row 4: 小型汽车号牌 / 440×140 / 蓝底白字,白框线 / 2 / 符合 GA802
        规定的中型以下的载客、载货汽车和专项作业车(适用小型新能源汽车号牌的除外).
        § 6.6.1 c): "其中小型汽车号牌和轻便摩托车号牌字符应反光" — the characters are
        retroreflective on this plate and the blue moped plate only.
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
      note: "Province (closed, 31) plus issuing office (open). In the four municipalities the letter is a batch marker, not a place (§ 5.8.2)."
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 (Commons republication) 表 1 row 4; § 5.1.1 图 1 (layout, millimetres); 表 3, 表 4 (serial); § 6.6.1 c); Annex B.3; accessed 2026-11-26"
      - "https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf  # GA 36-92 (scan, read as images): first page '1992-04-25批准 1992-07-01实施'; 表 1 row 2; § 3.2 figure; § 3.24 + 表 3 (letter only in the first position, 24 letters); accessed 2026-11-26"
    notes: >-
      The ordinary blue plate. Verified against GA 36-2018 in full: size,
      colours, count and scope unchanged since GA 36-92. The 2026-11-26 pass
      widened regex_strict from GA 36-2007's eleven letter-position combinations
      to the sixteen GA 36-2014 and GA 36-2018 define (adding letter pairs at
      positions 1+4, 2+4, 2+5, 3+4 and 3+5), and pinned the start to GA 36-92's
      in-force date.

  - id: cn-large-car-1992
    class: standard
    categories: [truck, bus]
    period: { start: 1992 }
    period_evidence: enabling-instrument
    period_note: "GA 36-92 表 1 row 1 大型汽车 前 440x140 后 440x220 黄底黑字黑框线"
    standard_edition: "GA 36-2018 表 1 row 1; 图 1 (front), 图 6 (rear); Annex B.1"
    matching: strict
    format:
      pattern: "L99999"
      regex: '\A[A-Z][- ]?[A-Z0-9]{5}\z'
      regex_strict: '\A[A-Z][- ]?(?:\d{5}|[A-HJ-NP-Z]\d{4}|\d[A-HJ-NP-Z]\d{3}|\d{2}[A-HJ-NP-Z]\d{2}|\d{3}[A-HJ-NP-Z]\d|\d{4}[A-HJ-NP-Z]|[A-HJ-NP-Z]{2}\d{3}|[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d{2}|[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]\d|[A-HJ-NP-Z]\d{3}[A-HJ-NP-Z]|\d[A-HJ-NP-Z]{2}\d{2}|\d[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d|\d[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]|\d{2}[A-HJ-NP-Z]{2}\d|\d{2}[A-HJ-NP-Z]\d[A-HJ-NP-Z]|\d{3}[A-HJ-NP-Z]{2})\z'
      charset: { serial_letters_excluded: [I, O], notes: "GA 36-2018 表 4, five-position column" }
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "front: <province><office letter>·<serial>; rear: <province>·<office letter> over <serial>"
        printed_example: "京A·F0236"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][·\- ]?[A-Z][·\- ]?[A-Z0-9]{5}\z'
    design:
      plate: { w: 440, h: 140, unit: mm, position: front }
      plate_variants:
        - { w: 440, h: 220, unit: mm, position: rear, lines: 2, note: "the two-line rear plate (图 6): the separator moves to between province and letter on the top line" }
      count: 2
      background: { color: "#FFD500", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000", note: "黑框线" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: true
      rear_differs_note: "A SHAPE difference: 440x140 front, 440x220 two-line rear (表 1 row 1; § 5.2)."
      layout:
        source: "GA 36-2018 图 1 (front, as cn-small-car-1992) and 图 6 (rear)"
        rear: { top_line: "province 80 wide and office letter 80 wide, 60 high, separator 10 between 25 mm gaps, 110 mm from the left edge", bottom_line: "five characters 65 wide x 110 high, gaps 15, left margin 27.5", vertical: "15 top margin, 60 top line, 15 gap, 110 bottom line, 20 bottom margin" }
        mounting_rear: "slots centred 85 mm from each side"
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 1: 大型汽车号牌 / 前:440×140 后:440×220 / 黄底黑字,黑框线 / 2 / 符合 GA802 规定的中型(含)以上载客、载货汽车和专项作业车(适用大型新能源汽车号牌的除外);有轨电车; 图 1, 图 6, Annex B.1; accessed 2026-11-26"
      - "https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf  # GA 36-92 表 1 row 1 and §§ 3.1 figures (front 京A·F0236, rear 京 A / F0236); accessed 2026-11-26"
    notes: >-
      The yellow plate for medium and larger passenger and goods vehicles and
      special-operation vehicles. SCOPE CORRECTED 2026-11-26: the first wave read
      GA 36-2007's "半挂牵引车；电车" (semi-trailer tractors and trolleybuses);
      GA 36-2018 表 1 row 1 reads "有轨电车" — TRAMS — and drops the separate
      mention of semi-trailer tractors, and since 2016 large new-energy vehicles
      take cn-nev-large-2016 instead. regex_strict widened to 表 4's sixteen
      combinations as on cn-small-car-1992.

  - id: cn-trailer-1992
    class: trailer
    categories: [trailer, semitrailer]
    period: { start: 1992 }
    period_evidence: enabling-instrument
    period_note: "GA 36-92 表 1 row 15 挂车 / 同大型汽车后号牌 / 1 / 全挂车和不与牵引车固定使用的半挂车"
    standard_edition: "GA 36-2018 表 1 row 2; 图 6; Annex B.2"
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A[A-Z][- ]?[A-Z0-9]{4}\z'
      regex_strict: '\A[A-Z][- ]?(?:\d{4}|[A-HJ-NP-Z]\d{3}|\d[A-HJ-NP-Z]\d{2}|\d{2}[A-HJ-NP-Z]\d|\d{3}[A-HJ-NP-Z]|[A-HJ-NP-Z]{2}\d{2}|[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d|[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]|\d[A-HJ-NP-Z]{2}\d|\d[A-HJ-NP-Z]\d[A-HJ-NP-Z]|\d{2}[A-HJ-NP-Z]{2})\z'
      width_note: >-
        FOUR positions, pinned 2026-11-26: 表 3 allows "4 位或 5 位" for the
        trailer plate; the five-cell bottom line of 图 6 holds four serial
        characters and 挂 (§ 5.10 e)), as Annex B.2's specimen 京·A / F023挂 shows
        and as GA 36-92's normative trailer figure (京 A / F023挂) already did.
        regex_strict is 表 4's four-position column.
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: { han: 挂, script: Han, pinyin: "guà", role: classification }
        printed: "<province>·<office letter> over <4-position serial>挂"
        printed_example: "京·A F023挂"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][·\- ]?[A-Z][·\- ]?[A-Z0-9]{4}挂\z'
    design:
      plate: { w: 440, h: 220, unit: mm, lines: 2 }
      count: 1
      background: { color: "#FFD500", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: false
      layout: { source: "GA 36-2018 图 6, shared with the large-vehicle rear plate (see cn-large-car-1992 design.layout.rear)" }
      note: "One plate (表 1 row 2), at least 1.2 mm aluminium (§ 6.1.1.1 d))."
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 2: 挂车号牌 / 440×220 / 黄底黑字,黑框线 / 1 / 符合 GA802 规定的挂车; 表 3; 图 6; § 5.10 e); Annex B.2 (京·A F023挂); accessed 2026-11-26"
      - "https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf  # GA 36-92 表 1 row 15 and the trailer 式样 figure (京 A / F023挂); accessed 2026-11-26"
      - "https://www.gov.cn/gongbao/content/2022/content_5682413.htm  # 《机动车登记规定》(公安部令第164号) 第十三条 (fourth paragraph): '车辆管理所办理注册登记时，应当对牵引车和挂车分别核发机动车登记证书、号牌、行驶证和检验合格标志' — CITATION CORRECTED from 第九条; accessed 2026-11-26"
    notes: >-
      Trailers. CHANGED 2026-11-26 from recall-only (four OR five positions) to
      strict four positions, because the readable 2018 and 1992 figures settle the
      width the 2007 text could not. GA 36-2018's scope is every trailer "符合 GA802
      规定的挂车"; GA 36-2007's narrower wording (full trailers and semi-trailers
      not permanently coupled) is no longer in the table. The registration rule
      was cited to 第九条; it is 第十三条.

  - id: cn-motorcycle-1992
    class: motorcycle
