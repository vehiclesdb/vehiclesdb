      regex: '\A[A-Z][- ]?[A-Z0-9]{6}\z'
      regex_strict: '\A[A-Z][- ]?\d{5}[DABCEFGHJK]\z'
      regex_strict_note: "表 5, verbatim pattern of every row: '第六位是英文字母 X,其他位是阿拉伯数字' — X in D A B C E (纯电动汽车) or F G H J K (非纯电动汽车). 第2号修改单 did not change 表 5."
      powertrain_letter:
        position: 6
        battery_electric: [D, A, B, C, E]
        not_battery_electric: [F, G, H, J, K]
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "<province><office letter> [NEV mark] <5 digits><powertrain letter>"
        printed_example: "京A 12345D"
        printed_example_source: "GA 36-2018 图 8 and Annex B.4"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][- ]?\d{5}[DABCEFGHJK]\z'
    design:
      plate: { w: 480, h: 140, unit: mm, position: front }
      plate_variants:
        - { w: 480, h: 140, unit: mm, position: rear, note: "图 8: same size and character layout; mounting slots 105 mm from each side and 240 mm apart (front: 120 / 210), and a heavier border" }
      count: 2
      background:
        color: "#57B948"
        split: { left: "#FFD500", right: "#57B948", note: "黄绿底 (表 1); Annex B.4 draws the yellow field behind the province character and office letter and the green field behind the serial" }
        finish: retroreflective
        hex_basis: observed
      foreground: "#000000"
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: true, kind: mark, note: "the NEV identifier in the 49 mm gap, as on cn-nev-small-2016" }
      security: "two sine curves (§ 6.5); 1.2 mm embossing (§ 6.7.3)"
      rear_differs: true
      rear_differs_note: "front 图 7 and rear 图 8 differ in mounting-slot positions and border weight only"
      layout: { source: "GA 36-2018 图 7 / 图 8 — character boxes as cn-nev-small-2016 (45 / 43 wide, 90 high, 9 mm gaps, 49 mm mark gap)" }
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 3: 大型新能源汽车号牌 / 480×140 / 黄绿底黑字,黑框线 / 2 / 符合 GA802 规定的中型(含)以上的新能源汽车; 表 5; § 5.3.1 图 7, § 5.3.2 图 8; Annex B.4; accessed 2026-11-26"
      - "https://web.archive.org/web/20161122160811/http://www.mps.gov.cn/n2254098/n4904352/c5550094/content.html  # 公安部交通管理局, 2016-11-21: '大型新能源汽车号牌底色采用黄绿双拼色'; accessed 2026-08-02"
    notes: >-
      The large new-energy vehicle plate. RESOLVED 2026-11-26: the powertrain
      letter is the SIXTH (last) position, one of ten letters (表 5); two plates,
      both 480 x 140 mm (front 图 7, rear 图 8). The file's "dimensions
      deliberately absent" and "position not sourced" are both closed.

