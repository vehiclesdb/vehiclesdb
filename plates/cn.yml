  - id: cn-temporary-travel-1992
    class: temporary
    categories: [car, van, truck, bus, motorcycle, moped, trailer, machine]
    period: { start: 1992 }
    period_evidence: enabling-instrument
    period_note: "GA 36-92 表 1 row 22 临时行驶车 220x140 白底(有蓝色暗纹)黑字黑框线, § 3.22 figure (京 A / A0068 with a '临' character); the design changed in 2007, 2014 and 2023"
    standard_edition: "GA 36-2018 表 1 rows 18-20 as replaced by 第1号修改单; 图 17-18 / 19-22 (修改单); Annex B.18-B.21"
    matching: recall-only
    format:
      pattern: "L99999"
      regex: '\A[A-Z][- ]?[A-Z0-9]{4,5}\z'
      derivation_note: >-
        Five positions on the ordinary plate (图 17, B.18: 京A00001); four plus 试 or
        超 on the test and special-vehicle plates (B.20: 京A0000试). The regex is
        the union over the three classes this series carries, hence recall-only;
        a consumer holding the Han suffix can narrow it (five without, four with).
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: { han: [试, 超], script: Han, role: classification, optional: true }
        printed: "<province><office letter><serial>[试|超] — no separator"
        printed_example: "京A00001"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z](?:[A-Z0-9]{5}|[A-Z0-9]{4}[试超])\z'
    design:
      plate: { w: 220, h: 140, unit: mm }
      count: "2 for a passenger car (front and rear windscreen), 1 for any other vehicle (表 1 row 18)"
      background: { color: "#CFE4F5", finish: paper, hex_basis: observed, named_colour: "GB/T 3181 天(酞)蓝 PB09 — the ordinary plate's ground (§ 6.6.2 c) as amended)" }
      foreground: "#000000"
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: false
      material: "offset paper of 120 g/m² or more (§ 6.1.1.2.2); removable adhesive 8-10 mm along the top and bottom edges, holding at least 360 h on glass (§ 6.16.3)"
      reverse: "the back is printed as the vehicle's temporary licence (图 18)"
    variants:
      - class: temporary
        name: "试验用机动车临时行驶车号牌"
        design: { background: { color: "#E3C08A", finish: paper, hex_basis: observed, named_colour: "GB/T 3181 棕黄 YR06" }, foreground: "#000000" }
        note: >-
          Test vehicles, and since 2023-01-01 intelligent connected vehicles in road
          testing and demonstration (第1号修改单 表 1 row 19). Black 试 after a
          four-position serial. 2 for a passenger car, 1 otherwise.
        sources:
          - "http://web.archive.org/web/20250424051601/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/63c872cf26ac429792ca0787c48c5029.docx  # 第1号修改单 表 1 row 19: 试验用机动车临时行驶车号牌 / 棕黄底纹，黑“试”字，黑字黑框线 / 2 试验用载客汽车、进行道路测试和示范应用的载客智能网联机动车 / 1 …其他; accessed 2026-11-26"
      - class: temporary
        name: "特型机动车临时行驶车号牌"
        design: { background: { color: "#E3C08A", finish: paper, hex_basis: observed, named_colour: "GB/T 3181 棕黄 YR06" }, foreground: "#000000" }
        note: "Over-dimension/over-mass vehicles exceeding GB 1589. Black 超 after a four-position serial. One plate."
        sources:
          - "http://web.archive.org/web/20250424051601/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/63c872cf26ac429792ca0787c48c5029.docx  # 第1号修改单 表 1 row 20: 特型机动车临时行驶车号牌 / 棕黄底纹，黑“超”字，黑字黑框线 / 1; accessed 2026-11-26"
      - class: temporary
        name: "跨行政辖区临时行驶 (cross-jurisdiction) — ENDED 2023-01-01"
        design: { background: { color: "#E3C08A", finish: paper, hex_basis: observed, named_colour: "GB/T 3181 棕黄 YR06" }, foreground: "#000000" }
        note: >-
          GA 36-2007 and GA 36-2018 as first published gave cross-jurisdiction
          movement a brown-yellow plate and within-jurisdiction movement a blue one.
          第1号修改单 deleted the distinction ("十、删除B.19") with effect from
          2023-01-01: every ordinary temporary plate is now blue.
        sources:
          - "http://web.archive.org/web/20250424051601/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/63c872cf26ac429792ca0787c48c5029.docx  # 第1号修改单 一 (表 1 row 18: 普通机动车临时行驶车号牌 / 天（酞）蓝底纹 / 临时上道路行驶的载客汽车 2, 非载客汽车 1), 六 (6.6.2 c) d)), 十 ('删除B.19'); accessed 2026-11-26"
    validity:
      note: >-
        《机动车登记规定》(公安部令第164号) 第四十七条: not more than 30 days for an
        unsold vehicle, a newly acquired unregistered vehicle or a new vehicle for
        export; six months for research and type testing; 90 days for an
        over-dimension special vehicle; 15 days where the plates cannot be made in
        time; at most three issues in the first two cases, one for export; never
        beyond the compulsory insurance; void three days after the metal plates are
        received. 第四十八条: intelligent connected vehicle testing, matching the
        test permit, at most six months.
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 18 (as first published), § 5.4.6 图 17/18, § 6.1.1.2.2, § 6.6.2, § 6.16.3, § 10.2 b), § 13.4, Annex B.18-B.21; accessed 2026-11-26"
      - "http://web.archive.org/web/20250424051601/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/63c872cf26ac429792ca0787c48c5029.docx  # GA 36-2018 第1号修改单 (in force 2023-01-01), items 一 to 十二, read in full; accessed 2026-11-26"
      - "https://www.gov.cn/gongbao/content/2022/content_5682413.htm  # 《机动车登记规定》第四十六条-第四十八条; re-read 2026-11-26"
      - "https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf  # GA 36-92 表 1 row 22 and § 3.22 figure ('临'字); accessed 2026-11-26"
    notes: >-
      The domestic temporary plate. UPDATED 2026-11-26 to the amended 2018
      standard: since 2023-01-01 the standard has three temporary classes (ordinary
      blue; 试 brown; 超 brown) and the cross-jurisdiction brown variant is gone;
      a passenger car gets two plates (front and rear windscreen), other vehicles
      one; the paper is 120 g/m² offset paper, not 125 g card. The 1992 plate was a
      white two-line card carrying 临; the regex is not valid for it.

  - id: cn-temporary-entry-car-1992
    class: temporary
    categories: [car, van, truck, bus]
    period: { start: 2007 }
    period_evidence: instrument-in-force
    period_note: >-
      START CORRECTED 2026-11-26 from 1992 to 2007; the id keeps its 1992 suffix
      because ids are append-only. GA 36-92 表 1 row 20 drew the temporary-entry car
      plate at 300x165 mm, 白底红字黑'临时入境'字红框线(字有金色廓线); GA 36-2007's
      foreword records "修改了临时入境车辆号牌式样" and introduced the 220x140 card
      this series describes. The 1992 plate is not modelled as a series (its serial
      grammar is not drawn in a form this pass could read).
