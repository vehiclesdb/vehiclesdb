  - id: cn-hkmacau-crossborder-2007
    class: standard
    class_note: >-
      港澳入出境车号牌 is a cross-boundary regime for vehicles registered in Hong Kong
      or Macau that enter the mainland; _meta/classes.yml has no term for it, so
      `standard` is used and a `cross-border` term is requested.
    categories: [car, van, truck, bus]
    period: { start: 2007 }
    period_evidence: instrument-in-force
    standard_edition: "GA 36-2018 表 1 row 8; 图 1; Annex A footnote h; Annex B.8"
    matching: strict
    format:
      pattern: "Z9999"
      regex: '\AZ[- ]?[A-Z0-9]{4}\z'
      regex_strict: '\AZ[- ]?(?:\d{4}|[A-HJ-NP-Z]\d{3}|\d[A-HJ-NP-Z]\d{2}|\d{2}[A-HJ-NP-Z]\d|\d{3}[A-HJ-NP-Z]|[A-HJ-NP-Z]{2}\d{2}|[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d|[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]|\d[A-HJ-NP-Z]{2}\d|\d[A-HJ-NP-Z]\d[A-HJ-NP-Z]|\d{2}[A-HJ-NP-Z]{2})\z'
      charset:
        office_letter: [Z]
        notes: "Annex A footnote h, verbatim: '表示广东省公安厅交通管理局车辆管理所核发的港澳入出境车号牌使用的发牌机关代号为“Z”。'"
      width_note: "four positions + 港/澳 (Annex B.8 粤Z·F023港, 粤Z·F023澳)"
      han:
        prefix: { han: 粤, role: province, script: Han, fixed: true }
        suffix: { han: [港, 澳], script: Han, role: classification, note: "港 for a Hong Kong vehicle, 澳 for a Macau vehicle (§ 5.10 f) g))" }
        printed: "粤Z·<4-position serial>港  or  粤Z·<4-position serial>澳"
        printed_example: "粤Z·F023港"
        regex_informational: '\A粤Z[·\- ]?[A-Z0-9]{4}[港澳]\z'
    design:
      plate: { w: 440, h: 140, unit: mm }
      count: 2
      background: { color: "#000000", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      accent: { color: "#FFFFFF", element: "the 港/澳 character", hex_basis: observed, note: "white: 表 1 row 8 reads 黑底白字,白框线 with no red character, unlike the diplomatic plates" }
      border: { color: "#FFFFFF" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: false
      layout: { source: "GA 36-2018 图 1 (as cn-small-car-1992)" }
      note: "production serial on the BACK of the plate (§ 6.3.1), as on the diplomatic plates"
    region_encoding:
      type: fixed
      note: "粤 + Z always; the plate encodes the issuing regime, not a Guangdong place."
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 8: 港澳入出境车号牌 / 440×140 / 黑底白字,白框线 / 港澳地区入出内地的汽车; § 5.1.1 图 1; § 5.10 f) g); Annex A footnote h; Annex B.8; accessed 2026-11-26"
      - "https://web.archive.org/web/20150701102419/http://www.hngy.gov.cn/sitepublish/site1/wsbs/lyfwzl/jtfw/jdc/jdcfw/content_25106.html  # GA 36-2007 前言 (港 and 澳 among the characters added) — the evidence for period.start 2007; accessed 2026-08-02"
    notes: >-
      Hong Kong and Macau vehicles entering the mainland. CHANGED 2026-11-26 from
      recall-only to strict four positions (Annex B.8). GA 36-92 has no such class
      (its 境外汽车 plate, cn-overseas-car-1992, covered vehicles from outside the
      border generally), so 2007 stays the instrument date; the claim that 粤Z
      plates replaced older Guangdong plates in 2001 has no primary and is not
      asserted. Mainland vehicles going the other way are outside GA 36.

  # =========================================================================
  # NEW ENERGY VEHICLES. Pilot 2016 by Ministry announcement; in the standard
  # from GA 36-2018; small-NEV letters extended by 第2号修改单 (2026).
  # =========================================================================

  - id: cn-nev-small-2016
    class: electric
    categories: [car, van]
    period:
      start: 2016
      rollout:
        pilot: "2016-12-01 — 上海、南京、无锡、济南、深圳"
        expansion_1: "2017-11 — plus 河北保定、吉林长春、福建福州、山东青岛、河南郑州、广东中山、广西柳州、重庆、四川成都、云南昆明"
        expansion_2: "by end 2017 — every municipality, provincial capital and autonomous-region capital, plus at least one or two further cities per province"
        national: "first half of 2018 — '全国所有城市全面启用新号牌'"
        standard: "2018-05-01 — GA 36-2018 adds the class (前言: '增加了大型新能源汽车号牌和小型新能源汽车号牌的颜色、数量和适用范围')"
        letters_extended: "2026-02-28 — GA 36-2018 第2号修改单 replaces 表 6"
    period_evidence: enabling-instrument
    standard_edition: "GA 36-2018 表 1 row 5; 表 3; 表 6 as replaced by 第2号修改单; 图 7; Annex B.5"
    matching: strict
    format:
      pattern: "LL99999"
      regex: '\A[A-Z][- ]?[A-Z0-9]{6}\z'
      regex_strict: '\A[A-Z][- ]?[DABCEPQRSTFGHJKLMN][0-9A-HJ-NP-Z]\d{4}\z'
      regex_strict_note: >-
        表 6 as replaced by 第2号修改单, verbatim pattern of every row: "第一位是英文字母
        X，其他位是阿拉伯数字" or "第一位是英文字母 X，第二位是英文字母，其他位是阿拉伯
        数字". First position: D A B C E P Q R S T (纯电动汽车) or F G H J K L M N
        (非纯电动汽车); second position a digit or any letter except O and I (表 3
        rule 5); positions 3-6 digits. Before 2026-02-28 the first letter was one of
        D A B C E / F G H J K only (表 6 as published in 2018); every such serial is
        inside this expression. 表 3's 6-position rule 1 ("每一位都使用阿拉伯数字")
        appears in no row of 表 6, so an all-digit small-NEV serial is not admitted.
      powertrain_letter:
        position: 1
        battery_electric: [D, A, B, C, E, P, Q, R, S, T]
        not_battery_electric: [F, G, H, J, K, L, M, N]
        added_2026: { battery_electric: [P, Q, R, S, T], not_battery_electric: [L, M, N] }
        release_order: "BEV: D, then D+letter, A, A+letter, B, … (表 6 启用顺序 1-20); non-BEV: F, F+letter, G, … N+letter (1-16)"
      charset:
        serial_positions: 6
        serial_letters_excluded: [I, O]
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "<province><office letter> [NEV mark] <6-position serial>"
        printed_example: "京A D12345"
        printed_example_source: "GA 36-2018 图 7 and Annex B.5"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][- ]?[DABCEPQRSTFGHJKLMN][0-9A-HJ-NP-Z]\d{4}\z'
    design:
      plate: { w: 480, h: 140, unit: mm }
      count: 2
      background:
        color: "#A9D8A0"
        gradient: { from: "#F5FAF2", to: "#57B948", direction: "top (pale) to bottom (green), as drawn in Annex B.5", note: "渐变绿 — named, not numbered" }
        finish: retroreflective
        hex_basis: observed
      foreground: "#000000"
      border: { color: "#000000", note: "黑框线" }
      band: { side: none }
      emblem: { present: true, kind: mark, note: "the NEV identifier (新能源汽车号牌专用标识) pre-printed inside the reflective film (§ 6.1.2), in the 49 mm gap between the office letter and the serial (图 7, Annex B.5)" }
      security: "two laser-etched sine curves (§ 6.5, 图 32); characters, separator gap and rib raised at least 1.2 mm (§ 6.7.3)"
      rear_differs: false
      layout:
        source: "GA 36-2018 图 7 (单位为毫米)"
        characters: { province: { w: 45 }, office_letter: { w: 43 }, serial: { count: 6, w: 43, gap: 9 }, h: 90 }
        gaps: "9 between province and letter; 49 between letter and serial (no dot — the NEV mark sits there)"
        margins: { left: 15.5, top: 25, bottom: 25 }
        corner_radius: 10
        mounting: "four slots, 120 mm from each side and 210 mm apart, centres 12.5 mm from the edges"
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 5: 小型新能源汽车号牌 / 480×140 / 渐变绿底黑字,黑框线 / 2 / 符合 GA802 规定的中型以下的新能源汽车; 表 3 (6 位); § 5.9.3; 表 6; § 5.3.1 图 7; §§ 6.1.2, 6.5, 6.6.1 e) g), 6.7.3; Annex B.5; accessed 2026-11-26"
      - "http://www.gzparking.com/webfile/upload/2026/04-29/11-14-4404851036837864.pdf  # GA 36-2018 第2号修改单 (non-government republication): '一、将表 6 修改为' — the twenty BEV rows (D A B C E P Q R S T, each alone or with a second letter) and sixteen non-BEV rows (F G H J K L M N); 批准发布并实施 2026-02-28; accessed 2026-11-26"
      - "https://web.archive.org/web/20161122160811/http://www.mps.gov.cn/n2254098/n4904352/c5550094/content.html  # 公安部交通管理局, 2016-11-21: the 2016-12-01 pilot in 上海、南京、无锡、济南、深圳; '新能源汽车号牌号码由5位升为6位'; '字母“D”代表纯电动汽车，字母“F”代表非纯电动汽车'; accessed 2026-08-02"
      - "https://web.archive.org/web/20181024152732/http://www.mps.gov.cn/n2253534/n2253535/n2253537/c5757013/content.html  # 公安部交通管理局, 2017-08-13: the rollout ladder in period.rollout, including '2018年上半年，全国所有城市全面启用新号牌'; accessed 2026-08-02"
    notes: >-
      The small new-energy vehicle plate. RESOLVED 2026-11-26, the file's named
      top verifier target: the powertrain letter IS the first serial position on
      the small plate (表 6) and the LAST on the large one (表 5), and it is not
      just D or F: 2018 assigned five letters to each powertrain, and 第2号修改单
      (2026-02-28) added P Q R S T and L M N. The plate is 480 x 140 mm (表 1,
      图 7), previously withheld as unsourced. Two per vehicle. regex_strict now
      encodes the position rule. The 2016 announcement's "D = 纯电动, F = 非纯电动"
      was the pilot-stage statement and is superseded, not contradicted.

