      approved: "2026-02-28"
      in_force: "2026-02-28"
      notice: "公安行标公告〔2026〕2号"
      summary: "表 6 (small NEV serial) replaced: BEV letters D A B C E plus P Q R S T; non-BEV letters F G H J K plus L M N. Annex A: 冀X 雄安新区; 苏州 E U; 杭州 A M; 宁波 B N; 济南 A S; 临沂 Q W; 莱芜 S deleted; 郑州 A V; 武汉 A W; 西安 A U; 西咸新区 U; the Shandong provincial office's W deleted"
