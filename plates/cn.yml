    - { code: "GA 36-2018", issued: "2018-04-20", in_force: "2018-05-01", replaces: "GA 36-2014", status: 现行 }
  lineage_source: "https://ywtb.mps.gov.cn/gabzh/portal/xxcx/std?key=GA%2036  # the Ministry's portal lists GA 36-2018 (2018-04-20~2018-05-01 现行) and GA 36-2014 (2014-01-24~2014-01-24 废止); GA 36-2018 前言 lists the earlier editions 'GA36—1992; GA36—2007; GA36—2014'; accessed 2026-11-26"
  enabling_rule:
    citation: "《机动车登记规定》, 公安部令第164号 — 2021年12月4日第8次部务会议审议通过, 施行 2022-05-01 (第九十三条: replaces 公安部令第102号 and 第124号)"
    relevant_articles: "第十三条 (tractor and trailer separately registered and plated), 第四十三条 (number selection), 第四十四条-第四十五条 (retaining a number), 第四十六条-第四十八条 (临时行驶车号牌), 第四十九条 (临时入境机动车号牌), 第五十条 (uniform national plate management system), 第八十五条 (the MPS sets the form of the plate)"
    source: "https://www.gov.cn/gongbao/content/2022/content_5682413.htm  # State Council Gazette 2022 No. 9, full text; re-read 2026-11-26"
  scope_limit: >-
    GA 36-2018 § 1, verbatim: "本标准适用于公安机关交通管理部门核发的机动车号牌的制作、
    检验、核发和监督管理。" Plates the public-security traffic authorities do not
    issue are outside it — in particular MILITARY plates (the People's Liberation
    Army's own vehicle registration) and ARMED POLICE plates, which are governed by
    the armed forces' own rules. Neither system's rules were located in a public
    text in this pass, so neither is modelled; the only primary touching them is
    国办发〔2018〕114号 (fire-and-rescue vehicles moving from military to 应急
    plates), quoted on the emergency series.
  related:
    - "GA 666 《机动车号牌用反光膜》 — GA 36-2018 §§ 6.8 and 6.9.2 send retroreflection and every ground/character colour to it; its text was not located in this pass"
