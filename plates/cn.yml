# plates/cn.yml — People's Republic of China (mainland), PRD-PLATES gate L3.
#
# VERIFIED 2026-11-26 (PRD-PLATES § 5.3). The first wave of this file (written
# 2026-08-02) could read only the superseded GA 36-2007 and said so on every
# claim. The verification pass found and read the CURRENT edition in full, plus
# its two amendments and the 1992 and 2014 editions, and re-derived every series
# from them. Every change, with the old value, the new value and the clause that
# settles it, is listed in the verification dossier and the pull request that
# applied it. Hong Kong (hk.yml), Macau (mo.yml) and Taiwan are separate
# registration systems and separate jurisdictions in this dataset; only the
# MAINLAND-issued cross-boundary plate for Hong Kong and Macau vehicles is here.
#
# ============================================================================
# 1. THE INSTRUMENTS, AND HOW EACH WAS READ
# ============================================================================
# Chinese plates are defined by ONE mandatory public-security industry standard,
# GA 36 《中华人民共和国机动车号牌》, under the rule-level delegation in
# 《机动车登记规定》(公安部令第164号) 第八十五条: "机动车登记证书、号牌、行驶证、
# 检验合格标志的式样由公安部统一制定并监制。" Its editions:
#
#   GA 36-92    批准 1992-04-25, 实施 1992-07-01 (read from the scanned
#               edition's own first page). Created the "92 pattern" still issued.
#   GA 36-2007  发布 2007-09-28, 实施 2007-11-01.
#   GA 36-2014  发布/实施 2014-01-24.
#   GA 36-2018  发布 2018-04-20, 实施 2018-05-01 — IN FORCE (公安标准化信息服务
#               平台: 状态 现行), as amended by:
#     第1号修改单  批准发布 2022-07-29, 实施 2023-01-01 (temporary plates split
#                 into three classes; the cross-jurisdiction brown variant ends)
#     第2号修改单  批准发布 2026-02-28, 实施 2026-02-28, 公安行标公告〔2026〕2号
#                 (new small-NEV letters; twelve Annex A changes)
#
# HOW EACH WAS READ — stated per instrument, because the official portals do not
# serve the text:
#   * GA 36-2018: READ IN FULL, all 60 pages, text layer plus every figure read
#     as an image, from the copy on Wikimedia Commons (File:GA_36-2018.pdf,
#     uploaded 2023-08-31, credited "一带一路共建国家标准信息平台", published
#     edition of 中国标准出版社; sha1 7ee996fb3eee0a1db3eae8ec93261d7dd33abd54).
#     The ministry's own standards portal lists the standard and its metadata but
#     its full-text button answers "该标准暂不提供文本阅读"; hbba.sacinfo.org.cn
#     answers "您所查询的标准在本系统尚未公开". Neither was a reachable text.
#   * 第1号修改单: READ IN FULL — the Ministry's own notice (公安部交通管理局,
#     2022-09-27) and the amendment text with its figures, as attachments
#     republished by 邵阳市公安局交警支队 (a municipal police site, Hunan), read
#     from the Internet Archive because the live site answered HTTP 502.
#   * 第2号修改单: READ IN FULL (two pages) — but ONLY through a republished PDF
#     on www.gzparking.com (a Guangzhou parking operator), the weakest republisher
#     in this file; its date and notice number are corroborated by a standards
#     index (xinbiaocha.com). No government copy was found. Every fact taken from
#     it says so.
#   * GA 36-92: read in part, as page images (a 35-page scan with no text layer,
#     Commons File:GA_36-1992.pdf): 表 1, the 式样 figures, 表 2, 表 3 and § 3.24.
#   * GA 36-2014 and GA 36-2007: text layers searched for their forewords, serial
#     rules and Annex A (Commons File:GA_36-2014.pdf, File:GA_36-2007.pdf); the
#     2007 text was also read in full in the first wave from the 巩义市人民政府
#     republication.
#
# ============================================================================
# 2. THE HAN LINE — where the dataset's serial alphabet stops (PRD-PLATES §2.6)
# ============================================================================
# GA 36-2018 § 3.2, verbatim: "机动车登记编号包含:用汉字表示的省、自治区、直辖市
# 简称、用英文字母表示的发牌机关代号、由阿拉伯数字和英文字母组成的序号以及用汉字
# 表示的专用号牌简称。" — four elements, two of them Han. The dataset's serial
# alphabet is A-Z and 0-9, so this file never puts a Han character into a
# pattern or a regex. format.pattern / format.regex cover the LATIN+DIGIT
# remainder (office letter + serial, or the mission number + serial on
# diplomatic plates); format.han carries the Han elements as structured data with
# an INFORMATIONAL Han-aware regex that is outside the § 2.6 contract and not
# lint-validated. A consumer validating "京A·F0236" splits the leading Han
# character (plates/_decode/cn-provinces.yml), splits a trailing classification
# character if present (common.classification_han), and matches "AF0236".
#
# THE SEPARATOR. GA 36-2018 § 5.11, verbatim: "间隔符对机动车登记编号进行有效分割。
# 间隔符与序号同样冲压,颜色与序号相同。" (2007 said "可以…同样冲压并着色"; 2018
# made it mandatory.) It is a raised dot, 10 mm wide on the 440 mm plates. It is
# NOT always in the same place: after the office letter on civil plates (京A·F0236),
# after the PROVINCE character on police plates (京·A0006警, and a DASH on the
# police rear plate, 图 5 / B.10 b)), between mission number and serial on
# diplomatic plates (224·578使), and ABSENT on new-energy plates, whose 49 mm gap
# carries the NEV mark instead (图 7/8). U+00B7 is in _meta/separators.yml's
# forgiving set, not its emitted set, so the regexes accept an optional emitted
# separator `[- ]?` where the plate prints one between Latin elements.
#
# ============================================================================
# 3. THE SERIAL GRAMMAR (GA 36-2018 § 5.9, 表 3 to 表 6)
# ============================================================================
# 表 3 "序号位数和适用号牌类型" fixes FOUR serial widths:
#   2 位  领馆汽车/摩托车号牌: all digits, or digit + letter; no O, no I
#   3 位  使馆汽车/摩托车号牌: every position a digit
#   4 位或 5 位  every other metal and paper class: all digits, one letter, or two
#         letters; no O, no I
#   6 位  大型/小型新能源汽车号牌: positions fixed by 表 5 / 表 6
# 表 4 (4/5 positions) lists sixteen letter-position combinations, released in
# order once the previous is 60% used (§ 5.9.2 a)). Sixteen is every way of
# placing at most two letters in five positions, and its four-position column is
# every way of placing at most two in four — so the current rule is exactly "at
# most two letters, anywhere, never O or I". GA 36-2007 had eleven combinations;
# GA 36-2014's foreword records "增加了 5 种序号中字母和数字的组合方式". GA 36-92
# § 3.24 allowed a letter only in the FIRST position ("注册编号满额后前一位用字母"),
# A-Z without I and O (its 表 3 lists 24 letters).
# WHICH WIDTH a class uses is not in 表 3 ("4 位或 5 位") — it is in the
# normative 式样 figures of chapter 5 and the informative effect drawings of
# Annex B: five positions on the ordinary, low-speed, motorcycle and temporary
# plates; four where a classification character takes the fifth cell (挂, 学, 警,
# 港/澳, 试, 超). Each series cites its figure.
# Recycled numbers: § 5.9.2 b) / 5.9.3 b) "其机动车登记编号 12 个月后应重新启用"
# (2007 and 2014: "6 个月后可重新使用").
#
# THE I/O ASYMMETRY. O and I are excluded from the SERIAL only. The office letter
# uses the full alphabet: the four municipalities' Annex A rows print all 26
# letters, and "O" is the national police-fleet code (Annex A footnote g).
jurisdiction: cn
authority:
  name: 公安部交通管理局 (Traffic Management Bureau, Ministry of Public Security)
  url: "https://www.mps.gov.cn/"
  url_status: >-
    www.mps.gov.cn returned HTTP 521 from this workstation on 2026-08-02. On
    2026-11-26 the Ministry's standards portal ywtb.mps.gov.cn/gabzh WAS
    reachable and is cited for the standard's status; it does not serve the text.
binding: vehicle
binding_note: >-
  GA 36-2018 § 3.1 defines 机动车号牌 as "准予机动车在中华人民共和国境内道路上行驶的
  法定标志,其号码是机动车登记编号". 《机动车登记规定》(公安部令第164号) 第四十四条 lets
  a former owner re-apply for the old number within two years if they held the
  vehicle and used the number for at least a year; 第四十五条 extends it to a
  spouse after a year of marriage. 第四十三条: the number is chosen "通过计算机随机
  选取或者按照选号规则自行编排的方式", through a single national selection system
  ("使用统一的机动车号牌选号系统发放号牌号码,号牌号码公开向社会发放").

instrument:
  standard:
    citation: "GA 36-2018 《中华人民共和国机动车号牌》 (公共安全行业标准; 前言: '本标准全部技术内容均为强制性')"
    issued: "2018-04-20"
    in_force: "2018-05-01"
    replaces: "GA 36-2014"
    status: 现行
    ccs: R82
    ics: "43.040.60"
    plan_number: "201650124"
    technical_committee: "公安部道路交通管理标准化技术委员会 (the standard's own 前言); the Ministry's portal lists 技术归口 as 全国道路交通管理标准化技术委员会 — both recorded, not reconciled"
    drafting_units: "负责起草 公安部交通管理科学研究所; 参加起草 公安部交通安全产品质量监督检测中心、常州华日升反光材料股份有限公司"
    text_status: >-
      READ IN FULL from the Wikimedia Commons copy (60 pages, text layer and
      figures). The Ministry's portal answers "该标准暂不提供文本阅读" and the
      national filing system "尚未公开", so the Commons copy is a republication,
      named as such on every citation.
    source: "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 full text as republished on Wikimedia Commons (File:GA_36-2018.pdf, uploaded 2023-08-31, source credited '一带一路共建国家标准信息平台'); accessed 2026-11-26"
    status_source: "https://ywtb.mps.gov.cn/gabzh/portal/stdDetail/315218  # 公安标准化信息服务平台 (the Ministry's standards portal): GA 36-2018, 现行, 发布 2018-04-20, 实施 2018-05-01, 代替 GA 36-2014, 计划号 201650124; full-text button: '该标准暂不提供文本阅读'; accessed 2026-11-26"
  amendments:
