      approved: "2022-07-29"
      in_force: "2023-01-01"
      summary: "表 1 rewritten: the temporary-travel plate becomes three classes (普通机动车 / 试验用机动车 / 特型机动车临时行驶车号牌); the cross-jurisdiction brown variant is removed; intelligent connected test vehicles join the 试 plate; diplomatic scope reworded; 10.2 c) temporary plate void three days after the metal plates arrive"
      read: "in full, text and figures"
      source: "http://web.archive.org/web/20250424051601/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/63c872cf26ac429792ca0787c48c5029.docx  # amendment text, republished by 邵阳市公安局交警支队 as the attachment to 湖南省公安厅's notice; live site HTTP 502 on 2026-11-26, read from the Internet Archive; accessed 2026-11-26"
      notice_source: "http://web.archive.org/web/20250424051014/http://jjzd.shaoyang.gov.cn/syjjzd/wjjd/202302/34518ad409114b38add936270698e843/files/980bb2a6655d49aaad4e83b1a9cc9f73.doc  # 公安部交通管理局 notice of 2022-09-27: '2022年7月29日，公安部技术监督委员会批准发布了《中华人民共和国机动车号牌》（GA36-2018）第1号修改单，自2023年1月1日起实施'; accessed 2026-11-26"
