      corroboration: "https://www.xinbiaocha.com/index/tiaomuview/id/630088  # standards index: 中华人民共和国机动车号牌(第2号修改单), 发布/实施 2026-02-28, 代替 GA 36-2018+第1号修改单, 发文字号 公安行标公告[2026]2号, 发布机构 公安部; metadata only; accessed 2026-11-26"
  lineage:
    - { code: "GA 36-92", approved: "1992-04-25", in_force: "1992-07-01", status: 废止, note: "the 92 pattern's creating edition; read as page images from Commons File:GA_36-1992.pdf (https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf) — dates from its first page: '中华人民共和国公安部1992-04-25批准 1992-07-01实施'" }
    - { code: "GA 36-2007", issued: "2007-09-28", in_force: "2007-11-01", replaces: "GA 36-1992", status: 废止 }
