  - id: cn-emergency-rescue-car-2018
    class: government
    class_note: >-
      The national comprehensive fire-and-rescue force is a civil state service
      (it left the armed police in 2018), so `government` is used.
    categories: [car, van, truck, bus]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A(?:[A-Z]\d{4}|\d{5})\z'
      regex_strict: '\A(?:[XS]\d{4}|\d{5})\z'
      charset:
        force_codes: { X: 消防救援 (fire and rescue), S: 森林消防 (forest fire) }
        no_letter_form: "five digits and no force letter: a vehicle of the Ministry of Emergency Management itself"
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: { han: 应急, script: Han, pinyin: "yìngjí", role: classification, colour: red }
        printed: "<province>·<force letter><4 digits>应急  or  <province>·<5 digits>应急"
        printed_example: "京·X2345应急"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][·\- ]?(?:[XS]\d{4}|\d{5})应急\z'
        total_characters: 8
    design:
      plate: { w: 480, h: 140, unit: mm }
      count: 2
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      accent: { color: "#D7000F", element: "the 应急 pair, and on the FRONT plate the force letter", hex_basis: observed }
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: true
      rear_differs_note: "Verbatim: '汽车号牌分为前牌和后牌，前牌的所属救援队伍代号为红色，后牌的所属救援队伍代号为黑色。'"
    region_encoding:
      type: province-only
      decode: "plates/_decode/cn-provinces.yml"
      note: "No issuing-office letter: the second position is the force code."
    sources:
      - "https://www.gov.cn/zhengce/zhengceku/2018-12/11/content_5347765.htm  # 国办发〔2018〕114号 (发布 2018-12-11): '专用号牌分为汽车号牌和摩托车号牌两种。汽车号牌每副两只，分别悬挂在车辆前后部…专用号牌为白底黑字，配以红色汉字“应急”'; 附件 一（一）'字符共8位…所属救援队伍代号用X代表消防救援、S代表森林消防。应急部的专用号牌不用英文字母…如“京·12345应急”表示车辆归属应急部，“京·X2345应急”表示车辆归属北京市应急管理部门'; 附件 二 '汽车号牌规格为480毫米×140毫米'; 附件 三; re-read and verified 2026-11-26"
    notes: >-
      The emergency-rescue car plate. VERIFIED 2026-11-26 against the notice: every
      quoted clause matches. It is not in GA 36-2018, which predates it by seven
      months, nor in either amendment.

  - id: cn-emergency-rescue-motorcycle-2018
    class: government
    categories: [motorcycle]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "999L"
