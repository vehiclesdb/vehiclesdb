      width_note: "five positions on the bottom line of 图 9 (specimen 京·A / A0062)"
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "<province>·<office letter> over <5-position serial>"
        printed_example: "京·A A0062"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][·\- ]?[A-Z][·\- ]?[A-Z0-9]{5}\z'
    design:
