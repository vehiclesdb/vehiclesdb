      regex: '\A[A-Z][- ]?[A-Z0-9]{5}\z'
      regex_strict: '\A[A-Z][- ]?(?:\d{5}|[A-HJ-NP-Z]\d{4}|\d[A-HJ-NP-Z]\d{3}|\d{2}[A-HJ-NP-Z]\d{2}|\d{3}[A-HJ-NP-Z]\d|\d{4}[A-HJ-NP-Z]|[A-HJ-NP-Z]{2}\d{3}|[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d{2}|[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]\d|[A-HJ-NP-Z]\d{3}[A-HJ-NP-Z]|\d[A-HJ-NP-Z]{2}\d{2}|\d[A-HJ-NP-Z]\d[A-HJ-NP-Z]\d|\d[A-HJ-NP-Z]\d{2}[A-HJ-NP-Z]|\d{2}[A-HJ-NP-Z]{2}\d|\d{2}[A-HJ-NP-Z]\d[A-HJ-NP-Z]|\d{3}[A-HJ-NP-Z]{2})\z'
      width_note: "five positions, no separator (图 13 桂A35345, 图 15 京A00000)"
      han:
        prefix: { role: province, script: Han, decode: "plates/_decode/cn-provinces.yml" }
        suffix: none
        printed: "临时入境 heading, then <province><office letter><5-position serial>, with validity and permitted area or route printed on the card"
        printed_example: "桂A35345"
        regex_informational: '\A[京津冀晋蒙辽吉黑沪苏浙皖闽赣鲁豫鄂湘粤桂琼渝川贵云藏陕甘青宁新][A-Z][A-Z0-9]{5}\z'
    design:
      plate: { w: 220, h: 140, unit: mm }
      count: 1
      background: { color: "#CFE4F5", finish: paper, hex_basis: observed, named_colour: "GB/T 3181 天(酞)蓝 PB09 for travel within an area (§ 6.6.2 a)); 棕黄 YR06 for travel across areas (§ 6.6.2 b))" }
      foreground: "#000000"
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: false }
      rear_differs: false
      material: "200-220 g/m² watermarked paper, laminated (§ 6.1.1.2.1); the back is the temporary-entry vehicle licence (图 14, 图 16); placed inside the windscreen on the right (§ 10.2 a))"
    validity:
      note: >-
        《临时入境机动车和驾驶人管理规定》(公安部令第90号) 第五条: "临时入境机动车号牌为
        纸质号牌，载明允许行驶的区域、线路和有效期。" 第六条: validity matches the entry
        approval, at most three months, not extendable. 第七条: car plate inside the
        windscreen on the right; motorcycle plate carried. 第二十二条: printed centrally
        by the Ministry.
    region_encoding:
      type: province-and-office
      decode: ["plates/_decode/cn-provinces.yml", "plates/_decode/cn-issuing-offices.yml"]
      note: "issued at the point of entry or departure (公安部令第90号 第三条)"
    sources:
      - "https://upload.wikimedia.org/wikipedia/commons/0/00/GA_36-2018.pdf  # GA 36-2018 表 1 row 19: 临时入境汽车号牌 / 220×140 / 白底棕蓝色专用底纹,黑字黑边框 / 1 / 临时入境汽车; § 5.4.5 图 13-16; §§ 6.1.1.2.1, 6.2.2 (micro-text 'LSXSC' on the back), 6.6.2 a) b), 10.2 a); accessed 2026-11-26"
      - "http://www.gov.cn/gongbao/content/2007/content_772748.htm  # 《临时入境机动车和驾驶人管理规定》 (公安部令第90号, 施行 2007-01-01): 第三条, 第五条, 第六条, 第七条, 第二十一条, 第二十二条; re-read 2026-11-26"
      - "https://upload.wikimedia.org/wikipedia/commons/7/76/GA_36-1992.pdf  # GA 36-92 表 1 row 20: 临时入境汽车 300×165 — the different 1992 plate; accessed 2026-11-26"
    notes: >-
      The temporary-entry card for a foreign-registered car. CORRECTED 2026-11-26:
      period.start 2007 (the 220x140 card dates from GA 36-2007; the 1992 plate was
      300x165), five-position serial pinned from 图 13/15, series now strict. Hong
      Kong, Macau and Taiwan vehicles on organised trips are handled by reference to
      this rule (第二十一条) — a different regime from cn-hkmacau-crossborder-2007.

