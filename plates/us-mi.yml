    notes: >-
      THE MICHIGAN SPECIALTY PROGRAM INDEX — one entry for the whole programme per
      PRD-PLATES §2.5, with the official count declared a gap and a secondary
      figure carried, flagged, alongside. The durable finding is the mechanism:
      Michigan gates specialty plates through the LEGISLATURE, Illinois through a
      2,000-application petition, Wisconsin through 500 signatures, Ohio through
      individual authorising statutes, and Indiana through a dedicated code
      article. Whatever the catalogue counts turn out to be, those five
      mechanisms are the structural fact — and they predict the churn rate of
      each state's catalogue better than any snapshot count could.
