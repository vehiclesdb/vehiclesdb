# plates/au-sa.yml — South Australia (PRD-PLATES gate L3, Australia).
#
# SOUTH AUSTRALIA IS THE JURISDICTION WHERE THE BEST SOURCE IS TWENTY-TWO
# YEARS OLD. The current Department for Infrastructure and Transport pages,
# read in full on 2026-08-02, describe how to order, replace, renew and DISPLAY
# a plate and never once say what a South Australian general-issue plate looks
# like. The one government page that does is the ARCHIVED Transport SA page
# "Alpha-numeric plates (general issue)", captured 6 December 2004, which
# states the colours and the slogan of the general issue in the department's
# own words. It is quoted below and dated honestly: what it evidences is the
# 2004 state of the general issue, not today's.
#
# THE OTHER SOUTH AUSTRALIAN PECULIARITY, and it is a good one: the State's
# personalised-plate operation runs on a GOVERNMENT DOMAIN — ezyplates.sa.gov.au
# — which makes the one published South Australian serial constraint in this
# file ("a combination of 1 to 7 characters") an authority statement rather
# than a vendor's marketing. Compare Queensland, where the regulation itself
# names a commercial domain (see plates/au-qld.yml, reg 2021 s 132(7)).
#
# SOURCING GAP STATED UP FRONT: legislation.sa.gov.au sits behind a Cloudflare
# managed challenge that returns HTTP 403 to every non-browser client, and the
# Internet Archive holds no snapshot of the Motor Vehicles Regulations' view
# URL. NO SOUTH AUSTRALIAN INSTRUMENT IS QUOTED IN THIS FILE. The display rules
# below come from the department's own public page, which is a primary
# authority publication (PRD-PLATES §4) but is not the instrument.
#
# LICENCE NOTE, recorded because it is unusually clean: SA.GOV.AU states on
# every page, verbatim, "SA.GOV.AU is licensed under a Creative Commons
# Attribution 4.0 Licence." A CC BY 4.0 government source is directly
# compatible with this dataset's own licence — the only such statement found
# in the Australian wave.
jurisdiction: au-sa
authority:
  name: Department for Infrastructure and Transport (South Australia)
  url: "https://www.sa.gov.au/topics/driving-and-transport/registration/number-plates-and-trade-plates"
binding: vehicle
binding_note: >-
  The plate binds to the vehicle; the special/personalised COMBINATION binds to
  an agreement holder. Transport SA, 2004, verbatim: "The plate may be
  transferred to another vehicle registered in the same name as the agreement
  holder, for an additional fee and at the discretion of the Registar [sic].
  This agreement ceases if the vehicle owner sells the vehicles while the place
  [sic] is allocated to that vehicle." The department's current pages still run
  on the same idea — there is a "Renew number plate agreement" transaction.
instrument:
  citation: "Motor Vehicles Act 1959 (SA) and the Motor Vehicles Regulations 2010 (SA)"
  access_note: >-
    NOT READ IN THIS PASS. legislation.sa.gov.au returns HTTP 403 to every
    non-browser client (Cloudflare managed challenge); direct fetch with full
    browser header sets and an Internet Archive lookup both failed on
    2026-08-02. NOT ONE WORD of South Australian legislation is quoted here,
    and the display rules below are the department's restatement, not the
    instrument. The verifier with a browser should read the Motor Vehicles
    Regulations 2010 and re-audit this file — together with the NSW file, this
    is the largest sourcing gap in the Australian wave.
  licence: "SA.GOV.AU pages carry, verbatim: 'SA.GOV.AU is licensed under a Creative Commons Attribution 4.0 Licence.' — CC BY 4.0, directly compatible with this dataset"

national_schemes:
  heavy_vehicle: >-
    Heavy vehicles over 4.5 t GVM are registered under the Heavy Vehicle
    National Law as applied in South Australia and carry a NATIONAL HEAVY
    VEHICLE NUMBER PLATE issued by the State registrar on the national pattern.
    Mechanism, not a series: the national serial grammar was not obtained
    (recorded gap, L4). Three State instruments name the object in those words
    — Qld reg 2021 s 117(2)(c), Tas reg 2021 reg 88(6), NT Motor Vehicles
    Regulations 1977 reg 10.
  light_vehicle_standards: >-
    Australian Light Vehicle Standards Rules 2015 (national MODEL law,
    Parliamentary Counsel's Committee, consolidated 22 March 2019) rule 86,
    verbatim: "At least 1 number plate light must be fitted to the rear of a
    vehicle." The Rules "do not, by themselves, have any legal effect" and
    prescribe no plate dimension, colour or serial grammar.
  ev_labels: "South Australia requires an approved safety label on electric, hybrid and hydrogen vehicles — the ALVSR Part 12 labelling family, fixed to the plate rather than a plate series. The department states it as a display rule (below)"
  source: "https://www.pcc.gov.au/uniform/Australian%20Light%20Vehicle%20Standards%20Rules%202015%20-%2022%20March%202019.pdf  # ALVSR 2015 rule 86 and the model-law disclaimer, accessed 2026-08-02"

display_rules:
  integrity: "the department, verbatim: 'Number plates must show your registration number correctly. You cannot rearrange letters or numbers, or alter them so that they're hard to read.'"
  plates_per_vehicle: "verbatim: plates must 'be displayed at the front and rear of the vehicle (unless it's a motorbike, trailer, caravan or special-purpose vehicle which only requires one number plate displayed at the rear)'"
  visibility: "verbatim: plates must 'be clearly visible from the front and rear of the vehicle, so they can be read up to 20 metres away' and 'not be obscured by anything, including a tow ball, plastic cover, dirt buildup or any part of the vehicle's bodywork'"
  lighting: "verbatim: 'at night, have the number plate on the rear of the vehicle lit with a white light, so it can be read from 20 metres away'"
  ev_label: "verbatim: 'display an approved safety label if you drive an electric, hybrid or hydrogen powered vehicle'"
  bike_rack: "verbatim: 'You must not display a standard number plate on both the rear of the vehicle and on a bicycle rack, or use homemade number plates.' Either a bicycle-rack plate goes on the rack, or the rear plate is moved to it — never both"
  sources:
    - "https://www.sa.gov.au/topics/driving-and-transport/registration/number-plates-and-trade-plates/displaying-number-plates  # SA.GOV.AU 'Displaying number plates', Department for Infrastructure and Transport, page last updated 8 May 2025 (read via the Internet Archive snapshot of 2025-08-05; the live host 403s to non-browser clients), accessed 2026-08-02"

series:

  # =========================================================================
  # CURRENT GENERAL ISSUE.
  # =========================================================================
  - id: au-sa-standard
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2008 }        # SECONDARY, AND CONTESTED — the locator
                                   # says 2008, an independent enthusiast
                                   # reference says 2009. Both recorded, not
                                   # averaged (PRD-PLATES §5.3).
    period_evidence: secondary-locator-unverified
    matching: strict
    format:
      pattern: "L999 LLL"
      regex: '\A[A-Z]\d{3} ?[A-Z]{3}\z'
      regex_strict: '\AS\d{3} ?[A-Z]{3}\z'
      evidence: secondary
      charset:
        notes: >-
          Seven characters: a leading letter, three numerals, three letters,
          printed as two groups. THE LEADING LETTER IS REPORTED TO BE A CONSTANT
          'S' — for South Australia — across the whole series, which is why the
          strict twin fixes it while `regex` leaves it a letter class. That
          split is deliberate and is the §2.7 tier order doing its job: if the
          'S' is really constant, `regex_strict` is the sourced grammar; if the
          series later advances past S (as Tasmania's leading letter does, see
          plates/au-tas.yml), `regex` still matches and nothing breaks. NO
          DEPARTMENTAL SOURCE STATES EITHER FORM — this is the locator's shape,
          flagged, and `format.evidence: secondary` says so.
      progression: "ascending through the three-letter suffix behind a fixed numeric block; no departmental progression statement exists"
    design:
      colour_note: >-
        Black characters on a reflective white ground. THE SOURCE IS TWENTY-TWO
        YEARS OLD AND IS QUOTED AS SUCH — Transport SA, "Alpha-numeric plates
        (general issue)", captured 6 December 2004, verbatim: "General issue
        alpha-numeric plates have black characters on a reflective white
        background / the slogan SA - The Festival State. The reflective
        background makes the plates more visible at night." The colours have
        carried forward on the evidence available; THE SLOGAN HAS NOT — "The
        Festival State" is a former slogan and the current bottom legend is not
        recorded here because no current departmental page states it (recorded
        gap). No hexes: the department has never published values.
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      plate: { w: 372, h: 134, unit: mm }
      plate_dimension_note: "the cross-State Australian passenger size sourced in plates/au-wa.yml (WA DoT: 372 x 134 mm) and plates/au-nt.yml (NT MVR: 372 x 133 mm); the SA department publishes no millimetres (recorded gap)"
      rear_differs: false
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20041206044325/http://www.transport.sa.gov.au/registrations/number_plates/alpha.asp  # Transport SA 'Alpha-numeric plates (general issue)', captured 6 December 2004 (accessed 2026-08-02): black characters on a reflective white background, the then slogan 'SA - The Festival State', the once-only fee and the transfer/agreement rule. The ONLY South Australian government page found that describes the general issue at all"
      - "http://www.plateshack.com/y2k/South_Australia/southaustralia.htm  # enthusiast reference (PRD-PLATES §4 corroboration class), accessed 2026-08-02: a photo-dated plate captioned 'Current since 2009, South Australia license plate (June 2013)' and another captioned 'South Australia special graphics plate used up until 2008'. Corroborates a changeover in the 2008-2009 window and DISAGREES with the locator on the year"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_South_Australia  # LOCATOR ONLY (PRD-PLATES §4), accessed 2026-08-02: the S-prefixed seven-character arrangement and a 2008 changeover. Uncited in the article; used as a finding aid and flagged"
    notes: >-
      SOUTH AUSTRALIA'S CURRENT GENERAL ISSUE, WITH ITS START YEAR IN DISPUTE
      AND THE DISPUTE RECORDED RATHER THAN SPLIT. The locator says the previous
      series ran to 2008; an independent enthusiast reference captions a
      photo-dated plate "Current since 2009". PRD-PLATES §5.3 forbids averaging
      disagreements, so the value carried is the locator's 2008 and this note
      states the competing 2009 claim in terms. Either way the changeover sits
      in a two-year window and neither source is the department. THE FORMAT IS
      EQUALLY SECONDARY: no South Australian government page — current or
      archived — states the general-issue combination, which is why
      `format.evidence: secondary` sits beside a `regex_strict` that is a
      HYPOTHESIS about the constant 'S' rather than a sourced alphabet. THE ID
      IS UNDATED, for the us-fl-standard reason. What a verifier should chase,
      in order: the Motor Vehicles Regulations 2010 (SA); a Registrar's notice
      in the South Australian Government Gazette; and the department's own
      historical pages, of which the 2004 capture proves at least one good one
      once existed.

  # =========================================================================
  # ONE SERIES BACK.
  # =========================================================================
  - id: au-sa-standard-3l3n
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1967, end: 2008 }
    period_evidence: secondary-locator-unverified
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} ?\d{3}\z'
      evidence: secondary
      charset: { notes: "three letters then three numerals — the shape every Australian State ran under the 1948 letter allocation described in plates/au-act.yml. South Australia's own block of that allocation is not published" }
    design:
      colour_note: "black characters on a reflective white ground with the slogan 'SA - The Festival State' for the later part of the run — Transport SA's own 2004 words, which describe THIS series, since the capture predates the changeover"
      plate: { w: 372, h: 134, unit: mm }
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20041206044325/http://www.transport.sa.gov.au/registrations/number_plates/alpha.asp  # Transport SA, 6 December 2004: the general issue AS IT THEN STOOD — black on reflective white, 'SA - The Festival State'. Because the capture predates the changeover, this is a contemporaneous departmental description of THIS series, which is stronger evidence than the successor series enjoys"
      - "http://www.plateshack.com/y2k/South_Australia/southaustralia.htm  # enthusiast reference, accessed 2026-08-02: a plate captioned '1967 to 1981 style South Australia general series license plate' — independent corroboration for the 1967 boundary the locator gives"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_South_Australia  # LOCATOR ONLY: the 1967-2008 window and the three-letter/three-numeral arrangement. Flagged, not asserted"
    notes: >-
      THE PREVIOUS SOUTH AUSTRALIAN GENERAL ISSUE. Both boundaries are the
      locator's, but each has one independent corroboration: an enthusiast
      reference dates a "1967 to 1981 style" general series plate, and the same
      reference's "used up until 2008" caption brackets the far end. The
      strongest single piece of evidence attaching to this series is the
      contemporaneous Transport SA page of 2004, which describes it as the
      current general issue in the department's own words — the successor series
      has no equivalent. That inversion (the DEAD series better sourced than the
      LIVE one) is worth naming: it is what happens when an agency stops
      publishing plate information and the only good pages survive in an archive.

  # =========================================================================
  # PERSONALISED / SPECIAL — the one published South Australian constraint.
  # =========================================================================
  - id: au-sa-special
    class: personalized
    categories: [car, van, truck, motorcycle, trailer]
    period: { start: 2008 }        # UPPER BOUND: the earliest evidence read
                                   # for the CURRENT operation, not a start.
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LLLLLLL"
      regex: '\A[A-Z0-9]{1,7}\z'
      evidence: authority
      charset:
        notes: >-
          EzyPlates — the South Australian Government's own plate-ordering
          service, on the sa.gov.au domain — states the constraint for custom
          plates verbatim: "Custom plates - letters only, or letters and
          numbers, a combination of 1 to 7 characters." That is a real,
          published, government-stated bound on a South Australian serial, and
          it is the ONLY one obtained anywhere in the Australian wave. Seven is
          also exactly the width of the general issue, which is a consistent
          picture rather than a coincidence. `matching: strict` is earned: the
          regex is the authority's own stated frame, not a catch-all.
      note: "the service also offers numeric, historical, R&S-series, Japanese-style, Euro-style, premium and corporate ranges; those are DESIGN catalogues on the same serial frame and are out of scope at this gate (PRD-PLATES §2.5)"
    design:
      note: "one design per range; individual personalised designs are L4 scope"
    programme:
      operator: "EzyPlates, on the South Australian Government domain ezyplates.sa.gov.au"
      why_it_matters: >-
        A government-domain operator makes the published serial constraint an
        AUTHORITY statement rather than a vendor's copy. Contrast Queensland,
        where the same function sits on a commercial domain that the regulation
        itself names (au-qld.yml, reg 2021 s 132(7)), and New South Wales, where
        it sits on a commercial domain the agency merely links to.
    region_encoding: none
    sources:
      - "https://ezyplates.sa.gov.au/  # EzyPlates (Department for Infrastructure and Transport), read via the Internet Archive because the live host 403s to non-browser clients, accessed 2026-08-02: 'Custom plates - letters only, or letters and numbers, a combination of 1 to 7 characters'; the range catalogue (custom, personalised, premium, Euro, Japanese, numeric, historical, R&S series, corporate, Koala State, standard, bike rack)"
      - "https://www.sa.gov.au/topics/driving-and-transport/registration/number-plates-and-trade-plates/order-special-number-plates  # SA.GOV.AU 'Order special number plates' — the departmental entry point for the same programme (accessed 2026-08-02)"
    notes: >-
      SOUTH AUSTRALIAN SPECIAL (PERSONALISED) PLATES. Recorded as its own series
      because the SERIAL SOURCE differs — owner-chosen rather than
      registrar-assigned — and because it carries the only government-published
      serial bound in the file. `period.start: 2008` IS AN UPPER BOUND AND
      MEANS ONLY "the programme was running by then": South Australia has sold
      special plates for decades (the archived 2004 Transport SA pages already
      describe slogan and historic plate products), and no start date was
      obtained. Labelled `instrument-in-force-upper-bound` rather than dressed
      up. CLASS CAVEAT: recorded as `personalized`; the department's own word is
      "special", which in South Australia covers both owner-chosen combinations
      and departmental design ranges — a vocabulary mismatch worth knowing
      about, not worth a new class.
gaps:
  - "The Motor Vehicles Regulations 2010 (SA) were not read (legislation.sa.gov.au 403s to machine clients) — no South Australian instrument is quoted anywhere in this file"
  - "The CURRENT bottom legend/slogan of the general issue: no current departmental page states it; the 2004 capture's 'SA - The Festival State' is a FORMER slogan and is recorded as such"
  - "The 2008 vs 2009 changeover disagreement is recorded, not resolved"
  - "Trade plates exist as a named departmental product with their own pages and are NOT authored — no format is published"
