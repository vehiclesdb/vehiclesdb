    matching: strict
    format:
      pattern: "LLS999"
      regex: '\A[A-Z]{2}S[A-Z]?\d{3}\z'
      charset:
        notes: "the § 127 family grammar with S. § 127 ods. 9: 'Zvláštne evidenčné číslo obsahujúce písmeno S sa môže prideliť len športovému vozidlu.' Like H, it may be set on one line (ods. 3) and may take any of the four plate sizes (§ 35 ods. 5)."
    design:
      plate: { w: 240, h: 150, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#0000CC"
      foreground_note: "§ 36 ods. 1 písm. d): 'modrej farby na bielom podklade'"
      band: { side: none }
      emblem: { present: false }
    region_encoding: "plates/_decode/sk-districts.yml"
    region_encoding_note: "as sk-dealer — top-line pair, pre-2023 only"
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20230101.pdf  # § 127 ods. 1, 3, 9. Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2009/9/ZZ_2009_9_20220801.pdf  # § 36 ods. 1 písm. d). Accessed 2026-08-02"
    notes: >-
      THE S PLATE — blue on white, for a sports vehicle. Together with
      cz-sport it is the reason this PR adds `sport` to plates/_meta/classes.yml:
      two independent jurisdictions in one slice maintain a distinct series for
      competition vehicles, and neither fits `specialty`, which the vocabulary
      defines as an optional-design programme on a standard serial. Slovakia's,
      like its historic plate, sits OUTSIDE the register; Czechia's sits inside
      it — the same divergence, recorded on both.

  - id: sk-agricultural
    class: agricultural
    categories: [tractor, machine]
    period: { start: 2009 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LLZ999"
      regex: '\A[A-Z]{2}Z[A-Z]?\d{3}\z'
      charset:
        notes: "the § 127 family grammar with Z. § 127 ods. 10: 'Zvláštne evidenčné číslo obsahujúce písmeno Z sa môže prideliť len vozidlu kategórie PS a LS.' Categories PS and LS are Slovak national categories for self-propelled working machines and forestry machinery."
    design:
      plate: { w: 240, h: 150, unit: mm }
      background: { color: "#00A550", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      foreground_note: "§ 36 ods. 1 písm. e): 'čiernej farby na zelenom podklade' — BLACK ON GREEN, where Czechia colours the same class of vehicle black on YELLOW. Neighbouring jurisdictions, opposite conventions, and a parse API that assumes a shared Visegrad palette will be wrong."
      band: { side: none }
      emblem: { present: false }
    region_encoding: "plates/_decode/sk-districts.yml"
    region_encoding_note: "as sk-dealer — top-line pair, pre-2023 only"
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20230101.pdf  # § 127 ods. 10. Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2009/9/ZZ_2009_9_20220801.pdf  # § 36 ods. 1 písm. e). Accessed 2026-08-02"
    notes: >-
      THE Z PLATE — black on green, for category PS and LS machinery. Note the
      contrast with sk-standard-2023, whose `categories` already include tractor
      and machine: an agricultural tractor of category T or C takes an ORDINARY
      Slovak plate (with the Y marker if it is given the car-sized one, § 35
      ods. 4), while a PS or LS self-propelled machine takes this special one.
      The Slovak split is by category letter, the Czech split is by plate colour
      on an otherwise ordinary mark, and neither maps onto the other.

  - id: sk-temporary-c
    class: temporary
    categories: [car, van, truck, bus, motorcycle, trailer, tractor, machine]
    period: { start: 2009 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "C99999"
      regex: '\AC[A-Z]?[- ]?\d{5}\z'
      charset:
        notes: >-
          THE ONE MEMBER OF THE FAMILY WITH NO LETTER PAIR. § 127 ods. 12:
          "Zvláštne evidenčné číslo obsahujúce v prvom riadku písmeno C
          a v druhom riadku päť číslic sa môže prideliť ... za písmenom C sa môže
          uviesť aj ďalšie písmeno. Na tabuľke so zvláštnym evidenčným číslom
          obsahujúcim písmeno C sa vyznačuje doba jej platnosti." C plus five
          digits, an optional extra letter, and a printed validity. ods. 4
          expressly disapplies the top-line letter pair for this row ("to neplatí
          ak ide o zvláštne evidenčné číslo podľa odseku 12"), which is why this
          series alone in the family carries no district code and never did.
        arms_position: "§ 35 ods. 8 names this row explicitly: the state arms sit 'za písmenom C, ak ide o zvláštne evidenčné číslo' — the C plate is the only zvláštne plate that carries the arms in the serial, hence the `[- ]?` in the regex."
    design:
      plate: { w: 240, h: 150, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#009933"
      foreground_note: "§ 36 ods. 1 písm. f): C and F plates alike are 'zelenej farby na bielom podklade'"
      band: { side: none }
      emblem: { present: true, rendered: placeholder, position: "after the letter C" }
      validity_field: { content: "the validity period, printed on the plate" }
    region_encoding: none
    region_encoding_note: "structurally none — § 127 ods. 4 disapplies the top-line letter pair for this row, so the C plate carried no district code even before 2023"
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20230101.pdf  # § 127 ods. 4, 12, 13; § 35 ods. 8. Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2009/9/ZZ_2009_9_20220801.pdf  # § 36 ods. 1 písm. f) and § 41 ods. 1 (C plates may also be issued by an okresný úrad). Accessed 2026-08-02"
    notes: >-
      THE C PLATE — green on white, C plus five digits, with a printed validity.
      It does two jobs § 127 keeps deliberately separate: it covers a vehicle
      seeking individual approval, deregistered for export or not subject to
      registration (ods. 1), AND, under ods. 13, an unapproved motor or trailer
      used for AGRICULTURAL OR FORESTRY WORK on its owner's application — an
      application the statute requires to include photographs of the vehicle from
      the front, side and rear. Modelled as `temporary` on the strength of its
      printed validity; the agricultural use under ods. 13 is a genuine
      class-boundary case and is recorded rather than resolved by splitting the
      series.

  - id: sk-limited-f
    class: temporary
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2009 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LLF999"
      regex: '\A[A-Z]{2}F[A-Z]?\d{3}\z'
      charset:
        notes: "the § 127 family grammar with F. § 127 ods. 11: 'Zvláštne evidenčné číslo obsahujúce písmeno F sa môže prideliť len jednotlivému vozidlu s obmedzenou prevádzkou. Na tabuľke so zvláštnym evidenčným číslom obsahujúcim písmeno F sa vyznačuje doba jej platnosti.'"
    design:
      plate: { w: 240, h: 150, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#009933"
      foreground_note: "§ 36 ods. 1 písm. f), which pairs F with C"
      band: { side: none }
      emblem: { present: false }
      validity_field: { content: "the validity period, printed on the plate" }
    region_encoding: "plates/_decode/sk-districts.yml"
    region_encoding_note: "as sk-dealer — top-line pair, pre-2023 only. Note the contrast with sk-temporary-c, which shares this series' colour but has no letter pair at all."
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20230101.pdf  # § 127 ods. 3-5, 11. Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2009/9/ZZ_2009_9_20220801.pdf  # § 36 ods. 1 písm. f). Accessed 2026-08-02"
    notes: >-
      THE F PLATE — green on white, for a "jednotlivé vozidlo s obmedzenou
      prevádzkou", a single vehicle approved for restricted operation, with a
      printed validity. Shares its colour and its class with sk-temporary-c and
      is a different series because its grammar differs: F takes the family's
      top-line letter pair and three digits, C takes no pair and five digits.
      That difference is also a decode difference, which is the practical reason
      to keep them apart.

  # =========================================================================
  # PERSONALIZED — the § 124 ods. 2 mark, reshaped by the 2023 reform.
  # =========================================================================
  - id: sk-personalized-2023
    class: personalized
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2023 }
    period_evidence: enacted-commencement
    matching: recall-only
    format:
      pattern: "LL LLLLL"
      regex: '\A[A-Z]{2}[- ]?[A-Z0-9]{5}\z'
      charset:
        notes: >-
          § 124 ods. 2 zákona č. 8/2009 Z. z. AS REPLACED by zákon č. 128/2021
          Z. z. Čl. I bod 33, verbatim: "Na žiadosť držiteľa vozidla alebo
          vlastníka vozidla možno prideliť evidenčné číslo, v ktorom sa na prvých
          dvoch miestach uvádzajú písmená a za štátnym znakom Slovenskej
          republiky sa uvádzajú písmená, číslice alebo kombinácia písmen a číslic
          iná ako je uvedená v odseku 1." Two LETTERS first — that part is not
          free — then any five characters other than the ordinary
          three-digits-two-letters arrangement.
        prohibitions: >-
          § 124 ods. 3, and the 2023 reform simplified it in a way that only
          makes sense once the district code is gone. The provision refuses a
          personalized number that is already assigned, that contains or forms
          offensive, ridiculing, outrageous or insulting expressions, that
          contains the name or abbreviation of a state body, political party or
          movement, that contains text supporting a movement suppressing rights
          and freedoms or preaching national, racial, class or religious
          intolerance, or that contains diacritics or lower case. UNTIL 2023 each
          of those tests read "alebo ktoré V KOMBINÁCII S OZNAČENÍM OKRESU tvorí
          takéto výrazy" — the offensiveness was judged against the DISTRICT CODE
          TOO, so the same five characters could be refused in one okres and
          granted in another. Zákon č. 128/2021 Z. z. Čl. I bod 34 struck those
          words. A small provision that captures the whole reform: when the
          prefix stopped meaning a place, it stopped being able to make a word.
        matching_note: >-
          `matching: recall-only` (PRD-PLATES §2.7), and the test is the one the
          PRD sets: is this regex WIDER than what the authority issues? It is.
          § 124 ods. 2 admits any five-character tail "iná ako je uvedená
          v odseku 1" — anything EXCEPT the ordinary three-digits-two-letters
          arrangement — and no anchored regex in this dialect can subtract one
          shape from a set without a negative lookahead spanning the separator
          position. So `regex` accepts strings the authority would refuse, a
          match is a shape hit and nothing more, and the series carries no
          `regex_strict` because a deliberately over-broad regex cannot also be
          the sourced grammar.
        exclusions: "§ 124 ods. 4: not available for trailers (including trailers behind motorcycles, tricycles and quadricycles) or for vehicles of state bodies, local self-government, state funds and state budgetary and contributory organisations."
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: left, color: "#003399", content: eu-stars+SK, hex_basis: observed }
      emblem: { present: true, rendered: placeholder, position: "after the first letter pair, as on the ordinary series" }
    region_encoding: none
    region_encoding_note: "the leading pair is owner-chosen from 1 January 2023 and denotes nothing; before that date it was the owner's district and was NOT chosen — see sk-personalized-district"
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20230101.pdf  # § 124 ods. 2-4 as in force from 01.01.2023. Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2021/128/ZZ_2021_128_20211201.pdf  # zákon č. 128/2021 Z. z. Čl. I bod 33 (the replacement of § 124 ods. 2) and bod 34 (deleting 'v kombinácii s označením okresu'); Čl. IV, commencement 1 January 2023. Accessed 2026-08-02"
    notes: >-
      THE CURRENT PERSONALIZED MARK, and the reform's least obvious consequence.
      Before 2023 a Slovak vanity plate kept the owner's DISTRICT code and let
      the owner choose only the five characters after it; from 2023 the owner
      chooses the leading letter pair as well. That is a real widening of what
      can be requested and it is why this series and sk-personalized-district are
      separated. period.start 2023 is the commencement of zákon č. 128/2021
      Z. z., not its 2021 adoption or promulgation.

  - id: sk-personalized-district
    class: personalized
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2009, end: 2023 }
    period_evidence: instrument-dated-both-ends
    matching: recall-only
    format:
      pattern: "LL LLLLL"
      regex: '\A[A-Z]{2}[- ]?[A-Z0-9]{5}\z'
      charset:
        notes: >-
          § 124 ods. 2 zákona č. 8/2009 Z. z. IN ITS PRE-2023 FORM, verbatim:
          "Na žiadosť držiteľa vozidla alebo vlastníka vozidla možno prideliť
          evidenčné číslo, v ktorom sa namiesto písmen a číslic podľa odseku 1 za
          štátnym znakom Slovenskej republiky uvádzajú a) písmená na prvom až
          piatom mieste, b) písmená na prvom až štvrtom mieste a číslica na
          piatom mieste alebo c) písmená na prvom až treťom mieste a kombinácia
          číslic na štvrtom a piatom mieste." THREE ENUMERATED SHAPES rather than
          one open one: five letters; four letters and a digit; or three letters
          and two digits. In every case the owner-chosen part follows the DISTRICT
          code, which the owner did not choose. The 2023 replacement collapsed
          the three shapes into a single "anything but the ordinary arrangement".
        matching_note: >-
          `matching: recall-only`, and here the gap is wider still: the authority
          issued exactly THREE shapes (LLLLL, LLLLD, LLLDD after the district
          code) and `regex` accepts all thirty-two combinations of five
          alphanumerics. A match is a shape hit. The alternative — three
          alternated branches inside one anchored regex — was rejected because
          each branch would straddle the separator position and PRD-PLATES §2.8
          forbids mixing separator and serial characters in one class.
        strict_note: >-
          The three enumerated shapes are all letter-initial and never place a
          digit before a letter, which is a real tightening, but expressing it
          would need an alternation whose branches straddle the separator
          position; it is recorded in words instead of in a `regex_strict`, since
          a twin that describes only one of three lawful branches would be worse
          than none.
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: left, color: "#003399", content: eu-stars+SK, hex_basis: observed }
      emblem: { present: true, rendered: placeholder }
    region_encoding: "plates/_decode/sk-districts.yml"
    region_encoding_mechanism: "the leading pair is the owner's district, exactly as on sk-standard-district-2006 — a personalized Slovak plate of this era is MORE reliably geographic than an ordinary one, because the owner had to be resident in the district to get it"
    sources:
      - "https://www.slov-lex.sk/static/pdf/2009/8/ZZ_2009_8_20220801.pdf  # § 124 ods. 2 písm. a) až c) and ods. 3 with the 'v kombinácii s označením okresu' tests, as in force to 31 December 2022. Accessed 2026-08-02"
    notes: >-
      THE DISTRICT-ERA VANITY PLATE — three enumerated character shapes after a
      district code the owner could not choose. period.end 2023 is the
      commencement of zákon č. 128/2021 Z. z.; period.start 2009 is
      instrument-in-force on zákon 8/2009, and whether vyhláška 225/2004 offered
      a personalized number before that was not established (recorded gap).
      Distinct from sk-personalized-2023 by the enumerated shapes, by the fixed
      district prefix and by the offensiveness test being applied to the prefix
      and the chosen characters TOGETHER.

  # =========================================================================
  # THE X PLATE — a government series that ended when zákon 8/2009 began.
  # =========================================================================
  - id: sk-official-x
    class: government
    categories: [car, van, truck, bus]
    period: { start: 2004, end: 2009 }
    period_evidence: transitional-provision
    matching: strict
    format:
      pattern: "LLX999"
      regex: '\A[A-Z]{2}[- ]?X\d{3}\z'
      charset:
        notes: >-
          Vyhláška č. 225/2004 Z. z. § 51 ods. 1 písm. b): an osobitné evidenčné
          číslo formed by "dvojica písmen označujúca okres, za pomlčkou písmeno X
          a tri číslice" — the district pair, the hyphen (the arms after 29 April
          2006, per vyhláška 227/2006 Čl. I bod 13, which amends § 51 ods. 1
          písm. a) and b) by name), the letter X and three digits.
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      colour_caveat: "not separately specified in the sources read; the black-on-white default applied by elimination. Inference, flagged."
      band: { side: left, color: "#003399", content: eu-stars+SK, hex_basis: observed }
      emblem: { present: true, rendered: placeholder, position: "after the district pair, from 29 April 2006" }
