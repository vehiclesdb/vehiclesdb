    sources:
      - "https://www.slov-lex.sk/static/pdf/2004/225/ZZ_2004_225.pdf  # vyhláška č. 225/2004 Z. z. § 51 ods. 1 písm. b). Accessed 2026-08-02"
      - "https://www.slov-lex.sk/static/pdf/2009/9/ZZ_2009_9_20220801.pdf  # vyhláška č. 9/2009 Z. z. § 41 ods. 2 (Prechodné ustanovenia), verbatim: 'Tabuľky s evidenčným číslom podľa doterajších predpisov OKREM tabuľky s osobitným evidenčným číslom obsahujúcim písmeno X na prvom mieste za skratkou okresu sa vydávajú držiteľom vozidiel do vyčerpania ich skladových zásob.' Accessed 2026-08-02"
    notes: >-
      THE X PLATE, AND THE ONE SLOVAK SERIES THAT WAS AFFIRMATIVELY KILLED. Every
      other pre-2009 plate could be issued out of stock; § 41 ods. 2 of vyhláška
      9/2009 carved the X plate OUT of that permission by name, so its issue
      stopped dead on 1 February 2009. period_evidence is transitional-provision
      for exactly that reason — the end date is a transitional carve-out, not a
      repeal or a successor's commencement. period.start 2004 is
      instrument-in-force on vyhláška 225/2004 and is not the date the class
      began: § 95 of zákon 315/1996 created osobitné evidenčné čísla in 1997 and
      whether the X letter was used from the start was not established. WHAT THE
      X DENOTED is a recorded gap: neither instrument read in this pass says
      which bodies held it, and the current § 126 has no X row at all.
