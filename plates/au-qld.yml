# plates/au-qld.yml — Queensland (PRD-PLATES gate L3, Australia).
#
# QUEENSLAND IS THE AUSTRALIAN JURISDICTION WHERE THE LAW AND THE AGENCY BOTH
# TALK. Two primaries carry this file:
#
# 1. THE INSTRUMENT — Transport Operations (Road Use Management—Vehicle
#    Registration) Regulation 2021 (Qld), SL 2021 No. 113, made under the
#    Transport Operations (Road Use Management) Act 1995, s 2: "This regulation
#    commences on 1 September 2021." Read in full from the Queensland
#    Parliamentary Counsel's own XML (1.5 MB, reprint current as at
#    2026-08-01). It gives, verbatim and in terms: who gets how many plates
#    (s 117), where they go and how visible they must be (s 118), the dealer
#    plate (s 77), the personalised plate (ss 132-133) — and, exactly as in
#    every other Australian jurisdiction, NO SERIAL GRAMMAR AT ALL.
#
# 2. THE MINISTER — a media statement of the Minister for Transport and Main
#    Roads published on the Queensland Cabinet and Ministerial Directory,
#    dated Sunday 1 July 2018, which states the OLD format, the NEW format and
#    the old format's start year in the Minister's own quoted words. It is the
#    single best format source obtained for any Australian State in this wave,
#    and it is why au-qld-standard-3n3l carries an authority-dated 1977 start
#    while the equivalent series in NSW and SA carry locator dates.
#
# WHAT THE MINISTER DID NOT SAY, and it matters: he announced the new
# combination without a start date ("Transport and Main Roads has been working
# on a solution for some time and has developed a new combination for the
# future"). The 2020 changeover below is therefore the LOCATOR's date, flagged,
# while the FORMAT is the Minister's. Splitting those two claims apart — same
# series, different evidence grades — is the whole discipline.
#
# SEPARATOR NOTE (PRD-PLATES §2.6): the Minister writes the new combination
# "456-BZ8" with a hyphen; the plate prints a gap, not a hyphen. `pattern` and
# `regex` spell the printed form with an optional emitted SPACE, per §2.6
# rule 2, and a forgiving consumer deletes the Minister's hyphen anyway.
jurisdiction: au-qld
authority:
  name: Department of Transport and Main Roads (Queensland)
  url: "https://www.qld.gov.au/transport/registration/numberplate"
binding: vehicle
binding_note: >-
  The plate binds to the vehicle, but the personalised COMBINATION binds to a
  person: reg 2021 s 133(1), verbatim — "The right to use the combination of
  numbers or letters on a personalised number plate is the property of the
  person to whom the chief executive gives the plate."
instrument:
  citation: "Transport Operations (Road Use Management—Vehicle Registration) Regulation 2021 (Qld), SL 2021 No. 113, made under the Transport Operations (Road Use Management) Act 1995 (Qld) (act-1995-009)"
  commencement: "s 2, verbatim: 'This regulation commences on 1 September 2021.'"
  reprint_read: "reprint current as at 2026-08-01 (publication.date attribute of the OQPC XML), administering department recorded in the instrument as 'Department of Transport and Main Roads'"
  stage_repeal: "the instrument carries an automatic expiry date of 1 September 2031 (stage repeal) — a Queensland drafting convention, not a plate fact, recorded so nobody reads it as a series end"
  source: "https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2021-0113  # the whole regulation; read as OQPC XML at /view/whole/xml/inforce/current/sl-2021-0113 on 2026-08-02"
  licence: "Queensland legislation is published by the Office of the Queensland Parliamentary Counsel; the site's robots.txt permits the /view/whole/ paths used here. Edicts of government — quoted, not embedded (PRD-PLATES §4)"

national_schemes:
  heavy_vehicle: >-
    QUEENSLAND'S REGULATION IS WHERE THE NATIONAL HEAVY-VEHICLE PLATE IS
    VISIBLE IN LAW. Reg 2021 s 117(2), verbatim, disapplies the ordinary
    plate-issue duty where "(a) the vehicle is a category 2 vehicle; and (b) the
    vehicle is equivalently registered in the applicant's name; and (c) a
    national heavy vehicle number plate has been given for the vehicle." Part 6
    Division 3 then provides for national heavy vehicle number plates becoming
    "the current number plates for the vehicle", at which point "the original
    number plates stop being effective". So the national scheme is a mechanism
    that SUPERSEDES a State plate on the same vehicle. NO SERIES IS AUTHORED:
    the national heavy-vehicle serial grammar was not obtained from the NHVR or
    any State instrument (recorded gap, L4).
  light_vehicle_standards: >-
    Australian Light Vehicle Standards Rules 2015 (national MODEL law,
    Parliamentary Counsel's Committee, consolidated 22 March 2019) rule 86,
    verbatim: "At least 1 number plate light must be fitted to the rear of a
    vehicle." The Rules "do not, by themselves, have any legal effect" and
    prescribe no plate dimension, colour or grammar.
  source: "https://www.pcc.gov.au/uniform/Australian%20Light%20Vehicle%20Standards%20Rules%202015%20-%2022%20March%202019.pdf  # ALVSR 2015 rule 86 and the model-law disclaimer, accessed 2026-08-02"

# ---------------------------------------------------------------------------
# Display rules — straight out of the instrument, and the most detailed set
# obtained anywhere in the Australian wave.
# ---------------------------------------------------------------------------
display_rules:
  issue: "s 117(1), verbatim: on granting a registration application the chief executive must '(a) assign a registration number to the vehicle; and (b) give the registered operator of the vehicle— (i) if the vehicle is a motorbike, motorised mobility device, quad bike or trailer—1 number plate displaying the registration number for the vehicle; or (ii) otherwise—2 number plates displaying the registration number for the vehicle.'"
  position: "s 118(1): two plates go one front, one rear; with an approval under s 142A only one rear plate is required; a single-plate vehicle displays it at the rear. s 118(2)(a): each plate must be 'in an upright position parallel to the vehicle's axles' and 'not more than 1.3m above ground level'"
  visibility: "s 118(2)(b): the characters must be 'visible from 20m away at any point within an arc of 45° from the surface of the number plate above or to either side of the vehicle', as shown in the two figures printed in the section"
  covers: "s 118(2)(c): any cover 'is clear, clean, untinted and flat over its entire surface' and has no characteristics preventing 'the successful operation of a photographic detection device' or the plate 'from being legible'"
  load_rule: "s 118(3): characters 'are taken not to be visible ... if a load on the vehicle obscures any part of the characters'"
  towing_exceptions: "s 119 excuses the rear-plate visibility rule where a towed vehicle obscures it and the towed vehicle itself displays a compliant plate — with a distinct rule for tow trucks towing unregistered vehicles"
  penalties: "s 118(1) maximum 12 penalty units; s 118(2) maximum 40 penalty units"
  sources:
    - "https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2021-0113  # Transport Operations (Road Use Management—Vehicle Registration) Regulation 2021 (Qld) ss 117, 118, 119 (accessed 2026-08-02)"

series:

  # =========================================================================
  # CURRENT GENERAL ISSUE — the format is the Minister's, the date is not.
  # =========================================================================
  - id: au-qld-standard
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2020 }        # FORMAT: Minister, 2018. DATE: locator.
                                   # The two are separated in notes.
    period_evidence: secondary-locator-unverified
    matching: strict
    format:
      pattern: "999 LL9"
      regex: '\A\d{3} ?[A-Z]{2}\d\z'
      evidence: authority
      charset:
        notes: >-
          Minister for Transport and Main Roads, media statement of 1 July 2018,
          verbatim: "The new plates will feature three numbers followed by two
          letters and a further number (eg. 456-BZ8)." And: "This format meets
          regulatory requirements and will be unique to Queensland." Six
          characters. NO LETTER OR DIGIT EXCLUSIONS ARE STATED by the Minister
          or by the department, so no `regex_strict` is written; the claim
          repeated on the enthusiast web that Queensland skips 0 and 1 in the
          suffix is UNSOURCED and deliberately not encoded.
      security_feature: "the same statement, verbatim: 'A unique directional security mark is one of the design features being considered for inclusion on the new plates' — CONSIDERED, not adopted, in 2018; whether it shipped is unverified and is not recorded as a design fact"
    design:
      colour_note: >-
        Maroon characters on a white retroreflective ground. THE DEPARTMENT
        PUBLISHES NO COLOUR SPEC and the Minister named none; the colour words
        are the locator's and are corroborated only by the Minister's separate
        remark that the PREVIOUS series "changed colour back in 2001". No hex is
        recorded — Queensland maroon is a State identity colour with a real
        value somewhere in Queensland Government brand guidance, and guessing it
        would be inventing a fact.
      plate: { w: 372, h: 134, unit: mm }
      plate_dimension_note: "the cross-State Australian passenger size sourced in plates/au-wa.yml and plates/au-nt.yml; TMR publishes no millimetres of its own (recorded gap)"
      legend_bottom: "QUEENSLAND, with the State slogan"
      rear_differs: false
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20180701170407/http://statements.qld.gov.au/Statement/2018/7/1/new-combination-seals-queensland-number-plate-future  # 'New combination seals Queensland number plate future', Minister for Transport and Main Roads the Hon. Mark Bailey, Queensland Cabinet and Ministerial Directory, Sunday 1 July 2018 (read via the Internet Archive, accessed 2026-08-02): the new three-numeral/two-letter/one-numeral combination with the worked example, the 'unique to Queensland' claim, the directional security mark under consideration, and the Y/Z-series exhaustion timeline"
      - "https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2021-0113  # reg 2021 s 117: the chief executive assigns the registration number and issues one or two plates — the grammar is nowhere in the instrument, which is the negative half of the sourcing story"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Queensland  # LOCATOR ONLY (PRD-PLATES §4), accessed 2026-08-02: the September 2020 first issue of this series. Uncited in the article; used as a finding aid and flagged, not asserted"
    notes: >-
      QUEENSLAND'S CURRENT GENERAL ISSUE, WITH ITS TWO CLAIMS GRADED
      SEPARATELY. THE FORMAT IS AUTHORITY-SOURCED: a serving Minister described
      it in a dated government media statement, with a worked example, two years
      before it entered issue. THE START DATE IS NOT: the Minister gave no
      commencement, and the September 2020 figure comes from an uncited locator
      row, hence `period_evidence: secondary-locator-unverified` on a series
      whose `format.evidence` is `authority`. The Minister's own timeline is the
      best independent check available and it is consistent: "My department has
      started issuing Y series plates and we expect the Z series will start
      being issued next year and run into early 2020" — i.e. the predecessor was
      forecast in 2018 to exhaust in early 2020, and the locator says the
      successor began in September 2020. Consistent is not the same as sourced,
      and the file says so. THE ID IS UNDATED for the us-fl-standard reason:
      a dated id minted on a locator boundary cannot be withdrawn later.

  # =========================================================================
  # ONE SERIES BACK — and this one the Minister dated himself.
  # =========================================================================
  - id: au-qld-standard-3n3l
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1977, end: 2020 }
    period_evidence: authority-announcement
    matching: strict
    format:
      pattern: "999 LLL"
      regex: '\A\d{3} ?[A-Z]{3}\z'
      evidence: authority
      charset: { notes: "Minister, 1 July 2018, verbatim: 'Queensland's current motor vehicle number plate series, which includes a combination of three numbers followed by three letters, is coming to an end after 40 years in production'" }
      progression: "ascending through the three-letter suffix; the Minister's 2018 statement places the run at the Y block ('My department has started issuing Y series plates and we expect the Z series will start being issued next year and run into early 2020'), which is an agency-published serial-to-year anchor of the kind almost no jurisdiction gives"
    design:
      colour_note: "the Minister, verbatim: 'The current plate series started in 1977 and changed colour back in 2001.' The colour VALUES on either side of 2001 are not stated by him and are not recorded here; what is recorded is that a colour change happened MID-SERIES in 2001 and did not start a new series — the same modelling point Victoria's 1995 blue makes"
      plate: { w: 372, h: 134, unit: mm }
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20180701170407/http://statements.qld.gov.au/Statement/2018/7/1/new-combination-seals-queensland-number-plate-future  # the Minister, verbatim: 'The current plate series started in 1977 and changed colour back in 2001'; 'three numbers followed by three letters'; 'after 40 years in production'; the Y/Z series exhaustion forecast (accessed 2026-08-02 via the Internet Archive)"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Queensland  # LOCATOR ONLY: the 2020 end. Flagged, not asserted"
    notes: >-
      THE PREVIOUS QUEENSLAND GENERAL ISSUE, AND THE BEST-DATED "ONE SERIES
      BACK" IN THE AUSTRALIAN WAVE. `period.start: 1977` is not a locator claim
      and not an inference: a serving Transport Minister stated it in a dated
      government publication, twice over ("started in 1977", "after 40 years in
      production" — 1977 + 40 = 2017/18, which is internally consistent with the
      statement's own date). That is why `period_evidence:
      authority-announcement` rather than the secondary grades that the NSW,
      SA and TAS one-back series carry. The END is the locator's and is flagged.
      The 2001 mid-series colour change is recorded on the design rather than
      used to split the series, because a colour-only variant of the same
      format and period is a sub-entry, not a series (PRD-PLATES §2.3).

  # =========================================================================
  # PERSONALISED — the framework is in the instrument, and the instrument
  # points at a website for the fee, which is worth recording as-is.
  # =========================================================================
  - id: au-qld-personalised
    class: personalized
    categories: [car, van, truck, motorcycle, trailer]
    period: { start: 2021 }        # UPPER BOUND: the CURRENT framework's
                                   # instrument. The programme is far older.
    period_evidence: instrument-in-force-upper-bound
    matching: recall-only
    format:
      pattern: "LLLLLL"
      regex: '\A[A-Z0-9]{1,7}( ?[A-Z0-9]{1,7})?\z'
      evidence: none
      charset:
        notes: >-
          Owner-chosen. Reg 2021 s 132(1), verbatim: "A person may apply to the
          chief executive for a number plate containing a combination of numbers
          or letters chosen by the person (a personalised number plate)." The
          instrument sets NO length, NO alphabet and NO arrangement — the only
          hard constraint it imposes is uniqueness, s 132(6): "The chief
          executive must not give a person a personalised number plate whose
          combination of numbers or letters is identical, or appears to be
          identical, to the combination of numbers or letters of another current
          number plate." Note "appears to be identical", which reaches
          lookalikes and is a real content rule with no published lookalike
          table (recorded gap). `matching: recall-only` because the regex is a
          deliberate catch-all over the serial alphabet.
      uniqueness_rule: "s 132(6), quoted above — the one constraint the law actually imposes"
    design:
      note: "designs are the supplier's catalogue, not the instrument's; individual personalised DESIGNS are out of scope at this gate (PRD-PLATES §2.5)"
    programme:
      operator: "Personalised Plates Queensland (PPQ)"
      statutory_hook: >-
        THE DELIGHTFUL PART, AND A GENUINE MODELLING LESSON: the regulation
        defines the fee BY REFERENCE TO A COMMERCIAL WEBSITE. Reg 2021 s 132(7),
        verbatim: "published fee, for a personalised number plate, means the fee
        stated for the plate on the website located at www.ppq.com.au." A
        Queensland statutory instrument names a domain. That makes PPQ's site an
        instrument-incorporated source rather than a mere vendor page — and it
        means a dataset that ignores the vendor is ignoring something the law
        points at.
      auction: "s 132(4): the chief executive 'may give a personalised number plate to a person on a sale of the plate at public auction'"
      ownership: "s 133(1): 'The right to use the combination of numbers or letters on a personalised number plate is the property of the person to whom the chief executive gives the plate.'"
    region_encoding: none
    sources:
      - "https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2021-0113  # reg 2021 ss 132-133 (accessed 2026-08-02): the personalised-plate application, the published-fee definition naming www.ppq.com.au, the auction limb, the uniqueness rule and the property-in-the-combination rule"
    notes: >-
      QUEENSLAND PERSONALISED PLATES. `period.start: 2021` IS AN UPPER BOUND AND
      NOTHING MORE: it is the commencement of the CURRENT regulation, and
      Queensland has run personalised plates for decades under predecessor
      instruments that were not read in this pass (recorded gap). Dating a
      programme by the instrument that most recently restates it is the
      instrument-date disease PRD-PLATES §4 names, so it is labelled
      `instrument-in-force-upper-bound` rather than dressed up as a start.
      Modelled as its own series because the SERIAL SOURCE differs — owner-chosen
      rather than department-assigned — which is a format property even where
      the physical plate is identical.

  # =========================================================================
  # DEALER PLATES — one sentence of law, and it is the whole series.
  # =========================================================================
  - id: au-qld-dealer
    class: dealer
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2021 }        # UPPER BOUND: current instrument only.
    period_evidence: instrument-in-force-upper-bound
    matching: recall-only
    format:
      pattern: "LLLLLL"
      regex: '\A[A-Z0-9]{1,7}( ?[A-Z0-9]{1,7})?\z'
      evidence: none
      charset: { notes: "NOT PUBLISHED. Reg 2021 s 77, verbatim and in its entirety: 'The chief executive may designate a number plate as a dealer plate.' That is the whole provision — a dealer plate is an ORDINARY number plate with an administrative designation, so the instrument gives no distinct grammar and none is invented. Catch-all regex, recall-only" }
    binding: business
    binding_note: "reg 2021 s 6(1)(b): the registered operator 'for a dealer plate—is the person in whose name the dealer plate is currently registered'; s 6(2) declares that a person in whose name a dealer plate is equivalently registered is NOT the registered operator. The plate follows the business, not a vehicle — the German rote-Kennzeichen and Florida dealer-plate pattern"
    use_rule: "reg 2021 s 10(2)(g): an unregistered vehicle may be used on a road if it is 'being used with a registered dealer plate attached to it under section 96'; s 105 requires a registered dealer plate to be attached 'in the same way as a number plate', i.e. 'as if the dealer plate were the only number plate given for the vehicle'"
    region_encoding: none
    sources:
      - "https://www.legislation.qld.gov.au/view/whole/html/inforce/current/sl-2021-0113  # reg 2021 s 77 (designation), s 6(1)(b) and 6(2) (who the registered operator is), s 10(2)(g) (unregistered use), and the attachment rule requiring a dealer plate to be attached as if it were the vehicle's only number plate (accessed 2026-08-02)"
    notes: >-
      QUEENSLAND DEALER PLATES, AUTHORED BECAUSE THE LAW CREATES THEM AND
      DELIBERATELY THIN BECAUSE THE LAW SAYS NOTHING ELSE ABOUT THEM. s 77 is a
      single sentence; there is no colour, no legend, no grammar, no dimension
      anywhere in the instrument. `binding: business` is the interesting fact
      and it is sourced twice (s 6(1)(b) and the s 6(2) declaration). The
      period is an upper bound for the same reason as the personalised series:
      dealer plates plainly predate a 2021 regulation.
