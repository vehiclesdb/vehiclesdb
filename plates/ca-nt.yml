  - id: ca-nt-veteran
    class: specialty
    categories: [car, van, truck]
    period: { start: 2013 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "V9999"
      regex: '\A(?:VET|V) ?\d+\z'
