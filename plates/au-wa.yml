# plates/au-wa.yml — Western Australia (PRD-PLATES gate L3, Australia).
#
# WESTERN AUSTRALIA HAS THE BEST START DATE IN THE AUSTRALIAN WAVE, and it is
# not from a statute — it is from the Transport Minister's own dated media
# statement of 5 July 1997, published on the Government of Western Australia's
# media-statements service, which describes the incoming general-issue series
# in the department's own words, gives its first combination, and says when it
# entered circulation:
#
#   "Transport Minister Eric Charlton today unveiled Western Australia's new
#    generation of vehicle licence plates, which will come into general
#    circulation from mid-July." ... "The new general purpose plates contain
#    seven characters, commencing with the characters 1AAA 000. It will take
#    until the year 2137 to reach the number 1ZZZ 999."
#
# That single paragraph fixes the format, the first combination, the month of
# first issue and the design intent (a series sized for 140 years, which is why
# WA has not needed a changeover since). It is quoted verbatim below.
#
# THE SECOND PRIMARY IS THE DEPARTMENT'S OWN CURRENT PAGES, which are unusual
# among Australian transport sites in publishing PLATE DIMENSIONS IN
# MILLIMETRES for four plate types. Those figures are the anchor for the
# "372 x 134 mm Australian plate" claim that every other file in this wave
# leans on — the widely repeated "372 x 135 mm Australia/Pacific standard" has
# no citation anywhere, and WA's departmental figure is what a real source
# looks like.
#
# WHAT IS DELIBERATELY MISSING: the pre-1997 general issue. The Minister's
# statement refers to "the current nine series plates about to expire" without
# describing them, and no departmental page dates or describes the predecessor.
# Inventing a shape for it would be exactly the disease this programme exists
# to avoid, so it is a RECORDED GAP and not a series (see gaps, below).
jurisdiction: au-wa
authority:
  name: Department of Transport and Major Infrastructure (Driver and Vehicle Services), Western Australia
  url: "https://www.transport.wa.gov.au/licensing/plates/standard/state"
authority_note: >-
  Named in the department's own current pages as "DTMI" with Driver and Vehicle
  Services (DVS) as the operational arm; the 1997 media statement names the
  predecessor portfolio simply as "Transport". The Director General is the
  owner of issued plates: "All District series plates remain the property of the
  Director General. It is an offence for a person to fail to return the number
  plates on demand."
binding: vehicle
instrument:
  citation: "Road Traffic (Vehicles) Act 2012 (WA) and the Road Traffic (Vehicles) Regulations 2014 (WA)"
  access_note: >-
    NOT READ IN THIS PASS. legislation.wa.gov.au was reachable but its URL
    scheme changed ("The following page law_s5195.html is no longer available on
    this website. Due to essential system and security upgrades, links to some
    pages may have changed") and the replacement identifier for the vehicles
    regulations was not resolved before the research budget for this
    jurisdiction was spent. NOT ONE WORD of WA legislation is quoted here.
    Everything below is departmental or ministerial — which for the claims made
    (format, first issue, dimensions, colours, plate classes) is the better
    source anyway, since Australian registration regulations carry no serial
    grammar. The verifier should still read the Regulations for the display
    rules, which this file therefore does NOT state (recorded gap).
  licence: "Government of Western Australia material; facts extracted, quotations marked verbatim (PRD-PLATES §4)"

national_schemes:
  heavy_vehicle: >-
    Heavy vehicles over 4.5 t GVM are registered under the Heavy Vehicle
    National Law as applied in Western Australia and carry a NATIONAL HEAVY
    VEHICLE NUMBER PLATE issued by the State registrar on the national pattern.
    Mechanism, not a series: the national serial grammar was not obtained
    (recorded gap, L4). Three State instruments name the object in those words
    — Qld reg 2021 s 117(2)(c), Tas reg 2021 reg 88(6), NT Motor Vehicles
    Regulations 1977 reg 10.
  light_vehicle_standards: >-
    Australian Light Vehicle Standards Rules 2015 (national MODEL law,
    Parliamentary Counsel's Committee, consolidated 22 March 2019) rule 86,
    verbatim: "At least 1 number plate light must be fitted to the rear of a
    vehicle." The Rules "do not, by themselves, have any legal effect" and
    prescribe no plate dimension, colour or serial grammar.
  source: "https://www.pcc.gov.au/uniform/Australian%20Light%20Vehicle%20Standards%20Rules%202015%20-%2022%20March%202019.pdf  # ALVSR 2015 rule 86 and the model-law disclaimer, accessed 2026-08-02"

series:

  # =========================================================================
  # STATE (ORDINARY) SERIES — WA's own name for its general issue.
  # =========================================================================
  - id: au-wa-state-series
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1997 }        # "will come into general circulation from
                                   # mid-July" — Minister, 5 July 1997.
    period_evidence: authority-announcement
    matching: strict
    format:
      pattern: "9LLL 999"
      regex: '\A\d[A-Z]{3} ?\d{3}\z'
      evidence: authority
      charset:
        notes: >-
          Transport Minister Eric Charlton, media statement of 5 July 1997,
          verbatim: "The new general purpose plates contain seven characters,
          commencing with the characters 1AAA 000. It will take until the year
          2137 to reach the number 1ZZZ 999." Seven characters counted the WA
          way (leading numeral + three letters + three numerals = 7). NO LETTER
          EXCLUSIONS ARE STATED anywhere by the department; the enthusiast claim
          that WA skips certain letter blocks (the reported absence of an
          F-series is the standard story) is UNSOURCED here and deliberately not
          encoded, so there is no `regex_strict`.
      progression: >-
        Ascending, and the department says so in terms: "The plates are issued
        for general use and are manufactured on demand in large quantities in an
        ascending alpha/numeric series." The 1997 statement's own arithmetic —
        1AAA 000 in 1997 to 1ZZZ 999 in 2137 — is the reason WA has run ONE
        general-issue series for nearly thirty years while Victoria and
        Queensland each changed over: the series was deliberately sized for 140
        years. The Minister's stated motive, verbatim: "Until now we have been
        getting just four or five years from each licence plate series and with
        the current nine series plates about to expire, Transport was keen to
        develop something which will provide long-term consistency."
      allocation_rule: "the department, verbatim: 'You cannot order or choose specific state series number plates.' — general issue is assigned, never selected; selection is the optional/personalised route"
    design:
      plate: { w: 372, h: 134, unit: mm }
      plate_variants:
        - { for: motorcycle, w: 254, h: 100, unit: mm, note: "full-size motorcycle plate" }
        - { for: motorcycle, w: 190, h: 100, unit: mm, note: "small motorcycle plate" }
        - { for: auxiliary, w: 253, h: 99, unit: mm, note: "auxiliary (bike-rack) plate" }
      plate_dimension_note: >-
        Department of Transport, verbatim: "Standard plates are made of aluminium
        and have the following dimensions: Motor vehicle plate 372 mm x 134 mm.
        Motorcycle plate: Full-size plate 254 mm x 100 mm. Small plate 190 mm x
        100 mm. Auxiliary plate 253 mm x 99 mm." FOLKLORE CORRECTED: the
        "372 x 135 mm Australia/Pacific plate standard" that circulates in
        plate-taxonomy writing is uncited everywhere it appears; WA's registrar
        says 134 mm, and the NT's says 133 mm. There is no national standard to
        round to, because there is no national standard.
      material: "aluminium (departmental page, verbatim)"
      colour_note: >-
        The 1997 statement, verbatim: "They are blue and white and carry a
        marketing logo developed for the WA Tourism Commission." The department
        today calls this the "Brand WA format (blue and white plates)" and
        distinguishes it from the older colourways, verbatim: "Both state and
        district series plates issued prior to the Brand WA format (blue and
        white plates) can be remade in any of the below colour combinations;
        Black on white. Black on yellow. Brand WA format." NO HEXES ARE
        RECORDED — the department names colours and never specifies them.
      remake_rule: "the department, verbatim: \"'Brand WA' state series plates can only be remade in the same 'Brand WA' format.\" — so the older colourways are available for older plates only, which makes colour a function of ISSUE DATE, not of series"
      commemorative_note: "the 1997 statement, verbatim: 'The Minister also unveiled the design for the first 100 plates in the series which will be limited edition and carry a special commemorative badge.' The first 100 combinations of this series were therefore a distinct physical product; whether that badge survives on those plates is unverified and no sub-series is authored"
      rear_differs: false
    plate_lifecycle:
      retention: "physically retained for 90 days from the date of retention, then destroyed; the electronic record of retained ownership survives 365 days (departmental page)"
      transfer: "state series plates may be swapped between two vehicles owned by the same person, or transferred to an 'immediate' family member (spouse, parent, child or sibling), on Form E45"
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20160305010058/https://www.mediastatements.wa.gov.au/Pages/Court/1997/07/Unveiling-of-new-generation-of-vehicle-licence-plates.aspx  # 'Unveiling of new generation of vehicle licence plates', Government of Western Australia media statement, Transport Minister Eric Charlton, 5 July 1997 (read via the Internet Archive, accessed 2026-08-02): mid-July 1997 general circulation, the seven-character 1AAA 000 to 1ZZZ 999 series and its 2137 horizon, the four-to-five-year life of previous series, blue and white with the WA Tourism Commission logo, the first-100 commemorative badge, and the manufacturer"
      - "https://www.transport.wa.gov.au/licensing/plates/standard/state  # Department of Transport 'State (ordinary) plates' (accessed 2026-08-02): 'State series number plates have character configurations set by DVS'; the ascending alpha/numeric manufacture-on-demand rule; the four plate dimensions in millimetres; aluminium; the Brand WA colour rules and the remake restriction; retention and transfer machinery"
    notes: >-
      WESTERN AUSTRALIA'S STATE (ORDINARY) SERIES — the department's own name
      for it, used here as the series id rather than the generic "standard"
      because WA distinguishes STATE, DISTRICT, CORPORATE, CONSULAR and
      GOVERNMENT/COMMERCIAL series by those names on its own pages. `start:
      1997` is `authority-announcement` and is as good as an Australian plate
      date gets: a Minister, a dated government publication, the first
      combination and the month. The series is still current — the department's
      page describes it in the present tense and its own arithmetic gives it
      another century — so `period.end` is absent. TWO THINGS A VERIFIER SHOULD
      CHASE. First, the pre-1997 series: the Minister names it only as "the
      current nine series plates", which is not a format description, and it is
      a recorded gap rather than a guessed series. Second, the F-series
      question: WA is widely said to have skipped a letter block; if the
      department confirms it, that is a `regex_strict`, and until then the
      absence of one here is deliberate.

  # =========================================================================
  # ONE SERIES BACK — added in the completion pass. The first pass recorded it
  # as a gap because the Minister names it without describing it; the Wikipedia
  # rule (PRD-PLATES §4, owner override 2026-08-02) permits the description to
  # be taken from the article and tagged, which is strictly better than a gap.
  # =========================================================================
  - id: au-wa-standard-1978
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1978, end: 1997 }
    period_evidence: secondary-wikipedia
    matching: strict
    format:
      pattern: "9LL 999"
      regex: '\A\d[A-Z]{2} ?\d{3}\z'
      regex_strict: '\A[6-9][A-Z]{2} ?\d{3}\z'
      evidence: secondary
      charset:
        notes: >-
          A LEADING DIGIT RESTRICTED TO 6-9, then two letters, then three
          numerals. Reported: "In October 1978, having exhausted the XAA - XZZ
          series a new series was released commencing at 6AA-000. The format
          used was black on yellow, where the numbers preceding the letters
          ranged between 6 and 9. This series ended at 9MZ-999 and the trailer
          series ended at 9RZ-999." The 6-9 restriction is exactly what
          `regex_strict` is for (PRD-PLATES §2.7): the lint generates every
          digit from `pattern`, so `regex` cannot carry it, and the tier order
          regex_strict ⊆ regex holds by construction here.
        corroboration: >-
          THE MINISTER CORROBORATES THE TOP OF THE RANGE WITHOUT DESCRIBING IT.
          The 5 July 1997 media statement that announces the successor says
          "with the current nine series plates about to expire" — i.e. in 1997
          the general issue was in the 9 block, which is precisely what a
          6-then-7-then-8-then-9 progression predicts at the end of its life.
          That is a government sentence agreeing with a secondary description
          without repeating it, which is the strongest kind of corroboration
          available for a format nobody official ever wrote down.
      progression: "6AA-000 onward, the leading digit advancing 6 -> 7 -> 8 -> 9 as each block exhausted; reported to have ended at 9MZ-999 (cars) and 9RZ-999 (trailers)"
    design:
      colour_note: >-
        Black characters on a yellow ground, per the secondary description; the
        1997 media statement describes the SUCCESSOR as "blue and white", which
        implies a change and does not describe what changed from. NO HEX IS
        RECORDED for either colour — WA's Department of Transport publishes no
        colour specification.
      plate: { w: 372, h: 134, unit: mm }
      plate_dimension_note: "the department's own current figure, carried back to this series without independent evidence that the stock size was the same in 1978 — flagged, not asserted"
      rear_differs: false
    region_encoding: none
    reissued_as_nostalgia: >-
      Reported, and a genuinely useful modern fact: "As of February 2025, The
      Department of Transport has now reintroduced the old 6,7,8 & 9 series
      marketed as Nostalgia Series". So a plate matching this series' grammar
      may be a 1978-1997 original OR a 2025-onward remake, and a parse layer
      MUST NOT infer a vintage from the shape alone. The department's Nostalgia
      product page (plateswa.com) was not fetched in this pass (recorded gap).
    sources:
      - "https://web.archive.org/web/20160305010058/https://www.mediastatements.wa.gov.au/Pages/Court/1997/07/Unveiling-of-new-generation-of-vehicle-licence-plates.aspx  # Hon Eric Charlton MLC, Minister for Transport (WA), 'Unveiling of new generation of vehicle licence plates', 5 July 1997, archived, accessed 2026-08-02: 'Until now we have been getting just four or five years from each licence plate series and with the current nine series plates about to expire, Transport was keen to develop something which will provide long-term consistency' — the government's own corroboration of the 9 block and of the four-to-five-year series cadence this series ended"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Western_Australia  # secondary (CC BY-SA; facts in our expression per the PRD-PLATES §4 Wikipedia rule), accessed 2026-08-02: the October 1978 start at 6AA-000, the 6-9 leading-digit range, the black-on-yellow colours, the 9MZ-999 and 9RZ-999 endings, and the February 2025 Nostalgia reissue. The 1978 sentence is footnoted in the article to a print periodical ('Registration Notes, Fleetline issue 41, December 1978, page 4') which was NOT obtained"
    notes: >-
      WESTERN AUSTRALIA'S PREVIOUS GENERAL ISSUE, 1978-1997, AUTHORED IN THE
      COMPLETION PASS. The first pass of this file deliberately left it out and
      said so ("the Minister names it only as 'the current nine series plates',
      which is not a format description, and it is a recorded gap rather than a
      guessed series"). That was right under a locator-only reading of the
      Wikipedia row of PRD-PLATES §4; under the owner's 2026-08-02 override the
      description may be EXTRACTED provided it is tagged, and a tagged
      description that the Minister's own sentence independently corroborates is
      better data than an empty gap. Both boundaries are secondary: 1978 from
      the article (itself footnoted to a print periodical that was not
      obtained), 1997 from the successor's own government start date, which is
      the firmer of the two. WHAT THIS SERIES BUYS THE PARSE LAYER: a WA string
      with a leading digit and SIX following characters is the current series; a
      leading digit with FIVE following characters is this one — the 1997
      redesign added a character, which the Minister states in terms ("The new
      general purpose plates contain seven characters"). That is a clean,
      government-sourced length discriminator between two eras.

  # =========================================================================
  # DISTRICT SERIES — the only geographic encoding found in any Australian
  # plate in this wave, and the department describes the mechanism itself.
  # =========================================================================
  - id: au-wa-district-series
    class: standard
    categories: [car, van, truck, motorcycle, trailer]
    period: { start: 1997 }        # UPPER BOUND. See notes: the department
                                   # dates neither the scheme nor its plates;
                                   # 1997 is the Brand WA colourway boundary
                                   # its own page draws, not a scheme start.
    period_evidence: instrument-in-force-upper-bound
    matching: recall-only
    format:
      pattern: "LL 999"
      regex: '\A[A-Z]{2} ?[A-Z0-9]{1,5}\z'
      evidence: partial
      charset:
        notes: >-
          THE PREFIX IS SOURCED, THE REST IS NOT. Department of Transport,
          verbatim: "District series plates are manufactured in numerical
          sequence with a District identifier as a prefix. For example, 'MH' for
          Mandurah." So the leading two letters are a DISTRICT CODE and the
          remainder is an ascending sequence — but the department publishes no
          code list and no sequence grammar, so the regex is deliberately wider
          than what is issued and `matching: recall-only` says so (PRD-PLATES
          §2.7). A match means "this could be a WA district plate", never "this
          is a valid one".
    design:
      colour_note: "the department, verbatim: 'The old-style District plates were issued in black characters on either a white or yellow background. Plates are now issued on the blue and white \"Brand WA\" format.' Same three colourways as the state series, same remake rules"
      plate: { w: 372, h: 134, unit: mm }
    eligibility: "the department, verbatim: 'These plates can be issued to motor vehicles, trailers and motorcycles owned by persons who reside in that Shire or District.' — a RESIDENCE test, which is what makes the prefix a real geographic claim rather than decoration"
    region_encoding: >-
      DISTRICT PREFIX, MECHANISM ONLY — NO DECODE TABLE IS AUTHORED. The
      department gives exactly one worked pair ('MH' = Mandurah) and publishes
      no list; Western Australia has some 137 local governments, so a decode
      table built from anything other than a departmental list would be a
      fabrication at scale. This is the honest opposite of the German
      Unterscheidungszeichen table: there, the codes are published in the
      Bundesanzeiger; here, they are not published at all. RECORDED GAP with a
      clear acceptance test — a DVS district-code list, if one exists, becomes
      plates/_decode/au-wa-districts.yml.
    related: "SPECIAL LOCAL AUTHORITY plates are a separate thing the department describes and does not issue: 'Special Local Authority plates may be available in a wider variety of colours and generally include the logo of the local authority/shire which issues the plate ... Prices for Special Local Authority plates are set by the local authority/shire.' Not authored — the issuer is the shire, not DVS, and no format is published"
    sources:
      - "https://www.transport.wa.gov.au/licensing/plates/standard/district  # Department of Transport 'District series plates' (accessed 2026-08-02): the district identifier as a prefix with the Mandurah example, numerical-sequence manufacture, the residence eligibility test, the colourway history and remake range, the December 2021 conversion-to-optional-plate scheme, and Special Local Authority plates"
    notes: >-
      WA DISTRICT SERIES — THE ONE GEOGRAPHIC DECODE IN AUSTRALIAN PLATES, AND
      IT IS DELIBERATELY LEFT AS A MECHANISM. The department states the
      mechanism plainly and gives a single example; it publishes no code table.
      PRD-PLATES §2.4's rule is that open-ended or unpublished decodes get a
      mechanism note, not an invented table, and that is what this is. The
      period is an UPPER BOUND for an unusual reason worth stating: the
      department's own page dates nothing except a 2021 administrative change
      ("Eligible District series number plates can be converted to a District
      series optional plate from Monday 13 December 2021"), and the only era
      boundary it draws is the Brand WA colourway, which is the 1997 boundary
      the state series carries. So 1997 here means "this series was running by
      then", not "it started then" — district plates are much older.
gaps:
  - "The pre-1997 WA general issue: CLOSED IN THE COMPLETION PASS as au-wa-standard-1978, on tagged secondary evidence corroborated by the Minister's 'nine series' sentence. What remains open is a PRIMARY for it — a departmental plate-history page or a Government Gazette notice — and the exact October 1978 date, whose only footnote is a print periodical (Fleetline issue 41) that was not obtained"
  - "The Road Traffic (Vehicles) Regulations 2014 (WA) were not read (legislation.wa.gov.au URL scheme changed) — so this file states NO WA display rules, unlike the Queensland and Tasmanian files"
  - "District codes: mechanism recorded, table absent, acceptance test stated on the series"
  - "Trade plates, consular plates, corporate series plates and government/commercial plates all exist as named departmental products and are NOT authored here — the lean scope for this gate is current general issue plus one back plus core classes, and none of the four has a published grammar"
