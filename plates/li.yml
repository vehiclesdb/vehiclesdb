# plates/li.yml — Liechtenstein (PRD-PLATES gate L1, microstates group).
# DRAFT for verification. All primary text fetched from gesetze.li 2026-08-02.
#
# ---------------------------------------------------------------------------
# THIS IS A PRIMARY-SOURCED FILE. Liechtenstein has the best legal archive of
# the five microstates in this group: gesetze.li (Lilex) serves both the
# consolidated Landesrecht (LR) and the Landesgesetzblatt (LGBl) back to the
# 19th century, so nearly every claim below is quoted from an instrument.
# The instruments read in this pass:
#   * VZV — Verkehrszulassungsverordnung, LR 741.51, vom 1. August 1978,
#     LGBl. 1978 Nr. 20 (ausgegeben 31. August 1978), in force 1. September
#     1978. Art. 71-76 are the plate chapter; Art. 82 the moped plate.
#     https://www.gesetze.li/konso/1978.020
#   * VVV — Verkehrsversicherungsverordnung, LR 741.31, vom 1. August 1978,
#     LGBl. 1978 Nr. 21. Anhang 1a (zu Art. 19) is the provisional-plate spec
#     and the ONLY source for the customs "Z".
#   * The 1924 decree that started the FL series: Vollziehungs-Verordnung vom
#     4. Dezember 1924 zum Gesetze vom 10. Mai 1924 (LGBl. 1924 Nr. 6)
#     betreffend den Verkehr mit Fahrzeugen, LR 741.011, LGBl. 1924 Nr. 20,
#     ausgegeben 6. Dezember 1924, IN FORCE 1. JANUAR 1925.
#   * The 1915 decree behind it: Verordnung vom 12. August 1915 betreffend die
#     Lenkung und Kennzeichnung der Kraftfahrzeuge, LR 741.5, LGBl. 1915
#     Nr. 13, ausgegeben 18. August 1915.
#   * Wappengesetz vom 30. Juni 1982, LR 120, LGBl. 1982 Nr. 58, for the arms.
#   * LGBl. 2020 Nr. 349 and LGBl. 2021 Nr. 307 — the two amendments that date
#     the modern colour system and the red repeater plate.
#
# ---------------------------------------------------------------------------
# FIVE STRUCTURAL FACTS THAT SHAPE THIS FILE
# ---------------------------------------------------------------------------
#
# 1. THE INSTRUMENT-DATE RULE, TWICE, IN TEXTBOOK FORM. Liechtenstein is the
#    jurisdiction in this group where the trap is most visible, and both cases
#    are resolved from the instruments themselves:
#      (a) THE FL SERIES. The decree is dated 4 December 1924 and was published
#          on 6 December 1924 — but its own closing article reads "Diese
#          Verordnung tritt am 1. Januar 1925 in Kraft." The FL series
#          therefore starts in 1925, NOT 1924. Every secondary account of
#          Liechtenstein plates dates the system to "1924"; the instrument
#          says otherwise, and the instrument is the authority.
#      (b) THE RED REPEATER PLATE. The amending ordinance is dated 5 October
#          2021 and was published 8 October 2021, but it split its own
#          commencement: "Diese Verordnung tritt vorbehaltlich Abs. 2 am
#          1. November 2021 in Kraft. 2) Art. 69 Abs. 6, Art. 71 Abs. 1 Bst. g
#          und Abs. 4 sowie Art. 72 Abs. 3 Bst. d treten am 1. März 2022 in
#          Kraft." The plate provisions commence 1 March 2022 — four months
#          after the rest of the same instrument. Shipping either the signature
#          date or the general commencement date would be wrong.
#
# 2. THE COLOUR SYSTEM IS ONLY 2021 LAW, THOUGH THE PLATES ARE MUCH OLDER —
#    and this is the subtlest dating fact in the file. VZV Art. 71 Abs. 1 today
#    is a closed seven-colour enumeration. In the ORIGINAL 1978 text it named
#    plate TYPES with no colours at all, and Abs. 4 delegated them: "Die
#    Regierung legt die Grund- und Schriftfarbe der Kontrollschilder fest."
#    The enumeration was written into the ordinance by LGBl. 2020 Nr. 349
#    (Verordnung vom 17. November 2020, in force 1. Januar 2021). So a colour
#    claim below is INSTRUMENT-GRADE from 2021 and AGENCY-GRADE before it, and
#    each series says which. The plates themselves are far older than 2021 —
#    treating 2021 as a series start would be exactly the Spanish error.
#
# 3. THE PLATE BINDS TO THE HALTER, AND HAS DONE SINCE 1924. VZV Art. 76
#    Abs. 1: "Die einmal zugeteilte Schildnummer bleibt für den Halter
#    reserviert." Abs. 5: the plates "bleiben Eigentum des Staates". The 1924
#    decree already said it, in Art. 30 Abs. 2: "Diese Schilder werden der
#    Person des Wageneigentümers zugeteilt und sind nicht übertragbar." That is
#    a hundred years of unbroken owner-binding, quotable at both ends. Hence
#    `binding: owner`. A vehicle-keyed consumer must not join on a Liechtenstein
#    plate.
#
# 4. LIECHTENSTEIN'S PLATE LAW IS AUTONOMOUS — SWISS LAW IS *NOT* INCORPORATED.
#    This was tested rather than assumed, because the customs union and the
#    near-identical drafting invite the opposite conclusion. Liechtenstein
#    enacts its own full-text ordinances and MIRRORS the Swiss LR numbering
#    (VZV 741.51, VVV 741.31, VTS 741.41 — the same numbers as the Swiss SR),
#    which makes the convergence look like incorporation. It is not. The VZV's
#    enabling clause is purely domestic ("Aufgrund von Art. 11 bis 14, 23,
#    50 Abs. 3, Art. 51, 53 und 99 des Strassenverkehrsgesetzes (SVG) vom
#    30. Juni 1978, LGBl. 1978 Nr. 18"); Art. 2 defines VVV/VTS/VRV as the
#    LIECHTENSTEIN ordinances; and a sweep of the VZV, VTS and SVG for
#    "schweizerisch|Schweiz" finds Swiss law incorporated only in narrow named
#    domains — the Swiss motor-vehicle tax, ASTRA type-approval reporting, the
#    heavy-vehicle charge and cross-border insurance — and NEVER for plates.
#    CONSEQUENCE, and it is a rule for this file: no Swiss instrument is cited
#    for a Liechtenstein fact anywhere below. The resemblance to ch.yml is a
#    drafting fact, not a legal one.
#
# 5. THE NUMBER RANGES ARE NOT IN THE LAW. Every range in circulation —
#    FL 1-20 for official vehicles, FL 101-300 for dealers, FL 50000-50299 for
#    day plates, FL 90000-92999 for provisional, the yellow motorcycle block —
#    is ABSENT from the VZV. Art. 73 Abs. 2 mandates only that numbering run
#    separately per vehicle family and per plate type "in aufsteigender
#    Reihenfolge". The ranges live in the Amt für Strassenverkehr's "Weisungen
#    über die Kontrollschilder" (1 January 2015), a sub-legal instrument. NO
#    RANGE IS ASSERTED AS LAW IN THIS FILE; where a range appears it is marked
#    agency-level or is omitted.
#
# ---------------------------------------------------------------------------
# REGEX POLICY (PRD-PLATES §2.7 tiers)
# ---------------------------------------------------------------------------
#   regex            the printed form: literal FL, an optional separator, and
#                    1-5 digits. THE DIGIT CEILING IS NOT IN THE ORDINANCE —
#                    see common.numbering.digit_ceiling.
#   regex_statutory  drops the ceiling to \d+, because that is the honest outer
#                    legal bound: no provision caps the Kontrollnummer.
#   regex_strict     used only where a digit WIDTH is actually sourced — which
#                    happens exactly once, on the moped plate, where Art. 82
#                    Abs. 6 says "die 5-stelligen Kontrollschildnummern".
#
# period_evidence VOCABULARY used in this file:
#   instrument-in-force              the instrument's own commencement date
#   instrument-in-force-upper-bound  the earliest instrument READ carrying the
#                                    series; earlier ones exist and were not
#                                    read, so the start is an UPPER bound
#   instrument-dated-both-ends       start AND end each fixed by an instrument
#   statutory-date                   a date stated in the instrument's text
#   secondary-wikipedia              WIKIPEDIA-DERIVED (mandatory tag)
#
# All of these except `secondary-wikipedia` are values already in use across
# plates/*.yml; the field is open and descriptive, and nothing is coined here.
# `secondary-wikipedia` is the mandatory tag for Wikipedia-derived facts and is
# used in this file only on the 1915 colour claim, which is the single
# non-instrument fact in the whole dossier.
#
# format_evidence VOCABULARY: statutory | agency-weisung | secondary-wikipedia
# ---------------------------------------------------------------------------
jurisdiction: li
authority:
  name: Amt für Strassenverkehr (ASV), Fürstentum Liechtenstein — Verkehrszulassungsverordnung (VZV), LR 741.51
  url: "https://www.gesetze.li/konso/1978.020"
binding: owner
binding_note: >-
  VZV Art. 76 Abs. 1: "Die einmal zugeteilte Schildnummer bleibt für den Halter
  reserviert." Art. 76 Abs. 5: the plates, other than provisional ones, "bleiben
  Eigentum des Staates". The rule is original to the FL series itself — the
  1924 decree's Art. 30 Abs. 2 reads "Diese Schilder werden der Person des
  Wageneigentümers zugeteilt und sind nicht übertragbar." Every series in this
  file inherits `owner`.
instrument:
  citation: "Verkehrszulassungsverordnung (VZV) vom 1. August 1978, LR 741.51, LGBl. 1978 Nr. 20"
  ausfertigungsdatum: "1978-08-01"
  published: "1978-08-31"
  entry_in_force: "1978-09-01"
  enabling_act: "Strassenverkehrsgesetz (SVG) vom 30. Juni 1978, LGBl. 1978 Nr. 18, Art. 11-14, 23, 50 Abs. 3, 51, 53, 99"
  predecessor: "Verordnung vom 5. April 1977 zum Gesetz über den Strassenverkehr, LGBl. 1977 Nr. 29 — expressly replaced by VZV Art. 125"
  companion_instruments:
    - "Verkehrsversicherungsverordnung (VVV) vom 1. August 1978, LR 741.31, LGBl. 1978 Nr. 21"
    - "Gesetz vom 30. Juni 1982 über Wappen, Farben, Siegel und Embleme (Wappengesetz), LR 120, LGBl. 1982 Nr. 58"
  amendments_material_to_plates:
    - "LGBl. 2020 Nr. 349 — Verordnung vom 17. November 2020, ausgegeben 26. November 2020, in force 1. Januar 2021: rewrote Art. 71 Abs. 1 as the seven-colour enumeration and re-enacted Art. 72"
    - "LGBl. 2021 Nr. 307 — Verordnung vom 5. Oktober 2021, ausgegeben 8. Oktober 2021: inserted Art. 71 Abs. 1 Bst. g and Art. 72 Abs. 3 Bst. d (the red rear-load-carrier plate), IN FORCE 1. MÄRZ 2022"
    - "LGBl. 2001 Nr. 118 — repealed Art. 71 Abs. 2 Bst. b, the rental-car 'V' marking"
  source: "https://www.gesetze.li/konso/1978.020  # VZV front matter and Art. 125; consolidated text version 66"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts, cited once and referenced per series.
# ---------------------------------------------------------------------------
common:
  national_letters:
    value: "FL"
    rule: >-
      VZV Art. 73 Abs. 1, verbatim and in its entirety: "Liechtensteinische
      Motorfahrzeuge tragen als Unterscheidungszeichen die Buchstaben FL." The
      letters are on the plate itself — unlike Switzerland, where the country
      sign is a separate oval sticker — and there is no canton-style regional
      letter, because there is no subdivision to encode. Every Liechtenstein
      plate therefore begins FL and NOTHING in the string is geographic.
    origin: >-
      The FL letters are original to the 1924 decree: Art. 30 Abs. 1, "An jedem
      Motorwagen müssen zwei Schilder angebracht sein, die die Buchstaben FL und
      die Kontrollnummer tragen."
    etymology_note: >-
      The common story is that "L" was unavailable because Luxembourg held it,
      leaving "FL" for Fürstentum Liechtenstein. The CAUSAL claim is secondary.
      What IS primary is the pairing itself: Beilage A to the same 1924 decree
      lists the international distinguishing signs and carries both
      "Luxemburg: L" and "Liechtenstein: FL". So the two assignments are
      instrument-sourced even though the reason for the choice is not.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 73 Abs. 1"
      - "https://www.gesetze.li/chrono/html/1924020000  # LGBl. 1924 Nr. 20, Art. 30 Abs. 1 and Beilage A"
  pattern_dsl_limitation:
    status: RECORDED SCHEMA FINDING — affects every series in this file
    finding: >-
      THE HUMAN-PATTERN DSL CANNOT SPELL A LITERAL "L", AND LIECHTENSTEIN IS THE
      JURISDICTION WHERE THAT BITES HARDEST. PRD-PLATES §2.2 defines the pattern
      alphabet as "9=digit L=letter, literal separators as printed", and
      lint_plates.rb implements it by substituting EVERY "9" and EVERY "L" in a
      pattern with a random digit or letter. There is no escape mechanism. So
      the pattern "FL 99999" does not mean what it looks like — the lint reads
      it as "F, any letter, space, five digits" and generates strings like
      "FQ 96884", which the sourced regex correctly rejects.
    consequence: >-
      Every ordinary series here spells `pattern: "LL 99999"` and carries
      `regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'` so the round-trip holds, with the
      SOURCED grammar in `regex_strict: '\AFL[- ]?\d{1,5}\z'`. This follows the
      precedent ch.yml sets for the Swiss canton codes, and `matching` stays
      `strict` on the same reading: the widening is an artefact of the notation,
      not a deliberate over-broad regex, and `regex_strict` is where the
      authority's own grammar lives.
    caution_for_consumers: >-
      A consumer that reads only `format.pattern` or only `format.regex` for
      Liechtenstein will conclude the first two characters vary. THEY DO NOT.
      Read `regex_strict`, or read `common.national_letters`.
    recommended_amendment: >-
      A schema amendment would fix this properly — either an escape in the
      pattern DSL (e.g. a quoted literal) or a `format.literal_prefix` field.
      Recorded here rather than acted on, because inventing notation in a data
      PR is exactly what PRD-PLATES §2.6 forbids for separators and the same
      discipline applies to the pattern alphabet. The same limitation forced
      sm.yml to model the San Marino POLIZIA legend as plate furniture rather
      than as part of the serial.
  numbering:
    rule: >-
      VZV Art. 73 Abs. 2, verbatim: "Die Nummerierung beginnt für Motorwagen,
      Motoreinachser und Anhänger einerseits und Motorräder, Klein- und
      dreirädrige Motorfahrzeuge anderseits separat sowie für jede Schilderart
      nach Grundfarbe und besonderer Kennzeichnung getrennt und erfolgt in
      aufsteigender Reihenfolge. Über Ausnahmen entscheidet die Regierung."
    consequences:
      - "Number spaces are split per BACKGROUND COLOUR and per SPECIAL MARKING, and additionally between the motorcar/single-axle/trailer family and the motorcycle/small/three-wheeler family. A number therefore repeats across colours: the same digits can exist simultaneously as a black car plate, a light-blue work-vehicle plate and a light-green agricultural plate."
      - "TRAILERS SHARE THE MOTORCAR NUMBER SPACE, exactly as in Switzerland — Art. 73 Abs. 2 groups 'Motorwagen, Motoreinachser und Anhänger' as one series. A Liechtenstein trailer registration is not distinguishable from a car registration by its string alone."
      - "A Liechtenstein plate encodes NO date and NO geography. There is no era inference to be had from the number, and the country has no subdivisions to encode."
      - "'in aufsteigender Reihenfolge' is the whole of the progression rule. It does NOT state a starting number and does NOT forbid leading zeros; no no-leading-zero claim is made anywhere in this file."
    digit_ceiling: null
    digit_ceiling_note: >-
      RECORDED GAP, and the reason every `regex` below is a practical rather
      than a legal bound. NOTHING in the VZV caps the number of digits in a
      Kontrollnummer. Five digits is the widest form the agency's own number
      ranges reach, so `regex` uses \d{1,5}; `regex_statutory` drops the ceiling
      to \d+ because that is the honest outer legal bound. The ONE sourced width
      in the file is the moped plate's, where Art. 82 Abs. 6 says
      "die 5-stelligen Kontrollschildnummern" in terms.
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 73 Abs. 2"
  colours:
    rule: >-
      VZV Art. 71 Abs. 1 is a CLOSED seven-item enumeration and is the whole
      Liechtenstein colour system: "Es werden abgegeben: a) Kontrollschilder mit
      schwarzem Grund und weisser Schrift für Motorwagen, Motorräder, Klein- und
      dreirädrige Motorfahrzeuge, Motoreinachser und Anhänger; b)
      Kontrollschilder mit hellblauem Grund und schwarzer Schrift für
      Arbeitsfahrzeuge; c) Kontrollschilder mit hellbraunem Grund und schwarzer
      Schrift für Ausnahmefahrzeuge; d) Kontrollschilder mit hellgrünem Grund
      und schwarzer Schrift für land- und forstwirtschaftliche Fahrzeuge; e)
      Kontrollschilder mit gelbem Grund und schwarzer Schrift für
      Kleinmotorräder und Leichtmotorfahrzeuge; f) Kontrollschilder mit
      schwarzem Grund und gelber Schrift für Fahrzeuge mit einer Tageszulassung;
      g) Kontrollschilder mit rotem Grund und weisser Schrift für hintere
      Lastenträger an Motorwagen (Kontrollschild für hintere Lastenträger)."
    dating: >-
      CRITICAL AND EASY TO GET WRONG. This enumeration is NOT 1978 law. The
      original Art. 71 Abs. 1 named plate types without colours, and Abs. 4
      delegated the colours to the government: "Die Regierung legt die Grund-
      und Schriftfarbe der Kontrollschilder fest." The colour list was inserted
      by LGBl. 2020 Nr. 349, in force 1 January 2021 (consolidated-text footnote
      411: "Art. 71 Abs. 1 abgeändert durch LGBl. 2020 Nr. 349"); item g was
      inserted later still, by LGBl. 2021 Nr. 307, in force 1 March 2022. A
      colour claim in this file is therefore instrument-grade from 2021 and
      agency-grade before it, and each series says which. The PLATES are older
      than the colour law; the colour law is not a series start.
    hex_basis_note: >-
      The ordinance NAMES colours in German and gives no RAL, Pantone or RGB
      value anywhere — the same situation ch.yml and de.yml record. Every hex
      below is `hex_basis: observed`, chosen as a conventional rendering of the
      German colour word, and MUST NOT be treated as a spec value. There is no
      chromaticity table of the Spanish Anexo XVIII kind to anchor to.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 lit. a-g, with footnotes 411 and 412 dating lit. a-f to LGBl. 2020 Nr. 349 and lit. g to LGBl. 2021 Nr. 307"
      - "https://www.gesetze.li/chrono/html/1978020000  # the ORIGINAL 1978 text, showing Art. 71 Abs. 1 without colours and Abs. 4 delegating them"
  special_markings:
    rule: >-
      VZV Art. 71 Abs. 2 is the closed list of specially-marked plates: "Besonders
      gekennzeichnet werden: a) die Schilder für die provisorische Zulassung nach
      Art. 19 VVV; b) Aufgehoben; c) die Händlerschilder mit dem Buchstaben 'U';
      d) Aufgehoben".
    repealed_items:
      - "Bst. b was the RENTAL-CAR marking, the letter 'V' — present in the 1978 original as 'die Schilder für Mietwagen mit dem Buchstaben \"V\"' and repealed by LGBl. 2001 Nr. 118. Modelled as li-rental-v, ENDED 2001."
      - "Bst. d was repealed by LGBl. 2020 Nr. 349. Its former content was not read in this pass and is a recorded gap; no series is asserted for it."
    consequence: >-
      Anything NOT on this list carries an unmarked plate. That is a sourced
      NEGATIVE and it kills series a naive reading would invent: there is no
      taxi marking, no historic marking and no electric marking in Liechtenstein
      law, and government and police vehicles carry ordinary black plates
      distinguished only by low agency-allocated numbers, not by any provision
      of the ordinance.
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 2 lit. a-d"
  dimensions:
    rule: >-
      VZV Art. 72 Abs. 3, verbatim: "Die Kontrollschilder weisen folgende
      Formate auf, wobei die Ecken mit einem Radius von 1 cm abgerundet sind:
      a) Das vordere Schild für Motorwagen sowie das Schild für Motoreinachser,
      landwirtschaftliche Fahrzeuge und Arbeitsanhänger haben eine Länge von
      30 cm und eine Höhe von 8 cm. b) Das hintere Schild für Motorwagen sowie
      das Schild für Transportanhänger an Motorwagen haben entweder eine Länge
      von 30 cm und eine Höhe von 16 cm (Hochformat) oder eine Länge von 50 cm
      und eine Höhe von 11 cm (Langformat). c) Das Schild für Motorräder, Klein-
      und dreirädrige Motorfahrzeuge, Kleinmotorräder und Leichtmotorfahrzeuge
      sowie für ihre Anhänger hat eine Länge von 18 cm und eine Höhe von 14 cm;
      d) Das Kontrollschild für hintere Lastenträger an Motorwagen hat eine
      Länge von 50 cm und eine Höhe von 11 cm (Langformat)."
    front_motorcar: { w: 300, h: 80, unit: mm, corner_radius_mm: 10 }
    rear_motorcar_hochformat: { w: 300, h: 160, unit: mm, corner_radius_mm: 10 }
    rear_motorcar_langformat: { w: 500, h: 110, unit: mm, corner_radius_mm: 10 }
    motorcycle: { w: 180, h: 140, unit: mm, corner_radius_mm: 10 }
    rear_load_carrier: { w: 500, h: 110, unit: mm, corner_radius_mm: 10 }
    moped: { w: 100, h: 140, unit: mm, note: "NOT in Art. 72 — Art. 82 Abs. 6 states it separately: 'Kontrollschilder für Motorfahrräder sind 14 cm hoch und 10 cm breit.'" }
    divergence_from_ch_note: >-
      Art. 72 Abs. 3 Bst. c differs materially from the Swiss Art. 83 Abs. 3:
      Liechtenstein puts Kleinmotorräder and Leichtmotorfahrzeuge on the SAME
      180 x 140 mm plate as motorcycles, where Switzerland gives them a separate
      100 x 140 mm format. The 100 x 140 mm size exists in Liechtenstein only
      for MOTORFAHRRÄDER (mopeds), under Art. 82 Abs. 6. This is a real
      divergence between two near-identical ordinances and it is the kind of
      detail a copy-from-Switzerland approach would get wrong.
    dating_note: "Art. 72 was wholly re-enacted by LGBl. 2020 Nr. 349 (footnote 417); Bst. d was added by LGBl. 2021 Nr. 307 with effect 1 March 2022."
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 72 Abs. 3 lit. a-d and Art. 82 Abs. 6"
  layout:
    rule: >-
      VZV Art. 74, verbatim: "1) Auf dem vorderen Kontrollschild sind von links
      nach rechts das Landeszeichen FL, das kleine Staatswappen und die Zahlen
      aufgetragen. 2) Auf dem hinteren Kontrollschild sind aufgetragen: a) oben
      links das Landeszeichen FL, oben rechts das kleine Staatswappen und
      darunter die Zahlen; oder b) von links nach rechts das Landeszeichen FL,
      das kleine Staatswappen und die Zahlen. 3) Auf Kollektivschildern
      (Händlerschilder) ist am rechten Schilderrand zudem der Buchstabe 'U'
      aufgetragen."
    arms_is_the_separator: >-
      NOTE FOR THE RENDER LAYER AND FOR ANY CONSUMER READING `pattern`. The
      thing that sits between "FL" and the digits is not punctuation — it is the
      SMALL STATE ARMS. Liechtenstein has no printed separator glyph at all.
      This is the case _meta/separators.yml's `never_separator_note` anticipates
      for German and Austrian plates: an emblem between groups is a design
      element carried in `design.emblem`, never in the serial, and no consumer
      may treat it as a strippable character. Every `pattern` below spells a
      SPACE at that position and every `regex` accepts `[- ]?`, so a
      §2.6-conformant consumer canonicalising "FL 1234" reaches "FL1234"
      correctly.
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 74 Abs. 1-3"
  material:
    rule: >-
      VZV Art. 72 Abs. 1: "Die Kontrollschilder bestehen aus korrosionsbeständigem
      Metall; sie können mit einem reflektierenden oder nachleuchtenden Belag
      versehen sein." Art. 72 Abs. 2: "Das kleine Staatswappen sowie die
      Buchstaben und Zahlen sind auf 1.5 mm erhaben gepresst."
    finish_note: >-
      Retroreflection is PERMISSIVE ("können"), not mandatory, on the ordinary
      plates — hence `finish: retroreflective-optional` throughout. The single
      exception is the moped plate, where Art. 82 Abs. 6 requires a yellow
      reflective coating in terms ("weisen einen gelb reflektierenden Belag auf").
    embossing: "raised 1.5 mm — arms, letters and numbers alike; Liechtenstein plates are pressed metal, not printed"
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 72 Abs. 1-2, Art. 82 Abs. 6"
  arms:
    which: "das kleine Staatswappen"
    definition: >-
      Wappengesetz Art. 3 Abs. 2: "Das kleine Staatswappen ist das von Gold und
      Rot geteilte Herzschild des grossen Staatswappens unter dem Fürstenhut."
      Gold and red, party per bend, beneath the princely hat.
    plate_use_is_statutory: >-
      The plate is named in the arms statute itself. Wappengesetz Art. 12 Abs. 2
      lists where the small state arms are used and includes, in terms, "auf
      Kontrollschildern für Motorfahrzeuge". So the arms-on-plate fact has TWO
      independent instruments behind it — the VZV's layout article and the
      Wappengesetz's use article.
    rendered: placeholder
    licence_posture: >-
      PRD-PLATES §3's placeholder rule applies. The Wappengesetz reserves the
      state arms to the State and no affirmatively-clean licence route to the
      artwork was located, so the emblem slot renders as a neutral placeholder
      exactly as in ch.yml. Recorded honestly and NOT as legal advice: the
      Wappengesetz was read only for Art. 3 and Art. 12 in this pass, and its
      permitted-use provisions were not surveyed.
    history_gap: >-
      RECORDED GAP. The arms are widely reported to have appeared on the plate
      from 1 January 1925 and to have changed from blue-and-red to gold-and-red
      around 1961. NEITHER IS SUPPORTED BY AN INSTRUMENT read here: the 4
      December 1924 decree contains no arms provision at all (all 297 lines were
      read), and the reported 1961 Landtag decision was a spending approval that
      would appear in the parliamentary record rather than in the LGBl. The
      traceable legal thread is the arms statute line — Gesetz vom 4. Juni 1957,
      LGBl. 1957 Nr. 13, repealed and replaced by the 1982 Wappengesetz — and
      LGBl. 1957 Nr. 13 was NOT fetched in this pass.
    sources:
      - "https://www.gesetze.li/konso/html/1982058000  # Wappengesetz Art. 3 Abs. 2 and Art. 12 Abs. 2"
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 74"
  font:
    name: null
    statutory_basis: >-
      NO TYPEFACE IS NAMED AND NO SCHRIFTMUSTER IS ANNEXED. The VZV prescribes
      the embossing height (Art. 72 Abs. 2) and the layout (Art. 74) and says
      nothing about letterforms. This is the same finding the EU dossier records
      for the UK, Germany and Spain, reached here by absence rather than by
      delegation — Liechtenstein does not even delegate the question the way the
      Swiss ordinance does to the ASTRA.
    licence: >-
      No licensable font is mandated, so per PRD-PLATES §6 the render layer uses
      the schematic fallback and records the substitution. No third-party plate
      font is touched.
    source: "https://www.gesetze.li/konso/1978.020  # VZV Art. 72 Abs. 2, Art. 74 — the whole of what the ordinance says about characters"
  number_ranges:
    status: agency-level
    rule: >-
      NOT LAW. See structural fact 5. The allocation blocks in circulation are
      administered under the Amt für Strassenverkehr's "Weisungen über die
      Kontrollschilder" of 1 January 2015, issued under the VZV's delegation
      provisions. That document was NOT fetched in this pass, so no range is
      stated as fact anywhere in this file; where a series would be identified
      by its block alone, the block is described as agency-allocated and the
      regex does not encode it.
    source: "https://www.llv.li/serviceportal2/amtsstellen/amt-fuer-strassenverkehr/asv/weisungen-kontrollschilder-01012015.pdf  # AGENCY INSTRUMENT, located but NOT fetched — recorded as the place the ranges live"
  not_modelled:
    - "DIPLOMATIC PLATES ARE NOT MODELLED. A provision exists — Verordnung vom 21. April 1981 über Ausweise und Bewilligungen sowie Kontrollschilder und Kennzeichen im Strassenverkehr, LGBl. 1981 Nr. 64, Art. 18 — but it was NOT FETCHED in this pass, and secondary accounts suggest the regime was never implemented in practice. Modelling it from an unread article would be manufacturing. Recorded as a located-but-unread instrument and the single best target for the next pass."
    - "HISTORIC / VETERAN PLATES DO NOT EXIST as a plate class. Art. 71's colour list and Art. 71 Abs. 2's marking list are both closed and neither has a historic entry."
    - "TAXI PLATES DO NOT EXIST. Nothing in Art. 71 marks a for-hire vehicle."
    - "EXPORT PLATES DO NOT EXIST. Art. 71 is exhaustive and has no export series; the nearest regime is the provisional immatriculation of VVV Art. 19, modelled as li-provisional."
    - "GOVERNMENT AND POLICE PLATES ARE NOT SEPARATE SERIES. They are ordinary black Art. 71 Abs. 1 Bst. a plates carrying low agency-allocated numbers. The low blocks are administrative, not statutory — see common.number_ranges — so no series is created for them."
    - "MATTE-BLACK AND COLLECTOR/SOUVENIR PLATES are options and merchandise administered by the ASV, not distinct series in the ordinance."

region_encoding: none
region_encoding_note: >-
  Liechtenstein encodes NO geography in the plate and has no subdivision codes.
  The country has eleven Gemeinden and none of them appears in a registration.
  This is stated once here and repeated per series as `region_encoding: none`.

series:

  # =========================================================================
  # THE STANDARD SERIES — black ground, white script, FL + number.
  # The oldest continuously-running plate system in Europe, and the one
  # instrument-dated fact that most secondary accounts get wrong by a year.
  # =========================================================================
  - id: li-standard
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1925 }
    period_evidence: instrument-in-force
    period_note: >-
      1925, NOT 1924 — the instrument-date rule in its clearest form. The
      Vollziehungs-Verordnung is dated 4 December 1924 and was published on
      6 December 1924, and its Art. 30 Abs. 1 is what mandates the FL plate.
      But the decree's own commencement clause reads "Diese Verordnung tritt am
      1. Januar 1925 in Kraft." No FL plate could lawfully be issued under it
      before 1 January 1925. Secondary accounts uniformly say "1924", dating the
      system by the signature of the decree rather than by its commencement;
      that is precisely the error this dataset's period discipline exists to
      prevent, and it is corrected here from the instrument's own text.
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      charset:
        letters: "the literal pair FL and nothing else — VZV Art. 73 Abs. 1 fixes them for all Liechtenstein motor vehicles"
        notes: >-
          THERE IS NO VARIABLE LETTER ANYWHERE IN THE ORDINARY LIECHTENSTEIN
          SERIAL — FL is a constant, not an alphabet. That makes the `[A-Z]{2}`
          in `regex` a pure artefact of the human-pattern DSL (see
          common.pattern_dsl_limitation), and `regex_strict` carries the real
          and only grammar. A consumer wanting the truth should read
          `regex_strict` here, not `regex`. This is a stronger case than
          Switzerland's, where `[A-Z]{2}` at least stands for a real 26-member
          set; in Liechtenstein it stands for exactly one value.
      progression: >-
        VZV Art. 73 Abs. 2 — ascending order, with number spaces split per
        colour, per special marking and between the motorcar and motorcycle
        families. No date and no geography is encoded.
      separator_note: >-
        The gap between FL and the digits is occupied by the SMALL STATE ARMS,
        not by punctuation (Art. 74 Abs. 1). See common.layout.arms_is_the_separator.
        On the Hochformat rear plate the digits sit on a second line instead.
    design:
      plate: { w: 300, h: 80, unit: mm, note: "FRONT plate, corners rounded r=10 mm (Art. 72 Abs. 3 Bst. a)" }
      plate_variants:
        - { w: 300, h: 160, unit: mm, note: "REAR Hochformat, two-line (Art. 72 Abs. 3 Bst. b)" }
        - { w: 500, h: 110, unit: mm, note: "REAR Langformat, single-line (Art. 72 Abs. 3 Bst. b)" }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed, spec_note: "VZV Art. 71 Abs. 1 Bst. a names 'schwarzem Grund und weisser Schrift' with no RAL/RGB value" }
      foreground: "#FFFFFF"
      colour_dating_note: >-
        The BLACK/WHITE combination is instrument-sourced only from 1 January
        2021 (LGBl. 2020 Nr. 349). Before that the VZV delegated colour to the
        government, so black-on-white for the period 1978-2020 is agency-level,
        and for 1925-1978 it is not sourced here at all. The SERIES period is
        unaffected — see common.colours.dating.
      band: { side: none }
      band_note: "no Euro band and no national strip — Liechtenstein is not in the EU. The FL letters are ON the plate under Art. 73 Abs. 1, so no separate country oval is needed domestically."
      emblem:
        present: true
        rendered: placeholder
        position: "between the FL and the digits on the front and Langformat plates; upper right on the Hochformat rear plate (Art. 74 Abs. 1-2)"
        note: "das kleine Staatswappen — see common.arms"
      layout_front: "left to right: FL, small state arms, digits (Art. 74 Abs. 1)"
      layout_rear: "either FL upper left, arms upper right, digits below; or left to right FL, arms, digits (Art. 74 Abs. 2 Bst. a and b) — the ordinance permits BOTH"
      rear_differs: true
      rear_differs_note: >-
        TRUE, and in two ways at once: the rear plate has different DIMENSIONS
        from the front (300x160 or 500x110 against 300x80) and a different
        permitted LAYOUT (Art. 74 Abs. 2 allows a two-line arrangement the front
        plate does not have). Unlike Switzerland the emblem content is the same
        on both — Liechtenstein has no cantonal arms to add.
      display: "two plates, front and rear, since 1924: 'An jedem Motorwagen müssen zwei Schilder angebracht sein' (LGBl. 1924 Nr. 20, Art. 30 Abs. 1)"
    region_encoding: none
    notes: >-
      THE MAIN SERIES: black ground, white script, FL plus an ascending number,
      binding to the Halter. Modelled as ONE continuous series from 1925 because
      the defining grammar — FL plus a number, allocated to the owner — has not
      changed since the 1924 decree; what changed across the century is
      dimensions, materials, the arms and the colour's legal basis, all of which
      are design facts carried above rather than new series. A verifier who
      wants generation splits should note that no instrument read here draws
      one.
    sources:
      - "https://www.gesetze.li/chrono/html/1924020000  # LGBl. 1924 Nr. 20, Vollziehungs-Verordnung vom 4. Dezember 1924, Art. 30 Abs. 1 (FL + Kontrollnummer, two plates) and the commencement clause 'Diese Verordnung tritt am 1. Januar 1925 in Kraft'"
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. a (colours), Art. 72 Abs. 3 Bst. a-b (dimensions), Art. 73 (FL + numbering), Art. 74 Abs. 1-2 (layout), Art. 76 Abs. 1 (owner binding)"
      - "https://www.gesetze.li/konso/html/1982058000  # Wappengesetz Art. 12 Abs. 2 — the small state arms are used 'auf Kontrollschildern für Motorfahrzeuge'"

  # =========================================================================
  # THE COLOUR-DEFINED SPECIAL-USE SERIES (Art. 71 Abs. 1 Bst. b-f).
  # =========================================================================
  - id: li-workvehicle-blue
    class: standard
    categories: [machine, truck]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      1978 is an UPPER BOUND on the start, not the start. The VZV of 1 August
      1978 is the earliest instrument READ that carries a plate-type system;
      its own predecessor, the Verordnung vom 5. April 1977 (LGBl. 1977 Nr. 29),
      also enumerated plate types and was not fully read, so work-vehicle plates
      may well be older. The COLOUR is a separate and later fact — light blue
      enters the ordinance only on 1 January 2021.
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      progression: "own number space, separate from every other colour (Art. 73 Abs. 2)"
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#ADD8E6", finish: retroreflective-optional, hex_basis: observed, spec_note: "VZV Art. 71 Abs. 1 Bst. b names 'hellblauem Grund und schwarzer Schrift'; no RAL/RGB value exists" }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
    region_encoding: none
    notes: >-
      ARBEITSFAHRZEUGE — work vehicles. Light blue ground, black script. The
      string is indistinguishable from an ordinary plate, so the COLOUR is the
      only thing that identifies the series: a parse API cannot tell a blue
      work-vehicle registration from a black car registration from the text
      alone, and must not claim to.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. b, Art. 73 Abs. 2"

  - id: li-exceptional-brown
    class: standard
    categories: [truck, machine, trailer]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#D2B48C", finish: retroreflective-optional, hex_basis: observed, spec_note: "'hellbraunem Grund und schwarzer Schrift', Art. 71 Abs. 1 Bst. c; no RAL/RGB value" }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
    region_encoding: none
    notes: >-
      AUSNAHMEFAHRZEUGE — exceptional vehicles, i.e. those exceeding the
      ordinary weight or dimension limits. Light brown ground, black script.
      Same textual indistinguishability as the blue series: colour alone
      separates it.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. c"

  - id: li-agricultural-green
    class: agricultural
    categories: [tractor, machine, trailer]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
    design:
      plate: { w: 300, h: 80, unit: mm, note: "Art. 72 Abs. 3 Bst. a puts landwirtschaftliche Fahrzeuge on the 300x80 format, and they carry a SINGLE plate" }
      background: { color: "#90EE90", finish: retroreflective-optional, hex_basis: observed, spec_note: "'hellgrünem Grund und schwarzer Schrift', Art. 71 Abs. 1 Bst. d; no RAL/RGB value" }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      LAND- UND FORSTWIRTSCHAFTLICHE FAHRZEUGE — agricultural and forestry
      vehicles. Light green ground, black script, and one plate rather than two:
      Art. 72 Abs. 3 Bst. a groups them with the single-plate formats. Note the
      ordinance's category is wider than the colour article's heading suggests —
      Art. 72 says "landwirtschaftliche Fahrzeuge" where Art. 71 says "land- und
      forstwirtschaftliche Fahrzeuge".
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. d, Art. 72 Abs. 3 Bst. a"

  - id: li-lightmotor-yellow
    class: motorcycle
    categories: [motorcycle, quadricycle]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 9999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      progression: >-
        Own number space. Art. 73 Abs. 2 puts Motorräder, Klein- und
        dreirädrige Motorfahrzeuge in a DIFFERENT numbering family from
        motorcars, so a low number here is unrelated to a low number on a car
        plate.
    design:
      plate: { w: 180, h: 140, unit: mm, note: "Art. 72 Abs. 3 Bst. c — the SAME plate size as full motorcycles, which is where Liechtenstein diverges from Switzerland; see common.dimensions.divergence_from_ch_note" }
      background: { color: "#FFD700", finish: retroreflective-optional, hex_basis: observed, spec_note: "'gelbem Grund und schwarzer Schrift', Art. 71 Abs. 1 Bst. e; no RAL/RGB value" }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      KLEINMOTORRÄDER UND LEICHTMOTORFAHRZEUGE — small motorcycles and light
      motor vehicles. Yellow ground, black script, rear plate only. Distinct
      from li-moped, which is the MOTORFAHRRAD (moped) plate under Art. 82 and
      is a different size, a different legal regime and a mandatory-reflective
      finish.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. e, Art. 72 Abs. 3 Bst. c, Art. 73 Abs. 2"

  - id: li-day-registration
    class: temporary
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2021 }
    period_evidence: instrument-in-force
    period_caveat: >-
      READ THIS BEFORE TRUSTING THE START YEAR. 1 January 2021 is the date the
      COLOUR entry for day-registration plates (Art. 71 Abs. 1 Bst. f) entered
      the ordinance via LGBl. 2020 Nr. 349. It is almost certainly NOT the date
      the day-registration regime began — Tageszulassung is an old device and
      the underlying provision was not pinned in this pass. The start is
      recorded as 2021 because that is the only date an instrument supports,
      and this caveat exists so no consumer reads it as the regime's origin. A
      verifier should push this start back or re-cut the series.
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed, spec_note: "'schwarzem Grund und gelber Schrift', Art. 71 Abs. 1 Bst. f" }
      foreground: "#FFD700"
      foreground_note: >-
        YELLOW SCRIPT ON BLACK — the inverse-contrast twin of the standard
        series, and the only series in the file that shares the standard's black
        ground. Colour is the entire distinction, in both directions: the string
        is identical in shape and the ground is identical in colour.
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
    region_encoding: none
    notes: >-
      TAGESZULASSUNG — day registration, for short journeys on an unregistered
      vehicle. Black ground with YELLOW script, which is what separates it from
      the standard black-and-white plate. Its number block is agency-allocated
      and is not stated here (common.number_ranges).
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. f, inserted by LGBl. 2020 Nr. 349 with effect 1 January 2021"

  - id: li-rear-load-carrier
    class: trailer
    categories: [load-carrier]
    period: { start: 2022 }
    period_evidence: instrument-in-force
    period_note: >-
      THE SECOND TEXTBOOK INSTRUMENT-DATE CASE IN THIS FILE, and the cleanest
      in the dataset. The amending ordinance is dated 5 October 2021 and was
      published 8 October 2021. Its commencement article splits: "1) Diese
      Verordnung tritt vorbehaltlich Abs. 2 am 1. November 2021 in Kraft.
      2) Art. 69 Abs. 6, Art. 71 Abs. 1 Bst. g und Abs. 4 sowie Art. 72 Abs. 3
      Bst. d treten am 1. März 2022 in Kraft." The PLATE provisions are in
      subsection 2. So the series starts 1 March 2022 — not on the signature
      date, not on the publication date, and not on the instrument's general
      commencement date, all three of which fall in 2021. Three plausible wrong
      answers, one right one, and only the instrument distinguishes them.
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      progression: "repeats the number of the towing vehicle's plate — this plate carries no independent number space"
    design:
      plate: { w: 500, h: 110, unit: mm, note: "Langformat only — Art. 72 Abs. 3 Bst. d gives this plate ONE format, unlike the standard series" }
      background: { color: "#CC0000", finish: retroreflective-optional, hex_basis: observed, spec_note: "'rotem Grund und weisser Schrift', Art. 71 Abs. 1 Bst. g" }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      KONTROLLSCHILD FÜR HINTERE LASTENTRÄGER — the red repeater plate for a
      rear-mounted load carrier (a bicycle rack or similar) that obscures the
      real plate. Its validity is CONDITIONAL, and the ordinance says so in
      terms: Art. 71 Abs. 4, "Das Kontrollschild für hintere Lastenträger nach
      Abs. 1 Bst. g ist nur gültig, wenn es zusammen mit den zwei am Motorwagen
      angebrachten schwarzen Kontrollschildern nach Abs. 1 Bst. a verwendet
      wird." It is therefore never an independent registration — it is a
      repeater, and a consumer must not treat a red plate as a vehicle's
      registration in its own right.
    sources:
      - "https://www.gesetze.li/chrono/html/2021307000  # LGBl. 2021 Nr. 307, Verordnung vom 5. Oktober 2021, the split commencement clause putting Art. 71 Abs. 1 Bst. g in force on 1 March 2022"
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 1 Bst. g, Art. 71 Abs. 4 (the validity condition), Art. 72 Abs. 3 Bst. d (500x110 mm)"

  # =========================================================================
  # THE MOPED PLATE — its own article, its own size, its own rules, and the
  # only sourced digit width in the file.
  # =========================================================================
  - id: li-moped
    class: moped
    categories: [moped]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{5}\z'
      regex_strict: '\AFL[- ]?\d{5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      charset:
        notes: >-
          THE ONE SOURCED DIGIT WIDTH IN THIS FILE. Art. 82 Abs. 6 says
          "die 5-stelligen Kontrollschildnummern" — five-digit numbers, in
          terms. Every other series in this file uses \d{1,5} as a practical
          bound because the ordinance caps nothing; here the five is the
          ordinance's own word, so `regex` states it exactly and no
          `regex_strict` is needed.
      separator_note: >-
        The moped plate's layout is different again: Art. 82 Abs. 6 puts FL at
        the TOP with the insurance vignette beside it and the five digits BELOW,
        on two lines. The pattern spells a space for the break.
    design:
      plate: { w: 100, h: 140, unit: mm, note: "Art. 82 Abs. 6, stated as 14 cm high and 10 cm wide — PORTRAIT, and the only portrait format in Liechtenstein" }
      background: { color: "#FFD700", finish: retroreflective, hex_basis: observed, spec_note: "Art. 82 Abs. 6 requires a yellow reflective coating in terms — 'weisen einen gelb reflektierenden Belag auf'. This is the ONLY series where reflection is mandatory rather than optional." }
      foreground: "#000000"
      band: { side: none }
      emblem:
        present: false
        note: "the moped plate carries NO coat of arms — Art. 82 Abs. 6 lists FL, the insurance vignette and the number, and the arms are absent from that list. A sourced negative, and a real difference from every other Liechtenstein plate."
      vignette: { present: true, position: "top, beside the FL", note: "Versicherungsvignette — the insurance sticker is part of the prescribed layout, not an add-on" }
      layout: "FL top left, insurance vignette beside it, the five-digit number below on two lines (Art. 82 Abs. 6)"
      rear_differs: false
    region_encoding: none
    notes: >-
      MOTORFAHRRAD (moped) plates, governed by their own article rather than by
      the Art. 71/72 scheme. Four things set them apart and all four are
      statutory: a portrait 100x140 mm format, MANDATORY yellow reflective
      material, NO coat of arms, and an integral insurance vignette. The
      five-digit width is the only digit count the Liechtenstein ordinance
      states anywhere.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 82 Abs. 6, verbatim: 'Kontrollschilder für Motorfahrräder sind 14 cm hoch und 10 cm breit. Sie sind aus korrosionsbeständigem Metall und weisen einen gelb reflektierenden Belag auf. Buchstaben und Zahlen haben eine schwarze Farbe. Oben sind das Landeskennzeichen FL, daneben die Versicherungsvignette und darunter auf zwei Linien die 5-stelligen Kontrollschildnummern erhaben eingepresst.'"

  # =========================================================================
  # MARKED SERIES — the letter suffixes of Art. 71 Abs. 2 and the VVV.
  # =========================================================================
  - id: li-dealer-u
    class: dealer
    categories: [car, van, truck, bus, motorcycle, moped, trailer, tractor, machine]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999 U"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}[- ]?U\z'
      regex_strict: '\AFL[- ]?\d{1,5}[- ]?U\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+[- ]?U\z'
      format_evidence: statutory
      charset:
        notes: >-
          The U is a MARKING LETTER at the right-hand edge of the plate, not a
          serial character in the ordinary sense — but it is printed, it is
          part of what a reader sees, and it distinguishes the string, so it is
          carried in the pattern. Art. 74 Abs. 3 fixes its position: "am rechten
          Schilderrand".
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      layout: "as the standard plate, with the letter U added at the right-hand edge (Art. 74 Abs. 3)"
      rear_differs: true
    region_encoding: none
    notes: >-
      KOLLEKTIVSCHILDER (Händlerschilder) — dealer/trade plates, marked with the
      letter U and bound to a business rather than to a vehicle. Two provisions
      carry it: Art. 71 Abs. 2 Bst. c creates the marking, Art. 74 Abs. 3 places
      it at the right-hand edge. The colour follows the standard series because
      Art. 71 Abs. 1 Bst. a governs the ground and the U is a marking rather
      than a colour class.
    sources:
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 2 Bst. c and Art. 74 Abs. 3, verbatim: 'Auf Kollektivschildern (Händlerschilder) ist am rechten Schilderrand zudem der Buchstabe \"U\" aufgetragen.'"

  - id: li-rental-v
    class: dealer
    categories: [car, van, bus]
    period: { start: 1978, end: 2001 }
    period_evidence: instrument-dated-both-ends
    period_note: >-
      A CLEANLY CLOSED SERIES. The marking is in the 1978 VZV as originally
      enacted — Art. 71 Abs. 2 Bst. b, "die Schilder für Mietwagen mit dem
      Buchstaben 'V'" — and Bst. b was REPEALED by LGBl. 2001 Nr. 118. The start
      is an upper bound in the same sense as the other 1978 rows; the end is
      fixed by a repealing instrument, which is the strongest kind of end date
      available.
    matching: strict
    format:
      pattern: "LL 99999 V"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}[- ]?V\z'
      regex_strict: '\AFL[- ]?\d{1,5}[- ]?V\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+[- ]?V\z'
      format_evidence: statutory
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
    region_encoding: none
    notes: >-
      MIETWAGEN — rental cars, marked with the letter V. Repealed in 2001 and
      not reissued. Recorded because plates in circulation outlive their
      instruments and a parse API meeting an old V plate should be able to date
      it: a V marking places the registration before 2001. Liechtenstein and
      Switzerland repealed their equivalent rental markings within months of
      each other, from separately-enacted ordinances — a striking convergence
      that is NOT a legal relationship (structural fact 4).
    sources:
      - "https://www.gesetze.li/chrono/html/1978020000  # the ORIGINAL VZV text, Art. 71 Abs. 2 Bst. b: 'die Schilder für Mietwagen mit dem Buchstaben \"V\"'"
      - "https://www.gesetze.li/konso/1978.020  # the consolidated text showing Art. 71 Abs. 2 Bst. b as 'Aufgehoben', repealed by LGBl. 2001 Nr. 118"

  - id: li-provisional
    class: temporary
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}\z'
      regex_strict: '\AFL[- ]?\d{1,5}\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+\z'
      format_evidence: statutory
      separator_note: >-
        The distinguishing mark is a raised vertical RED BAR after the number,
        not a character — it cannot appear in the serial and does not appear in
        the pattern. The plate string alone is indistinguishable from an
        ordinary registration.
    design:
      plate: { w: 300, h: 80, unit: mm, note: "VVV Anhang 1a Ziff. 2: provisional plates follow VZV Art. 72 and 74 for construction and lettering" }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      red_bar:
        present: true
        color: "#CC0000"
        front_and_motorcycle: { w: 33, h: 67, unit: mm }
        rear_motorcar: { w: 36, h: 75, unit: mm }
        note: "raised, vertical, immediately after the number. The year preceding the expiry year is stamped INTO the bar (VVV Anhang 1a Ziff. 4)."
      rear_differs: true
    region_encoding: none
    notes: >-
      PROVISORISCHE ZULASSUNG — provisional registration under VVV Art. 19. The
      spec lives in the INSURANCE ordinance, not the admission ordinance: VZV
      Art. 71 Abs. 2 Bst. a merely points at "Art. 19 VVV", and the physical
      description is in VVV Anhang 1a. Its identity is a physical feature (the
      embossed red bar) rather than anything in the string, so `matching` is
      strict on shape but a match cannot distinguish this series from
      li-standard — a limitation stated rather than hidden.
    sources:
      - "https://www.gesetze.li/konso/html/1978021000  # VVV, LGBl. 1978 Nr. 21, Anhang 1a (zu Art. 19) Bst. A Ziff. 2-4: the red bar, its dimensions, and the expiry-year stamping"
      - "https://www.gesetze.li/konso/1978.020  # VZV Art. 71 Abs. 2 Bst. a, pointing to Art. 19 VVV"

  - id: li-provisional-z
    class: temporary
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 1978 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LL 99999 Z"
      regex: '\A[A-Z]{2}[- ]?\d{1,5}[- ]?Z\z'
      regex_strict: '\AFL[- ]?\d{1,5}[- ]?Z\z'
      regex_statutory: '\A[A-Z]{2}[- ]?\d+[- ]?Z\z'
      format_evidence: statutory
      charset:
        notes: >-
          The Z is printed in addition to the red bar and IS visible in the
          string, which is what makes this series textually distinguishable
          where plain li-provisional is not.
    design:
      plate: { w: 300, h: 80, unit: mm }
      background: { color: "#000000", finish: retroreflective-optional, hex_basis: observed }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      red_bar:
        present: true
        color: "#CC0000"
        front_and_motorcycle: { w: 33, h: 67, unit: mm }
        rear_motorcar: { w: 36, h: 75, unit: mm }
      rear_differs: true
    region_encoding: none
    notes: >-
      UNVERZOLLTE FAHRZEUGE — provisional plates for vehicles not yet cleared
      through customs, marked with an additional Z beside the red bar. The
      customs mark exists because Liechtenstein sits inside the Swiss customs
      area, so "not yet cleared" is a real and common status. THE Z IS FOUND
      NOWHERE IN THE VZV — its only legal source is VVV Anhang 1a Ziff. 3, and
      a researcher reading only the admission ordinance would miss it entirely.
    sources:
      - "https://www.gesetze.li/konso/html/1978021000  # VVV Anhang 1a (zu Art. 19) Bst. A Ziff. 3, verbatim: 'Die Schilder für provisorisch immatrikulierte Motorfahrzeuge tragen anschliessend an die Kontrollnummer einen erhaben gepressten, senkrechten roten Balken; Schilder unverzollter Fahrzeuge tragen zusätzlich den Buchstaben \"Z\".'"

  # =========================================================================
  # THE PRE-FL SERIES.
  # =========================================================================
  - id: li-l-1915
    class: standard
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 1915, end: 1925 }
    period_evidence: statutory-date
    period_note: >-
      START: the Verordnung of 12 August 1915 (LGBl. 1915 Nr. 13, published
      18 August 1915) creates the mark. The instrument carries no separate
      commencement clause that was located, so 1915 rests on the instrument's
      own date and publication. END: superseded when the FL decree came into
      force on 1 January 1925 — the same boundary li-standard opens on, from the
      same instrument, which is why the two periods meet exactly rather than
      being guessed.
    matching: strict
    format:
      pattern: "L 999"
      regex: '\A[A-Z][- ]?\d+\z'
      regex_strict: '\AL[- ]?\d+\z'
      format_evidence: statutory
      format_note: >-
        The instrument states the GRAMMAR but not the WIDTH: § 2 says the mark
        consists of the letter L and an arabic numeral, with no digit count and
        no ceiling. `\d+` is therefore the honest encoding of the digits — it is
        not a widening, because the ordinance really does set no ceiling, which
        is why this series is `strict` rather than `recall-only`.
        THE LETTER IS THE DSL PROBLEM, not the digits: see
        common.pattern_dsl_limitation. `regex` spells [A-Z] only because the
        human pattern's L is a TOKEN meaning "any letter"; `regex_strict`
        carries the sourced literal L. No `regex_statutory` twin appears because
        `regex` is already at the outer legal bound on the digits.
    design:
      background: { color: "#000000", finish: non-reflective, hex_basis: observed }
      foreground: "#FFFFFF"
      colour_caveat: >-
        NOT SOURCED. The white-on-black colouring is universally reported by
        secondary accounts, but the complete text of the 1915 decree was read
        and contains NO colour specification — it cross-refers instead to § 30
        of the Austrian Ministerialverordnung of 27 September 1905 (RGBl.
        Nr. 156), which was not fetched. The colour claim is therefore
        Wikipedia-grade and the hexes above are placeholders for it. Marked
        because it would be easy to assume a primary source here where there
        is none.
      colour_evidence: secondary-wikipedia
      band: { side: none }
      emblem: { present: false, note: "no arms provision in the 1915 decree" }
    region_encoding: none
    notes: >-
      THE PRE-FL MARK. Liechtenstein's first own registration mark: the letter L
      and an arabic number, replacing the Austrian "W" (Vorarlberg) plates used
      under the earlier Austrian-aligned regime. The decree also forbids
      carrying both marks at once — "Die gleichzeitige Anbringung
      liechtensteinischer und österreichischer Erkennungszeichen ist untersagt."
      RECORDED DISAGREEMENT: the 1915 decree names its own predecessor as the
      "Verordnung vom 10. Juni 1906, LGBl. 1906 Nr. 2", while secondary accounts
      date that 1906 ordinance to 18 June. The instrument says 10 June; LGBl.
      1906 Nr. 2 itself was not fetched to settle it.
    sources:
      - "https://www.gesetze.li/chrono/html/1915013000  # LGBl. 1915 Nr. 13, Verordnung vom 12. August 1915, § 2: 'Diese Erkennungszeichen bestehen in dem Bst. L und einer arabischen Zahl.'"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Liechtenstein  # SECONDARY (secondary-wikipedia): the white-on-black colouring and the preceding Austrian 'W' plates, neither of which the 1915 instrument states"
