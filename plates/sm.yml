        sigla AND the digits are red, unlike the diplomatic series where only
        the sigla is. No digit count is stated; \d{1,3} is a practical bound.
    design:
      plate: { w: 390, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#CC0000"
      foreground_note: "RED characters — sigla and digits alike, per the statute's own wording"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      SAMMARINESE RED CROSS. Class `government` under _meta/classes.yml as a
      civil body fleet with a distinct series; it is not `police` and not
      `military`. The red-on-white scheme is shared with no other current San
      Marino series.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020838.html  # Legge 10 marzo 1989 n. 23 art. 13"

  - id: sm-trailer-r
    class: trailer
    categories: [trailer, semitrailer]
    period: { start: 1986 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "R9999"
      regex: '\AR[- ]?\d{1,4}\z'
      format_evidence: statutory
      format_note: >-
        Decreto 151/1986 art. 2 lit. c: "Per i rimorchi i numeri di
        immatricolazione sono preceduti dalla lettera 'R' a rilievo di colore
        rosso dell'altezza di mm. 79, larghezza mm. 45 e con il tratto di mm.
        12,5." This is why R is excluded from the ordinary alphabet — a
        FUNCTIONAL reservation, not a legibility exclusion.
    design:
      plate: { w: 390, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      sigla_colour: { value: "#CC0000", note: "the R is RED; the digits are blue" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
      display: "rear only — Legge 23/1989 art. 13"
    region_encoding: none
    notes: >-
      TRAILERS. Numbering opened at 900 (Decreto 151/1986 art. 4). A separate
      REPEATER plate exists for carrelli appendice — a small red R, 21 mm high
