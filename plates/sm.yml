    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17106679.html  # DD 22/2019 art. 1(3)-(4) and art. 4"

  # =========================================================================
  # MARKED AND SPECIAL SERIES.
  # =========================================================================
  - id: sm-diplomatic-cd-1986
    class: diplomatic
    categories: [car, van]
    period: { start: 1986 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "CD999"
      regex: '\ACD[- ]?\d{1,3}\z'
      format_evidence: statutory
      format_note: >-
        Decreto 151/1986 art. 2 lit. a: "Per il Corpo Diplomatico i numeri di
        immatricolazione sono preceduti dalla sigla CD composta di lettere a
        rilievo di colore blu". DD 132/2022 art. 4 lit. a fixes the count at
        three and CHANGES THE SIGLA'S COLOUR TO RED: "i tre caratteri numerici
        di colore blu sono preceduti dalla sigla CD composta da caratteri
        alfabetici a rilievo di colore rosso." The digits stay blue.
    design:
      plate: { w: 390, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      sigla_colour: { value: "#CC0000", from: 2022, note: "CD in RED from DD 132/2022 art. 4 lit. a; blue before that (Decreto 151/1986 art. 2 lit. a)" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      DIPLOMATIC CORPS. Numbering opened at 01 under Decreto 151/1986 art. 4.
      The two-tone effect from 2022 — a red CD followed by blue digits — is
      unusual and is stated in the instrument rather than observed.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020523.html  # Decreto 151/1986 art. 2 lit. a and art. 4"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 4 lit. a — three digits and the red sigla"

  - id: sm-diplomatic-cd-1976
    class: diplomatic
    categories: [car, van]
    period: { start: 1976, end: 1986 }
    period_evidence: instrument-dated-both-ends
    period_note: >-
      Decreto 7 ottobre 1976 n. 55, posted in the Pubblico Palazzo on 8 October
      1976, creates the CD plate; Decreto 151/1986 art. 2 replaces the
      specification. The 1976 plate is a genuinely different object, not a
      restyling — see the design block.
    matching: strict
    format:
      pattern: "CD99"
      regex: '\ACD[- ]?\d{1,2}\z'
      format_evidence: statutory
      format_note: "'Numeri con due cifre' — two digits, stated in terms."
    design:
      plate: { w: 486, h: 109, unit: mm, note: "the single-line 486x109 format, quite unlike the 390x120 ordinary plate of the period" }
      background: { color: "#C8C8C0", finish: retroreflective, hex_basis: observed, spec_note: "'pellicola rifrangente termoadesiva di color grigio perla' — PEARL GREY, the only non-white ground in San Marino's plate history" }
      foreground: "#003399"
      layout: "left to right: RSM in blue (76 mm high, 15 mm stroke), the arms in a 50x75 mm rectangle in blue outlined red, CD in light blue (65 mm high, 19 mm stroke), then two blue digits (75 mm high, 15 mm stroke)"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
      rear_differs_note: "'Saranno dello stesso tipo sia la targa anteriore che quella posteriore.'"
    region_encoding: none
    notes: >-
      THE 1976 DIPLOMATIC PLATE — pearl grey, 486x109 mm, and one of only two
      places RSM survived on a San Marino plate after the ordinary series
      dropped it (the other being the 2006 historic plate). It also used TWO
      shades of blue at once: "blu" for RSM and the digits, "azzurro" for the CD
      sigla. Recorded because it is the sharpest counterexample to the idea that
      San Marino has always used one plate design.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17019324.html  # Decreto 7 ottobre 1976 n. 55, articolo unico"

  - id: sm-police
    class: police
    categories: [car, van, motorcycle]
    period: { start: 1986 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "999"
      regex: '\A\d{1,3}\z'
      printed_form: "POLIZIA 999"
      format_evidence: statutory
      format_note: >-
        THE SERIAL IS THE THREE DIGITS; "POLIZIA" IS PLATE FURNITURE, and the
        instrument supports that reading rather than merely permitting it. DD
        132/2022 art. 4 lit. b describes the word as "iscritta in un rettangolo
        a rilievo" — inscribed in a RAISED RECTANGLE — of 80x29 mm on the front
        plate and 103x37 mm on the rear, with a 3 mm stroke. A badge whose size
        differs between the front and rear plates is not a serial character; it
        is a device, like the arms. Decreto 151/1986 art. 2 lit. b had a single
        95x37 mm rectangle.
        SECOND REASON, and it is the honest one: the human-pattern DSL cannot
        spell a literal "L" — the lint reads every L in a pattern as "any
        letter", so "POLIZIA 999" would generate "POIIZIA 692". Even had the
        word been serial-significant it could not be written here. See
        li.yml's common.pattern_dsl_limitation for the same problem in a case
        where it genuinely hurt. `printed_form` records what a human reads off
        the plate, so nothing is lost.
      matching_caveat: >-
        A CONSEQUENCE A CONSUMER MUST SEE: with POLIZIA out of the serial, this
        series' regex is three digits and is therefore NOT DISCRIMINATIVE — it
        will match any short numeric string, including a Monegasque plate. The
        series is identified by the plate's furniture and colour, not by its
        string. `matching: strict` is still correct (the regex lies inside the
        issuing grammar), but a match is worth very little on its own.
    design:
      plate: { w: 390, h: 120, unit: mm }
      plate_front: { w: 300, h: 100, unit: mm, note: "follows the 2022 ordinary front size" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      legend: { text: "POLIZIA", color: "#CC0000", in_relief_rectangle: true, front: { w: 80, h: 29, unit: mm }, rear: { w: 103, h: 37, unit: mm } }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
      rear_differs_note: "TRUE and doubly so from 2022 — different plate size AND a different POLIZIA rectangle size front and rear."
    region_encoding: none
    notes: >-
      POLICE. ONE SERIES COVERS ALL THE CORPS: the current text says "Corpi di
      Polizia" in the plural and prescribes a single POLIZIA legend. That is why
      no separate Gendarmeria or Guardia di Rocca series appears in this file —
      see common.not_modelled, where the absence of a GE instrument is recorded
      as a searched-for negative rather than an oversight.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 4 lit. b"
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020523.html  # Decreto 151/1986 art. 2 lit. b and art. 3"

