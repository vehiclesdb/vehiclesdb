    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020523.html  # Decreto 151/1986 art. 2 lit. c-d, art. 4"

  - id: sm-prova
    class: dealer
    categories: [car, van, truck, motorcycle]
    period: { start: 2007 }
    period_evidence: instrument-in-force
    period_note: >-
      The current SPECIFICATION dates from Decreto Delegato 23 luglio 2007
      n. 87, which replaces art. 3 of Legge 19 settembre 1973 n. 31. The test-
      plate REGIME is much older — Legge 31/1973, published 24 September 1973 —
      so 2007 dates this plate's design, not the institution. The 1973 statute
