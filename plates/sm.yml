      replacement, so no earlier series is asserted.
    matching: strict
    format:
      pattern: "PROVA 999"
      regex: '\APROVA[- ]?\d{1,3}\z'
      format_evidence: statutory
      format_note: "three digits for cars, two for motorcycles (art. 1)"
    design:
      plate: { w: 390, h: 120, unit: mm, note: "motorcycle test plate 164x164 mm — note NOT 165x165 like the ordinary motorcycle plate" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      foreground_note: "BLACK, not blue — the test plate is the only current San Marino series with black characters"
      legend: { text: "PROVA", color: "#000000", w: 97, h: 37, stroke: 4, unit: mm }
      border: { color: "#000000", stroke: 5, unit: mm }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, note: "arms with the two-line legend in blue relief at the left" }
      rear_differs: false
    region_encoding: none
    notes: >-
      TEST / TRADE PLATES. Transferable between vehicles by the instrument's own
      words — "La targa è trasferibile da veicolo a veicolo" — which is what
      makes the class `dealer` rather than `temporary`. A bilateral Italy-San
      Marino arrangement on test-plate recognition is reported to have taken
      effect 1 May 1995; that agreement was NOT located in this pass and is not
      cited.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17023571.html  # Decreto Delegato 23 luglio 2007 n. 87 art. 1, replacing art. 3 of Legge 19 settembre 1973 n. 31"

  - id: sm-export-e
    class: export
    categories: [car, van, truck, motorcycle]
    period: { start: 1990 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "E9999"
      regex: '\AE[- ]?\d{1,4}\z'
      format_evidence: statutory
      format_note: >-
        Decreto 20 febbraio 1990 n. 34 art. 1: provisional plates for vehicles
        struck off the register "per esportazione all'estero" carry a RED letter
        E (79 mm high on cars, 53 mm on motorcycles) followed by BLACK digits.
        This is why E is excluded from the ordinary alphabet — the second
        functional reservation, alongside R.
      successor_format: >-
        A CHANGE IS PENDING AND ITS TRIGGER IS NOT A DATE. Decreto Delegato
        27 luglio 2026 n. 96 amends the grammar to a black number, then the red
        E, then three black digits — and commences it on EXHAUSTION rather than
        on a calendar date: "sono rilasciate a seguito dell'assegnazione
        dell'ultima targa con la sigla della composizione attuale." No new
        series is opened here because no start date exists yet to open it on;
        recorded so a verifier can open one when the rollover occurs. This is
        also the only exhaustion-triggered rollover written into San Marino law
        — see common.progression.letter_rollover_gap.
    design:
      plate: { w: 390, h: 120, unit: mm, note: "same dimensions as the Decreto 151/1986 ordinary plate, which the decree adopts by reference" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      foreground_note: "BLACK digits and black border — and the arms and legend are rendered 'in bianco e nero', the only monochrome arms in the system"
      sigla_colour: { value: "#CC0000", note: "the E is red" }
      expiry_sticker: { present: true, note: "'Su entrambi i tipi di targa va applicato un talloncino contenente i dati relativi alla scadenza'" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, note: "arms in BLACK AND WHITE" }
      rear_differs: false
    region_encoding: none
    notes: >-
      EXPORT / PROVISIONAL PLATES for vehicles leaving San Marino permanently.
      Distinguished from every other series by monochrome arms and black
      characters. Still live and still being amended in 2026.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17020984.html  # Decreto 20 febbraio 1990 n. 34 art. 1"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17159835.html  # Decreto Delegato 27 luglio 2026 n. 96, articolo unico — the pending grammar change and its exhaustion trigger"

  - id: sm-historic-h
    class: historic
    categories: [car, van, motorcycle]
    period: { start: 2006 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "H999"
      regex: '\AH[- ]?\d{3}\z'
      format_evidence: statutory
      format_note: >-
        A RED H followed by three BLUE digits, with RSM in blue also on the
        plate — one of only two places RSM survives on a San Marino plate. The
        front plate reads H, digits, RSM on one line; the rear puts RSM on the
        upper row and the H plus digits on the lower.
    design:
      plate: { w: 267, h: 63, unit: mm, note: "FRONT — 267x63 mm" }
      plate_rear: { w: 280.8, h: 203.6, unit: mm, note: "REAR — 280.8x203.6 mm, a tall near-square, and the most unusual plate geometry in this file" }
      background: { color: "#FFF4C1", finish: retroreflective, hex_basis: observed, spec_note: "'pellicola riflettente con effetto ingiallente' — a deliberately YELLOWING film, evoking aged plates. A striking spec: the instrument prescribes the appearance of age." }
      foreground: "#003399"
      sigla_colour: { value: "#CC0000", note: "the H is red" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, note: "a STYLISED arms in red and blue on the rear plate, not the full-colour arms of the ordinary series" }
      rear_differs: true
      rear_differs_note: "TRUE and dramatically so: 267x63 mm front against 280.8x203.6 mm rear, with different layouts."
    region_encoding: none
    notes: >-
      HISTORIC / COLLECTOR VEHICLES, from 2006. Issued by the Ufficio Registro
      Automezzi on the application of the Automobile Club San Marino /
      Automotoclub Storico Sammarinese under Legge 16 gennaio 1997 n. 8. The
      design deliberately evokes the pre-1976 plate, including the return of
      RSM. Motorcycles take the 165x165 mm square.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17023371.html  # Decreto 15 marzo 2006 n. 65 art. 2"

  - id: sm-agricultural-ma
    class: agricultural
    categories: [tractor, machine, trailer]
    period: { start: 1990 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "MA 9999"
      regex: '\AMA[- ]?\d{1,4}\z'
      format_evidence: statutory
      separator_note: >-
        PRINTED WITH DOTS as "M.A.". As with the 1922 RSM series, U+002E is
        forgiving-but-not-emitted under PRD-PLATES §2.6, so the pattern spells
        "MA" undotted and a conformant consumer canonicalises correctly.
      progression: "Decreto 47/1990 art. 2: numbering adopted from 1010 for macchine agricole"
    design:
      plate: { w: 165, h: 165, unit: mm }
      background: { color: "#FFD700", finish: retroreflective, hex_basis: observed, spec_note: "YELLOW reflective film — 'pellicola rifrangente di colore giallo'" }
      foreground: "#000000"
      foreground_note: "BLACK arms, legend, letters and digits on yellow"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      MACCHINE AGRICOLE. Yellow ground with black characters — the only yellow
      plate in the San Marino system, and the sibling of sm-machinery-mo, which
      the same decree creates in white and green.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17020997.html  # Decreto 19 aprile 1990 n. 47 artt. 1-2"

  - id: sm-machinery-mo
    class: agricultural
    categories: [machine]
    period: { start: 1990 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "MO 9999"
      regex: '\AMO[- ]?\d{1,4}\z'
      format_evidence: statutory
      separator_note: "printed with dots as 'M.O.' — see sm-agricultural-ma"
      progression: "Decreto 47/1990 art. 2: numbering adopted from 0001 for macchine operatrici"
    design:
