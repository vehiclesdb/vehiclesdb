  - id: sm-personalized
    class: personalized
    categories: [car, van]
    period: { start: 2003 }
    period_evidence: instrument-in-force
    period_note: >-
      2003, NOT 2004. Decreto 11 novembre 2003 n. 149 creates the special
      series; Decreto 26 luglio 2004 n. 107 merely widens its grammar. Secondary
      accounts date the scheme to 2004, which is the amending instrument rather
      than the creating one — a small instance of the same error class the
      period discipline exists to catch.
    matching: recall-only
    format:
      pattern: "LL999"
      regex: '\A[A-Z0-9]{5}\z'
      format_evidence: statutory
      format_note: >-
        DELIBERATELY WIDE, hence `recall-only`. The grammar has been rewritten
        three times and is now a CONSTRAINT rather than a template: DD 132/2022
        art. 6 replaced the enumerated patterns with "La serie alfanumerica
        speciale deve essere composta obbligatoriamente da almeno due caratteri
        alfabetici ed almeno da un carattere numerico." A five-character
        alphanumeric regex is the honest encoding of that; it accepts strings
        the rule forbids (e.g. one letter and four digits), so a match is a
        shape hit and not a validity claim.
      grammar_history:
        - "2003 (Decreto 149/2003 art. 1, 3): five characters, in the shapes AAA00-ZZZ99, AAAAA-ZZZZZ, AA00A-AA00Z, AAAA0-ZZZZ9"
        - "2004 (Decreto 107/2004 art. 5): eleven enumerated shapes; art. 4 drops O and Q from the letter set"
        - "2022 (DD 132/2022 art. 6): the enumeration is abolished in favour of the two-letters-and-one-digit minimum quoted above"
      reserved_strings:
        values: [POLIZIA, POL, CRS, CD, RSM, SMR]
        rule: >-
          Decreto 149/2003 art. 2: a special series may not form, even
          partially, words or acronyms reserved to other uses — naming POLIZIA,
          POL, CRS, CD, RSM and SMR — "salvo che il richiedente sia legittimato
          o autorizzato all'utilizzo dei relativi veicoli", nor anything
          contrary to public decency or resembling the ordinary series.
    design:
      plate: { w: 390, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: true
      rear_differs_note: "follows the ordinary series — 300x100 front, 390x120 rear, from 2022"
      colour_variant:
        note: >-
          Between 2019 and 2023 a personalized plate on an ELECTRIC vehicle was
          issued in green rather than blue — DD 22/2019 art. 2: "la serie
          alfanumerica speciale scelta ed il bordo perimetrale saranno di colore
          verde." A colour-only variant of the same format and period, so a
          sub-entry here rather than its own series, per PRD-PLATES §2.3.
    region_encoding: none
    notes: >-
      PERSONALIZED PLATES, from 2003. Priced at EUR 750 initially and EUR 900 a
      pair under DD 132/2022 art. 8. Distinct from the RESERVATION right of DD
      132/2022 art. 7, which lets a buyer book an ordinary-series number within
      the next 400 or 1,000 numbers for EUR 50 or EUR 100 — that is a booking
      mechanism on the ordinary series, not a series of its own, and is not
      modelled.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17022923.html  # Decreto 11 novembre 2003 n. 149 artt. 1-4"
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17023036.html  # Decreto 26 luglio 2004 n. 107 artt. 4-5"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 artt. 6-8"
