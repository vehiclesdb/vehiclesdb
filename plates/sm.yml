# plates/sm.yml — San Marino (PRD-PLATES gate L1, microstates group).
# DRAFT for verification. All primary text fetched from the Consiglio Grande e
# Generale law archive (consigliograndeegenerale.sm), 2026-08-02.
#
# ---------------------------------------------------------------------------
# THIS FILE IS ALMOST ENTIRELY PRIMARY, AND THE CHAIN IS UNBROKEN BACK TO 1922.
# ---------------------------------------------------------------------------
# San Marino turned out to have the deepest reachable archive of the five
# microstates. Every series below is dated from an instrument, and the
# amendment chain is continuous: a 1922 Regolamento whose article 11 is STILL
# the formal target of amendment a century later, replaced comma by comma in
# 1986, 1993 and 2022.
#
# THE INSTRUMENTS, in the order they matter:
#   * Legge 10 marzo 1989 n. 23, "Norme sulla Carta di Circolazione e sulle
#     targhe di immatricolazione" (pubbl. 22 March 1989) — THE ENABLING ACT.
#     Art. 17: "Con apposito Decreto Reggenziale sono stabilite le
#     caratteristiche costruttive, dimensionali e cromatiche delle targhe,
#     nonchè i loro prezzi di vendita." Every plate decree since cites it.
#   * Regolamento 6 marzo 1922 n. 13, art. 11 — the root plate provision.
#   * Decreto 18 dicembre 1986 n. 151 — the digits-only modern plate.
#   * Decreto 29 settembre 1993 n. 109 — introduces LETTER + FOUR DIGITS.
#   * Decreto Delegato 16 settembre 2022 n. 132 — the current redesign.
#   * Decreto Delegato 31 gennaio 2019 n. 22 — the green electric plates.
#   plus the per-class decrees cited on each series below.
#
# ---------------------------------------------------------------------------
# FOUR FINDINGS THAT CORRECT THE SECONDARY ACCOUNTS
# ---------------------------------------------------------------------------
#
# 1. "RSM WAS REMOVED FROM THE PLATE IN 2023" IS FALSE, BY 37 YEARS. Decreto
#    Delegato 132/2022 does not mention RSM at all — it could not remove what
#    was already gone. RSM left the ordinary plate in 1986, when Decreto
#    151/1986 art. 1 replaced the third comma of the 1922 art. 11 with a spec
#    listing only the arms, the "Repubblica di San Marino" legend and the
#    numbers. RSM survives as a SEPARATE OVAL national sign under Legge
#    23/1989 art. 19 — "La targa di nazionalità dello Stato è composta dalle
#    lettere RSM dipinte in nero su fondo rifrangente bianco a forma di
#    elisse" — which DD 132/2022 art. 8 still prices separately at EUR 5,00.
#    It also survives ON the historic-vehicle plate of 2006.
#
# 2. "THE CURRENT FORMAT DATES FROM 3 DECEMBER 1993" IS NOT SUPPORTED. The
#    instrument that created the letter+four-digit format is Decreto 29
#    settembre 1993 n. 109, and its art. 4 says the system "entra in vigore
#    immediatamente" with plates issued progressively as old stock runs out.
#    No primary text mentions 3 December 1993. `period.start` is 1993 on the
#    instrument's own authority; the day-precision claim is not carried.
#
# 3. THE 2022 REDESIGN'S DATES ARE THREE DIFFERENT DATES, AND THE INSTRUMENT
#    DISTINGUISHES THEM — this is the instrument-date rule in its richest form
#    anywhere in this group:
#      - 16 September 2022: DD 132/2022's own date, publication and entry into
#        force. The small 300x100 front plate is lawful FROM THIS DATE.
#      - 30 June 2023: the hard stop for issuing OLD-format stock (art. 9(1)).
#      - 1 July 2023: the date from which the blue must be RAL 5017
#        (art. 9(2)) — a COLOUR date, not a format date.
#    Reading "first issued 1 July 2023" off this decree is wrong: art. 9(1)
#    sets an END date for old stock, not a START date for the new model. The
#    two series below carry the overlap honestly rather than inventing a clean
#    cutover.
#
# 4. THE LETTER ALPHABET CHANGED IN 2022, AND BY EXACTLY ONE LETTER. Decreto
#    109/1993 art. 2 listed NINETEEN letters (no U). DD 132/2022 art. 3 lists
#    TWENTY, adding U. D, E, I, O, Q, R remain excluded throughout — R because
#    it is reserved to rimorchi and E to export, which is a functional
#    exclusion rather than a legibility one. Both alphabets are carried in
#    `regex_strict` on their own series, which is exactly what the strict tier
#    is for.
#
# ---------------------------------------------------------------------------
# period_evidence VOCABULARY used in this file:
#   instrument-in-force            the instrument's own commencement
#   instrument-dated-both-ends     start AND end each fixed by an instrument
#   statutory-operative-date       the instrument names an OPERATIVE date for
#                                  issuance that differs from its own
#                                  commencement — the sharpest instance of the
#                                  instrument-date rule in this file
#   instrument-in-force-upper-bound  earliest instrument read; start is an
#                                  UPPER bound
#   secondary-wikipedia            WIKIPEDIA-DERIVED (mandatory tag)
#
# format_evidence VOCABULARY: statutory | secondary-wikipedia | not-established
#
# A NOTE ON THE ARCHIVE. consigliograndeegenerale.sm warns that documents
# extracted from it "lack authenticated character" and directs anyone needing
# authentic copies to the Segreteria Istituzionale. The Bollettino Ufficiale
# issue numbers were NOT retrieved in this pass; publication dates come from
# the archive's own metadata. Recorded as a limit on every citation below.
# ---------------------------------------------------------------------------
jurisdiction: sm
authority:
  name: Ufficio Registro Automezzi, Repubblica di San Marino — Legge 10 marzo 1989 n. 23
  url: "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020838.html"
binding: vehicle
binding_note: >-
  Legge 25 novembre 1997 n. 136 art. 7: the Ufficio "assegna il relativo numero
  di immatricolazione e … rilascia le targhe e la Carta di Circolazione a nome
  del proprietario" — the plate issues against the vehicle's registration, in
  the owner's name. No provision reserves a number to a person across vehicles
  in the Swiss/Liechtenstein manner, so `vehicle` rather than `owner`. Note the
  contrast with li.yml and ch.yml, which is real and not an artefact.
instrument:
  citation: "Legge 10 marzo 1989 n. 23, Norme sulla Carta di Circolazione e sulle targhe di immatricolazione"
  published: "1989-03-22"
  delegation: >-
    Art. 17: "Con apposito Decreto Reggenziale sono stabilite le caratteristiche
    costruttive, dimensionali e cromatiche delle targhe, nonchè i loro prezzi di
    vendita." This is why the plate specifications live in decrees rather than
    in the Codice della Strada.
  manufacture_control: >-
    Art. 14: "La fabbricazione delle targhe è soggetta ad apposita autorizzazione
    del Congresso di Stato che esercita il controllo sulla produzione a mezzo
    dell'Ufficio Registro Automezzi."
  source: "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020838.html  # Legge 23/1989 art. 13, 14, 17, 18, 19"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts.
# ---------------------------------------------------------------------------
common:
  codice_della_strada_does_not_regulate_plates:
    finding: >-
      A SOURCED NEGATIVE worth stating, because it is where a researcher would
      naturally look first. San Marino's road code — Decreto Delegato 28 aprile
      2008 n. 67, promulgated in consolidated form as Decreto Delegato 26 maggio
      2008 n. 81 under Legge 20 marzo 2008 n. 51 — contains NO plate
      specification. Its art. 29 expressly delegates the subject out, listing
      among the matters for special legislation "g) le carte di circolazione, le
      targhe di immatricolazione, speciali, provvisorie e di prova." The code
      carries only enforcement provisions (arts. 56, 60, 62, 63). Note also that
      it is a DECRETO DELEGATO, not a Legge.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17023725.html  # DD 81/2008 art. 29 lit. g"
  display:
    rule: >-
      Legge 23/1989 art. 13: "Ogni autoveicolo deve recare, nella parte anteriore
      ed in quella posteriore, una targa contenente il numero di immatricolazione.
      Ogni motoveicolo, rimorchio, trattrice agricola, rimorchio agricolo deve
      essere munito della suddetta targa posta soltanto nella parte posteriore.
      Ogni carrello appendice deve essere munito, nella parte posteriore, di una
      targa ripetitrice del numero di immatricolazione del veicolo trainante."
    frames_forbidden: >-
      Art. 18: "Non è ammesso l'uso di cornici portatarga. Le viti di fissaggio
      della targa, che devono essere di materiale non riflettente, non vanno
      poste in corrispondenza dei numeri di immatricolazione, dello stemma e del
      talloncino di revisione." A rare explicit ban on plate frames.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020838.html  # Legge 23/1989 art. 13, 18"
  country_sign:
    letters: "RSM"
    shape: ellipse
    background: "#FFFFFF"
    foreground: "#000000"
    rule: >-
      Legge 23/1989 art. 19: "La targa di nazionalità dello Stato è composta
      dalle lettere RSM dipinte in nero su fondo rifrangente bianco a forma di
      elisse." A SEPARATE OVAL, not a field on the plate — and still a priced
      article in the current decree (DD 132/2022 art. 8, "Sigla Internazionale
      dello Stato EUR 5,00"). See finding 1 in the header: RSM has not been part
      of the ordinary plate since 1986.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020838.html  # Legge 23/1989 art. 19"
  euro_band:
    present: false
    evidence: >-
      HONEST LIMIT ON A NEGATIVE. San Marino is not in the EU and no Euro band
      appears in any specification from 1922 to 2026 — but no instrument
      AFFIRMATIVELY states its absence. This is strong negative evidence from an
      unbroken series of exhaustive design specs, not a positive citation, and
      it is recorded as such rather than dressed up.
  colours:
    rule: >-
      The characters and border are BLUE on a white retroreflective ground —
      "di colore blu" in every decree from 1986 onward. The 1922 original said
      "in azzurro su fondo bianco".
    ral_5017:
      value: "RAL 5017"
      from: "2023-07-01"
      rule: >-
        DD 132/2022 art. 9(2), verbatim: "A decorrere dall'1 luglio 2023 i
        caratteri alfanumerici blu delle targhe di immatricolazione saranno di
        colore blu RAL 5017." THIS IS A NAMED COLOUR STANDARD — the only one in
        the microstates group, and the reason San Marino's blue is a genuine
        spec claim where Liechtenstein's and Monaco's colours are not.
      hex_note: >-
        RAL 5017 ("Verkehrsblau"/traffic blue) has no single authoritative sRGB
        value; RAL publishes it as a physical standard. The hex carried below is
        `hex_basis: ral-converted` — a conventional conversion, NOT a spec
        value — and the RAL reference itself is the citable fact.
    before_ral: >-
      Before 1 July 2023 the decrees say only "di colore blu" with no RAL,
      Pantone or CIE reference. Those series carry `hex_basis: observed`.
    arms_colours: >-
      Decreto 151/1986 art. 1 specifies the arms in "colori rifrangenti (rosso,
      blu, verde, giallo e nero)"; DD 132/2022 art. 2 upgrades the reference to
      "i pantoni di cui all'Allegato 'B' alla Legge Costituzionale 22 luglio
      2011 n.1" and the logotype to the "manuale d'uso" annexed to Regolamento
      6 agosto 2012 n. 3. NEITHER ANNEX WAS FETCHED in this pass — the Pantone
      values themselves are a recorded gap.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 2 and art. 9(2)"
  alphabet:
    current:
      letters: [A, B, C, F, G, H, J, K, L, M, N, P, S, T, U, V, W, X, Y, Z]
      count: 20
      rule: >-
        DD 132/2022 art. 3: "I caratteri alfabetici utilizzabili per la
        composizione delle targhe delle serie ordinarie sono i seguenti: A, B,
        C, F, G, H, J, K, L, M, N, P, S, T, U, V, W, X, Y, Z. 2. I caratteri
        numerici utilizzabili per la composizione delle targhe di
        immatricolazione vanno da zero a nove."
    previous:
      letters: [A, B, C, F, G, H, J, K, L, M, N, P, S, T, V, W, X, Y, Z]
      count: 19
      rule: "Decreto 109/1993 art. 2, the same list WITHOUT U."
    excluded: [D, E, I, O, Q, R, U]
    excluded_note: >-
      D, E, I, O, Q and R are excluded from the ordinary series throughout; U
      was excluded until 2022 and is now admitted. The exclusions are NOT all of
      one kind and the distinction matters: I, O and Q are legibility
      exclusions (confusable with 1 and 0), while R is reserved to trailers and
      E to export plates — functional reservations. Neither decree states the
      reasons; the reservation of R and E is visible from the trailer and export
      decrees themselves.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 3; Decreto 109/1993 art. 2"
  progression:
    rule: >-
      Sequential. Legge 136/1997 art. 7 and DD 132/2022 art. 7 both presuppose a
      "numerazione progressiva" — the reservation right runs "entro i 400 numeri
      successivi a quello disponibile al momento della prenotazione" (EUR 50) or
      "entro i 1.000 numeri successivi" (EUR 100).
    letter_rollover_gap: >-
      RECORDED GAP, and a real one. NO INSTRUMENT STATES the rule for advancing
      the letter when the four digits exhaust. The only exhaustion-triggered
      rollover written into primary law anywhere in San Marino is on the EXPORT
      series (DD 96/2026: the new grammar issues "a seguito dell'assegnazione
      dell'ultima targa con la sigla della composizione attuale"). That rule
      must NOT be generalised to the ordinary series, and no `progression` claim
      below does so.
    source: "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 7"
  emblem:
    present: true
    rendered: placeholder
    rule: >-
      The "stemma ufficiale" appears in relief on every ordinary plate, at the
      left. DD 132/2022 art. 2 binds it to the constitutional annex's
      proportions and Pantones. PRD-PLATES §3's placeholder rule applies: the
      arms are a state emblem with no located clean licence, and the
      constitutional annex was not fetched.
  not_modelled:
    - "GE (Gendarmeria) IS NOT MODELLED, and this is a positive finding rather than an omission. The archive was searched for Gendarmeria plate instruments and returned nothing. San Marino law knows only 'Corpi di Polizia' collectively (DD 132/2022 art. 4 lit. b) with a single POLIZIA legend. If GE plates exist they have no instrument in this archive, and asserting a legal basis for them would be manufacturing one."
    - "VU (Vigili Urbani) IS NOT MODELLED. The archive holds Vigili Urbani corps instruments (organisation, staffing, the Regolamento 5 novembre 1963 n. 44) but NOTHING about targhe. The widely-repeated 'not used since 1983' end date has no primary support located, and without an instrument at either end the series cannot be dated at all."
    - "TAXI plates do not appear in any instrument read. DD 132/2022 art. 8 prices a 'Targhetta N.C.C.' (noleggio con conducente) at EUR 50,00, which is a small supplementary plate rather than a registration series; it is noted here and not modelled as a series."
    - "The CAPITANI REGGENTI vehicles reportedly carry reserved combinations. DD 132/2022 art. 6 and Decreto 149/2003 art. 2 do reserve certain strings from the personalized series, naming POLIZIA, POL, CRS, CD, RSM and SMR — but no instrument read creates a head-of-state series. Not modelled."

series:

  # =========================================================================
  # THE ORDINARY SERIES — letter + four digits. Split at 2022 because the
  # FRONT PLATE CHANGED SIZE; see the modelling note on sm-standard-2022.
  # =========================================================================
  - id: sm-standard-1993
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1993, end: 2023 }
    period_evidence: instrument-dated-both-ends
    period_note: >-
      START 1993: Decreto 29 settembre 1993 n. 109 art. 1 introduces "un
      carattere alfabetico seguito da quattro caratteri numerici", and art. 4
      commences it immediately — "Il sistema di targatura di cui all'Art. 1
      entra in vigore immediatamente e le targhe saranno consegnate
      progressivamente con l'esaurimento delle targhe di vecchio tipo ancora in
      giacenza presso l'Ufficio Registro Automezzi." Note that the instrument
      itself provides for a phased rollout, so 1993 is when issuance BEGAN, not
      when the old plate stopped. END 2023: DD 132/2022 art. 9(1) sets the hard
      stop — old-format plates issue "fino a esaurimento delle giacenze
      d'ufficio e comunque non oltre il 30 giugno 2023."
      The widely-repeated "3 December 1993" appears in no primary text; see
      header finding 2.
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A[A-Z]\d{4}\z'
      regex_strict: '\A[ABCFGHJKLMNPSTVWXYZ]\d{4}\z'
      format_evidence: statutory
      charset:
        letters: "the NINETEEN letters of Decreto 109/1993 art. 2 — A B C F G H J K L M N P S T V W X Y Z. U is NOT among them; it is admitted only from 2022."
        notes: >-
          `regex` keeps [A-Z] because the lint round-trips it against the
          pattern's L token; `regex_strict` carries the sourced nineteen-letter
          alphabet. The difference between this strict twin and
          sm-standard-2022's is exactly one letter, and that difference is the
          only way to tell the two series apart from the string alone.
      separator: none
      separator_note: >-
        The decree prescribes "un carattere alfabetico seguito da quattro
        caratteri numerici" with NO separator glyph and no gap specification, so
        the pattern spells the serial unbroken. This is one of the few series in
        the dataset with no separator position at all.
    design:
      plate: { w: 390, h: 120, unit: mm, note: "BOTH front and rear at this size — Decreto 109/1993 art. 1, 'Le targhe anteriori e posteriori degli autoveicoli devono essere di forma rettangolare delle dimensioni di mm.390x120'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#003399"
      foreground_note: "'di colore blu' with no RAL or Pantone reference in the 1993 decree — hex_basis observed. The named RAL arrives only in 2023; see common.colours."
      characters: { h: 79, w: 45, stroke: 12.5, unit: mm, note: "Decreto 109/1993 art. 1 lit. b" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, position: left, note: "arms in reflective colours plus 'Repubblica di San Marino' on two lines in blue relief" }
      legend: { text: "Repubblica di San Marino", color: "#003399", position: "beside the arms, two lines" }
      border: { color: "#003399", relief: true }
      rear_differs: false
      rear_differs_note: "FALSE for this series — front and rear were the same 390x120 plate. That is precisely what changed in 2022."
    region_encoding: none
    notes: >-
      THE 1993 ORDINARY SERIES: letter plus four digits, 390x120 mm front AND
      rear, blue on white. Decreto 109/1993 also abolished the revision-sticker
      obligation (art. 3), which is why the 27 mm raised circle prescribed by
      the 1986 decree disappears from the plate. Overlaps sm-standard-2022 for
      the 2022-2023 run-off; that overlap is real and is provided for by DD
      132/2022 art. 9(1).
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17021492.html  # Decreto 29 settembre 1993 n. 109, artt. 1-4: the letter+4-digit format, the 19-letter alphabet, immediate commencement and phased issue"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 9(1): old-format stock issues no later than 30 June 2023"

  - id: sm-standard-2022
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 2022 }
    period_evidence: instrument-in-force
    period_note: >-
      16 September 2022 — the date DD 132/2022 was made, published and came into
      force, all three being the same day per the archive's metadata. THE SMALL
      FRONT PLATE IS LAWFUL FROM THAT DATE. It is tempting to date this series
      to 1 July 2023 because that is the date most often reported, but art. 9(2)
      makes 1 July 2023 the date the blue becomes RAL 5017 — a colour date
      applying to ALL series — and art. 9(1) makes 30 June 2023 the last day for
      OLD stock. Neither is this series' start. See header finding 3.
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A[A-Z]\d{4}\z'
      regex_strict: '\A[ABCFGHJKLMNPSTUVWXYZ]\d{4}\z'
      format_evidence: statutory
      charset:
        letters: "the TWENTY letters of DD 132/2022 art. 3 — the 1993 list plus U"
        notes: >-
          The serial GRAMMAR is unchanged from 1993; only the alphabet widened
          by one letter. A string beginning U can only be from this series,
          which makes U the single character that dates a San Marino plate.
      separator: none
    design:
      plate: { w: 390, h: 120, unit: mm, note: "REAR — unchanged (DD 132/2022 art. 2)" }
      plate_front: { w: 300, h: 100, unit: mm, note: "FRONT — NEW, and the reason this is its own series: 'Le targhe anteriori degli autoveicoli hanno forma rettangolare delle dimensioni di 300 x 100 mm'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec_note: "aluminium 1 mm with an adhesive vinyl retroreflective film — 'lamiera di alluminio dello spessore di mm 1 sul cui fronte è applicata una pellicola rifrangente vinilica adesiva'" }
      foreground: "#005387"
      foreground_note: >-
        RAL 5017 from 1 July 2023 (DD 132/2022 art. 9(2)) — a NAMED COLOUR
        STANDARD and therefore a genuine spec claim, unlike every other colour
        in this microstates group. `hex_basis: ral-converted`: RAL 5017 is a
        physical standard with no authoritative sRGB value, so the hex is a
        conventional conversion and the RAL reference is the citable fact.
      hex_basis: ral-converted
      characters_front: { h: 62, w: 35, stroke: 8, unit: mm }
      characters_rear: { h: 79, w: 45, stroke: 12.5, unit: mm }
      border_front: { width: 3, stroke: 3, unit: mm, color: "#005387" }
      border_rear: { width: 4, stroke: 4, unit: mm, color: "#005387" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, position: left, note: "arms in relief, in the Pantones of Allegato B to Legge Costituzionale 22 luglio 2011 n. 1; logotype per the manuale d'uso annexed to Regolamento 6 agosto 2012 n. 3. NEITHER ANNEX WAS FETCHED — recorded gap." }
      legend: { text: "Repubblica di San Marino", color: "#000000", position: "beside the arms" }
      rear_differs: true
      rear_differs_note: >-
        TRUE, and NEWLY so — this is the change that justifies a separate
        series. From 2022 the front plate is 300x100 mm and the rear stays
        390x120 mm, where the 1993 series had one size for both. The stated
        reason is practical rather than aesthetic: the smaller front plate fits
        sports cars with shallow plate recesses.
    region_encoding: none
    notes: >-
      THE CURRENT ORDINARY SERIES. Same letter+four-digit grammar as 1993, but a
      smaller FRONT plate (300x100 mm), a twentieth letter (U), and RAL 5017
      blue from 1 July 2023. Modelled as its own series because the design
      changed, per PRD-PLATES §2.3. Overlaps sm-standard-1993 across the
      2022-2023 run-off, which is genuine parallel issuance provided for by the
      decree itself. NOTE the motorcycle and moped series below are NOT split at
      2022, because their plate SIZE did not change — only character metrics and
      the colour, both of which are dated design facts within one series. That
      asymmetry is deliberate and is the §2.3 test applied consistently.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # Decreto Delegato 16 settembre 2022 n. 132, artt. 2, 3, 9: front 300x100 and rear 390x120, the 20-letter alphabet, the run-off and the RAL 5017 date"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17135320.html  # ratification by the Consiglio Grande e Generale, 17 October 2022, Delibera n. 5"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17135471.html  # errata corrige of 26 October 2022 — corrects two entries in the art. 8 price table only; it does NOT touch dimensions, colour or dates"

  - id: sm-standard-1986
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1986, end: 1993 }
    period_evidence: instrument-dated-both-ends
    period_note: >-
      START: Decreto 18 dicembre 1986 n. 151, "Istituzione di nuovo modello di
      targa per i veicoli", published 22 December 1986. END: superseded by
      Decreto 109/1993, whose art. 1 replaces art. 1 of the 1986 decree.
    matching: strict
    format:
      pattern: "99999"
      regex: '\A\d{1,5}\z'
      format_evidence: statutory
      format_note: >-
        DIGITS ONLY — the decree says "Numeri di immatricolazione a rilievo di
        colore blu", with no alphabetic character anywhere in the ordinary
        series. That single word settles the pre-1993 format from primary text
        rather than from observation. The WIDTH is inferred, not stated: art. 4
        opens the series at 30.000 for motor cars, which implies five digits,
        but no article states a digit count. `\d{1,5}` is the honest encoding.
      progression: >-
        Decreto 151/1986 art. 4 names the opening numbers in terms: "Le targhe di
        cui agli articoli precedenti saranno adottate a partire dai seguenti
        numeri di immatricolazione: - n. 30.000 per gli autoveicoli - n. 7.600
        per motoveicoli - n. 900 per rimorchi - n. 01 Per Corpo Diplomatico". A
        rare primary statement of series starting points.
    design:
      plate: { w: 390, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#003399"
      characters: { h: 79, w: 45, stroke: 12.5, unit: mm }
      revision_sticker: { present: true, diameter: 27, unit: mm, note: "'Cerchio a rilievo del diametro di mm. 27 destinato a contenere il talloncino di revisione' — abolished by Decreto 109/1993 art. 3" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder, note: "arms in reflective colours (rosso, blu, verde, giallo e nero) plus the two-line legend" }
      rear_differs: false
    region_encoding: none
    notes: >-
      THE DIGITS-ONLY MODERN PLATE, and the instrument that DROPPED RSM from the
      ordinary plate — see header finding 1. It also carried a raised 27 mm
      circle for the revision sticker, a feature that existed only between 1986
      and 1993. Its art. 2 is the origin of the CD, POLIZIA and R markings that
      survive to this day.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17020523.html  # Decreto 18 dicembre 1986 n. 151, artt. 1-4"

  - id: sm-rsm-1922
    class: standard
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 1922, end: 1986 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      START: Regolamento 6 marzo 1922 n. 13, "Norme generali sui veicoli e sulla
      circolazione". Recorded as an UPPER bound on the start rather than a
      certain origin — this is the earliest instrument reached, and whether any
      earlier San Marino registration existed was not established. END: the
      1922 art. 11 third comma was replaced by Decreto 151/1986 art. 1.
    matching: recall-only
    format:
      pattern: "RSM 999"
      regex: '\ARSM[- ]?\d+\z'
      format_evidence: statutory
      format_note: >-
        DELIBERATELY WIDE, hence `recall-only`. Art. 11 prescribes "l'indicazione
        in azzurro su fondo bianco 'R.S.M.' ed il numero della licenza di
        circolazione" — it names the components and gives their HEIGHT (10 cm,
        stroke 1 cm) but never a digit count or ceiling, across a 64-year span.
        A match is a shape hit and nothing more.
      separator_note: >-
        PRINTED WITH DOTS as "R.S.M.". U+002E FULL STOP is in
        _meta/separators.yml's FORGIVING set but not its EMITTED set, so
        PRD-PLATES §2.6 forbids writing it; the pattern spells "RSM" undotted
        and a conformant consumer canonicalises a real "R.S.M. 123" to "RSM123",
        which the separator-free twin matches. The same limitation as the Swiss
        mid-height point.
    design:
      background: { color: "#FFFFFF", finish: non-reflective, hex_basis: observed }
      foreground: "#0087DC"
      foreground_note: "'in azzurro' — AZZURRO, a lighter blue than the 'blu' of every later decree. The distinction is in the instruments' own words and is preserved here rather than flattened."
      characters: { h: 100, stroke: 10, unit: mm, note: "art. 11: 'Tali indicazioni devono avere l'altezza di cm. 10 e la grossezza delle linee deve essere di cm. 1'; motorcycles 6 cm high, 6 mm stroke" }
      band: { side: none }
      emblem: { present: false, note: "the 1922 provision lists only the RSM indication and the number — no arms" }
      rear_differs: true
      rear_differs_note: "art. 11 requires the indications to be REPEATED IN PAINT on the front of the vehicle — 'Sono ripetute a vernice nella parte anteriore del veicolo' — so the front was painted lettering, not a plate. Motorcycles carried a rear plate only."
    region_encoding: none
    notes: >-
      THE ROOT SERIES, and the root INSTRUMENT: art. 11 of the 1922 Regolamento
      is still the formal target of amendment a century later — DD 132/2022 art.
      2 operates by replacing "Il terzo comma dell'articolo 11 del Regolamento
      6 marzo 1922 n. 13". Modelled as one long series because no instrument
      read draws a generation boundary inside it; secondary accounts describe
      several plate generations between 1922 and 1986 and none of those
      boundaries could be dated to an instrument, so none is asserted.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17016996.html  # Regolamento 6 marzo 1922 n. 13, art. 11 third comma"

  # =========================================================================
  # TWO-WHEELERS.
  # =========================================================================
  - id: sm-motorcycle-1993
    class: motorcycle
    categories: [motorcycle]
    period: { start: 1993 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "L999"
      regex: '\A[A-Z]\d{3}\z'
      regex_strict: '\A[ABCFGHJKLMNPSTUVWXYZ]\d{3}\z'
      format_evidence: statutory
      charset:
        notes: >-
          THREE digits against the cars' four — the structural difference
          between the two number spaces. `regex_strict` carries the CURRENT
          20-letter alphabet; between 1993 and 2022 it was the 19-letter list
          without U, which is recorded here rather than split into a second
          series because the plate SIZE never changed.
      separator: none
    design:
      plate: { w: 165, h: 165, unit: mm, note: "square, unchanged from 1993 through the 2022 redesign — the reason this series is NOT split at 2022" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      characters_1993: { h: 59, w: 29, stroke: 7, unit: mm, note: "Decreto 109/1993 art. 1" }
      characters_2022: { h: 60, w: 25.5, stroke: 8, unit: mm, note: "DD 132/2022 art. 2 — a metric revision within the same plate size" }
      border: { width: 4, stroke: 4, unit: mm }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
      display: "rear plate only — Legge 23/1989 art. 13"
    region_encoding: none
    notes: >-
      MOTORCYCLES: a square 165x165 mm plate carrying a letter and THREE digits.
      Modelled as one continuous series across the 2022 redesign because the
      plate size did not change; the character metrics and the RAL 5017 colour
      are dated design facts inside it. Contrast the car series, which IS split,
      because its front plate shrank. This is the PRD-PLATES §2.3 test producing
      different answers on the same reform for different vehicle classes.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/archivio-leggi-decreti-e-regolamenti/documento17021492.html  # Decreto 109/1993 art. 1: 165x165 mm, letter + three digits"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 2 (metrics) and art. 3 (alphabet)"

  - id: sm-moped
    class: moped
    categories: [moped]
    period: { start: 1993 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      Decreto 15 aprile 1993 n. 58 extended the registration obligation to
      ciclomotori. Its ORIGINAL text was not fetched in this pass — only its
      1997 amendment (Decreto 28 marzo 1997 n. 39, itself repealed in 2022) and
      the current specification in DD 132/2022 art. 5. So 1993 is an upper bound
      resting on the decree's existence and date rather than on its read text.
    matching: strict
    format:
      pattern: "L999"
      regex: '\A[A-Z]\d{3}\z'
      regex_strict: '\A[ABCFGHJKLMNPSTUVWXYZ]\d{3}\z'
      format_evidence: statutory
      separator: none
    design:
      plate: { w: 115, h: 100, unit: mm, note: "DD 132/2022 art. 5 — the smallest plate in the San Marino system" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#005387"
      hex_basis: ral-converted
      characters: { h: 40, w: 20, stroke: 4, unit: mm }
      emblem: { present: true, rendered: placeholder, note: "arms and logotype inside a raised rectangle 45 x 35 mm" }
      band: { side: none }
      rear_differs: false
    region_encoding: none
    notes: >-
      CICLOMOTORI (mopeds). The current specification replaces art. 3 of Decreto
      58/1993 and shares the ordinary 20-letter alphabet — there is no dedicated
      moped letter block in any instrument read, contrary to some secondary
      accounts.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 art. 5, replacing art. 3 of Decreto 15 aprile 1993 n. 58"

  # =========================================================================
  # THE ELECTRIC SERIES — created and abolished, both by instrument. The
  # cleanest instrument-dated-both-ends row in the microstates group.
  # =========================================================================
  - id: sm-electric-ve
    class: electric
    categories: [car, van]
    period: { start: 2019, end: 2023 }
    period_evidence: statutory-operative-date
    period_note: >-
      A TEXTBOOK CASE, and the reason `instrument-issue-date` exists as a tag.
      Decreto Delegato 31 gennaio 2019 n. 22 is DATED 31 January 2019 and came
      into force that day — but it does not start the series on its own date.
      Its art. 4 (Decorrenza) says in terms: "Le targhe di immatricolazione dei
      veicoli ad alimentazione elettrica saranno rilasciate a decorrere dal
      2 maggio 2019." THREE MONTHS LATER. Shipping 31 January 2019 as the series
      start would be exactly the Spanish error, and the instrument itself
      forbids it.
      END: repealed by DD 132/2022 art. 10 on 16 September 2022, with existing
      stock issuing until 30 June 2023 under art. 9(1). The series therefore
      runs 2 May 2019 to 30 June 2023 at the latest, both ends instrument-fixed.
    matching: strict
    format:
      pattern: "VE999"
      regex: '\AVE[- ]?\d{3}\z'
      format_evidence: statutory
      charset:
        notes: >-
          THREE digits for cars, FOUR for motorcycles, THREE for mopeds — the
          car series is the narrowest, which is unusual and is stated in art. 1
          comma by comma.
    design:
      plate: { w: 390, h: 120, unit: mm, note: "front and rear alike — art. 1(2)" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec_note: "aluminium EN AW-1050A, 1 mm, with adhesive vinyl retroreflective film" }
      foreground: "#4D7B2E"
      foreground_note: >-
        RAL 6018, named in the instrument: "di colore verde giallastro,
        RAL 6018". A genuine spec claim, like the later RAL 5017.
        `hex_basis: ral-converted` — the hex is a conventional conversion, the
        RAL reference is the fact.
      hex_basis: ral-converted
      characters: { h: 79, w: 45, stroke: 12.5, unit: mm }
      border: { width: 4, stroke: 4, unit: mm, color: "#4D7B2E" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      GREEN PLATES FOR ELECTRIC VEHICLES, 2019-2023. The whole regime lasted
      just over four years. Its art. 2 also made the PERSONALIZED series green
      for electric vehicles — a colour variant of another series rather than a
      series of its own, recorded on sm-personalized. Take-up was reported to be
      very small, which is the stated reason for abolition; that figure is
      journalistic and is not carried as data here.
    sources:
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17106679.html  # Decreto Delegato 31 gennaio 2019 n. 22, artt. 1, 2, 4 — the VE grammar, RAL 6018, and the 2 May 2019 issue date"
      - "https://www.consigliograndeegenerale.sm/on-line/home/documento17134662.html  # DD 132/2022 artt. 9(1) and 10 — repeal and run-off to 30 June 2023"

  - id: sm-electric-ve-motorcycle
    class: electric
    categories: [motorcycle, moped]
    period: { start: 2019, end: 2023 }
    period_evidence: statutory-operative-date
    matching: strict
    format:
      pattern: "VE9999"
      regex: '\AVE[- ]?\d{4}\z'
      format_evidence: statutory
      format_note: "FOUR digits for motoveicoli, against three on the car series — art. 1(3). Mopeds took three digits on a 115x100 mm plate (art. 1(4))."
    design:
      plate: { w: 165, h: 165, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#4D7B2E"
      hex_basis: ral-converted
      characters: { h: 60, w: 25.5, stroke: 8, unit: mm }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      The two-wheeler arm of the 2019-2023 electric regime, separated from
