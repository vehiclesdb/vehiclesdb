# plates/us-tn.yml — Tennessee (PRD-PLATES gate L2, group southeast-b).
#
# THE FINDING THAT MAKES TENNESSEE WORTH MODELLING CAREFULLY: Tennessee's two
# standard-issue options are not a colour variant of one another. The plain
# standard plate runs ABC-1234 and the "In God We Trust" option runs 123-ABCD —
# THREE LETTERS THEN FOUR NUMERALS versus THREE NUMERALS THEN FOUR LETTERS. The
# arrangement itself tells the two apart, so a parse API can identify which
# standard option a Tennessee plate is from the string alone, with no image and
# no lookup. Under PRD-PLATES §2.3 that is two SERIES, not one series with a
# flag, and this file models it that way. Contrast Kentucky in this same group,
# which offers the identical pair of options and draws BOTH from one serial pool,
# so a Kentucky serial cannot distinguish them at all. Same policy, opposite
# implementation, opposite consequence for the parse layer — that contrast is the
# single most useful thing in this group's output.
#
# SOURCING RULE APPLIED HERE, AND ITS LIMIT: PRD-PLATES §4 prefers the statute.
# Tennessee Code Annotated is published exclusively through a LexisNexis portal
# that serves a JavaScript shell, and Justia/FindLaw/Casetext all refuse a plain
# fetch. But Tennessee publishes two things that are better than a brochure and
# were both obtained: the SESSION LAWS in full (publications.tnsosfiles.com serves
# public chapters as PDFs), and a Department of Revenue standard-plate page plus a
# Governor's-office release that both DESCRIBE the operative statute in terms. So
# the legend rule, the redesign cadence and the current-design date below are all
# state-government primary, and the code sections themselves are a named gap.
jurisdiction: us-tn
authority:
  name: Tennessee Department of Revenue, Vehicle Services Division
  url: "https://www.tn.gov/revenue/title-and-registration/license-plates.html"
binding: vehicle
statute_edition: >-
  TENNESSEE CODE ANNOTATED NOT DIRECTLY OBTAINED — published through LexisNexis,
  which returns a JavaScript shell; every mirror attempted returned 403/410. What
  WAS obtained is better than a paraphrase and worse than the code: Public Chapter
  No. 250 of the 113th General Assembly (Senate Bill 142, substituted for House
  Bill 137), fetched in full from the Secretary of State's own acts server, which
  amends Title 55, Chapter 4; plus two state-government pages that state the
  contents of the governing statute in terms. Title 55, Chapter 4, Part 1 —
  the plate-design sections proper — is a recorded gap.

# ---------------------------------------------------------------------------
# artwork_risk — required per jurisdiction by PRD-PLATES §4.
# ---------------------------------------------------------------------------
artwork_risk:
  posture: unresearched
  basis: >-
    Tennessee appears in the pinned dossier only as a NEGATIVE: the dossier's
    per-state table lists Florida, California, North Carolina, New Jersey,
    Massachusetts and Georgia as favourable and New York, Arizona, Washington and
    Pennsylvania as adverse, and records Texas and Delaware as "not established".
    Tennessee is in neither list and no Commons {{PD-TNGov}} tag was located, so it
    falls to the dossier's default: 17 U.S.C. §105 does not reach the states,
    therefore a state plate design is copyrighted unless that state says otherwise.
    No Tennessee statement either way was found. Recorded as unresearched, which is
    the honest label, not as safe.
  design_provenance_complication: >-
    A Tennessee-specific wrinkle worth flagging before any clearance is attempted:
    the current base was selected by PUBLIC VOTE. The Governor's office states that
    "More than 300,000 Tennessee residents cast a vote, with 42% voting for the
    winning design." A design chosen by referendum among candidate designs implies
    candidate designers, and whatever the State's posture toward its own works, the
    chain of title on a competition-selected design is a question in its own right.
    Unresearched.
  emblem_rule: >-
    PRD-PLATES §3 placeholder default applies. Three devices are in scope on the
    current base and all render as placeholders: the OUTLINED STATE MAP containing
    the word TENNESSEE at the top, the STATE FLAG EMBLEM that occupies the serial
    gap, and — on the In God We Trust option — what a locator calls "the state's
    unofficial logo emblem". The flag device is the touchiest: a state flag is
    protected by flag-misuse statutes independent of copyright, and that regime is
    unresearched for Tennessee.
  sources:
    - "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html  # Office of the Governor: the design was chosen by statewide public vote, 300,000+ votes cast, 42% for the winner"
    - "https://en.wikipedia.org/wiki/Copyright_status_of_works_by_subnational_governments_of_the_United_States  # LOCATOR ONLY, via the pinned dossier: the default-copyrighted rule and the exception list, which does not include Tennessee"

us_standards:
  no_federal_mandate: true
  chain: "SAE J686 -> AAMVA License Plate Standard Edition 3 (September 2025) -> voluntary state adoption; recommendations in the declarative present, no enforcement power."
  aamva_edition_3:
    dimensions_delegated: "AAMVA §3.1 sends dimensions and bolt holes to SAE J686, whose text is PAYWALLED and was NOT obtained. No J686 dimension is quoted anywhere in this dataset."
    jurisdiction_name_layout: "AAMVA §2.1: the jurisdiction name 'appears in the top center location between the bolt holes', jurisdiction characters 0.75-1.0 in. Tennessee complies in an unusual way — TENNESSEE sits at the top centre but INSIDE an outlined state map rather than as free text."
    character_layout: "AAMVA §2.2: characters at least 2.5 in high, spaced at least 0.25 in apart, stroke weight 0.2-0.4 in."
    stacked_characters: "AAMVA: stacked characters are part of the official plate number, at most two stacked."
    replacement_cycle: >-
      AAMVA §1.1 recommends a rolling or full replacement cycle not to exceed 7 to
      10 years. TENNESSEE'S IS EIGHT AND IT IS BUDGET-CONDITIONAL — see
      redesign_cycle below. Eight sits inside AAMVA's range; the conditionality does
      not, and is the more interesting half.
    source: "https://www.aamva.org/getmedia/646bcc8a-219b-47d8-b5cd-726240473163/License-Plate-Standard-Edition-3_September-2025-Update.pdf"
  folklore_caution: >-
    The "1956 agreement" appears in the Tennessee article's lead as it does in every
    state article read for this group, now carrying one citation — Garrish,
    Christopher, "Reconsidering the Standard Plate Size", *Plates* (Automobile
    License Plate Collectors Association), vol. 62 no. 5, October 2016. Not
    obtainable; title implies revision rather than confirmation. Still recorded as
    commonly repeated and unsourced. Tennessee's 12x6 in figure in this file is
    locator-grade and labelled as such.
  aamva_specialty_guidance: "AAMVA also publishes 'Regulation of Specific-Use License Plates Best Practices' (March 2023), which is the relevant standard for a state running 200+ specialty programs. URL pinned in the dossier; not fetched in this pass."

# ---------------------------------------------------------------------------
# Redesign cadence — Tennessee legislates one, and legislates a condition on it.
# ---------------------------------------------------------------------------
redesign_cycle:
  years: 8
  conditional: true
  statement: >-
    Office of the Governor, verbatim: "Per Tennessee statute, the plate is
    redesigned every eight years if funds are approved in the General Assembly's
    annual budget."
  note: >-
    THIS IS A DIFFERENT KIND OF CYCLE FROM EVERY OTHER ONE IN THE DATASET. Florida
    legislated a ten-year REPLACEMENT cycle — how long a plate stays on a car.
    Mississippi legislated a five-year TAG cycle. Tennessee legislates a
    REDESIGN cycle — how often the state draws a new plate — and then makes it
    contingent on an annual appropriation. So the Tennessee period boundary is
    predictable in principle and defeasible in fact, and a dataset that hard-codes
    "next base 2030" on the strength of it would be asserting a budget outcome. The
    cadence is recorded; no future boundary is projected from it.
  statute_text_status: "NOT OBTAINED. The Governor's office describes the statute; the section itself is behind LexisNexis. A verifier with TCA access should pin the section number and the exact wording."
  source: "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html"

# ---------------------------------------------------------------------------
# Legend rules — statutory, and stated by the Governor's office in terms.
# ---------------------------------------------------------------------------
legend_rules:
  statutory_elements_2021: >-
    Office of the Governor, October 2021, verbatim: "Statute also requires the
    display of 'Tennessee,' 'Volunteer State' and 'TNvacation.com' on the plate, as
    well as county name and expiration year decal locations. Statute provides that
    Tennesseans may select an 'In God We Trust' plate option."
  amended_2023: >-
    Public Chapter 250 (2023) removed the tourism URL. The Department of Revenue, in
    its own words: "In the 2023 legislative session, the General Assembly passed
    legislation that makes minor changes to the standard license plate. The changes
    remove the words www.tnvacation.com from both the standard and In God We Trust
    license plates. For the In God We Trust plate option, the words 'In God We
    Trust' will be located where www.tnvacation.com currently appears."
  legislated_url_note: >-
    WORTH PAUSING ON: Tennessee is the only jurisdiction in this dataset whose
    LEGISLATURE put a MARKETING URL on the plate by statute, and then took it off by
    statute two years later. It is a clean demonstration of why plate legends belong
    in the period-disciplined layer rather than in a static design record — the
    legend changed without the base changing, and the two must be separable.
  clerk_default_rule: >-
    A rule with real dataset consequences, from the Department of Revenue: "the
    clerks are required to ask each customer if they prefer the In God We Trust plate
    or the plate without the In God We Trust language. If the customer does not
    indicate a preference, the customer should be issued the In God We Trust plate."
    The DEFAULT option is In God We Trust. Any consumer estimating the relative
    population of the two Tennessee standard series must know that the split is not
    a free choice between equals.
  sources:
    - "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html  # the statutory legend list as it stood in 2021, the eight-year conditional redesign cycle, and the January 3, 2022 availability date"
    - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/standard-plate-faq.html  # TN Dept of Revenue Standard Plate FAQ: the Public Chapter 250 changes, the clerk-must-ask rule and the In God We Trust default, and the January 1, 2024 availability date"
    - "https://publications.tnsosfiles.com/acts/113/pub/pc0250.pdf  # Public Chapter No. 250, 113th General Assembly (SB 142 / HB 137), 'AN ACT to amend Tennessee Code Annotated, Title 55, Chapter 4, relative to license plates' — fetched in full from the Secretary of State's acts server"

display_rules:
  default_reported: "ONE plate, rear only, since 1977"
  evidence: "LOCATOR-GRADE. No Tennessee display statute was obtained. Recorded as an open claim."
  sources:
    - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY: rear plates only since 1977"

series:

  # =========================================================================
  # CURRENT STANDARD — the plain option. Three letters, four numerals.
  # =========================================================================
  - id: us-tn-standard-2024
    class: standard
    categories: [car, van, truck]
    period: { start: 2024 }
    period_evidence: agency-stated-date
    matching: strict
    format:
      pattern: "LLL 9999"
      regex: '\A[A-Z]{3} ?\d{4}\z'
      charset:
        notes: >-
          No alphabet restriction is sourced FOR THIS SERIES. Tennessee has
          demonstrably excluded characters in the past — a locator records that
          vowels were not used in the older 123-ABC and ABC-123 formats, and that
          I, O and Q were not used in the A12-34B, 1A2-3B4 and 12A-B34 formats — and
          the reported serial range for the current base begins at BBB-0001 rather
          than AAA-0001, which is consistent with a vowel exclusion continuing. That
          is a suggestive pattern, not a source, so NO `regex_strict` is offered and
          the inference is recorded here instead of encoded there.
      separator_note: >-
        THE SEPARATOR IS THE STATE FLAG EMBLEM. On the 2022-and-later base the gap
        between the letter and numeral groups is occupied by a screened flag device,
        not by a printed glyph. Per plates/_meta/separators.yml §4 an emblem between
        serial groups is a design element carried in `design.emblem`, never a serial
        character and never strippable-as-punctuation. The regex spells the position
        as an optional SPACE, the honest printed form of a gap. Collector sources
        write it as a hyphen (ABC-1234) and a separator-forgiving consumer will
        canonicalise both to ABC1234 by construction, which is the whole point of
        the §2.6 contract. Mississippi's magnolia does exactly the same job in the
        same group.
      pattern_note: >-
        `matching: strict`: the regex lies inside what Tennessee issues and a match
        is a real well-formedness claim. No `regex_statutory` twin, because no
        Tennessee instrument stating an outer character cap was obtained — Florida's
        seven-character statutory ceiling has no Tennessee counterpart in evidence.
    design:
      plate: { w: 12, h: 6, unit: in, hex_basis_note: "locator-grade; no Tennessee instrument stating it was obtained" }
      material: "aluminium (locator)"
      background: { color: "#00205B", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      colour_note: >-
        Both hexes are `observed` approximations of the described "screened white
        serial on reflective blue plate" and are NOT sourced to any Tennessee
        instrument. No colour specification was located. Treat as unverified.
      legend_top: "TENNESSEE"
      legend_top_note: "screened in white INSIDE an outlined state map at the top centre — an unusual satisfaction of AAMVA §2.1's top-centre jurisdiction-name rule"
      legend_corner: "THE VOLUNTEER STATE (top left, to the left of the state map)"
      legend_bottom: "<county name>, on a WHITE STICKER"
      county_sticker_note: >-
        Tennessee puts the county on a REMOVABLE STICKER, not in the metal. So the
        county legend is not a property of the plate at all — it is a property of the
        current registration, and it can change without the plate changing. Kentucky
        does the same. Mississippi, in this same group, embosses the county into the
        plate and therefore cannot. Three neighbouring states, three different
        answers to where the county lives, and only the Mississippi answer binds the
        county to the metal.
      emblem: { present: true, rendered: placeholder, description: "state flag device occupying the serial gap; outlined state map containing the wordmark at top — see format.separator_note and artwork_risk.emblem_rule" }
      rear_differs: false
    sources:
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/standard-plate-faq.html  # TN Dept of Revenue: 'The new design will be available beginning January 1, 2024, OR upon depletion of the county's inventory of the current blue plate'; the Public Chapter 250 changes; the new design is for new registrations only, not renewals; the eligibility rules for a replacement"
      - "https://publications.tnsosfiles.com/acts/113/pub/pc0250.pdf  # Public Chapter No. 250 (2023), the amending instrument itself"
      - "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html  # the blue base's own origin, the statutory legend list, and the eight-year conditional redesign cycle"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY (PRD-PLATES §4): the ABC-1234 arrangement, the flag-emblem separator, blue/white colours, the outlined state map, the white county sticker, the reported BRC-8001 to BVP-2252 range as of December 2025, and a November 16, 2023 start date that DISAGREES with the Department's own January 1, 2024 — see notes"
    notes: >-
      TENNESSEE STANDARD ISSUE, PLAIN OPTION. A RECORDED DISAGREEMENT ON THE START
      DATE, NOT AN AVERAGE OF ONE (PRD-PLATES §5.3): the Department of Revenue says
      the redesigned plate becomes available "beginning January 1, 2024, OR upon
      depletion of the county's inventory of the current blue plate", while a locator
      dates the change to November 16, 2023. Both dates can be literally true —
      counties with exhausted stock could begin earlier than the statewide date — and
      the two are not reconciled here. `start: 2024` is taken because it is the
      administering department's own statement; the November 2023 claim is recorded
      in the source line and nowhere else.
      THE ROLLOUT IS UNUSUALLY SLOW BY DESIGN, and this matters for anyone reasoning
      about how many 2024-design plates exist. The Department is explicit that the new
      plate is issued for NEW REGISTRATIONS ONLY and "will not be issued upon renewal",
      with replacement otherwise limited to switching between the two legend options or
      to a lost, stolen, destroyed, mutilated or illegible plate. So the 2022 and 2024
      designs will coexist on Tennessee roads for many years — parallel issuance in the
      §2.2 sense, made explicit by statute rather than by old stock running out.

  # =========================================================================
  # CURRENT STANDARD — the In God We Trust option. THE ARRANGEMENT IS REVERSED.
  # =========================================================================
  - id: us-tn-standard-igwt-2024
    class: standard
    categories: [car, van, truck]
    period: { start: 2024 }
    period_evidence: agency-stated-date
    matching: strict
    format:
      pattern: "999 LLLL"
      regex: '\A\d{3} ?[A-Z]{4}\z'
      charset: { notes: "no sourced alphabet restriction; see us-tn-standard-2024 for the unencoded vowel-exclusion inference, which applies here too — the reported range begins 001-BMDN" }
      pattern_note: >-
        THREE NUMERALS THEN FOUR LETTERS, the mirror image of the plain option's
        three letters then four numerals. This is the whole reason the two options
        are separate series: the serial ALONE identifies which Tennessee standard
        option a plate is, with no image, no lookup and no ambiguity. Very few
        jurisdictions hand a parse API a discriminator this clean, and no competing
        dataset carries it.
    design:
      plate: { w: 12, h: 6, unit: in }
      background: { color: "#00205B", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      legend_top: "TENNESSEE"
      legend_corner: "THE VOLUNTEER STATE"
      legend_extra: "IN GOD WE TRUST, screened between the serial and the county sticker — the position vacated by www.tnvacation.com when Public Chapter 250 removed it"
      legend_bottom: "<county name>, on a white sticker"
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    issuance_default: >-
      THE DEFAULT OPTION. Per the Department of Revenue, clerks must ask each customer
      which they prefer, and "If the customer does not indicate a preference, the
      customer should be issued the In God We Trust plate." This series is what a
      Tennessean gets by not choosing.
    sources:
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/standard-plate-faq.html  # TN Dept of Revenue: the In God We Trust option, the relocation of the legend into the vacated tnvacation.com position, the clerk-must-ask rule and the default, and the January 1, 2024 availability date"
      - "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html  # 'Statute provides that Tennesseans may select an In God We Trust plate option' — the option is legislated, not administrative"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY: the 123-ABCD arrangement and the reported 001-BMDN onward range as of July 2026"
    notes: >-
      THE IN GOD WE TRUST STANDARD OPTION, 2024 design. Its own series on two of the
      three §2.3 tests at once — FORMAT differs (reversed arrangement) and DESIGN
      differs (the added legend) — which is as unambiguous as that test ever gets.
      THE CROSS-STATE POINT, and the reason this entry is the hinge of the group:
      Kentucky offers the same statutory In God We Trust option on the same base as
      its plain plate, and draws the serials for both from ONE allocation. So in
      Tennessee the serial identifies the option and in Kentucky it cannot, although
      the policies are twins. A dataset that modelled "In God We Trust" as a flag
      rather than as a series would have erased a real, usable discriminator in one
      state to accommodate its absence in the other.

  # =========================================================================
  # ONE SERIES BACK — the 2022 blue base with the legislated tourism URL.
  # =========================================================================
  - id: us-tn-standard-2022
    class: standard
    categories: [car, van, truck]
    period: { start: 2022, end: 2024 }
    period_evidence: agency-stated-date
    matching: strict
    format:
      pattern: "LLL 9999"
      regex: '\A[A-Z]{3} ?\d{4}\z'
      charset: { notes: "same arrangement as its successor; the 2023 amendment changed the LEGEND, not the serial. Reported range BBB-0001 to BRC-2189, with BRC-2190 to BRC-8000 never issued" }
    design:
      plate: { w: 12, h: 6, unit: in }
      background: { color: "#00205B", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      legend_top: "TENNESSEE"
      legend_corner: "THE VOLUNTEER STATE"
      legend_extra: "TNVACATION.COM, screened in white between the serial and the county sticker — statutorily required at the time and statutorily removed in 2023"
      legend_bottom: "<county name>, on a white sticker"
      emblem: { present: true, rendered: placeholder }
    sources:
      - "https://www.tn.gov/governor/news/2021/10/5/gov--lee-unveils-new-license-plate-design-picked-by-tennesseans.html  # Office of the Governor: 'New plates will be available online and in-person beginning January 3, 2022'; up to 100,000 plates per week produced for initial inventory; the design was chosen by public vote; 'This new license plate design will replace the current plate that launched in 2006 with modifications in 2011, 2016 and 2017'"
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/standard-plate-faq.html  # the Department's own account of what the 2023 amendment changed, which is what closes this series"
      - "https://publications.tnsosfiles.com/acts/113/pub/pc0250.pdf  # Public Chapter No. 250 (2023), the instrument that ended it"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY: the BBB-0001 to BRC-2189 range and the unissued BRC-2190 to BRC-8000 gap"
    notes: >-
      THE 2022 BLUE BASE, plain option — the predecessor L2 asks for, and the better
      documented of the two Tennessee generations. Its start is genuinely
      well-sourced: the Governor's office named January 3, 2022 in a dated release
      four months ahead of it, and stated the production rate. Its END is a
      legend amendment rather than a redesign, which is why the base looks identical
      across the boundary and why the serial arrangement is unchanged.
      THE UNISSUED BLOCK IS THE INTERESTING DETAIL: a locator records that serials
      BRC-2190 through BRC-8000 were never issued, the 2024 design resuming at
      BRC-8001. A skipped block at a design boundary is exactly the kind of fact that
      makes a naive range-based era inference wrong, and it is recorded for that
      reason even though it is locator-grade.

  - id: us-tn-standard-igwt-2022
    class: standard
    categories: [car, van, truck]
    period: { start: 2022, end: 2024 }
    period_evidence: agency-stated-date
    matching: strict
    format:
      pattern: "999 LLLL"
      regex: '\A\d{3} ?[A-Z]{4}\z'
      charset: { notes: "reported range 001-BBBB to 999-BMDM" }
    design:
      plate: { w: 12, h: 6, unit: in }
      background: { color: "#00205B", finish: retroreflective, hex_basis: observed }
      foreground: "#FFFFFF"
      legend_extra: "IN GOD WE TRUST curved around a centre emblem, PLUS TNVACATION.COM between serial and county sticker — this base carried both, which is why the 2023 amendment had somewhere to move the legend to"
      legend_bottom: "<county name>, on a white sticker"
      emblem: { present: true, rendered: placeholder }
    sources:
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/standard-plate-faq.html  # the Department's description of what changed for the In God We Trust option in 2023: the legend moved into the position tnvacation.com had occupied"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY: the 123-ABCD arrangement on this base and the 001-BBBB to 999-BMDM range"
    notes: >-
      THE 2022 IN GOD WE TRUST OPTION. Recorded as its own series for the same
      reasons as its 2024 successor — reversed arrangement plus distinct legend — and
      recorded at all because the L2 "one series back" requirement applies to each
      standard option separately when the options are separate series. It also
      documents the mechanism of the 2023 change concretely: this base carried BOTH
      the religious legend and the tourism URL, so removing the URL left a hole the
      legend then moved into, which is why the two 2024 options differ from their
      2022 twins in legend POSITION as well as in content.

  # =========================================================================
  # SPECIALTY — THE PROGRAM INDEX, per PRD-PLATES §2.5.
  # =========================================================================
  - id: us-tn-specialty-index
    class: specialty
    categories: [car, van, truck, motorcycle]
    period: { start: 2024 }
    period_evidence: instrument-in-force-upper-bound
    matching: recall-only
    format:
      pattern: "999999"
      regex: '\A[A-Z0-9]{1,7}\z'
      charset: { notes: "no Tennessee character cap was obtained; the seven-character bound is a regional convention and is NOT sourced, which is why this series is recall-only" }
      pattern_note: "`matching: recall-only` (§2.7): one entry stands for 200+ programs whose individual arrangements are out of scope at this gate. A match is a shape hit. No `regex_strict`, per §2.7."
    design:
      plate: { w: 12, h: 6, unit: in }
      background: { finish: retroreflective }
      emblem: { present: true, rendered: placeholder }
      note: "one design per authorised program; individual designs are L4 scope"
    program_index:
      count_reported: "over 200"
      count_source_note: >-
        The figure comes from tnspecialtyplates.org, run by the TENNESSEE ARTS
        COMMISSION — a state agency, not a hobbyist. It is treated as agency-adjacent
        rather than as a locator, but the page itself was not fetched in this pass
        (the count reached us through the Wikipedia citation), so it is recorded as
        REPORTED and the URL is pinned for the verifier to close.
      revenue_earmark_structure: >-
        THE MOST STRUCTURALLY UNUSUAL SPECIALTY PROGRAM IN THIS GROUP, and it is in
        statute. Public Chapter 250 (2023) rewrote Title 55, Chapter 4, Part 3 and
        sets the split verbatim: after the department's costs, "Fifty percent (50%) of
        the funds must be allocated to the nonprofit organization or state agency or
        fund earmarked to receive the funds"; "Forty percent (40%) of the funds must
        be allocated to the Tennessee arts commission"; and "Ten percent (10%) of the
        funds must be allocated to the state highway fund." Tennessee funds its ARTS
        COMMISSION from licence plates, at forty cents on the dollar, which is why the
        arts commission — not the revenue department — runs the public specialty
        catalogue.
      arts_grant_geography: >-
        The same chapter constrains where the money lands: of the arts commission's
        share, "One-third (1/3) of the funds must be distributed to qualifying arts
        organizations or events in urban counties" and "Two-thirds (2/3) ... in rural
        counties", with up to half of the commission's allocation spendable on other
        grants and activities first.
      official_department_url: "https://www.tn.gov/revenue/title-and-registration/license-plates/available-license-plates.html"
      official_arts_commission_url: "https://tnspecialtyplates.org/purchase-a-specialty-plate/"
      new_plate_process_url: "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/how-to-introduce-a-new-specialty-plate.html"
      pipeline_url: "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/proposed-specialty-plates-plates-under-construction.html"
      pipeline_note: >-
        Tennessee publishes a "Proposed Specialty Plates or Plates Under Construction"
        page — a FORWARD-LOOKING index of plates not yet issued. Alabama's dated memo
        series is the closest equivalent found in this group. Both are worth a
        scheduled capture: they are the only public evidence of specialty churn before
        it happens, and neither is archived by its publisher.
      surrender_url: "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information/surrendering-a-plate.html"
    region_encoding: none
    sources:
      - "https://publications.tnsosfiles.com/acts/113/pub/pc0250.pdf  # Public Chapter No. 250, 113th General Assembly: the 50/40/10 revenue split for new specialty earmarked plates, the one-third urban / two-thirds rural grant constraint, and the legislative-intent limits on who may receive earmarked funds"
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/available-license-plates.html  # the Department's own specialty catalogue (a JavaScript gallery; no list extractable without a rendering browser)"
      - "https://www.tn.gov/revenue/title-and-registration/license-plates/additional-license-plate-information.html  # the Department's index of how to introduce a plate, plates under construction, and surrender"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Tennessee  # LOCATOR ONLY: 'Tennessee offers over 200 optional license plates', attributed to the Tennessee Arts Commission's specialty-plate site"
    notes: >-
      THE TENNESSEE SPECIALTY INDEX — one entry standing for the program, per §2.5. The
      count is the weakest thing in it and the STATUTE is the strongest: Public Chapter
      250 gives the actual revenue mechanics verbatim from the session law, which is a
      PD edict of government and the best possible source. The finding worth carrying
      forward is institutional rather than numeric — in Tennessee the specialty program
      is an arts-funding instrument that happens to be attached to vehicles, the arts
      commission takes forty percent of it, and consequently the authoritative public
      catalogue lives at the arts commission rather than at the revenue department.
      Any future pass that goes looking for Tennessee specialty data at tn.gov/revenue
      alone will find the thinner half of it.

  # =========================================================================
  # CLASSES NOT SPECCED — recorded so the gap is visible, not implied.
  # =========================================================================
  - id: us-tn-motorcycle
    class: motorcycle
    categories: [motorcycle]
    period: { start: 2024 }
    period_evidence: instrument-in-force-upper-bound
    matching: recall-only
    format:
      pattern: "999999"
      regex: '\A[A-Z0-9]+\z'
      charset: { notes: "NO WIDTH CLAIM IS MADE. The quantifier is unbounded precisely because no Tennessee motorcycle serial grammar was obtained from any source, agency or locator, in this pass" }
      pattern_note: "`matching: recall-only` (§2.7) and deliberately so: this regex is wider than anything Tennessee issues and a match means only 'this string is alphanumeric'. It exists to record that Tennessee serializes motorcycles separately, not to validate one. No `regex_strict`, per §2.7."
    design:
      plate: { w: 7, h: 4, unit: in, hex_basis_note: "regional convention, NOT sourced for Tennessee" }
      background: { finish: retroreflective }
      emblem: { present: true, rendered: placeholder }
    region_encoding: none
    sources:
      - "https://www.tn.gov/revenue/title-and-registration/license-plates.html  # the Department's plate index, which establishes that Tennessee issues motorcycle plates as a distinct type"
    notes: >-
      TENNESSEE MOTORCYCLE PLATES — AN HONEST STUB, AND LABELLED AS ONE. It is included
      rather than omitted because omission would read as "Tennessee does not separately
      serialize motorcycles", which is false, whereas a recall-only entry with an
      unbounded regex says exactly what is known: the class exists, the grammar was not
      obtained. `matching: recall-only` is doing real work here — under §2.7 a consumer
      reading this series knows without inferring that a match is not a validity claim.
      This is the shape any state's under-researched class should take in this dataset
      rather than a plausible-looking invented pattern.
