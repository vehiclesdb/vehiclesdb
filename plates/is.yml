# plates/is.yml — Iceland (PRD-PLATES gate L1, wave 2).
#
# THE 1989 CUTOVER IS THE WHOLE STORY, AND IT IS DATED — just not by the
# instrument that made it. Read this before trusting any period below.
#
# On 1 January 1989 Iceland replaced a district-letter system with the
# FASTANÚMER: a number chosen at random, fixed to the vehicle for its life.
# What that abolished is the point. Under the old system the letter recorded
# the district where the OWNER was domiciled, so selling a car across district
# lines RE-PLATED it, and an owner could keep his number and move it to a new
# car. The 1989 reform severed the number from the owner and welded it to the
# vehicle — the same reform Norway made in 1971, eighteen years earlier.
#
# THE INSTRUMENT THAT DID IT HAS NO RETRIEVABLE TEXT. Reglugerð nr. 523/1988 um
# skráningu ökutækja, set 15 December 1988, is on reglugerd.is as a stub: no
# body ("Texti ekki kominn"), no sett/birt/gildistaka date fields at all. Its
# commencement clause is therefore UNVERIFIED and is not asserted anywhere in
# this file.
#
# THE DATE IS NEVERTHELESS PRIMARY, from two downstream instruments that make
# 1 January 1989 legally operative and are both readable:
#   * reglugerð 78/1997, 34. gr. "Notkun eldri skráningarmerkja": "Ökutæki sem
#     skráð voru fyrir 1. janúar 1989 mega áfram bera skráningarmerki af eldri
#     gerð, enda séu merkin heil og vel læsileg" — with sunsets of 31 December
#     1997 for bifhjól and eftirvagnar and 31 December 1998 for the rest.
#   * reglugerð 751/2003, VII. kafli, which splits its transitional articles at
#     exactly that date: 28. gr. for vehicles registered 1 January 1989 to
#     31 December 2003, 29. gr. for those registered BEFORE 1 January 1989.
# So the boundary is `transitional-provision` — carried by the saving clauses of
# LATER instruments — rather than `instrument-in-force`, and the distinction is
# deliberate: nothing here rests on 523/1988's own unread commencement clause.
#
# A DATE CORRECTED AWAY FROM FOLKLORE. The move from two letters + three digits
# to THREE letters + two digits is dated "2007" almost everywhere, on the story
# that the combinations ran out that year. The instrument says otherwise:
# reglugerð nr. 691/2006, 2. gr. — "Við 3. mgr. 4. gr. bætist: eða þrír
# bókstafir og tveir tölustafir" — was set on 25 JULY 2006 and "öðlast þegar
# gildi", immediately, with no transitional deferral. The only 2007 amendment
# to 751/2003 is reglugerð 1231/2007, which is about the age-65 rule for
# personalised plates and has nothing to do with the format. period.start on
# `is-standard-2006` is 2006 accordingly.
#
# A METHODOLOGICAL WARNING THAT AFFECTS EVERY CLAIM BELOW. The body text of
# reglugerð 751/2003 served by reglugerd.is is NOT a reliable consolidation: it
# omits reglugerð 691/2006's addition to 4. gr. (the three-letter shape) and
# reglugerð 1515/2020's new plate type E. Each amending reglugerð has to be
# read separately, and this file cites them individually where they bite. Of
# the thirteen amendments listed (299/2004, 506/2005, 656/2005, 158/2006,
# 307/2006, 691/2006, 756/2006, 1231/2007, 669/2008, 408/2009, 169/2016,
# 1086/2018, 1515/2020) ten were read individually in this pass; 299/2004,
# 506/2005 and 656/2005 were NOT — a recorded gap.
#
# THE ENABLING CHAIN. Reglugerð 751/2003 was made under umferðarlög nr. 50/1987
# (dated 30 March 1987, in force 1 March 1988), whose 64. gr. empowers the
# minister to make rules on, among other things, c) skráningarmerki. That act
# was repealed by umferðarlög nr. 77/2019 with effect from 1 January 2020, and
# the current statutory hooks are 72. gr. (skráning) and 73. gr. (einkamerki).
# AN EVIDENCED NEGATIVE WORTH RECORDING: the word "fastanúmer" appears NOWHERE
# in umferðarlög 50/1987. The concept that defines the modern Icelandic plate
# is purely regulatory and has never been statutory.
#
# COLOUR POLICY: reglugerð 751/2003 names colours only — "hvítur með endurskini",
# "blá", "rauð", "grænn", "blár" — and gives no RAL, CIE or RGB value for any of
# them. Every hex below is therefore `hex_basis: observed` and INDICATIVE, the
# same posture se.yml and de.yml record for Sweden and Germany.
#
# NO EU BAND. Iceland is in the EEA but not the EU, and its plates carry no
# Reg. 2411/98 blue band. 18. gr. prescribes instead a þjóðarmerki: a 95 x 50 mm
# field bearing the Icelandic flag at 30 x 42 mm and the letters IS in BLACK.
# It commenced on 1 February 2004 under the regulation's own gildistaka clause.
jurisdiction: "is"
authority:
  name: Samgöngustofa (Icelandic Transport Authority)
  url: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003"
binding: vehicle

instrument:
  citation: "Reglugerð nr. 751/2003 um skráningu ökutækja"
  set: "2003-10-06"
  in_force: "2003-10-06"
  deferred_provisions: "18. gr., 2. mgr. 28. gr. and 3. mgr. 34. gr., so far as they concern the þjóðarmerki, from 2004-02-01 (37. gr.)"
  replaces: "Reglugerð nr. 78/1997 um skráningu ökutækja (in force 1997-02-04), which replaced reglugerð nr. 523/1988 (set 1988-12-15)"
  enabling: "Umferðarlög nr. 50/1987, 60., 64. gr. a og 67. gr.; the current enabling act is umferðarlög nr. 77/2019 (in force 2020-01-01), 72.-73. gr."
  source: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 37. gr. gildistaka: 'Reglugerð þessi tekur þegar gildi, þó ekki 18. gr., 2. mgr. 28. gr., og 3. mgr. 34. gr., að því er varðar þjóðarmerki ... sem tekur gildi 1. febrúar 2004.' Accessed 2026-08-02"

common:
  fastanumer:
    text: >-
      4. gr., 3. mgr., verbatim as originally enacted: "Ökutækið fær í
      ökutækjaskrá fastanúmer, valið af handahófi, sem í eru tveir bókstafir og
      þrír tölustafir." Reglugerð 691/2006, 2. gr. appended "eða þrír bókstafir
      og tveir tölustafir" and added "Síðasti stafur í fastanúmeri skal vera
      tölustafir" — the last character of a fastanúmer must be a digit, which
      both shapes satisfy inherently and which is what forbids a third shape.
    randomness: >-
      "VALIÐ AF HANDAHÓFI" — chosen AT RANDOM, and this is the single most
      consequential fact about Icelandic plates for a parse API. There is no
      sequence, so there is no age inference, no regional inference and no
      block structure. The only signal an Icelandic fastanúmer carries is its
      SHAPE: a three-letter mark cannot predate 25 July 2006.
    source: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 4. gr. 3. mgr. Accessed 2026-08-02"
  charset:
    excluded_letters: []
    basis: evidenced-negative
    note: >-
      THERE IS NO LETTER-EXCLUSION RULE. A direct reading of reglugerð 751/2003
      found no provision excluding the Icelandic letters (Á, Ð, É, Í, Ó, Ú, Ý,
      Þ, Æ, Ö) or the lookalikes I and O from a fastanúmer, and none of the ten
      amendments read adds one. Recorded as an evidenced negative rather than as
      an absence of research — but note the practical consequence: because no
      rule bars them and no rule admits them either, this file makes NO claim
      about whether Icelandic letters occur in fastanúmer, and every regex below
      is written over A-Z per _meta/separators.yml. Einkamerki are different and
      expressly DO admit Icelandic letters — see is-personal-2003.
    source: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # whole-text reading. Accessed 2026-08-02"
  plate_types:
    text: >-
      18. gr. "Gerð skráningarmerkja", four types as enacted plus one added in
      2020: A 520 x 110 mm (character height 70, stroke 11); B 280 x 200 mm
      (70/11); C 240 x 130 mm (49/7); D 305 x 155 mm (61/9); E 168 x 133 mm
      (added by reglugerð 1515/2020). Material: "Skráningarmerki skal vera úr
      a.m.k. 1,0 mm þykku áli" — at least 1.0 mm aluminium.
    two_row: >-
      Reglugerð 669/2008 (20 June 2008) added 18. gr. 4. mgr.: "Skráningarmerki
      af gerð B, C og D skulu hafa áletrun í tveim röðum", with "tvo bókstafi og
      bandstrik í þeirri efri" — two letters AND THE BANDSTRIK on the upper row,
      the digits below. Note what that settles: the bandstrik is a printed
      element that travels with the LETTER group, not a mere gap.
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 18. gr.: types A-D, dimensions, character heights and stroke widths, aluminium thickness, and the þjóðarmerki field. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/669-2008  # 18. gr. 4. mgr., the two-row rule for types B, C and D. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/1515-2020  # 14 December 2020: adds gerð E (168 x 133 mm) and orange plates for létt bifhjól í flokki I. Accessed 2026-08-02"
  national_mark:
    side: left
    content: "icelandic-flag-over-IS"
    text: >-
      18. gr.: a field 95 x 50 mm carrying "Íslenski fáninn, 30 x 42 mm" and
      "stafirnir IS, svartir að lit". NOT an EU band — Iceland is in the EEA but
      not the EU, so there is no Reg. 2411/98 blue field and no ring of stars.
    in_force: "2004-02-01"
    in_force_basis: >-
      From the regulation's own gildistaka clause (37. gr.), which defers
      18. gr. and the þjóðarmerki provisions of 28. gr. and 34. gr. to
      1 February 2004 while the rest of the regulation took effect at once. An
      instrument dating its own provision — the strongest shape of evidence in
      this file.
    source: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 18. gr. and 37. gr. Accessed 2026-08-02"
  separator:
    text: >-
      Icelandic plates print a BANDSTRIK between the letter group and the digit
      group, and it is a coloured element in its own right: 19. gr. colours
      "rönd á brúnum, stafir og bandstrik" together in every colour rule, and
      the two-row rule of 669/2008 places the bandstrik on the letter row. It is
      therefore written as the emitted HYPHEN in every `pattern` below, per
      PRD-PLATES §2.6, and the regexes accept a hyphen or a space at that
      position under the §2.8 separator-only class rule.
    source: "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 18.-19. gr. Accessed 2026-08-02"

series:

  # =========================================================================
  # THE CURRENT SERIES — two shapes, one system, and one of them is dated.
  # =========================================================================
  - id: is-standard-1989
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1989 }
    period_evidence: transitional-provision
    matching: strict
    format:
      pattern: "LL-999"
      regex: '\A[A-Z]{2}[- ]?\d{3}\z'
      charset:
        notes: "no letter exclusion is prescribed — see common.charset. No regex_strict is offered, because there is no sourced alphabet to narrow to."
      progression: >-
        NONE. The fastanúmer is "valið af handahófi" (4. gr.) — chosen at
        random, not issued in sequence — so no age, region or class can be
        inferred from the characters. See common.fastanumer.
      separator_note: "the bandstrik; see common.separator"
    design:
      plate: { w: 520, h: 110, unit: mm, note: "gerð A; character height 70 mm, stroke 11 mm" }
      plate_variants:
        - { w: 280, h: 200, unit: mm, note: "gerð B — two rows, letters and bandstrik above" }
        - { w: 240, h: 130, unit: mm, note: "gerð C — two rows; characters 49 mm, stroke 7 mm" }
        - { w: 305, h: 155, unit: mm, note: "gerð D — two rows; characters 61 mm, stroke 9 mm" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec, spec_note: "19. gr.: 'Grunnur skráningarmerkis skal vera hvítur með endurskini'" }
      foreground: "#003399"
      foreground_note: "19. gr.: 'Rönd á brúnum, stafir og bandstrik skulu vera blá' — the border stripe, the characters AND the bandstrik are all blue. Colour named, not numbered; hex is observed."
      border: { color: "#003399", hex_basis: observed }
      band: { side: left, content: "icelandic-flag+IS", note: "the þjóðarmerki, from 1 February 2004 — NOT an EU band; see common.national_mark" }
      emblem: { present: false }
      rear_differs: false
      material: "at least 1.0 mm aluminium (18. gr.)"
      inspection_sticker: "a year sticker is usually placed in the middle, after the letter group"
    region_encoding: none
    region_encoding_note: >-
      NONE, and by design: severing the number from the owner's district was the
      entire point of the 1989 reform. A modern Icelandic plate encodes no
      geography whatsoever. For the pre-1989 system that did, see
      is-district-1938 and is-districts-1938.yml.
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 4. gr. 3. mgr. (two letters + three digits, chosen at random); 18. gr. (types, dimensions, aluminium, þjóðarmerki); 19. gr. (white reflective ground, blue border/characters/bandstrik); 37. gr. (gildistaka). Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/78-1997  # 34. gr.: 'Ökutæki sem skráð voru fyrir 1. janúar 1989 mega áfram bera skráningarmerki af eldri gerð' — the boundary that dates this series, plus the 1997/1998 sunsets on the old plates. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/523-1988  # the 1989 cutover instrument, set 15 December 1988 — CITED FOR THE GAP: body text absent ('Texti ekki kominn'), no date fields published, commencement clause unverified. Accessed 2026-08-02"
      - "https://www.althingi.is/lagas/149c/1987050.html  # umferðarlög nr. 50/1987, 64. gr.: 'Ráðherra setur reglur um: ... c. skráningarmerki'; the act took effect 1 March 1988. Accessed 2026-08-02"
    notes: >-
      THE FIRST FASTANÚMER SHAPE, AB-123. period.start 1989 is the 1 January
      1989 cutover, `statutory-date` because it is stated in reglugerð 78/1997
      34. gr. and reglugerð 751/2003 VII. kafli rather than in the instrument
      that made it — reglugerð 523/1988's text is not retrievable and its
      commencement clause is therefore not asserted here. period.end is OPEN
      and that is a deliberate reading: 4. gr. still admits this shape, and
      reglugerð 691/2006 ADDED the three-letter alternative without withdrawing
      it. In practice the two-letter combinations are exhausted and new
      registrations receive the three-letter shape, so a consumer wanting
      "currently issued" should read is-standard-2006 — but the two-letter shape
      is not legally closed, and this file does not invent an end date for it.

  - id: is-standard-2006
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 2006 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LLL-99"
      regex: '\A[A-Z]{3}[- ]?\d{2}\z'
      charset:
        notes: >-
          Three letters, two digits. Reglugerð 691/2006 also added "Síðasti
          stafur í fastanúmeri skal vera tölustafir" — the last character must
          be a digit — which both shapes satisfy and which closes the door on a
          letter-final Icelandic mark. No letter exclusion is prescribed.
      progression: "none — chosen at random, as is-standard-1989"
      separator_note: "the bandstrik; see common.separator"
    design:
      plate: { w: 520, h: 110, unit: mm, note: "gerð A" }
      plate_variants:
        - { w: 280, h: 200, unit: mm, note: "gerð B" }
        - { w: 240, h: 130, unit: mm, note: "gerð C" }
        - { w: 305, h: 155, unit: mm, note: "gerð D" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#003399"
      border: { color: "#003399", hex_basis: observed }
      band: { side: left, content: "icelandic-flag+IS" }
      emblem: { present: false }
      rear_differs: false
      note: "IDENTICAL in every respect to is-standard-1989 except the character arrangement — same colours, same plate types, same national mark."
    region_encoding: none
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/691-2006  # reglugerð nr. 691/2006, set 25 July 2006, 'öðlast þegar gildi'; 2. gr.: 'Við 3. mgr. 4. gr. bætist: eða þrír bókstafir og tveir tölustafir', and 'Síðasti stafur í fastanúmeri skal vera tölustafir'. THE DATING INSTRUMENT. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 18.-19. gr. for the design, which this shape shares unchanged. Accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): the widely repeated '2007' account — 'In 2007 the system ran out of combinations and the first digit was changed to a letter' — cited as the FOLKLORE this entry corrects, not as evidence for it. Accessed 2026-08-02"
    notes: >-
      THE THREE-LETTER SHAPE, ABC-12, AND THE FOLKLORE CORRECTION IN THIS FILE.
      Secondary sources date this to 2007 essentially unanimously. The
      instrument is reglugerð nr. 691/2006, set 25 JULY 2006 and in force
      immediately ("öðlast þegar gildi") with no transitional deferral — so
      period.start is 2006. The 2007 story is not baseless, merely mistargeted:
      the only 2007 amendment to 751/2003 is reglugerð 1231/2007, which
      concerns the age-65 restriction on renewing a personalised plate. It is
      possible that first ISSUANCE of three-letter marks lagged into 2007, and
      691/2006 contains no first-issue wording either way; but a legal date is
      pinned and an issuance date is not, so the pinned one is recorded and this
      note carries the caveat. This shape is the ONLY era signal an Icelandic
      plate carries: three letters means on or after 25 July 2006.

  # =========================================================================
  # THE PRE-1989 DISTRICT SYSTEM — Iceland's only decodable era.
  # =========================================================================
  - id: is-district-1938
    class: standard
    categories: [car, van, truck, bus, motorcycle, tractor]
    period: { start: 1938, end: 1989 }
    period_evidence: statutory-date-end-secondary-start
    matching: recall-only
    format:
      pattern: "L-99999"
      regex: '\A[A-Z]{1,3}[- ]?\d{1,5}\z'
      pattern_note: >-
        RECALL-ONLY, FOR A REASON THAT IS NOT LAZINESS. Four of the district
        letters actually issued — Í, Ó, Þ and Ö, plus the variant Ø — lie
        OUTSIDE this dataset's serial alphabet (_meta/separators.yml admits only
        A-Z and 0-9), so no regex here can match a plate from Ísafjörður,
        Ólafsfjörður, Þingeyjarsýsla or Keflavík at all. The regex is
        deliberately wide over the letters it CAN spell, and a match is a shape
        hit only. Digit width is likewise unsourced: it grew with motorisation
        and no instrument fixing it was retrieved, so 1 to 5 is an observed
        envelope, not a grammar. The two-letter codes JO, VL and the
        three-letter VLE are why the letter group runs to three.
      progression: >-
        Sequential within each district, but the number followed the OWNER, not
        the vehicle: a sale across district lines produced a NEW number, and an
        owner could carry his number to a new car. That is exactly what 1989
        abolished.
    design:
      plate: { w: 520, h: 110, unit: mm, note: "REPRESENTATIVE ONLY — no dimension source for this era was retrieved" }
      background: { color: "#000000", finish: painted, hex_basis: observed }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: false }
      design_history: >-
        Two materials, one appearance. From 1938 the plates were ENAMELLED
        ("emeleruð númer"), black with white characters. They wore badly, and
        from 1950 struck plates ("steðjanúmer") replaced them — also black with
        white characters. The white-on-blue livery of the modern plate arrives
        only with the 1989 cutover. All of this is secondary-wikipedia.
      district_sticker: >-
        After the 1989 change, plates were permitted to carry a sticker showing
        the DISTRICT'S emblem in the position the ÍS national mark later
        occupied — a vestige of the district system surviving its abolition
        (secondary-wikipedia).
    region_encoding: is-districts-1938.yml
    region_encoding_note: >-
      The letter decodes the district of the OWNER'S DOMICILE at the time of
      issue — not the vehicle's home, not where it was used, and not anything
      after a sale. The decode file is `secondary-wikipedia` throughout and
      names the primary that could not be reached.
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/78-1997  # 34. gr.: vehicles registered before 1 January 1989 may keep old-type plates, with sunsets of 31 December 1997 (bifhjól, eftirvagnar) and 31 December 1998 (others). PRIMARY, and the source of this series' end date. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # VII. kafli 'Skráningarmerki samkvæmt eldri reglugerðum - notkun þeirra': 29. gr. governs vehicles registered before 1 January 1989, 30.-31. gr. vintage vehicles. PRIMARY. Accessed 2026-08-02"
      - "https://is.wikipedia.org/wiki/N%C3%BAmeraplata  # secondary-wikipedia: the 1938 single-letter reform and enamel plates; the 1950 change to struck plates; both black with white characters; the owner-domicile rule and re-plating on sale between districts; and the 1 January 1989 change to white with blue characters. Accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): the same index; 'From 1 January 1989, all further use of those plates was forbidden (except for vehicles that already had them on)'; the post-1989 district-emblem sticker. Accessed 2026-08-02"
    notes: >-
      ICELAND'S DECODABLE ERA. period.end 1989 is primary and precise; the 1938
      START is secondary-wikipedia and marks the year each district was reduced
      to a SINGLE letter with enamelled plates — Icelandic vehicles carried
      district ABBREVIATIONS before that, from 1914, beginning with
      Bifreiðafélag Reykjavíkur's "Br1", and this series does not cover them.
      No pre-1988 Icelandic vehicle-registration regulation is held by
      reglugerd.is, so neither the 1938 reform nor the letter index has a
      primary here; the decode file names the best unclosed lead (a pre-1988
      regulation cited by Hagtíðindi 1989 as "nr. 40"). NOTE THE SUNSET: the old
      plates were not merely superseded, they were withdrawn — 78/1997 34. gr.
      required them off bifhjól and eftirvagnar by 31 December 1997 and off
      everything else by 31 December 1998, so a pre-1989 plate on a road-going
      Icelandic vehicle today is a vintage-scheme plate under 751/2003
      30.-31. gr., not a survivor.

  # =========================================================================
  # COLOUR-CODED USE CLASSES — all from 19.-22. gr., all sharing the fastanúmer.
  # =========================================================================
  - id: is-vat-free-2003
    class: standard
    categories: [van, truck]
    period: { start: 2003 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LL-999"
      regex: '\A(?:[A-Z]{2}[- ]?\d{3}|[A-Z]{3}[- ]?\d{2})\z'
      pattern_note: "the pattern shows the two-letter shape; the regex is the UNION of both fastanúmer shapes, because the plate carries whichever mark the vehicle has"
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#CC0000"
      foreground_note: "19. gr. 2. mgr. a: 'brúnir, stafir, bandstrik og tígullaga flöturinn vera rauð' — border, characters, bandstrik AND a DIAMOND-SHAPED field, all red"
      border: { color: "#CC0000", hex_basis: observed }
      band: { side: left, content: "icelandic-flag+IS" }
      extra_field: { shape: diamond, color: "#CC0000", content: "the tígullaga flötur — a red diamond marking the VAT status" }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 19. gr. 2. mgr. a: red border, characters, bandstrik and diamond for VAT-free sendibifreiðar. Accessed 2026-08-02"
    notes: >-
      THE RED VAT-FREE PLATE, for goods vehicles on which value-added tax was
      not paid and which may not be used privately. The DIAMOND is the
      distinguishing device and is prescribed in terms — Iceland is unusual in
      colouring a named geometric field rather than the ground. Shares the
      ordinary fastanúmer, so the plate string alone cannot reveal the class.
      period.start 2003 is the parent regulation's entry into force; the regime
      is older (reglugerð 78/1997 already coloured tax-exempt vehicles red) but
