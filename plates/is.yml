          - "https://www.reglugerd.is/reglugerdir/allar/nr/1515-2020  # adds gerð E (168 x 133 mm) and the orange plate for létt bifhjól í flokki I. Accessed 2026-08-02"
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 20. gr.: blue ground with white border, characters and bandstrik on a létt bifhjól. Accessed 2026-08-02"
