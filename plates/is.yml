      background: { color: "#003399", finish: retroreflective, hex_basis: observed, spec_note: "20. gr.: 'Á léttu bifhjóli skal grunnur merkisins þó vera blár en rönd á brúnum, stafir og bandstrik hvít'" }
      foreground: "#FFFFFF"
      border: { color: "#FFFFFF", hex_basis: observed }
      band: { side: none }
      emblem: { present: false }
    region_encoding: none
    variants:
      - class: moped
        design:
          background: { color: "#E87722", finish: retroreflective, hex_basis: observed }
          foreground: "#FFFFFF"
        note: >-
          ORANGE, for létt bifhjól í flokki I (the slowest class, up to 25 km/h),
          added by reglugerð 1515/2020 of 14 December 2020 together with plate
          type E. A colour-only variant of the same format and period, hence a
          sub-entry per PRD-PLATES §2.3.
