      THE BLUE MOPED PLATE — Iceland inverts the usual convention, putting the
      colour in the GROUND and the white in the characters, so a létt bifhjól
      plate is the visual negative of an ordinary plate. RECORDED GAP:
      en.wikipedia states that mopeds and quadricycles under 25 km/h ceased to
      require registration in 2019, which would materially narrow this series'
      scope, but no instrument confirming it was retrieved and reglugerð
      1515/2020 still legislates for flokkur I in 2020 — so the claim is noted
