  # =========================================================================
  # DIPLOMATIC, TRADE, PERSONAL.
  # =========================================================================
  - id: is-diplomatic-2003
    class: diplomatic
    categories: [car, van]
    period: { start: 2003 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "CD-L99"
      regex: '\ACD[- ]?[A-Z]\d{2}\z'
      charset:
        notes: >-
          The literal CD, then ONE letter identifying the mission, then a
          two-digit sequence allocated within that mission. The letter is the
          only decodable element on any current Icelandic plate.
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#006A4E", finish: retroreflective, hex_basis: observed, spec_note: "25. gr.: 'Grunnur skal vera grænn en stafir og rönd á brúnum hvít'" }
      foreground: "#FFFFFF"
      border: { color: "#FFFFFF", hex_basis: observed }
      band: { side: none, note: "diplomatic plates do NOT bear the Icelandic national mark" }
      emblem: { present: false }
    region_encoding: "mission letter — inline below"
    mission_letters:
      basis: secondary-wikipedia
      note: >-
        THE PRIMARY IS DEAD. en.wikipedia cites Samgöngustofa's verklagsreglur
        page (3.10.2 Sendiráðsmerki) for this table, but every deep
        samgongustofa.is URL now 302s to a generic island.is landing page — the
        registration-rules pages did not survive the site migration, and no
        replacement was found. The table below is therefore secondary-wikipedia
        and is re-expressed keyed by LETTER, the decode direction. Missions open
        and close; no row is dated, and none should be treated as current.
      source: "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08). Accessed 2026-08-02"
      letters:
        A: "United States"
        B: "United Kingdom"
        C: "Denmark"
        D: "Finland"
        E: "France"
        F: "India"
        G: "China"
        H: "Norway"
        I: "Poland"
        J: "Russia"
        K: "Sweden"
        L: "Czech Republic"
        M: "Canada"
        N: "Germany"
        O: "International Monetary Fund"
        P: "Japan"
        R: "European Union"
        S: "North Atlantic Treaty Organisation"
        T: "Spain"
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 25. gr.: green ground with white characters and white border for diplomatic plates. PRIMARY for the design. Accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): the CD + mission-letter + two-digit format, the sequential allocation within each country, the absence of the Icelandic emblem, and the mission-letter table above. Accessed 2026-08-02"
    notes: >-
      THE GREEN DIPLOMATIC PLATE, and the ONLY current Icelandic plate with any
      decodable content — everything else is random by regulation. Note the
      letter set: it includes I and O, which is worth recording because those
      are the two letters most jurisdictions drop for lookalike reasons, and
      Iceland has no exclusion rule (common.charset). The design is primary; the
      mission letters are secondary-wikipedia resting on a now-dead
      Samgöngustofa citation, and a verifier should treat the table as the
      weakest content in this file.

  - id: is-trade-2003
    class: dealer
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2003 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LL-999"
      regex: '\A[A-Z]{2}[- ]?\d{3}\z'
      charset:
        notes: >-
          en.wikipedia reports that these marks begin with the fixed prefix
          "RN"; reglugerð 751/2003 27. gr. prescribes the colours but no prefix,
          so the regex does NOT encode RN and the claim sits here as
          secondary-wikipedia. Narrowing the regex on an unsourced prefix would
          make a validity claim the primary does not support.
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#CC0000", finish: retroreflective, hex_basis: observed, spec_note: "27. gr.: red ground with a black border and black characters" }
      foreground: "#000000"
      border: { color: "#000000", hex_basis: observed }
      band: { side: none }
      emblem: { present: false }
    binding: business
    region_encoding: none
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 27. gr.: reynslumerki — red ground, black border, black characters. Accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): temporary/dealer plates starting 'RN'. Accessed 2026-08-02"
    notes: >-
      REYNSLUMERKI — the trade plate, bound to a business rather than a vehicle.
      Red with BLACK characters, against the off-road plate's red with WHITE
      characters: the two Icelandic red plates differ only in character colour,
      which is worth flagging for any OCR-based consumer. period.start 2003 is
      the parent regulation's entry into force; the regime is older and no
      earlier dating instrument was pinned.

  - id: is-personal-2003
    class: personalized
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2003 }
    period_evidence: instrument-in-force
    matching: strict
    format:
      pattern: "LLLLLL"
      regex: '\A[A-Z0-9]{2,6}\z'
      charset:
        notes: >-
          26. gr.: "2-6 íslenskir bókstafir eða tölustafir að vali eiganda" —
          two to six ICELANDIC letters or digits, the owner's choice. Note the
          word "íslenskir": unlike a fastanúmer, an einkamerki expressly admits
          the Icelandic letters Á, Ð, É, Í, Ó, Ú, Ý, Þ, Æ and Ö, NONE of which
          this dataset's serial alphabet can spell (_meta/separators.yml). The
          regex is therefore narrower than the law in a way no `regex_statutory`
          can fix — the missing characters are unwritable, not merely
          unwritten. Recorded as a known limitation rather than hidden.
        forbidden_shapes: >-
          26. gr. 2. mgr. a bars an einkamerki from imitating an ordinary mark:
          "Á einkamerki má þó hvorki vera áletrun sem í eru tveir bókstafir og
          þrír tölustafir" — a real and unusual rule, and the reason a
          well-formedness check for this series must EXCLUDE the AB123 shape
          rather than merely allow it.
      progression: "owner-chosen, subject to refusal"
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#003399"
      border: { color: "#003399", hex_basis: observed }
      band: { side: none, note: "no national mark — the inspection sticker occupies the left field instead (secondary-wikipedia)" }
      emblem: { present: false }
    region_encoding: none
    validity:
      term_years: 8
      note: >-
        26. gr. gives the right an EIGHT-year term. Reglugerð 1231/2007 (3
        December 2007) added an age restriction on renewal — "nema umsækjandi sé
        orðinn 65 ára" — and the statutory hook, umferðarlög 50/1987 64. gr. a,
        set the fee at 25,000 kr. That provision is now 73. gr. of umferðarlög
        77/2019.
    sources:
      - "https://www.reglugerd.is/reglugerdir/allar/nr/751-2003  # 26. gr.: 2-6 Icelandic letters or digits, eight-year term, the standard plate types under 18. gr., no national emblem, and the bar on imitating the ordinary format. Accessed 2026-08-02"
      - "https://www.reglugerd.is/reglugerdir/allar/nr/1231-2007  # reglugerð nr. 1231/2007, 3 December 2007: the age-65 qualification on renewal of an einkamerki. Accessed 2026-08-02"
      - "https://www.althingi.is/lagas/149c/1987050.html  # umferðarlög nr. 50/1987, 64. gr. a: einkamerki, owner-chosen letters and numbers, 25,000 kr, eight-year term, renewal restricted for those over 65. The STATUTORY hook, and the one plate type Iceland legislates for directly. Accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Iceland  # secondary-wikipedia (rev. 2026-06-08): the inspection sticker sits on the left in place of the country identifier. Accessed 2026-08-02"
    notes: >-
      EINKAMERKI. The one Icelandic plate type with a STATUTORY basis of its
      own: 64. gr. a of umferðarlög 50/1987 (now 73. gr. of umferðarlög
      77/2019) legislates for it directly, where every other plate type in this
      file rests on the general rule-making power in 64. gr. c. period.start
      2003 is the parent regulation's entry into force; the einkamerki regime is
      OLDER — 64. gr. a is a later insertion into the 1987 act and pairs with
      reglugerð 312/1996, which added 14. gr. a and 14. gr. b on einkamerki to
      the 1988 regulation, so the scheme dates from about 1996. No commencement
      instrument for it was pinned, and 1996 is therefore recorded here rather
      than in period.start — a deliberate choice not to assert a date this pass
      did not secure.
