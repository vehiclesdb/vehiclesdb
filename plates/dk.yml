  - id: dk-diplomatic-mission
    class: diplomatic
    categories: [car, van, motorcycle]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_caveat: >-
      1976 dates the numbering guidelines the plate follows. The BLUE ground is
      primary and current (§ 76, stk. 1) but undated: it is present in every
      registreringsbekendtgørelse reached back to BEK 1567/2007 and its
      introduction is not established here.
    matching: strict
    format:
      pattern: "LL 76 999"
      regex: '\A[A-Z]{2} ?76 ?\d{3}\z'
      characters: 7
      block: "76.000-76.999"
      charset:
        basis: primary-authority
        notes: >-
          No letter restriction is claimed for diplomatic plates. The Swedish
          lesson applies (se-diplomatic: the landskod alphabet is NOT the
          ordinary one), and nothing in the Danish sources says the ordinary
          exclusions carry over here, so no `regex_strict` is written.
    design:
      plate: { w: 504, h: 120, unit: mm }
      background: { color: "#0057A8", finish: retroreflective, hex_basis: observed, spec: blå, spec_note: "the ONE colour the instrument states: BEK 663/2025 § 76, stk. 1 — plates 'hvor registreringsnummeret vises på en blå baggrund'" }
      foreground: "#FFFFFF"
      border: { color: "#0057A8", hex_basis: observed, spec: blå, note: "SKAT colour cell 'blå/hvid blå'" }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: false, note: "COMPULSORY here: § 68, stk. 5, 2. pkt. — 'Grænsenummerplade og diplomatnummerplade udfærdiges dog kun med EU-symbolet.'" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 76, stk. 1 (who gets blue plates: foreign states' diplomatic and consular missions, international organisations and institutions under registreringsafgiftslovens § 2, stk. 2, and persons accorded diplomatic status by Udenrigsministeriet) and stk. 2 (Skatteforvaltningen may dispense and issue WHITE plates instead); § 68, stk. 5 (EU symbol compulsory); accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 65 'Diplomatplader - rektangulære (blå) - EU' 120x504 blå/hvid blå 76.000-77.999; accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Denmark  # secondary-wikipedia: the split of the SKAT block into 76.000-76.999 for states' missions and 77.000-77.999 for international organisations; accessed 2026-08-02"
    notes: >-
      DIPLOMATIC MISSIONS OF STATES. The SKAT catalogue gives the whole
      diplomatic block as 76.000-77.999 in one row; the split into 76 for
      states' missions and 77 for international organisations is
      secondary-wikipedia (both the English and the Danish article give it, and
      it is consistent across them). Only the SPLIT is secondary — the block,
      the colours and the compulsory EU band are primary. A NEGATIVE FINDING
      worth recording for any claims model: § 76, stk. 2 lets Skatteforvaltningen
      dispense from the blue plate and issue a white one, so the absence of a
      blue plate does not disprove diplomatic status — the same trap se.yml
      records for the Swedish security exemption.

  - id: dk-diplomatic-organisation
    class: diplomatic
    categories: [car, van, motorcycle]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_caveat: "as dk-diplomatic-mission"
    matching: strict
    format:
      pattern: "LL 77 999"
      regex: '\A[A-Z]{2} ?77 ?\d{3}\z'
      characters: 7
      block: "77.000-77.999"
      charset:
        basis: primary-authority
        notes: "as dk-diplomatic-mission — no letter restriction claimed"
    design:
      plate: { w: 504, h: 120, unit: mm }
      background: { color: "#0057A8", finish: retroreflective, hex_basis: observed, spec: blå }
      foreground: "#FFFFFF"
      border: { color: "#0057A8", hex_basis: observed, spec: blå }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: false }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 76; § 68, stk. 5; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 65, block 76.000-77.999; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: '77 000-77 999 Diplomatbiler, internationale organisationer mv.'; accessed 2026-08-02"
    notes: >-
      INTERNATIONAL ORGANISATIONS AND INSTITUTIONS — the upper half of the blue
