# plates/dk.yml — Denmark (PRD-PLATES gate L1, wave 2).
#
# WHAT IS PRIMARY HERE, AND WHAT IS NOT. Every claim in this file names its
# layer, and the layers are:
#
#   1. registreringsbekendtgørelsen — bekendtgørelse om registrering af
#      køretøjer, currently BEK nr 663 af 10/06/2025 (Skatteministeriet), in
#      force 16 June 2025, as amended by BEK nr 1826 af 29/12/2025. It carries
#      the registration-number RULE (§ 68), the plate-type list (§ 68, stk. 4),
#      the number of plates and where they go (§ 69), the diplomatic BLUE
#      background (§ 76), the ønskenummer grammar (§ 74), the historic-plate
#      rule (§ 75) and the papegøjenummerplade date (§ 82). Its enabling
#      statute is lov om registrering af køretøjer, jf. LBK nr 179 af
#      22/02/2023, recited in the bekendtgørelse's own indledning.
#   2. ITS DATED ANCESTORS, which are where the era boundaries actually live.
#      The whole 2007->2025 chain is machine-readable on retsinformation.dk and
#      was read, not summarised: BEK 1567/2007, 673/2008, 633/2009, 811/2010,
#      651/2011, 504/2012, 20/2013, 1315/2014, 599/2017, 1498/2017, 818/2018,
#      1643/2018, 2523/2021, 866/2023, 663/2025. Four dates in this file come
#      from ikrafttrædelses- and virkningsbestemmelser in that chain and from
#      nowhere else — see THE FOUR DATES below.
#   3. SKAT's own plate catalogue — "Liste over alle pladetyper i Danmark pr.
#      06.06.2012", the authority's complete plate-stock poster, and the
#      per-plate pages of skat.dk's "Billeder af nutidige nummerplader"
#      section. These are the ONLY source, primary or otherwise, for Danish
#      plate DIMENSIONS, COLOURS and per-type NUMBER RANGES: the
#      bekendtgørelse specifies no size and no colour at all except the
#      diplomatic plate's blue background.
#   4. Wikipedia (en + da), tagged `secondary-wikipedia` wherever it is load-
#      bearing, never dressed as an instrument. It supplies the pre-2012
#      serial-block detail below the SKAT catalogue's resolution, the issued
#      letter alphabet, the blocked two-letter combinations, and the
#      ønskenummerplade's 1992 start.
#
# THE FOUR DATES THIS FILE EXISTS TO GET RIGHT (PRD-PLATES §9: era boundaries
# are folklore-prone; each of these is dated to the DAY by an instrument's own
# commencement clause, and each replaces a vaguer number in circulation):
#
#   * 1 APRIL 1976 — the current registration-number guidelines. Not folklore:
#     BEK 663/2025 § 72, stk. 4, nr. 4 says a replacement plate is not issued
#     where the number does not follow "de retningslinjer for udformning af
#     registreringsnumre, der har været gældende siden den 1. april 1976", and
#     §§ 70, stk. 3 and 75, stk. 1 both cut at the same day. Three independent
#     references inside one instrument.
#   * 12 OCTOBER 2009 — the EU-band plate. BEK 633/2009 § 100: "Bekendtgørelsen
#     træder i kraft den 1. juli 2009 bortset fra § 69, stk. 5, der træder i
#     kraft den 12. oktober 2009", and § 69, stk. 5 IS the EU-symbol chooser.
#     SKAT's own catalogue page is headed "Aktuelle EU-nummerplader pr. 12.
#     oktober 2009". The commonly repeated "2009" and "July 2009" are both
#     wrong for the band: 1 July 2009 is when the rest of that bekendtgørelse
#     commenced, and the band clause was carved out by ninety-nine days.
#   * 6 JUNE 2012 — the day per-vehicle-type number blocks were consolidated.
#     BEK 504/2012 § 118: "Bekendtgørelsen træder i kraft den 6. juni 2012",
#     and SKAT dated its complete plate catalogue "pr. 06.06.2012" to the same
#     day. Danish Wikipedia says the digital register came in "i 2011" and
#     English Wikipedia says "2012"; the instrument says 6 June 2012.
#   * 1 APRIL 2011 — the historic-plate eligibility cut moved from before
#     1 April 1958 to before 1 April 1976. BEK 811/2010 § 103, stk. 3: "§ 79
#     har virkning fra den 1. april 2011. Indtil da finder § 76 i bekendt-
#     gørelse nr. 633 af 26. juni 2009 anvendelse." Two historic series, not
#     one, and the boundary is a virkningsbestemmelse rather than the
#     bekendtgørelse's own commencement — exactly the trap the wave is about.
#
# WHAT THE INSTRUMENT DOES *NOT* SAY, RECORDED SO NOBODY INFERS IT
#
#   * NO DIMENSIONS. Not one millimetre of plate geometry appears in BEK
#     663/2025. The only millimetres in it belong to the
#     LANDEKENDINGSMÆRKE — the oval distinguishing sign — and § 37, which
#     prescribes it (at least 175x115 mm, letters at least 80 mm high, 10 mm
#     strokes), is addressed to FOREIGN vehicles in Denmark, not to Danish
#     vehicles abroad. It is not a plate either way.
#   * NO COLOURS, with one exception. § 76, stk. 1 requires diplomatic vehicles
#     to be issued plates "hvor registreringsnummeret vises på en blå
#     baggrund", and § 76, stk. 2 lets Skatteforvaltningen dispense and issue
#     white ones instead. Every other colour in this file — the white plate's
#     red border, the yellow goods-vehicle plate, the yellow/white papegøje-
#     plade, the red-on-white prøveskilt — comes from SKAT's catalogue, which
#     names colours in WORDS ("hvid/sort/rød") and never gives a value.
#     Consequently EVERY hex below is `hex_basis: observed` and indicative.
#   * NO FONT. No typeface is named or drawn anywhere in the instrument, so
#     per PRD-PLATES §6 there is no licensable font to clear and no statutory
#     Schriftmuster to derive glyphs from; the schematic fallback applies.
#   * NO PUBLISHED SERIES REGISTER. § 68, stk. 3 delegates: "Skatteforvaltningen
#     kan inddele registreringsnumre i serier efter køretøjers art eller
#     anvendelse." The delegation is primary; the resulting division is
#     published only in SKAT's plate catalogue, not in any instrument. That is
#     why plates/_decode/dk-serial-blocks.yml exists and why its pre-2012 rows
#     are tiered below its post-2012 rows.
#
# THE COLOUR-CODED TAX CLASSES — the distinctive Danish fact, stated from the
# instrument rather than from the enthusiast web. The bekendtgørelse does not
# say "yellow" or "parrot"; what it does is establish the three REGISTERED
# USES that the colours track, and name the parrot plate once:
#   * § 85, stk. 1 — a vare- or lastbil of not more than 4 t "registreret til
#     udelukkende erhvervsmæssig brug" must carry the owner's CVR number and
#     name on both sides. That is the yellow-plate category.
#   * § 82, stk. 1 — a vare- or lastbil of not more than 4 t "registreret til
#     privat eller til blandet privat og erhvervsmæssig brug, jf. § 2 a i lov
#     om vægtafgift af motorkøretøjer m.v." must carry a rear-window mærke.
#   * § 82, stk. 2 — that mærke duty does NOT apply to such a bil "registreret
#     første gang ... efter den 31. december 2008", nor to one first registered
#     between 3 June 1998 and 1 January 2009 "hvis bilen efter den 31. december
#     2008 er registreret med nummerpladen for vare- og lastbiler, der er
#     anmeldt til privat eller til blandet privat og erhvervsmæssig brug
#     (papegøjenummerplade)".
# So the sticker regime ran 3 June 1998 - 31 December 2008 and the PLATE took
# over on 1 January 2009, both dates from the instrument's own words. The
# enabling power is § 1, nr. 9 of lov nr. 1338 af 19/12/2008: "Skatteministeren
# kan, for at styrke håndhævelsen af skatte- eller miljølovgivningen, fastsætte
# regler om mærkning af køretøjer med særlige nummerplader eller mærkater."
#
# SEPARATOR POLICY: the printed gaps on a Danish plate are GAPS, not glyphs —
# no Danish instrument prescribes any separator character. Per PRD-PLATES §2.6
# they are written as the emitted SPACE in `pattern` and as an optional " ?" in
# every regex. SKAT's catalogue renders the five-digit car number as two groups
# ("AF 22 454"), which is why the canonical printed form here is "LL 99 999".
#
# REGEX POLICY: `format.regex` is the lint-round-trippable regex over the full
# A-Z/0-9 alphabet in printed form; `format.regex_strict` carries the issued
# letter alphabet and the number block where those are sourced. There is no
# `regex_statutory` anywhere in this file: the Danish statute (§ 68, stk. 2 —
# two Latin letters and one to five Arabic numerals) is WIDER than every
# individual series, but it is the union of the series rather than a legal
# outer bound on any one of them, so it is recorded once in `common.number_rule`
# instead of being smuggled into a per-series twin.
#
# SCOPE, FROM THE INSTRUMENT: § 1, stk. 4 — "I denne bekendtgørelse bruges
# betegnelsen »her i landet« om Kongeriget Danmark, bortset fra Færøerne og
# Grønland." The Faroe Islands (ISO FO) and Greenland (ISO GL) are therefore
# OUTSIDE this file by the instrument's own definition, not by our omission;
# they are separate jurisdictions for this dataset and neither is covered here.
jurisdiction: dk
authority:
  name: Skatteforvaltningen (Motorstyrelsen) — Køretøjsregisteret
  url: "https://motorst.dk/borger/nummerplader"
binding: vehicle
binding_note: >-
  `vehicle`, with one sourced exception. BEK 663/2025 § 67, stk. 3: "Nummer-
  pladen tilhører staten" — the plate is state property attached to the
  vehicle's registration, and the registered owner must surrender it when the
  vehicle is deregistered. The exception is the ønskenummerplade, which tracks
  the RIGHTS-HOLDER (§ 74, stk. 5: the number "kan inden for rettighedsperioden
  overføres til et andet køretøj, som registreres til den, der har retten");
  that series carries `binding: owner` of its own.
instrument:
  citation: "Bekendtgørelse nr. 663 af 10. juni 2025 om registrering af køretøjer (registreringsbekendtgørelsen), som ændret ved BEK nr 1826 af 29/12/2025"
  in_force: "2025-06-16"
  ministry: Skatteministeriet
  enabling_statute: "Lov om registrering af køretøjer, jf. lovbekendtgørelse nr. 179 af 22. februar 2023 — recited in the indledning of BEK 663/2025: '§ 1, stk. 3, § 2, stk. 5, § 5, § 6, stk. 2, § 7, stk. 2-5 og 7, § 7 e, stk. 4, § 7 h, § 14, stk. 2 og 3, § 15, stk. 5, § 17, stk. 2, og § 20, stk. 2'"
  replaces: "BEK nr 866 af 19/06/2023 om registrering af køretøjer (out of force 2025-06-16)"
  source: "https://www.retsinformation.dk/eli/lta/2025/663  # full text via the ELI XML embodiment /eli/lta/2025/663/dan/xml; ELI metadata gives date_document 2025-06-10, date_publication 2025-06-16, in_force; accessed 2026-08-02"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts, cited once and referenced per series.
# ---------------------------------------------------------------------------
common:
  number_rule:
    text: >-
      BEK 663/2025 § 68, stk. 2, verbatim: "Nummerpladen har, bortset fra
      nummerplader som nævnt i stk. 4, nr. 2, 3 og 5, et registreringsnummer,
      der består af to latinske bogstaver efterfulgt af et til fem arabiske
      tal." The carve-outs are the ønskenummerplade (nr. 2), the historic plate
      (nr. 3) and the prøveskilt (nr. 5) — each of which has its own grammar
      and its own series below.
    digit_count_note: >-
      ONE TO FIVE, not five. Danish Wikipedia says "to bogstaver og tre til fem
      cifre" and English Wikipedia says "two letters and five digits"; the
      instrument says one to five, and SKAT's own catalogue shows two-digit
      prøveskilt numbers (10-99), three-digit moped and tractor numbers
      (100-999) and four-digit trailer numbers (1.000-9.999). The five-digit
      form is the CAR form, not the rule. Each series below carries the digit
      count its own number block dictates.
    series_delegation: >-
      § 68, stk. 3: "Skatteforvaltningen kan inddele registreringsnumre i serier
      efter køretøjers art eller anvendelse." The power to divide numbers into
      series by vehicle kind or use is primary; the division itself is published
      only in SKAT's plate catalogue — see plates/_decode/dk-serial-blocks.yml.
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 2-4; § 69 (how many plates and where); accessed 2026-08-02"
  plate_types_catalogue:
    text: >-
      SKAT, "Liste over alle pladetyper i Danmark pr. 06.06.2012" — the
      authority's own complete plate-stock poster, laid out as NONE EU and EU
      columns with, per row, an internal stock number (PSTK), an internal item
      number, the Danish designation, the size, the colour words, the number
      range and a rendering of the format. This is the source for every
      dimension, every colour word and every post-2012 number range in this
      file. It is dated to the same day BEK 504/2012 came into force.
    dimension_caveat: >-
      The poster's size column is headed "Størrelse centimeter højde x længde"
      but its values are MILLIMETRES height x length (120x504, 165x240,
      125x145, 207x504). The header is an error in the source; it is recorded
      here rather than silently corrected, and this file writes the values as
      w/h in mm in the dataset's own order.
    colour_convention: >-
      The poster's colour cells hold two to four words. Read as
      background/characters/border, they reproduce the known plates exactly and
      are corroborated by the one colour statement the instrument does make:
      the diplomatic row reads "blå/hvid blå" and § 76, stk. 1 requires the
      number to appear "på en blå baggrund". The reading is an INFERENCE from
      the cell order, corroborated, and is flagged as such on every design
      below rather than presented as the poster's own words.
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT, 'Liste over alle pladetyper i Danmark pr. 06.06.2012'; archived capture 2017-09-17 (the live skat.dk copy is gone); accessed 2026-08-02"
      - "https://web.archive.org/web/20110716080639/http://www.skat.dk/SKAT.aspx?oId=1826647  # skat.dk 'Personbil - EU': Serie 61, størrelse 120 x 504, farve Hvid/sort/rød, nummerrække 20.000-59.999, format '@@ ## ###' with the authority's own key (@ = bogstav, # = tal, $ = vilkårligt, Dkåå = Dk + årstal i rød kasse); page footer 'Senest redigeret 02 sep 2009'; archived capture 2011-07-16; accessed 2026-08-02"
      - "https://web.archive.org/web/20120127070602/http://www.skat.dk/SKAT.aspx?oId=1826638  # skat.dk 'Nummerplader med EU-symbol', headed 'Aktuelle EU-nummerplader pr. 12. oktober 2009', indexing the twenty-odd EU plate types; archived capture 2012-01-27; accessed 2026-08-02"
  eu_band:
    side: left
    content: eu-stars+DK
    optional: true
    rule: >-
      THE BAND IS A CHOICE, NOT A MANDATE, AND IT STILL IS. BEK 663/2025 § 68,
      stk. 5: "Den, der anmelder et køretøj til indregistrering, vælger, om
      nummerpladen skal vise EU-symbolet (EU-nummerplade). Grænsenummerplade og
      diplomatnummerplade udfærdiges dog kun med EU-symbolet. Historisk
      nummerplade og nummerplade til en knallert eller traktor udfærdiges ikke
      med EU-symbolet." So: compulsory on border and diplomatic plates,
      forbidden on historic, moped and tractor plates, optional everywhere else
      — which means a Danish plate WITHOUT a band is not evidence of age.
    start: "2009-10-12"
    start_evidence: >-
      BEK 633/2009 § 100, verbatim: "Bekendtgørelsen træder i kraft den 1. juli
      2009 bortset fra § 69, stk. 5, der træder i kraft den 12. oktober 2009."
      § 69, stk. 5 of that bekendtgørelse is word-for-word the chooser now in
      § 68, stk. 5. The band clause was carved out of the general 1 July 2009
      commencement and given its own day.
    corroboration: >-
      SKAT's catalogue index page is headed "Aktuelle EU-nummerplader pr. 12.
      oktober 2009". English Wikipedia reports the same day from a Danish EU
      information-centre page ("expected in 2008, but was thereafter delayed to
      12 October 2009"); that is corroboration of an instrument date, not the
      source of it.
    national_sign_alternative: >-
      CORRECTED DIRECTION, RECORDED BECAUSE IT IS EASY TO GET BACKWARDS. The
      oval distinguishing-sign geometry in BEK 663/2025 is § 37, and § 37 is
      addressed to FOREIGN vehicles in Denmark rather than to Danish vehicles
      abroad: "Et udenlandsk motorkøretøj og et udenlandsk påhængskøretøj til
      et motorkøretøj skal bag på vise registreringslandets
      landekendingsmærke", the mark being one to three Latin letters painted
      black on a white ellipse, letters at least 80 mm high with strokes at
      least 10 mm, the ellipse at least 175x115 mm on a motorcycle and at
      least 240x145 mm elsewhere for a three-letter mark, reducible to
      175x115 mm for one or two letters. The duty on a BANDLESS DANISH plate
      to carry a "DK" oval when driven abroad is imposed by the destination
      state and by the 1968 Vienna Convention, NOT by this bekendtgørelse;
      English Wikipedia asserts it and cites a motoring-club page. Tagged
      secondary-wikipedia; the § 37 geometry is given because it is what the
      Danish instrument actually prescribes.
    hex_basis: observed
    sources:
      - "https://www.retsinformation.dk/eli/lta/2009/633/dan/xml  # § 69, stk. 5 (the chooser) and § 100 (the split commencement, 1 July 2009 / 12 October 2009); accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 5 as it stands today, incl. the compulsory/forbidden lists; § 37 (the landekendingsmærke geometry — for FOREIGN vehicles in Denmark); accessed 2026-08-02"
      - "https://web.archive.org/web/20120127070602/http://www.skat.dk/SKAT.aspx?oId=1826638  # 'Aktuelle EU-nummerplader pr. 12. oktober 2009'; accessed 2026-08-02"
  charset:
    letters_excluded: ["I", "Q", "Æ", "Ø", "Å"]
    letters_issued: [A, B, C, D, E, F, G, H, J, K, L, M, N, O, P, R, S, T, U, V, W, X, Y, Z]
    second_letter_extra_exclusion: ["O"]
    blocked_combinations: [BH, BU, CC, CD, DK, DU, EU, KZ, MU, PU, PY, SS, UD, UN, VC]
    basis: secondary-wikipedia
    note: >-
      NO DANISH INSTRUMENT RESTRICTS THE LETTERS. Neither BEK 663/2025 nor any
      of its ancestors names an excluded letter or an excluded combination, and
      SKAT publishes no alphabet. The restriction is reported by Danish
      Wikipedia, which cites the enthusiast register nrpl.dk for it: the letters
      I, Q, Æ, Ø and Å are not used on ordinary plates; O is used only as the
      FIRST letter of a pair; and fifteen combinations are skipped as
      unsuitable. Æ, Ø and Å are outside this dataset's serial alphabet
      (_meta/separators.yml) in any case, so only I and Q bite everywhere, plus
      O in second position. That — and nothing else — is what `regex_strict`
      encodes on the ordinary series.
    blocked_note: >-
      The fifteen blocked pairs are deliberately NOT compiled into any regex,
      following the nl.yml and se.yml precedent: a blocked combination is a
      NON-ISSUANCE rule, not a well-formedness rule. Danish Wikipedia adds that
      more than a hundred further pairs used by the individual police districts
      before the Centralregisteret for Motorkøretøjer took over registration in
      the late 1960s are also skipped; that list is not reproduced here and no
      claim is made about its membership.
    reuse_rule: >-
      Danish numbers are RE-USED, so no letter block gives an age. Danish
      Wikipedia reports that on the digital register's introduction allocation
      restarted at AA and that combinations free for at least twelve years are
      recycled. The twelve years is corroborated by the instrument: BEK
      663/2025 § 2, stk. 6 — "Skatteforvaltningen kan slette registrerede
      oplysninger om et køretøj 12 år efter, at køretøjet er afmeldt, hvis
      køretøjet ikke siden da er indregistreret på ny i Køretøjsregisteret."
    sources:
      - "https://da.wikipedia.org/wiki/Nummerplade  # 'På almindelige nummerplader anvendes bogstaverne I, Q, Æ, Ø og Å ikke. Bogstavet O bruges kun som første bogstav i en kombination.' and the fifteen blocked pairs; the article cites nrpl.dk; secondary-wikipedia; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 2, stk. 6 — the twelve-year deletion rule that the re-use claim rests on; accessed 2026-08-02"
  registration_scope:
    text: >-
      BEK 663/2025 § 3, stk. 1 lists what must be registered and plated before
      use on a road: motorkøretøj; traktor or blokvogn; knallert; påhængs- or
      sættevogn to a registrable vehicle; campingvogn; other påhængsredskab
      capable of being towed above 30 km/h; and a motorredskab fitted for
      carrying goods. § 3, stk. 3 adds the moped cut-off (below), and § 3,
      stk. 4 the municipal plate (see the GAPS block at the end of this file).
    source: "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3; accessed 2026-08-02"
  design_sources:
    hex_note: >-
      EVERY hex in this file is `hex_basis: observed` and INDICATIVE. No Danish
      instrument gives an RAL, a CIE box or an RGB value for any plate colour,
      and SKAT's catalogue names colours only in words — "hvid", "gul", "sort",
      "rød", "blå". The values below were read off SKAT's own plate renderings
      in that catalogue, which are flat illustrations rather than measured
      swatches. This is the posture se.yml records for Sweden and de.yml for
      the German "grünes Kennzeichen"; it is not a defect in the pass.
    font_note: >-
      NO TYPEFACE IS MANDATED and no statutory drawing exists. Per PRD-PLATES
      §6 the render layer therefore has neither a licence to clear nor a
      Schriftmuster to derive from; the schematic fallback applies and the gap
      is recorded here rather than papered over with a lookalike TTF.
    mounting_rules: >-
      BEK 663/2025 § 70: the plate is mounted outside the vehicle, visible and
      easily legible, vertical or near-vertical, in a plane perpendicular to
      the longitudinal axis. § 70, stk. 3: plates on a person- or varebil —
      "bortset fra nummerplader fra før den 1. april 1976 og historiske
      nummerplader" — must be fixed with at least two screws or bolts, capped
      in the same colour as the plate at that point, the caps removable only
      with a tool, and no decorative screws. § 70, stk. 4: the plate's form may
      not be altered, no stickers, no frame covering any part of the plate
      inside the embossed edge. § 70, stk. 6: the rear plate is lit at
      lighting-up time, except on a knallert.
    plate_count: >-
      BEK 663/2025 § 69: two plates, front and rear, except — one rear plate
      only on a registered motorcykel, knallert or påhængskøretøj (never on the
      side); one FRONT plate only on a godkendt traktor; and an EXTRA rear
      plate where the rear plate is wholly or partly covered by load, mounted
      on the load or on a carrier so that it can be read directly. That extra
      plate is SKAT's "3. nummerplade (cykelplade)" and carries the vehicle's
      own number; it is recorded on the standard series below as a plate
      variant rather than as a series of its own, because it is not a separate
      issuance system.
    source: "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # §§ 69-70; accessed 2026-08-02"

series:

  # =========================================================================
  # THE STANDARD PLATE. White ground, black characters, red border, two
  # letters and five digits — the plate on a Danish private car since the
  # 1 April 1976 numbering guidelines.
  # =========================================================================
  - id: dk-standard-1976
    class: standard
    categories: [car]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_note: >-
      1976 is 1 APRIL 1976, and it is dated by the instrument in force today
      rather than by an enthusiast page: BEK 663/2025 § 72, stk. 4, nr. 4
      refuses a replacement plate where the number does not follow "de
      retningslinjer for udformning af registreringsnumre, der har været
      gældende siden den 1. april 1976"; § 70, stk. 3 exempts "nummerplader fra
      før den 1. april 1976" from the two-screw rule; § 75, stk. 1 opens the
      historic plate to vehicles "registreret første gang før den 1. april
      1976". The instrument that ENACTED the 1976 guidelines was not reached —
      see the GAPS block — so this is `statutory-date` (a date stated in a
      statute) and not `instrument-in-force` (a commencement clause read).
    matching: strict
    format:
      pattern: "LL 99 999"
      regex: '\A[A-Z]{2} ?\d{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?(?:[1-6]\d|7[0-5]|7[89]|8\d|9[0-7]) ?\d{3}\z'
      characters: 7
      charset:
        letters_excluded: ["I", "Q", "Æ", "Ø", "Å"]
        second_letter_extra_exclusion: ["O"]
        basis: secondary-wikipedia
        notes: >-
          See common.charset. The alphabet is NOT in any instrument; it is
          reported by Danish Wikipedia from nrpl.dk and is tagged
          secondary-wikipedia wherever it appears. `regex_strict` also carries
          the NUMBER BLOCK — 10.000-75.999 and 78.000-97.999 — which IS primary,
          from SKAT's catalogue row "Personbiler - Hvid rektangulær". It
          excludes 76.000-77.999 (diplomatic) and 98.000-99.999 (taxi), which
          are their own series below.
      progression: >-
        NO AGE SIGNAL, NO GEOGRAPHY. The two letters are a serial, not a
        region: the pre-1958 single letter was the county marker and it is long
        gone. Numbers freed by deregistration are re-used (common.charset.
        reuse_rule; twelve years, corroborated by § 2, stk. 6), and allocation
        restarted from AA when the digital register came in, so a letter pair
        dates nothing. The one thing a Danish number still encodes is VEHICLE
        KIND, and only through its digit block — see
        plates/_decode/dk-serial-blocks.yml, and note that the blocks were
        consolidated on 6 June 2012.
      separator_note: >-
        The printed gaps are gaps, not glyphs: no Danish instrument prescribes
        a separator character. SKAT's catalogue renders the five-digit number
        as two groups ("AF 22 454"), which is the canonical printed form used
        here; the regex accepts the space or its absence at both positions per
        PRD-PLATES §2.6.
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "'kvadratisk' — the square rear plate; SKAT stocks it as its own type ('Personbiler - Hvid kvadratisk', 120x504/165x240, i.e. a 504x120 front plate with a 240x165 rear)" }
        - { w: 240, h: 165, unit: mm, note: "'amerikaner' — SKAT type 76/77 'Personbiler - Hvid amerikaner', for US-market mountings" }
        - { w: 504, h: 120, unit: mm, note: "'3. nummerplade (cykelplade)' — the extra rear plate required by § 69, stk. 4 where load or a cycle carrier covers the rear plate. Carries the vehicle's own number; SKAT colour cell 'hvid/rød'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød, note: "the red border is the Danish plate's signature and is the third word in SKAT's colour cell 'hvid/sort/rød'; no instrument mentions it" }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true, note: "OPTIONAL — chosen at issuance under § 68, stk. 5; available since 12 October 2009 (common.eu_band). Absence of a band is not evidence of age" }
      emblem: { present: false }
      rear_differs: false
      display: "two plates, front and rear (§ 69, stk. 1)"
      extra_markings: "a security hologram is fitted to new plates; it is not mentioned in the instrument and is recorded as an observed physical feature, not a sourced specification"
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    region_encoding_note: >-
      NOT geography — Denmark encodes VEHICLE KIND in the digit block and has
      encoded no region since the single-letter county plates ended. The decode
      file is named for what it actually decodes.
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 2 (two Latin letters + one to five Arabic numerals); § 69, stk. 1 (two plates); § 70 (mounting); § 72, stk. 4, nr. 4 and § 70, stk. 3 and § 75, stk. 1 (the 1 April 1976 line); accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT 'Liste over alle pladetyper i Danmark pr. 06.06.2012', rows 13/14 'Personbiler - Hvid rektangulær' 120x504 hvid/sort/rød 10.000-75.999 og 78.000-97.999, rows 15/16 kvadratisk, rows 76/77 amerikaner, rows 29/30 '3. nummerplader (cykelplade)'; accessed 2026-08-02"
      - "https://web.archive.org/web/20110716080639/http://www.skat.dk/SKAT.aspx?oId=1826647  # skat.dk 'Personbil - EU' Serie 61: 120 x 504, Hvid/sort/rød, 20.000-59.999, format '@@ ## ###' — the PRE-2012 car block, from the authority; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: the issued letter alphabet (I, Q, Æ, Ø, Å unused; O first-position only), the fifteen blocked pairs, and the restart-at-AA / twelve-year re-use practice; accessed 2026-08-02"
    notes: >-
      THE DANISH STANDARD PLATE. Two things about it are unusual and both are
      sourced. First, the SIZE: 504 x 120 mm, not the 520 x 110 mm that the
      rest of Europe uses and that both Wikipedia infoboxes assert — SKAT's own
      catalogue says "120x504" in every white-plate row, and the archived
      skat.dk series page says "120 x 504" for Serie 61. The 520 x 110 figure
      is corrected away here. Second, the EU BAND IS OPTIONAL and has been
      since it appeared: § 68, stk. 5 gives the choice to whoever registers the
      vehicle, so a bandless Danish plate may be brand new. Colour is white
      ground / black characters / red border throughout; the red border is what
      makes the plate recognisable and it appears in no instrument.
      DELIBERATE NARROWNESS OF `categories`: SKAT names this type "Personbiler",
      so this series claims cars and nothing else. Vans and lorries of not more
      than 4 t are on the yellow or the parrot plate according to their
      registered use; what plate a bus or a lorry ABOVE 4 t carries is not
      established by any source reached in this pass and is filed as a gap
      rather than guessed at.

  # =========================================================================
  # THE YELLOW GOODS-VEHICLE PLATE — "gulpladebil". Exclusively commercial use;
  # private use of the vehicle is a tax offence, which is the whole point of
  # the colour.
  # =========================================================================
  - id: dk-van-commercial-yellow
    class: standard
    categories: [van, truck]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_caveat: >-
      READ THIS BEFORE USING THE START YEAR. 1976 is the date of the NUMBERING
      guidelines that this plate's number follows (§ 72, stk. 4, nr. 4 — see
      dk-standard-1976), NOT a sourced date for the yellow COLOUR. No Danish
      instrument specifies plate colours at all, so nothing dates the yellow
      plate's introduction; the earliest evidence of it reached in this pass is
      SKAT's own catalogue, which shows it in 2009 and again in 2012. Treat the
      colour as attested from 2009 and the number format from 1976. This is a
      known, deliberate gap, not an oversight.
    matching: strict
    format:
      pattern: "LL 99 999"
      regex: '\A[A-Z]{2} ?\d{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?(?:[1-6]\d|7[0-5]|7[89]|8\d|9[0-7]) ?\d{3}\z'
      characters: 7
      charset:
        basis: secondary-wikipedia
        notes: "same alphabet and same number block as dk-standard-1976; see common.charset"
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "'kvadratisk' rear plate — SKAT 'Vare-lastbiler - kvadratisk (gul)'" }
      background: { color: "#FFCC00", finish: retroreflective, hex_basis: observed, spec: gul }
      foreground: "#000000"
      border: { color: "#000000", hex_basis: observed, spec: sort, note: "SKAT colour cell 'gul/sort/sort' — a BLACK border, unlike the white plate's red one" }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
      rear_differs: false
    tax_class:
      registered_use: "udelukkende erhvervsmæssig brug"
      instrument_hook: >-
        BEK 663/2025 § 85, stk. 1 — a vare- or lastbil of not more than 4 t
        "registreret til udelukkende erhvervsmæssig brug" must display the
        registered owner's CVR number and name (or an unambiguous logo) on both
        sides, in a clearly contrasting colour, letters at least 3 cm high, not
        on removable signs. This is the instrument's handle on the yellow-plate
        category; the instrument does not itself say "yellow".
      note: >-
        Registration tax and VAT treatment follow from the registered use under
        registreringsafgiftsloven and lov om vægtafgift af motorkøretøjer m.v.
        This file records the REGISTERED USE, which is what the plate colour
        tracks, and does not restate rates — rates change and are outside
        PRD-PLATES §2.5's scope.
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 17/18 'Vare-lastbiler - rektangulære (gul)' 120x504 gul/sort 10.000-75.999 og 78.000-97.999, rows 19/20 kvadratisk; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 85 (CVR marking on exclusively-commercial vans and lorries up to 4 t); § 68, stk. 2; accessed 2026-08-02"
    notes: >-
      THE GULPLADE. Yellow ground, black characters, BLACK border — the border
      colour is the quickest way to tell a Danish commercial plate from a
      private one at a distance, and it is the third word in SKAT's colour cell.
      The plate marks a REGISTERED USE, not a body type: the same van is a
      yellow-plate vehicle, a parrot-plate vehicle or neither depending on what
      it was registered for. Danish enforcement of the "private use is illegal"
      rule is what the CVR-marking duty in § 85 exists to support.

  # =========================================================================
  # THE PAPEGØJEPLADE — half yellow, half white. Vans and lorries up to 4 t
  # registered for private, or mixed private and commercial, use.
  # =========================================================================
  - id: dk-van-parrot-2009
    class: standard
    categories: [van, truck]
    period: { start: 2009 }
    period_evidence: statutory-date
    period_note: >-
      1 JANUARY 2009, from the instrument's own words rather than from the
      enthusiast web. BEK 663/2025 § 82, stk. 2 disapplies the rear-window
      mærke for a vare- or lastbil first registered "efter den 31. december
      2008", and for one first registered between 3 June 1998 and 1 January
      2009 that has since been re-registered "med nummerpladen for vare- og
      lastbiler, der er anmeldt til privat eller til blandet privat og
      erhvervsmæssig brug (papegøjenummerplade)". The sticker regime therefore
      ran 3 June 1998 - 31 December 2008 and the PLATE took over on 1 January
      2009. The enabling power is § 1, nr. 9 of lov nr. 1338 af 19. december
      2008, which inserts a new stk. 6 into § 7 of lov om registrering af
      køretøjer: "Skatteministeren kan, for at
      styrke håndhævelsen af skatte- eller miljølovgivningen, fastsætte regler
      om mærkning af køretøjer med særlige nummerplader eller mærkater."
      `statutory-date` rather than `instrument-in-force`: the 1 January 2009
      line is stated in the registreringsbekendtgørelse but is not that
      bekendtgørelse’s own commencement. NOT RE-DERIVED: the stykke numbering
      of § 7 in the consolidated LBK nr 179 af 22/02/2023 may differ from the
      2008 insertion, and no claim is made that it does not.
    matching: strict
    format:
      pattern: "LL 99 999"
      regex: '\A[A-Z]{2} ?\d{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?(?:[1-6]\d|7[0-5]|7[89]|8\d|9[0-7]) ?\d{3}\z'
      characters: 7
      charset:
        basis: secondary-wikipedia
        notes: "same alphabet and same number block as dk-standard-1976; see common.charset"
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "'kvadratisk' rear plate — SKAT 'Vare-lastbiler - Papegøje kvadratisk'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: "hvid/gul", note: "TWO-TONE: SKAT's colour cell reads 'hvid/gul/sort/sort' — a white field and a yellow field, black characters, black border. Which group sits on which field is OBSERVED from SKAT's own rendering (the yellow field to the left, carrying the letter group, and the white field to the right), not stated by any source; the two-tone fact itself is the catalogue's" }
      background_fields:
        - { part: "letter group", color: "#FFCC00", hex_basis: observed, spec: gul }
        - { part: "digit group", color: "#FFFFFF", hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#000000", hex_basis: observed, spec: sort }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
      rear_differs: false
    tax_class:
      registered_use: "privat eller blandet privat og erhvervsmæssig brug"
      instrument_hook: "BEK 663/2025 § 82, stk. 1-2, citing § 2 a i lov om vægtafgift af motorkøretøjer m.v."
      predecessor_regime: >-
        A REAR-WINDOW STICKER, NOT A PLATE, AND IT IS DATED AT BOTH ENDS.
        Between 3 June 1998 and 31 December 2008 the same vehicles carried a
        mærke issued by the authority and stuck inside the rear window (§ 84:
        on the outside rear where the car has no rear window, has a tinted rear
        window, or is an open-bed pick-up; removed if the car is re-registered
        to another use). Vehicles first registered in that window still carry
        the sticker unless they have since been put on a papegøjeplade. The
        sticker is recorded here as design context; it is not a plate and has
        no series of its own.
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 82, stk. 1-2 (the 3 June 1998 / 31 December 2008 / 1 January 2009 lines and the word papegøjenummerplade), §§ 83-84 (the sticker), § 85; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2008/1338/dan/xml  # lov nr. 1338 af 19/12/2008, § 1, nr. 9 (new § 7, stk. 6 in lov om registrering af køretøjer): the power to require marking of vehicles 'med særlige nummerplader eller mærkater' to strengthen tax and environmental enforcement — the enabling instrument for this plate; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 21/22 'Vare-lastbiler - Papegøje rektangulær' 120x504 hvid/gul/sort/sort, rows 23/24 kvadratisk; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2012/504/dan/xml  # BEK 504/2012 § 84, stk. 2 — the same papegøjenummerplade wording, the FIRST appearance of the word in the registreringsbekendtgørelse (it is absent from BEK 633/2009, 811/2010 and 651/2011); accessed 2026-08-02"
    notes: >-
      THE PAPEGØJEPLADE ("parrot plate"), and the reason Danish plates are worth
      modelling at all: the COLOUR ENCODES THE TAX CLASS, not the vehicle. Three
      registered uses, three looks — exclusively commercial is all yellow,
      private or mixed is yellow-and-white, and a car is white. The word appears
      in the instrument exactly once, parenthetically, in § 82, stk. 2, and that
      one parenthesis is what dates the plate to 1 January 2009. Note the
      asymmetry the instrument creates: a van first registered between 3 June
      1998 and the end of 2008 may still be running on the OLD sticker regime,
      so the absence of a parrot plate on a mixed-use van is not evidence of
      anything.

  # =========================================================================
  # MOTORCYCLES — the 240 x 165 mm two-row plate.
  # =========================================================================
  - id: dk-motorcycle-1976
    class: motorcycle
    categories: [motorcycle]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_note: "the 1 April 1976 numbering guidelines; see dk-standard-1976"
    matching: strict
    format:
      pattern: "LL 99 999"
      regex: '\A[A-Z]{2} ?\d{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?(?:[1-6]\d|7[0-5]|7[89]|8\d|9[0-7]) ?\d{3}\z'
      characters: 7
      pattern_note: >-
        The plate is TWO-ROW (letters above, digits below). The dataset writes
        the single-line printed form with the emitted space, as everywhere else;
        the two-row layout is a design fact, recorded in `design`.
      charset:
        basis: secondary-wikipedia
        notes: "see common.charset"
    design:
      plate: { w: 240, h: 165, unit: mm }
      rows: 2
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
      rear_differs: false
      display: "ONE plate, mounted at the REAR and never on the side (§ 69, stk. 2)"
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 69, stk. 2 (one rear plate, not on the side); § 70, stk. 6 (rear-plate lighting); accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 25/26 'MC og påhængsvogne til MC (hvid)' 165x240 hvid/sort/rød 10.000-75.999 og 78.000-97.999; accessed 2026-08-02"
    notes: >-
      SKAT stocks one type for motorcycles AND their trailers ("MC og
      påhængsvogne til MC"), which is why a motorcycle trailer does not appear
      as a trailer series here. PRE-2012 the motorcycle block was its own
      (reported as 10.000-18.999 — secondary-wikipedia, see the decode file);
      since 6 June 2012 motorcycles share the general 10.000-75.999 /
      78.000-97.999 range with cars, vans and approved tractors, so a
      motorcycle number is no longer distinguishable from a car number.

  # =========================================================================
  # MOPEDS. Two series, two colours, two digit counts — and the small one has
  # a real, dated start.
  # =========================================================================
  - id: dk-moped-large
    class: moped
    categories: [moped]
    period: { start: 2008 }
    period_evidence: instrument-in-force-start-upper-bound
    period_caveat: >-
      THIS START IS AN UPPER BOUND, NOT A FIRST-ISSUE DATE. A "stor knallert"
      (over 30 km/h) has always had to be registered under § 3, stk. 1, nr. 3
      without any of the conditions that apply to the small one, so the
      requirement predates every text reached in this pass. 2008 is the
      commencement of BEK 1567/2007, the OLDEST registreringsbekendtgørelse
      whose full text is machine-readable on retsinformation.dk (pre-2008
      instruments publish ELI metadata only — see the GAPS block), and that text
      already carries the duty. The true start is earlier and is not
      established here.
    matching: strict
    format:
      pattern: "LL 999"
      regex: '\A[A-Z]{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?[1-9]\d{2}\z'
      characters: 5
      charset:
        basis: secondary-wikipedia
        notes: >-
          Alphabet per common.charset. The number block 100-999 is primary,
          from SKAT's catalogue row "Stor Knallert" — which is also why
          regex_strict forbids a leading zero.
    design:
      plate: { w: 145, h: 125, unit: mm }
      rows: 2
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      band: { side: none }
      band_note: "NO EU BAND, and it is not a choice: § 68, stk. 5, 3. pkt. — 'nummerplade til en knallert eller traktor udfærdiges ikke med EU-symbolet.'"
      emblem: { present: false }
      display: "ONE plate at the rear (§ 69, stk. 2); not lit at night (§ 70, stk. 6, 2. pkt.)"
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3, stk. 1, nr. 3 and stk. 3; § 68, stk. 5 (no EU symbol); § 69, stk. 2; § 70, stk. 6; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2007/1567/dan/xml  # BEK 1567/2007, in force 1 January 2008, already requiring knallert registration — the upper bound this period rests on; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 5 'Stor Knallert' 125x145 hvid/sort 100-999; accessed 2026-08-02"
    notes: >-
      THE 45 KM/H MOPED, on the smallest plate Denmark issues — 145 x 125 mm,
      two rows, white with black characters and no EU band. The lille/stor
      split is the 30 km/h design-speed line, which BEK 663/2025 uses in terms
      ("En knallert med en konstruktivt bestemt maksimal hastighed over 30 km
      i timen") but only in its chapter on FOREIGN vehicles; the domestic
      definition of a knallert is færdselslovens § 2, nr. 7, applied by BEK
      663/2025 § 33, and neither instrument defines "lille knallert" in so
      many words. Recorded that way rather than tidied. This plate is WHITE
      and the small moped's is YELLOW, which is the reverse of the intuition
      that yellow means commercial, and is why the two are modelled
      separately.

  - id: dk-moped-small-2006
    class: moped
    categories: [moped]
    period: { start: 2006 }
    period_evidence: statutory-date
    period_note: >-
      1 JULY 2006, and the instrument in force today still states it: BEK
      663/2025 § 3, stk. 3 — "En lille knallert skal kun registreres, hvis den
      er erhvervet som fabriksny den 1. juli 2006 eller senere." The same
      sentence stands in BEK 1567/2007, so the rule is at least as old as that
      text and dates itself. A small moped bought new before that day is on the
      road unregistered and unplated, entirely lawfully — which a parse API
      must not read as an anomaly.
    matching: strict
    format:
      pattern: "LL 9999"
      regex: '\A[A-Z]{2} ?\d{4}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?[1-9]\d{3}\z'
      characters: 6
      charset:
        basis: secondary-wikipedia
        notes: "alphabet per common.charset; the 1.000-9.999 block is primary from SKAT's catalogue row 'Lille knallert (gul)', hence no leading zero in regex_strict"
    design:
      plate: { w: 145, h: 125, unit: mm }
      rows: 2
      background: { color: "#FFCC00", finish: retroreflective, hex_basis: observed, spec: gul }
      foreground: "#000000"
      border: { color: "#000000", hex_basis: observed, spec: sort }
      band: { side: none }
      band_note: "NO EU BAND — § 68, stk. 5, 3. pkt."
      emblem: { present: false }
      display: "ONE plate at the rear (§ 69, stk. 2); not lit at night (§ 70, stk. 6, 2. pkt.)"
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3, stk. 3 (the 1 July 2006 cut-off, plus the invalideknallert and speed-pedelec exemptions); § 68, stk. 5; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2007/1567/dan/xml  # the identical 1 July 2006 sentence in BEK 1567/2007 — the rule is at least that old; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 12 'Lille knallert (gul)' 125x145 gul/sort 1.000-9.999; accessed 2026-08-02"
    notes: >-
      THE 30 KM/H MOPED. YELLOW, and for once the yellow has nothing to do with
      tax — it distinguishes the small moped from the large one, whose plate is
      white. Registration is conditional on the purchase date rather than on the
      vehicle: only a lille knallert acquired factory-new on or after 1 July
      2006 must be registered. Invalideknallerter are exempt outright, and a
      speed pedelec under the trial scheme in BEK nr 878 af 25/06/2018 is not
      registered at all.

  # =========================================================================
  # TRAILERS — yellow, four digits.
  # =========================================================================
  - id: dk-trailer-1976
    class: trailer
    categories: [trailer, semitrailer, caravan]
    period: { start: 1976 }
