      background: { color: "#FFCC00", finish: retroreflective, hex_basis: observed, spec: gul }
      foreground: "#000000"
      border: { color: "#000000", hex_basis: observed, spec: sort }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
