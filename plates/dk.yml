  # =========================================================================
  # ØNSKENUMMERPLADE — the personalised plate, and the only Danish plate bound
  # to a PERSON rather than to a vehicle.
  # =========================================================================
  - id: dk-personalized-1992
    class: personalized
    categories: [car, van, truck, motorcycle, trailer]
    period: { start: 1992 }
    period_evidence: secondary-wikipedia
    period_note: >-
      2 MARCH 1992, reported by Danish Wikipedia, which also attributes the
      authorising legislation to a law of 8 May 1991 without giving its number.
      NEITHER was verified against an instrument in this pass: the
      registreringsbekendtgørelser whose full text is machine-readable start in
      2007, and BEK nr 18 af 10/01/1992 om registrering af motorkøretøjer m.v.
      — the obvious candidate — publishes ELI metadata only, with a StartDate
      of 1997-10-01 that is plainly a register artefact rather than that
      bekendtgørelse's commencement. The GRAMMAR below is primary; the DATE is
      not, and is tagged accordingly.
    matching: strict
    binding: owner
    binding_note: >-
      The one Danish plate that follows a person. § 74, stk. 5: the number "kan
      inden for rettighedsperioden overføres til et andet køretøj, som
      registreres til den, der har retten til at anvende ønskenummeret."
      § 74, stk. 7-8: the right runs EIGHT YEARS from the first registration of
      a vehicle with the number and is renewable for a further eight against
      payment, applied for before expiry and not earlier than three months
      before it. § 74, stk. 6 closes the transfer list to a spouse, a partner of
      five years' shared residence, or a survivor on death — so an ønskenummer
      cannot simply be sold on.
    format:
      pattern: "LLLLLLL"
      regex: '\A[A-Z0-9]{2,7}\z'
      characters: "2-7"
      charset:
        basis: primary-instrument
        notes: >-
          BEK 663/2025 § 74, stk. 2, verbatim: "Ønskenummeret skal bestå af
          mindst to og højst syv latinske bogstaver eller arabiske tal. Et
          ønskenummer må ikke være egnet til at vække anstød eller medføre
          ulempe for nogen." Letters and digits may be mixed in any order and
          any proportion — the regex is the instrument's grammar, not an
          approximation of it. The anstød test is a NON-ISSUANCE rule and is
          deliberately not compiled into the regex, following the treatment of
          blocked combinations in nl.yml and se.yml.
          Æ, Ø and Å: Danish Wikipedia and English Wikipedia both report that
          the Danish letters may be used. They are outside this dataset's
          serial alphabet (_meta/separators.yml) and so cannot be written here;
          this is a KNOWN under-coverage of the Danish ønskenummer space,
          recorded rather than hidden. The instrument's own words — "latinske
          bogstaver" — do not obviously include them, and no primary resolves
          it.
      separator_note: >-
        SKAT's catalogue renders examples with a layout gap ("BONNY 11",
        "HANSEN1", "HANS 1"). § 74, stk. 2 admits only letters and digits, so
        the gap is a RENDERING gap and not part of the ønskenummer; the regex
        therefore carries no separator. A consumer matching a photographed
        plate should strip the forgiving set first, which _meta/separators.yml
        makes safe by construction.
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "'kvadratisk' rear plate, and a separate 'amerikaner' variant — SKAT rows 33/34 and 78/79" }
        - { w: 240, h: 165, unit: mm, note: "motorcycle ønskeplade — SKAT rows 35/36 'Ønskeplader MC (hvid)'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
      rear_differs: false
    region_encoding: none
    region_encoding_note: "an ønskenummer is chosen by its holder and encodes nothing"
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 4, nr. 2 (the plate type) and § 74 in full: the 2-7 character grammar, the anstød test, first-come allocation, the six-month registration deadline, transfer between vehicles, the closed transfer list, the eight-year right and its renewal; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 31-36 and 78/79 'Ønskeplader', 120x504 and 165x240, hvid/sort/rød, 'Mindst 2 og maksimalt 7 karakterer'; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: introduced 2 March 1992; a law of 8 May 1991 named without a number; roughly 4,000 in use; accessed 2026-08-02"
    notes: >-
      THE ØNSKENUMMERPLADE. Its grammar is entirely primary — two to seven
      Latin letters or Arabic numerals, § 74, stk. 2 — and it is the reason
      `regex` here is a length-quantified class rather than a shape. Everything
      procedural about it is primary too, including the parts that matter to a
      dataset: the right lasts eight years and is renewable, it moves between
      the holder's vehicles rather than staying with a car, and it may be
      transferred to another person only within a closed family list. Only the
      1992 START is secondary. English Wikipedia adds that an ønskenummer may
      not take the same form as a standard number; that restriction is NOT in
      § 74 and is not encoded here.

  # =========================================================================
  # HISTORIC PLATES. Two series, because the eligibility cut moved on a date
  # the instruments give exactly.
  # =========================================================================
  - id: dk-historic-pre1958
    class: historic
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2008, end: 2011 }
    period_evidence: transitional-provision
    period_note: >-
      END IS EXACT, START IS AN UPPER BOUND. The end: BEK 811/2010 § 103,
      stk. 3 — "§ 79 har virkning fra den 1. april 2011. Indtil da finder § 76 i
      bekendtgørelse nr. 633 af 26. juni 2009 anvendelse." § 76 of BEK 633/2009
      is the 1958-cut historic plate, so this regime ran to 31 March 2011 and
      the 1976-cut one began on 1 April 2011. The start: BEK 1567/2007, in force
      1 January 2008, is the oldest text reachable and already carries the
      1958-cut rule (§ 76), so 2008 bounds the start from above rather than
      fixing it.
    matching: recall-only
    format:
      pattern: "LL 999"
      regex: '\A[A-Z]{1,2} ?\d{1,6}\z'
      characters: "2-8"
      pattern_note: >-
        A UNION, deliberately. BEK 1567/2007 § 76, stk. 2: "En historisk korrekt
        nummerplade er en nummerplade af en type og med et registreringsnummer
        fra før den 1. april 1958" — the plate REPLICATES whatever the vehicle
        would have carried, so the regex is the union of the pre-1958 Danish
        shapes and a match against it is a shape hit and nothing more. Hence
        `matching: recall-only` and no `regex_strict`.
      shapes_covered: >-
        One letter plus digits (the county plate) and two letters plus digits.
        The single-letter form is attested PRIMARILY, not from the enthusiast
        web: BEK 633/2009 § 101, stk. 2 and BEK 651/2011 § 102, stk. 2 both
        provide that "Køretøjer med nummerplader med enkelt bogstav kan
        fortsat anvende disse", and stk. 3 of each adds that no replacement is
        supplied for them. The digit counts are not stated in any instrument
        and the 1-6 range here is a deliberately generous recall bound.
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_note: >-
        SIZE AND COLOUR ARE NOT SPECIFIED for a historic plate — it is "af en
        type ... der svarer til køretøjets art og tidspunktet for køretøjets
        første registrering", i.e. period-correct by definition. The 504x120
        entry is the modern default and should not be read as a claim about any
        particular era's plate. Pre-1976 Danish plates are reported as black
        with white characters (secondary-wikipedia); that is recorded below and
        not asserted as a spec.
      background: { color: "#000000", finish: painted, hex_basis: observed, spec: sort, note: "secondary-wikipedia: the pre-1976 style is black ground with white characters" }
      foreground: "#FFFFFF"
      band: { side: none }
      band_note: "NO EU BAND, and not by choice: § 68, stk. 5, 3. pkt. — 'Historisk nummerplade ... udfærdiges ikke med EU-symbolet.'"
      emblem: { present: false }
    region_encoding: none
    region_encoding_note: >-
      The single letter on a pre-1958 plate WAS a county/city marker
      (secondary-wikipedia). No decode table is shipped for it — see the GAPS
      block and plates/_decode/dk-serial-blocks.yml.
    sources:
      - "https://www.retsinformation.dk/eli/lta/2007/1567/dan/xml  # BEK 1567/2007 § 76: 'SKAT kan tillade brug af en historisk korrekt nummerplade på et køretøj, der er registreret første gang før den 1. april 1958. En historisk korrekt nummerplade er en nummerplade af en type og med et registreringsnummer fra før den 1. april 1958.'; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2010/811/dan/xml  # BEK 811/2010 § 103, stk. 3 — the virkningsbestemmelse that ends this regime on 31 March 2011; § 79 (the successor rule); accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2009/633/dan/xml  # BEK 633/2009 § 76 (the 1958 cut as it stood) and § 101, stk. 1-2 (circular tractor/sidecar plates and single-letter plates remain lawful, with no replacement path); accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: pre-1958 systems — one letter plus digits, the letter marking the amt; accessed 2026-08-02"
    notes: >-
      THE 1958-CUT HISTORIC PLATE, and the reason Denmark needs two historic
      series instead of one. Between 2008 (at the latest) and 31 March 2011 the
      permit was open only to vehicles first registered before 1 APRIL 1958 and
      the plate had to be a pre-1958 type. That date is not decorative: read
      with the 1 April 1976 line in the current instrument, the two together are
      the only primary evidence in this file that Denmark's numbering changed
      twice in the twentieth century, on 1 April 1958 and on 1 April 1976.
      Neither reform's own instrument was reached.

  - id: dk-historic-pre1976
    class: historic
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2011 }
    period_evidence: transitional-provision
    period_note: >-
      1 APRIL 2011, dated to the day by a virkningsbestemmelse rather than by a
      commencement clause — which is exactly the distinction this wave exists to
      police. BEK 811/2010 came into force on 1 July 2010 (§ 103, stk. 1), but
      § 103, stk. 3 held its historic-plate section back: "§ 79 har virkning fra
      den 1. april 2011." Shipping 2010 here, from the bekendtgørelse's own
      date, would have been the Spanish defect in miniature.
    matching: recall-only
    format:
      pattern: "LL 999"
      regex: '\A[A-Z]{1,2} ?\d{1,6}\z'
      characters: "2-8"
      pattern_note: >-
        A UNION, as for dk-historic-pre1958, but a wider one: the eligibility
        window now reaches to 31 March 1976, so the replicated plate may be
        either a pre-1958 single-letter type or a 1958-1976 two-letter type.
        `matching: recall-only`; no `regex_strict`.
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_note: "period-correct by definition (§ 75, stk. 2); the entry is a default, not a claim"
      background: { color: "#000000", finish: painted, hex_basis: observed, spec: sort, note: "secondary-wikipedia: pre-1976 style, black ground with white characters" }
      foreground: "#FFFFFF"
      band: { side: none }
      band_note: "NO EU BAND — § 68, stk. 5, 3. pkt."
      emblem: { present: false }
      mounting_exemption: "§ 70, stk. 3 exempts historic plates (and any plate from before 1 April 1976) from the two-screw rule"
    region_encoding: none
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 75 in full: eligibility (first registered before 1 April 1976), the period-correct type-and-number rule with § 56, the six-month deadline, and that the plate FOLLOWS THE VEHICLE and must be surrendered on deregistration or renumbering; § 68, stk. 4, nr. 3 and stk. 5; § 70, stk. 3; § 72, stk. 4 (a historic plate IS replaceable, unlike an ordinary lost plate); accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2010/811/dan/xml  # § 103, stk. 3: '§ 79 har virkning fra den 1. april 2011'; § 79 carries the 1976 cut; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2018/1643/dan/xml  # BEK 1643/2018 — the 1976 cut unchanged mid-chain, confirming the boundary moved once and stayed; accessed 2026-08-02"
    notes: >-
      THE HISTORIC PLATE AS IT STANDS. Eligibility: first registered before
      1 April 1976. The plate must match the vehicle's kind and the time of its
      first registration "eller senere" (§ 75, stk. 2), so a 1960s car may
      lawfully wear a 1970s plate but not the reverse, and a specific number may
      be requested in the application. Unlike an ønskenummerplade it FOLLOWS THE
      VEHICLE (§ 75, stk. 4). Note the separate veteran regime it is often
      confused with: § 4 lets a vehicle first registered more than thirty years
      ago be registered "til veterankørsel", which restricts USE (occasional
      only, no commercial passenger transport, no dangerous goods, no emergency
      driving, no hire without driver) and has nothing to do with plates.

  # =========================================================================
  # GRÆNSENUMMERPLADE — the Danish export/emigration plate, dated by a red
  # field carrying DK and the expiry year.
  # =========================================================================
  - id: dk-export-border
    class: export
    categories: [car, van, truck, motorcycle]
    period: { start: 2008 }
    period_evidence: instrument-in-force-start-upper-bound
    period_caveat: >-
      UPPER BOUND. BEK 1567/2007, in force 1 January 2008, already carries the
      grænsenummerplade regime; so does lov nr. 1338 af 19/12/2008 by reference,
      and registreringsafgiftsloven exempts vehicles registered on them. The
      series is older than any text reached and its start is not established.
    matching: strict
    format:
      pattern: "99 999"
      regex: '\A\d{2} ?\d{3}\z'
      characters: 5
      pattern_note: >-
        NO LETTERS. § 68, stk. 2's two-letters-plus-digits rule applies to the
        ordinary plate; SKAT's catalogue renders the grænseplade as five digits
        alone ("12 045"), with the country and year carried in the red field
        rather than in the serial.
      charset:
        basis: primary-authority
        notes: "digits only; SKAT's own format key writes '#' for a numeral and 'Dkåå' for the red year box, which it defines as 'Dk + årstal i rød kasse'"
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "motorcycle grænseplade — SKAT rows 51/55/59" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      validity_field: { side: left, color: "#C8102E", hex_basis: observed, content: "DK over the two-digit expiry year, in white on red", note: "SKAT stocks three variants at any time — 'løbende år', 'løbende år + 1' and 'løbende år + 2' (rows 49-59), which is how the year on the plate is always in stock ahead of demand" }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: false, note: "COMPULSORY: § 68, stk. 5, 2. pkt." }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 60 in full: who may have one (a resident emigrating or going abroad long-term, taking the vehicle with them), the 21-days-before-departure and 6-months-abroad limits, the 24-hour collection permit for someone already abroad, the syn-linked outer limits in stk. 3, that a grænsenummerplade vehicle cannot be re-registered to another owner and the plates cannot move to another vehicle; § 68, stk. 4, nr. 1 and stk. 5; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 49-59 'Grænseplader - bil/MC (hvid) løbende år / +1 / +2 EU', 120x504 and 165x240, hvid/sort/rød; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2007/1567/dan/xml  # the grænsenummerplade regime already present in the oldest full text reachable; accessed 2026-08-02"
    notes: >-
      DENMARK'S EXPORT PLATE, and its shape is unusual enough to be worth
      spelling out: a white plate with a RED FIELD on the left carrying "DK"
      over the two-digit year the registration expires, then a bare five-digit
      serial with no letters at all. The EU band is compulsory on it. The
      regime is narrower than "export" suggests — § 60 is written for a resident
      who is emigrating or going abroad for an extended period and taking the
      car, not for the trade, and the vehicle can be neither re-registered to
      anyone else nor have its plates moved. English Wikipedia calls it a
      "temporary export plate", which is close enough to be worth noting and
      loose enough not to be adopted as the definition.

  # =========================================================================
  # THE NORDIC BORDER PLATE — abolished, and dated at the end.
  # =========================================================================
  - id: dk-border-nordic
    class: temporary
    categories: [car, van, truck, motorcycle]
    period: { start: 2008, end: 2011 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      END IS INSTRUMENT-DATED: the nordiske grænsenummerplade survives as § 99
      of BEK 811/2010 and is GONE from BEK 651/2011, which came into force on
      18 June 2011 and repealed BEK 811/2010 the same day (§ 101). The regime
      therefore ended on 17 June 2011. START IS AN UPPER BOUND: BEK 1567/2007,
      in force 1 January 2008, already carries it, and nothing earlier was
      reachable.
    matching: strict
    format:
      pattern: "9999"
      regex: '\A\d{4}\z'
      characters: 4
      evidence: secondary-wikipedia
      charset:
        basis: secondary-wikipedia
        notes: >-
          THE FORMAT IS THE ONLY SECONDARY THING HERE. Danish Wikipedia
          describes the plate as four red digits, the first two identifying the
          motor office, followed by a red "DK". The instruments that create and
          abolish the regime say nothing about its appearance, and SKAT's 2012
          catalogue postdates its abolition, so nothing primary describes it.
          The regex covers the four digits only; the "DK" is recorded as a
          design legend rather than as part of the serial, because no source
          establishes whether it sits inside the serial field.
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#C8102E"
      legend: "DK, in red, following the four digits (secondary-wikipedia)"
      band: { side: none }
      emblem: { present: false }
    region_encoding: none
    region_encoding_note: >-
      Danish Wikipedia reports that the first two digits identified the issuing
      motor office. That is a REAL decode claim and it is deliberately NOT
      shipped as a table: no source, primary or secondary, enumerates the
      office codes, and a decode table with no rows is worse than none.
    sources:
      - "https://www.retsinformation.dk/eli/lta/2010/811/dan/xml  # BEK 811/2010 §§ 99-100: temporary registration on nordiske grænsenummerplader of a non-EU/EEA foreign vehicle for up to a year, and the duty to surrender the plates and permit to the police or SKAT on leaving Denmark for anywhere but Finland, Norway or Sweden; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2011/651/dan/xml  # BEK 651/2011 § 101: in force 18 June 2011, repealing BEK 811/2010 — and containing no nordisk grænsenummerplade; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2007/1567/dan/xml  # the regime present in the oldest full text reachable; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: four red digits, the first two indicating the motor office, followed by DK in red; accessed 2026-08-02"
    notes: >-
      AN ENDED SERIES, kept because its end is exactly dated and because a
      parse API meeting one of these plates should be told the last one was
      issued no later than 17 June 2011. It was the Nordic reciprocal
      arrangement: a foreign vehicle from outside the EU/EEA could be
      temporarily registered on Danish nordiske grænsenummerplader for up to a
      year, and the plates and permit had to be handed in at the border on
      leaving for anywhere other than Finland, Norway or Sweden. BEK 651/2011
      dropped the whole thing without a transitional provision.

  # =========================================================================
  # FASTE PRØVESKILTE — trade plates. Red characters on white, two digits.
  # =========================================================================
  - id: dk-dealer-testplate
    class: dealer
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2008 }
    period_evidence: instrument-in-force-start-upper-bound
    period_caveat: >-
      UPPER BOUND, but a well-evidenced one. BEK 633/2009 § 103 required holders
      of a fast prøveskilt "der er udleveret før den 1. januar 2008" to have
      their right renewed by the end of 2013 — so the regime is older than the
      SKAT era and older than every text reached. 2008 is the commencement of
      BEK 1567/2007, the oldest full text reachable, and bounds the start from
      above.
    matching: strict
    format:
      pattern: "LL 99"
      regex: '\A[A-Z]{2} ?\d{2}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?[1-9]\d\z'
      characters: 4
      charset:
        basis: secondary-wikipedia
        notes: "alphabet per common.charset; the 10-99 block is primary from SKAT's catalogue, hence no leading zero in regex_strict"
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "motorcycle prøveskilt — SKAT rows 3/4 'Faste prøveskilte - MC (hvid)'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#C8102E"
      foreground_note: "RED characters on white — SKAT colour cell 'hvid/rød rød', i.e. white ground, red characters, red border. Danish Wikipedia describes the fixed prøveskilt as white with red letters and four black digits; the black digits are not in SKAT's catalogue and are not adopted here"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 4, nr. 5 (the plate type, by reference to §§ 7 a-7 e i lov om registrering af køretøjer); § 77 (§§ 69-71 apply to prøveskilte, except the two-screw rule); accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 1-4 'Faste prøveskilte - Biler (hvid)' 120x504 and '- MC (hvid)' 165x240, hvid/rød, 10-99; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2009/633/dan/xml  # § 103: renewal of rights to prøveskilte issued before 1 January 2008 — evidence the regime predates the reachable texts; accessed 2026-08-02"
    notes: >-
      THE FAST PRØVESKILT — a trade plate for manufacturers, importers,
      dealers and repairers, bound to the business rather than to a vehicle,
      and the shortest Danish number at four characters. Its statutory home is
      §§ 7 a-7 e of lov om registrering af køretøjer rather than the
      bekendtgørelse. NOT MODELLED AS A SERIES, deliberately: the LØSE
      PRØVESKILT was replaced by the PRØVEMÆRKE (§§ 78-81), which is
      self-adhesive plastic film bearing a løbenummer and a validity period,
      issued at most fourteen days before that period begins and not returned
      afterwards. It is a sticker with a running number, not a plate with a
      registration number, so it has no format this schema can honestly carry
      and it is recorded here instead.

  # =========================================================================
  # BLOKVOGN — heavy-haulage. The tallest plate Denmark issues, with a word
  # printed on it.
  # =========================================================================
  - id: dk-blokvogn
    class: standard
    categories: [truck, trailer, machine]
    period: { start: 2008 }
    period_evidence: instrument-in-force-start-upper-bound
    period_caveat: "UPPER BOUND, as for dk-tractor-registered: BEK 1567/2007 already requires blokvogne to be registered"
    matching: strict
    format:
      pattern: "99 99 99"
      regex: '\A\d{2} ?\d{2} ?\d{2}\z'
      characters: 6
      pattern_note: >-
        NO LETTERS, and a six-digit number — the only Danish plate with more
        than five digits. SKAT's catalogue gives the range as 100000-999999 and
        renders it in three pairs. The word BLOKVOGN is printed above the
        number and is a LEGEND, not part of the serial; it is recorded in
        `design.legend`.
      charset:
        basis: primary-authority
        notes: "digits only, 100000-999999, from SKAT's catalogue"
    design:
      plate: { w: 504, h: 207, unit: mm }
      rows: 2
      legend: "BLOKVOGN, printed above the number"
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 68 'Blokvogne (hvid) EU' 207x504 hvid/sort rød, 'Blokvogn 100000-999999', format rendered 'BLOKVOGN 55 22 25'; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3, stk. 1, nr. 2 and stk. 2 (blokvogne must be registered, by reference to §§ 3-4 i lov om registrering af køretøjer); accessed 2026-08-02"
    notes: >-
      THE BLOKVOGN PLATE — 504 x 207 mm, nearly twice the height of an ordinary
      plate, with the word BLOKVOGN printed above a six-digit number and no
      letters at all. A blokvogn is the Danish heavy-haulage category (§ 3 sends
      it and tractors down two routes by reference to lov om registrering af
      køretøjer §§ 3-4). Danish Wikipedia reports that blokvogne are now
      registered on ordinary yellow commercial plates; SKAT's 2012 catalogue
      still stocks the dedicated plate, so this file records the dedicated plate
      as open and flags the conflict rather than resolving it — the sources
      disagree and PRD-PLATES §5.3 says record, do not average.

  # =========================================================================
  # LUFTHAVNSPLADER — airside-only plates. Included because SKAT stocks them,
  # flagged because the class vocabulary has no home for them.
  # =========================================================================
  - id: dk-airport-rf
    class: specialty
    class_caveat: >-
      NO CLASS IN _meta/classes.yml FITS. This is an operational plate for a
      vehicle confined to airport grounds, issued by the state to an airport
      operator; it is not a specialty-DESIGN programme on a standard serial,
      which is what `specialty` is defined as. `specialty` is used as the
      least-wrong placeholder and the mismatch is flagged for the maintainer:
      the right fix is a vocabulary amendment by PR (a `restricted-area` class
      or similar), not an ad-hoc value in a data file.
    categories: [car, van, truck, machine]
    period: { start: 2012 }
    period_evidence: agency-series-catalogue
    period_note: >-
      2012 is the date of SKAT's catalogue, the only authority document that
      describes these plates; it bounds the start from above. Danish Wikipedia
      reports a colour history — green with black characters, then red with
      white, then yellow with red "siden 2011" — which if correct puts the
      current design at 2011; that is secondary and conflicts with the
      catalogue's own colour words, so it is recorded below rather than adopted.
    matching: strict
    format:
      pattern: "RF 99 999"
      regex: '\ARF ?\d{2} ?\d{3}\z'
      characters: 7
      pattern_note: >-
        The letters are FIXED at RF, so they are spelled as literals rather than
        as pattern tokens. Danish Wikipedia glosses RF as "RegistreringsFri"
        (registration-free), which is consistent with the vehicles being outside
        ordinary registration; that gloss is secondary-wikipedia.
      charset:
        basis: primary-authority
        notes: "RF + five digits, block RF10000-RF99999, from SKAT's catalogue"
    design:
      plate: { w: 504, h: 120, unit: mm }
      background: { color: "#C8102E", finish: retroreflective, hex_basis: observed, spec: rød }
      foreground: "#FFCC00"
      colour_conflict: >-
        RECORDED, NOT RESOLVED. SKAT's colour cell reads "rød/gul rød", which
        under the background/characters/border reading used throughout this file
        gives a RED ground with YELLOW characters and a red border. Danish
        Wikipedia says the opposite for the same period: "siden 2011 gule med
        røde tegn" — yellow ground, red characters. Both are recorded; the SKAT
        reading is the one encoded because it is the authority's own document,
        and the conflict is flagged for the verifier.
      band: { side: none }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 45 'Lufthavnsplader - rektangulær' 120x504 rød/gul rød RF10000-RF99999, format 'RF 24 721'; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: the RF series is used at Danish airports (Copenhagen/Kastrup, Aalborg, Billund), the vehicles may use public roads only by dispensation or on temporary prøveskilte because the insurance covers airport grounds only, and the colour history green -> red -> yellow-with-red since 2011; accessed 2026-08-02"
    notes: >-
      AIRSIDE PLATES. Included because they are a stocked, formatted, numbered
      Danish plate type in the authority's own catalogue, and because a parse
      API meeting "RF 24 721" should not silently fail. Two things make them
      unlike everything else in this file: the vehicles are not ordinarily
      registered for road use at all, and the letters are fixed rather than
      serial. See `class_caveat` — the class vocabulary needs an amendment, and
      this series is where the need shows up.

  - id: dk-airport-rf-trailer
    class: specialty
    class_caveat: "as dk-airport-rf"
    categories: [trailer]
    period: { start: 2012 }
    period_evidence: agency-series-catalogue
    period_note: "as dk-airport-rf — the SKAT catalogue's own date, bounding the start from above"
    matching: strict
    format:
      pattern: "RF 99 99"
      regex: '\ARF ?\d{2} ?\d{2}\z'
      characters: 6
      charset:
        basis: primary-authority
        notes: >-
          RF + four digits. SKAT's catalogue prints the range as
          "RF1000-FR9999"; the trailing "FR" is a transposition in the source
          and is recorded as such, not silently corrected — the format cell on
          the same row renders "RF 24 72", so the prefix is RF at both ends.
    design:
      plate: { w: 504, h: 120, unit: mm }
      background: { color: "#C8102E", finish: retroreflective, hex_basis: observed, spec: rød }
      foreground: "#FFCC00"
      colour_conflict: "as dk-airport-rf"
      band: { side: none }
      emblem: { present: false }
    region_encoding: none
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 47 'Lufthavnsplader - påhængsvogn' 120x504 rød/gul rød 'RF1000-FR9999', format 'RF 24 72'; accessed 2026-08-02"
    notes: >-
      The airside trailer plate — four digits instead of five, which is the
      only thing separating it from dk-airport-rf and the reason it is a series
      of its own rather than a variant. The typo in SKAT's range cell is left
      standing and annotated; a dataset that silently repairs its sources
      cannot be audited against them.

# ---------------------------------------------------------------------------
# GAPS — what this pass could NOT establish. Recorded here because a stated
# gap is a finding and a silent one is a defect (PRD-PLATES §5.1
# jurisdiction-completeness).
# ---------------------------------------------------------------------------
gaps:
  - id: dk-gap-military
    what: "Forsvarets nummerplader — the Danish armed forces' own plates"
    why_not_shipped: >-
      A SCHEMA COLLISION, not a sourcing failure, and it is worth reporting as
      such. Danish Wikipedia describes the plate as a branch emblem followed by
      five digits "hvor der mellem andet og tredje ciffer er et punktum" — a
      FULL STOP inside the number, printed between the second and third digit.
      U+002E is in _meta/separators.yml's `forgiving` set but NOT in its
      `emitted` set, so the dataset cannot spell this plate's printed form
      without either failing the lint or misrepresenting the plate by writing a
      hyphen or a space in place of the stop. Per PRD-PLATES §2.6 that is a
      schema amendment (a `never_separator` entry, or an addition to `emitted`
      with its rationale), not a data entry, and it is out of scope for a
      jurisdiction pass. No Forsvarsministeriet instrument was located.
    sources:
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: black ground, white characters, yellow branch emblem for Hæren, Søværnet, Flyvevåbnet and the joint authorities; a mark plus five digits with a full stop between the second and third; accessed 2026-08-02"
  - id: dk-gap-emergency
    what: "Beredskabsstyrelsen (Danish Emergency Management Agency) plates"
    why_not_shipped: >-
      Same full-stop collision as the military plate on the five-digit form,
      plus a variable digit count. Danish Wikipedia describes a blue ground with
      orange characters, the agency's own mark, then one, two, three or five
      digits denoting the vehicle's attachment, with a full stop between the
      second and third digit on the five-digit form. No instrument located.
    sources:
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia; the article cites nrpl.dk; accessed 2026-08-02"
  - id: dk-gap-municipal
    what: "Særlige kommunale nummerplader — municipal plates, incl. fire brigades"
    why_not_shipped: >-
      THE POWER IS PRIMARY BUT THE FORMAT IS NOT. BEK 663/2025 § 3, stk. 4: a
      municipality's vehicle that is exempt from registration tax under
      registreringsafgiftslovens § 2, stk. 1, nr. 3 or 4 "skal ... registreres i
      Køretøjsregisteret, men kan føre særlige kommunale nummerplader", and
      § 68, stk. 1 exempts them from the rectangular/square requirement. The
      instrument stops there: no format, no colours, no size. Danish Wikipedia
      describes a municipal coat of arms in the centre with letters and digits
      on either side, possibly beginning KF. That is not a grammar, and a
      guessed pattern would fail the round-trip honestly or pass it dishonestly.
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3, stk. 4; § 68, stk. 1; accessed 2026-08-02"
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia: municipal arms centred, alphanumerics either side, may begin KF; closed-track shadow plates beginning FF; accessed 2026-08-02"
  - id: dk-gap-royal
    what: "Kongehusets nummerplader — the royal household's plates"
    why_not_shipped: >-
      Danish Wikipedia describes a golden crown and a running number of up to
      three digits in white. No ground colour, no size, no instrument, and no
      grammar for the number. Not shipped.
    sources:
      - "https://da.wikipedia.org/wiki/Nummerplade  # secondary-wikipedia; accessed 2026-08-02"
  - id: dk-gap-heavy-bus-lorry
    what: "What plate a bus, or a lorry above 4 t, carries"
    why_not_shipped: >-
      SKAT's catalogue names only "Personbiler" and "Vare-lastbiler", and the
      vægtafgiftslov § 2 a split that the yellow and parrot plates track is
      confined to vare- and lastbiler of not more than 4 t (§§ 82 and 85). No
      source reached says which type a bus or a heavier lorry draws.
      dk-standard-1976 therefore claims `categories: [car]` and nothing more.
  - id: dk-gap-1958-and-1976-instruments
    what: "The instruments that enacted the 1 April 1958 and 1 April 1976 numbering reforms"
    why_not_shipped: >-
      Both dates are stated inside instruments that are in force or recently in
      force (see THE FOUR DATES above), but neither ENACTING instrument was
      reached, so both series carry `period_evidence: statutory-date` rather
      than `instrument-in-force`. The obstacle is concrete and worth recording
      for whoever picks this up: retsinformation.dk serves full document bodies
      only for the newer part of its corpus. Of the registreringsbekendtgørelse
      chain, BEK 1567/2007 onwards return a complete ELI XML embodiment
      (/eli/lta/{year}/{nr}/dan/xml), while BEK 1067/2005, BEK 1350/2000, BEK
      916/1997, BEK 592/1996 and BEK 18/1992 return metadata only — 1-4 KB of
      Meta with no body — and their HTML and legacy R0710.aspx URLs redirect
      into the site's single-page app. A 1976 Justitsministeriet bekendtgørelse
      is very unlikely to be in the corpus at all. Danish Wikipedia offers
      1903-1958 (one letter + up to six digits, the letter marking the amt) and
      a two-letter era from 1958; that is secondary-wikipedia and is not shipped
      as a series.
  - id: dk-gap-pre1958-county-letters
    what: "A decode table for the pre-1958 single county letter"
    why_not_shipped: >-
      The single letter WAS geographic — that much is primary by implication,
      since BEK 633/2009 § 101, stk. 2 and BEK 651/2011 § 102, stk. 2 keep
      single-letter plates lawful, and both Wikipedias describe the letter as an
      amt or city marker. But no source reached, primary or secondary,
      ENUMERATES the letters against their counties. A decode table needs rows;
      this one would have none, so none is shipped. Named for whoever resolves
      it: the enthusiast register nrpl.dk (cited by both Wikipedia articles) is
      the likeliest place a full list exists.
  - id: dk-gap-yellow-plate-date
    what: "When the yellow goods-vehicle plate was introduced"
    why_not_shipped: >-
      No Danish instrument specifies plate colours (see the header), so nothing
      dates the yellow plate. The earliest evidence reached is SKAT's own
      catalogue: the 2009 skat.dk plate pages and the 2012 poster. The series
      ships with the 1976 numbering date and a loud `period_caveat` rather than
      with a colour date it cannot support.
  - id: dk-gap-faroe-greenland
    what: "Faroe Islands (FO) and Greenland (GL) plates"
    why_not_shipped: >-
      OUT OF SCOPE BY THE INSTRUMENT'S OWN DEFINITION, not by omission. BEK
      663/2025 § 1, stk. 4: "»her i landet« om Kongeriget Danmark, bortset fra
      Færøerne og Grønland." Both have their own ISO 3166-1 codes and their own
      registers; neither is modelled in this file. English Wikipedia covers both
      inside its Denmark article, which is a trap for anyone extending this file
      rather than creating fo.yml and gl.yml.
