  # =========================================================================
  # TAXIS AND PATIENT-TRANSPORT VEHICLES — the 98/99 block. A white plate whose
  # NUMBER, not whose look, marks the class.
  # =========================================================================
  - id: dk-taxi
    class: taxi
    categories: [car, van]
    period: { start: 1976 }
    period_evidence: statutory-date
    period_caveat: >-
      As elsewhere, 1976 dates the NUMBERING guidelines the plate follows, not
      the 98/99 block itself. The block is attested by SKAT's catalogue in 2012
      and by both Wikipedias for the pre-2012 era; nothing dates its creation.
    matching: recall-only
    format:
      pattern: "LL 99 999"
      regex: '\A[A-Z]{2} ?\d{2} ?\d{3}\z'
      characters: 7
      block: "98.000-99.999"
      pattern_note: >-
        RECALL-ONLY, AND THE REASON IS A SCHEMA LIMIT WORTH RECORDING. This
        series issues only the 98.000-99.999 block, so its true grammar is
        narrower than the regex above — and that grammar cannot be written.
        The human-pattern DSL spells a digit position as "9", so a LITERAL 9
        is unspellable, and any regex fixing the leading 9 fails the
        round-trip against every pattern the DSL can express (PRD-PLATES
        §5.2). The diplomatic series escape the same trap only because their
        block starts 76/77, whose digits are not the token. `regex` is
        therefore deliberately wider than what this series issues — a match
        is a shape hit, not a taxi claim — and per PRD-PLATES §2.7 that is
        `recall-only`, which in turn forbids a `regex_strict`. The block
        lives in `format.block` and in plates/_decode/dk-serial-blocks.yml,
        where a parse API should read it.
      charset:
        basis: secondary-wikipedia
        notes: "alphabet per common.charset; the 98.000-99.999 block is primary from SKAT's catalogue"
    design:
      plate: { w: 504, h: 120, unit: mm }
      plate_variants:
        - { w: 240, h: 165, unit: mm, note: "'kvadratisk' rear plate — SKAT 'Taxa (kvadratisk)'" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: left, color: "#003399", content: eu-stars+DK, hex_basis: observed, optional: true }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 60/61 '20% (Taxi og sygetransportere)' 120x504 hvid/sort/rød 98.000-99.999; accessed 2026-08-02"
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 68, stk. 2-3 (the number rule and the series delegation this block is issued under); accessed 2026-08-02"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Denmark  # secondary-wikipedia: taxis and hire limousines retained the 98/99 block through the 2012 consolidation; accessed 2026-08-02"
    notes: >-
      SKAT does not call this a taxi plate — it calls it "20% (Taxi og
      sygetransportere)", after the reduced registration-tax rate, and the
      class therefore covers patient-transport vehicles as well as taxis and
      hire limousines. The plate is a WHITE plate: it is the NUMBER that marks
      the class, which is why it deserves a series rather than a colour note.
      It is also one of the two survivors of the 6 June 2012 consolidation —
      98/99 for this class and 76/77 for diplomats stayed put while every other
      per-kind block was merged.

  # =========================================================================
  # DIPLOMATIC AND CONSULAR — the one plate whose colour the instrument states.
