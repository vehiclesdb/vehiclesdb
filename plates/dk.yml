      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT rows 10/11 'Påhængsvogne, sættevogne og påhængsredskaber (gul)' 120x504 gul/sort 1.000-9.999; accessed 2026-08-02"
    notes: >-
      One SKAT type covers påhængsvogne, sættevogne and påhængsredskaber
      (caravans included) on a four-digit yellow plate. Registration is not
      universal: § 3, stk. 1, nr. 6 catches a non-caravan påhængsredskab only
      where "påhængsredskabets konstruktion gør det muligt at trække det med en
      højere hastighed end 30 km/t". Motorcycle trailers are NOT here — SKAT
      stocks them with the motorcycle plate (see dk-motorcycle-1976). Before
      6 June 2012 trailers were split across two blocks by kind; the decode file
      records that, tiered.

  # =========================================================================
  # TRACTORS. Two series because the digit count differs, which is the
  # sharpest evidence that the two are different registrations.
  # =========================================================================
  - id: dk-tractor-registered
    class: agricultural
    categories: [tractor, machine]
    period: { start: 2008 }
    period_evidence: instrument-in-force-start-upper-bound
    period_caveat: >-
      UPPER BOUND, as for dk-moped-large: 2008 is the commencement of BEK
      1567/2007, the oldest full text reachable, which already requires
      registration of traktorer and blokvogne. The regime is older and is not
      dated here.
    matching: strict
    format:
      pattern: "LL 999"
      regex: '\A[A-Z]{2} ?\d{3}\z'
      regex_strict: '\A[ABCDEFGHJKLMNOPRSTUVWXYZ][ABCDEFGHJKLMNPRSTUVWXYZ] ?[1-9]\d{2}\z'
      characters: 5
      charset:
        basis: secondary-wikipedia
        notes: "alphabet per common.charset; the 100-999 block is primary from SKAT's catalogue row 'Traktorer'"
    design:
      plate: { w: 240, h: 165, unit: mm }
      rows: 2
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec: hvid }
      foreground: "#000000"
      border: { color: "#C8102E", hex_basis: observed, spec: rød }
      band: { side: none }
      band_note: "NO EU BAND — § 68, stk. 5, 3. pkt. puts tractors alongside mopeds and historic plates"
      emblem: { present: false }
    region_encoding: "plates/_decode/dk-serial-blocks.yml"
    region_encoding_file: dk-serial-blocks.yml
    sources:
      - "https://www.retsinformation.dk/eli/lta/2025/663/dan/xml  # § 3, stk. 1, nr. 2 and stk. 2; § 68, stk. 5; accessed 2026-08-02"
      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 6 'Traktorer' 165x240 hvid/sort/rød 100-999; accessed 2026-08-02"
    notes: >-
      THE THREE-DIGIT TRACTOR PLATE. Distinguished from dk-tractor-approved by
      digit count alone, which is the point: a Danish tractor number of three
      digits is a registered tractor and a five-digit one is a godkendt
      traktor. § 3, stk. 2 sends tractors and blokvogne down two different
      routes by reference to §§ 3 and 4 of lov om registrering af køretøjer —
      some need no registration at all, others must be registered "som
      godkendt". Historical curiosity with a primary source: BEK 651/2011 § 102
      keeps alive "nummerplader af den tidligere anvendte cirkulære type" on
      approved tractors and sidecars, so a genuinely ROUND Danish plate is
      lawful on the road and has no replacement path (§ 102, stk. 3).

