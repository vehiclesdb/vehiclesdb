      - "https://web.archive.org/web/20170917063422/https://www.skat.dk/getFiles.aspx?Id=e6c2c7e8-e7a7-4b5e-b15e-4b67e27d3f66&name=planche_nummerplader_2012.pdf  # SKAT row 27 'Traktorer - Godkendt (hvid)' 165x240 hvid/sort/rød 10.000-75.999 og 78.000-97.999; accessed 2026-08-02"
