  - id: eg-transport-2008
    class: standard
    categories: [truck, van, trailer, tractor, machine]
    period: { start: 2008 }
    period_evidence: enabling-instrument
    period_note: "as eg-standard-2008 — Law 121/2008, an enabling-instrument date"
    matching: recall-only
    matching_note: "as eg-standard-2008: no instrument prints the mask, and the regex unions the governorate shapes"
    format:
      pattern: "9999 LLL"
      regex: '\A\d{3,4} ?[A-Z]{2,3}\z'
    design:
      band: { side: top, content: "red band bearing EGYPT / emblem / مصر" }
      band_color_words: "red (النقل / goods transport) — Mint class label «ترخيص نقل»"
      band_color_observed: "RGB ~DC2804 sampled from the Mint specimen JPEG — not a colour spec, see header fact 7"
      legacy_note: >-
        Decision 2777 art. 340 ثانيا put this class on a RED GROUND with WHITE
        characters at 40 x 16 cm, grouping goods transport with trailers, heavy
        equipment (الآلات under art. 30 of Law 66/1973), agricultural tractors
        and agricultural trailers. The red survives the redesign as the band
        colour; the whole-plate red does not.
    region_encoding: none
    notes: >-
      Goods transport («نقل»). Egypt treats this as a distinct licence class,
      but the PRD-PLATES §2.3 vocabulary has no term for a commercial/goods
      class, so — following `in-transport-1989` — the class stays `standard` and
      the distinction rides on `categories:`. AGRICULTURAL TRACTORS AND TRAILERS
      ARE INSIDE THIS CATEGORY under art. 340 ثانيا rather than in a separate
      agricultural series; that is the instrument's own grouping and it is not
      second-guessed here.
    sources:
      - "https://web.archive.org/web/20251010130322/https://traffic.moi.gov.eg/Arabic/OurServices/InfoServices/InteriorMinisterDecision/Pages/license-plates-taxes-traffic-fees.aspx  # Decision 2777/2000 art. 340 ثانيا — goods transport, trailers, heavy equipment, agricultural tractors and trailers on one red/white plate — accessed 2026-09-12"
      - "http://www.egyptmint.gov.eg/Home/Plates  # Mint specimen «ترخيص نقل», red band — accessed 2026-09-12"

