      - "https://upload.wikimedia.org/wikipedia/commons/d/df/Egypt_-_License_Plate_-_Motorcycle.png  # photographic/diagram: portrait plate, letters above digits — Commons 2020-03-11, accessed 2026-09-12"

  # =========================================================================
  # THE CLOSED LEGACY SERIES. This is the plate Decision 2777 art. 342 actually
  # describes, and it is the reason that article must not be read as evidence
  # about the modern plate.
  # =========================================================================
  - id: eg-legacy-2000
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2000, end: 2008 }
    period_evidence: instrument-in-force
    period_note: >-
      BOTH ENDS ARE WEAK AND BOTH SAY SO. 2000 is the date of Decision 2777, the
      instrument that DESCRIBES this plate — the za.yml `instrument-in-force`
      sense, expressly not a first-issue date; plates of this general shape are
      far older. 2008 is the introduction of the replacement design, not a
      sourced cessation of issue: no instrument states when the legacy series
      stopped being issued, and legacy plates remained valid and in circulation
      afterwards.
    matching: recall-only
    matching_note: >-
      The regex covers the NUMERIC SERIAL ONLY. The plate also prints the
      licence type and the governorate as WORDS, and those cannot be carried by
      a serial regex at all — see `notes`. A match is therefore a shape hit
      against a bare number, which is about as weak a claim as this dataset
      makes, and it is marked accordingly.
    format:
      pattern: "9999"
      regex: '\A\d{1,6}\z'
    design:
      layout: >-
        Decision 2777 art. 342, verbatim in structure: the RIGHT side carries
        the licence type, the issuing authority and the numbers IN ARABIC; the
        LEFT side carries the licence type, the numbers, and «مدلول المحافظة
        باللغة الإنجليزية» — the governorate indicator IN ENGLISH.
      background_note: "whole-plate colour by class per art. 340 — white/black passenger, red/white goods, green/black diplomatic, lemon-yellow/red customs, orange/black taxi, brown/white commercial-and-temporary, grey/white for slow-transit carts, at 40 x 16 cm"
      material: "pure aluminium, not less than 1 mm, reflective (art. 342)"
    region_encoding: none
    region_encoding_mechanism: >-
      The legacy plate encoded the governorate EXPLICITLY and in Latin letters,
      not through the serial — a photographed Aswan cart plate reads «C.ASN»
      on its left side, where ASN is Aswan. No table ships: the abbreviation
      list was never located, and this series is closed.
    notes: >-
      WHAT THE SCHEMA CANNOT CARRY, RECORDED HERE INSTEAD. The legacy plate
      spelled the vehicle's activity out in words — «أجرة» «ملاكي» «نقل» «هيئة
      دبلوماسية» «شرطة» «أتوبيس خاص» «أتوبيس عام» «رحلات» «جرار زراعي» — beside
      the governorate name. Those words are part of the plate's identity but are
      not part of the SERIAL, so they appear in no pattern. They were «ألغيت
      تماما» — abolished entirely — in the 2008 design, which replaced them with
      the single word «مصر» in the band. That abolition is the clearest single
      marker of the era boundary.
    sources:
      - "https://web.archive.org/web/20251010130322/https://traffic.moi.gov.eg/Arabic/OurServices/InfoServices/InteriorMinisterDecision/Pages/license-plates-taxes-traffic-fees.aspx  # Decision 2777/2000 arts. 340 and 342 — the legacy layout, the whole-plate class colours, 40 x 16 cm, aluminium >= 1 mm — accessed 2026-09-12"
      - "https://upload.wikimedia.org/wikipedia/commons/3/3d/License_plates_of_Egypt_1129a.jpg  # photographic: a legacy Aswan plate confirming art. 342 exactly — Arabic class word + governorate + numerals right, «C.ASN» + numerals left — Commons 2019-10-21, accessed 2026-09-12"
      - "https://web.archive.org/web/20181001220455/http://www.masrawy.com/Autos/autos_news/details/2014/12/3/401710/  # press, 3 Dec 2014: the activity words were abolished entirely in the new plates and replaced by «مصر» — accessed 2026-09-12"
