    categories: [car, van, truck, bus]
    period: { start: 2008 }
    period_evidence: secondary-first-issue
    period_evidence_note: >-
      Weaker than the civilian series above. Decision 2777 art. 340 has NO grey
      category at all — it files government and governorate vehicles under the
      white passenger class — so the grey band is known only from the Egyptian
      Mint's specimen. The 2008 start is inherited from the redesign, not
      independently sourced for this class.
    matching: recall-only
    format:
      pattern: "9999 LLL"
      regex: '\A\d{3,4} ?[A-Z]{2,3}\z'
    design:
      band: { side: top, content: "grey band bearing EGYPT / emblem / مصر" }
      band_color_words: "grey (الحكومة / government) — Mint class label «ترخيص حكومه»"
      band_color_observed: "RGB ~A29E9B sampled from the Mint specimen JPEG"
    region_encoding: none
    notes: "Civil government and governorate fleets. One of four modern classes (with tourism, police and on-call) that have NO counterpart in Decision 2777 — evidence that the 2008 redesign re-cut the class list and that the un-updated regulation cannot be used to enumerate it."
    sources:
      - "http://www.egyptmint.gov.eg/Home/Plates  # Mint specimen «ترخيص حكومه», grey band — the only source for this class — accessed 2026-09-12"

