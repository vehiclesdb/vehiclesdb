  - id: eg-diplomatic-2008
    class: diplomatic
    categories: [car, van]
    period: { start: 2008 }
    period_evidence: enabling-instrument
    period_note: "Law 121/2008 as for the civilian series; the green diplomatic colour itself long predates it — art. 340 ثالثا gave diplomatic and consular vehicles a green ground with black characters."
    matching: recall-only
    matching_note: >-
      No instrument prints this mask either. Unlike the civilian series the
      regex here is not a union across governorates — it is a single shape on
      secondary and photographic evidence — but the reason for recall-only is
      the same and the stronger one: the grammar is not in any instrument.
    format:
      # DIGITS IN BOTH GROUPS — the diplomatic series carries no letters at all,
      # which is why its pattern cannot be shared with the civilian ones.
      pattern: "999 99"
      regex: '\A\d{3} ?\d{2}\z'
    design:
      band: { side: top, content: "green band bearing EGYPT / emblem / مصر" }
      band_color_words: "green (الدبلوماسي / diplomatic) — art. 340 ثالثا «أخضر» with black characters; Mint class label «ترخيص دبلوماسى»"
      band_color_observed: "RGB ~5B9936 sampled from the Mint specimen JPEG"
    region_encoding: none
    notes: >-
      Diplomatic and consular missions. The right-hand two-digit group is
      presumably a mission or country code; NO DECODE TABLE IS SOURCED and none
      ships (V6). Decision 2777 art. 340 ثالثا treats diplomatic and consular as
      ONE category, so this file does not invent a separate consular series —
      recording a distinction the instrument does not draw would be as much an
      error as folding one it does.
    sources:
      - "https://web.archive.org/web/20251010130322/https://traffic.moi.gov.eg/Arabic/OurServices/InfoServices/InteriorMinisterDecision/Pages/license-plates-taxes-traffic-fees.aspx  # Decision 2777/2000 art. 340 ثالثا — diplomatic and consular as one category, green ground, black characters — accessed 2026-09-12"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Egypt  # secondary-wikipedia: diplomatic plates carry numbers in place of letters, ###-## — accessed 2026-09-12"
      - "https://upload.wikimedia.org/wikipedia/commons/2/21/Egypt_-_License_Plate_-_Diplomatic.png  # photographic corroboration of the all-digit shape — Commons 2020-03-11, accessed 2026-09-12"

  - id: eg-temporary-commercial-2008
    class: temporary
    categories: [car, van, truck, bus, trailer]
    period: { start: 2008 }
    period_evidence: enabling-instrument
    matching: recall-only
    format:
      pattern: "9999 LLL"
      regex: '\A\d{3,4} ?[A-Z]{2,3}\z'
    design:
      band: { side: top, content: "brown band, white text" }
      band_color_words: "brown (التجارى والمؤقت / commercial and temporary) — art. 340 سادسا «بنى» ground with «أبيض» characters; Mint class label «ترخيص مؤقت»"
      band_color_observed: "RGB ~6F5C4A sampled from the Mint specimen JPEG"
    region_encoding: none
    notes: >-
      THE CLASS THE SOURCES APPEAR TO FIGHT OVER, AND THEY DO NOT. Art. 340
      سادسا creates ONE combined category «لوحات التجارى والمؤقت» — trade licence
      and temporary licence together. A 2014 press piece reports only the
      commercial half; the Mint labels its brown specimen only the temporary
      half; English Wikipedia reports neither. See header fact 6. `class:
      temporary` is chosen because it is the half the issuing authority's own
      manufacturer names, and because the §2.3 vocabulary has `dealer` and
      `temporary` but no combined term; the commercial half is recorded here
      rather than lost.
    sources:
      - "https://web.archive.org/web/20251010130322/https://traffic.moi.gov.eg/Arabic/OurServices/InfoServices/InteriorMinisterDecision/Pages/license-plates-taxes-traffic-fees.aspx  # Decision 2777/2000 art. 340 سادسا — «لوحات التجارى والمؤقت», brown ground, white characters. NOTE the ministry's own English rendering of art. 340 omits this category entirely — accessed 2026-09-12"
      - "http://www.egyptmint.gov.eg/Home/Plates  # Mint specimen «ترخيص مؤقت», brown band with white text — accessed 2026-09-12"

  - id: eg-customs-2008
    class: temporary
    categories: [car, van, truck]
    period: { start: 2008 }
    period_evidence: enabling-instrument
    matching: recall-only
    format:
      pattern: "9999 LLL"
      regex: '\A\d{3,4} ?[A-Z]{2,3}\z'
    design:
      band: { side: top, content: "yellow band" }
      band_color_words: "lemon yellow (الجمارك والمنطقة الحرة / customs and free zone) — art. 340 رابعا «أصفر ليمونى» ground with «أحمر» characters; Mint class label «ترخيص جمرك»"
      band_color_observed: "RGB ~E6C72F sampled from the Mint specimen JPEG"
    region_encoding: none
    notes: >-
      Customs and free-zone vehicles — art. 340 رابعا covers «جمرك أجانب»
      (foreigners' customs), «جمرك مصريين» (Egyptians' customs) and «منطقة حرة»
      (free zone). ⚠ A DELIBERATE IMPRECISION, WRITTEN INTO THE ROW RATHER THAN
      SMOOTHED OVER: the PRD-PLATES §2.3 vocabulary HAS NO `customs` TERM.
      `temporary` is the nearest honest fit — these are duty-unpaid vehicles on
      time-limited authority — but it is not what the instrument calls them, and
      it collides with the genuinely temporary brown series above. The right fix
      is a vocabulary addition by PR with a definition, per §2.3; that is
      proposed in the dossier and deliberately NOT made here, because growing
      the shared vocabulary inside a data PR is the ad-hoc growth §2.3 forbids.
    sources:
      - "https://web.archive.org/web/20251010130322/https://traffic.moi.gov.eg/Arabic/OurServices/InfoServices/InteriorMinisterDecision/Pages/license-plates-taxes-traffic-fees.aspx  # Decision 2777/2000 art. 340 رابعا — customs (foreign and Egyptian) and free zone, lemon-yellow ground, red characters — accessed 2026-09-12"
      - "http://www.egyptmint.gov.eg/Home/Plates  # Mint specimen «ترخيص جمرك», yellow band — accessed 2026-09-12"

