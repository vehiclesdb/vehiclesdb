      THE CONSOLIDATED TEMPORARY PLATE. The 2022 reform did more than lengthen
      the serial: it collapsed several single-purpose categories — motorsport
      (SP), agricultural (M) and slow-vehicle (Y) — into one "I" plate. This is
      the only special series in the file whose EXISTENCE is primary-sourced
      while its FORMAT is not, and the entry is written to make that asymmetry
      visible rather than to hide it behind a confident regex.

  - id: hu-temporary-1990
    class: temporary
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 1990, end: 2022 }
    period_evidence: corroboration-only
    period_note: >-
      START is the 1990 system's start rather than a sourced first issue; END is
      the 2022-07-01 commencement, after which the "I" plate consolidated these
      categories. The individual letters' own dates were not sourced.
    matching: recall-only
    format:
      pattern: "L99999"
      regex: '\A[A-Z] ?\d{5}\z'
      pattern_note: >-
        RECALL-ONLY: a UNION over four distinct purposes that shared one shape —
        one letter and five digits. The letters and their meanings, as reported:
        E for a plate valid up to 180 days; P for trial running; Z for export,
        valid 30 days; V for customs. A match tells a consumer the string has the
        shape of a pre-2022 Hungarian temporary plate and nothing more — it
        cannot say which of the four, and it will also match unrelated
        single-letter series of the same shape.
      letters:
        evidence_tier: secondary-wikipedia
        E: "temporary, maximum 180 days"
        P: "trial running"
        Z: "export, 30 days"
        V: "customs"
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      evidence_tier: secondary-wikipedia
    region_encoding: none
    sources:
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Hungary  # secondary-wikipedia: E, P, Z and V temporary plates, one letter plus five numbers, with their validity rules. FORMAT + SCOPE. Accessed 2026-08-02"
      - "https://njt.jog.gov.hu/jogszabaly/2011-326-20-22  # PRIMARY: §§ 63 and 63/A, 'Az ideiglenes rendszámtábla' — the temporary-plate sections of the governing decree"
    notes: >-
      THE FOUR-LETTER TEMPORARY FAMILY of the 1990 system. Note the EXPORT letter
      Z in particular: Hungary, unlike Austria (plates/at.yml records that Austria
      has no export series at all and uses the green Überstellungskennzeichen
      instead), does issue a dedicated export plate, and it is one of the four
      here. Because all four share a shape, they are one recall-only series with
      a documented letter key rather than four series with identical regexes.

  # =========================================================================
  # MOPEDS.
  # =========================================================================
  - id: hu-moped-2014
    class: moped
    categories: [moped]
    period: { start: 2014 }
    period_evidence: secondary-dated
    period_note: "The secondary dates the moped plate requirement to 2014. Whether the 2022 reform changed its shape was not established — a recorded gap, and the reason the series is left open rather than closed at 2022."
    matching: recall-only
    format:
      pattern: "S LLL-99"
      regex: '\AS ?[A-Z]{3}-?\d{2}\z'
      pattern_note: >-
        RECALL-ONLY BECAUSE THE ARRANGEMENT IS INFERRED. The sourced fact is the
        CHARACTER INVENTORY — an S prefix, three letters, two digits — not the
        printed grouping. This file's pattern is its best reading of that
        inventory and the regex accepts a range of separator arrangements around
        it, so a match is a shape hit. Named as a verifier target.
    design:
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      evidence_tier: secondary-wikipedia
    region_encoding: none
    sources:
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Hungary  # secondary-wikipedia: moped plates since 2014, S plus three letters plus two numbers. PERIOD + CHARACTER INVENTORY. Accessed 2026-08-02"
    notes: >-
      HUNGARY'S MOPED PLATE, mandatory from 2014 — late by European standards
      (the Netherlands and Germany have run moped plates for decades) and worth
      recording as such. The entry is deliberately `recall-only`: the file knows
      what characters are on the plate and does not know how they are grouped,
      and saying so is more useful to a consumer than a confident regex would be.

# ---------------------------------------------------------------------------
# Described but NOT modelled — every one of these is a real reported series
# that this pass could not bound well enough to author. Listed so the next pass
# starts from a map rather than from nothing (the plates/it.yml
# `unsourced_series` shape).
# ---------------------------------------------------------------------------
unmodelled_series:
  evidence_tier: secondary-wikipedia
  source: "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Hungary  # every row below. Accessed 2026-08-02"
  reason_not_modelled: >-
    Each lacks at least one of: a start date this file could defend, a format
    whose grouping is known, or a colour. PRD-PLATES §5.3 prefers the recorded
    gap to the averaged guess, and a well-evidenced gap is a deliverable.
  rows:
    - { token: "H + letter + 4 digits", use: military, note: "the letter is reported to denote vehicle kind (A cars, B buses, N motorcycles, T trucks); a tricolour design is reported. Reported to have become HA under the 2022 system. No date at either end." }
    - { token: "R + letter + 4 digits", use: police, note: "RB reported as the common form; RR 00-49 law enforcement and RR 50-99 customs. Reported to have become RA under the 2022 system. No date at either end." }
    - { token: "MA + 4 digits", use: ambulance, note: "reported introduced 2006; no format grouping and no colour sourced, and `ambulance` is not in _meta/classes.yml — it would land as `government`, which is a judgement this file declines to make unsourced." }
    - { token: "BA", use: "prison service", note: "2022-system prefix; nothing else sourced." }
    - { token: "NA", use: "national tax and customs administration", note: "2022-system prefix; nothing else sourced." }
    - { token: "CK + 4 digits", use: "non-immunity embassy staff", note: "red on white, reported expired 2017; no start date sourced." }
    - { token: "C + letter + 4 digits", use: "foreign residents", note: "reported last issued April 2009; no start date sourced." }
    - { token: "X + letter + 4 digits", use: "rental vehicles", note: "reported discontinued July 2004. COLLIDES IN PREFIX with the X trailer block (hu-trailer-1990) but not in shape — a parse hazard worth recording." }
    - { token: "SP + 2 digits + 2 digits", use: motorsport, note: "restricted use; replaced by the general I plate in July 2022. No start date sourced." }
    - { token: "M + 6 digits", use: agricultural, note: "green on white, three-year validity; replaced by the general I plate in July 2022. No start date sourced." }
    - { token: "Y + 3 letters + 3 digits", use: "slow vehicles", note: "red on white; moved onto the normal series in July 2022. No start date sourced." }
    - { token: "OT + 4 digits", use: "old-timer, pre-2022 form", note: "the predecessor of hu-historic-2022; no start date sourced, which is why only the post-2022 form is authored." }
    - { token: "grey repeater plate", use: "bicycle-rack repeater", note: "reported from April 2017. A REPEATER plate has no class in _meta/classes.yml; adding one is a vocabulary PR (PRD-PLATES §2.3), not a data-file decision." }
