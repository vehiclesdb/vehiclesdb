    notes: >-
      HUNGARY'S GREEN PLATE, FIRST GENERATION. Introduced in October 2015 for
      pure-electric and plug-in hybrid vehicles, as a coloured ground on the
      ordinary serial rather than as a distinct serial space. Hungary is
      therefore unlike China (a distinct format for NEVs) and like Austria
      (green LETTERING on the ordinary plate, KFG § 49 Abs. 4 Z 5) in kind,
