  # =========================================================================
  # DIPLOMATIC — the one Hungarian series with a decode that is NOT geographic.
  # =========================================================================
  - id: hu-diplomatic-2017
    class: diplomatic
    categories: [car, van]
    period: { start: 2017 }
    period_evidence: secondary-dated
    period_note: >-
      The secondary dates the DT and CK series' expiry to 2017 and describes the
      CD six-digit series as the current one, which places the CD series' start at
      that changeover. No instrument was reached. The 2022 format change did NOT
      touch this series as far as any source consulted says — the diplomatic plate
      is numeric and was never part of the letter-space exhaustion that drove the
      2022 reform.
    matching: strict
    format:
      pattern: "CD 999-999"
      regex: '\ACD ?\d{3}-?\d{3}\z'
      progression:
        evidence_tier: secondary-wikipedia
        note: >-
          THE FIRST THREE DIGITS ARE A COUNTRY CODE and the last three are a rank
          or sequence within the mission — a genuine decode, but a MISSION decode
          rather than a geographic one, so it does not disturb this file's
          no-decode-table finding. Two reported points: 001 is the Holy See and
          020 the United States. The full mission-to-code mapping was NOT sourced
          and is NOT authored here; PRD-PLATES puts diplomatic decode tables at
          gate L4, and plates/fi.yml made the same call for the Finnish table.
    design:
      plate: { w: 520, h: 110, unit: mm }
      background: { color: "#4A90D9", finish: retroreflective, hex_basis: observed, note: "reported as a light blue ground; no spec value reached" }
      foreground: "#FFFFFF"
      band: { side: left, color: "#003399", content: eu-stars+H, hex_basis: observed }
      evidence_tier: secondary-wikipedia
    region_encoding: none
    sources:
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_Hungary  # secondary-wikipedia: CD plus six digits on light blue, first three digits a country code (001 Holy See, 020 United States); DT and CK expired 2017. FORMAT + COLOUR + PERIOD. Accessed 2026-08-02"
      - "https://hu.wikipedia.org/wiki/Magyarorsz%C3%A1gi_forgalmi_rendsz%C3%A1mok  # secondary-wikipedia: CD 999-999 on blue. Accessed 2026-08-02"
    notes: >-
      THE CURRENT DIPLOMATIC PLATE. Six digits behind a CD prefix, on a light blue
      ground, with the leading triple naming the sending state. Note what this
      series is NOT: it is not evidence that Hungary encodes region. The only
      Hungarian decode of any kind in this file is a decode of FOREIGN MISSIONS,
      and even that is described rather than tabulated, because the mapping was
      not sourced.

