# plates/br.yml — Brazil (PRD-PLATES gate L3, DRAFT for human verification).
#
# PASS 2 (2026-08-02, second Opus researcher over the same jurisdiction). This
# file supersedes a pass-1 draft, preserved beside it as `pass1/br.pass1.yml`
# with its own dossier. Pass 1 established the instrument chain and is where
# most of the research below comes from; pass 2 re-read every instrument text
# and changed five things, each of which is argued at the point of change:
#
#   1. LLLNLNN IS A 2018 ARRANGEMENT, NOT A 2019 ONE. Res. CONTRAN 741/2018
#      (17-09-2018) Anexo III item 1 spells it, together with the pre-Mercosul
#      shape LLLNNNN and the whole 0→A…9→J conversion table. Pass 1 credited
#      Res. 780/2019 with the first appearance. Corrected on the series and in
#      the chain below.
#   2. THE NATIVE-ALLOCATION `regex_strict` [K-Z] IS WITHDRAWN. It was an
#      entailment from Res. 969/2022 Anexo II item 2, and Res. 741/2018 Anexo
#      III item 3 contradicts it in terms. See fact 2.
#   3. NEW SERIES `br-mercosul-uf-brasao-2018` — the nine-month 2018 design
#      that carried the state flag, a coat of arms and the municipality name,
#      created by Res. 729/2018 Anexo I items 1.7-1.8.1 and killed by
#      Res. 748/2018 art. 4. The only entry here with an instrument at both
#      ends of its period.
#   4. PNU DIPLOMATIC STARTS 2008, NOT 1990. Res. 45/98's colour table has no
#      diplomatic row at all; the blue rows and the CMD/CD/CC/OI/ADM/CI codes
#      begin with Res. 231/2007, in force 1 January 2008. Draft id
#      `br-pnu-diplomatic-1990` retired for `br-pnu-diplomatic-2008`.
#   5. EVERY PNU COLOUR IS RAL-SOURCED, not observed. Res. 45/98 Anexo item 11
#      publishes the full six-colour RAL table (7001/3000/6016/9010/5019/9011),
#      which pass 1 read only in its truncated Res. 231/2007 form.
#
# EVERY format, dimension, colour, class and period claim in this file comes
# from an instrument whose TEXT WAS FETCHED AND READ, in this order of
# authority:
#
#   * Lei nº 9.503, de 23 de setembro de 1997 (Código de Trânsito Brasileiro,
#     CTB), art. 115 — the ENABLING STATUTE. It delegates the whole subject to
#     CONTRAN in one sentence, verbatim: "O veículo será identificado
#     externamente por meio de placas dianteira e traseira, sendo esta lacrada
#     em sua estrutura, obedecidas as especificações e modelos estabelecidos
#     pelo CONTRAN." (Planalto consolidated text, accessed 2026-08-02.)
#   * MERCOSUL/GMC/RES. Nº 33/14, "Patente e Sistema de Consultas sobre
#     Veículos do MERCOSUL" — the supranational instrument Brazil implements.
#   * Resolução CONTRAN nº 969, de 20 de junho de 2022 (DOU 24/06/2022,
#     Edição 118, Seção 1, p. 57; in force 1 July 2022) — THE CURRENT
#     BRAZILIAN INSTRUMENT. Its art. 64 revoked BOTH the Mercosul resolution
#     (nº 780/2019) AND the pre-Mercosul plate standard (nº 231/2007), so one
#     instrument now governs both plate systems still on Brazilian roads.
#   * Resolução CONTRAN nº 729, de 6 de março de 2018 (DOU 08/03/2018) and its
#     amendment chain (733/2018, 741/2018, 745/2018, 748/2018, 770/2018) —
#     where the Mercosul TRANSITION DATES live, and nowhere else.
#   * Resolução CONTRAN nº 741, de 17 de setembro de 2018 — the FIRST
#     instrument to spell the letter/number ARRANGEMENT "LLLNLNN" and to
#     publish the PNU→PIV character-conversion table, both in its Anexo III
#     ("REGRA DE TRANSIÇÃO PARA EMPLACAMENTOS").
#   * Resolução CONTRAN nº 780, de 26 de junho de 2019 (DOU 28/06/2019) — the
#     consolidation that re-enacted both, unchanged, as its Anexo I item 1.2
#     and Anexo II.
#   * Resolução CONTRAN nº 231, de 15 de março de 2007 (consolidated text with
#     the amendments made by nº 241/07, 309/09 and 372/11) and Resolução
#     CONTRAN nº 45/98 — the PRE-MERCOSUL standard, i.e. the one-series-back
#     layer of this file.
#
# SIX STRUCTURAL FACTS THAT SHAPE THIS FILE
#
# 1. BRAZIL RUNS TWO PLATE SYSTEMS SIMULTANEOUSLY, AND WILL FOR DECADES.
#    Res. 969/2022 art. 57, verbatim: "Os veículos em circulação que utilizem
#    a PNU poderão circular até o seu sucateamento sem necessidade de
#    substituição das placas e, a qualquer tempo, optar voluntariamente pelo
#    novo modelo de PIV de que trata esta Resolução". PNU = "Placa Nacional
#    Única", the 1990-generation plate, defined in the same Resolution
#    (art. 2 § 3) as "uma sequência de três caracteres alfabéticos e quatro
#    caracteres numéricos no padrão 'AAA-1111'". So the one-back series is
#    not history: it is a large, legally current part of the fleet that is
#    simply NOT ISSUED any more. `period.end` on those series is an ISSUANCE
#    end, never a validity end; every such series says so in its notes.
#
# 2. THE FIFTH CHARACTER IS THE SINGLE BEST ERA SIGNAL IN THE AMERICAS.
#    Res. 969/2022 Anexo II, item 1, prescribes the PNU→PIV conversion as a
#    substitution of "o antepenúltimo caractere, de número para letra"
#    (0→A, 1→B … 9→J), "Ex.: A placa anterior ABC1234 será substituída pela
#    nova placa com o padrão alfanumérico ABC1C34." Item 2 then closes the
#    loop, verbatim: "A faixa de letras de 'A' a 'J' será utilizada apenas
#    para a conversão da PNU para o novo sistema de PIV constante desta
#    Resolução, de forma a permitir a convivência entre ambos os modelos e
#    possibilitar a consulta por ambos os critérios de placas."
#    Consequence, and it is a strong one IN ONE DIRECTION ONLY: a CONVERTED
#    plate necessarily carries A–J at position 5, because the table says so and
#    leaves no other value; so from a converted plate the original PNU is
#    mechanically recoverable as plate[0,4] + (letter − 'A') + plate[5,2].
#    `br-mercosul-converted-2018` and `br-mercosul-motorcycle-converted-2018`
#    carry that sourced grammar as their `regex_strict`.
#
#    THE CONVERSE IS *NOT* SOURCED, AND PASS 2 REMOVED IT. An earlier draft of
#    this file asserted `regex_strict: \A[A-Z]{3}\d[K-Z]\d{2}\z` on the two
#    NATIVE series, reading item 2's "apenas para a conversão" as reserving
#    A–J away from native allocations. That reading is contradicted by the
#    instrument that introduced the table. Res. CONTRAN 741/2018, Anexo III
#    item 3, verbatim: "Durante todo o período de transição será utilizada
#    apenas a faixa de letras de 'A' a 'J' para o antepenúltimo caractere, de
#    forma a permitir a conversão dos emplacamentos e a convivência entre ambos
#    os modelos" — i.e. from September 2018 EVERY Brazilian Mercosul plate,
#    native or converted, took A–J at position 5. Res. 780/2019 and Res.
#    969/2022 narrowed the sentence to conversions without ever enacting a K–Z
#    rule for natives, and the observed per-UF allocation blocks still run
#    0A01→9J99 (secondary). The two readings are reconciled by the ALLOCATION,
#    not by the alphabet: native Mercosul combinations are issued out of FRESH
#    three-letter blocks that the PNU never used, so no collision with a
#    converted plate is possible even though both use A–J.
#    PRD-PLATES § 5.3 forbids averaging a disagreement, so the native series
#    carry NO `regex_strict` and the whole question is recorded here, in
#    `common.fifth_character_rule`, and as verifier target #1 in the dossier.
#    NET EFFECT FOR A CONSUMER: an A–J fifth character is NOT proof of
#    conversion; a fifth character outside A–J, if one is ever observed, IS
#    proof of a native allocation.
#
# 3. THE MERCOSUL PLATE DELETED THE ONLY NON-COLOUR CATEGORY MARKER, SO SIX
#    LEGAL CATEGORIES COLLAPSED INTO COLOUR-ONLY VARIANTS. Under the PNU,
#    Res. 231/2007 art. 1 § 1 required removable "tarjetas" carrying "a sigla
#    identificadora da Unidade da Federação e o nome do Município de registro
#    do veículo", with § 2 substituting BRASIL / the state name / the
#    diplomatic codes (CMD, CD, CC, OI, ADM, CI) for official and diplomatic
#    vehicles. The Mercosul plate has no tarjeta at all: Res. 969/2022
#    Anexo I Tabela III distinguishes Particular, Comercial (Aluguel e
#    Aprendizagem), Oficial e Representação, Diplomático/Consular, Especiais
#    and Coleção by CHARACTER COLOUR ALONE, on an identical white plate with
#    an identical LLLNLNN combination. PRD-PLATES § 2.3 is explicit that a
#    colour-only variant of the same format+period is a SUB-ENTRY, so those
#    six live in `variants:` with a `class:` flag each — while the PNU-era
#    official and diplomatic plates, whose tarjeta content differed, are
#    their own series. `common.class_map` below is the index of where each
#    legal category lives, because a class-keyed consumer needs one.
#
# 4. THERE IS NO GEOGRAPHY IN A BRAZILIAN SERIAL — TODAY IT IS RANDOM BY
#    INSTRUMENT. Res. 969/2022 Anexo I item 1.2, verbatim: "O padrão de
#    estampagem é composto de 7 (sete) caracteres alfanuméricos, em alto
#    relevo, na sequência LLLNLNN, com espaçamento equidistante e combinação
#    aleatória, distribuída e controlada pelo órgão máximo executivo de
#    trânsito da União." Two things follow. (a) "espaçamento equidistante" is
#    why the current pattern carries NO separator: the seven characters are
#    evenly spaced, there is no group. (b) "combinação aleatória" is why
#    `region_encoding: none` is a sourced claim and not an omission.
#    Under the PNU the three-letter group WAS allocated per state, but by
#    delegation, not by instrument: Res. 231/2007 art. 4, verbatim, "O Órgão
#    Maximo Executivo de Transito da União estabelecerá normas técnicas para
#    a distribuição e controle das series alfanuméricas". The resulting
#    UF→letter-range table is administrative and was NOT found published;
#    it is recorded as a gap, not guessed. What the pre-2018 plate showed of
#    geography, it showed IN WORDS on the tarjeta.
#
# 5. PERIODS ARE INSTRUMENT-DATED, AND THE ONE SOFT YEAR IS NAMED AS SOFT.
#    The Mercosul dates are primary and unambiguous: Res. 729/2018 art. 8 § 3
#    ("até 1º de setembro de 2018", first registrations / transfers /
#    replacements) → Res. 748/2018 art. 2, a per-state cronograma running from
#    Rio de Janeiro ("Até 3 de dezembro de 2018") to the last thirteen states
#    ("Até 31 de dezembro de 2018") → Res. 770/2018 art. 1 ("até 30 de junho
#    de 2019") → Res. 780/2019 art. 21 ("deverá ser implementada pelos DETRAN
#    até o dia 31 de janeiro de 2020, sendo exigida nos casos de primeiro
#    emplacamento do veículo"). The PNU's 1990 start is NOT of that quality:
#    the instrument is Resolução CONTRAN nº 742, de 31 de outubro de 1989
#    ("Dispõe sobre sistema de placas de identificação de veículos", revoked
#    by Res. 754/91), whose existence, date and title come from DENATRAN's own
#    catalogue *100 anos de Legislação de Trânsito no Brasil* (2010) and whose
#    TEXT COULD NOT BE RETRIEVED. It is recorded on the series, in terms.
#
# 6. TWO KINDS OF BRAZILIAN PLATE ARE DELIBERATELY NOT SERIES HERE, because
#    they carry no alphanumeric combination at all and a series without a
#    serial is not a series: the CTB art. 115 § 2 green-and-yellow plates of
#    the President, Vice-President and the other named authorities, and the
#    CTB art. 115 § 3 / Res. 969/2022 arts. 26-30 bronze representation
#    plates (Anexo I figures 9 and 10: "Placa em Bronze / Letras em
#    alto-relevo/dourada / Fundo Preto / Dimensões: 35 cm x 16 cm / Brasão",
#    lettered with the office — GOVERNADOR DO ESTADO, COMANDANTE DA MARINHA,
#    OFICIAL GENERAL). They are recorded in `special_plates:` instead.
#
# REGEX POLICY (identical to plates/gb.yml, plates/de.yml, plates/nl.yml):
# `format.regex` is the LINT-ROUND-TRIPPABLE regex — the lint generates
# serials from `format.pattern` (L → any A-Z, 9 → any 0-9) and requires the
# regex to accept all of them, so `regex` can never be narrower than the
# pattern's own alphabet. `format.regex_strict` carries the tighter, sourced
# form, which here is only ever the fifth-character range of Anexo II item 2.
#
# SEPARATOR NOTE (PRD-PLATES § 2.6): the CURRENT plate prints no separator
# ("espaçamento equidistante", above) and its pattern has none. The PNU does:
# Res. 969/2022 art. 2 § 3 writes the old standard as "AAA-1111", while the
# instrument that actually prescribed it (Res. 231/2007 art. 1) describes two
# groups — "o primeiro grupo composto por 3 (três) ... e o segundo grupo
# composto por 4 (quatro)" — and prescribes no separator GLYPH. The PNU
# regexes therefore spell the gap as the sanctioned separator-only class
# `[- ]?` (PRD-PLATES § 2.8, the es-consular-cc-1999 precedent), and
# `pattern` shows the canonical printed form `LLL-9999`.
jurisdiction: br
authority:
  name: SENATRAN (Secretaria Nacional de Trânsito), órgão máximo executivo de trânsito da União, Ministério dos Transportes; normative authority CONTRAN (Conselho Nacional de Trânsito)
  url: "https://www.gov.br/transportes/pt-br/assuntos/transito"
  contran_url: "https://www.gov.br/transportes/pt-br/assuntos/transito/contran"
  note: >-
    Plates are SPECIFIED nationally by CONTRAN, ISSUED by the 27 state/DF
    DETRANs, and the combination pool is "distribuída e controlada pelo órgão
    máximo executivo de trânsito da União" (Res. 969/2022 Anexo I 1.2).
    Brazil is federated for issuance but NOT for format, which is why this is
    one national file and not 27 (contrast us-*.yml, where each state legislates
    its own format).
binding: vehicle
binding_note: >-
  CTB art. 115 § 1, verbatim: "Os caracteres das placas serão individualizados
  para cada veículo e o acompanharão até a baixa do registro, sendo vedado seu
  reaproveitamento." The mark belongs to the vehicle for its whole life and may
  never be recycled onto another — the strongest statutory statement of
  vehicle-binding in this dataset. Res. 969/2022 art. 57 § 1 preserves it
  across the Mercosul conversion: the old combination is kept in the record and
  printed in the CRLV-e field "placa anterior", and both combinations remain
  queryable.

instrument:
  current:
    citation: "Resolução CONTRAN nº 969, de 20 de junho de 2022 — 'Dispõe sobre o sistema de Placas de Identificação de Veículos (PIV) registrados no território nacional'"
    made: "2022-06-20"
    published: "2022-06-24"          # DOU Edição 118, Seção 1, p. 57
    in_force: "2022-07-01"           # art. 65
    made_under: "Lei nº 9.503/1997 (CTB), art. 12, incisos I e X; art. 115"
    revokes:
      - "Resolução CONTRAN nº 231, de 15 de março de 2007 (the PNU standard)"
      - "Resolução CONTRAN nº 780, de 26 de junho de 2019 (the Mercosul standard it replaces)"
      - "Resoluções nº 493/1975, 793/1994, 32/1998, 60/1998, 88/1999, 241/2007, 275/2008, 286/2008, 309/2009, 342/2010, 372/2011, 527/2015, 670/2017, 742/2018, 786/2020, 792/2020, 887/2021; Deliberação CONTRAN nº 260/2022"
    annexes: "Anexo I (specifications), Anexo II (conversion table), Anexo III (accreditation) — published separately per art. 63; fetched from the SENATRAN site"
    sources:
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # DOU text: arts. 1-65, revocation list, in-force date"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022.pdf  # same text, SENATRAN PDF"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexos I-III: Tabelas I-VI, Figuras 1-10"
  supranational:
    citation: "MERCOSUL/GMC/RES. Nº 33/14 — 'Patente e Sistema de Consultas sobre Veículos do MERCOSUL'"
    key_articles: >-
      Art. 1: the Patente MERCOSUL is mandatory in all States Parties for
      vehicles registered for the first time from 1 January 2016. Art. 2: the
      distribution of the alphanumeric characters belongs to each State Party
      and must not coincide with any other State Party's. Annex: seven
      characters, white background, FE Engschrift at 65 mm (vehicles) /
      53 mm (motorcycles), 400x130 and 200x170 mm, blue Pantone 286 band
      30x390 / 30x196 mm, and the same six-row colour-by-use table Brazil
      transposed verbatim.
    amended_by: "MERCOSUL/GMC/RES. Nº 12/17"
    text_status: >-
      FETCHED as a scanned PDF with NO text layer; read by local OCR
      (tesseract, English model, Portuguese source) — so its wording is
      paraphrased here and never quoted as verbatim law. Every fact taken from
      it is independently carried by the Brazilian instruments, which is why
      nothing in this file depends on the OCR.
    sources:
      - "https://web.archive.org/web/20220220015017/https://www.cartillaciudadania.mercosur.int/oldAssets/uploads/54478_RES_033-2014_PT_Patente%20MERCOSUL.pdf  # GMC 33/14 (PT), scanned"
      - "https://web.archive.org/web/20220220015054/https://www.cartillaciudadania.mercosur.int/oldAssets/uploads/65491_RES_012-2017_PT_Placa%20MERCOSUL-ModifRes.33-14.pdf  # GMC 12/17 (PT), scanned"
  transition_chain:
    - { citation: "Resolução CONTRAN nº 510, de 27 de novembro de 2014", holds: "first Brazilian adoption of the Mercosul plate; art. 1 § 2 c) 'conter 7 (sete) caracteres alfanuméricos estampados em alto relevo, com combinação aleatória, a ser fornecida e controlada pelo DENATRAN' — SEVEN CHARACTERS BUT NO ARRANGEMENT; art. 6: all vehicles registered from 1 January 2016, states free to anticipate. The Anexo's sample combination is 'BRA0000', i.e. still the PNU shape.", source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao5102014.pdf" }
    - { citation: "Resolução CONTRAN nº 729, de 6 de março de 2018 (DOU 08/03/2018)", holds: "the operative Mercosul system; art. 1 § 3 III still gives only '7 (sete) caracteres alfanuméricos ... com o último caractere obrigatoriamente numeral'; art. 8 § 3 sets the first mandatory date, 1 September 2018; art. 8 caput sets full-fleet implementation by 31 December 2023.", source: "https://www.in.gov.br/en/web/dou/-/resolucao-n-729-de-6-de-marco-de-2018-5755402" }
    - { citation: "Resolução CONTRAN nº 733, de 10 de maio de 2018", holds: "stamping-company accreditation rules inserted into 729/2018.", source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7332018.pdf" }
    - { citation: "Resolução CONTRAN nº 741, de 17 de setembro de 2018", holds: "PASS-2 CORRECTION — this is the FORMAT instrument, not merely a chip amendment. Arts. 1-2 insert the SINIAV chip / QR Code provisions into 729/2018 (art. 1 §§ 6-7); art. 3 inserts ANEXO III, 'REGRA DE TRANSIÇÃO PARA EMPLACAMENTOS', which is where the Brazilian Mercosul grammar first appears: item 1 'A placa MERCOSUL terá a seguinte disposição: LLLNLNN, onde L é letra e N é número'; item 2 names the old shape 'LLLNNNN'; item 3 puts every transition-period plate on A-J at the antepenultimate character; item 4 is the ten-row 0→A…9→J conversion table with the worked example 'um veículo com a placa ABC1234 tem equivalência no Padrão Mercosul de ABC1C34'. It carries NO DATES — the transition dates are in 729/2018 art. 8 as amended by 748/2018 and 770/2018 — which is what an earlier draft's note was reaching for, but the arrangement and the conversion table ARE here, ten months before Res. 780/2019.", source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7412018.pdf" }
    - { citation: "Resolução CONTRAN nº 745, de 12 de novembro de 2018 — OR nº 742 of the same date", holds: "amends art. 1 § 4-A (the 15% size reduction). NUMBERING DISCREPANCY IN THE INSTRUMENTS THEMSELVES, recorded rather than resolved: Res. 748/2018 art. 1 cites it as 'Resolução CONTRAN nº 745, de 12 de novembro de 2018', while Res. 969/2022 art. 64 XV revokes 'nº 742, de 12 de novembro de 2018'. Neither text was fetched. Note also that a DIFFERENT Res. 742, of 31 October 1989, is the probable creator of the PNU — see br-pnu-standard-1990.", source: "cited, not fetched — discrepancy visible in the texts of Res. 748/2018 art. 1 and Res. 969/2022 art. 64 XV" }
    - { citation: "Resolução CONTRAN nº 748, de 30 de novembro de 2018", holds: "replaces art. 8 caput with a PER-STATE CRONOGRAMA: Rio de Janeiro by 3 December 2018; AM, ES, GO, PE, RO by 10 December; BA, RN, RS by 17 December; AC, AL, MA, PR, PI by 24 December; AP, CE, DF, MT, MS, MG, PA, PB, RR, SC, SP, SE, TO by 31 December 2018. This is the primary evidence that Rio de Janeiro was the first state.", source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7482018.pdf" }
    - { citation: "Resolução CONTRAN nº 770, de 20 de dezembro de 2018", holds: "replaces the cronograma with a single date, 30 June 2019.", source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7702018.pdf" }
    - { citation: "Resolução CONTRAN nº 780, de 26 de junho de 2019 (DOU 28/06/2019)", holds: "FIRST instrument to spell the arrangement — Anexo I 1.2, 'na sequência LLLNLNN'; introduces the Anexo II conversion table; art. 21 sets DETRAN implementation by 31 January 2020 for first registrations; art. 22 lets PNU plates run to scrapping.", source: "https://www.in.gov.br/en/web/dou/-/resolucao-n-780-de-26-de-junho-de-2019-179414765" }
  previous_standard:
    citation: "Resolução CONTRAN nº 231, de 15 de março de 2007 (republished DOU 21/03/2007 Seção 1 p. 30), consolidated with Resoluções nº 241/2007, 309/2009 and 372/2011 — 'Estabelece o Sistema de Placas de Identificação de Veículos'"
    in_force_from: "2008-01-01"      # art. 11, as amended by Res. 241/07
    revoked_by: "Resolução CONTRAN nº 969/2022 art. 64, VI"
    predecessors: "Res. 45/98 (21 May 1998, itself revoking Res. 754/91, 755/91, 813/96 and 09/98); Res. 99/99 (extending the national re-plating deadline to 31 December 1999); and, before them, Res. 742/1989 — see the pnu series notes"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # DENATRAN consolidated text of Res. 231/2007 with 241/07, 309/09, 372/11"
      - "https://web.archive.org/web/20070421095524/http://www.denatran.gov.br/download/Resolucoes/RESOLUCAO_231.pdf  # original 2007 text as first published"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao045_98.zip  # Res. 45/98 (Word), art. 1 and the 1998-99 national re-plating"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao099_99.doc  # Res. 99/99: substitution deadline moved to 31 December 1999"
  enabling_statute:
    citation: "Lei nº 9.503, de 23 de setembro de 1997 (Código de Trânsito Brasileiro), art. 115"
    source: "https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm  # art. 115 caput and §§ 1, 2, 3, 5, 6, 9; art. 12 I and X"
    licence: >-
      Brazilian official acts are outside copyright by statute — Lei nº 9.610/1998
      art. 8º, IV excludes "os textos de tratados ou convenções, leis, decretos,
      regulamentos, decisões judiciais e demais atos oficiais" from protection.
      CONTRAN resolutions are atos oficiais. NOTE the one exception encountered:
      DENATRAN's compilation *100 anos de Legislação de Trânsito no Brasil*
      (2010) asserts "É totalmente proibida a reprodução total ou parcial deste
      material" — only the official ACT titles and dates are taken from it here,
      never its editorial text.

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts, cited once and referenced per series.
