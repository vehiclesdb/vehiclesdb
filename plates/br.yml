common:
  serial_grammar_current:
    arrangement: LLLNLNN
    quote: >-
      "O padrão de estampagem é composto de 7 (sete) caracteres alfanuméricos,
      em alto relevo, na sequência LLLNLNN, com espaçamento equidistante e
      combinação aleatória, distribuída e controlada pelo órgão máximo
      executivo de trânsito da União." / "1.2.1 O caracter 'L' refere-se à
      letra, e o caracter 'N' refere-se ao numeral."
    charset: "A-Z and 0-9; no letter is excluded by any instrument read — Brazil publishes no vowel/lookalike exclusion, unlike NL, GB and several US states"
    source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I 1.2, 1.2.1"
  fifth_character_rule:
    sound_direction: >-
      CONVERTED ⇒ A-J. Anexo II's table maps 0→A … 9→J and offers no other
      value, so a plate that replaced a PNU registration always carries A-J at
      position 5 and its original PNU is plate[0,4] + (letter − 'A') +
      plate[5,2]. This is the direction `regex_strict` encodes, on
      br-mercosul-converted-2018 and br-mercosul-motorcycle-converted-2018.
    unsound_direction: >-
      A-J ⇏ CONVERTED. Res. 741/2018 Anexo III item 3 put EVERY transition-period
      plate on A-J; Res. 780/2019 and 969/2022 narrowed the sentence to
      conversions but never enacted a range for native allocations; and the
      observed per-UF blocks still run 0A01→9J99. Native and converted plates
      are kept apart by the THREE-LETTER BLOCK (natives are issued out of blocks
      the PNU never used), not by the fifth character. No K-Z claim is made
      anywhere in this file — an earlier draft made one and pass 2 removed it.
    quote_current: >-
      Res. 969/2022 Anexo II item 2: "A faixa de letras de 'A' a 'J' será
      utilizada apenas para a conversão da PNU para o novo sistema de PIV
      constante desta Resolução, de forma a permitir a convivência entre ambos
      os modelos e possibilitar a consulta por ambos os critérios de placas."
    quote_2018: >-
      Res. 741/2018 Anexo III item 3: "Durante todo o período de transição será
      utilizada apenas a faixa de letras de 'A' a 'J' para o antepenúltimo
      caractere, de forma a permitir a conversão dos emplacamentos e a
      convivência entre ambos os modelos."
    example: "ABC1234 (PNU) → ABC1C34 (PIV) — the worked example given by Res. 741/2018 Anexo III item 4.1 and repeated by Res. 969/2022 Anexo II item 1"
    source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo II items 1 and 2, and the worked example"
    source_2018: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7412018.pdf  # Anexo III items 1-4.1"
    observed_blocks: "SECONDARY (pt.wikipedia 'Placas de identificação de veículos no Brasil', accessed 2026-08-02): per-UF Mercosul sequences 'todas as sequências se iniciam em 0A01 e terminam em 9J99', and the Rio de Janeiro commemorative block RIO0A01-RIO9J99 opened in September 2018. Tagged secondary; it corroborates the 741/2018 reading and is not itself relied on for any regex."
  colour_by_use:
    note: >-
      Res. 969/2022 Anexo I Tabela III fixes the CHARACTER colour by the
      vehicle's use, on an otherwise identical white plate. The hexes below are
      nominal sRGB renderings of the Pantone Coated values the instrument
      names; the instrument itself specifies Pantone and, for the retro-
      reflective film, CIE 1964 chromaticity boxes (Tabela V) — never a hex.
      Every `hex_basis: pantone-converted` in this file means exactly that.
    table:
      - { use: "Particular", colour: "Preta", spec: "-", hex: "#000000" }
      - { use: "Comercial (Aluguel e Aprendizagem)", colour: "Vermelha", spec: "Pantone Fórmula Sólido Brilhante 186C", hex: "#C8102E" }
      - { use: "Oficial e Representação", colour: "Azul", spec: "Sólido Brilhante 286C", hex: "#0033A0" }
      - { use: "Diplomático/Consular (Missão Diplomática, Corpo Consular, Corpo Diplomático, Organismo Consular e/ou Internacional e Acordo Cooperação Internacional)", colour: "Dourada", spec: "Pantone Fórmula Sólido Brilhante 130C", hex: "#F2A900" }
      - { use: "Especiais (Experiência / Fabricantes de veículos, peças e implementos)", colour: "Verde", spec: "Pantone Fórmula Sólido Brilhante 341C", hex: "#007A53" }
      - { use: "Coleção (uso no âmbito do Mercosul)", colour: "Cinza Prata", spec: "Swop Pantone Grey", hex: "#8C8C8C" }
      - { use: "Coleção (uso restrito em território nacional)", colour: "Branco", spec: "-", hex: "#FFFFFF" }
    source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III"
  security_elements_current:
    band: "blue Pantone 286 strip on the upper margin, 30 mm high, 390 mm (vehicles) / 196 mm (two- and three-wheelers) long, carrying the MERCOSUL logo left, the Brazilian flag right and BRASIL voided in white at centre"
    flag: "28x20 mm (vehicles) / 23x16 mm (two-wheelers), upper-right, 4 mm from the top and right edges, rounded corners, 1 mm white border"
    emblem: "official MERCOSUL emblem, Pantone blue 286 + green 347, 32x22 mm (vehicles) / 25x20 mm (two-wheelers), left edge at 15 mm"
    distinguishing_sign: "'BR' in Gill Sans, black, heat-applied or printed in the lower-left corner (white on the national-only collector plate)"
    watermark: "MERCOSUL emblem in circular form inside the retroreflective film, repeating every 72 mm"
    qr_code: "16-22 mm square, indelible, upper-left below the blue band; per art. 3 the QR Code IS the electronic seal and replaces the physical lacre of CTB art. 115"
    microtext: "the words 'MERCOSUR BRASIL MERCOSUL' printed over the characters in Gill Sans at 5 mm, in the per-use Pantone of Tabela VI (447C particular, 187C comercial, 288C oficial, 131C diplomático, 342C especiais, Warm Grey 11C coleção)"
    source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I 1.1, 2.3.2, 2.3.4, 3.1-3.5, Tabela II, Tabela VI, Figuras 2-6"
  fonts:
    current_serial: { name: "FE Engschrift", height_mm: { vehicles: 65, two_wheelers: 53 }, stroke: "proportional to the typeface standard", source: "Res. 969/2022 Anexo I 2.4.1" }
    current_country_name: { name: "Gill Sans Standard Bold Condensed 50 Interletrado", source: "Res. 969/2022 Anexo I 2.4.2" }
    pnu_serial: { name: "Mandatory", source: "Res. 231/2007 Anexo item 4 — 'A Tipologia dos caracteres das placas e tarjetas devem seguir o modelo abaixo especificado na fonte: Mandatory'" }
    licence_posture: >-
      Both current fonts are NAMED third-party typefaces, which is unusual —
      most surveyed jurisdictions prescribe a statutory drawing (PRD-PLATES
      § 6). Neither instrument grants any licence. The render layer must
      therefore derive glyphs from the instrument's own figures and the
      published character-width tables (Res. 231/2007 Anexo item 2 gives a full
      per-character advance-width table in mm for the PNU), never from a
      third-party FE-Schrift or Gill Sans binary.
  class_map:
    note: >-
      Where each legal issuance category lives in this file. PRD-PLATES § 2.3
      sends colour-only variants to `variants:`; Brazil's current system makes
      six categories colour-only, so a class-keyed consumer must read variants.
    current:
      standard: "series br-mercosul-standard-2018 / br-mercosul-converted-2018 (black characters, Particular); br-mercosul-uf-brasao-2018 for the 2018-only design that additionally carried the state flag, arms and municipality name"
      motorcycle: "series br-mercosul-motorcycle-2018 / br-mercosul-motorcycle-converted-2018"
      taxi: "variant 'aluguel-aprendizagem' (red characters) on the standard and motorcycle series"
      government: "variant 'oficial-representacao' (blue characters)"
      diplomatic: "variant 'diplomatico-consular' (gold characters)"
      consular: "variant 'diplomatico-consular' (gold characters) — Brazil issues one gold class for both"
      dealer: "variant 'especiais-experiencia-fabricante' (green characters) — PIV-Exp, Res. 969/2022 arts. 39-49"
      historic: "variant 'colecao-mercosul' (silver-grey characters) for Mercosul-wide circulation; series br-mercosul-collection-national-2022 for the black national-only plate"
    previous:
      standard: "series br-pnu-standard-1990 (grey plate) + its colour variants"
      government: "series br-pnu-official-1990 (white plate, BRASIL / state / municipality tarjeta)"
      diplomatic: "series br-pnu-diplomatic-2008 (blue plate, CMD/CD/CC/OI/ADM/CI tarjeta)"
      motorcycle: "series br-pnu-motorcycle-1990 (187x136 mm) and br-pnu-motorcycle-2012 (200x170 mm)"

special_plates:
  note: >-
    Brazilian plates that carry NO alphanumeric combination, and therefore no
    `format.pattern`/`format.regex` and no series record. Recorded here so the
    jurisdiction-completeness detector does not read their absence as a gap.
  presidential_and_high_authority:
    basis: "CTB art. 115 § 2"
    quote: >-
      "As placas com as cores verde e amarela da Bandeira Nacional serão usadas
      somente pelos veículos de representação pessoal do Presidente e do
      Vice-Presidente da República, dos Presidentes do Senado Federal e da
      Câmara dos Deputados, do Presidente e dos Ministros do Supremo Tribunal
      Federal, dos Ministros de Estado, do Advogado-Geral da União e do
      Procurador-Geral da República."
    source: "https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm  # art. 115 § 2"
  representation_bronze:
    basis: "CTB art. 115 § 3; Res. 969/2022 arts. 26-30 and Anexo I Figuras 9-10"
    spec: "Placa em Bronze; letters in gold high relief; black ground; 350 x 160 mm; coat of arms in official colours or in bronze. Lettered with the office (e.g. GOVERNADOR DO ESTADO, COMANDANTE DA MARINHA, COMANDANTE DA AERONÁUTICA, OFICIAL GENERAL, and the Secretários de Estado do Governo Federal model of Figura 10). The vehicle is separately registered in RENAVAM (art. 28) and carries ordinary PIV as well."
    source: "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Figuras 9 and 10 + INFORMAÇÕES COMPLEMENTARES"
  military:
    basis: "CTB art. 115 § 5, verbatim: 'O disposto neste artigo não se aplica aos veículos de uso bélico.'"
    note: "Armed-forces vehicles of war are excluded from the CTB plate regime altogether, so their identification (EB/FAB/MB registration systems) is set by the services, not by CONTRAN, and is out of scope for this file. Res. 969/2022 art. 30 covers only the bronze REPRESENTATION plates of the service Commanders and Oficiais Generais."
    source: "https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm  # art. 115 § 5"
  judicial_protected:
    basis: "CTB art. 115 § 7 (Incluído pela Lei nº 12.694, de 2012)"
    note: "Judges and prosecutors with criminal jurisdiction may TEMPORARILY carry special plates that defeat identification, under a joint CNJ/CNMP/CONTRAN regulation. No format is published, by design; not modelled."
    source: "https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm  # art. 115 § 7"

series:

  # =========================================================================
  # CURRENT — PLACA DE IDENTIFICAÇÃO VEICULAR (PIV), MERCOSUL PATTERN.
  # Res. 969/2022 (in force 1 July 2022), continuing the system created by
  # Res. 729/2018 and specified as LLLNLNN by Res. 780/2019.
  # =========================================================================
  - id: br-mercosul-standard-2018
    class: standard
    categories: [car, van, truck, bus, trailer, semitrailer]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      charset:
        letters: "A-Z, no exclusions published"
        fifth_character: >-
          NO NARROWING IS ASSERTED, and the absence is sourced. Res. 741/2018
          Anexo III item 3 put EVERY transition-period plate on A-J at this
          position; Res. 780/2019 and Res. 969/2022 Anexo II item 2 reserve A-J
          "apenas para a conversão" without enacting any range for native
          allocations. Natively-allocated blocks are observed running 0A01 to
          9J99 (secondary), which is consistent with the 741/2018 reading and
          inconsistent with a K-Z rule. See the file header, fact 2, and
          `common.fifth_character_rule`. A `regex_strict` here would be an
          inference, so there is none.
      progression: >-
        "combinação aleatória, distribuída e controlada pelo órgão máximo
        executivo de trânsito da União" (Anexo I 1.2). There is no published
        allocation order and no geographic block: a Brazilian PIV combination
        carries no state, city or date information of its own. The only
        inference the combination supports is the fifth-character one.
    design:
      plate: { w: 400, h: 130, unit: mm, tolerance_mm: 2 }
      plate_variants:
        - { note: "up to 15% reduction permitted where the plate does not fit the vehicle's homologated receptacle (Anexo I 2.1.2)" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#000000"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, w: 390, unit: mm, content: "MERCOSUL emblem (left) + BRASIL voided white (centre) + Brazilian flag (right)" }
      emblem: { present: true, rendered: placeholder, note: "MERCOSUL emblem per DEC CMC nº 17/02 corporate identity manual; national flag; PRD-PLATES § 3 placeholder rule applies until the emblem licence is affirmatively cleared" }
      characters: { height_mm: 65, font: "FE Engschrift", relief: "alto relevo", process: "hot stamp thermal film, non-retroreflective, non-diffractive, overprinted with the words MERCOSUR BRASIL MERCOSUL at 5 mm" }
      material: { substrate: "non-galvanised aluminium 1 mm ± 0.2", film: "microprismatic or microspherical retroreflective, ISO 7591:1982 tested, ASTM E-810 measured" }
      rear_differs: false
      note: "front and rear plates are identical; trailers, semi-trailers, two- and three-wheelers, quadricycles and cranes carry the rear plate only (art. 2 § 1)"
    region_encoding: none
    variants:
      - class: taxi
        name: aluguel-aprendizagem
        design: { foreground: "#C8102E", hex_basis: pantone-converted, note: "Pantone Fórmula Sólido Brilhante 186C; micro-inscriptions Pantone 187C" }
        note: >-
          "Comercial (Aluguel e Aprendizagem)" — hire vehicles (taxis, ride-hail,
          rental) AND driving-school vehicles share one red-character category.
          Colour-only variant of this series per PRD-PLATES § 2.3: same plate,
          same LLLNLNN combination, same period. Under the PNU these were two
          DIFFERENT designs (red ground / white ground, see br-pnu-standard-1990
          variants) — the Mercosul plate merged them.
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III row 2, Tabela VI row 2"
      - class: government
        name: oficial-representacao
        design: { foreground: "#0033A0", hex_basis: pantone-converted, note: "Sólido Brilhante 286C; micro-inscriptions Pantone 288C" }
        note: >-
          "Oficial e Representação" — federal, state and municipal fleets, and
          the ordinary plates of representation vehicles. Colour-only variant.
          The BRONZE representation plate of CTB art. 115 § 3 is a different
          object entirely and is recorded in `special_plates`.
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III row 3"
      - class: diplomatic
        name: diplomatico-consular
        design: { foreground: "#F2A900", hex_basis: pantone-converted, note: "Pantone Fórmula Sólido Brilhante 130C; micro-inscriptions Pantone 131C" }
        note: >-
          One gold-character category covers Missão Diplomática, Corpo Consular,
          Corpo Diplomático, Organismo Consular e/ou Internacional and Acordo de
          Cooperação Internacional (Res. 969/2022 art. 6º VIII and art. 31).
          Registration requires an authorisation from the Cerimonial do
          Ministério das Relações Exteriores (art. 32). DECODE LOSS WORTH
          RECORDING: the PNU carried a two- or three-letter tarjeta code
          (CMD/CD/CC/OI/ADM/CI) that told you WHICH corps; the Mercosul plate
          does not, so the sub-category is no longer readable off the plate.
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III row 4"
          - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # arts. 6º VIII, 31-34 (who qualifies, MRE authorisation, annual licensing)"
      - class: dealer
        name: especiais-experiencia-fabricante
        design: { foreground: "#007A53", hex_basis: pantone-converted, note: "Pantone Fórmula Sólido Brilhante 341C; micro-inscriptions Pantone 342C" }
        note: >-
          Green characters cover BOTH special plates: PIV-Exp (trade plates for
          establishments that repair, buy, sell or dismantle vehicles, CTB
          art. 330; circulation restricted to the issuing state, art. 42) and
          PIV-Fab (manufacturer/bodybuilder test plates, arts. 35-38, valid
          without geographic or time restriction). Class `dealer` is the closest
          entry in _meta/classes.yml; the manufacturer half has no exact class.
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III row 5"
          - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # arts. 6º III-IV, 35-49"
      - class: historic
        name: colecao-mercosul
        design: { foreground: "#8C8C8C", hex_basis: observed, note: "the instrument says only 'Cinza Prata / Swop Pantone Grey', which has no single sRGB definition — hex is an observation, flagged" }
        note: >-
          Collector vehicles circulating Mercosul-wide keep the white plate with
          silver-grey characters. Collector vehicles "classificados como
          originais" may instead take the BLACK national-only plate, which is a
          different design and therefore its own series
          (br-mercosul-collection-national-2022).
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III row 6, Tabela VI row 6"
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I 1.1, 1.2 (LLLNLNN), 2.1 Tabela I (400x130), 2.3 (white ground, Pantone 286 band), 2.4 (FE Engschrift 65 mm), 3.1-3.5 (security elements)"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # arts. 2 (front+rear, rear-only categories), 3 (QR Code replaces the lacre), 56 (when the PIV is required)"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-n-729-de-6-de-marco-de-2018-5755402  # art. 8 § 3: PIV required for new registrations, transfers and replacements from 1 September 2018 — the period.start evidence"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7412018.pdf  # Res. CONTRAN 741/2018 of 17-09-2018, Anexo III item 1 — the FIRST instrument to spell LLLNLNN (pass-2 correction; an earlier draft credited Res. 780/2019)"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-n-780-de-26-de-junho-de-2019-179414765  # Res. 780/2019 Anexo I 1.2, which re-enacts LLLNLNN unchanged; art. 21 (31 January 2020 deadline)"
    notes: >-
      The current Brazilian standard-issue plate, black characters on white with
      the Mercosul blue band. period.start 2018 is the year the plate became
      MANDATORY for new registrations under Res. 729/2018 art. 8 § 3 ("até 1º de
      setembro de 2018"), and the year the first states issued it: the per-state
      cronograma of Res. 748/2018 art. 2 gave Rio de Janeiro until 3 December
      2018 and every other state until 31 December 2018, which is the primary
      evidence for the widely repeated "Rio de Janeiro first, 2018" claim. The
      deadline then moved twice (30 June 2019 by Res. 770/2018; 31 January 2020
      by Res. 780/2019 art. 21), so 2018-2020 is a genuine transition window in
      which BOTH systems were being issued, state by state — modelled here as
      the deliberate overlap with br-pnu-standard-1990. THE ARRANGEMENT LLLNLNN
      WAS FIRST SPELLED BY RES. CONTRAN 741/2018 (17 September 2018), Anexo III
      item 1, verbatim: "A placa MERCOSUL terá a seguinte disposição: LLLNLNN,
      onde L é letra e N é número", with item 2 naming the old shape in the same
      breath — "os demais DETRANs continuarão a emplacar no padrão pré-Mercosul,
      ou seja, LLLNNNN". (PASS-2 CORRECTION: an earlier draft of this file
      credited Res. 780/2019 with the first appearance of LLLNLNN. It is
      741/2018, ten months earlier, and the difference matters because 741/2018
      also carries the A-J rule — see the file header, fact 2.) Before
      September 2018 the instruments were genuinely looser: Res. 510/2014
      required only seven characters and Res. 729/2018 art. 1 § 3 III added only
      "com o último caractere obrigatoriamente numeral", which is why the
      2014-2018 pre-production samples in circulation show other shapes and why
      no series in this file claims a pre-2018 Mercosul format for Brazil.

  - id: br-mercosul-converted-2018
    class: standard
    categories: [car, van, truck, bus, trailer, semitrailer]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      regex_strict: '\A[A-Z]{3}\d[A-J]\d{2}\z'
      charset:
        fifth_character: "A-J only — the letter is the ENCODED FORM of the PNU's second numeral (A=0 … J=9)"
      decode:
        note: "invert the fifth character to recover the vehicle's pre-Mercosul PNU registration"
        map: { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8, J: 9 }
        worked_example: "ABC1C34 (PIV) ⇄ ABC-1234 (PNU)"
      progression: "not an allocation at all — the combination is DERIVED from the vehicle's existing PNU by a fixed one-character substitution"
    design:
      plate: { w: 400, h: 130, unit: mm, tolerance_mm: 2 }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#000000"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, w: 390, unit: mm, content: "MERCOSUL emblem + BRASIL + Brazilian flag" }
      characters: { height_mm: 65, font: "FE Engschrift" }
      rear_differs: false
      note: "physically identical to br-mercosul-standard-2018 — the difference is the origin of the combination, and it is readable in the fifth character"
    region_encoding: none
    variants:
      - class: taxi
        name: aluguel-aprendizagem
        design: { foreground: "#C8102E", hex_basis: pantone-converted }
        note: "the six colour categories of Tabela III apply to converted plates exactly as to native ones; enumerated in full on br-mercosul-standard-2018"
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III"
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo II items 1 and 2: the 0→A…9→J table, the ABC1234→ABC1C34 example, and the reservation of A-J to conversion"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # art. 2 § 4 (automatic substitution of the second numeral) and art. 57 § 1 (old combination kept in the record as 'placa anterior', both queryable)"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7412018.pdf  # Res. CONTRAN 741/2018 of 17-09-2018, Anexo III items 1, 3 and 4: LLLNLNN, the A-J rule and the 0→A…9→J conversion table with the worked example 'um veículo com a placa ABC1234 tem equivalência no Padrão Mercosul de ABC1C34' — the table's FIRST appearance, which is this series' period.start"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-n-780-de-26-de-junho-de-2019-179414765  # Res. 780/2019 art. 2 § 3 and Anexo II, which re-enact the same table"
    notes: >-
      Mercosul plates that REPLACED a PNU registration rather than being newly
      allocated. THE SOURCED CLAIM IS ONE-WAY: every converted plate carries
      A-J at position 5, because Anexo II's table produces nothing else, so
      `regex_strict` here is the authority's own grammar. It does NOT follow
      that an A-J plate is converted (file header, fact 2), so this series is a
      PROPER SUBSET of br-mercosul-standard-2018 and not an alternative to it —
      a string alone cannot decide between them, and only the letter block's
      allocation history can. PASS-2 CORRECTION: an earlier draft dated this
      series 2019 on the belief that the conversion table first appeared in
      Res. 780/2019. It first appears in Res. CONTRAN 741/2018 Anexo III item 4
      (17 September 2018), with the same ten rows and the same worked example,
      so period.start is 2018 and the draft id `br-mercosul-converted-2018` is
      retired in favour of `br-mercosul-converted-2018`. Conversion is compulsory
      only on a category change, on plate theft/loss/damage, on a change of
      municipality or state, or when a second rear plate must be fitted
      (Res. 969/2022 art. 56 § 1); otherwise it is the owner's option, at any
      time, for the life of the vehicle — so this series will keep receiving
      new members for as long as pre-2018 vehicles survive.

  - id: br-mercosul-motorcycle-2018
    class: motorcycle
    categories: [motorcycle, moped, tricycle, quadricycle]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      charset:
        fifth_character: "no narrowing asserted — the same reasoning as br-mercosul-standard-2018; see the file header, fact 2"
      progression: "random, allocated and controlled by SENATRAN (Anexo I 1.2)"
    design:
      plate: { w: 200, h: 170, unit: mm, tolerance_mm: 2 }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#000000"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, w: 196, unit: mm, content: "MERCOSUL emblem + BRASIL + Brazilian flag" }
      characters: { height_mm: 53, font: "FE Engschrift" }
      emblem: { present: true, rendered: placeholder, note: "on the motorcycle plate the MERCOSUL emblem's angle bisector coincides with the plate corner's bisector (Anexo I 3.1); flag 23x16 mm" }
      layout: two-line
      layout_basis: photographic-observed
      layout_note: >-
        The instrument fixes the plate at 200 x 170 mm and the characters at
        53 mm but does NOT spell the line arrangement, and Figura 2 is a
        dimensioned drawing with an empty character field. Seven 53 mm
        characters cannot fit on a 200 mm line, so the combination is printed
        on two lines. UPGRADED (wave-1 render pass) from "observed, not
        sourced" to photographically confirmed: an issued motorcycle plate
        reads "RJJ" on the upper row and "2J41" on the lower — Commons
        File:License plate of Brazil 04.jpg (CC BY 4.0, photographer
        Dickelbers), serial RJJ2J41. The 3+4 split this note already named
        now has a citable photograph.
      rear_differs: false
      note: "rear plate only — CTB art. 115 § 6 ('Os veículos de duas ou três rodas são dispensados da placa dianteira') and Res. 969/2022 art. 2 § 1"
    region_encoding: none
    variants:
      - class: taxi
        name: aluguel-aprendizagem
        design: { foreground: "#C8102E", hex_basis: pantone-converted }
        note: "moto-taxi and moto-boy hire registrations, and driving-school motorcycles, take the red characters of Tabela III; full colour table on br-mercosul-standard-2018"
        sources:
          - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela III"
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I Tabela I (200x170), Tabela II (band 30x196), 2.4.1.2 (53 mm), 3.1-3.2, Figura 2"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # art. 2 § 1: motocicletas, motonetas, ciclomotores, cicloelétricos, triciclos and quadriciclos carry the rear plate only"
      - "https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm  # CTB art. 115 § 6"
    notes: >-
      The Mercosul plate for two-, three- and four-wheeled light vehicles:
      same seven-character combination and same colour rules as the car plate,
      on a near-square 200 x 170 mm plate. Note the category breadth — the same
      plate serves motorcycles, motonetas, ciclomotores, cicloelétricos,
      triciclos and quadriciclos, so a Brazilian moped is NOT separately
      formatted (contrast NL and IT, where moped plates are their own grammar).
      period.start follows the same instrument chain as the car series; a
      converted motorcycle plate carries the A-J fifth character exactly as
      br-mercosul-converted-2018 does.

  - id: br-mercosul-motorcycle-converted-2018
    class: motorcycle
    categories: [motorcycle, moped, tricycle, quadricycle]
    period: { start: 2018 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      regex_strict: '\A[A-Z]{3}\d[A-J]\d{2}\z'
      charset: { fifth_character: "A-J only — the encoded second numeral of the vehicle's PNU" }
      decode:
        map: { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 6, H: 7, I: 8, J: 9 }
        worked_example: "XYZ9H88 (PIV) ⇄ XYZ-9788 (PNU)"
    design:
      plate: { w: 200, h: 170, unit: mm, tolerance_mm: 2 }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#000000"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, w: 196, unit: mm }
      characters: { height_mm: 53, font: "FE Engschrift" }
      layout: two-line
      layout_basis: observed
      rear_differs: false
    region_encoding: none
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo II items 1-2 (conversion table and the A-J reservation) + Anexo I Tabela I for the two-wheeler dimensions"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # art. 2 § 4"
    notes: >-
      The motorcycle half of the PNU→PIV conversion, kept as its own series for
      the same reason as br-mercosul-converted-2018: the fifth-character
      alphabet is a sourced grammar for THIS subset. Same one-way reading as the
      car conversion — a converted plate necessarily carries A-J, but an A-J
      plate is not necessarily converted (file header, fact 2). Draft id
      `br-mercosul-motorcycle-converted-2018` retired with its period, for the
      same Res. 741/2018 reason. No
      stronger inference is available: Brazilian motorcycles have been
      registered throughout the PNU era, and Res. 231/2007 art. 6's 2008/2012
      dates concern REFLECTIVE FILM, not registration (see
      br-pnu-motorcycle-1990).

  # -------------------------------------------------------------------------
  # THE NINE-MONTH MERCOSUL PLATE. Pass-2 addition: the assignment brief asks
  # for "state/municipality shown on plate pre-2018 (mechanism note)", and the
  # research turned up the fact that the MERCOSUL plate ALSO showed them, for
  # nine months, and lost them by a dated instrument. That is a design regime
  # with an instrument at both ends, so PRD-PLATES § 2.3 makes it a series.
  # -------------------------------------------------------------------------
  - id: br-mercosul-uf-brasao-2018
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 2018, end: 2018 }
    period_evidence: instrument-dated-both-ends
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      charset: { letters: "A-Z, no exclusions published", fifth_character: "as br-mercosul-standard-2018" }
    design:
      plate: { w: 400, h: 130, unit: mm, tolerance_mm: 2 }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: spec }
      foreground: "#000000"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, w: 390, unit: mm, content: "MERCOSUL emblem + BRASIL + Brazilian flag" }
      characters: { height_mm: 65, font: "FE Engschrift" }
      uf_flag:
        w: 26
        h: 21
        unit: mm
        position: "right edge, below the blue band"
        border_mm: 0.5
        note: >-
          Res. 729/2018 Anexo I item 1.7, verbatim: "Bandeira da Unidade da
          Federação (Figuras I e II): deverá ser inserida nas cores originais e
          aplicada por estampagem por calor com medidas de 26mm por 21mm e para
          motocicletas, motonetas, triciclos, ciclo elétricos, quadriciclos e
          ciclomotores, 21mm por 14mm, ao lado da borda direita da placa com uma
          borda preta de 0,5mm (±0,1mm) de largura."
      emblem:
        present: true
        rendered: placeholder
        max_diameter_mm: 26
        note: >-
          Item 1.8: a coat of arms, Ø 26 mm maximum, in its original colours,
          heat-applied, at the right edge below the UF flag. Item 1.7.1 assigns
          it: federal fleets the Brasão de Armas Federal; state fleets the state
          flag and state arms; municipal fleets the state flag and the MUNICIPAL
          arms. PRD-PLATES § 3 placeholder rule applies.
      municipality_legend:
        font: "Gill Sans"
        note: >-
          Item 1.8.1, verbatim: "Brasão do Município: deverá medir no máximo
          Ø 26mm e constar abaixo, o nome do Município (fonte Gill Sans),
          identificando o domicílio do registro do veículo."
      diplomatic_sigla:
        note: >-
          Item 1.7.1 d) also placed, on the plates of foreign-entity vehicles, a
          VERTICAL GOLD SIGLA in Gill Sans at 15 mm — CMD, CD, CC, OI, ADM or
          CI, the same six codes the PNU tarjeta carried. It died with the rest
          of item 1.7.1, which is why a Brazilian diplomatic plate has carried
          no textual marking of corps since December 2018.
      rear_differs: false
    region_encoding: inline
    region_encoding_note: >-
      THE ONLY BRAZILIAN PLATE SINCE 2018 THAT DECODES GEOGRAPHICALLY, and it
      does so by printing the answer rather than by encoding it: the state flag
      identified the Unidade da Federação and the legend under the arms named
      the municipality of registration in words. There is no code table to ship.
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7292018_nova.pdf  # Res. CONTRAN 729/2018 of 06-03-2018, Anexo I items 1.7 (UF flag 26x21 mm), 1.7.1 a)-d) (federal arms / state flag+arms / state flag+municipal arms / the gold CMD-CD-CC-OI-ADM-CI sigla), 1.8 (arms Ø 26 mm), 1.8.1 (municipality name in Gill Sans); accessed 2026-08-02"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7482018.pdf  # Res. CONTRAN 748/2018 of 30-11-2018 art. 4, verbatim: 'Revogar os itens 1.7, 1.7.1, 1.8 e 1.8.1 do Anexo I da Resolução CONTRAN nº 729, de 6 de março de 2018.' — the instrument that closes this series' period"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao7482018.pdf  # art. 2, the per-state December 2018 cronograma these plates were issued across, Rio de Janeiro first"
    notes: >-
      THE NINE-MONTH PLATE. Between Res. CONTRAN 729/2018 (6 March 2018) and
      Res. CONTRAN 748/2018 (30 November 2018) the Brazilian Mercosul plate
      carried, at its right edge below the blue band, the flag of the state of
      registration, a coat of arms, and beneath the arms the NAME OF THE
      MUNICIPALITY of registration. Rio de Janeiro — the first state to issue,
      from September 2018 — issued these, and so did the states that started
      before the 748/2018 timetable ran out. Res. 748/2018 art. 4 revoked all
      four Anexo I items in a single line and Brazilian plates have shown no
      geography at all since. THE PERIOD IS CLOSED BY INSTRUMENTS AT BOTH ENDS,
      which is why this is the only entry in the file carrying
      `instrument-dated-both-ends`; the calendar window inside 2018 is
      2018-03-06 to 2018-11-30, and neither boundary is inferred. Modelled as
      its own series and not as a variant because the difference is structural
      (three printed elements added and removed), not a colour swap, and because
      a consumer dating a photograph needs it: a Mercosul plate with a state
      flag on it is a 2018 artefact and nothing else. Distinct from
      br-mercosul-standard-2018, which is the design as it has stood since
      December 2018.

  - id: br-mercosul-collection-national-2022
    class: historic
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2022 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL9L99"
      regex: '\A[A-Z]{3}\d[A-Z]\d{2}\z'
      charset: { fifth_character: "both ranges occur — a collector vehicle is by definition old, so most carry the A-J converted form, but the resolution imposes no restriction" }
    design:
      plate: { w: 400, h: 130, unit: mm, tolerance_mm: 2 }
      plate_variants:
        - { w: 200, h: 170, unit: mm, note: "motorcycles, motonetas, ciclomotores, cicloelétricos, triciclos and quadriciclos — Anexo I Figura 7" }
      background: { color: "#000000", finish: non-retroreflective, hex_basis: spec }
      foreground: "#FFFFFF"
      band: { side: top, color: "#0033A0", hex_basis: pantone-converted, h: 30, unit: mm, content: "Brazilian flag (right) + BRASIL voided white (centre) — NO MERCOSUL emblem" }
      emblem: { present: true, rendered: placeholder, note: "national flag only; Anexo I 3.1 expressly forbids the MERCOSUL emblem on this plate" }
      distinguishing_sign: { text: "BR", color: "#FFFFFF", note: "white here, black on every other Brazilian plate (Anexo I 3.3)" }
      characters: { height_mm: 65, font: "FE Engschrift", note: "WITHOUT the 'MERCOSUR BRASIL MERCOSUL' micro-inscriptions, which Anexo I 2.2.3 excludes for this plate" }
      watermark: { present: false, note: "Anexo I 3.4 excludes the MERCOSUL watermark from this plate" }
      qr_code: { side_mm: "17-23", note: "slightly larger than the standard 16-22 mm, permitted by Anexo I 3.5.3 for contrast on the black ground" }
      rear_differs: false
    region_encoding: none
    sources:
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao9692022anexos.pdf  # Anexo I 1.1.1 (black film, blue band, flag right, BRASIL centre), 2.2.3, 2.3.1, 2.3.3 Tabela III last row ('Coleção (uso restrito em território nacional)' — Branco), 3.1, 3.3, 3.4, 3.5.3, Figuras 7-8"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # art. 2 § 5: collector vehicles classified as ORIGINAL may take a plate 'para uso restrito ao território nacional'"
    notes: >-
      Brazil's black plate — white characters on a black ground, blue band, no
      MERCOSUL emblem, no watermark, no micro-inscriptions, white BR — created
      by Res. 969/2022 and NOT present in Res. 780/2019, which is why
      period.start is 2022 and the evidence is the enabling instrument itself.
      It is available only to collector vehicles "classificados como originais"
      under separate CONTRAN collector rules, and the trade-off is explicit in
      the plate: dropping the Mercosul identity means the vehicle may not use
      it outside Brazil ("uso restrito ao território nacional"). Collector
      vehicles that want Mercosul-wide circulation keep the white plate with
      silver-grey characters (variant `colecao-mercosul` on
      br-mercosul-standard-2018). NOTE for the render layer: this is the only
      Brazilian plate whose background is non-retroreflective by specification.

  # =========================================================================
  # ONE SERIES BACK — PLACA NACIONAL ÚNICA (PNU), the 1990-generation plate.
  # Grammar and design from Res. 231/2007 (consolidated) and Res. 45/98;
  # still legally current on the road, no longer issued.
  # =========================================================================
  - id: br-pnu-standard-1990
    class: standard
    categories: [car, van, truck, bus, trailer, semitrailer]
    period: { start: 1990, end: 2020 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL-9999"
      regex: '\A[A-Z]{3}[- ]?\d{4}\z'
      charset:
        letters: "A-Z, no exclusions — Res. 231/2007 art. 1 defines the first group as 'o arranjo, com repetição de 26 (vinte e seis) letras, tomadas três a três', i.e. all 17,576 triples are legal"
        digits: "0-9, all 10,000 combinations — 'o arranjo, com repetição, de 10 (dez) algarismos, tomados quatro a quatro'"
      separator_note: >-
        Res. 231/2007 art. 1 prescribes two GROUPS and no separator glyph;
        Res. 969/2022 art. 2 § 3, describing the same plate 15 years later,
        writes it "AAA-1111". The regex therefore accepts hyphen, space or
        nothing at the group boundary (PRD-PLATES § 2.8 separator-only class),
        and `pattern` shows the canonical printed hyphen.
      separator_printed_form: >-
        SETTLED PHOTOGRAPHICALLY (wave-1 render pass): issued plates print a
        small SQUARE DOT between the letter and digit groups — not a hyphen,
        and not a bare gap. Close-up: Commons File:Placa de veículo Brasil
        Pernambuco-Jaboatão dos Guararapes KLV-8465 atrás.jpg (public domain,
        photographer Ralf1963) reads "KLV·8465" with the square dot clearly
        resolved. The canonical hyphen above stays the PARSE form; this field
        records the DEPICTION form, exactly as Portugal's square-dot
        settlement did (pt.yml). Evidence: photographic-observed, single
        close-up witness for the standard series; whether the official and
        diplomatic PNU faces print the same glyph is unconfirmed.
      progression: >-
        Sequential inside a three-letter block allocated to each state.
        Res. 231/2007 art. 4, verbatim: "O Órgão Maximo Executivo de Transito da
        União estabelecerá normas técnicas para a distribuição e controle das
        series alfanuméricas" — the allocation is delegated to DENATRAN and the
        resulting UF→range table was NOT found published (recorded gap; see
        `region_encoding` below and dossier-br.md § Gaps).
    design:
      plate: { w: 400, h: 130, unit: mm }
      plate_variants:
        - { note: "up to 15% length reduction where the plate does not fit the receptacle, DENATRAN-authorised (Anexo item 1 c), as amended by Res. 309/09)" }
      background: { color: "#8F999F", finish: retroreflective, hex_basis: ral-converted, spec_note: "CINZA = RAL 7001 (Silbergrau), Res. 45/98 Anexo item 11" }
      foreground: "#1C1C1C"
      band: { side: none }
      characters: { height_mm: 63, stroke_mm: 10, font: "Mandatory", relief: "alto relevo", note: "Res. 231/2007 Anexo item 2 also publishes a per-character advance-width table in mm (A=54, B=44, … I=10, … 1=18, 0=36) — a directly renderable metric set" }
      tarjeta:
        present: true
        content: "sigla da Unidade da Federação + nome do Município de registro"
        note: "removable strips riveted to both plates, sealed together with the rear plate; the ONLY geographic marking on a Brazilian plate, and it is in words, not in the serial. State DETRANs set municipality abbreviations (art. 5 § 4). Character heights 5.5-7.0 mm per Anexo item 6."
      manufacturer_code: { note: "three digits + UF sigla + last two digits of the year of manufacture, stamped in the plate colour: 8 x 30 mm on the plate, 3 x 15 mm on the tarjeta (Anexo item 7)" }
      seal: { note: "physical lacre (polyethylene or lead, min 15x15x4 mm) through braided galvanised wire, identifying the issuing DETRAN — the element the Mercosul QR Code replaced" }
      rear_differs: false
      hex_note: >-
        PASS-2 UPGRADE, from `observed` to `ral-converted` on every PNU colour.
        Res. 231/2007 Anexo item 11, as amended by Res. 372/2011, publishes RAL
        codes for the CHARACTERS only (BRANCA = RAL 9010, PRETA = RAL 9011) and
        specifies the grounds as CIE 1931 chromaticity boxes (Tabela 2) plus
        retroreflectivity minima (Tabela 1) — which is what an earlier draft of
        this file recorded. But its PREDECESSOR instrument, Res. CONTRAN 45/98,
        publishes the FULL six-colour RAL table at Anexo item 11 — CINZA 7001,
        VERMELHO 3000, VERDE 6016, BRANCA 9010, AZUL 5019, PRETA 9011 — and
        Res. 231/2007 changed none of those colour NAMES, only the instrument
        that carries them. Every PNU hex in this file is therefore a
        conventional sRGB rendering of a NAMED RAL STANDARD, and the RAL number
        is the citable fact (the sm.yml precedent: RAL publishes physical
        standards, not sRGB values). The one colour with no RAL and no Pantone
        anywhere in the chain is the Representação GOLD, which stays unsourced
        and says so.
    region_encoding:
      mechanism: >-
        NONE IN THE SERIAL, by instrument. Geography appeared on the tarjeta in
        words (UF + municipality). Separately, DENATRAN allocated three-letter
        blocks to each state under art. 4, so the letter group DOES correlate
        with the state of first registration — but that allocation table is an
        administrative act that was not found published, and it is not
        reproduced here from secondary compilations.
      table: null
      gap: "UF → three-letter-range allocation table: sought, not found in primary or authority sources (see dossier)"
    variants:
      - class: taxi
        name: aluguel
        design: { background: { color: "#AF2B1E", hex_basis: ral-converted, spec_note: "VERMELHO = RAL 3000 (Feuerrot), Res. 45/98 Anexo item 11" }, foreground: "#F6F6F6" }
        note: "'Aluguel' — hire vehicles (taxis, buses, rental): RED ground, WHITE characters. Colour-only variant of the same format and period per PRD-PLATES § 2.3."
        sources:
          - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo 5.1 colour table, row 'Aluguel'"
      - class: dealer
        name: aprendizagem
        design: { background: { color: "#F6F6F6", hex_basis: ral-converted, spec_note: "BRANCA = RAL 9010" }, foreground: "#AF2B1E" }
        note: "'Aprendizagem' — driving-school vehicles: WHITE ground, RED characters, i.e. the exact inverse of the hire plate. The Mercosul plate merged the two into one red-character category."
        sources:
          - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo 5.1, row 'Aprendizagem'"
      - class: dealer
        name: experiencia-fabricante
        design: { background: { color: "#007243", hex_basis: ral-converted, spec_note: "VERDE = RAL 6016 (Tuerkisgruen) — a TURQUOISE green, not the grass green a renderer would guess; Res. 45/98 Anexo item 11" }, foreground: "#F6F6F6" }
        note: "'Experiência/Fabricante' — trade and manufacturer test plates: GREEN ground, WHITE characters."
        sources:
          - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo 5.1, row 'Experiência/Fabricante'"
      - class: historic
        name: colecao
        design: { background: { color: "#1C1C1C", hex_basis: ral-converted, spec_note: "PRETA = RAL 9011 (Graphitschwarz) ground, CINZA = RAL 7001 characters" }, foreground: "#8F999F" }
        note: "'Coleção' — collector vehicles: BLACK ground, GREY characters. The direct ancestor of br-mercosul-collection-national-2022, which inverts the character colour to white and adds the blue band."
        sources:
          - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo 5.1, row 'Coleção'"
      - class: government
        name: representacao
        design: { background: { color: "#1C1C1C", hex_basis: ral-converted, spec_note: "PRETA = RAL 9011 ground; NO RAL OR PANTONE is published anywhere in the chain for the gold characters — that hex stays unsourced" }, foreground: "#C9A227", foreground_hex_basis: unsourced }
        note: "'Representação' — BLACK ground, GOLD characters, for representation vehicles carrying an ordinary alphanumeric combination (distinct from the bronze title plates of `special_plates`)."
        sources:
          - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo 5.1, row 'Representação'"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Res. 231/2007 consolidated: art. 1 (3 letters + 4 digits), art. 1 § 1 (tarjeta), art. 3 (colour follows category, combination does not change), art. 4 (series allocation delegated), Anexo items 1, 2, 4, 5.1, 6, 7, 8, 10, 11"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao045_98.zip  # Res. 45/98 art. 1: the same grammar, seven years earlier, in the first CTB-era plate resolution"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-contran-n-969-de-20-de-junho-de-2022-410033795  # art. 2 § 3 names it the 'Placa Nacional Única (PNU)' and gives the printed form 'AAA-1111'; art. 57: PNU plates run to scrapping"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-n-780-de-26-de-junho-de-2019-179414765  # art. 21: PIV required for first registration from 31 January 2020 — the period.end evidence"
    notes: >-
      The PNU — three letters, four digits, grey plate, black characters, a
      tarjeta naming the state and municipality — is the plate Brazil issued
      for a generation, and it is still lawfully on the road in quantity — no
      fleet share is claimed here because none was sourced. TWO PERIOD
      CAVEATS, both material. (1) period.end 2020 is an ISSUANCE end, not a
      validity end: Res. 969/2022 art. 57 lets these plates run "até o seu
      sucateamento", so a 2026 PNU sighting is entirely lawful; the end year is
      Res. 780/2019 art. 21's 31 January 2020 deadline, by which every DETRAN
      had to demand the Mercosul plate at first registration. (2) period.start
      1990 is the SOFTEST claim in this file and is flagged as such: the
      enabling instrument is Resolução CONTRAN nº 742, de 31 de outubro de 1989
      ("Dispõe sobre sistema de placas de identificação de veículos", revoked by
      Res. 754/91), whose existence, date and official title come from
      DENATRAN's own catalogue *100 anos de Legislação de Trânsito no Brasil*
      (2010) — its TEXT was not retrieved, so the file cannot show that 742/89
      is where LLL-9999 was written down. What IS held verbatim is Res. 45/98
      art. 1 (1998) and Res. 231/2007 art. 1 (2007), both prescribing exactly
      this grammar, plus Res. 45/98 art. 8 and Res. 99/99 art. 1, which ordered
      the national plate SUBSTITUTION completed by 31 December 1999 — evidence
      that the rollout ran through the whole decade rather than landing in one
      year. A verifier who pins the text of Res. 742/1989 (or of Res. 754/91)
      closes the single largest evidence gap in this jurisdiction.

  - id: br-pnu-official-1990
    class: government
    categories: [car, van, truck, bus]
    period: { start: 1990, end: 2020 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LLL-9999"
      regex: '\A[A-Z]{3}[- ]?\d{4}\z'
      charset: { note: "same grammar as the private series — the category is carried by colour and by tarjeta content, never by the combination" }
    design:
      plate: { w: 400, h: 130, unit: mm }
      background: { color: "#F6F6F6", finish: retroreflective, hex_basis: ral-converted, spec_note: "BRANCA = RAL 9010 (Reinweiss), Res. 45/98 Anexo item 11 and Res. 231/2007 Anexo item 11" }
      foreground: "#1C1C1C"
      band: { side: none }
      characters: { height_mm: 63, stroke_mm: 10, font: "Mandatory" }
      tarjeta:
        present: true
        content_rule: "federal fleet: the word BRASIL; state fleet: the name of the Unidade da Federação; municipal fleet: the UF sigla + the municipality name"
        note: "Res. 231/2007 art. 1 § 2, I-III. Official vehicles are the § 1 exception: they do NOT carry the ordinary UF+município tarjeta."
      rear_differs: false
    region_encoding:
      mechanism: "the tarjeta names the level of government and, for state and municipal fleets, the state or municipality — in words"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # art. 1 § 1 (official plates excepted from the ordinary tarjeta), art. 1 § 2 I-III (BRASIL / state name / UF + municipality), Anexo 5.1 row 'Oficial' (white ground, black characters)"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao045_98.zip  # Res. 45/98 art. 1 § 1-§ 2: the identical rule a decade earlier"
    notes: >-
      Government fleets under the PNU: a WHITE plate with black characters —
      visually the same colour pair as a private plate but on white rather than
      grey — distinguished in the field by the tarjeta, which read BRASIL for
      federal vehicles, the state's name for state vehicles, and UF + municipality
      for municipal ones. Modelled as its own series rather than a colour variant
      of br-pnu-standard-1990 because the DESIGN differs beyond colour: the
      tarjeta carries different content by instrument. CTB art. 116 separately
      allows police and public-security vehicles in reserved service to wear
      ordinary private plates, which is why an official-looking Brazilian
      vehicle may lawfully carry a grey plate. Same period caveats as
      br-pnu-standard-1990: issuance ended by 31 January 2020, validity did not.

  - id: br-pnu-diplomatic-2008
    class: diplomatic
    categories: [car, van]
    period: { start: 2008, end: 2020 }
    period_evidence: enabling-instrument   # Res. 231/2007 art. 1 § 2 IV, in force 01-01-2008
    matching: strict
    format:
      pattern: "LLL-9999"
      regex: '\A[A-Z]{3}[- ]?\d{4}\z'
      charset: { note: "the ordinary grammar; the corps is encoded on the tarjeta, not in the combination" }
    design:
      plate: { w: 400, h: 130, unit: mm }
      background: { color: "#1D5B8C", finish: retroreflective, hex_basis: ral-converted, spec_note: "AZUL = RAL 5019 (Capriblau), Res. 45/98 Anexo item 11" }
      foreground: "#FFFFFF"
      band: { side: none }
      characters: { height_mm: 63, stroke_mm: 10, font: "Mandatory" }
      tarjeta:
        present: true
        content_rule: "a corps code stamped in the upper-central part of the plate (tarjeta), REPLACING the municipality"
        codes:
          CMD: "veículos de uso dos Chefes de Missão Diplomática"
          CD: "veículos pertencentes ao Corpo Diplomático"
          CC: "veículos pertencentes ao Corpo Consular"
          OI: "veículos pertencentes a Organismos Internacionais"
          ADM: "funcionários administrativos de carreira estrangeiros de Missões Diplomáticas, Repartições Consulares e Representações de Organismos Internacionais"
          CI: "peritos estrangeiros sem residência permanente, no âmbito de Acordo de Cooperação Internacional"
        note: "closed, small, primary list — inlined per PRD-PLATES § 2.4 rather than given a _decode file"
      rear_differs: false
    region_encoding:
      mechanism: "no geography; the tarjeta encodes the CORPS instead of the municipality"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # art. 1 § 2 IV a)-f): the CMD/CD/CC/OI/ADM/CI codes verbatim; Anexo 5.1 rows 'Missão Diplomática', 'Corpo Consular', 'Organismo Internacional', 'Corpo Diplomático', 'Organismo Consular/Internacional', 'Acordo Cooperação Internacional' — all blue ground, white characters; art. 11 (in force 01-01-2008)"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/cons286.pdf  # Res. CONTRAN 286/2008 of 29-07-2008 (consolidated with 342/10) art. 1 § 2, verbatim: 'As placas de identificação dos veículos de que trata esta Resolução são as previstas na Resolução do CONTRAN nº 231/07, alterada pela Resolução nº 241/07, terão o fundo na cor azul e os caracteres na cor branca e as combinações alfanuméricas obedecerão a faixas específicas do RENAVAM distribuídas para cada unidade de federação' — the instrument that put foreign missions onto the ordinary three-letter numbering; accessed 2026-08-02"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao045_98.zip  # Res. 45/98 Anexo item 5: the 1998 colour table has FIVE rows (Particular, Aluguel, Experiência, Aprendizagem, Fabricante) and NO diplomatic row — the negative evidence for period.start 2008"
    notes: >-
      PASS-2 CORRECTION TO period.start, and it is the one period this file
      moved. An earlier draft carried this series from 1990 on the assumption
      that diplomatic vehicles entered the three-letter system with everyone
      else. They did not: Res. 45/98's colour table (Anexo item 5) has five rows
      and no diplomatic row at all, and the six blue rows plus the
      CMD/CD/CC/OI/ADM/CI tarjeta codes appear for the first time in
      Res. 231/2007 art. 1 § 2 IV, in force 1 January 2008, with Res. 286/2008
      giving foreign missions their own procedural instrument six months later.
      Before that these vehicles carried a SEPARATE format — the corps letters
      CC, CD or CMD followed by four digits — which this file does NOT model
      because no instrument for it was secured; that is a recorded gap and an
      L4 target, and the secondary account (pt.wikipedia) dates the completion
      of the migration to December 2009. The blue diplomatic plate of the PNU
      era: six colour-table rows in
      Res. 231/2007 (Missão Diplomática, Corpo Consular, Organismo
      Internacional, Corpo Diplomático, Organismo Consular/Internacional, Acordo
      Cooperação Internacional) share one design — blue ground, white characters
      — and are distinguished by the tarjeta code, which is why they are one
      series here and not six. Its own series rather than a variant of
      br-pnu-standard-1990 for the same reason as the official series: the
      tarjeta content is prescribed differently. The Mercosul plate abolished
      the tarjeta, so from 2018 the corps is no longer readable off the plate —
      the single largest decode LOSS in the Brazilian transition, recorded again
      on the `diplomatico-consular` variant of br-mercosul-standard-2018.

  - id: br-pnu-motorcycle-1990
    class: motorcycle
    categories: [motorcycle, moped, tricycle]
    period: { start: 1990, end: 2012 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "LLL-9999"
      regex: '\A[A-Z]{3}[- ]?\d{4}\z'
    design:
      plate: { w: 187, h: 136, unit: mm }
      background: { color: "#8F999F", finish: retroreflective, hex_basis: ral-converted, spec_note: "CINZA = RAL 7001 (Silbergrau), Res. 45/98 Anexo item 11" }
      foreground: "#1C1C1C"
      band: { side: none }
      characters: { height_mm: 42, stroke_mm: 6, font: "Mandatory", note: "Anexo item 3 b) also publishes the reduced per-character width table (A=36, B=30, … I=6, … 1=12, 0=24)" }
      layout: two-line
      layout_basis: observed
      rear_differs: false
      note: "rear plate only (CTB art. 115 § 6)"
    region_encoding:
      mechanism: "tarjeta with UF + municipality, as on the four-wheeled plate"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo item 3: 'motocicleta, motoneta, ciclomotor e triciclos motorizados ... a) dimensões da placa em milímetros: h = 136; c= 187; b) dimensões dos caracteres da placa em milímetros: h = 42; d = 6'"
      - "https://www.gov.br/transportes/pt-br/assuntos/transito/conteudo-contran/resolucoes/resolucao045_98.zip  # Res. 45/98 Anexo item 3: the same 187 x 136 mm plate for 'biciclos, triciclos e similares motorizados' in 1998"
    notes: >-
      The small pre-2012 Brazilian motorcycle plate, 187 x 136 mm with 42 mm
      characters — a size unique to this era; every later Brazilian two-wheeler
      plate is 200 x 170 mm. period.end 2012 is an instrument boundary, not an
      observation: Res. 372/2011 inserted Anexo item 3.1 requiring motorcycles
      "fabricados ou quando da mudança de município, a partir de 1º de janeiro de
      2012" to use the larger plate, so the small plate stopped being fitted to
      new machines at that date while remaining lawful on those already carrying
      it. Reflective film became compulsory for motorcycle plates in stages —
      hire category from 1 January 2008, other categories for machines registered
      or transferred from 1 January 2008, all remaining vehicles built from
      1 January 2012 (art. 6 and its parágrafo único, as amended by Res. 241/07
      and 372/11) — so motorcycle plates fitted before those dates were under no
      reflective-film obligation at all.

  - id: br-pnu-motorcycle-2012
    class: motorcycle
    categories: [motorcycle, moped, tricycle]
    period: { start: 2012, end: 2020 }
    period_evidence: instrument-dated-both-ends
    matching: strict
    format:
      pattern: "LLL-9999"
      regex: '\A[A-Z]{3}[- ]?\d{4}\z'
    design:
      plate: { w: 200, h: 170, unit: mm }
      background: { color: "#8F999F", finish: retroreflective, hex_basis: ral-converted, spec_note: "CINZA = RAL 7001 (Silbergrau), Res. 45/98 Anexo item 11" }
      foreground: "#1C1C1C"
      band: { side: none }
      characters: { height_mm: 53, font: "Mandatory" }
      layout: two-line
      layout_basis: observed
      rear_differs: false
      note: "rear plate only; this is the plate SIZE the Mercosul two-wheeler plate inherited unchanged"
    region_encoding:
      mechanism: "tarjeta with UF + municipality"
    sources:
      - "https://web.archive.org/web/20140815083608/http://www.denatran.gov.br/download/Consolidadas/cons231.pdf  # Anexo item 3.1 (acrescentado pela Resolução nº 372/11): 'a partir de 1º de janeiro de 2012 ... a) dimensões da placa em milímetros: h = 170; c = 200; b) Altura do corpo dos caracteres da placa em milímetros: h = 53'"
      - "https://www.in.gov.br/en/web/dou/-/resolucao-n-780-de-26-de-junho-de-2019-179414765  # art. 21: PIV required at first registration from 31 January 2020 — the period.end evidence"
    notes: >-
      The larger PNU motorcycle plate, mandatory for machines built (or moved to
      another municipality) from 1 January 2012 under Res. 372/2011. Both ends of
      this period are instrument dates: 1 January 2012 in Res. 231/2007 Anexo 3.1
      as amended, and 31 January 2020 in Res. 780/2019 art. 21. Its dimensions —
      200 x 170 mm, 53 mm characters — are exactly those the Mercosul two-wheeler
      plate then adopted, so the Brazilian motorcycle plate changed its colours,
      band and grammar in 2018-2020 without changing its size. Overlaps
      br-pnu-motorcycle-1990 at 2012 and br-mercosul-motorcycle-2018 from 2018,
      both deliberately: old stock and slow state rollouts kept all three in
      simultaneous issue.
