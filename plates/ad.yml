    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 18"

  - id: ad-giny-mecanic
    class: standard
    categories: [machine]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "9999"
      regex: '\A\d{4}\z'
      format_evidence: statutory
    design:
      plate: { w: 225, h: 115, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#E1051E"
      hex_basis: pantone-converted
      bottom_band: { h: 25, unit: mm, color: "#E1051E", note: "a 25 mm red band along the bottom carrying 'NO APTE VIA PÚBLICA' in white" }
      legend: { text: "GINY MECÀNIC", color: "#E1051E" }
      legend_warning: { text: "NO APTE VIA PÚBLICA", color: "#FFFFFF" }
