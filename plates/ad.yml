      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      CAPS DE MISSIÓ DIPLOMÀTICA — heads of diplomatic mission. White on Pantone
      2945 dark blue. The trailing letter is a STATE code, which makes this the
      only genuine decode field in the Andorran system; the code table itself
      was NOT located and is a recorded gap.
