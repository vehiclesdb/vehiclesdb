    notes: >-
      GINYS MECÀNICS — off-road machinery NOT roadworthy, and the plate says so
      on its face: a red band along the bottom reading "NO APTE VIA PÚBLICA"
      (not fit for the public highway) in white. The Reglament's own title names
      these machines, which is why it is called a regulation on plates "en
      vehicles i ginys mecànics no aptes per a la via pública". A plate that
      declares its own vehicle unfit for the road is unique in this dataset.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 19"

  # =========================================================================
  # PERSONALISED PLATES — by LAW, not by decree, and with a grammar that is a
  # constraint rather than a template.
  # =========================================================================
  - id: ad-personalized
    class: personalized
    categories: [car, van, motorcycle]
    period: { start: 2014 }
    period_evidence: instrument-in-force
    period_note: >-
      Llei 24/2014, del 30 d'octubre, BOPA núm. 67, any 2014, published
      25 November 2014. Note that Andorra puts personalised plates in a LAW
      passed by the Consell General and sanctioned by both Co-Princes, where
      San Marino uses a decree — a markedly higher instrument for the same
      subject.
    matching: recall-only
    format:
      pattern: "LL999"
      regex: '\A(?=[A-Z0-9]{2,5}\z)[A-Z]+\d*\z'
      format_evidence: statutory
      format_note: >-
        `recall-only`, because the regex is WIDER than the statutory grammar in
        one respect it cannot capture. Llei 24/2014 art. 7.1 gives a set of
        constraints rather than a template: only letters, or letters THEN digits
        in that order (a) and (c); Catalan alphabet, uppercase, unaccented (b);
        minimum 2 and maximum 5 characters (g); and — the rule the regex cannot
        express — "La matrícula de 5 caràcters ha de tenir un mínim de 2
        lletres" (h). The regex enforces the length bound and the letters-then-
        digits ordering but accepts a five-character string with only one
        letter, which (h) forbids. A match is therefore a shape hit.
      reserved_strings:
        rule: >-
          art. 7.1(i): a personalised plate may not consist only of the letters
          "MT", "CD", "CMD", "A" or "CC" followed by digits, nor of the word
          "PROVA" — i.e. it may not imitate the temporary, diplomatic, consular,
          embassy-staff or dealer series. This enumeration is what lets this
          file distinguish serial PREFIXES from LEGENDS elsewhere; see
          ad-dealer-prova.
    design:
      plate: { w: 340, h: 120, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      national_mark: { text: "AND", color: "#003399" }
      legend: { text: "PRINCIPAT D'ANDORRA", color: "#003399" }
      rear_differs: false
    region_encoding: none
    notes: >-
      PLAQUES DE MATRÍCULA PERSONALITZADA, from 2014. Two features are worth a
      consumer's attention: the grammar is a CONSTRAINT SET rather than an
      enumerated pattern list (unlike San Marino's, which was enumerated until
      2022 and then also became a constraint), and the reserved-string rule at
      art. 7.1(i) is the cleanest statutory statement in this whole dossier of
      which alphabetic markers Andorra regards as serial prefixes.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/026067/html/lo26067002.html  # Llei 24/2014, del 30 d'octubre, art. 7.1 lit. a-i"
