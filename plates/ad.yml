# plates/ad.yml — Andorra (PRD-PLATES gate L1, microstates group).
# DRAFT for verification. All primary text fetched from the BOPA document store
# (bopadocuments.blob.core.windows.net), 2026-08-02.
#
# ---------------------------------------------------------------------------
# THE INSTRUMENTS, and two corrections to the obvious assumptions
# ---------------------------------------------------------------------------
#   * Llei 12/2021, del 13 de maig, del Codi de la circulació — BOPA núm. 62,
#     any 2021, published 1 June 2021, in force three months after publication.
#     THE CODE IN FORCE. It repeals the 1999 Codi expressly. Art. 108(1):
#     "Les dimensions i les característiques de les matrícules es regulen per
#     la via reglamentària."
#   * Llei del Codi de la circulació, de 10-6-99 — BOPA núm. 40, any 1999,
#     published 13 July 1999, in force fifteen days later. REPEALED. Its
#     art. 147 is historically important because it put the PLATE CATALOGUE
#     INSIDE THE LAW: "Aquest Codi inclou el catàleg de plaques de matrícula
#     vigents a Andorra."
#   * Decret 456/2022, del 9-11-2022 — BOPA núm. 135, any 2022, published
#     15 November 2022, IN FORCE 16 NOVEMBER 2022. THE PLATE REGULATION IN
#     FORCE, and the source of nearly every design fact below.
#   * Decret del 23-02-2011 — BOPA núm. 14, any 2011, published 1 March 2011,
#     in force 2 March 2011. REPEALED, but read here because its art. 3.2 is
#     the origin of the current numbering sentence.
#   * Llei 24/2014, del 30 d'octubre, de plaques de matrícula personalitzada —
#     BOPA núm. 67, any 2014, published 25 November 2014.
#
# TWO PREMISES THAT TURN OUT TO BE WRONG, both worth stating because both are
# the natural assumption: the 1999 Codi is NOT the code in force (Llei 12/2021
# replaced it), and the 2011 Reglament is NOT the regulation in force
# (Decret 456/2022 replaced it, via Decret 265/2021).
#
# ---------------------------------------------------------------------------
# THE CENTRAL FINDING: THE 2011 INSTRUMENT DID NOT CREATE THE 2011 FORMAT
# ---------------------------------------------------------------------------
# This is the sharpest instrument-date trap in the whole microstates group,
# because here the instrument's date and the reported series start AGREE — and
# citing the instrument would still be wrong.
#
# The numbering rule, art. 3.2 of the 2011 Decret and re-enacted verbatim as
# art. 6.2 of Decret 456/2022:
#   "A les plaques de matrícula s'inscriu un grup de 5 caràcters que va des del
#    00000 fins al 99999. A continuació, la primera xifra se substitueix per una
#    lletra de la A a la Z, i es manté el caràcter numèric dels 4 darrers
#    caràcters (A0000-Z9999), sense utilitzar les lletres de l'alfabet que puguin
#    crear confusió, combinant dues lletres i tres números (AA000-ZZ999), i així
#    successivament."
#
# Read what that sentence actually does. It describes ONE CONTINUOUS SCHEME in
# three stages — five digits, then a letter plus four digits, then two letters
# plus three digits, "i així successivament" (and so on) — and the trigger for
# advancing is EXHAUSTION, not a date. The instrument does not INTRODUCE the
# lettered form; it restates a scheme that already ran. So:
#
#   * THE PRE-2011 FORMAT IS NOW ESTABLISHED FROM PRIMARY TEXT: five numeric
#     digits, 00000 to 99999. That closes the gap every secondary account
#     leaves open — none of them states the old grammar.
#   * NO INSTRUMENT ANYWHERE DATES THE FIRST A0000 PLATE. The 2011 Decret's own
#     innovations, per its exposició de motius, were the reduced plate, plastic
#     and rubber enduro/trial plates, images on the retroreflective ground, and
#     adding the "AND" distinguishing mark — NOT the lettered serial.
#   * Consequently `ad-standard-letter` is dated `agency-stated-date` from the
#     Automòbil Club d'Andorra's page, NOT `instrument-in-force` from the
#     Decret. Citing the Decret for that date would be precisely the Spanish
#     error, and it would be very easy to commit because the years coincide.
#
# ---------------------------------------------------------------------------
# THE CO-PRINCIPALITY'S PUBLICATION FORMULA, since the brief asked
# ---------------------------------------------------------------------------
# Laws are approved by the Consell General at Casa de la Vall and then
# sanctioned and promulgated JOINTLY BY BOTH CO-PRINCES before BOPA
# publication. Llei 12/2021 closes: "Nosaltres els coprínceps la sancionem i
# promulguem i n'ordenem la publicació en el Butlletí Oficial del Principat
# d'Andorra. / Emmanuel Macron, President de la República Francesa, Copríncep
# d'Andorra / Joan Enric Vives Sicília, Bisbe d'Urgell, Copríncep d'Andorra."
# REGLAMENTS carry no co-princely sanction — they are Govern decrees signed by
# the Cap de Govern. That matters for citation: the plate rules live in decrees,
# so no plate specification in this file bears a co-princely signature.
#
# ---------------------------------------------------------------------------
# SOURCING NOTE — how these URLs were obtained, and their limits
# ---------------------------------------------------------------------------
# www.bopa.ad is a JavaScript application and EVERY legacy www.bopa.ad/bopa/...
# deep link is dead, returning the app shell rather than the document. The
# citations below therefore point at BOPA's own document store, which serves
# the AS-PUBLISHED text. portaljuridicandorra.ad carries consolidated versions
# but marks them "Text refós sense caràcter oficial" — an UNOFFICIAL
# consolidation — so it is cited only for navigation, never for wording.
# Folder numbering on the blob store is `any = year - 1988`.
#
# ---------------------------------------------------------------------------
# period_evidence VOCABULARY used in this file:
#   instrument-in-force              the instrument's own commencement date
#   instrument-in-force-upper-bound  earliest instrument READ carrying it; the
#                                    true start is earlier and unreached
#   agency-stated-date               an official agency page states the date
#                                    and no instrument does
#   secondary-wikipedia              WIKIPEDIA-DERIVED (mandatory tag)
# All except `secondary-wikipedia` are values already in use across plates/*.yml.
#
# format_evidence VOCABULARY: statutory | agency-stated | secondary-wikipedia
# ---------------------------------------------------------------------------
jurisdiction: ad
authority:
  name: Govern d'Andorra, Registre de Vehicles — Decret 456/2022, del 9-11-2022, Reglament de la fabricació i la instal·lació de les plaques de matrícula
  url: "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html"
binding: vehicle
binding_note: >-
  Llei 12/2021 art. 96(1): "Per posar en circulació els vehicles de motor, els
  ciclomotors, els remolcs i els semiremolcs, cal haver-los matriculat i que
  portin les plaques de matrícula amb els caràcters que els assigni el Registre
  de Vehicles" — the characters are assigned to the VEHICLE by the Registre de
  Vehicles. No provision reserves a number to a person across vehicles.
instrument:
  code:
    citation: "Llei 12/2021, del 13 de maig, del Codi de la circulació"
    gazette: "BOPA núm. 62, any 2021"
    published: "2021-06-01"
    entry_in_force: "three months after publication (disposició final novena)"
    url: "https://bopadocuments.blob.core.windows.net/bopa-documents/033062/html/CGL20210528_13_01_20.html"
    delegation: "art. 108(1): dimensions and characteristics are regulated by reglament; art. 96(1): the Registre de Vehicles assigns the characters"
    repeals: "the Llei del Codi de la circulació of 10 June 1999 and its successive modifications, expressly"
    recorded_discrepancy: >-
      BOPA's index metadata gives publication as 1 June 2021, while the preamble
      of Decret 456/2022 refers to the law as "publicada al Butlletí Oficial del
      Principat d'Andorra del 2 de juny del 2021". A one-day disagreement
      between two official sources, recorded rather than resolved; `published`
      carries BOPA's own date.
  plate_reglament:
    citation: "Decret 456/2022, del 9-11-2022, d'aprovació del Reglament de la fabricació i la instal·lació de les plaques de matrícula en vehicles i ginys mecànics no aptes per a la via pública"
    gazette: "BOPA núm. 135, any 2022"
    published: "2022-11-15"
    entry_in_force: "2022-11-16"
    in_force_clause: "article únic: '…que entrarà en vigor l'endemà de ser publicat al Butlletí Oficial del Principat d'Andorra'"
    url: "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html"
    recorded_typo: >-
      BOPA's own sumari mistypes this decree as "Decret 456/2011, del 9-11-2022".
      The document header reads 456/2022 and that is the correct citation.
      Recorded because the erroneous form is in an official index and a verifier
      will meet it.
  chain:
    - "Decret del 23-02-2011 (base) — BOPA núm. 14/2011, published 1 March 2011, in force 2 March 2011"
    - "Correcció d'errata del 9-03-2011 — BOPA núm. 16/2011, 15 March 2011"
    - "Decret del 27-07-2011 (modifies arts. 12 and 17, adds art. 19) — BOPA núm. 49/2011, 2 August 2011"
    - "Decret del 10-12-2014 — BOPA núm. 70/2014, 16 December 2014"
    - "Decret 265/2021, del 18-8-2021 — BOPA núm. 93/2021, 31 August 2021; replaced the 2011 Reglament, itself now repealed"
    - "Decret 456/2022, del 9-11-2022 — BOPA núm. 135/2022, 15 November 2022; IN FORCE"
    - "Correcció d'errata del 30-11-2022 — BOPA núm. 142/2022, 6 December 2022"
    - "Correcció d'errata de l'1-3-2023 — BOPA núm. 33/2023, 7 March 2023"
  related:
    - "Decret 534/2022, del 14-12-2022, Reglament relatiu a la matriculació i al Registre de Vehicles — BOPA núm. 148/2022, 21 December 2022"
    - "Decret 11/2024, del 10-1-2024, Reglament de vehicles històrics — BOPA núm. 7/2024, 16 January 2024"

# ---------------------------------------------------------------------------
# Jurisdiction-wide facts.
# ---------------------------------------------------------------------------
common:
  numbering:
    rule: >-
      Decret 456/2022 art. 6.2, re-enacting art. 3.2 of the 2011 Decret verbatim:
      "A les plaques de matrícula s'inscriu un grup de 5 caràcters que va des del
      00000 fins al 99999. A continuació, la primera xifra se substitueix per una
      lletra de la A a la Z, i es manté el caràcter numèric dels 4 darrers
      caràcters (A0000-Z9999), sense utilitzar les lletres de l'alfabet que puguin
      crear confusió, combinant dues lletres i tres números (AA000-ZZ999), i així
      successivament."
    three_stages:
      - { stage: 1, grammar: "00000-99999", modelled_as: ad-standard-numeric }
      - { stage: 2, grammar: "A0000-Z9999", modelled_as: ad-standard-letter }
      - { stage: 3, grammar: "AA000-ZZ999", modelled_as: "NOT MODELLED — see below" }
    stage_three_not_modelled: >-
      The two-letter stage is PROVIDED FOR but no evidence was found that it has
      been reached, and no instrument or agency page dates it. A series with no
      start and no evidence of issuance would be a guess, so it is recorded here
      and not created. A verifier who finds a two-letter Andorran plate in
      circulation should open `ad-standard-twoletter` against this note: the
      grammar is already sourced from art. 6.2 and only the start needs
      establishing.
    rollover_is_by_exhaustion: >-
      THE CRITICAL STRUCTURAL FACT. Stages advance on EXHAUSTION, not on a date.
      The instrument writes all three stages in one sentence, in the future
      tense of an automatic process, so NO stage boundary is a legal event with
      a date attached. This is why the 2011 Decret must not be cited as the
      start of the lettered series — see the header.
    source: "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 6.2"
  alphabet:
    excluded: [I, O, Q]
    rule: >-
      Decret 456/2022 art. 6.3 makes explicit what the 2011 text left as
      "lletres de l'alfabet que puguin crear confusió": "Se suprimeixen les
      lletres I, O i Q del sistema de numeració… a fi d'evitar tota confusió amb
      els números 1 i 0, respectivament." Three letters, and the reason is given
      — I and Q for 1, O for 0. NOTE the 2011 instrument stated the PRINCIPLE
      without naming the letters, so a pre-2022 exclusion list is not sourced.
    letters: [A, B, C, D, E, F, G, H, J, K, L, M, N, P, R, S, T, U, V, W, X, Y, Z]
    count: 23
    source: "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 6.3"
  plate_layout:
    rule: >-
      Decret 456/2022 art. 6.1: "Al costat esquerre superior de la matrícula hi
      figura l'escut nacional del Principat d'Andorra. Al costat esquerre
      inferior, a sota de l'escut, hi ha el distintiu nacional 'AND' amb lletres
      de color blau. A la part inferior, sota els caràcters estampats en relleu
      de color negre mat, s'hi troba la llegenda 'PRINCIPAT D'ANDORRA' amb
      lletres de color blau."
    base: "art. 4.1: 'la base de les plaques de matrícula és d'alumini, d'un gruix d'1,35 mm'"
    tolerance: "art. 6.4: ± 0,5 mm on the plate dimensions"
    source: "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 arts. 4.1, 6.1, 6.4"
  country_sign:
    letters: "AND"
    on_plate: true
    rule: >-
      UNUSUAL AND WORTH NOTING: Andorra puts its distinguishing mark ON the
      plate, in the band below the arms, rather than relying on a separate
      oval. The 2011 Decret's exposició de motius says why, and cites the treaty:
      "s'ha incorporat l'indicatiu AND, en la forma que preveu el punt 3 de
      l'annex 3 de la Convenció sobre la circulació vial… feta l'any 1968 a
      Viena, en la versió consolidada de l'any 2006."
    legacy_rule: >-
      Decret 456/2022 art. 20.3: plates of a model earlier than the current one,
      which do not carry the inscribed AND, must display the separate oval AND
      sticker. So both arrangements are lawfully on the road simultaneously.
    treaty_note: >-
      The 2006 CONSOLIDATED version of Vienna Annex 3 is what permits the sign
      to be incorporated into the plate. PRD-PLATES §4 records that the 1968
      Convention AS ADOPTED forbade exactly that (Annex 3 §3) and flags the
      amendment as UNVERIFIED because UNECE was unreachable. This Andorran
      instrument is INDIRECT CORROBORATION that the amendment exists and is in
      force — a national instrument relying on it by name and article — but it
      is not the amendment itself, and it does not discharge the §4 caution.
      Recorded as a lead for whoever pins the UNECE text.
    source: "https://bopadocuments.blob.core.windows.net/bopa-documents/023014/html/6BEF6.html  # Decret del 23-02-2011, exposició de motius"
  euro_band:
    present: false
    note: "Andorra is not in the EU. No instrument read provides for a band, and the AND mark occupies the left-hand position a Euro band would take."
  colour_spec:
    basis: pantone
    rule: >-
      ANDORRA IS THE ONLY JURISDICTION IN THIS MICROSTATES GROUP THAT SPECIFIES
      ITS COLOURS BY A NAMED COLOUR SYSTEM ACROSS THE WHOLE CATALOGUE. Decret
      456/2022 names Pantone references per series: 2945 (dark blue, diplomatic
      and consular), 299 (lighter blue, embassy administrative staff), 485 (red,
      temporary, historic, dealer, special and machinery), 342 (green, dealer
      ground), 300 (blue, special-vehicle legends). Contrast Liechtenstein and
      Monaco, whose instruments name colours only in words.
    hex_basis_note: >-
      Every hex below is `hex_basis: pantone-converted`. Pantone references are
      physical standards with no authoritative sRGB value, so the hex is a
      conventional conversion and THE PANTONE REFERENCE IS THE CITABLE FACT. A
      spec constraining a colour system is not a hex claim — the same discipline
      es.yml applies to the CIE chromaticity boxes of Anexo XVIII.
    arms_note: >-
      The arms' own proportions and Pantones are referenced but NOT reproduced
      in the plate decree, and the referenced graphic annex was not extractable.
      Recorded gap.
  annex_gap:
    status: RECORDED GAP
    detail: >-
      Decret 456/2022 refers to an annex, "Catàleg oficial de plaques de matrícula
      i distintius del Principat d'Andorra", as figures 1-18. IT IS A GRAPHICS
      ANNEX and carries no machine-readable text; it could not be extracted. The
      1999 Codi's equivalent catalogue is in the same position — only three of
      its graphic pages are digitised on BOPA, and all three were rendered and
      are something else entirely (a stopping-distance diagram, a driving-test
      circuit and hazmat placards). SO NO PLATE ARTWORK OR GLYPH SPECIFICATION
      FROM EITHER CATALOGUE IS AVAILABLE, and every layout fact in this file
      comes from the articles' prose rather than from the figures.
  font:
    name: null
    note: "No typeface is named in any Andorran instrument read, and the graphic annex that might carry a Schriftmuster is unextractable (see annex_gap). Per PRD-PLATES §6 the render layer uses the schematic fallback."
  emblem:
    present: true
    rendered: placeholder
    note: "l'escut nacional del Principat d'Andorra, upper left (art. 6.1). PRD-PLATES §3 placeholder rule; no clean licence route located."
  origin:
    instrument_named: "Ordinació del Consell General del 13 de maig de 1929"
    rule: >-
      A DATED ORIGIN, from a primary instrument — but at one remove. The
      exposició de motius of Llei 24/2014 states: "L'Ordinació del Consell
      General del 13 de maig de 1929 obligava a declarar tots els vehicles
      matriculats i per matricular. Al llarg d'aquests 85 anys, les plaques de
      matrícula han evolucionat en la forma i en el fons." So 13 May 1929 is
      named in a law in force, which is much better than the "around 1930"
      of the secondary accounts.
    limit: >-
      THE 1929 ORDINACIÓ ITSELF IS NOT REACHABLE. BOPA's archive begins in 1989
      (any 1 = 1989) and no pre-1989 Andorran instrument was found digitised
      anywhere. The Ordinació's TEXT — and therefore the plate format it
      established — is unknown. No series is created for it: see
      not_modelled.
    source: "https://bopadocuments.blob.core.windows.net/bopa-documents/026067/html/lo26067002.html  # Llei 24/2014, exposició de motius"
  not_modelled:
    - "THE ORIGINAL 'AND + FOUR DIGITS' SERIES IS NOT MODELLED, and that is a deliberate refusal. The layout is described only by secondary sources, one of which sources it to a collectables auction listing. No instrument describing it was found; the 1929 Ordinació that would carry it is not digitised and BOPA's archive starts in 1989. Creating a series would mean inventing a period and a grammar for a plate this pass could not see. The 1929 DATE is recorded in common.origin because a law in force states it; the FORMAT is not."
    - "NO OFFICIAL / GOVERNMENT SERIES EXISTS IN THE REGLAMENT. Decret 456/2022's article list (arts. 6-19, plus the distintius, the personalised series and art. 27 event plates) is exhaustive and contains no government fleet series. The flag-coloured government plate described by secondary sources has NO primary basis located. Not modelled — a searched-for negative."
    - "NO DISTINCT ELECTRIC PLATE EXISTS, and the reason is sourced: Llei 12/2021, disposició final setena, puts the environmental classification on a WINDSCREEN STICKER instead — 'El corresponent distintiu adhesiu es col·loca al marge inferior dret del parabrises del vehicle. L'Automòbil Club d'Andorra serà l'encarregat de subministrar les etiquetes' (the ZERO / ECO labels). A sourced negative, not an omission."
    - "NO DISTINCT TRAILER SERIES EXISTS. Decret 456/2022 art. 6 covers 'vehicles automòbils, remolcs i semiremolcs' under the ordinary plate, so an Andorran trailer registration is indistinguishable from a car registration."
    - "EVENT PLATES (art. 27) let the Govern create bespoke plates for summits, state visits and the Games of the Small States. No standing grammar exists, so nothing is modelled."
    - "THE TWO-LETTER STAGE (AA000-ZZ999) is provided for by art. 6.2 but undated and unevidenced — see common.numbering.stage_three_not_modelled."

region_encoding: none
region_encoding_note: >-
  Andorra encodes no geography. Its seven parròquies do not appear in a
  registration.

series:

  # =========================================================================
  # THE ORDINARY SERIES — two stages of one continuous scheme, split because
  # the FORMAT differs, dated by two different kinds of evidence.
  # =========================================================================
  - id: ad-standard-letter
    class: standard
    categories: [car, van, truck, bus, trailer, semitrailer]
    period: { start: 2011 }
    period_evidence: agency-stated-date
    period_note: >-
      READ THIS — IT IS THE MOST IMPORTANT NOTE IN THE FILE. 2011 rests on the
      Automòbil Club d'Andorra's page, which is the ONLY source at any tier
      tying a year to the lettered form: "Des de l'any 2011, les plaques de
      matrícula dels vehicles d'Andorra estan formades per quatre xifres de
      color negre precedides per una lletra sobre fons de color blanc." The ACA
      manufactures Andorran plates under Govern concession (Reglament art. 3.1),
      so it is an authoritative agency — but it is NOT an instrument, and it
      does not give a first-issue date.
      WHY NO INSTRUMENT IS CITED HERE, THOUGH ONE IS DATED 2011: the Decret of
      23 February 2011 does not introduce this format. Its art. 3.2 describes
      the five-digit stage and the lettered stage in ONE SENTENCE as a
      continuous scheme advancing on exhaustion, and its stated innovations were
      the reduced plate, enduro/trial plates, ground images and the AND mark.
      Citing that Decret for this date would attach an instrument's window to a
      series it did not create — the exact defect PRD-PLATES §9 and the Spanish
      es-provincial case exist to prevent. The coincidence of years makes it a
      more dangerous trap than usual, not a safer one.
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A[A-Z]\d{4}\z'
      regex_strict: '\A[ABCDEFGHJKLMNPRSTUVWXYZ]\d{4}\z'
      format_evidence: statutory
      charset:
        excluded: [I, O, Q]
        notes: >-
          `regex_strict` carries the 23-letter alphabet of Decret 456/2022
          art. 6.3. The exclusion list is sourced only from 2022 onward — the
          2011 text stated the principle ("lletres… que puguin crear confusió")
          without naming the letters, so a plate issued between the start of the
          lettered stage and 2022 might in principle carry I, O or Q. `regex`
          keeps [A-Z] for that reason as well as for the round-trip.
      progression: >-
        The letter advances only when the four digits exhaust, per art. 6.2's
        continuous-scheme sentence. There is NO date encoded and no geography.
      separator: none
      separator_note: "art. 6.2 describes 'un grup de 5 caràcters' with no separator glyph; the pattern spells the serial unbroken."
    design:
      plate: { w: 340, h: 120, unit: mm, tolerance_mm: 0.5, note: "art. 6.4" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      foreground_note: "'caràcters estampats en relleu de color negre mat' — embossed MATT black (art. 6.1)"
      band: { side: none }
      emblem: { present: true, rendered: placeholder, position: upper-left }
      national_mark: { text: "AND", color: "#003399", position: "lower left, beneath the arms", hex_basis: observed }
      legend: { text: "PRINCIPAT D'ANDORRA", color: "#003399", position: "bottom, beneath the serial", hex_basis: observed }
      base: { material: aluminium, thickness_mm: 1.35 }
      rear_differs: false
      variants:
        - name: "reduced (M1)"
          format: { pattern: "L9999" }
          plate: { w: 275, h: 90, unit: mm }
          note: "a smaller plate for M1 vehicles, same grammar and same furniture — a size option rather than a distinct series, so a variant per PRD-PLATES §2.3"
    region_encoding: none
    notes: >-
      THE CURRENT ORDINARY SERIES — one letter and four digits, black on white,
      arms upper left, AND beneath them, PRINCIPAT D'ANDORRA along the bottom.
      Trailers and semi-trailers share this series, so an Andorran trailer plate
      is textually indistinguishable from a car plate. Its period rests on an
      agency page rather than an instrument, uniquely in this file, and the
      reason is set out at length in period_note.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 arts. 4.1, 6.1-6.4 — the grammar, the I/O/Q exclusions, 340x120 mm, the layout and the aluminium base"
      - "https://aca.ad/serveis/plaques-de-matricula  # OFFICIAL AGENCY PAGE (Automòbil Club d'Andorra, concessionaire under art. 3.1): 'Des de l'any 2011…' — the sole source for the year"

  - id: ad-standard-numeric
    class: standard
    categories: [car, van, truck, bus, trailer, semitrailer]
    period: { start: 1999, ended: true }
    year_end_min: 2011
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      BOTH ENDS ARE HONEST APPROXIMATIONS AND THE FILE SAYS SO.
      START: 1999 is an UPPER BOUND, not an origin. The Llei del Codi de la
      circulació of 10 June 1999 is the earliest instrument reached that carries
      a plate catalogue at all (art. 147: "Aquest Codi inclou el catàleg de
      plaques de matrícula vigents a Andorra"), and the five-digit grammar is
      confirmed from the 2011 Decret describing it as the base stage. The format
      certainly predates 1999 — BOPA's archive begins in 1989 and pre-1989
      Andorran law is not digitised, so how far back it runs is unknowable from
      here.
      END: `ended: true` with `year_end_min: 2011` rather than a claimed end
      year. The five-digit stage closed when 99999 exhausted, which is an event,
      not a legal act, and no source dates it. 2011 is the earliest year the
      lettered stage is reported to have been running.
    matching: strict
    format:
      pattern: "99999"
      regex: '\A\d{5}\z'
      format_evidence: statutory
      format_note: >-
        FIVE NUMERIC DIGITS, 00000 to 99999 — established from primary text, and
        this is the gap-closing fact of the Andorran dossier. Every secondary
        account describes the pre-2011 plates as "black on white" without ever
        stating the grammar; art. 6.2 of Decret 456/2022 (and art. 3.2 of the
        2011 Decret before it) states it exactly, in the course of describing
        the scheme's first stage.
      progression: "sequential from 00000; leading zeros are part of the form, since the range is written as beginning 00000"
    design:
      plate: { w: 340, h: 120, unit: mm, note: "assumed continuous with the current plate; the 2011 Decret introduced the REDUCED size, implying the 340x120 size predates it" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      national_mark:
        text: "AND"
        present: false
        note: >-
          THE AND MARK WAS NOT ON THIS PLATE. It was added by the 2011 Decret —
          its exposició de motius lists "s'ha incorporat l'indicatiu AND" among
          that instrument's innovations — which is why art. 20.3 of the current
          Reglament requires older plates to carry the separate oval sticker
          instead. This is the one design fact that genuinely distinguishes the
          pre-2011 plate, and unlike the serial change it IS dated by an
          instrument.
      rear_differs: false
    region_encoding: none
    notes: >-
      THE FIVE-DIGIT SERIES — Andorra's ordinary plate before the lettered
      stage. Modelled separately from ad-standard-letter because the format
      differs, even though the two are stages of one scheme in the instrument's
      own words. Note the asymmetry in the evidence: the SERIAL change between
      the two series is undated, while the AND MARK change that accompanied it
      is dated by the 2011 Decret. Overlaps ad-standard-letter, which is
      genuine — plates already issued stayed valid.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 6.2 — the 00000-99999 base stage"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/023014/html/6BEF6.html  # Decret del 23-02-2011 art. 3.2 and exposició de motius — the same grammar, and the AND mark as a 2011 innovation"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/011040/html/199A6.html  # Llei del Codi de la circulació de 10-6-99 art. 147 — the plate catalogue sat inside the Code"

  - id: ad-motorcycle
    class: motorcycle
    categories: [motorcycle]
    period: { start: 2011 }
    period_evidence: agency-stated-date
    matching: strict
    format:
      pattern: "L9999"
      regex: '\A[A-Z]\d{4}\z'
      regex_strict: '\A[ABCDEFGHJKLMNPRSTUVWXYZ]\d{4}\z'
      format_evidence: statutory
      format_note: >-
        THE SAME SERIAL GRAMMAR AS CARS — art. 7 gives motorcycles their own
        SIZES but not their own numbering. There is no dedicated motorcycle
        letter block, contrary to some secondary accounts.
    design:
      plate: { w: 225, h: 115, unit: mm, note: "horizontal motorcycle plate (art. 7)" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      national_mark: { text: "AND", color: "#003399" }
      legend: { text: "PRINCIPAT D'ANDORRA", color: "#003399" }
      rear_differs: false
      variants:
        - name: "vertical (enduro / trial)"
          format: { pattern: "L9999" }
          plate: { w: 100, h: 168, unit: mm }
          note: >-
            art. 7.4 — a PORTRAIT plate in two zones split by a blue band, the
            letter or letters above and the four digits below. The 2011 Decret
            introduced plastic and rubber enduro/trial plates specifically, per
            its exposició de motius, which is a genuinely unusual material
            provision.
    region_encoding: none
    notes: >-
      MOTORCYCLES. Two shapes — a 225x115 mm horizontal plate and a 100x168 mm
      portrait plate for enduro and trial machines, the latter permitted in
      plastic or rubber. Same serial grammar as the car series, so the plate's
      SIZE and not its string is what identifies it.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 7 and art. 7.4"

  - id: ad-moped
    class: moped
    categories: [moped]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "99999"
      regex: '\A\d{5}\z'
      format_evidence: statutory
      format_note: >-
        FIVE DIGITS — mopeds kept the numeric grammar the car series left
        behind, and run their own independent number space from 00000 to 99999.
        So a five-digit Andorran plate today is a moped, while a five-digit
        plate from before the lettered stage was a car. The same string, two
        meanings, separated only by the plate it is printed on and by era.
    design:
      plate: { w: 106, h: 66, unit: mm, note: "art. 8 — the smallest Andorran plate" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#003399", hex_basis: observed }
      legend: { text: "ANDORRA", color: "#003399", panel_color: "#FFD700", note: "blue lettering on a YELLOW panel — the only yellow element in the Andorran catalogue" }
      emblem: { present: true, rendered: placeholder, position: "bottom left, the flag shield" }
      band: { side: none }
      rear_differs: false
    region_encoding: none
    notes: >-
      CICLOMOTORS (mopeds). A distinctive little plate — blue border, the legend
      ANDORRA in blue on a yellow panel, and the flag shield at the bottom left
      rather than the national arms at the top left. It is the one Andorran
      series that does not follow the common layout.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 8"

  # =========================================================================
  # THE DIPLOMATIC FAMILY — four series, three ranks, two Pantones.
  # =========================================================================
  - id: ad-diplomatic-cmd
    class: diplomatic
    categories: [car, van]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "CMD9L"
      regex: '\ACMD[- ]?\d[- ]?[A-Z]\z'
      format_evidence: statutory
      format_note: >-
        art. 9: CMD, then ONE digit, then a letter identifying the STATE. Heads
        of diplomatic mission only, which is why a single digit suffices.
    design:
      plate: { w: 340, h: 120, unit: mm }
      background: { color: "#1F3A93", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 2945 — dark blue, named in the instrument" }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      CAPS DE MISSIÓ DIPLOMÀTICA — heads of diplomatic mission. White on Pantone
      2945 dark blue. The trailing letter is a STATE code, which makes this the
      only genuine decode field in the Andorran system; the code table itself
      was NOT located and is a recorded gap.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 9"

  - id: ad-diplomatic-cd
    class: diplomatic
    categories: [car, van]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "CD99L"
      regex: '\ACD[- ]?\d{2}[- ]?[A-Z]\z'
      format_evidence: statutory
      format_note: "art. 10: CD, two digits (00-99), then the State letter"
    design:
      plate: { w: 340, h: 120, unit: mm }
      background: { color: "#1F3A93", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 2945" }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      COS DIPLOMÀTIC — the diplomatic corps proper, below head-of-mission rank.
      Two digits rather than the CMD series' one, on the same Pantone 2945
      ground. The three-way split CMD / CD / A by rank, each with its own digit
      count, is unusually granular for a microstate.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 10"

  - id: ad-consular-cc
    class: consular
    categories: [car, van]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "CC999L"
      regex: '\ACC[- ]?\d{3}[- ]?[A-Z]\z'
      format_evidence: statutory
      format_note: "art. 11: CC, THREE digits (000-999), then the State letter — the widest block in the diplomatic family"
    design:
      plate: { w: 340, h: 120, unit: mm }
      background: { color: "#1F3A93", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 2945" }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      COS CONSULAR. Shares the Pantone 2945 ground with the diplomatic series
      and is distinguished only by the CC prefix and by having three digits.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 11"

  - id: ad-diplomatic-staff-a
    class: diplomatic
    categories: [car, van]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "A99L"
      regex: '\AA[- ]?\d{2}[- ]?[A-Z]\z'
      format_evidence: statutory
      format_note: >-
        art. 12: the letter A, two digits, then the State letter. This is why A
        appears in Llei 24/2014's list of prefixes a personalised plate may not
        imitate, alongside MT, CD, CMD and CC.
    design:
      plate: { w: 340, h: 120, unit: mm }
      background: { color: "#3E6DB5", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 299 — a LIGHTER blue than the 2945 of the CMD/CD/CC series, and the distinction is deliberate and statutory" }
      foreground: "#FFFFFF"
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      ADMINISTRATIVE AND TECHNICAL STAFF of embassies. Kept separate from
      ad-diplomatic-cd because the instrument gives it a DIFFERENT PANTONE —
      299 against 2945 — so rank is encoded in the shade of blue as well as in
      the prefix. That is a real design fact and would be lost by folding this
      into the CD series.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 12"

  # =========================================================================
  # TEMPORARY, TRADE, HISTORIC AND MACHINERY.
  # =========================================================================
  - id: ad-temporary-mt
    class: temporary
    categories: [car, van, motorcycle]
    period: { start: 1999 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      The MT series is older than the current Reglament: the 1999 Codi already
      carried it at art. 156 — "En les plaques de matriculació temporal, hi han
      de constar les lletres MT, seguides del número d'ordre, del mes i de l'any
      en curs" — so 1999 is an upper bound resting on a repealed but read
      instrument, and the current spec is art. 13 of Decret 456/2022.
    matching: strict
    format:
      pattern: "MT 9999"
      regex: '\AMT[- ]?\d{4}\z'
      format_evidence: statutory
      format_note: >-
        MT IS TREATED AS PART OF THE SERIAL, and that is sourced rather than
        assumed: Llei 24/2014 art. 7.1(i) forbids a personalised plate from
        consisting of "les lletres 'MT', 'CD', 'CMD', 'A', 'CC', seguides de
        xifres" — grouping MT with the unambiguous diplomatic serial prefixes.
        Contrast "la paraula PROVA" in the same provision, which the statute
        treats as a WORD and which this file therefore models as a legend rather
        than as serial (see ad-dealer-prova).
      expiry_marking: >-
        The plate also carries the expiry MONTH in Roman numerals and the YEAR
        in Arabic numerals, in a red field at the upper right. That is a
        validity device, not a serial component, and it does not appear in the
        pattern.
    design:
      plate: { w: 340, h: 120, unit: mm, note: "225x115 mm for motorcycles" }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      accent: { color: "#E1051E", hex_basis: pantone-converted, spec_note: "Pantone 485 — the MT panel, the expiry panel, the AND mark and the legend are all in this red on this series" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      MATRÍCULA TEMPORAL — temporary/tourist registration. Distinguished from
      the ordinary plate by red furniture rather than by a coloured ground: the
      AND mark and the PRINCIPAT D'ANDORRA legend, blue on every other white
      plate, are red here.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 13"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/011040/html/199A6.html  # Llei del Codi de la circulació de 10-6-99 art. 156 — the MT series' earlier basis"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/026067/html/lo26067002.html  # Llei 24/2014 art. 7.1(i) — MT grouped with the serial prefixes"

  - id: ad-dealer-prova
    class: dealer
    categories: [car, van, motorcycle]
    period: { start: 1999 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      Also older than the current Reglament: the 1999 Codi art. 151(b) carried
      it — "Les plaques han de contenir la menció 'PROVA', han de portar gravat
      un número d'ordre i l'any del seu lliurament, que també és l'any de
      validesa." Current spec at art. 16 of Decret 456/2022.
    matching: strict
    format:
      pattern: "999"
      regex: '\A\d{1,3}\z'
      printed_form: "PROVA 999"
      format_evidence: statutory
      format_note: >-
        THE SERIAL IS THE THREE DIGITS; "PROVA" IS A LEGEND. art. 16.1 says so
        in terms — "A la part inferior s'hi troba la llegenda 'PROVA'" — and
        Llei 24/2014 art. 7.1(i) reinforces it by calling PROVA "la paraula"
        (the word) where it calls MT, CD, CMD, A and CC "les lletres" grouped
        with digits. The statute's own vocabulary distinguishes a legend from a
        serial prefix, and this file follows it.
      matching_caveat: >-
        As with sm-police, taking the legend out leaves a regex of one to three
        digits, which is NOT DISCRIMINATIVE. The series is identified by its
        unmistakable colours, not by its string. `printed_form` records what a
        human reads.
      expiry_marking: "the plate also carries the expiry month in Roman numerals and the year, per art. 16"
    design:
      plate: { w: 300, h: 190, unit: mm, note: "art. 16 — a tall, near-square plate unlike any other in the catalogue" }
      background: { color: "#00A651", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 342 — GREEN ground, verbatim: 'El fons de les plaques és de color verd (fons Pantone 342)'" }
      foreground: "#E1051E"
      foreground_note: "RED characters, Pantone 485 — 'El bordó és de color vermell (fons Pantone 485)'"
      hex_basis: pantone-converted
      border: { color: "#E1051E", hex_basis: pantone-converted }
      legend: { text: "PROVA", position: bottom }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      DEALER / TEST PLATES, and visually the most striking in the catalogue: RED
      characters on a GREEN ground, both Pantone-specified, on a 300x190 mm
      plate. Nothing else in the microstates group looks remotely like it.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 16.1"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/011040/html/199A6.html  # Llei del Codi de la circulació de 10-6-99 art. 151(b)"

  - id: ad-historic-failed-itv
    class: historic
    categories: [car, van, motorcycle]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "L99"
      regex: '\A[A-Z]\d{2}\z'
      format_evidence: statutory
      format_note: "art. 14: one letter and two digits — the shortest serial in the Andorran system"
    design:
      plate: { w: 330, h: 140, unit: mm }
      background: { color: "#E1051E", finish: retroreflective, hex_basis: pantone-converted, spec_note: "Pantone 485 RED GROUND — the only red-ground plate in the catalogue" }
      foreground: "#000000"
      legend: { text: "VEHICLE HISTÒRIC" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      HISTORIC VEHICLES THAT HAVE NOT PASSED THE ROADWORTHINESS TEST — "type I"
      in the Reglament's scheme (art. 14). Andorra splits its historic regime by
      ITV OUTCOME rather than by vehicle age, giving red plates to vehicles that
      failed and white ones to those that passed. That is a genuinely unusual
      design decision and it is why two historic series appear here.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 14"

  - id: ad-historic-passed-itv
    class: historic
    categories: [car, van, motorcycle]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "58999"
      regex: '\A5[89]\d{3}\z'
      format_evidence: statutory
      format_note: >-
        A RESERVED NUMERIC BLOCK, 58001 to 59999 (art. 15) — carved out of the
        ordinary five-digit space rather than given its own prefix. The human
        pattern spells a representative value from the 58xxx half because the
        pattern DSL cannot express a numeric range; `regex` covers the whole
        block. The lower bound 58001 is not encoded, so the regex accepts 58000,
        which the block does not contain.
    design:
      plate: { w: 330, h: 140, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#000000"
      border: { color: "#000000" }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      HISTORIC VEHICLES THAT HAVE PASSED THE ROADWORTHINESS TEST — "type II"
      (art. 15). Black on white with a black border, and identified by a
      RESERVED NUMBER RANGE rather than by any letter. It is the only Andorran
      series whose identity lives entirely in its numeric block, which makes it
      the one case where a bare five-digit string can be attributed with
      confidence. Note the consequence for ad-moped, whose 00000-99999 space
      nominally includes this block.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 15"

  - id: ad-special-vehicle
    class: standard
    categories: [machine, truck]
    period: { start: 1999 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      The 1999 Codi art. 204.7 already required special-vehicle plates of a
      distinct type — "Les matrícules han de ser de les dimensions i del tipus
      especials diferents de les matrícules normals i segons el model oficial" —
      so 1999 is an upper bound; art. 17 of Decret 456/2022 is the current spec.
    matching: strict
    format:
      pattern: "9999"
      regex: '\A\d{4}\z'
      format_evidence: statutory
      format_note: >-
        FOUR numeric characters, 0000 to 9999, verbatim: "A les plaques de
        matrícula s'hi inscriu un grup de quatre caràcters numèrics que va des
        del 0000 fins al 9999." Recorded against secondary accounts that give
        three.
    design:
      plate: { w: 225, h: 115, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed, spec_note: "verbatim: 'El fons de les plaques és retroreflector, de color blanc' — WHITE, against secondary accounts that describe a sky-blue ground" }
      foreground: "#E1051E"
      foreground_note: "red, Pantone 485, embossed, with a matching border"
      hex_basis: pantone-converted
      legend: { text: "VEHICLE ESPECIAL", color: "#005B99", hex_basis: pantone-converted, spec_note: "Pantone 300 blue, top" }
      legend_bottom: { text: "PRINCIPAT D'ANDORRA", color: "#005B99", hex_basis: pantone-converted }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
      rear_differs: false
    region_encoding: none
    notes: >-
      VEHICLES ESPECIALS. Red characters on a WHITE retroreflective ground with
      blue Pantone 300 legends. Two corrections to the secondary record are
      carried here: the ground is white and not sky blue, and the serial is FOUR
      digits and not three. Both come from art. 17.1 verbatim.
    sources:
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/034135/html/GR20221110_09_12_43.html  # Decret 456/2022 art. 17.1"
      - "https://bopadocuments.blob.core.windows.net/bopa-documents/011040/html/199A6.html  # Llei del Codi de la circulació de 10-6-99 art. 204.7"

  - id: ad-snow-vehicle
    class: standard
    categories: [snow-vehicle]
    period: { start: 2011 }
    period_evidence: instrument-in-force-upper-bound
    matching: strict
    format:
      pattern: "9999"
      regex: '\A\d{4}\z'
      format_evidence: statutory
    design:
      plate: { w: 225, h: 115, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: observed }
      foreground: "#E1051E"
      hex_basis: pantone-converted
      legend: { text: "MOTO DE NEU", color: "#005B99", hex_basis: pantone-converted }
      band: { side: none }
      emblem: { present: true, rendered: placeholder }
