# plates/au-nsw.yml — New South Wales (PRD-PLATES gate L3, Australia).
#
# AUSTRALIA IS FEDERATED THE US WAY, NOT THE GERMAN WAY: there is no national
# plate format, no national design standard, and no Commonwealth registry for
# light vehicles. Each State and Territory registers vehicles under its own
# Act and its own regulation, and each allocates its own serials. So NSW gets
# its own file (us-fl exemplar), and every claim below is a NEW SOUTH WALES
# claim sourced to a New South Wales instrument or to Transport for NSW.
#
# THE STRUCTURAL FACT THAT SHAPES EVERY AUSTRALIAN FILE IN THIS WAVE, and it
# is the British pattern arriving by a different route: THE COMPOSITION OF AN
# AUSTRALIAN REGISTRATION NUMBER IS NOT IN ANY INSTRUMENT. The regulations
# empower the registering authority to "assign a distinguishing registration
# number" and stop there — the Tasmanian regulation says exactly that in terms
# (Vehicle and Traffic (Driver Licensing and Vehicle Registration) Regulations
# 2021 (Tas) reg 88(1), quoted in plates/au-tas.yml), and Queensland's says the
# chief executive "must ... assign a registration number to the vehicle"
# (quoted in plates/au-qld.yml). WHICH letters and digits, in WHICH order, is
# an administrative allocation published nowhere. NSW is the extreme case: the
# Road Transport (Vehicle Registration) Regulation 2017 (NSW) could not be read
# at all in this pass (see instrument.access_note), and Transport for NSW's own
# number-plate pages — all three were fetched in full on 2026-08-02 — describe
# ordering, reserving, replacing and displaying plates and NEVER state the
# general-issue combination. That is why the standard series below carries
# secondary evidence and says so, rather than pretending to a statutory source.
#
# WHAT IS PRIMARY HERE, and it is not nothing: the display rules (Transport for
# NSW, verbatim below, itself citing cl 25 of the 2017 Regulation) and the
# Classic Vehicle Scheme plate — the one NSW series in this file with an exact
# agency-dated start, exact dimensions and an agency-stated issuing rule, from
# the Transport for NSW fact sheet of June 2024.
#
# REGEX POLICY (identical to plates/gb.yml and plates/us-fl.yml): `format.regex`
# is the LINT-ROUND-TRIPPABLE regex written in PRINTED form (PRD-PLATES §2.6
# rule 2) — the gap between groups is spelled as an optional emitted SPACE
# because that is how the plate prints it and how `pattern` spells it. No NSW
# plate prints a hyphen; the hyphenated renderings common on enthusiast sites
# are typography, not the plate.
jurisdiction: au-nsw
authority:
  name: Transport for NSW
  url: "https://www.nsw.gov.au/driving-boating-and-transport/vehicle-registration/vehicle-number-plates"
binding: vehicle
binding_note: >-
  Transport for NSW, verbatim (accessed 2026-08-02): "Number plates remain the
  property of Transport for NSW. We have the authority to issue, decline to
  issue, renew or withdraw number plates." And: "If your registration has been
  cancelled for any reason, it is an offence to keep the number plates." The
  RIGHT TO DISPLAY a combination is separable from the vehicle — a seller may
  "reserve your plates and replace them with general number plates" for an
  annual fee — so NSW is a two-layer system: the plate binds to the vehicle,
  the combination binds to a person who pays to hold it.
instrument:
  citation: "Road Transport (Vehicle Registration) Regulation 2017 (NSW), made under the Road Transport Act 2013 (NSW)"
  cited_by: "Transport for NSW's own display page cites 'cl.25 of the Road Transport (Vehicle Registration) Regulation 2017' for auxiliary (bike-rack) plate visibility — the agency's own pin to the instrument"
  access_note: >-
    NOT READ IN THIS PASS, AND THE REASON IS RECORDED SO NOBODY REPEATS THE
    HUNT: legislation.nsw.gov.au sits behind a Cloudflare managed challenge
    that returns HTTP 403 to every non-browser client. Direct fetch, browser
    header sets and the AustLII mirror (classic.austlii.edu.au, also 403) all
    failed on 2026-08-02, and the Internet Archive holds no snapshot of the
    instrument's view URL. Consequently NOT ONE WORD of the NSW regulation is
    quoted in this file; every claim below comes from Transport for NSW pages,
    which are primary authority publications in their own right (PRD-PLATES
    §4), or is marked secondary. The verifier with a browser should read the
    2017 Regulation and re-audit this file first — it is the largest single
    sourcing gap in the Australian wave.
  licence: "NSW Government material on nsw.gov.au is published under Crown copyright with a stated copyright page; the fact claims extracted here are uncopyrightable facts (PRD-PLATES §4)"

# ---------------------------------------------------------------------------
# The national layer. Recorded once per Australian file because it is real,
# it is small, and it is the only thing in Australia that is NOT per-State.
# ---------------------------------------------------------------------------
national_schemes:
  heavy_vehicle: >-
    THE HEAVY VEHICLE NATIONAL LAW is the one genuinely national registration
    layer, and it is a MECHANISM, not a series: heavy vehicles (over 4.5 t GVM)
    are registered under the Heavy Vehicle National Law as applied in each
    participating jurisdiction, and the plate they carry is a NATIONAL HEAVY
    VEHICLE NUMBER PLATE issued BY THE STATE registrar on the national pattern.
    Three State instruments name the object in those words and were read in
    this wave: Transport Operations (Road Use Management—Vehicle Registration)
    Regulation 2021 (Qld) s 117(2)(c); Vehicle and Traffic (Driver Licensing and
    Vehicle Registration) Regulations 2021 (Tas) reg 88(6); Motor Vehicles
    Regulations 1977 (NT) reg 10, headed "Ownership of national heavy vehicle
    number plates". Transport for NSW likewise sends heavy-vehicle plate fees to
    a "national heavy vehicle number plate" schedule. NO SERIES IS AUTHORED for
    it in any file of this wave: the national heavy-vehicle serial grammar was
    not obtained from the NHVR or from any State instrument (recorded gap, L4).
  light_vehicle_standards: >-
    The Australian Light Vehicle Standards Rules 2015 (national MODEL law
    published by the Parliamentary Counsel's Committee, consolidated as at
    22 March 2019) are the nearest thing to a national plate standard, and they
    reach only the LIGHTING, never the plate: rule 86(1), verbatim, "At least 1
    number plate light must be fitted to the rear of a vehicle"; 86(2) "When on,
    the number plate light or lights must illuminate a number plate on the rear
    of the vehicle with white light, so the characters on the number plate can
    be read at night 20 metres from the rear of the vehicle". The Rules state of
    themselves: "These Rules are a national model law and are intended to
    provide the basis for nationally consistent transport laws. These Rules do
    not, by themselves, have any legal effect." Nothing in them prescribes plate
    dimensions, colours or serial grammar.
  firs_closed: >-
    The Federal Interstate Registration Scheme — the one Commonwealth vehicle
    registration scheme, which issued its own red-on-white plates — CLOSED on
    30 June 2018 and its vehicles moved to State registration. Recorded as a
    dead scheme; no series is authored for it (the Commonwealth instrument, the
    Interstate Road Transport Regulations 1986, was not read in this pass).
  source: "https://www.pcc.gov.au/uniform/Australian%20Light%20Vehicle%20Standards%20Rules%202015%20-%2022%20March%202019.pdf  # Australian Light Vehicle Standards Rules 2015 as at 22 March 2019, rule 86 quoted verbatim above and the model-law disclaimer from the title page (accessed 2026-08-02)"

# ---------------------------------------------------------------------------
# Display rules — Transport for NSW, quoted verbatim. The 20 m / 45 degree
# test is the AUSTRALIA-WIDE formulation: Queensland, Tasmania, the ACT and
# South Australia all state it in the same terms, from their own instruments.
# ---------------------------------------------------------------------------
display_rules:
  plates_per_vehicle: "verbatim: 'For vehicles, 1 number plate must be fitted to the front of the vehicle and another to its rear. If different in size, the larger number plate must be fitted to its rear.' / 'For motorcycles or trailers, 1 number plate must be fitted to its rear.'"
  visibility: "verbatim: 'The numbers on number plates must be clearly visible from any point that is up to 20 metres from the number plate, and within an arc of 45 degrees from the surface of the number plate above or to either side of the vehicle.'"
  covers: "verbatim: 'Number plate covers must be clear, clean, untinted and flat over the entire surface, and have no reflective or other characteristics that would prevent the successful operation of traffic offence detection devices.'"
  lighting: "verbatim: 'At least 1 number plate light must be fitted to the rear of vehicles. When on, number plate lights must illuminate number plates on the rear of vehicles with white light, so the numbers can be read at night 20 metres from the vehicle's rear.' — the Australian Light Vehicle Standards Rules 2015 rule 86 restated by the agency"
  auxiliary_plates: "bike-rack (auxiliary) plates must be 'compliant with cl.25 of the Road Transport (Vehicle Registration) Regulation 2017'"
  sources:
    - "https://www.nsw.gov.au/driving-boating-and-transport/vehicle-registration/vehicle-number-plates/displaying-number-plates  # Transport for NSW, read via the Internet Archive snapshot of 2026-01-24 (the live host 403s to non-browser clients): the front/rear rule, the motorcycle/trailer single-plate rule, the 20 m / 45 degree visibility test, the cover rule, the lighting rule and the cl.25 auxiliary-plate pin"

series:

  # =========================================================================
  # CURRENT GENERAL ISSUE.
  # =========================================================================
  - id: au-nsw-standard
    class: standard
    categories: [car, van, truck, bus, motorcycle, trailer]
    period: { start: 2004 }        # SECONDARY. Two independent secondary
                                   # sources put the current serial style at
                                   # 2004; no agency page dates it. See notes.
    period_evidence: corroboration-only
    matching: strict
    format:
      pattern: "LL 99 LL"
      regex: '\A[A-Z]{2} ?\d{2} ?[A-Z]{2}\z'
      evidence: secondary
      charset:
        notes: >-
          SIX CHARACTERS, two letters / two numerals / two letters, printed as
          three groups. NO NSW INSTRUMENT AND NO TRANSPORT FOR NSW PAGE STATES
          THIS — all three agency number-plate pages were fetched in full on
          2026-08-02 and none gives the combination. Letter exclusions (whether
          NSW skips I, O, Q, U as several Canadian provinces do) are UNKNOWN and
          are a recorded gap: no charset restriction is claimed here, which is
          why there is no `regex_strict`.
      progression: "ascending within the two-letter leading block; the leading block in general issue at the time of writing is reported as 'D..', which is a VALUE inside this shape and not a different shape — no fixed literal is encoded"
    design:
      plate: { w: 372, h: 134, unit: mm }
      plate_dimension_note: >-
        372 x 134 mm is the Australian passenger-car plate size, and in this
        wave it is SOURCED — not from a national standard, which does not
        exist, but from two State authorities independently publishing the same
        millimetres for their own plates: WA's Department of Transport
        ("Motor vehicle plate 372 mm x 134 mm") and the NT's Motor Vehicle
        Registry ("372mm x 133mm"), with the ACT publishing 372 mm as its
        standard plate LENGTH. The widely repeated "372 x 135 mm Australian
        standard" is a rounding of these; the underlying figure is per-State.
        NSW's own dimension for general issue was NOT found on any agency page
        (recorded gap) — the value here is the cross-State figure and is
        flagged as such.
      colour_note: >-
        Black characters on a yellow retroreflective ground. NO AGENCY SOURCE:
        Transport for NSW publishes no colour specification. The colour words
        are corroborated by an enthusiast reference describing a NSW "standard
        black on yellow serial" plate; NO HEX IS RECORDED, because guessing the
        yellow would be inventing a fact the state has never published.
      rear_differs: false
    region_encoding: none
    sources:
      - "https://www.nsw.gov.au/driving-boating-and-transport/vehicle-registration/vehicle-number-plates/order-reserve-or-replace-number-plates  # Transport for NSW (Internet Archive snapshot 2025-12-05, accessed 2026-08-02): plates remain TfNSW property; new plates issued on first registration; the reserve/exchange machinery. NEGATIVE FINDING: the page never states the general-issue combination"
      - "http://www.plateshack.com/y2k/New_South_Wales/nswy2k.html  # enthusiast reference (PRD-PLATES §4 corroboration class), read via the Internet Archive, accessed 2026-08-02: a photo-dated 2010 NSW plate captioned 'serial style in use since 2004 and still in current use', and a NSW plate described as a remake of the 'standard black on yellow serial'. Corroborates the 2004 start and the colour words INDEPENDENTLY of the locator"
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_New_South_Wales  # LOCATOR ONLY (PRD-PLATES §4), accessed 2026-08-02: the two-letter/two-numeral/two-letter arrangement and the 2004 changeover. Used as a finding aid; its citations were chased and none reaches a NSW instrument"
    notes: >-
      NEW SOUTH WALES GENERAL ISSUE. THE FORMAT AND THE PERIOD ARE BOTH
      SECONDARY, AND THIS SERIES SAYS SO RATHER THAN DRESSING THEM UP. What was
      actually attempted, in order: (1) the Road Transport (Vehicle
      Registration) Regulation 2017 — unreadable, Cloudflare, see
      instrument.access_note; (2) all three Transport for NSW number-plate pages
      — fetched in full, none states a combination; (3) myPlates.com.au, the
      agency's own licensed personalised-plate operator — a JavaScript
      application with no server-rendered text; (4) the NSW Government's
      Classic Vehicle Scheme fact sheet — states dimensions and a start date but
      not the general-issue grammar. So `period_evidence: corroboration-only`:
      2004 rests on an enthusiast reference's photo-dated caption AND the
      locator agreeing, which is two weak sources agreeing rather than one
      source verified. THE ID IS DELIBERATELY UNDATED (`au-nsw-standard`, not
      `au-nsw-standard-2004`) for exactly the reason us-fl-standard is: minting
      a dated id on a folklore boundary builds a dated id on sand, and the id
      contract (PRD-QUALITY I-5/I-6) then forbids taking it back. When an
      agency or instrument date lands, the dated id is added and this one
      becomes its former-id alias.

  # =========================================================================
  # ONE SERIES BACK.
  # =========================================================================
  - id: au-nsw-standard-3l3n
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1951, end: 2004 }
    period_evidence: secondary-locator-unverified
    matching: strict
    format:
      pattern: "LLL 999"
      regex: '\A[A-Z]{3} ?\d{3}\z'
      evidence: secondary
      charset: { notes: "three letters then three numerals — the arrangement every Australian State ran for most of the second half of the twentieth century, under the 1948 letter allocation described in plates/au-act.yml. NSW's own block of that allocation, and any letter exclusions, are not published" }
    design:
      colour_note: "black on yellow for the later part of the run; the earlier colour history of NSW plates was not researched (out of scope at this gate — PRD-PLATES §2.5)"
    region_encoding: none
    sources:
      - "https://en.wikipedia.org/wiki/Vehicle_registration_plates_of_New_South_Wales  # LOCATOR ONLY, accessed 2026-08-02: the three-letter/three-numeral general issue and its 1951-2004 window. BOTH boundaries are the locator's, uncited in its own text"
      - "http://www.plateshack.com/y2k/New_South_Wales/nswy2k.html  # enthusiast reference, accessed 2026-08-02: corroborates the 2004 END only, indirectly, by dating the SUCCESSOR style's first use to 2004"
    notes: >-
      THE PREVIOUS NEW SOUTH WALES GENERAL ISSUE, AND EVERY DIGIT OF ITS PERIOD
      IS THE LOCATOR'S. The 1951 start is uncited in the locator's own article;
      the 2004 end is corroborated only in the weak sense that an independent
      enthusiast reference dates the successor style to 2004. It is authored
      anyway because the ARRANGEMENT is not in dispute anywhere and a consumer
      parsing a 1990s NSW plate needs a shape to match; but nothing here is
      asserted as sourced. A verifier who reaches the 2017 Regulation should
      NOT expect it to help: Australian registration regulations do not carry
      serial grammars, so the fix for this series is an agency history page or
      a Government Gazette notice, not the instrument.

  # =========================================================================
  # CLASSIC VEHICLE SCHEME — the one NSW series in this file with an exact
  # agency-dated start, exact dimensions and an agency-stated issuing rule.
  # =========================================================================
  - id: au-nsw-classic
    class: historic
    categories: [car, motorcycle]
    period: { start: 2024 }        # "From 1 July 2024, a new number plate will
                                   # be available for vehicles in the Classic
                                   # Vehicle Scheme (CVS)" — the agency, dated.
    period_evidence: agency-stated-date
    matching: recall-only
    format:
      pattern: "99999"
      regex: '\A[A-Z0-9]{1,7}( ?[A-Z0-9]{1,7})?\z'
      evidence: none
      charset:
        notes: >-
          THE ARRANGEMENT IS NOT PUBLISHED AND IS NOT GUESSED. All the agency
          says about the serial is HOW it is allocated, verbatim: "the new CVS
          plates will be issued in numerical order 'off the shelf, in sequential
          order', with no personalised options available." That is an allocation
          rule, not a grammar — it does not even settle whether the serial is
          all-numeric. So `matching: recall-only` and the regex is an explicit
          catch-all over the serial alphabet: a match is a shape hit and nothing
          more (PRD-PLATES §2.7). Narrowing it when the arrangement lands is a
          one-line change; guessing it now would be a fabricated fact.
    design:
      plate: { w: 317, h: 134, unit: mm }
      plate_variants:
        - { for: motorcycle, w: 186, h: 100, unit: mm }
      plate_dimension_note: "verbatim from the fact sheet's figure captions: 'Car plate dimensions 317mm x 134mm' and 'Motorcycle plate dimensions 186mm x 100mm'. The agency's stated reason: 'The new number plate size and design better fits classic vehicles, without needing alterations to the plate or the mounting.'"
      legend: "Classic"
      legend_rule: "verbatim: the plate 'includes the word \"Classic\" to enhance the authenticity of classic vehicles and to help differentiate classic vehicles from other vehicles'"
    eligibility: "vehicles in the NSW Classic Vehicle Scheme; issued automatically to vehicles joining the scheme, and purchasable by existing scheme vehicles at registration renewal. Verbatim: 'No, only vehicles in the CVS can be issued with the new CVS plate' — it is NOT available to the separate Historic Vehicle Scheme"
    supersedes: "the Conditional number plate previously issued to CVS vehicles, which 'will continue to be produced and used for other vehicles in the conditional registration scheme, such as tractors' — so the predecessor plate is NOT dead, it merely lost this class of vehicle"
    fee: "$55 from 1 July 2024, which the agency states 'is the same price as all General Issue number plates'"
    region_encoding: none
    sources:
      - "https://www.nsw.gov.au/sites/default/files/noindex/2024-06/cvs-number-plate-fact-sheet.pdf  # Transport for NSW fact sheet 'Classic Registration Number Plate', June 2024, 2 pp (accessed 2026-08-02): the 1 July 2024 start, both plate dimensions, the 'Classic' legend and its stated purpose, the sequential off-the-shelf issuing rule, the $55 fee, the CVS-only eligibility and the fate of the Conditional plate"
    notes: >-
      THE NSW CLASSIC VEHICLE SCHEME PLATE, AND THE ONLY SERIES IN THIS FILE
      WITH A REAL DATE. `period_evidence: agency-stated-date` is earned: the
      agency's own dated fact sheet opens "From 1 July 2024, a new number plate
      will be available for vehicles in the Classic Vehicle Scheme (CVS)". Note
      the modelling wrinkle worth carrying forward: NSW runs TWO historic
      regimes — the Classic Vehicle Scheme (this plate) and the Historic Vehicle
      Scheme (a different, older plate) — and the fact sheet says in terms that
      this plate may not be used on HVS vehicles. The HVS plate is NOT authored:
      no fact sheet for it was obtained (recorded gap). `matching: recall-only`
      here is not laziness, it is the §2.7 test applied honestly — the regex is
      deliberately wider than whatever NSW issues, because what NSW issues is
      unpublished.
