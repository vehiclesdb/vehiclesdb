    matching: recall-only
    format:
      pattern: "INDONESIA 9"
      regex: '\AINDONESIA[ -]?\d\z'
      examples_reported: ["INDONESIA 1", "INDONESIA 2"]
    design:
      colour_note: "id.wikipedia: INDONESIA plates are always red, like government plates. Not confirmed elsewhere."
      rear_differs: false
    region_encoding: none
    sources:
      - "https://id.wikipedia.org/w/index.php?title=Tanda_Nomor_Kendaraan_Bermotor_Indonesia&oldid=30232020  # 'Dalam acara khusus, plat nomor kendaraan dinas Presiden Indonesia tidak menggunakan format RI 1, melainkan INDONESIA 1'; 'RI 1/INDONESIA 1: Presiden', 'RI 2/INDONESIA 2: Wakil Presiden'; INDONESIA plates 'selalu berwarna merah'. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
      - "https://en.wikipedia.org/w/index.php?title=Vehicle_registration_plates_of_Indonesia&oldid=1386292720  # 'INDONESIA 1 and INDONESIA 2 for the president and vice president, respectively', used on ceremonial occasions. Accessed 2026-11-25. period_evidence: secondary-wikipedia"
    notes: >-
      THE CEREMONIAL STATE PLATES: INDONESIA 1 (the President) and INDONESIA
      2 (the Vice-President), used on special occasions in place of RI 1 and
      RI 2, per both articles. Nothing in Perpol 7/2021 provides for them.

  - id: id-special-zz-2023
    class: government
    categories: [car, van]
    period: { start: 2023 }
    period_evidence: agency-stated-date
    period_note: >-
      Announced by the Dirregident Korlantas in June 2023 as replacing the RF
      plates; detikOto reported on 22 Dec 2023 that RF plates were no longer
      in circulation. Tier: official-press.
    # RECALL-ONLY: Perpol 7/2021 Lampiran F.4 leaves both the number and the
    # letters of these plates to the Kapolda ("diatur oleh Kapolda"). The ZZ
    # letters and the leading 1 come from one police official's spoken
    # description, not from any published allocation.
    matching: recall-only
    format:
      pattern: "L 1999 ZZL"
      regex: '\A[A-Z]{1,2}[ -]?1\d{0,3}[ -]?ZZ[A-Z]\z'
      known_third_letters:
        P: "Polri (police)"
        H: "pemerintah (civil government)"
        T: "TNI (armed forces)"
        D: "Angkatan Darat (army)"
      known_third_letters_source: "Dirregident Korlantas Brigjen Yusri Yunus, quoted by detikOto 29 Jun 2023 and 22 Dec 2023: 'yang tadinya RF saya ubah menjadi ZZ, untuk polisi jadi ZZP, pemerintah jadi ZZH, untuk TNI jadi ZZT'; 'Angkatan Darat ZZD'; 'pelat nomor khusus berkode ZZ akan menggunakan angka 1 di depan'."
      examples_synthetic: ["B 1234 ZZH", "B 1023 ZZP"]
    design:
      colour_note: "Not stated anywhere read. §VERIFIER V7."
      rear_differs: false
    region_encoding: "plates/_decode/id-region-codes.yml"
    sources:
      - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Pasal 70(3)f and 70(8): TNKB Khusus for service vehicles of TNI, Polri and government officials of certain echelons; Lampiran F.1e, F.4 (region code, number and letters set by the Kapolda; example for Polda Metro Jaya: region code B); Pasal 75(2) one-year validity. Accessed 2026-11-25. Evidence: statute"
      - "https://oto.detik.com/berita/d-6797777/kenapa-pelat-rf-harus-diganti-jadi-zz  # detikOto, 29 Jun 2023, Dirregident Brigjen Yusri Yunus: RF to ZZ, ZZP police, ZZD army, a leading 1; Khusus previously for echelon I-III. Accessed 2026-11-25. Evidence: official-press"
      - "https://oto.detik.com/berita/d-7103277/pelat-nomor-rf-tak-berlaku-lagi-diganti-pakai-kode-ini  # detikOto, 22 Dec 2023: RF no longer in circulation; ZZ only for echelon I and II officials of ministries, agencies, TNI and Polri; ZZP police, ZZH government, ZZT TNI, under 'Perpol 07'. Accessed 2026-11-25. Evidence: official-press"
    notes: >-
      SPECIAL PLATES FOR SENIOR OFFICIALS (TNKB Khusus): an ordinary-looking
      registration on a service vehicle used by an echelon I or II official of
      a ministry, agency, the armed forces or the police, issued for security
      and valid one year at a time. Since 2023 the series letters are ZZ plus
      a letter for the institution and the number starts with 1. The ZZ
      letters are an administrative choice, not printed in the regulation,
      which is why this series is recall-only.

  - id: id-special-rf-2012
    class: government
    categories: [car, van]
    period: { start: 2012, end: 2023 }
    period_evidence: instrument-in-force
    period_note: >-
      2012 is Perkap 3/2012, the earliest instrument read that defines the
      special plate for echelon I-III officials (it replaced a Kapolri decision
      of 31 January 2000, Skep/136/I/2000, not read). When RF letters were
      first used is not known. The end is the 2023 switch to ZZ
      (official-press).
    # RECALL-ONLY: RF is an administrative letter choice known from the press;
    # no instrument prints it.
    matching: recall-only
    format:
      pattern: "L 9999 RFL"
      regex: '\A[A-Z]{1,2}[ -]?\d{1,4}[ -]?RF[A-Z]\z'
      known_third_letters:
        P: "Polri (police) — official-press (the Dirregident Korlantas named RFP in 2023) and both articles"
        S: "civil officials — secondary-wikipedia"
        O: "civil officials below echelon II — secondary-wikipedia"
        H: "civil officials below echelon II — secondary-wikipedia"
        Q: "civil officials below echelon II — secondary-wikipedia"
        T: "armed forces (TNI) — secondary-wikipedia"
        D: "army — secondary-wikipedia"
        L: "navy — secondary-wikipedia"
        U: "air force — secondary-wikipedia"
      known_third_letters_note: >-
        id.wikipedia and en.wikipedia agree on all eight combinations; table in
        plates/_decode/id-service-codes.yml (rf_letters). CAUTION: id.wikipedia
        also reports RFA-RFZ in Jakarta Timur's ORDINARY series, so this
        recall-only regex matches some ordinary plates too.
      examples_synthetic: ["B 1234 RFP", "B 1234 RFS"]
    design:
      colour_note: "Not stated. Perkap 4/2006 Pasal 15(1)b gave Rahasia/Khusus plates a black ground with white letters."
      rear_differs: false
    region_encoding: "plates/_decode/id-region-codes.yml"
    sources:
      - "https://k3i.korlantas.polri.go.id/api/web/uploads/regulation_doc/perkap-no-3-tahun-2012-tentang-stnk-tnkb-rahasia.pdf  # Perkap 3/2012 Pasal 1 angka 11 (TNKB Khusus), Pasal 5 (echelon I-III of TNI, Polri, government), Pasal 16 (one year), Pasal 23 (replaces Skep/136/I/2000). Accessed 2026-11-25. Evidence: statute"
      - "https://kalsel.polri.go.id/perkap/2006/PERKAP%20NO%204%20TH%202006%20TTG%20PENOMORAN%20RANMOR.pdf  # Perkap 4/2006 Pasal 15(1)b: black ground, white letters for Rahasia/Khusus. Accessed 2026-11-25. Evidence: statute"
      - "https://www.kompas.com/tren/read/2022/06/17/080500365/mengenal-nomor-kendaraan-khusus-rf  # Kompas, 17 Jun 2022: plates whose final code begins with RF are the police's special and secret plates for certain officials. Accessed 2026-11-25. Evidence: secondary-press"
      - "https://oto.detik.com/berita/d-7103277/pelat-nomor-rf-tak-berlaku-lagi-diganti-pakai-kode-ini  # detikOto, 22 Dec 2023: RF no longer in circulation, RFP became ZZP. Accessed 2026-11-25. Evidence: official-press"
    notes: >-
      THE RF PLATES, the special plates' letters until 2023: an
      ordinary-looking registration whose series letters began with RF,
      given to echelon I-III officials. Misuse made them notorious, which the
      police gave as the reason for replacing them with ZZ and narrowing
      eligibility to echelon I-II. Only RFP is attributed to a police source;
      the other seven RF combinations are carried at secondary-wikipedia tier.

  # =========================================================================
  # TRIAL PLATES — the dealer and manufacturer plate.
  # =========================================================================
  - id: id-trial-tckb-2006
    class: dealer
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2006 }
    period_evidence: instrument-in-force
    period_note: "Perkap 4/2006 Pasal 14 is the earliest instrument read; Perpol 7/2021 Pasal 78-81 and Lampiran K continue it and add the three-letter combinations."
    matching: strict
    format:
      pattern: "L 9999 XX"
      regex: '\A[A-Z]{1,2}[ -]?\d{1,4}[ -]?(?:XX|XY|YY|YX|XXX|XYY|YYX|YXY|YYY|YXX)\z'
      grammar_evidence: statute
      grammar: >-
        Pasal 80(1): the TCKB carries "a. kode wilayah; b. nomor/angka; dan c.
        seri huruf". Lampiran K.1: "nomor registrasi sementara yang ditandai
        dengan huruf seri XX, XY, YY, dan YX"; K.3: where a Polda is authorised
        for three-letter series and the two-letter ones are used up, "XXX, XYY,
        YYX, YXY, YYY dan YXX" — exactly those six; XXY and XYX are not listed.
        The three-letter forms date from 2021; the regex cannot carry dates.
      examples_synthetic: ["B 1234 XY", "L 12 YX", "B 5001 XYY"]
    design:
      background: { color: "#FFFFFF", hex_basis: nominal, evidence: statute }
      foreground: "#CC0000"
      foreground_evidence: statute
      band: { side: none }
      rear_differs: false
    region_encoding: "plates/_decode/id-region-codes.yml"
    sources:
      - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Pasal 78 (purposes), 79 (to sales, manufacturing, assembly, import businesses and vehicle research bodies; at most three uniformed staff), 79(11) STCK valid 14 days, 80(1)-(5) content, front and rear, valid while the business operates, 'TCKB berwarna dasar putih dan tulisan merah'; Lampiran K. Accessed 2026-11-25. Evidence: statute"
      - "https://kalsel.polri.go.id/perkap/2006/PERKAP%20NO%204%20TH%202006%20TTG%20PENOMORAN%20RANMOR.pdf  # Perkap 4/2006 Pasal 14(2): white ground, red letters and digits, series XX, XY, YY, YX after the number. Accessed 2026-11-25. Evidence: statute"
    notes: >-
      TRIAL PLATES (Tanda Coba Kendaraan Bermotor), Indonesia's dealer and
      manufacturer plate: red letters on white, the region code, a number and
      one of the reserved X/Y series. For an unregistered vehicle moved from
      dealer, distributor or factory, test-driven before sale, tested in
      research, or delivered to the buyer (Pasal 78(2)). The plate stays with
      the business while it operates; the accompanying certificate (STCK) is
      valid 14 days at a time. Indonesia has no separate dealer plate.

  # =========================================================================
  # FOREIGN VEHICLES CROSSING THE BORDER — silver.
  # =========================================================================
  - id: id-crossborder-lbn-2021
    class: temporary
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2021 }
    period_evidence: instrument-in-force
    period_note: "Perpol 7/2021 Pasal 70-74 is the instrument read. Perkap 5/2012 was not read, so LBN plates may be older."
    # RECALL-ONLY: Pasal 72(1) lists the plate's content — region code,
    # registration number, operating code, expiry — but not its order or the
    # form of the registration number. The regex follows the listed order with
    # a wide middle group; it is a shape guess, not the authority's grammar.
    matching: recall-only
    format:
      pattern: "LL 9999 AK"
      regex: '\A[A-Z]{1,2}[ -]?[A-Z0-9]{1,10}[ -]?(?:AK|MK|PN|MS|PAM)\z'
      operating_codes:
        AK: "angkutan antar negara — international transport"
        MK: "misi kemanusiaan — humanitarian mission"
        PN: "pertemuan antar negara — intergovernmental meeting"
        MS: "pariwisata, olahraga, misi sosial — tourism, sport, social mission"
        PAM: "pengamanan pejabat negara asing — security for a visiting foreign official"
      operating_codes_source: "Lampiran L, PDF p. 107, read from the page image"
      examples_synthetic: ["KB 1234 AK"]
    design:
      background: { color: "#C0C0C0", hex_basis: nominal, evidence: statute }
      foreground: "#000000"
      foreground_evidence: statute
      band: { side: none }
      rear_differs: false
      mounting: "Pasal 72(4): on the windscreen and rear window, upper left, for vehicles other than motorcycles; in a visible place on motorcycles"
    region_encoding: "plates/_decode/id-region-codes.yml"
    sources:
      - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Pasal 70(3)c and 70(6); 71 (STNK LBN: 30 days, extendable by 30 days up to six times, valid only in the issuing province); 72 (content, 'berwarna dasar perak dengan tulisan hitam', mounting); 73-74 (issue procedure, recommendation from a ministry, agency or regional government); Lampiran L (operating codes). Accessed 2026-11-25. Evidence: statute"
    notes: >-
      FOREIGN VEHICLES OPERATED TEMPORARILY IN INDONESIA (TNKB Lintas Batas
      Negara): black on SILVER — the only silver plate in the system — for
      international transport, intergovernmental meetings, humanitarian
      missions, tourism and sport, social and economic purposes in
      border areas with poor infrastructure, and the security details of
      visiting foreign officials. Valid 30 days, renewable up to six times,
      and only inside the province that issued it. The operating-purpose code
      is printed on the plate.

  # =========================================================================
  # CUSTOMS-DEFERRED IMPORTS, 2006-2021 — historical.
  # =========================================================================
  - id: id-customs-deferred-2006
    class: standard
    categories: [car, van, truck, bus, motorcycle]
    period: { start: 2006, end: 2021 }
    period_evidence: instrument-dated-both-ends
    period_note: "Perkap 4/2006 (May 2006) to its repeal by Perpol 7/2021 (5 May 2021), whose Lampiran E.1 leaves the letters of these registrations to the Kapolda."
    matching: strict
    format:
      pattern: "L 9999 LX"
      regex: '\A[A-Z]{1,2}[ -]?\d{1,4}[ -]?[A-Z]X\z'
      grammar_evidence: statute
      grammar: >-
        Perkap 4/2006 Pasal 13: numbering of vehicles whose import duty is
        deferred (Formulir B) follows the allocation per vehicle group, and
        "Huruf di belakang angka pendaftaran ... menggunakan kode AX sampai
        dengan ZX".
      examples_synthetic: ["B 1234 CX"]
    design:
      background_note: "Pasal 13(2): the plate 'disesuaikan dengan status kepemilikan' — the colour of the owner's class."
      rear_differs: false
    region_encoding: "plates/_decode/id-region-codes.yml"
    sources:
      - "https://kalsel.polri.go.id/perkap/2006/PERKAP%20NO%204%20TH%202006%20TTG%20PENOMORAN%20RANMOR.pdf  # Perkap 4/2006 Pasal 13(1)-(3). Accessed 2026-11-25. Evidence: statute"
      - "https://korlantas.polri.go.id/wp-content/uploads/2021/05/PERATURAN-POLRI-NOMOR-7-TAHUN-2021-TTG-REGIDENT-RANMOR-TGL-5-MEI-2021.pdf  # Pasal 91 (repeal of Perkap 4/2006); Lampiran E.1-E.2 (international bodies with deferred duty: region code, number by vehicle type, letters set by the Kapolda; plate according to ownership status). Accessed 2026-11-25. Evidence: statute"
    notes: >-
      VEHICLES IMPORTED WITH IMPORT DUTY DEFERRED (Formulir B), 2006-2021: an
      ordinary region-code registration whose series letters ran from AX to
      ZX, the X marking the deferred-duty status. Used chiefly for vehicles of
      international bodies and others entitled to duty facilities. Since 2021
      the letters are a Kapolda allocation and no longer national, so no
      current series is authored.
