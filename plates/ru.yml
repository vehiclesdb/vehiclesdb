# ---------------------------------------------------------------------------
# SCRIPT — read fact 1-3 above first.
# ---------------------------------------------------------------------------
script:
  printed: "Cyrillic (Russian): twelve letters that coincide in shape with Latin ones; Latin D, T and CD on diplomatic plates"
  recorded_as: "the GLYPH FOLD — each of the twelve Cyrillic letters written as the Latin capital it is drawn as"
  homoglyph_map:
    # Cyrillic codepoint -> the Latin letter it is drawn as. Injective.
    "А U+0410": A
    "В U+0412": B
    "Е U+0415": E
    "К U+041A": K
    "М U+041C": M
    "Н U+041D": H
    "О U+041E": O
    "Р U+0420": P
    "С U+0421": C
    "Т U+0422": T
    "У U+0423": Y
    "Х U+0425": X
  consumer_rule: >-
    Upcase the input (Cyrillic lower case included), replace each of the twelve
    Cyrillic capitals above by its Latin twin, delete separators, then match.
    Latin input needs no change. Do not fold any other character.
  traps: >-
    By sound, В is V, Н is N, Р is R, С is S and У is U; on a plate they are B,
    H, P, C and Y. "А 123 ВС 77" is "A123BC77", never "A123VS77".
  codepoints_measured:
    letters: "ГОСТ Р 50577-2018 п. 3.7 in the legalacts.ru HTML: all twelve CYRILLIC (U+0410 ... U+0425); D LATIN U+0044. ГОСТ Р 50577-93 п. 3.7: the same twelve, CYRILLIC; D LATIN."
    cd: "«CD» (type 9, order № 766 п. 2.1, ГОСТ п. 3.3): LATIN C U+0043 + LATIN D U+0044 in every copy measured"
    d: "«D» (types 10, 11): LATIN U+0044 in every copy measured"
    t: "«T» (types 10, 11): LATIN T U+0054 in the ГОСТ text and in pddmaster's order text; CYRILLIC Т U+0422 in Garant's order text (§VERIFIER V4). Folds to T either way."
    legend: "The п. 3.3 legend letters М (letter), К (classic) and С (sport), and the Т of type 19, are CYRILLIC."
  rationale:
    evidence: secondary-dated
    quote: "буквы, по написанию соответствующие латинским, чтобы не требовалась замена номеров при поездке за границу"
    source: "https://www.zr.ru/archive/zr/1993/09/na-znakie-rossiiskii-flagh  # За рулём № 9/1993, «На знаке — Российский флаг», p. 12. Contemporaneous press, not an instrument. Accessed 2026-11-26"
  source: "https://legalacts.ru/doc/gost-r-50577-2018-natsionalnyi-standart-rossiiskoi-federatsii-znaki-gosudarstvennye/  # п. 3.7; codepoints measured from the served HTML. Accessed 2026-11-26"

charset_defaults:
  letters_cyrillic: "АВЕКМНОРСТУХ"
  letters_latin_fold: [A, B, C, E, H, K, M, O, P, T, X, Y]
  latin_never_on_current_plates: [D, F, G, I, J, L, N, Q, R, S, U, V, W, Z]
  latin_never_note: "D appears only on diplomatic types 9-11 (as D and in CD). The others never appear on a post-1993 Russian plate."
  source: "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.7. Accessed 2026-11-26"

# ---------------------------------------------------------------------------
# COMMON PHYSICAL SPECIFICATION (ГОСТ Р 50577-2018 разделы 3-4, приложения Б-Ж)
# ---------------------------------------------------------------------------
common:
  groups:
    note: "п. 3.1 divides vehicles into six groups by the plates they use."
    values:
      - "группа 1 — vehicles of Russian and foreign legal and natural persons and stateless persons, except group 3 (types 1-4В)"
      - "группа 2 — military units and federal bodies with military service; prototypes of military equipment (types 5-8)"
      - "группа 3 — diplomatic missions, consular posts, international organisations and their staff accredited with the MFA (types 9-11)"
      - "группа 4 — «транспортные средства, временно допущенные к участию в дорожном движении» (types 15-19)"
      - "группа 5 — internal-affairs bodies and Росгвардия, for vehicles with blue livery, except group 2 (types 20-22)"
      - "группа 6 — classic (retro) and sport vehicles (types 23-28)"
  typeface:
    rule: >-
      п. 3.8: "Форма и характер начертания цифр и букв, применяемых на
      регистрационных знаках типов 1 - 11, 15, 19 - 28, должны соответствовать
      рисункам Б.1 и В.1 приложений Б и В" — a statutory DRAWING of the twelve
      letters and ten digits, with no named typeface. Stroke widths are set by
      Таблица 1; "Остальные размеры устанавливаются в конструкторской
      документации на регистрационные знаки, согласованной с Министерством
      внутренних дел".
    paper_types: "Types 16-18 (paper transit): face «шрифтом ЖР5 по ГОСТ 3489.2» (журнальная рубленая), reverse «шрифтом Бл3 по ГОСТ 3489.17» (Балтика)."
    stroke_min_mm:
      # character height (mm) -> minimum stroke width (mm), Таблица 1
      "15": 2.2
      "20": 3.0
      "40": 6.0
      "45": 7.0
      "58": 9.0
      "76": 11.0
    border_stroke_mm: "3.0 ± 0.5"
    font_licence: "No licensable font is mandated; renders follow the statutory drawings (PRD-PLATES §6)."
  relief: "п. 3.6: letters, digits and border raised (trapezoidal section), 1.0-2.0 mm above the field, the same height on one plate; not required for types 16-18 nor for «RUS»."
  material: "п. 4.3: aluminium alloy, stamped, with retroreflective and paint coatings; types 3 and 5-8 may be ferrous metal; type 15 is laminated paper at least 400 µm thick; types 16-18 printed paper. п. 4.4: sheet (1.0 ± 0.1) mm without coating."
  retroreflective: "п. 4.6: the field is retroreflective on every type except 5-8 and 15-18; types 3 and 4А for vehicles used only off public roads may be made without it."
  flag_and_rus:
    current: >-
      п. 3.4 (Изменение № 2, in force 01.01.2025, as corrected): "На
      регистрационных знаках со световозвращающим покрытием, за исключением
      регистрационного знака типа 4В, обязательно наличие изображения
      Государственного флага Российской Федерации (наличие изображения
      Государственного флага Российской Федерации на регистрационных знаках
      типов 9 - 11 факультативно)." Note: types 1Б, 4, 19, 20, 21 and 22 made
      before 31.12.2024 to the earlier rules may still be issued and used.
    before_2025: "In the 2018 drawings the flag appears on types 1, 1А, 2, 3, 4, 4А, 4Б, 15, 16, 19, 23-28, and not on 1Б, 9-11, 20-22 or the black military types."
    rus: "Every drawing prints «RUS» in the region box, under the code (types 16-18 too). Height 20 mm on the 112 mm plates, 15 mm on the 145 mm plates."
    gost_1993: "ГОСТ Р 50577-93 п. 3.4: «RUS» required on types 1, 1Б, 2, 4-6, 8-10, 15-22; the flag merely permitted on types 1, 2 and 15 — «верхняя полоса белого цвета, средняя - синего цвета и нижняя - красного цвета»."
  holes: >-
    Ж.5: "допускается наличие отверстий диаметром не более 7 мм. На однострочном
    знаке допускается не более двух отверстий, на двухстрочном знаке не более
    четырех отверстий. Отверстия не должны находиться на символах и окантовке."
    (Holes at most 7 mm; at most two on a one-line plate and four on a two-line
    plate; never on characters or the border.)
  security_marks: >-
    Приложение Е: anti-counterfeit elements built into the retroreflective
    sheeting by laser burning or interlayer printing; "Каждый защитный элемент
    должен иметь форму квадрата размером 10,0 ± 0,1 x 10,0 ± 0,1 мм, внутри
    которого размещается надпись "RUS"" (letters 3.5 ± 0.1 mm high, stroke
    0.7 ± 0.05 mm), darker than the field in reflected light; their placement is
    the same on every type (Е.1.8). Reverse: manufacturer's trademark (п. 4.11)
    and an optional maker/date/serial marking 5 mm high in the lower-left corner
    (Е.2).
  mounting: "Ж.4.4: rear plate lower edge at least 300 mm above the ground (motorcycles, scooters, mopeds and snowmobiles 200 mm; personal mobility devices 150 mm), upper edge at most 1200 mm. Ж.4.7: legible at 20 m at night under the vehicle's plate lamp. Paper transit types 16-18 go inside the windscreen, right of centre (Ж.6)."
  tolerance: "п. 3.9: limit deviations IT16/2 per ГОСТ 25346."
  chromaticity:
    note: >-
      Таблица Г.2 gives each retroreflective field colour as the four corner
      points of a CIE 1931 x,y region plus a minimum luminance factor (measured
      under "Д(55) МЭК" at 45°). A region plus a luminance floor does not fix a
      display colour, so every hex in this file is `nominal` and this table is
      the specification. Black and the characters' white are set "по
      контрольному образцу" (by a reference sample), not numerically.
    boxes:
      "Белый (white)":   { corners: [[0.355, 0.355], [0.305, 0.305], [0.285, 0.325], [0.335, 0.375]], luminance_min: 0.35 }
      "Желтый (yellow)": { corners: [[0.545, 0.454], [0.487, 0.423], [0.427, 0.483], [0.465, 0.534]], luminance_min: 0.27 }
      "Красный (red)":   { corners: [[0.690, 0.310], [0.595, 0.315], [0.569, 0.341], [0.655, 0.345]], luminance_min: 0.05 }
      "Синий (blue)":    { corners: [[0.144, 0.030], [0.244, 0.202], [0.190, 0.247], [0.066, 0.208]], luminance_min: 0.01 }
    retroreflection: "Таблица Г.1, minimum coefficient of retroreflection cd/(m²·lx) at 0°12' observation and 5°/30°/45° entrance: white 70/35/6, yellow 50/25/4, red 10/4/0.8, blue 4/1.7/1."
  shape_collisions:
    note: >-
      Several types share one STRING shape and differ only in colour, size or
      layout, which a typed string cannot carry. Computed over the instrument's
      own examples: "0000 ММ 55" is type 3 (tractor), 4 (motorcycle), 5
      (military, one line), 7 and 8 (military); "ММ 0000 55" is type 2 (trailer)
      or 6 (military trailer), and the same eight characters read "ММ 55 0000"
      for types 4А and 16-18; "К 000 ММ 55" (classic motorcycle, type 25) and
      "С 000 ММ 55" (type 28 as drawn) are also valid type 1 strings, because К
      and С are among the twelve letters. A string match therefore names a SET
      of possible types; the gem's ordering puts the ordinary type first.
    source: "Computed from the regex_strict of each series and the examples printed in ГОСТ Р 50577-2018 приложение А."
  colours_by_type: "Таблица 2: white field, black characters — 1, 1А, 2-4, 4А, 4Б, 4В, 16-19, 23-28; YELLOW field — 1Б; BLACK field, white characters — 5-8; RED field, white characters — 9-11; white field with a yellow region box — 15; BLUE field, white characters — 20-22."
  sources:
    - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 пп. 3.1, 3.4, 3.6, 3.8 (Таблица 1), 3.9, 4.3-4.6, 4.8 (Таблица 2), 4.11, приложения Б-Ж; Изменения № 1 and № 2; Поправки. Accessed 2026-11-26"
    - "https://legalacts.ru/doc/gost-r-50577-93-gosudarstvennyi-standart-rossiiskoi-federatsii/  # ГОСТ Р 50577-93 п. 3.4, 3.7 (consolidated text as amended 2001 and 2009). Accessed 2026-11-26"

# ---------------------------------------------------------------------------
# HISTORY — instruments and systems, oldest first. Series for the Soviet
# systems are at the end of `series`, all recall-only.
# ---------------------------------------------------------------------------
history:
  - period: "1931-1934"
    system: "first all-Union plate: «буква — две цифры — две цифры», black on white"
    evidence: secondary-wikipedia
  - period: "1934-1936"
    system: "digits with the region (Дортранс) name written beneath"
    evidence: secondary-wikipedia
  - period: "1936/1946-1959"
    system: "two-letter region index + two pairs of digits («LL 99-99»); from 1946 light-orange field, black characters; long front and square rear plates"
    evidence: secondary-wikipedia
    series: ru-ussr-1946
  - period: "1959-1980"
    system: "«две цифры — две цифры три буквы», black field, white characters; first two letters = region"
    evidence: secondary-wikipedia
    series: ru-ussr-1959
  - period: "1980-1994"
    system: "ГОСТ 3207-77 (in force 01.01.1980, replacing ГОСТ 3207-65): black on white; private «а 1234 МО» (small series letter, four digits, two-letter region), state «1234 МОА»"
    evidence: "standard number and dates: catalogue card (files.stroyinf.ru); grammars: secondary-wikipedia"
    series: [ru-ussr-private-1980, ru-ussr-state-1980]
  - period: "1994-"
    system: "ГОСТ Р 50577-93 — постановление Госстандарта России от 29.06.1993 № 165: «взамен ГОСТ 3207-77 с датой введения в действие с 1 января 1994 г.», application allowed from approval. Twelve Cyrillic letters (п. 3.7), the two-digit region code and «RUS» in a box on the right. Old plates did not have to be replaced."
    evidence: instrument-in-force
    notes: >-
      Изменение № 2 (постановление Госстандарта от 19.11.2001 № 465-ст) deleted
      types 11-14 — per За рулём 9/1993, yellow plates for foreign
      correspondents (letter «К»), trade representatives («М»), and other
      foreign owners («2 буквы — 3 цифры — 1 буква»). Изменение № 3 (приказ
      Ростехрегулирования от 22.05.2009 № 164-ст, in force 01.11.2009).
  - period: "2017-"
    system: "Приказ МВД № 766 (in force 21.12.2017) replaces the code lists of приказ МВД № 282 of 28.03.2002 (repealed by приказ № 905 of 01.12.2017)"
    evidence: instrument-in-force
  - period: "2019/2020-"
    system: "ГОСТ Р 50577-2018 replaces ГОСТ Р 50577-93 (§VERIFIER V1): adds types 1А (290 x 170 square plate), 4А, 4Б, 11 (diplomatic motorcycle), 23-28 (classic and sport); the flag becomes obligatory on retroreflective plates"
    evidence: instrument-in-force
  - period: "2020-"
    system: "283-ФЗ and the 2019 Правила (in force 01.01.2020): region code = owner's region; plates may be made by registered private manufacturers; no reserved combinations"
    evidence: instrument-in-force
history_sources:
    - "https://legalacts.ru/doc/postanovlenie-gosstandarta-rossii-ot-29061993-n-165/  # Gosstandart resolution № 165 of 29.06.1993. Accessed 2026-11-26"
    - "https://files.stroyinf.ru/Index/46/46183.htm  # ГОСТ 3207-77 catalogue card: «Дата введения 01.01.1980», «Дата окончания срока действия 01.01.1994», «Взамен ГОСТ 3207-65». Text not available. Accessed 2026-11-26"
    - "https://www.zr.ru/archive/zr/1993/09/na-znakie-rossiiskii-flagh  # За рулём № 9/1993: 16 types in four groups, 89 regions, yellow foreign plates «К» and «М». Secondary (period press). Accessed 2026-11-26"
    - "https://ru.wikipedia.org/w/index.php?title=Регистрационные_знаки_транспортных_средств_в_СССР&oldid=155954477  # Soviet systems 1931-1994; the section is marked «нет ссылок в разделе». secondary-wikipedia; accessed 2026-11-26"

not_in_russia:
  personalised_plates: "None: Правила госрегистрации п. 41 — numbers are assigned without reserving series or combinations for anyone (fact 5)."
  electric_vehicle_plates: "No EV-specific type in ГОСТ Р 50577-2018 (types 1-28 checked)."
  electronic_plates: "Nothing in the standard or the orders read provides for electronic or RFID plates. Not established beyond that."
  owner_binding: "Plates are not personal to the owner; a number may be kept for one year only (Правила п. 45)."

series:

  # =========================================================================
  # GROUP 1 — ordinary vehicles (types 1-4В)
  # =========================================================================
  - id: ru-standard-1994
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 1994 }
    period_evidence: enabling-instrument
    period_note: >-
      1994 is ГОСТ Р 50577-93's in-force date (1 January 1994); the grammar
      "М 000 ММ 55 или М 000 ММ 555" is identical in ГОСТ Р 50577-93 and
      ГОСТ Р 50577-2018 п. 3.3 (type 1). What changed since is the drawing (the
      2018 drawing, the obligatory flag) and the three-digit code rule.
    matching: strict
    format:
      pattern: "L 999 LL 99"
      pattern_note: "Also with a three-digit region code: \"L 999 LL 999\". The pattern DSL has no optional group; the regexes carry both."
      regex: '\A[A-Z] ?\d{3} ?[A-Z]{2} ?\d{2,3}\z'
      regex_strict: '\A[ABCEHKMOPTXY] ?\d{3} ?[ABCEHKMOPTXY]{2} ?(?:0[1-9]|[1-9]\d|[1-9](?:0[1-9]|[1-9]\d))\z'
      grammar: >-
        п. 3.3, type 1 (однострочный): "М 000 ММ 55 или М 000 ММ 555", where
        "0 и М - соответственно цифра и буква, означающие номер и серию" and 5 is
        a digit of the region code. Reading: series letter, three-digit number,
        two series letters, region code. The three letters together are the
        SERIES; the digits are the NUMBER within it.
      region_code_rule: "Two digits on every type; three digits on type 1 only, first digit 1-9 (Приложение № 1 note, as amended by приказ МВД № 130 of 2020). Never 00."
      charset:
        letters: [A, B, C, E, H, K, M, O, P, T, X, Y]
        note: "The glyph fold of the twelve Cyrillic letters of п. 3.7."
      examples_instrument:
        - { printed: "М 976 ММ 77", folded: "M976MM77", source: "ГОСТ Р 50577-2018 рисунок А.1" }
        - { printed: "М 976 ММ 777", folded: "M976MM777", source: "рисунок А.2" }
    design:
      plate: { w: 520, h: 112, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Белый" }
      foreground: "#000000"
      border: { color: "#000000", note: "окантовка, raised; stroke 3.0 ± 0.5 mm" }
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "framed box: region code over «RUS» and the Russian flag (white-blue-red)" }
      emblem: { present: false }
      rear_differs: false
      display: "front and rear (Ж.1)"
    region_encoding: "plates/_decode/ru-regions.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.1 (type 1: «легковых, грузовых автомобилей и автобусов (кроме отнесенных к типу 1Б)»), п. 3.3, п. 3.7, Таблица 2; рисунки А.1-А.2 (520 x 112; 76 / 58 / 58 / 20). Accessed 2026-11-26"
      - "https://legalacts.ru/doc/gost-r-50577-93-gosudarstvennyi-standart-rossiiskoi-federatsii/  # ГОСТ Р 50577-93 п. 3.3 type 1: the same structure string. Accessed 2026-11-26"
      - "http://publication.pravo.gov.ru/file/pdf?eoNumber=0001202004080031  # приказ МВД № 130: three-digit first digit «1» - «9», type 1 only. Accessed 2026-11-26"
    notes: >-
      THE ORDINARY RUSSIAN PLATE. Front and rear on cars, goods vehicles and
      buses. A vehicle with a non-standard mounting place may carry the square
      type 1А instead (ru-standard-two-line-2020), and since the 2024 correction
      type 1А may replace type 1 on any car, goods vehicle or bus.

  - id: ru-standard-two-line-2020
    class: standard
    categories: [car, van, truck, bus]
    period: { start: 2020 }
    period_evidence: enabling-instrument
    period_note: >-
      Type 1А is new in ГОСТ Р 50577-2018 (§VERIFIER V1 for the standard's date).
      Its note "Регистрационные знаки типа 1А ... выдаются только изготовителями
      государственных регистрационных знаков" was added by Изменение № 1 (in
      force 04.08.2020), and private manufacturers exist only since 283-ФЗ came
      into force on 01.01.2020; 2020 is that enabling date, not a dated first
      issue.
    matching: strict
    format:
      pattern: "L 999 LL 99"
      pattern_note: "Two lines: \"М 000\" over \"ММ 55\" (or \"ММ 555\"). Same serial as type 1."
      regex: '\A[A-Z] ?\d{3} ?[A-Z]{2} ?\d{2,3}\z'
      regex_strict: '\A[ABCEHKMOPTXY] ?\d{3} ?[ABCEHKMOPTXY]{2} ?(?:0[1-9]|[1-9]\d|[1-9](?:0[1-9]|[1-9]\d))\z'
      grammar: "п. 3.3, type 1А (двухстрочный): \"М 000 / ММ 55 или ММ 555\"."
      examples_instrument:
        - { printed: "В 555 РХ 39", folded: "B555PX39", source: "рисунок А.3" }
        - { printed: "В 555 РХ 125", folded: "B555PX125", source: "рисунок А.4" }
    design:
      plate: { w: 290, h: 170, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Белый" }
      foreground: "#000000"
      characters: { digit_height_mm: 58, letter_height_mm: 58, region_height_mm: 45, rus_height_mm: 15 }
      band: { side: right, content: "region box in the lower right: code over «RUS» and flag" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/ru-regions.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.1 (type 1А: «с нестандартным местом крепления»), п. 3.3; рисунки А.3-А.4 (290 x 170; 58 / 58 / 45 / 15); Изменение № 1 note to 3.3; Ж.1 note 1 as corrected (ИУС 1-2024). Accessed 2026-11-26"
    notes: >-
      The square ("американский", in common speech) car plate for vehicles whose
      rear recess cannot take a 520 mm plate. Made only by registered plate
      manufacturers, never handed out by the registration unit. Ж.1 note 1 (as
      corrected): "На легковых, грузовых автомобилях и автобусах допускается
      установка регистрационных знаков типа 1А вместо регистрационных знаков
      типа 1."

  - id: ru-taxi-1994
    class: taxi
    categories: [car, bus]
    period: { start: 2009 }
    period_evidence: instrument-in-force-upper-bound
    period_note: >-
      Type 1Б is in ГОСТ Р 50577-93's consolidated text as amended in 2001 and
      2009, so it existed by 01.11.2009 at the latest; whether it was in the 1993
      original is not established (§VERIFIER V7). The id keeps the 1994 system
      name.
    matching: strict
    format:
      pattern: "LL 999 99"
      regex: '\A[A-Z]{2} ?\d{3} ?\d{2}\z'
      regex_strict: '\A[ABCEHKMOPTXY]{2} ?\d{3} ?(?:0[1-9]|[1-9]\d)\z'
      grammar: "п. 3.3, type 1Б (однострочный): \"ММ 000 55\" — two series letters, three-digit number, region code."
      examples_instrument:
        - { printed: "ОМ 958 99", folded: "OM95899", source: "рисунок А.5" }
    design:
      plate: { w: 520, h: 112, unit: mm }
      background: { color: "#F5C400", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Желтый" }
      foreground: "#000000"
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "region code over «RUS»; the flag since Изменение № 2 (2025)" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/ru-regions.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.1 (type 1Б: «легковых такси, транспортных средств, оборудованных для перевозок более восьми человек, осуществляющих перевозку на основании лицензии»), п. 3.3, Таблица 2 (Желтый / Черный); рисунок А.5 (2018, no flag) and its Изменение № 2 replacement (flag). Accessed 2026-11-26"
      - "https://legalacts.ru/doc/gost-r-50577-93-gosudarstvennyi-standart-rossiiskoi-federatsii/  # ГОСТ Р 50577-93 п. 3.3 type 1Б «ММ 000 55» (consolidated text). Accessed 2026-11-26"
    notes: >-
      THE YELLOW PLATE: taxis and vehicles carrying more than eight people under
      a licence. Note the shape: two letters BEFORE the number and no third
      letter — "ОМ 958 99", not "О 958 М ...". Yellow plates made before
      31.12.2024 without the flag stay valid (п. 3.4 note).

  - id: ru-trailer-1994
    class: trailer
    categories: [trailer]
    period: { start: 1994 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "LL 9999 99"
      regex: '\A[A-Z]{2} ?\d{4} ?\d{2}\z'
      regex_strict: '\A[ABCEHKMOPTXY]{2} ?\d{4} ?(?:0[1-9]|[1-9]\d)\z'
      grammar: "п. 3.3, type 2 (однострочный): \"ММ 0000 55\"."
      examples_instrument:
        - { printed: "ММ 9768 77", folded: "MM976877", source: "рисунок А.6" }
    design:
      plate: { w: 520, h: 112, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Белый" }
      foreground: "#000000"
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "region code over «RUS» and flag" }
      emblem: { present: false }
      rear_differs: false
      display: "rear only (Ж.1)"
    region_encoding: "plates/_decode/ru-regions.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.1 (type 2: «автомобильных прицепов и полуприцепов»), п. 3.3; рисунок А.6. Accessed 2026-11-26"
      - "https://legalacts.ru/doc/gost-r-50577-93-gosudarstvennyi-standart-rossiiskoi-federatsii/  # ГОСТ Р 50577-93 type 2 «ММ 0000 55». Accessed 2026-11-26"
    notes: "Car trailers and semi-trailers. The same string shape as the military trailer type 6 (black field)."

  - id: ru-tractor-1994
    class: agricultural
    categories: [agricultural]
    period: { start: 1994 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "9999 LL 99"
      pattern_note: "Two lines: \"0000\" over \"ММ 55\"."
      regex: '\A\d{4} ?[A-Z]{2} ?\d{2}\z'
      regex_strict: '\A\d{4} ?[ABCEHKMOPTXY]{2} ?(?:0[1-9]|[1-9]\d)\z'
      grammar: "п. 3.3, type 3 (двухстрочный): \"0000 / ММ 55\"."
      examples_instrument:
        - { printed: "3773 ММ 55", folded: "3773MM55", source: "рисунок А.7" }
    design:
      plate: { w: 288, h: 206, unit: mm }
      background: { color: "#FFFFFF", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Белый" }
      foreground: "#000000"
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "region box lower right: code over «RUS» and flag" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/ru-regions.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.1 (type 3: «тракторов, самоходных дорожно-строительных и иных машин и прицепов (полуприцепов) к ним»), п. 3.3; рисунок А.7 (288 x 206); п. 4.3 (ferrous metal allowed); п. 4.6 note (may lack retroreflection when used only off public roads). Accessed 2026-11-26"
      - "https://www.zr.ru/archive/zr/1993/09/na-znakie-rossiiskii-flagh  # 1993: «288Х206» for agricultural machinery. Secondary. Accessed 2026-11-26"
    notes: "Tractors, self-propelled road-building and other machines, and their trailers. The string shape is the same as types 4, 5, 7 and 8; only colour and size tell them apart."

  - id: ru-motorcycle-1994
    class: motorcycle
    categories: [motorcycle]
    period: { start: 1994 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "9999 LL 99"
