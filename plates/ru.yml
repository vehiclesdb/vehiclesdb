    средств. Типы и основные размеры. Технические требования»
  approved: "Приказ Росстандарта от 04.09.2018 № 555-ст («взамен ГОСТ Р 50577-93»)"
  in_force: "4 August 2020 per order № 555-ст, «с правом досрочного применения»; the standard's own first page prints 2019-01-01 (see §VERIFIER V1)"
  developed_by: "ФКУ НИЦ БДД МВД России; внесён ТК 278 «Безопасность дорожного движения»"
  amendments:
