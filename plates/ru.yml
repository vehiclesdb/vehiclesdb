# plates/ru.yml — Russia (PRD-PLATES gate L3; the six-largest-markets programme).
#
# EVERY type, grammar, dimension, colour, letter-set and class claim in this file
# is read from one of three primary texts, quoted at the point of use:
#
#   1. ГОСТ Р 50577-2018 «Знаки государственные регистрационные транспортных
#      средств. Типы и основные размеры. Технические требования» — the national
#      standard. Utverzhden приказом Росстандарта от 04.09.2018 № 555-ст;
#      Изменение № 1 (№ 302-ст of 26.06.2020, in force 04.08.2020); Изменение
#      № 2 (№ 1740-ст of 22.11.2024, in force 01.01.2025); Поправки (ИУС 1-2024,
#      4-2025, 5-2026). Read in the official Standartinform 2018 edition with
#      the changes appended (58-page PDF); every drawing in Приложение А was read
#      from the page images for its millimetres.
#   2. Приказ МВД России от 05.10.2017 № 766 «О государственных регистрационных
#      знаках транспортных средств» — the region codes (Приложение № 1, decoded in
#      plates/_decode/ru-regions.yml) and the diplomatic codes (Приложение № 2,
#      plates/_decode/ru-diplomatic-codes.yml), with all eleven amending orders,
#      read from the SIGNED SCANS on publication.pravo.gov.ru.
#   3. Федеральный закон от 03.08.2018 № 283-ФЗ and the Правила государственной
#      регистрации (постановление Правительства РФ от 21.12.2019 № 1764), both
#      in force 01.01.2020 — what the number is, what the region code means,
#      and the ban on reserved combinations. Read in full-text copies.
#
# Full research notes, every fetch with its URL and HTTP status, and every
# failure: vehiclesdb-plates-inbox/ru-2026-11-26/ (RESEARCH-data.md, sources/).
#
# ─────────────────────────────────────────────────────────────────────────────
# SIX STRUCTURAL FACTS THAT SHAPE THIS FILE
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. THE PLATE ALPHABET IS TWELVE CYRILLIC LETTERS, BY STANDARD. ГОСТ Р
#    50577-2018 п. 3.7, verbatim: "На регистрационных знаках типов 1 - 28 могут
#    применяться следующие буквы: А, В, Е, К, М, Н, О, Р, С, Т, У, Х. На
#    регистрационных знаках типа 9 - 11 может применяться буква D."
#    Measured from the published text, the twelve are CYRILLIC codepoints:
#      А U+0410 · В U+0412 · Е U+0415 · К U+041A · М U+041C · Н U+041D ·
#      О U+041E · Р U+0420 · С U+0421 · Т U+0422 · У U+0423 · Х U+0425
#    and D is LATIN U+0044. ГОСТ Р 50577-93 п. 3.7 had the same twelve.
#    The standard gives NO reason. The contemporaneous press does: За рулём
#    9/1993 described the new plates as using "буквы, по написанию
#    соответствующие латинским, чтобы не требовалась замена номеров при поездке
#    за границу" (letters that match Latin ones in shape, so the plates need
#    not be replaced for a trip abroad). Secondary; recorded in `script`.
#
# 2. HOW THAT IS MODELLED, AND WHY — THE SAME RULE AS ua.yml AND gr.yml. The
#    lint's pattern DSL generates Latin A-Z for `L`, and every consumer's
#    keyboard and OCR produce Latin for these glyphs. So every `pattern`,
#    `regex` and `regex_strict` of a CURRENT series is written in the GLYPH
#    FOLD: each of the twelve Cyrillic letters is written as the Latin capital
#    it is drawn as —  А->A В->B Е->E К->K М->M Н->H О->O Р->P С->C Т->T
#    У->Y Х->X. The fold is injective over the twelve, so it loses nothing and
#    the reverse map is published in `script.homoglyph_map`. THE FOUR TRAPS: В
#    is B (never V), Н is H (never N), Р is P (never R), С is C (never S) — and
#    the Russian-specific fifth: У is Y (never U). A phonetically transliterated
#    Russian plate ("V", "N", "R", "S", "U") is always wrong.
#    WHAT A CONSUMER MUST DO: upcase, then replace each of the twelve Cyrillic
#    capitals by its Latin twin, then match. Nothing else is folded; any other
#    Cyrillic letter (Б, Д, Ж ...) is left alone and therefore fails every
#    current series, which is correct.
#
# 3. THE SOVIET SERIES NEED LETTERS THAT HAVE NO LATIN TWIN, so this file
#    declares its own `serial_alphabet` (PRD-PLATES §2.6, decision 2): Latin
#    A-Z, the digits, and the sixteen Cyrillic capitals that have no Latin
#    look-alike — Б Г Д Ж З И Л П Ф Ц Ч Ш Щ Э Ю Я. The rule stays one rule:
#    a letter with a Latin twin is always written as the twin; a letter without
#    one is written in Cyrillic. Only the recall-only Soviet series use the
#    sixteen.
#
# 4. THE REGION CODE IS THE OWNER'S REGION, NOT THE ISSUING OFFICE'S — since
#    1 January 2020. Правила госрегистрации п. 39: "Присвоение государственного
#    регистрационного номера транспортного средства осуществляется в
#    соответствии с цифровым кодом региона места регистрации владельца
#    транспортного средства." Three-digit codes are any digit 1-9 placed before
#    a region's two-digit code, on type 1 only (Приложение № 1 note, as amended
#    2020). See plates/_decode/ru-regions.yml, which also records the codes that
#    MOVED between regions in 2020 and 2022.
#
# 5. RUSSIA HAS NO PERSONALISED PLATES. Правила п. 41, verbatim:
#    "Государственные регистрационные номера присваиваются без резервирования
#    за юридическими, физическими лицами или индивидуальными предпринимателями
#    их отдельных серий или сочетаний символов." (Numbers are assigned without
#    reserving series or combinations of characters for anyone.) An owner may
#    KEEP an issued number for one year (283-ФЗ ст. 8 ч. 1 п. 3; Правила п. 45).
#
# 6. THE STANDARD NUMBERS ITS TYPES 1-11 AND 15-28 (1А, 1Б, 4А, 4Б, 4В are
#    letter-suffixed). There is no type 12, 13 or 14 in the 2018 edition. The
#    1993 standard had types 11-14 as yellow plates for foreign correspondents,
#    trade representatives and other foreign owners; its Изменение № 2 (2001)
#    deleted them (see `history`).
#
# ─────────────────────────────────────────────────────────────────────────────
# REGEX POLICY (as ua.yml, de.yml, gr.yml)
#   `format.regex` is the lint-round-trippable regex over the pattern's own
#   alphabet (L -> A-Z). `format.regex_strict` carries the sourced grammar: the
#   twelve folded letters [ABCEHKMOPTXY], the Latin D/T/CD series letters of the
#   diplomatic types, and the region-code shape (01-99, never 00; three digits
#   only on type 1). Region codes are NOT enumerated in the regexes — the decode
#   table carries them, with their history.
#
# SEPARATOR NOTE (PRD-PLATES §2.6): the plate prints no separator glyph. The
#   structure strings of п. 3.3 are written with spaces ("М 000 ММ 55"), the
#   region code sits in its own framed box, and two-line plates put the groups on
#   separate lines. Every `pattern` spells the п. 3.3 groups with spaces, in
#   reading order (top line, then bottom line); every regex accepts each space
#   as optional.
#
# §VERIFIER — open questions, ranked by how much they matter to a reader of the
# public page (the most consequential first):
#   V1. Effective date of ГОСТ Р 50577-2018. Приказ Росстандарта № 555-ст says
#       "с датой введения в действие 4 августа 2020 г. с правом досрочного
#       применения"; the standard's own first page prints "Дата введения —
#       2019—01—01"; meganorm's card cites a "№0 от 03.08.2019 (рег. 18.12.2018)".
#       Which date governs, and whether an intermediate Rosstandart order moved
#       it, is not established. Series that exist only in the 2018 standard carry
#       start 2019 with this note.
#   V2. Types 4Б, 23-28 (mopeds, classic and sport vehicles): the standard's own
#       note says they may be used "только после утверждения нормативных
#       правовых актов, регламентирующих порядок регистрации мопедов,
#       классических (ретро) и спортивных автомобилей". Whether those acts exist
#       and these plates are issued was NOT established. Type 4В (personal
#       mobility devices, Поправка ИУС 5-2026) likewise.
#   V3. Type 28's structure: п. 3.3 prints "С ММ / 000 55" (as type 27), the
#       drawing А.31 shows "С 133 / АА 47" (as type 25). The regex accepts both.
#   V4. The series letter «T» on type 10: LATIN T (U+0054) in the ГОСТ text and
#       in pddmaster's consolidated order; CYRILLIC Т (U+0422) in Garant's copy
#       of order № 766. The signed scan cannot be measured. Folds to T either way.
#   V5. Diplomatic code 042: the signed 2017 order prints «Демократическая
#       Республика Конго» against both 042 and 077; the 2016 list had «Республика
#       Конго» at 042. A drafting slip in the instrument, recorded as printed.
#   V6. What the region code meant before 2020 (issuing unit's region, per every
#       secondary account) and the pre-2017 code list (приказ МВД № 282 of 2002,
#       its 2002-2016 amendments): not read.
#   V7. When type 1Б (yellow, taxis and licensed passenger carriers) first
#       appeared: it is in the 1993 standard's consolidated text (as amended
#       2001 and 2009) but whether in the 1993 original is not established.
#   V8. Three-digit codes: which ones have actually been issued, and from when,
#       comes only from Wikipedia (ru-regions.yml `three_digit_reported`).
#   V9. The whole Soviet section is secondary-wikipedia from a section the
#       article itself marks «нет ссылок в разделе»; ГОСТ 3207-77 and its
#       predecessors (-46, -59, -65) were not found online.
#   V10. Постановление Правительства РФ № 1842 of 26.12.2019 (manufacturing
#       procedure) and приказ МВД № 948 of 18.12.2019 (rules for keeping and
#       issuing plates) were downloaded from the official portal but not read.
# ─────────────────────────────────────────────────────────────────────────────
jurisdiction: ru
authority:
  name: Министерство внутренних дел Российской Федерации / Госавтоинспекция (Госавтоинспекция МВД России)
  url: "https://мвд.рф/"
  url_note: >-
    мвд.рф, гибдд.рф (xn--90adear.xn--p1ai), pravo.gov.ru, docs.cntd.ru and
    rst.gov.ru (Rosstandart) did not answer this client on 2026-11-26 (time-outs,
    recorded in the research notes). Every factual claim is cited to the
    official publication portal publication.pravo.gov.ru, to the official
    edition of the standard, or to named full-text copies.
binding: vehicle
binding_note: >-
  The number is assigned TO THE VEHICLE (283-ФЗ ст. 13 ч. 1: "индивидуальное
  буквенно-цифровое обозначение, присваиваемое транспортному средству
  регистрационным подразделением"), but the owner may keep it on disposal of the
  vehicle or pass it on with the vehicle (ст. 8 ч. 1 п. 3), and a kept number is
  held for one year (Правила п. 45). The region code follows the owner's
  registered region at assignment (Правила п. 39).
serial_alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789БГДЖЗИЛПФЦЧШЩЭЮЯ"
serial_alphabet_evidence: >-
  Latin A-Z and digits: the glyph fold of every current series (fact 2). The
  sixteen Cyrillic capitals are needed only by the recall-only Soviet series and
  are the Russian capitals with no Latin look-alike, less the five Wikipedia says
  were never used on Soviet plates from 1936 (Ё, Й, Ъ, Ы, Ь; secondary-wikipedia).
  The twelve Cyrillic letters of ГОСТ п. 3.7 are deliberately NOT in this set:
  they are always written as their Latin twins.
