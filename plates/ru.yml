    - "Поправка, ИУС № 4 2025: 3.4 note — types 1Б, 4, 19, 20, 21, 22 made before 31.12.2024 to the earlier requirements may still be issued and used"
    - "Поправка, ИУС № 5 2026: type 4В (средства индивидуальной мобильности) added with drawing А.10б; no flag on 4В; Table 1 gains the 40 mm row"
