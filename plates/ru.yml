        п. 3.3, type 9 (однострочный): "222 ММ 0 55" — mission code (2 = "цифра
        кода, применяемого на регистрационных знаках для обозначения транспортных
        средств аккредитованных дипломатических представительств"), the series,
        one digit, region code. The series is fixed: "На регистрационных знаках
        типа 9 используется серия "CD" - для легковых автомобилей глав
        дипломатических представительств" (п. 3.3; приказ МВД № 766 п. 2.1).
        «CD» is LATIN.
      examples_instrument:
        - { printed: "876 CD 2 99", folded: "876CD299", source: "рисунок А.15" }
    design:
      plate: { w: 520, h: 112, unit: mm }
      background: { color: "#C8102E", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Красный" }
      foreground: "#FFFFFF"
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "region code over «RUS»; the flag is optional on types 9-11 (п. 3.4) and shown in the 2025 drawing" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/ru-diplomatic-codes.yml"
    region_encoding_note: "The leading three digits decode in ru-diplomatic-codes.yml; the trailing code is a region code (ru-regions.yml)."
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.3 (type 9), п. 3.3, п. 3.7 (letter D), Таблица 2 (Красный / Белый); рисунок А.15 (2018) and its Изменение № 2 replacement. Accessed 2026-11-26"
      - "http://publication.pravo.gov.ru/file/pdf?eoNumber=0001201801100004  # приказ МВД № 766 п. 2.1: серия «CD». Accessed 2026-11-26"
    notes: "Cars of heads of diplomatic missions (ambassadors). The single digit after CD distinguishes a head of mission's cars."

  - id: ru-diplomatic-1994
    class: diplomatic
    categories: [car, van, truck, bus]
    period: { start: 1994 }
    period_evidence: enabling-instrument
    matching: strict
    format:
      pattern: "999 L 999 99"
      regex: '\A\d{3} ?[A-Z] ?\d{3} ?\d{2}\z'
      regex_strict: '\A\d{3} ?[DT] ?\d{3} ?(?:0[1-9]|[1-9]\d)\z'
      grammar: >-
        п. 3.3, type 10 (однострочный): "222 М 000 55". Series (п. 3.3; приказ
        МВД № 766 п. 2.2): "D" — missions, consular posts (including
        honorary-consul-led ones), international organisations and their staff
        "имеющих дипломатические или консульские карточки"; "T" — staff of
        missions, consular posts (except honorary-consul-led ones) and
        international organisations "имеющих служебные карточки или
        удостоверения".
      charset:
        letters: [D, T]
        note: "D is LATIN; T is Latin in the ГОСТ text and Cyrillic in one copy of the order (§VERIFIER V4)."
      examples_instrument:
        - { printed: "876 D 234 99", folded: "876D23499", source: "рисунок А.16" }
    design:
      plate: { w: 520, h: 112, unit: mm }
      background: { color: "#C8102E", finish: retroreflective, hex_basis: nominal, chromaticity_ref: "Красный" }
      foreground: "#FFFFFF"
      characters: { digit_height_mm: 76, letter_height_mm: 58, region_height_mm: 58, rus_height_mm: 20 }
      band: { side: right, content: "region code over «RUS»; flag optional" }
      emblem: { present: false }
      rear_differs: false
    region_encoding: "plates/_decode/ru-diplomatic-codes.yml"
    sources:
      - "https://meganorm.ru/Data/696/69638.pdf  # ГОСТ Р 50577-2018 п. 3.2.3 (type 10), п. 3.3; рисунок А.16. Accessed 2026-11-26"
      - "http://publication.pravo.gov.ru/file/pdf?eoNumber=0001201801100004  # приказ МВД № 766 п. 2.2: серия «D», серия «Т». Accessed 2026-11-26"
      - "http://publication.pravo.gov.ru/file/pdf?eoNumber=0001202208170034  # приказ МВД № 553 п. 2.4: honorary consuls — one vehicle. Accessed 2026-11-26"
    notes: >-
      Diplomatic, consular and international-organisation vehicles. The meaning
      of the code is in ru-diplomatic-codes.yml (001 United Kingdom, 002
      Germany, 004 United States, 090 China, 499 European Union delegation, 511
