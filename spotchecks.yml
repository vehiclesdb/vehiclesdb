  # === German data heal (2026-07-25) ==========================================
  # These pin the repair of the xlsx shared-string leak that published 148
  # records across 29 makes as bare integers. Full account: NAMING.md §2.1 and
  # pipeline/lib/xlsx_lite.rb. Presence rows here are the proof the heal landed;
  # absence rows are the proof the artifacts stayed dead.
  - id: volkswagen/golf
    availability_includes: [de, nl, gb]
    reason: "THE flagship regression: volkswagen/552 WAS the Golf (36,508 DE registrations Jan-May 2026) while volkswagen/golf carried 12 countries and no de. Germany must be present on Germany's best-selling car."
  - id: audi/a3
    availability_includes: [de]
    reason: "audi/89 was the A3 (si[89]); the DE evidence belongs on the nameplate. NB audi/89 itself SURVIVES — NL genuinely registers the B3 Audi 80 as '89' — so this is an evidence move, not an id rename"
  - id: audi/a5
    availability_includes: [de]
    reason: "audi/91 was the A5 (12,808 DE registrations) — heals to the nameplate"
  - id: seat/ateca
    availability_includes: [de, es]
    reason: "seat/468 was the Ateca. PR #1 dropped 468-474 as 'KBA numeric type-codes'; they were SEAT's entire current German lineup (si[468..474] = ATECA, BORN, FORMENTOR, IBIZA, LEON, TAVASCAN, TERRAMAR)"
  - id: seat/468
    exists: false
    reason: "the shared-string index must never publish as a nameplate again — but the RECORD it stood for is real and now lives on seat/ateca (see the row above). Absence here plus presence there is the whole fix."
  - id: zeekr/neuzulassungen-insgesamt
    exists: false
    reason: "KBA's grand-total row ('Neuzulassungen insgesamt') parsed as a Zeekr model and held DE rank 1; the source now skips INSGESAMT/ZUSAMMEN/SONSTIGE rows"
  - id: mercedes-benz/glc
    availability_includes: [de]
    reason: "KBA splices a nameplate to its renamed successor in one cell ('GLK, GLC'); the normalizer keeps the FIRST part, so 16,653 registrations were landing on the GLK, dead since 2015. Resolved in the source's COMMA_MERGED table."
  - id: mercedes-benz/gle
    availability_includes: [de]
    reason: "same temporal-merge class: 'ML-KLASSE, GLE' was landing on the ML (renamed GLE in April 2015)"
  - id: mercedes-benz/amg
    availability_includes: [gb, nz]
    reason: "AMG is a SUB-BRAND and mercedes() used to publish it as a nameplate (first letter run of 'AMG C 63'); 367 raws / 74,570 registrations pooled here until the 2026-08-01 strip sent 16,605 of them to twenty live nameplates. The stub is DELIBERATELY RETAINED, not nulled: what is left is real evidence with no honest target — uk_dft's GenModel aggregate 'MERCEDES AMG CLASS' (gb 57,573, a range label spanning every AMG model, which the file's Model column would split) and the bare 'AMG' rows from nz_nzta/nl_rdw (nz 373). Nulling it would delete 58k registrations to hide a source-altitude problem, the same posture car/porsche/coupe is held under. This row is the tripwire against that cleanup."
