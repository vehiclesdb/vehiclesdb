  # --- make-merge tripwires (S2W, 2026-07-25) --------------------------------
  # These guard MAKE merges, which fail differently from model merges: nothing
  # vanishes at the model level, the make id just silently forks back into two
  # and every consumer sees the marque twice with half its countries each.
  - id: zero-motorcycles/sr-f
    kind: motorcycle
    availability_includes: [gb, nl, nz]
    reason: "MERGE GUARD: UK/NZ register the marque as bare 'ZERO', NL/ES/FI as 'ZERO MOTORCYCLES'. gb+nz here proves the ZERO alias is still firing; nl proves the union actually happened rather than the two ids merely coexisting. If gb/nz drop off, `motorcycle/zero/*` has reappeared as a second make."
  - id: zero/sr-f
    kind: motorcycle
    exists: false
    reason: "the losing side of the same merge. It must stay dead: `zero` is a uniquely collision-prone make string and its former_ids aliases only stay honest while nothing is published under it."
