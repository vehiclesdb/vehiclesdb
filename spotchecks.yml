  # the symbol itself. `nl` and `es` are the two independent registers that
  # write it, so they are the load-bearing halves of the assertion.
  - id: smart/1
    availability_includes: [de, es, nl]
    reason: "smart #1: the leading-hash strip in classify is what carries the NL/ES registers; de alone means the guard came back"
  - id: smart/3
    availability_includes: [de, es, nl]
    reason: "smart #3: as above"
  - id: smart/5
    availability_includes: [de, es, nl]
    reason: "smart #5: as above"

