    availability_includes: [de]
    reason: "audi/89 was the A3 (si[89]); the DE evidence belongs on the nameplate. NB audi/89 itself SURVIVES — NL genuinely registers the B3 Audi 80 as '89' — so this is an evidence move, not an id rename"
