# One make = one owner, across all six kinds and all defect classes.
# Owner = the side owning the make's dominant kind by record count.
# s4w = car/van/truck/bus maintainer · s2w = motorcycle/moped maintainer
#
# Consequence to keep in mind: a make's owner curates it in EVERY kind, so
# each side holds records inside the other's kinds. "Done" is therefore
# defined per make-set, never per kind-set.
