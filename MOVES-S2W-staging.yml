# MOVES-S2W-staging.yml — 46 two-wheeler moves, HANDED BACK UNAPPLIED.
#
# I folded these into overrides/models/moves.yml as agreed, and the build's own
# reachability test rejected all 46. Returning them rather than guessing at a
# fix, because the correct keys are ambiguous and the makes are yours.
#
# DIAGNOSIS — it is the same trap that killed my "SEAT|Cupra Leon" key.
# Move keys match the POST-normalization nameplate, and the make-prefix strip
# removes the embedded brand BEFORE moves run:
#
#     raw:      merk=PIAGGIO  handelsbenaming="VESPA SPRINT"
#     produced: "Sprint"      (not "Vespa Sprint")
#
# So every "Piaggio|Vespa X" key matches nothing. Mechanically the keys could be
# rewritten to "Piaggio|Sprint" — but that is NOT safe: post-strip a Vespa-badged
# row is indistinguishable from a genuine Piaggio row, so the move would capture
# both. Exactly why I could not move "SEAT|Cupra Leon" (the pooled row).
#
# The real fix is in normalizer.rb (your file): either run moves BEFORE the
# prefix strip, or have the strip record what it removed so a move can key on it.
# Both are small; neither is mine to choose.
#
# My 10 four-wheel moves ARE reachable and stayed in moves.yml, because KBA puts
# the marque in the MAKE column ("SEAT" + "FORMENTOR") rather than inside the
# model string — nothing gets stripped, so the key survives.
#
# Below: your 46 keys, each annotated with the nameplate the pipeline actually
# produces, so a rekey can be mechanical once the normalizer question is settled.

