  - id: motorcycle/huatian/ht150t-15
    verdict: canonical
    evidence_class: register-only
    note: >-
      Zhejiang Huatian Industrial Co. (Taizhou) is an OEM, not a marque in the retail sense —
      it states plainly that it does OEM work for other dealers and manufacturers, and its
      machines are built by Zhejiang Shunqi and Zhejiang Lingyu. So HT50QT-* and HT150T-* ARE
      the model names here: there is no consumer nameplate behind them to recover, and the
      type code is the honest identifier rather than a mangling of something better. THE
      INTERESTING PART FOR THE BATCH: this make sits at the register-only ceiling despite
      being multi-source and multi-country, which is the B-001 floor reproduced INSIDE the
      ceiling set. Multi-source evidence proves a record EXISTS in several registers; it does
      not conjure a manufacturer who documents it.
    evidence: https://motorcycles.su/motorcycles/huatian.html
