  - id: motorcycle/brixton/bx125
    verdict: canonical
    note: >-
      Brixton Motorcycles (KSR Group, Austria) — Cromwell, Crossfire, Felsberg, Rayburn and
      Sunray are its published families. TWO SPACING DISCREPANCIES RECORDED NOT CHANGED,
      because they are the same question and must be decided together: the marque launched
      its first bike at EICMA 2015 as "BX 125" (spaced) against our "BX125", and publishes
      "Crossfire 500 X" against our "Crossfire 500X". Changing one and not the other would
      make the make internally inconsistent, which is exactly the defect shape that made
      GOVECS findable.
    evidence: https://www.brixton-motorcycles.com/models/
