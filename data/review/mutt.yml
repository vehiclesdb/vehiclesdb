#   * four ids marked `stale` — §5.2's "re-review queued". Nothing is deleted;
#     the original verdict, note and citation are preserved verbatim in each
#     entry so the nameplate research survives for whoever re-reviews.
#
# WHAT THIS PASS DID NOT DO. It signed nothing. `researcher`/`verifier` below
# still attest to the 2026-07-26 NAMEPLATE findings, which are unchanged and
# still cited; they do not attest to the successor ids, and no third signature
# is claimed here. Two published Mutt records — motorcycle/mutt/akita-125 and
# motorcycle/mutt/rs-13 — are minted by this same wave and have NEVER been
# reviewed by anyone. They are absent below on purpose: inventing verdicts for
# them would buy back exactly the coverage this pass honestly gives up, which
# is the one thing a verification ledger must never do.
