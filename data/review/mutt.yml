# retired and the rows landed on the real designations. The other four fell
# below the publication threshold in the same wave.
#
# WHAT THIS PASS DID, exactly, so nobody reads more into it than is here:
#   * three ids RE-POINTED onto the successor named by the retirement manifest
#     (overrides/models/removals.yml — "an entry here is a REVIEWED decision"),
#     each naming exactly ONE live successor with its vehicle count. The
#     verdict moves canonical -> fixed: the pooled stub was the defect and the
#     split is the merged fix. It is deliberately NOT `canonical`, because
