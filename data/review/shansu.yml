    verdict: debt
    note: >-
      OEM IN THE MAKE COLUMN, MARQUE IN THE MODEL COLUMN — the Benzhou/IVA shape from B-001,
      found again in a completely different evidence class. HECHT is a Czech brand (hecht.cz)
      and the Stratis is its product; Shansu (Zhejiang Shansu Smart Technology / HK Shansu
      Technology Ltd) is the CONTRACT MANUFACTURER. The SNCH type-approval document names the
      pair explicitly: "Rooder Group HK Shansu Technology Limited". So the marque is Hecht
      and the model is Stratis. NOT MOVED: there is no published `hecht` make to move it to,
      so a move would mint a single-record make off one type-approval PDF — the exact
      "approval-holder" trap PRD-QUALITY warns about for this class. Resolvable by a second
      Hecht record appearing, or by a threshold decision.
    evidence: https://en.hecht.cz/e-scooter-hecht-stratis-black
