    Where the researcher published counts I reproduced them to the row, e.g.
    moped/vespa/primavera es 71 / fi 380 / lu 12 / nl 17,792 / nz 334 and
    primavera-50 es 19 / fi 159 / lu 6 / nl 3,482 / nz 1; sd02 nl 475;
