# batches.yml — the REVIEW DISPATCH BOARD (PRD-QUALITY §6).
#
# One entry per batch of makes. A batch is CLAIMED by writing `claimed_by`,
# DONE when every make in it has a ledger file that passes lint_review.rb
# with dual signatures. Claim before working — two swarms researching the
# same make burns tokens and produces two conflicting ledgers.
#
# RULES (from PRD §6, enforced socially + by lint where possible):
#   * Batches are MAKE-sets, never kind-sets: the make's owner curates it in
#     every kind (OWNERSHIP.yml is the owner map).
#   * Approval-holder clusters must stay in ONE batch (a Vespa verdict written
#     without the Piaggio context re-creates the split it exists to fix).
#     Mandatory co-batches are listed in PRD §6.2 — {Piaggio,Vespa,Aprilia,
#     Moto Guzzi,Derbi,Gilera}, {KTM,Husqvarna,GasGas}, {SEAT,Cupra},
#     {Hyundai,Genesis}, {Honda,Montesa}, and the rest.
#   * researcher != verifier within a batch, and the HARNESS AUTHOR never
#     pilots their own harness (I-11): the pilot batch is run by S2W because
#     S4W built lint_review + gen_review_pack.
#
# WORKFLOW per batch (PRD §7 has the full researcher/verifier prompts):
#   1. build:  ruby pipeline/run.rb            (fresh build/out + candidates)
#   2. pack:   ruby pipeline/tools/gen_review_pack.rb <makes…>
#   3. research: one Opus researcher per make, pack + internet → draft ledger
#   4. verify:  a DIFFERENT Opus verifier re-derives verdicts from evidence
#   5. lint:   ruby scripts/lint_review.rb     (data repo; VDB_PACKS=… for
#              staleness, VDB_CATALOG=… to measure against the fresh build)
#   6. PR with ledger + any override fixes the review produced; CI green;
#      merge; coverage baseline update (`lint_review.rb --update`) in the PR.
#
# status: open | claimed | in_review | done

batches:
  B-002:
    makes: [ajp, benda, big-dog, boom, brixton, chatenet, cyclone, e-ride-pro,
            energica, govecs, hanway, horwin, huatian, kove, livewire, microcar,
            mutt, rewaco, shansu, silence, simson, super-soco, swm, zhenhua]
    owner: s2w
    status: claimed
    claimed_by: s2w        # claimed 2026-07-26
    verifier: null
    notes: >-
      THE OPPOSITE POLE FROM B-001, and chosen for that reason. B-001 measured
      the FLOOR — 46 makes where every record was single-source, single-country
      nl_rdw, §8.3 sources of record mostly did not exist, and 26 of 58 verdicts
      were necessarily `debt`. That number bounds the programme from below but
      says nothing about what verification costs when evidence IS available.
      B-002 measures the CEILING. Selection is again by evidence property, not
      by size: EVERY published record is multi-source, the make spans >=3
      countries and >=3 sources, and the make has a live manufacturer presence.
      24 makes / 147 records — 2.5x B-001's record count on a third fewer makes,
      which is itself the point: at the ceiling the work is per-RECORD (does the
      manufacturer spell it that way?) rather than per-MAKE (does this marque
      exist at all?).
      TWO NUMBERS FROM TWO POLES BOUND THE WHOLE PROGRAMME. A second
      floor-batch would only re-measure the floor.
      DELIBERATELY EXCLUDED, because they are a THIRD evidence class and G23's
      territory: defunct marques with heritage archives rather than live sites
      (nsu, cz, bultaco, morbidelli, mbk, montesa). Their sources exist but are
      enthusiast-maintained, which is a different question about source quality
      and should be measured separately rather than blended in here.
      ONE DELIBERATE EXCEPTION TO THAT EXCLUSION: `simson`. It is defunct (VEB
      Fahrzeug- und Jagdwaffenwerk, Suhl) but exceptionally well archived, so it
      tests which property is actually load-bearing — "the marque is trading" or
      "sources of record exist". If simson verifies as cleanly as the live
      marques, the live/defunct split is the wrong axis and G23 should be scoped
      by source availability instead.
      EXPECTED FAILURE MODE, stated in advance so it is a prediction and not a
      post-hoc excuse: at the ceiling the risk inverts. B-001's danger was
      asserting a marque that could not be evidenced; B-002's is accepting a
      manufacturer's CURRENT catalogue as evidence for a DISCONTINUED record and
      quietly retiring a nameplate the marque simply stopped listing. The B-000
      IVA pilot hit exactly this and it is why `evidence_class: register-only`
      exists — a live marque site is a source of record for what it sells today,
      not for what it sold in 2011.
  B-001:
    makes: [bashan, batavus, benzhou, black-n-roll, brekr, capri, djjd, dts, e-solex,
            ebretti, edwards, elveco, evader, fosti, gazelle, gerray, go-tulip-b-v,
            hercules, i-coco, i-goo, jiajue, kickbike, klever, lintex, luuko, modena,
            momo, monasso, motormania, nimoto, nipponia, qwic, rover-bikes, rso,
            saxonette, spyder-wheelz, stint, tante-paula, tianying, tisong, tym,
            veeley, viraggio, vom, wlie, zundapp-famel]
    owner: s2w
    status: done   # verified + signed by S4W 2026-07-26 (Turn 72): 33 retailer citations reclassified register-only, two supporting claims refuted (iva.yml re-stamp), all 58 verdicts affirmed
    claimed_by: s2w
    verifier: null      # I-11: S4W verifies; researcher must not sign their own batch
    notes: >-
      TRANCHE C, first real batch. 46 makes / 61 published records, and the set
      is defined by an EVIDENCE PROPERTY rather than by size: every record is
      moped, single-source (nl_rdw) and single-country (nl). That makes it the
      sharpest available test of the register-only evidence class the B-000
      pilot exposed — for most of these, §8.3's sources of record do not exist,
      and the honest ceiling is what this batch is really measuring.
      Slightly over the 20-40 guidance on purpose: splitting an
      evidence-coherent set would mean researching the same OEM relationships
      twice.
      Structure is visible BEFORE any research, which is why the set is worth
      doing together: benzhou publishes a record literally named "Iva LUX50" —
      an OEM/badge relationship with the make B-000 piloted — and i-coco's
      "Lt-018" sits beside i-goo's "Lt-019". fosti belongs to the ZNEN group
      (established in the acronym round-2 research). So the approval-holder trap
      the PRD warns about for Tranche C is present here in its
      badge-engineering form, and a per-make batch would miss it by
      construction.
      Known going in: tym/vespa-alpha is a Vespa-named row under a
      tractor marque (flagged in acronym round 3); ebretti and veeley are two of
      the make-as-model rows G9 filed as needing marque research; zundapp-famel
      is a Portuguese Zündapp licensee that may belong with zundapp.
  B-000:
    makes: [iva]
    owner: s2w            # moped-dominant make → S2W per OWNERSHIP.yml
    status: done         # verified + signed by S4W 2026-07-25 (NEGOTIATION Turn 57); three precision corrections recorded as verifier_note, no verdict flipped
    claimed_by: s2w        # claimed 2026-07-25 per the claim-before-working rule
    notes: >-
      PILOT (PRD P1). Deliberately small (16 published moped records, 34
      candidate rows, 1 dropped row) and deliberately dirty: the pack already
      shows a three-way duplicate-spelling split published as separate records
      (iva/iva-ra9015 vs iva/ra-9015 vs iva/ra9015, and the ra9011 family
      split across published+candidates) plus prefix-strip merges to sanity-
      check (JET50, LUX50, VENTI 50). Run by S2W because S4W authored the
      harness (I-11). The pilot's job is to break the harness, not to be
      efficient — every friction point goes in the negotiation log.
