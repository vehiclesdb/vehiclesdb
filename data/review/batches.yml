# batches.yml — the REVIEW DISPATCH BOARD (PRD-QUALITY §6).
#
# One entry per batch of makes. A batch is CLAIMED by writing `claimed_by`,
# DONE when every make in it has a ledger file that passes lint_review.rb
# with dual signatures. Claim before working — two swarms researching the
# same make burns tokens and produces two conflicting ledgers.
#
# RULES (from PRD §6, enforced socially + by lint where possible):
#   * Batches are MAKE-sets, never kind-sets: the make's owner curates it in
#     every kind (OWNERSHIP.yml is the owner map).
#   * Approval-holder clusters must stay in ONE batch (a Vespa verdict written
#     without the Piaggio context re-creates the split it exists to fix).
#     Mandatory co-batches are listed in PRD §6.2 — {Piaggio,Vespa,Aprilia,
#     Moto Guzzi,Derbi,Gilera}, {KTM,Husqvarna,GasGas}, {SEAT,Cupra},
#     {Hyundai,Genesis}, {Honda,Montesa}, and the rest.
#   * researcher != verifier within a batch, and the HARNESS AUTHOR never
#     pilots their own harness (I-11): the pilot batch is run by S2W because
#     S4W built lint_review + gen_review_pack.
#
# WORKFLOW per batch (PRD §7 has the full researcher/verifier prompts):
#   1. build:  ruby pipeline/run.rb            (fresh build/out + candidates)
#   2. pack:   ruby pipeline/tools/gen_review_pack.rb <makes…>
#   3. research: one Opus researcher per make, pack + internet → draft ledger
#   4. verify:  a DIFFERENT Opus verifier re-derives verdicts from evidence
#   5. lint:   ruby scripts/lint_review.rb     (data repo; VDB_PACKS=… for
#              staleness, VDB_CATALOG=… to measure against the fresh build)
#   6. PR with ledger + any override fixes the review produced; CI green;
#      merge; coverage baseline update (`lint_review.rb --update`) in the PR.
#
# status: open | claimed | in_review | done

batches:
  B-002:
    makes: [ajp, benda, big-dog, boom, brixton, chatenet, cyclone, e-ride-pro,
            energica, govecs, hanway, horwin, huatian, kove, livewire, microcar,
            mutt, rewaco, shansu, silence, simson, super-soco, swm, zhenhua]
    owner: s2w
    status: awaiting_verification   # all 24 makes carry verdicts
    claimed_by: s2w        # claimed 2026-07-26
    verifier: null
    progress: >-
      COMPLETE 2026-07-26. All 24 makes, 147 records, in three installments:
      #43 (6 makes), #47 (14 makes), #48 (4 makes). 13 display fixes, 2 id
      moves, every one verified by a before/after build diff.
      THE RESULT THIS BATCH WAS BUILT TO PRODUCE. B-001 measured the floor:
      26 debt verdicts in 58 records, under register-only evidence. B-002
      selected the inverse property — every record multi-source, make in 3+
      countries, live manufacturer presence — and THE CEILING IS NOT CLEAN.
      Two whole makes (huatian, hanway) and several individual records (kove's
      KY/NK type codes, simson's heritage models) land at `register-only`
      DESPITE satisfying every ceiling criterion.
      SO THE AXIS IS SOURCE AVAILABILITY — not trading status, and not source
      count. Multi-source evidence proves a record EXISTS in several
      registers; it does not conjure a manufacturer who documents it. kove is
      a live marque with a Dakar programme whose own type codes are
      undocumented; huatian is a working OEM that states plainly it builds for
      other brands. RECOMMENDATION for §14.4 and the G23 sweep order: scope by
      "does a source of record exist", not by "is the marque defunct".
      SECOND RESULT, unplanned and worth more than the first: the ceiling
      produced MORE naming defects than the floor, not fewer — 13 fixes vs 6.
      A documented marque gives you something to be WRONG AGAINST.
      Register-only records cannot be caught being misspelled because there is
      nothing to compare them to. Coverage percentages must not be read as
      quality without that caveat: the cleanest-looking makes in this dataset
      are the ones nobody can check.
