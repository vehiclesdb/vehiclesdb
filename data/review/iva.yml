# VERIFICATION LEDGER — IVA (batch B-000, the A4 harness pilot)
#
# Reviewed against build/packs/iva.md. Verdicts are per PRD-QUALITY §5.2.
#
# READ THIS BEFORE TRUSTING THE COVERAGE NUMBER: this make splits cleanly into
# two evidence classes, and only one of them can ever reach the PRD's stated bar
# ("manufacturer sites, press releases, heritage archives, regulator documents
# are your sources of record"):
#
#   * CURRENT LINEUP (E-GO series, NC series, Lux) — IVA Mobility publishes
#     these, so the manufacturer store is a real source and the verdicts are
#     genuinely evidenced.
#   * DISCONTINUED / OEM-CODE MODELS (RA9015, RA9011, VENTI 50, JET50, LUX50,
#     RIVALUX, plus the whole candidate tail: IBIZA, VENICE, LX02, LHU,
#     DAGUIWANG, ZN50QT-E, TY50QT-G…) — IVA publishes NOTHING about them and no
#     archive exists. The Dutch register is the only evidence there is.
#
# For the second class the honest ceiling is "the register says so, corroborated
# across N raw spellings of the same row-set", and I have said exactly that
# rather than dressing a retailer listing up as a source. See the friction
# report in NEGOTIATION.md Turn 55 — this is the pilot's main finding about the
# harness, not a property of IVA.
make: iva                 # the SLUG, not the display name — lint matches this against the filename. Worth noting because everywhere ELSE in this repo `make` means the display name (renames.yml is keyed on it), so writing "IVA" here is the natural mistake and the error message does not say which is wanted.
