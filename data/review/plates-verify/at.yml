# PRD-PLATES §5.3 verification dossier — AUSTRIA
#
# Re-derivation of every claim in plates/at.yml that §5.3 puts in the
# verifier's hands: period boundaries, format regexes, class, and colours.
# Eighteen series, from the primary statutory source already pinned in the
# file PLUS one independent route per claim family.
#
# QA-LOOP-2, index 1 of the sorted list of L1-wave jurisdiction files lacking
# a §5.3 dossier. That list was, at origin/main 151f727, the 32 files landed
# by the two L1 EU/EEA waves — wave 1 (at be ch fi fr gb it se, data#218-#225)
# and wave 2 (ad cy cz dk ee gr hr hu ie is li lt lu lv mc mt no pl pt ro si
# sk sm va, data#250-#262) — and NONE of the 32 had one, because no §5.3
# dossier existed anywhere in either repo. Sorted: ad at be ch cy cz dk ee fi
# fr gb gr hr hu ie is it li lt lu lv mc mt no pl pt ro se si sk sm va.
# Index 1 = at. de/nl/es are excluded: they are the L0 pilot baselines, not
# L1-wave files.
