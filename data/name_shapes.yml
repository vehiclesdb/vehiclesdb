  - id: kreidler-k53-type-numbers
    owner: s2w
    category: code_string
    id_list: [kreidler/florett-k53-1nl, kreidler/florett-k53-21nl, kreidler/k53-311, kreidler/k53-402]
    count: 4
    why: >-
      A CORRECTION FIRST, because I asserted the opposite in NEGOTIATION Turn 83
      and in the #51 PR comment. I claimed three published ids were one string
      punctuated three ways. THEY ARE NOT. `K53/1NL` and `K53/21NL` are
      DIFFERENT Kreidler type numbers — K53/1 and K53/21 — and only the two
      K53/21 forms were duplicates. That merge is done; the rest are distinct
      types and folding them would have destroyed real records. I got this
      wrong by reading the published names instead of the register.
      WHAT THE REGISTER ACTUALLY HOLDS: about 100 distinct raw spellings under
      this make for a handful of type numbers — K53, K53/1, K53/2, K53/3,
      K53/21, K53/31, K53/40x, K53/M and so on, each appearing with and without
      slashes, spaces, hyphens, periods, an NL market suffix, a FLORETT prefix,
      and in one case a digit-zero for the letter O. `K53/402` alone appears as
      K53/402, K53402, K53-402, K53 402, K53 / 402, K53/ 402, K53 /402,
      K53/402NL, K53/402 NL and K531402.
      THE REAL QUESTION IS NOT SPELLING, IT IS LEVEL. K53/21 is a TYPE-APPROVAL
      NUMBER, not a nameplate. The nameplate is Florett — that is what Kreidler
      sold and what a buyer would name. So the honest disposition is probably to
      fold every K53/* id into `kreidler/florett` and keep the type numbers as
      variants, exactly as the IVA RA9015 case in B-000 concluded.
      NOT DONE, because there is no variant layer to hold them and a fold would
      DESTROY the type distinction rather than relocate it — the same wall that
      stopped the NL snorfiets `.25` records and the Velocette LE200. Kreidler
      is the sharpest case yet: 4 published ids, ~100 raw spellings, one
      nameplate underneath. Resolve when variants land (G26 / §14.1).
      DO NOT bulk-fold on the K53 prefix in the meantime. The prefix is shared
      by genuinely different types, which is the mistake this entry opens by
      admitting.
      KNOWN INERT (G13, 2026-08-01): the category is `code_string`, which IS a
      live detector, but none of the four published names matches CODE_STRING
      (/\A[A-Z]{2,}[\s.-]?\d{2,4}[A-Z0-9-]{0,8}\z/) — "Florett K53/1NL" and
      "Florett K53 / 21NL" carry a slash and a second word, and "K53-311" /
      "K53/402" open with ONE letter where the pattern needs two. So this entry
      matches 0 records and the 4 is a ledger figure. All four ids are still
      published; the debt is real and unobserved.
  - id: matchless-undetermined-manglings
    owner: s2w
    category: code_string
    id_list: [matchless/g3l5]
    count: 1
    why: >-
      TWO OF FOUR FLAGGED MANGLINGS RESOLVED, THESE TWO DELIBERATELY NOT. A swarm
      researcher flagged g3l5, g805, gs80 and g12l as matching no source and
      correctly declined to act on any of them. The raws then settled two:
      nl_rdw carries G80S (x2) alongside G805 (x1) and GS80 (x1), which are
      one-character corruptions of a well-attested code in a make whose every
      designation is G-prefixed. Those two are folded.
      THESE TWO ARE NOT, and the distinction is the point — "matches no source"
      tells you a string is probably corrupt; it does not tell you what it is
      corrupt OF, and a fold needs a target.
      g12l: RESOLVED 2026-07-26 by an ANCESTOR FOLD — g12l -> g12 with the
      disposition pair. The entry below is kept because its reasoning is what
      identified the missing evidence, and because the resolution is only valid
      inside the boundary it establishes.
      What changed: the G12DL hypothesis is now DEAD. AMC Motorcycles lists the
      twins as G12 / G12 DE LUXE / G12CS / G12CS HURICANE / G12CSR, spelling
      "De Luxe" in FULL and never abbreviating it to "DL"
      (https://www.timpintl.com/matchless-twins-history/); Rider Magazine gives
      the same 1963 four (https://ridermagazine.com/2019/10/30/retrospective-1958-1966-matchless-g12-cs-csr-650/).
      Folding to G12DL would have invented a nameplate no source has — worse
      than the corrupt string.
      What was MISSED originally: both candidate targets were SIBLINGS, which is
      why neither could be chosen. But every candidate — De Luxe, CS, CSR — IS a
      G12. G12 is the candidate set's common ancestor and the longest attested
      prefix, so folding there cannot be WRONG about the machine, only less
      specific. It also removes a real defect: a published "G12L" fails the
      marque-true claim (PRD-FIVE-NINES §1.1 claim (b)), so leaving it was not
      neutral.
      ORIGINAL REASONING, kept: "G12L" IS a genuine raw (1 row, beside G12 and
      G12 CSR), but no source records a Matchless G12L. Candidate targets are
      G12DL (De Luxe, with the D dropped) or a corruption of G12CS/G12CSR. Two
      plausible targets and no way to choose is not a merge, it is a guess with
      a citation attached.
      g3l5: THE ANCESTOR FOLD ABOVE DELIBERATELY DOES NOT TRANSFER HERE, and the
      asymmetry is the whole content of the rule. g3l5's longest attested prefix
      is G3L, and matchless/g3l exists — but here the evidence points at a
      SPECIFIC SIBLING, so folding to the ancestor would discard the more likely
      correct answer in order to satisfy a rule. An ancestor fold is honest only
      when NO candidate is favoured; where one is, it launders a guess as a
      principle. Resolution condition below is unchanged.
      g3l5: almost certainly G3LS via the same S->5 corruption now DEMONSTRATED
      in this make by the G805 case. But g3l5 does not appear in nl_rdw — it
      comes from nz_nzta, which is not in the local archive — so this would be
      inferring a specific record from a sibling pattern. That is the
      family-pattern move I warned ten swarm agents against; declining it here
      costs one fold and keeps the rule honest.
      RESOLVABLE by reading the nz_nzta raw for g3l5, and by any source that
      names a Matchless G12L or dates a G12DL. NOTE the OCR context: the
      cybermotorcycle tables this marque is documented from demonstrably
      contain this class of damage ("GBLS" for G3LS, "G8OCS" for G80CS,
      "G180" for G80), so corrupt strings here are expected, not surprising.
      KNOWN INERT (G13, 2026-08-01): same shape as kreidler above — the category
      is the live `code_string`, but "G3L5" opens with a single letter where
      CODE_STRING needs two, so the entry matches 0 records and the 1 is a
      ledger figure. motorcycle/matchless/g3l5 is still published.
