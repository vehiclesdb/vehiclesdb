# name_shapes.yml — the allowlist for scripts/lint_dataset.rb.
#
# The linter flags model names whose SHAPE suggests a defect (bare integers,
# placeholders, make-as-model, registry code strings, leftover spec tokens,
# statistical-table artifacts). Every flagged record must be explained here, in
# exactly one of two buckets:
#
#   legit — the shape is CORRECT and permanent. `MAZDA3` really is the
#           nameplate; Peugeot really does name cars 208. Entries must be
#           SHAPE-GENERAL (a pattern or an evidence condition, not four
#           spellings) and carry the same standard of evidence as an override
#           line: a source URL, or an in-data proof.
#
#   debt  — the shape is WRONG and not fixed yet. Carries a `count`, which may
#           only ever go DOWN; CI fails if it grows. "Spotless" means this
#           section is empty.
#
# One bucket would let us reach zero by relabelling junk as legitimate. That is
# how allowlists become landfills, so the split is load-bearing.
#
# Conditions available per entry: make, kind, category, pattern (regex, case-
# insensitive), id_list, min_sources, min_countries.

legit:
  # ── corroboration: the dataset's own publish rule, reused as a shape rule ──
  # DECISIONS.md § Sources & evidence: a model publishes when ≥2 independent
  # official sources agree. That same bar distinguishes a genuinely odd
  # nameplate from a parser artifact — two registries in different countries do
  # not invent the same string by accident.
  #
  # Measured 2026-07-25 on 18,133 records: 890 of 1,061 bare-integer names are
  # corroborated (Peugeot 208/2008, Abarth 595, Fiat 500, Porsche 911, Volvo
  # 240, Mercedes 1824 trucks, Scania 143…), and the 171 thin ones are almost
  # exactly the KBA shared-string leak. See NEGOTIATION.md Turns 4–8.
  - id: corroborated-numeric-nameplates
    category: numeric_only
    min_sources: 2
    min_countries: 2
    why: >-
      Numeric nameplates are normal in this industry (Peugeot 208, Fiat 500,
      Porsche 911, Volvo 240) and universal in trucks/buses, where the
      designation IS a number (Mercedes 1824 = 18t/240hp, Scania 143). Two
      independent registers in two countries agreeing is the same evidence bar
      the dataset uses to publish at all.

  - id: corroborated-code-string-records
    category: code_string
    min_sources: 2
    min_countries: 2
    why: >-
      Letters-glued-to-digits is how registers write many real nameplates
      (MAZDA3, CX-5, DB11, BJ30, RS660). Corroboration proves the RECORD is
      real, not that the spacing is canonical — display-form cleanup is tracked
      separately under debt:display-form-*, not hidden here.

  # ── historic nameplates that legitimately contain their own make ───────────
  - id: ford-historic-make-derived-nameplates
    category: embedded_make
    make: ford
    pattern: '\A(Fordor|Fordson)\z'
    why: >-
      Genuine Ford nameplates, not prefix-strip failures. "Fordor" was Ford's
      own contraction of "four-door" used on Model A/T bodies; Fordson was
      Ford's tractor/commercial marque. https://en.wikipedia.org/wiki/Ford_Model_A_(1927%E2%80%931931)
  - id: humber-humberette
    category: embedded_make
    make: humber
    pattern: '\AHumberette\z'
    why: >-
      The Humberette (1903-1905, revived 1913) is a real Humber model name.
      https://en.wikipedia.org/wiki/Humberette
  - id: jensen-healey
    category: embedded_make
    make: jensen
    pattern: '\AJensen-Healey\z'
    why: >-
      The Jensen-Healey (1972-1976, ~10,500 built) is a real nameplate — a
      Jensen Motors / Donald Healey joint venture, sold under exactly that
      hyphenated name. https://en.wikipedia.org/wiki/Jensen-Healey

  # ── modern marques whose OFFICIAL nameplates embed the make ────────────────
  # These are not prefix-strip failures: the manufacturer's own naming puts the
  # marque INSIDE the model name. Patterns are exact-list, never open-ended —
  # a new "Mazda7" appearing tomorrow should surface as a suspect, not be
  # silently excused by a wildcard.
  - id: mazda-fused-official-names
    category: embedded_make
    make: mazda
    pattern: '\AMAZDA[2356]\z'
    why: >-
      Since 2002 Mazda's official nameplates ARE the fused form — "Mazda2",
      "Mazda3", "Mazda5", "Mazda6" (https://www.mazda.com/en/about/profile/library/,
      and every national Mazda site: https://www.mazdausa.com/vehicles/mazda3-sedan).
      13 sources corroborate. All-caps display styling is a display-form
      question, not a shape defect.
  - id: polestar-numbered-official-names
    category: embedded_make
    make: polestar
    pattern: '\APolestar [2-6]\z'
    why: >-
      Polestar's models are officially named "Polestar 2" … "Polestar 5" — the
      marque word is part of the nameplate (https://www.polestar.com/us/polestar-2/).
      10-12 sources corroborate each.
  - id: omoda-numbered-official-names
    category: embedded_make
    make: omoda
    pattern: '\AOmoda (5|7|9|E5)\z'
    why: >-
      Chery's Omoda marque names its cars "Omoda 5", "Omoda 9", "Omoda E5" —
      marque-in-the-name, per the brand's own European sites
      (https://www.omodajaecoo-auto.de/modelle/omoda-5, https://omodauk.com).
      The FUSED registry forms (OMODA5, OMODA5 EV/HEV) are folded into these
      by renames.yml — only the spaced official forms are legitimate.
  - id: jaecoo-numbered-official-names
    category: embedded_make
    make: jaecoo
    pattern: '\AJaecoo [5-8]\z'
    why: >-
      Chery's Jaecoo marque names its cars "Jaecoo 5" … "Jaecoo 8"
      (https://www.omodajaecoo-auto.de/modelle/jaecoo-7, https://www.jaecoo.co.uk).
      Same structure as Omoda above; fused registry forms fold via renames.yml.

  # ── numeric type designations in the commercial kinds ─────────────────────
  # NAMING.md §7 makes this verdict explicitly KIND-DEPENDENT: in van, truck and
  # bus a bare number IS the naming convention (the designation encodes
  # tonnage/power — Mercedes 311/313, DAF 200, LDV 200/400, Fiat 230/280/290,
  # Volvo 8707, Hydrema 900), whereas in `car` it is a parser suspect. These are
  # therefore legitimate without the two-source corroboration that car-kind
  # numerics need. Scoped per kind so the entry can never excuse a car artifact.
  - id: commercial-numeric-type-designations-van
    category: numeric_only
    kind: van
    pattern: '\A\d{3,4}\z'
    why: "van type designations encode payload/series (Fiat 230/280/290, LDV 200, VW 800/1000); see NAMING.md §7"
  - id: commercial-numeric-type-designations-truck
    category: numeric_only
    kind: truck
    pattern: '\A\d{3,4}\z'
    why: "truck designations encode tonnage/power (Mercedes 311/313/400, Hydrema 900, Wacker Neuson 3000); see NAMING.md §7"
  - id: commercial-numeric-type-designations-bus
    category: numeric_only
    kind: bus
    pattern: '\A\d{3,4}\z'
    why: "bus designations are model-series numbers (DAF 200, LDV 200/400, Volvo 8707, Mercedes 300/312/400); see NAMING.md §7"

debt:
  # ── the German shared-string leak (fix is merged in the pipeline, awaiting a
  #    build; see vehiclesdb/vehiclesdb-pipeline#1) ────────────────────────────
  - id: de-kba-shared-string-leak
    category: numeric_only
    kind: car
    max_sources: 1
    pattern: '\A\d{2,3}\z'
    count: 171
    why: >-
      XlsxLite's cell regex let an empty cell swallow the next cell's <v>, so
      KBA FZ10 published shared-string INDICES as model names — audi/91 is the
      A5, volkswagen/552 is the Golf. Fixed in the pipeline (cell-bounded scan +
      fail-loud audit gates); these records heal on the next build, they must
      NOT be deleted. Two separate cleanup proposals nearly deleted Germany's
      top sellers on the opposite assumption.

  - id: de-kba-table-artifact
    category: table_artifact
    id_list: ["zeekr/neuzulassungen-insgesamt"]
    count: 1
    why: >-
      KBA's grand-total row ("Neuzulassungen insgesamt") parsed as a Zeekr
      model, and held rank 1 in Germany. The pipeline fix skips total rows;
      heals on the next build.

  # ── genuine curation backlog, 4W half (S4W) ───────────────────────────────
  - id: make-as-model-4w
    owner: s4w
    category: make_as_model
    count: 5
    why: >-
      Was 51, then 2, now 5. Dropped 49 registry rows where the make was written
      into the model column ("Audi Audi", "Toyota Toyota"); merged hummer/hummer
      into H1, because the civilian AM General Hummer really was sold under that
      name from 1992 until the H1 rename in 1999. NOTE corroboration does NOT
      clear this class — every one of the 51 was multi-source, because registers
      share the same fallback habit when a model field is blank. What remains:
      van/uaz/uaz, whose true identity is one of UAZ's own numeric type
      designations (452 / 469 / 3741 / 2206 — that IS their naming convention)
      and cannot be recovered from an aggregate row; plus bus/geely/geely,
      bus/yutong/yutong, bus/zhongtong/zhongtong — DELIBERATE additions from
      dissolving NZTA's "FACTORY BUILT" pseudo-make (moves.yml 2026-07-25),
      where the marque was ALL the model column carried, so make-as-model is
      the honest maximum. Tracked rather than guessed: guessing at an
      unresolvable row is what produced the SEAT incident.

  - id: spec-token-4w
    owner: s4w
    category: spec_token
    count: 53
    why: >-
      Powertrain/drivetrain tokens left in nameplates ("S400 Hev",
      "Explorer 2WD", "Bigster Expression Hev"). Folds into the nameplate per
      the trim policy; being fixed make-by-make.

  - id: embedded-make-prefix-4w
    owner: s4w
    category: embedded_make
    count: 1
    why: >-
      Was 22 declared / 24 measured (es_dgt re-land added two). Resolved
      2026-07-25 by per-record judgment against the manufacturer's own naming,
      exactly as this entry prescribed: 15 records were OFFICIAL
      marque-in-the-name nameplates, moved to legit (mazda/polestar/omoda/
      jaecoo entries above) with brand-site evidence; 7 were genuine fused or
      repeated-make artifacts, merged into their corroborated canonical ids
      via renames.yml + former_ids (AUDIA6→A6, Audi Q5→Q5, FIAT500→500,
      JAECOO5 HEV→Jaecoo 5, OMODA5 HEV→Omoda 5, Lynk Co 01→01) or nulled with
      a removals.yml manifest (Volkswagen-Vw — make twice, zero model info);
      Jensen-Healey was a real nameplate, moved to legit. What remains is
      van/palfinger/palfinger-p200txe-l-f24p-e6 — a crane-body type code
      (PALFINGER_P200TXE-L_F24P_E6, fi/nl) that needs the coachbuilder
      treatment, not a rename.

  # ── 2W half (S2W) — seeded from their measurement so the counter exists;
  #    they own the entries and the remedy (NEGOTIATION.md Turn 8 §4/§5) ──────
  - id: normalizer-space-collapse-display-names
    owner: s2w
    category: code_string
    max_sources: 1
    count: 269
    why: >-
      normalizer.rb:153 collapses spaces at letter/digit boundaries for
      motorcycles/mopeds to keep "AGILITY 50"/"AGILITY50" on one id — correct as
      a JOIN KEY, but the collapsed key is also used as the DISPLAY name, so
      "BANDIT 1200" publishes as BANDIT1200. Remedy is an identity/display split
      restoring the dominant spaced raw form, not override lines.
  # ── G20/D23: the two-wheel acronym-make tail (S2W, 2026-07-25) ─────────────
  - id: acronym-make-casing-2w-tail
    owner: s2w
    category: make_casing
    count: 23
    why: >-
      Makes whose DISPLAY NAME may be an initialism the pipeline title-cased,
      and which could not be resolved with evidence. 24 were resolved and
      pinned across three rounds (KTM, BSA, SYM, MZ, SWM, PGO, CPI, MBK, GPX,
      CCM, CZ, DKW, LML, FN, EBR, AGM, BTC, ZNEN, IFA, AWO, KSR Moto, JDM,
      QWIC, RGNT, UM, TYM, KMZ); these are what is left.

      THE SHAPE OF THE PROBLEM, because it is not laziness: every one is a 1-3
      record make whose only accessible evidence is the register itself, and
      registers UPPERCASE every make string — so the register can prove the
      marque exists and can never prove how it styles its own name. That is the
      same ceiling the IVA pilot documented for discontinued models, in the make
      column. mgb (2 records, uk_dft "Fantasy" and "R8") is the clearest
      example: it is NOT MG's B — that was checked and cost a research detour —
      but no source establishes what it is.

      NOT-ACRONYMS, verified and deliberately left alone so nobody "fixes" them:
      Puch (Johann Puch, a surname), Mash, Mutt (Mutt Motorcycles), Trek, Next,
      Kral (Kral Motor, Turkish), Rhon. The detector flags them because they are
      short and vowel-poor, which is a shape and not a fact.

      GENUINELY OPEN, needing a marque source that may not exist: mgb, gts
      (Italian-named scooter range — Bravo, Cappucino 50, Palermo, Toscana —
      consistent with a real marque but unsourced), em (five th_dlt records:
      Enzo, Legend, Owen, Qarez), smc (SMC Ram, likely the ATV maker), vom, tol,
      kl, aj, felq, rso, jzr, mtl, dts, djjd, dh, evt.

      ALSO OPEN AND WORTH A LOOK FIRST: moped/tym/vespa-alpha. TYM is an
      agricultural-machinery maker, so a Vespa-named moped filed under it is
      probably a registry mis-attribution rather than a casing question. The
      make is cased; the record identity is not settled.
