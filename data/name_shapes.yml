# name_shapes.yml — the allowlist for scripts/lint_dataset.rb.
#
# The linter flags model names whose SHAPE suggests a defect (bare integers,
# placeholders, make-as-model, registry code strings, leftover spec tokens,
# statistical-table artifacts). Every flagged record must be explained here, in
# exactly one of two buckets:
#
#   legit — the shape is CORRECT and permanent. `MAZDA3` really is the
#           nameplate; Peugeot really does name cars 208. Entries must be
#           SHAPE-GENERAL (a pattern or an evidence condition, not four
#           spellings) and carry the same standard of evidence as an override
#           line: a source URL, or an in-data proof.
#
#   debt  — the shape is WRONG and not fixed yet. Carries a `count`, which may
#           only ever go DOWN; CI fails if it grows. "Spotless" means this
#           section is empty.
#
# One bucket would let us reach zero by relabelling junk as legitimate. That is
# how allowlists become landfills, so the split is load-bearing.
#
# Conditions available per entry: make, kind, category, pattern (regex, case-
# insensitive), id_list, min_sources, min_countries.

legit:
  # ── corroboration: the dataset's own publish rule, reused as a shape rule ──
  # DECISIONS.md § Sources & evidence: a model publishes when ≥2 independent
  # official sources agree. That same bar distinguishes a genuinely odd
  # nameplate from a parser artifact — two registries in different countries do
  # not invent the same string by accident.
  #
  # Measured 2026-07-25 on 18,133 records: 890 of 1,061 bare-integer names are
  # corroborated (Peugeot 208/2008, Abarth 595, Fiat 500, Porsche 911, Volvo
  # 240, Mercedes 1824 trucks, Scania 143…), and the 171 thin ones are almost
  # exactly the KBA shared-string leak. See NEGOTIATION.md Turns 4–8.
  - id: corroborated-numeric-nameplates
    category: numeric_only
    min_sources: 2
    min_countries: 2
    why: >-
      Numeric nameplates are normal in this industry (Peugeot 208, Fiat 500,
      Porsche 911, Volvo 240) and universal in trucks/buses, where the
      designation IS a number (Mercedes 1824 = 18t/240hp, Scania 143). Two
      independent registers in two countries agreeing is the same evidence bar
      the dataset uses to publish at all.

  - id: corroborated-code-string-records
    category: code_string
    min_sources: 2
    min_countries: 2
    why: >-
      Letters-glued-to-digits is how registers write many real nameplates
      (MAZDA3, CX-5, DB11, BJ30, RS660). Corroboration proves the RECORD is
      real, not that the spacing is canonical — display-form cleanup is tracked
      separately under debt:display-form-*, not hidden here.

  # ── historic nameplates that legitimately contain their own make ───────────
  - id: ford-historic-make-derived-nameplates
    category: embedded_make
    make: ford
    pattern: '\A(Fordor|Fordson)\z'
    why: >-
      Genuine Ford nameplates, not prefix-strip failures. "Fordor" was Ford's
      own contraction of "four-door" used on Model A/T bodies; Fordson was
      Ford's tractor/commercial marque. https://en.wikipedia.org/wiki/Ford_Model_A_(1927%E2%80%931931)
  - id: humber-humberette
    category: embedded_make
    make: humber
    pattern: '\AHumberette\z'
    why: >-
      The Humberette (1903-1905, revived 1913) is a real Humber model name.
      https://en.wikipedia.org/wiki/Humberette
  - id: jensen-healey
    category: embedded_make
    make: jensen
    pattern: '\AJensen-Healey\z'
    why: >-
      The Jensen-Healey (1972-1976, ~10,500 built) is a real nameplate — a
      Jensen Motors / Donald Healey joint venture, sold under exactly that
      hyphenated name. https://en.wikipedia.org/wiki/Jensen-Healey
  - id: auto-union-audi-80
    category: code_string
    make: auto-union
    pattern: '\AAudi 80\z'
    why: >-
      Historically CORRECT cross-marque filing: the F103 was developed and sold
      by Auto Union GmbH from 1965 under the revived "Audi" name — the Audi 80
      variant is the 80 PS model — before Audi NSU Auto Union AG existed. A
      classic NL registration under AUTO UNION is the period truth, not a
      registry error. https://en.wikipedia.org/wiki/Audi_F103
  - id: peugeot-django
    category: code_string
    make: peugeot
    pattern: '\ADjango \d{2,3}\z'
    why: >-
      The Peugeot Django is a real retro scooter line (2014+); the number is
      displacement, which STAYS SEPARATE on two-wheelers by rule.
      https://www.peugeotmotocycles.com/ (Django range)
  - id: maico-maicoletta
    category: embedded_make
    make: maico
    pattern: '\AMaicoletta\z'
    why: >-
      The Maicoletta (introduced 1955; production 1954-1966) is one of the era's best-known German
      scooters — a genuine Maico product name, the Humberette/Fordson class.
      Cross-owner add by S4W during the post-publish sweep, flagged in
      NEGOTIATION Turn 71. https://en.wikipedia.org/wiki/Maico

  # ── modern marques whose OFFICIAL nameplates embed the make ────────────────
  # These are not prefix-strip failures: the manufacturer's own naming puts the
  # marque INSIDE the model name. Patterns are exact-list, never open-ended —
  # a new "Mazda7" appearing tomorrow should surface as a suspect, not be
  # silently excused by a wildcard.
  - id: mazda-fused-official-names
    category: embedded_make
    make: mazda
    pattern: '\AMAZDA[2356]\z'
    why: >-
      Since 2002 Mazda's official nameplates ARE the fused form — "Mazda2",
      "Mazda3", "Mazda5", "Mazda6" (https://www.mazda.com/en/about/profile/library/,
      and every national Mazda site: https://www.mazdausa.com/vehicles/mazda3-sedan).
      13 sources corroborate. All-caps display styling is a display-form
      question, not a shape defect.
  - id: polestar-numbered-official-names
    category: embedded_make
    make: polestar
    pattern: '\APolestar [2-6]\z'
    why: >-
      Polestar's models are officially named "Polestar 2" … "Polestar 5" — the
      marque word is part of the nameplate (https://www.polestar.com/us/polestar-2/).
      10-12 sources corroborate each.
  - id: omoda-numbered-official-names
    category: embedded_make
    make: omoda
    pattern: '\AOmoda (5|7|9|E5)\z'
    why: >-
      Chery's Omoda marque names its cars "Omoda 5", "Omoda 9", "Omoda E5" —
      marque-in-the-name, per the brand's own European sites
      (https://www.omodajaecoo-auto.de/modelle/omoda-5, https://omodauk.com).
      The FUSED registry forms (OMODA5, OMODA5 EV/HEV) are folded into these
      by renames.yml — only the spaced official forms are legitimate.
  - id: jaecoo-numbered-official-names
    category: embedded_make
    make: jaecoo
    pattern: '\AJaecoo [5-8]\z'
    why: >-
      Chery's Jaecoo marque names its cars "Jaecoo 5" … "Jaecoo 8"
      (https://www.omodajaecoo-auto.de/modelle/jaecoo-7, https://www.jaecoo.co.uk).
      Same structure as Omoda above; fused registry forms fold via renames.yml.

  # ── numeric type designations in the commercial kinds ─────────────────────
  # NAMING.md §7 makes this verdict explicitly KIND-DEPENDENT: in van, truck and
  # bus a bare number IS the naming convention (the designation encodes
  # tonnage/power — Mercedes 311/313, DAF 200, LDV 200/400, Fiat 230/280/290,
  # Volvo 8707, Hydrema 900), whereas in `car` it is a parser suspect. These are
  # therefore legitimate without the two-source corroboration that car-kind
  # numerics need. Scoped per kind so the entry can never excuse a car artifact.
  - id: commercial-numeric-type-designations-van
    category: numeric_only
    kind: van
    pattern: '\A\d{3,4}\z'
    why: "van type designations encode payload/series (Fiat 230/280/290, LDV 200, VW 800/1000); see NAMING.md §7"
  - id: commercial-numeric-type-designations-truck
    category: numeric_only
    kind: truck
    pattern: '\A\d{3,4}\z'
    why: "truck designations encode tonnage/power (Mercedes 311/313/400, Hydrema 900, Wacker Neuson 3000); see NAMING.md §7"
  - id: commercial-numeric-type-designations-bus
    category: numeric_only
    kind: bus
    pattern: '\A\d{3,4}\z'
    why: "bus designations are model-series numbers (DAF 200, LDV 200/400, Volvo 8707, Mercedes 300/312/400); see NAMING.md §7"

  # ── G9: two-wheel make-prefix FALSE POSITIVES, and product-is-the-brand
  #    rows (S2W, 2026-07-25) ────────────────────────────────────────────────
  - id: sym-symphony-family
    owner: s2w
    category: embedded_make
    id_list: [sym/symphony, sym/symphony-st,
              sym/symphony-new125sr-c, sym/symnh-t, sym/symply]
    why: >-
      FALSE POSITIVES of the embedded-make detector, not defects. The detector
      flags a model string starting with the make name, and SYM genuinely names
      its scooters Symphony, Symphony ST and Symply — the collision is with the
      three letters of the marque and nothing more. Verified against SYM Global
      (https://www.sym-global.com/all-models). Do NOT strip the prefix: it would
      produce "phony" and "ply".
  - id: micro-microlino
    owner: s2w
    category: embedded_make
    id_list: [micro/microlino]
    why: >-
      Same false positive. Micro Mobility Systems names the vehicle Microlino;
      the make is Micro. Four-country evidence (es,fi,lu,nl).
  - id: talaria-xxx
    owner: s2w
    id_list: [talaria/xxx]
    why: >-
      The Talaria XXX is a real e-motorbike, not a redaction placeholder.
      Independently confirmed by S4W when the same string was queried in
      styling.yml (NEGOTIATION Turn 56).
  - id: product-is-the-brand-2w
    owner: s2w
    category: make_as_model
    id_list: [paxster/paxster, cyclemaster/cyclemaster, veeley/veeley]
    why: >-
      THE G9 SPLIT. These three are make-as-model and CORRECT that way, because
      the product name IS the brand: Paxster builds one thing, the Paxster
      delivery vehicle; the Cyclemaster was a wheel-hub engine sold as the
      Cyclemaster; Veeley is a single-product e-moped marque. Inventing a model
      name for any of them would be worse than the honest row. The other four in
      this class (ural, ebretti, nicom, lvtong) are genuine artefacts and are
      tracked under make-as-model-2w below — that separation is what G9 asked
      for, and it is the whole point: the class was never homogeneous.
debt:
  # ── the German shared-string leak (fix is merged in the pipeline, awaiting a
  #    build; see vehiclesdb/vehiclesdb-pipeline#1) ────────────────────────────
  - id: de-kba-shared-string-leak
    category: numeric_only
    kind: car
    max_sources: 1
    pattern: '\A\d{2,3}\z'
    count: 171
    why: >-
      XlsxLite's cell regex let an empty cell swallow the next cell's <v>, so
      KBA FZ10 published shared-string INDICES as model names — audi/91 is the
      A5, volkswagen/552 is the Golf. Fixed in the pipeline (cell-bounded scan +
      fail-loud audit gates); these records heal on the next build, they must
      NOT be deleted. Two separate cleanup proposals nearly deleted Germany's
      top sellers on the opposite assumption.

  - id: de-kba-table-artifact
    category: table_artifact
    id_list: ["zeekr/neuzulassungen-insgesamt"]
    count: 1
    why: >-
      KBA's grand-total row ("Neuzulassungen insgesamt") parsed as a Zeekr
      model, and held rank 1 in Germany. The pipeline fix skips total rows;
      heals on the next build.

  # ── genuine curation backlog, 4W half (S4W) ───────────────────────────────
  - id: make-as-model-4w
    owner: s4w
    category: make_as_model
    count: 6
    why: >-
      Was 51, then 2, then 5, now 6. Dropped 49 registry rows where the make was written
      into the model column ("Audi Audi", "Toyota Toyota"); merged hummer/hummer
      into H1, because the civilian AM General Hummer really was sold under that
      name from 1992 until the H1 rename in 1999. NOTE corroboration does NOT
      clear this class — every one of the 51 was multi-source, because registers
      share the same fallback habit when a model field is blank. What remains:
      uaz/uaz, whose true identity is one of UAZ's own numeric type
      designations (452 / 469 / 3741 / 2206 — that IS their naming convention)
      and cannot be recovered from an aggregate row; plus geely/geely,
      yutong/yutong, zhongtong/zhongtong — DELIBERATE additions from
      dissolving NZTA's "FACTORY BUILT" pseudo-make (moves.yml 2026-07-25),
      where the marque was ALL the model column carried, so make-as-model is
      the honest maximum. Tracked rather than guessed: guessing at an
      unresolvable row is what produced the SEAT incident. The +1 (2026-07-26):
      car/vanster/vanster joined the bucket when OWNERSHIP regen assigned the
      previously-orphaned make to s4w — possibly the product-is-the-brand
      class (the G9 paxster precedent); needs marque research before moving
      to legit.

  - id: spec-token-4w
    owner: s4w
    category: spec_token
    count: 53
    why: >-
      Powertrain/drivetrain tokens left in nameplates ("S400 Hev",
      "Explorer 2WD", "Bigster Expression Hev"). Folds into the nameplate per
      the trim policy; being fixed make-by-make.

  - id: embedded-make-prefix-4w
    owner: s4w
    category: embedded_make
    count: 1
    why: >-
      Was 22 declared / 24 measured (es_dgt re-land added two). Resolved
      2026-07-25 by per-record judgment against the manufacturer's own naming,
      exactly as this entry prescribed: 15 records were OFFICIAL
      marque-in-the-name nameplates, moved to legit (mazda/polestar/omoda/
      jaecoo entries above) with brand-site evidence; 7 were genuine fused or
      repeated-make artifacts, merged into their corroborated canonical ids
      via renames.yml + former_ids (AUDIA6→A6, Audi Q5→Q5, FIAT500→500,
      JAECOO5 HEV→Jaecoo 5, OMODA5 HEV→Omoda 5, Lynk Co 01→01) or nulled with
      a removals.yml manifest (Volkswagen-Vw — make twice, zero model info);
      Jensen-Healey was a real nameplate, moved to legit. What remains is
      palfinger/palfinger-p200txe-l-f24p-e6 — a crane-body type code
      (PALFINGER_P200TXE-L_F24P_E6, fi/nl) that needs the coachbuilder
      treatment, not a rename.

  # ── 2W half (S2W) — seeded from their measurement so the counter exists;
  #    they own the entries and the remedy (NEGOTIATION.md Turn 8 §4/§5) ──────
  - id: normalizer-space-collapse-display-names
    owner: s2w
    category: code_string
    max_sources: 1
    count: 269
    why: >-
      normalizer.rb:153 collapses spaces at letter/digit boundaries for
      motorcycles/mopeds to keep "AGILITY 50"/"AGILITY50" on one id — correct as
      a JOIN KEY, but the collapsed key is also used as the DISPLAY name, so
      "BANDIT 1200" publishes as BANDIT1200. Remedy is an identity/display split
      restoring the dominant spaced raw form, not override lines.
  # ── G9: the research-blocked half (S2W, 2026-07-25) ────────────────────────
  - id: make-as-model-2w
    owner: s2w
    category: make_as_model
    id_list: [ural/ural, ebretti/ebretti, nicom/nicom, lvtong/lvtong]
    count: 4
    why: >-
      Four sole-model rows where the make name is all the model column carried,
      SPLIT OUT from the seven originally in this class (the other three are
      product-is-the-brand-2w in legit above). URAL has a real model range (Gear
      Up, cT, Sportsman) so a bare "Ural" is a genuine artefact and should
      resolve to one of them, but which cannot be recovered from an aggregate
      count. EBRETTI, NICOM and LVTONG need marque research first: all three are
      single-source or low-source e-moped importers and it is not established
      that they market a named model at all. Blocker is marque research, not
      tooling.
  - id: bare-displacement-2w
    owner: s2w
    category: numeric_only
    count: 21
    why: >-
      Bare numeric nameplates on two-wheel makes (ktm/200, ktm/390, ktm/790,
      ktm/890, cfmoto/450, cfmoto/800, bmw/259, ccm/404, sherco/250,
      motobecane/5000, saxonette/529, solex/701, solex/800, skyteam/04 …). NOT
      the corroborated-numeric-nameplates class above (Peugeot 208, Volvo 240):
      for these makes the number is a DISPLACEMENT and the nameplate needs the
      family word the register dropped — KTM sells the 390 Duke, 390 Adventure
      and 390 SMC R, so a bare "390" is three bikes at once. bmw/259 is not even
      a displacement: it is BMW's internal type code for the R1100 series.
      Resolvable per record against the type-approval number the reconciler
      already carries, or by the family word where one survives in the raw — but
      never by picking the commonest model, which is how a wrong confident
      answer gets published. COUNT IS MEASURED, not estimated: my first figure
      was 15, taken from the ids visible in the head of the lint output without
      scrolling, and the debt-growth check caught it.
  # ── G20/D23: the two-wheel acronym-make tail (S2W, 2026-07-25) ─────────────
  - id: acronym-make-casing-2w-tail
    owner: s2w
    category: make_casing
    count: 23
    why: >-
      Makes whose DISPLAY NAME may be an initialism the pipeline title-cased,
      and which could not be resolved with evidence. 24 were resolved and
      pinned across three rounds (KTM, BSA, SYM, MZ, SWM, PGO, CPI, MBK, GPX,
      CCM, CZ, DKW, LML, FN, EBR, AGM, BTC, ZNEN, IFA, AWO, KSR Moto, JDM,
      QWIC, RGNT, UM, TYM, KMZ); these are what is left.

      THE SHAPE OF THE PROBLEM, because it is not laziness: every one is a 1-3
      record make whose only accessible evidence is the register itself, and
      registers UPPERCASE every make string — so the register can prove the
      marque exists and can never prove how it styles its own name. That is the
      same ceiling the IVA pilot documented for discontinued models, in the make
      column. mgb (2 records, uk_dft "Fantasy" and "R8") is the clearest
      example: it is NOT MG's B — that was checked and cost a research detour —
      but no source establishes what it is.

      NOT-ACRONYMS, verified and deliberately left alone so nobody "fixes" them:
      Puch (Johann Puch, a surname), Mash, Mutt (Mutt Motorcycles), Trek, Next,
      Kral (Kral Motor, Turkish), Rhon. The detector flags them because they are
      short and vowel-poor, which is a shape and not a fact.

      GENUINELY OPEN, needing a marque source that may not exist: mgb, gts
      (Italian-named scooter range — Bravo, Cappucino 50, Palermo, Toscana —
      consistent with a real marque but unsourced), em (five th_dlt records:
      Enzo, Legend, Owen, Qarez), smc (SMC Ram, likely the ATV maker), vom, tol,
      kl, aj, felq, rso, jzr, mtl, dts, djjd, dh, evt.

      ALSO OPEN AND WORTH A LOOK FIRST: moped/tym/vespa-alpha. TYM is an
      agricultural-machinery maker, so a Vespa-named moped filed under it is
      probably a registry mis-attribution rather than a casing question. The
      make is cased; the record identity is not settled.
  # ── B-001 (Tranche C) findings, S2W 2026-07-26 ─────────────────────────────
  - id: saxonette-is-a-product-not-a-marque
    owner: s2w
    category: make_as_model
    id_list: [saxonette/529]
    count: 1
    why: >-
      EXISTENCE QUESTION ANSWERED, DISPOSITION BLOCKED — the Tranche C shape in
      one record. "Saxonette" is a Fichtel & Sachs PRODUCT name, originally for
      their cyclemotor engines (first generation 1938-40) and later applied to
      the motorised bicycles Hercules marketed from 1987 to 2011; the same
      machine was sold in NL and the UK as the "Spartamet". It was never an
      independent marque, so `saxonette` in the make column is the FACTORY BUILT
      shape: a non-marque where a marque belongs.
      BUT unlike FACTORY BUILT there is nothing to move it to. That case had the
      real marque sitting in the model column (Geely, Yutong); here the model
      column holds "529", a type number, and the register does not say who built
      these 18 NL rows. Hercules is the likely builder and Sparta is possible,
      and "likely" is not a disposition.
      NOTE the sibling that IS correct and must not be touched:
      moped/hercules/saxonette is the Hercules Saxonette, properly formed.
      Resolvable by type-approval number, or by a period Dutch dealer source
      naming the importer. Not by picking the likelier of two builders.
  - id: tym-identity-unresolved
    owner: s2w
    category: make_casing
    id_list: [tym/sxl, tym/vespa-alpha]
    count: 2
    why: >-
      MY OWN ERROR, found by this batch and recorded rather than quietly fixed.
      The acronym round-3 pin (`TYM: TYM`) cited TYM Corporation of Seoul, an
      AGRICULTURAL-MACHINERY maker — which is implausible for two Dutch moped
      registrations and I should have noticed that at the time. B-001 turned up
      a far likelier candidate: Tym', a FRENCH electric-scooter brand (Castres,
      launched 2022, models Tym'S / Tym'M / Tym'L, the L explicitly Vespa-styled).
      That would make the correct display "Tym'" — apostrophe, title case — not
      "TYM", so the pin itself may be wrong and not merely under-evidenced.
      Neither candidate explains the published model names ("Sxl", "Vespa
      Alpha"), and a third possibility is in the same batch: go-tulip-b-v
      publishes "Selana Alpha", and the Selana Alpha is a real RDW-approved
      Dutch e-scooter — so "Alpha" may be Selana's model wearing another badge.
      Left unresolved deliberately. The pin is casing-only and changes no id, so
      it is harmless while wrong; asserting either company would not be.
      This is the third time this pass that a claim of mine was plausible,
      well-sourced-looking and wrong in a detail nobody checks because it is not
      the conclusion.

  - id: icaur-sub-brand-under-chery
    owner: s4w
    category: code_string
    id_list: [chery/icaur-03]
    count: 1
    why: >-
      iCAUR is Chery's sub-brand (iCAR, renamed for export); my_jpj files the
      03 under the parent. The clean fix is a move to an icaur make, but that
      mints a single-record my-only make — blocked on a second source or a
      threshold decision. Do not strip the prefix; iCAUR 03 is the name.
  - id: mega-marque-research
    owner: s2w
    category: make_as_model
    id_list: [mega/mega]
    count: 1
    why: >-
      RESEARCHED 2026-07-26 (S2W, the marque question filed to me in NEGOTIATION
      Turn 71). It is the SECOND of the two hypotheses: Aixam's Mega marque with
      an echoed model column, NOT the product-is-the-brand class.
      THE MAKE IS REAL AND WELL EVIDENCED. Mega is the marque Aixam (Aix-les-
      Bains, Savoie, founded 1983) has used since 1992, and it still sells under
      it — in the Netherlands the current Mega product is the e-Scouty, an
      electric brommobiel launched 2023. https://www.aixam.com/
      THE MODEL IS NOT RECOVERABLE. Both registers echo the make into the model
      column and nothing else: lu_snca `MEGA | MEGA` (1 row) and nl_rdw
      `MEGA | MEGA` (28). Mega has real nameplates (e-Scouty, e-City, Club,
      Multitruck), so this is not a marque that names its product after itself —
      the register simply did not record which one. Same wall as `ebretti` and
      `veeley`: the existence question is ANSWERED, the disposition is blocked.
      NOTE FOR THE G24 KIND WORK: a brommobiel is an L6e/L7e quadricycle, not a
      two-wheeler. These 29 rows sit in `moped` because that is where NL/LU
      registration puts them, and they are the same adjudication as the ua
      КВАДРОЦИКЛ/ТРИЦИКЛ rows and the es_dgt L6E quadricycle nameplates. If G24
      ever mints a quadricycle kind, this record moves with them.

  - id: fixed-awaiting-publish
    owner: s2w
    category: spec_token
    id_list: [triumph/tiger-800xc-abs]
    count: 1
    why: >-
      The fix (ABS fold rename + alias) is MERGED but the record is still in
      the published catalog this lint measures — the pending-publish window,
      same class lint_review already tolerates via alias-target liveness.
      Empties at the next release; if it survives one, something is wrong.
  # ── B-001 (Tranche C) cross-make findings, S2W 2026-07-26 ───────────────────
  - id: model-column-acronym-casing
    owner: s2w
    category: model_casing
    count: 511
    why: >-
      THE MAKE-COLUMN ACRONYM PROBLEM HAS A MODEL-COLUMN TWIN, and it is bigger.
      smart_case title-cases any pure-alpha token missing from styling.yml's
      `acronyms` list, so an unnoticed type code becomes a word: "CL" -> "Cl",
      "KS Super" -> "Ks Super", "SC-153" -> "Sc-153", "LT-019" -> "Lt-019",
      "SXL" -> "Sxl". B-001 hit five instances in 46 tiny makes, which is what
      prompted measuring it globally.
      MEASURED, not estimated, by scripts/find_published_name_defects.rb against
      the build at the head of this branch: 1223 records over 305 distinct
      tokens catalog-wide; 511 records over 201 tokens in the 2W half (mine).
      The count is a WORKLIST, NOT A DEFECT COUNT — the check nominates any
      token the catalog itself also spells in caps, and real nameplate words
      leak through on purpose (MAX, PRO, LE, BOY, BOB, APE are genuine words
      that also appear capitalised somewhere). Each TOKEN needs one human call;
      ~305 calls covers the catalog, and a token pinned in `acronyms` fixes
      every record carrying it at once.
      THE UNAMBIGUOUS SUBSET, safe to fix without per-make research: Roman
      numerals. "Iii", "Ii", "Ix" are never correct in any marque's naming —
      22 records (moto-guzzi/850LE Mans Iii, moto-guzzi/California Iii,
      norton/Commando 850MK Iii, harley-davidson/Fxrs Super Glide Ii,
      ktm/Duke Ii, jaguar/Mark Ix …). Start there.
      WHY NO EXISTING TOOL CATCHES IT: registers uppercase every string, so the
      raw can never disprove a title-cased published name, and
      find_duplicate_spellings compares raws to raws. This defect is introduced
      AFTER normalisation and is only visible in the published catalog.
      Fixed in this batch where B-001 owned the make (capri/cl, edwards/sc-153,
      i-goo/lt019, e-solex/es, zundapp-famel/ks-super); the rest is a sweep of
      its own, deliberately not smuggled into a Tranche C batch.
      TRANCHE 1 DONE (2026-07-26): Roman numerals II/III pinned as global
      `acronyms` tokens — 18 records, 17 of them 2W, ZERO id churn (a casing pin
      cannot change a slug, and that was verified rather than assumed). IX was
      deliberately NOT pinned: Jaguar Mark IX wants caps but Hyundai ix35 is
      officially lowercase, so one global token cannot serve both.
      RESIDUAL DEFECTS still visible in those same 18 records, i.e. the numeral
      was never the only thing wrong: moto-guzzi/850LE Mans III (should be
      "850 Le Mans III" — glued displacement AND a French article title-cased
      as an initialism), norton/Commando 850MK III ("850 Mk III"),
      harley-davidson/Fxrs Super Glide II (FXRS), nsu/Prima III Kl (KL),
      ryuka/Save-II S Fi (FI), suzuki/Lets II (Suzuki writes "Let's"). These
      need per-record renames plus former_ids where the slug moves, and are the
      next tranche.
  - id: nl-snorfiets-25-suffix
    owner: s2w
    category: variant_as_model
    id_list: [moped/fosti/ft50qt-e-25, moped/znen/zn50qt-e-25, moped/znen/zn50qt-f-25, moped/zhongneng/zn50qt-e-25, moped/znen/zn50qt-e3-25]
    count: 5
    why: >-
      Dutch law splits 50cc two-wheelers into the bromfiets (45 km/h, blue
      plate) and the snorfiets (25 km/h), and RDW type designations mark the
      speed-limited version by appending ".25" to the OEM type code. So
      "FT50QT-E" and "FT50QT-E.25" are ONE nameplate in two speed variants, not
      two models — SCHEMA.md puts speed variants below the model level.
      Four of the five have their unsuffixed base ALSO published, so the merge
      target already exists; znen/zn50qt-e3-25 does not and would need its base
      to publish first or a rename to the bare code.
      NOT ACTIONED because folding them means asserting the variant relationship
      in a layer that does not exist yet — there is no model-level variant
      store, so the only available "fix" is deleting a published id and losing
      the distinction. Filed so the variant work has a concrete first case, and
      so nobody merges them blind in the meantime.
      Same convention explains the ".S" and "E3" suffixes in the same registers
      (fosti RETRO / RETRO.S), which are NOT speed classes — do not generalise
      the dot.
