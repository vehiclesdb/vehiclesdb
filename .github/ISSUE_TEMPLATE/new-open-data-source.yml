name: New open data source
description: An official open data source (a register, a type-approval list) that VehiclesDB does not use yet.
title: "Source: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks: an official open source we're missing, especially outside Europe, is the highest-leverage contribution there is. We need the URL and its licence text.
  - type: input
    id: url
    attributes:
      label: Source URL
      description: Where the data can be downloaded or browsed.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country or region
    validations:
      required: true
  - type: textarea
    id: licence
    attributes:
      label: Licence
      description: The licence text, or a URL to it (for example the portal's terms of use or the dataset's licence page).
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What it contains (optional)
      description: Makes, models, counts, years, kinds of vehicle; how often it is updated.
    validations:
      required: false
