name: Build & publish data

# The data build — a CANARY. It builds and validates; it NEVER publishes.
# (The workflow keeps its name so existing run history, badges and links stay
# valid; "publish" now happens only through a trusted release, see below.)
#
# ── WHY THE SCHEDULED BUILD NO LONGER PUBLISHES (2026-11-18) ────────────────
#
# A release has two halves that must come from ONE build: this repo's open
# dataset and the project's private feed (`plus-<VERSION>`, RELEASE-RUNBOOK
# §5.5 — a rebuild is not byte-identical, so "the same inputs" is not "the same
# build"). Part of the private feed's inputs may never be present on a
# GitHub-hosted runner, in this repo, or in its logs and artifacts. A build on
# this runner is therefore ALWAYS an incomplete private feed: when the monthly
# cron published v2026.11.10 it also shipped a private feed missing those
# inputs (and built on a fresh, non-accumulated history store); the website
# correctly refused it and stayed on the previous version until a release was
# cut by hand.
#
# Publishing only the public half here and the private half elsewhere cannot
# satisfy "one build" either. So no unattended run publishes anything. Every
# release — public and private — is cut by the pipeline repo's release script
# on a trusted machine, from a single build (RELEASE-RUNBOOK §0.1). This
# workflow's job is to say when one is DUE and to keep main honest.
#
# What did NOT change for consumers: release-channels.yml still fans every
# release out to release assets, jsDelivr, Hugging Face and Zenodo on the
# `release: published` event, which a hand-cut release fires. What changed is
# the cadence: releases now appear when a maintainer cuts one (monthly target),
# not automatically on the 12th.
#
# While vehiclesdb/vehiclesdb-pipeline is PRIVATE, checking it out needs one secret:
#   PIPELINE_REPO_TOKEN — a fine-grained PAT that can READ vehiclesdb/vehiclesdb-pipeline
#   (Repository access = pipeline only, Contents: Read). Add it under
#   Settings → Secrets and variables → Actions. If the pipeline repo ever goes
#   public, delete the secret; the fallback to github.token takes over.
#
# Cadence (PRD-3 D12):
#   * weekly VALIDATE-ONLY run (Mondays 04:23 UTC) — catches upstream drift
#     (license pins, URL rotations, format changes) within days, publishes
#     nothing;
#   * monthly RELEASE-DUE run (12th, 04:23 UTC) — after the month's uploads
#     land upstream (KOTSA ~2nd, KBA ~5th, JPJ ~10th). Validates exactly like
#     the weekly run and, when GREEN, opens/updates one `release-due` issue
#     with the per-kind counts this build would ship vs the committed catalog.
#     It still publishes nothing.
#   Cron minutes/hours are deliberately off-round: GitHub delays on-the-hour
#   crons under load, and upstreams appreciate the jitter.
#
# On gate failure a `pipeline-failure` issue is opened/updated so a broken
# build is impossible to miss (license drift, delta trips, geo-blocked
# fetches, upstream URL scheme changes — the UK rotates asset URLs per
# release, Thailand 403s datacenter IPs; both are handled but watched).

on:
  schedule:
    - cron: "23 4 * * 1"   # weekly validate-only
    - cron: "23 4 12 * *"  # monthly release-due canary (validate-only)
  # Validate-only on demand; also refreshes the release-due issue when green.
  # There is deliberately no `publish` input any more (see the header).
  workflow_dispatch:
  pull_request:
    paths:
      - "overrides/**"
      - "spotchecks.yml"
      - "data/licenses/**"
      - ".github/workflows/monthly-build.yml"

concurrency:
  # KEYED BY REF, not global. With a single `data-build` group, every push to
  # main enters the same queue as every open PR check — and GitHub cancels
  # PENDING runs when a newer one joins a group. `cancel-in-progress: false`
  # protects only the run already executing, not the queue behind it.
  #
  # MEASURED 2026-07-26 during the wave-3 merge burst: three open PR builds
  # were CANCELLED — not failed — while main-builds from the other session's
  # merges kept entering the group. An earlier PR (data#101) showed "no checks"
  # at all for the same reason and had to be re-cut on a fresh branch.
  #
  # The effect is asymmetric and silent: whichever maintainer is merging
  # starves the other's checks, and "merge on green" becomes unobtainable for
  # the one who is not merging. A cancelled check reads as absent, not failed,
  # so it looks like flakiness rather than contention.
  #
  # Keying by ref keeps publishes serialised against each other — they all
  # share refs/heads/main — while letting PR checks run. That is the original
  # intent; it was only accidentally coupled to PR traffic.
  group: data-build-${{ github.ref }}
  cancel-in-progress: false # never kill a build mid-run

permissions:
  contents: read # nothing is pushed, tagged or released from here
  issues: write  # pipeline-failure and release-due issues

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # FI (190MB) + UA (36MB) + full parses fit comfortably
    steps:
      - name: Checkout data repo (this repo)
        uses: actions/checkout@v4
        with:
          path: data-repo
          # Full history + tags: the pipeline derives the next free
          # YYYY.MM.P version from existing tags (autopilot idempotency).
          fetch-depth: 0

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: vehiclesdb/vehiclesdb-pipeline
          path: pipeline-repo
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # PINNED to a GitHub release asset, not the install script. The script
      # route (`curl -sL https://install.duckdb.org | sh`) 404'd on its internal
      # tarball on 2026-08-24 and 2026-08-31: `tar` aborted, this step failed,
      # and every step after it — cache restore, tests, claims lint, THE BUILD —
      # was SKIPPED for two consecutive weekly runs. The failure handler then
      # filed issue #321 pointing at "the gate that tripped", and there was no
      # gate in the log at all: main's real gate state was unknown for two weeks.
      # A pinned URL + checksum either serves the same bytes or fails loudly
      # HERE, with the cause in this step's own output. Bump the version and the
      # hash together; `sha256sum -c` refuses a mismatch.
      - name: Install duckdb (parquet emitter)
        run: |
          set -euo pipefail
          DUCKDB_VERSION=v1.5.5
          DUCKDB_SHA256=08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
          curl -fsSL --retry 3 -o /tmp/duckdb_cli.zip \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  /tmp/duckdb_cli.zip" | sha256sum -c -
          mkdir -p "$HOME/.duckdb/bin"
          unzip -oq /tmp/duckdb_cli.zip -d "$HOME/.duckdb/bin"
          echo "$HOME/.duckdb/bin" >> "$GITHUB_PATH"
          "$HOME/.duckdb/bin/duckdb" --version

      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: pipeline-repo/cache
          # v2 (2026-11-09): CACHE NAMESPACE BUMP. Every run restored the newest
          # `source-cache-*` entry, and that lineage still carried NZ ArcGIS chunk
          # files (nz_<type>_<letter>.json) cached from an EARLIER NZ snapshot
          # service. The chunk cache name does not include the service, and the
          # chunks live 25 days (nz_nzta.rb max_age), so a service rotation left
          # stale, pre-recovery F/H/… chunks in place: the 2026.11.0/11.1 PR builds
          # logged `nz_nzta car: 17447 pairs` (only C and M recovered by
          # pagination) against 24,566 locally on the same inputs, and reported
          # ~14 NZ-only ids as "vanishing" (data#389, #390, #392 — verified false
          # locally each time). A new key prefix starts one clean lineage; the
          # geo-gated files come back from the ci-cache-seed release below.
          # Durable fix (pipeline follow-up): scope the NZ chunk cache name by the
          # snapshot service so a rotation can never reuse old chunks.
          key: source-cache-v2-${{ github.run_id }}
          restore-keys: source-cache-v2-
          # save-always: actions/cache skips its post-job SAVE step when the job
          # FAILED. Measured consequence during the 2026-07-12→25 outage: the
          # repo held exactly ONE cache entry (source-cache-28779105628,
          # 319.57 MiB, created 07-06) which every failing run restored but none
          # refreshed — so each retry re-downloaded every file published after
          # 07-06 (KBA June, DGT June…) from scratch, and the entry drifted
          # toward GitHub's 7-day no-access eviction while the next weekly run
          # sat exactly on that boundary. If it had been evicted, cold-cache
          # fetches to the portals that reject datacenter IPs (th_dlt,
          # fi_traficom — see the seed step below) would have started failing on
          # top of the real cause, changing the symptom mid-investigation.
          # Saving on failure keeps a broken build's downloads useful.
          # NB actions/cache deprecates this input in favour of the separate
          # actions/cache/restore + actions/cache/save pair; if you upgrade past
          # v4, split the steps and put the save in an `if: always()` step.
          save-always: true

      # Some portals reject datacenter IPs (measured: Thailand DLT resets
      # GitHub runners). The pipeline's keep-last-good fetch layer handles
      # that FINE — as long as a last-good copy exists. This seed guarantees
      # one on cold caches; warm caches carry it forward via actions/cache,
      # and --skip-existing keeps newer cached copies over the seed.
      - name: Seed geo-gated source files (cold caches only)
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}
        run: |
          gh release download ci-cache-seed -R vehiclesdb/vehiclesdb-pipeline \
            --dir pipeline-repo/cache --skip-existing || echo "no seed release — continuing"

      - name: Run pipeline tests
        working-directory: pipeline-repo
        env:
          # The golden tests load the curated overrides from the data repo —
          # CI's checkout layout differs from the local sibling-dir default.
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
        run: rake test

      # Claims lint — checks the PROSE we ship against the code behind it.
      # REPORT-ONLY on purpose: six claims are unbacked as this lands (a public
      # licence offering no-attribution use over CC-BY/OGL sources, and three
      # PRD coverage lines that describe their own adapters wrongly). Those are
      # the owner's and the release maintainer's calls, so this surfaces them
      # rather than breaking the build to force a decision. Flip to --strict
      # once the ledger is clear. See NEGOTIATION Turns 189-196.
      - name: Claims lint (report-only)
        working-directory: pipeline-repo
        env:
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
        run: ruby pipeline/tools/lint_claims.rb

      # Validate only, always: no --publish, so nothing is synced into this
      # checkout, let alone committed. A release is cut by the trusted script.
      - name: Build and validate
        working-directory: pipeline-repo
        env:
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
        run: ruby pipeline/run.rb

      # Every run uploads build/out — there is no publish run any more to
      # exclude. (History: this condition once excluded the scheduled runs too,
      # and a red main went eleven days with nothing to inspect.)
      - name: Upload build artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vehiclesdb-build
          path: |
            pipeline-repo/build/out
            pipeline-repo/build/report.json
            pipeline-repo/build/candidates
          retention-days: 7
          if-no-files-found: ignore

      # ── RELEASE DUE. On the monthly cron (or a manual dispatch) a GREEN build
      # means "a release can be cut now". Say so in ONE issue, updated in place,
      # with what the build would ship per kind against the committed catalog.
      # Opening an issue is the whole action: the release itself is cut by the
      # pipeline repo's release script on a trusted machine (RELEASE-RUNBOOK
      # §0.1), which also produces the private feed from the same build.
      - name: Open/update release-due issue (green monthly/dispatch runs)
        if: >-
          success() && (
            (github.event_name == 'schedule' && startsWith(github.event.schedule, '23 4 12')) ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          table=$(ruby -rjson -e '
            built = JSON.parse(File.read("pipeline-repo/build/out/manifest.json"))
            live  = JSON.parse(File.read("data-repo/manifest.json"))
            kinds = (built["kinds"].keys | live["kinds"].keys).sort
            puts "| kind | committed (#{live["version"]}) | this build | delta |", "|---|---:|---:|---:|"
            kinds.each do |k|
              a = live.dig("kinds", k, "models").to_i; b = built.dig("kinds", k, "models").to_i
              puts "| #{k} | #{a} | #{b} | #{format("%+d", b - a)} |"
            end')
          body="The monthly build is GREEN: ${RUN_URL}

          ${table}

          Next step: cut the release with the pipeline repo's release script (a trusted run produces the open dataset and the private feed from one build — RELEASE-RUNBOOK §0.1). Close this issue once the release is out. This workflow publishes nothing by design."
          gh label create release-due --repo "${{ github.repository }}" --color 0e8a16 \
            --description "A green monthly build: a release can be cut (opened/updated by monthly-build.yml)" 2>/dev/null || true
          existing=$(gh issue list --repo "${{ github.repository }}" --label release-due --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "Release due" --body "$body" --label release-due
          fi

      # A failed scheduled build must page a human. One issue, updated — never
      # a new issue per failure night (the OpenASN pattern, verbatim).
      - name: Open/update pipeline-failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled data build failed"
          body="The scheduled build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most likely causes (see the job log for the gate that tripped):
          - Pipeline checkout: PIPELINE_REPO_TOKEN missing/expired (needed while vehiclesdb/vehiclesdb-pipeline is private)
          - License gate: an upstream changed its terms text (data/licenses/ pins — review + rake licenses:pin)
          - Delta gate: a kind's model count moved >±20% (source outage or format change)
          - Geo-gated fetch: TH/LV endpoints reject datacenter IPs (keep-last-good covers cached CI, but a cold cache fails)
          - An upstream URL scheme changed (UK rotates asset URLs per release; NZ renames its MVR_* service monthly)"
          existing=$(gh issue list --repo ${{ github.repository }} --label pipeline-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --repo ${{ github.repository }} --title "$title" --body "$body" --label pipeline-failure
          fi

# The release channel fan-out is NOT invoked from here any more: nothing here
# creates a release. The trusted release script builds and syncs, then PRINTS
# the commit/tag/`gh release create` commands; the maintainer runs them. That
# human-run `gh release create` (a maintainer's token, not the default
# GITHUB_TOKEN, which would suppress the event) fires `release: published`, and
# that event triggers release-channels.yml.
