name: Build & publish data

# The data build. Lives in THIS repo (not the pipeline repo) on purpose:
# releases publish here, so the repo's own GITHUB_TOKEN can upload assets and
# open failure issues — the same layout OpenASN runs in production.
#
# While vehiclesdb/vehiclesdb-pipeline is PRIVATE, checking it out needs one secret:
#   PIPELINE_REPO_TOKEN — a fine-grained PAT that can READ vehiclesdb/vehiclesdb-pipeline
#   (Repository access = pipeline only, Contents: Read). Add it under
#   Settings → Secrets and variables → Actions. If the pipeline repo ever goes
#   public, delete the secret; the fallback to github.token takes over.
#
# Cadence (PRD-3 D12):
#   * weekly VALIDATE-ONLY run (Mondays 04:23 UTC) — catches upstream drift
#     (license pins, URL rotations, format changes) within days, publishes
#     nothing;
#   * monthly PUBLISH run (12th, 04:23 UTC) — after the month's uploads land
#     upstream (KOTSA ~2nd, KBA ~5th, JPJ ~10th).
#   Cron minutes/hours are deliberately off-round: GitHub delays on-the-hour
#   crons under load, and upstreams appreciate the jitter.
#
# On gate failure a `pipeline-failure` issue is opened/updated so a broken
# build is impossible to miss (license drift, delta trips, geo-blocked
# fetches, upstream URL scheme changes — the UK rotates asset URLs per
# release, Thailand 403s datacenter IPs; both are handled but watched).

on:
  schedule:
    - cron: "23 4 * * 1"   # weekly validate-only
    - cron: "23 4 12 * *"  # monthly publish
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build (sync + release)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "overrides/**"
      - "spotchecks.yml"
      - "data/licenses/**"
      - ".github/workflows/monthly-build.yml"

concurrency:
  # KEYED BY REF, not global. With a single `data-build` group, every push to
  # main enters the same queue as every open PR check — and GitHub cancels
  # PENDING runs when a newer one joins a group. `cancel-in-progress: false`
  # protects only the run already executing, not the queue behind it.
  #
  # MEASURED 2026-07-26 during the wave-3 merge burst: three open PR builds
  # were CANCELLED — not failed — while main-builds from the other session's
  # merges kept entering the group. An earlier PR (data#101) showed "no checks"
  # at all for the same reason and had to be re-cut on a fresh branch.
  #
  # The effect is asymmetric and silent: whichever maintainer is merging
  # starves the other's checks, and "merge on green" becomes unobtainable for
  # the one who is not merging. A cancelled check reads as absent, not failed,
  # so it looks like flakiness rather than contention.
  #
  # Keying by ref keeps publishes serialised against each other — they all
  # share refs/heads/main — while letting PR checks run. That is the original
  # intent; it was only accidentally coupled to PR traffic.
  group: data-build-${{ github.ref }}
  cancel-in-progress: false # never kill a publish mid-release

permissions:
  contents: write # push the release commit + tag
  issues: write   # open pipeline-failure issues

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # FI (190MB) + UA (36MB) + full parses fit comfortably
    outputs:
      # Consumed by the `channels` job below. Empty on a validate-only run,
      # which is how that job knows to skip.
      released_tag: ${{ steps.release.outputs.released_tag }}
    steps:
      - name: Checkout data repo (this repo)
        uses: actions/checkout@v4
        with:
          path: data-repo
          # Full history + tags: the pipeline derives the next free
          # YYYY.MM.P version from existing tags (autopilot idempotency).
          fetch-depth: 0

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: vehiclesdb/vehiclesdb-pipeline
          path: pipeline-repo
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install duckdb (parquet emitter)
        run: |
          curl -sL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: pipeline-repo/cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-
          # save-always: actions/cache skips its post-job SAVE step when the job
          # FAILED. Measured consequence during the 2026-07-12→25 outage: the
          # repo held exactly ONE cache entry (source-cache-28779105628,
          # 319.57 MiB, created 07-06) which every failing run restored but none
          # refreshed — so each retry re-downloaded every file published after
          # 07-06 (KBA June, DGT June…) from scratch, and the entry drifted
          # toward GitHub's 7-day no-access eviction while the next weekly run
          # sat exactly on that boundary. If it had been evicted, cold-cache
          # fetches to the portals that reject datacenter IPs (th_dlt,
          # fi_traficom — see the seed step below) would have started failing on
          # top of the real cause, changing the symptom mid-investigation.
          # Saving on failure keeps a broken build's downloads useful.
          # NB actions/cache deprecates this input in favour of the separate
          # actions/cache/restore + actions/cache/save pair; if you upgrade past
          # v4, split the steps and put the save in an `if: always()` step.
          save-always: true

      # Some portals reject datacenter IPs (measured: Thailand DLT resets
      # GitHub runners). The pipeline's keep-last-good fetch layer handles
      # that FINE — as long as a last-good copy exists. This seed guarantees
      # one on cold caches; warm caches carry it forward via actions/cache,
      # and --skip-existing keeps newer cached copies over the seed.
      - name: Seed geo-gated source files (cold caches only)
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}
        run: |
          gh release download ci-cache-seed -R vehiclesdb/vehiclesdb-pipeline \
            --dir pipeline-repo/cache --skip-existing || echo "no seed release — continuing"

      - name: Run pipeline tests
        working-directory: pipeline-repo
        env:
          # The golden tests load the curated overrides from the data repo —
          # CI's checkout layout differs from the local sibling-dir default.
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
        run: rake test

      # Claims lint — checks the PROSE we ship against the code behind it.
      # REPORT-ONLY on purpose: six claims are unbacked as this lands (a public
      # licence offering no-attribution use over CC-BY/OGL sources, and three
      # PRD coverage lines that describe their own adapters wrongly). Those are
      # the owner's and the release maintainer's calls, so this surfaces them
      # rather than breaking the build to force a decision. Flip to --strict
      # once the ledger is clear. See NEGOTIATION Turns 189-196.
      - name: Claims lint (report-only)
        working-directory: pipeline-repo
        env:
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
        run: ruby pipeline/tools/lint_claims.rb

      - name: Build (validate always; sync only when publishing)
        working-directory: pipeline-repo
        env:
          VDB_DATA_REPO: ${{ github.workspace }}/data-repo
          # The monthly cron (day 12) and dispatch-with-publish sync + release;
          # weekly cron and PRs validate only.
          PUBLISH: ${{ (github.event_name == 'schedule' && startsWith(github.event.schedule, '23 4 12')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            ruby pipeline/run.rb --publish
          else
            ruby pipeline/run.rb
          fi

      - name: Upload build artifacts for inspection (non-publish runs)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vehiclesdb-build
          path: |
            pipeline-repo/build/out
            pipeline-repo/build/report.json
            pipeline-repo/build/candidates
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit, tag and release (publish runs)
        id: release
        if: (github.event_name == 'schedule' && startsWith(github.event.schedule, '23 4 12')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
        working-directory: data-repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          git config user.name "vehiclesdb-pipeline"
          git config user.email "pipeline@vehiclesdb.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes this cycle — skipping release."
            exit 0
          fi
          # The pipeline already derived a version whose tag is FREE (it reads
          # this clone's tags), so tag/release collisions mean a real bug —
          # no `|| true` blindfolds here; fail loud instead of half-releasing.
          git commit -m "Release ${VERSION}"
          git tag "v${VERSION}"
          git push && git push --tags
          MODELS=$(ruby -rjson -e 'puts JSON.parse(File.read("manifest.json"))["kinds"].sum { |_, v| v["models"] }')
          PARQUET=""
          [ -f dist/vehicles.parquet ] && PARQUET="dist/vehicles.parquet"
          gh release create "v${VERSION}" --title "VehiclesDB ${VERSION}" \
            --notes "Automated data release: ${MODELS} models. Sources, licenses and provenance: manifest.json + ATTRIBUTION.md; changes: CHANGELOG.md." \
            dist/vehicles.json dist/vehicles.csv dist/vehicles.min.json dist/catalog.sqlite ${PARQUET} manifest.json ATTRIBUTION.md
          # Hand the tag to the `channels` job. Only set when a release really
          # happened — the no-data-changes path above exits 0 without one.
          echo "released_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # ── The PRIVATE plus-<VERSION> release. It MUST be cut here, in the job
      # that ran the build: `build/out-private` exists only on this runner and
      # is wiped by the next build. It cannot be reconstructed from a tag —
      # a rebuild is not byte-identical (~37-record variance from cache state
      # alone), and a mismatched catalog-plus/dist pair is exactly the
      # incoherence the DATA-CONTRACT version-lock exists to prevent.
      #
      # Skips cleanly (loudly) without a write-scoped token, so the release
      # itself is never blocked on a missing secret. PIPELINE_REPO_TOKEN is
      # Contents:READ and cannot create a release; this needs its own
      # Contents:WRITE PAT on vehiclesdb/vehiclesdb-pipeline.
      - name: Cut the private plus-<VERSION> release
        if: success() && steps.release.outputs.released_tag != ''
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_RELEASE_TOKEN }}
          VERSION: ${{ steps.release.outputs.released_tag }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PIPELINE_RELEASE_TOKEN not set — plus-${V} NOT cut. The paid feed will be stranded on the previous version until it is cut by hand (RELEASE-RUNBOOK.md §5.5). Mint a fine-grained PAT with Contents:Write on vehiclesdb/vehiclesdb-pipeline."
            exit 0
          fi
          OUT=pipeline-repo/build/out-private
          [ -d "$OUT" ] || { echo "::error::$OUT missing — the build did not emit the private layer"; exit 1; }
          PLUS=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0]))["version"]' "$OUT/MANIFEST-PLUS.json")
          [ "$PLUS" = "$V" ] || { echo "::error::version-lock: MANIFEST-PLUS=$PLUS but release=$V"; exit 1; }
          [ -n "$(ls -A "$OUT/catalog-plus")" ] || { echo "::error::catalog-plus is empty"; exit 1; }
          [ -f "$OUT/registrations-${V}.json" ] || { echo "::error::missing registrations-${V}.json"; exit 1; }
          tar czf "/tmp/catalog-plus-${V}.tar.gz" -C pipeline-repo/build out-private
          gh release create "plus-${V}" -R vehiclesdb/vehiclesdb-pipeline \
            --title "catalog-plus ${V} (private — vehiclesdb-web feed)" \
            --notes "Private enriched layer for public release v${V}. Version-locked: MANIFEST-PLUS.json version == public VERSION == ${V}. Cut from the same build that produced v${V}. Ingest: bin/data-update ${V}" \
            "/tmp/catalog-plus-${V}.tar.gz"
          # Round-trip the PUBLISHED artifact, not the local copy.
          T=$(mktemp -d)
          gh release download "plus-${V}" -R vehiclesdb/vehiclesdb-pipeline -D "$T" --clobber
          tar xzf "$T"/*.tar.gz -C "$T"
          RT=$(ruby -rjson -e 'puts JSON.parse(File.read(ARGV[0]))["version"]' "$T/out-private/MANIFEST-PLUS.json")
          [ "$RT" = "$V" ] || { echo "::error::round-trip says $RT, expected $V"; exit 1; }
          echo "plus-${V} published and verified"

      # The HuggingFace mirror and the jsDelivr purge USED TO LIVE HERE, gated
      # on this workflow's own event. That made them invisible to any release
      # not cut by this workflow — and v2026.08.0 and v2026.08.1 were both cut
      # by hand, so neither ran, and v2026.08.1 also shipped with zero release
      # assets. They now live in release-channels.yml, keyed to the RELEASE
      # rather than to who produced it, and are invoked by the `channels` job
      # below. One implementation, two entry points, no drift.

      # A failed scheduled build must page a human. One issue, updated — never
      # a new issue per failure night (the OpenASN pattern, verbatim).
      # --repo IS LOAD-BEARING, do not drop it: this step runs at the WORKSPACE
      # ROOT, and monthly-build checks the two repos out into data-repo/ and
      # pipeline-repo/ subdirectories (see the `path:` keys above). With no
      # .git in the cwd, `gh` cannot infer the repository and every call here
      # dies with "failed to run git: fatal: not a git repository". The
      # `|| true` on the list call then leaves $existing empty, so the create
      # runs and exits 1 — on a build that was ALREADY failing, so the extra
      # error is invisible. Net effect: a red build pages nobody. That is
      # exactly what happened 2026-08-10 / 08-12 / 08-17 — three consecutive
      # red weekly builds, zero pipeline-failure issues, noticed a week late.
      - name: Open/update pipeline-failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scheduled data build failed"
          body="The scheduled build failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most likely causes (see the job log for the gate that tripped):
          - Pipeline checkout: PIPELINE_REPO_TOKEN missing/expired (needed while vehiclesdb/vehiclesdb-pipeline is private)
          - License gate: an upstream changed its terms text (data/licenses/ pins — review + rake licenses:pin)
          - Delta gate: a kind's model count moved >±20% (source outage or format change)
          - Geo-gated fetch: TH/LV endpoints reject datacenter IPs (keep-last-good covers cached CI, but a cold cache fails)
          - An upstream URL scheme changed (UK rotates asset URLs per release; NZ renames its MVR_* service monthly)"
          existing=$(gh issue list --repo "$GH_REPO" --label pipeline-failure --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GH_REPO" "$existing" --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body" --label pipeline-failure
          fi

  # ── The release channel fan-out. Calling the reusable workflow rather than
  # duplicating its steps means the CI path and the hand-cut path run the SAME
  # code. It cannot be reached by `on: release` from here: a release created
  # with the default GITHUB_TOKEN does not fire `release` events (GitHub's
  # workflow-loop prevention), which is precisely why the mirror silently
  # stopped covering releases this workflow did not create.
  #
  # `released_tag` is empty unless a release actually happened, so validate-only
  # runs and no-data-change runs skip this entirely.
  channels:
    needs: build
    if: needs.build.outputs.released_tag != ''
    uses: ./.github/workflows/release-channels.yml
    with:
      tag: ${{ needs.build.outputs.released_tag }}
    secrets: inherit
