name: Lint data

# Fast PR feedback for data contributions (override lines, spot-panel rows).
# Stdlib-only, no secrets, no pipeline checkout — the authoritative validation
# still happens inside every scheduled build (monthly-build.yml).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint_curation.rb's provenance check diffs added lines against the
          # base ref, so it needs history, not a shallow clone.
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Lint curated data files (shape, vocabulary, provenance)
        run: ruby scripts/lint_overrides.rb
      - name: Lint curation structure (duplicate keys, make keys, added-line reasons)
        # Catches the failure modes that are otherwise SILENT: a duplicate YAML
        # key (safe_load keeps the last and discards the other block), a make
        # block whose key matches no display name (inert forever), and curation
        # added without a stated reason.
        run: ruby scripts/lint_curation.rb --base=origin/${{ github.base_ref || 'main' }}
      - name: Historical gem ids still resolve; display pins name live ids
        # Every id a published vehicles-gem release shipped must be live, aliased
        # (former_ids) or manifested (removals) — ids retired before the no-vanish
        # gate existed were never checked (CarHey trace, 2026-11-09).
        run: ruby scripts/lint_id_history.rb
      - name: SCHEMA.md documents every published make key; country of origin shape
        # The growth contract is only a contract if SCHEMA.md names every field
        # the build emits (a new make key fails here until it has a row), the
        # manifest's schema versions match the doc, and every make's country of
        # origin is a valid ISO code with its tier, one origin per make.
        run: ruby scripts/lint_schema_doc.rb
      - name: Verify make blocks are alphabetical
        # Alphabetical order is what lets two maintainers append concurrently
        # without conflicting, and what stops a second `Honda:` block appearing.
        run: ruby scripts/reorg_make_blocks.rb --check
      - name: Verify README/llms.txt numbers match manifest.json + catalog/
        # The headline counts (models, makes, kinds, countries), the per-kind
        # and per-country tables, the citation block and llms.txt's summary are
        # GENERATED by scripts/gen_readme_stats.rb from this release's own
        # files. A hand-typed or forgotten number fails here, not in an AI
        # summary six weeks later. Fix: run the script and commit.
        run: ruby scripts/gen_readme_stats.rb --check
      - name: Verify OWNERSHIP.yml matches the catalog
        # Regenerating must be a no-op; a diff here means a release added makes
        # and the ownership map needs regenerating + both maintainers acking.
        run: |
          ruby scripts/gen_ownership.rb
          git diff --exit-code OWNERSHIP.yml || {
            echo "::error::OWNERSHIP.yml is stale — run scripts/gen_ownership.rb and commit"
            exit 1
          }
      - name: Lint the plates dataset (schema, periods, regex round-trip, separator contract)
        # PRD-PLATES §5.2, gate L0. Also enforces the #124 amendments: the
        # normative separator character set (_meta/separators.yml), the
        # required `matching: strict|recall-only` key, and the regex tier
        # order. Wired here because an unenforced contract is a suggestion.
        run: ruby scripts/lint_plates.rb

      - name: Lint the review ledgers (verdict shape, liveness, coverage monotonicity)
        # PRD-QUALITY §5.3. Wired in per the owner ruling on data#292, part 3 —
        # "the §5.3 receipt finally has teeth". What it gates:
        #   * every verdict cites evidence (or declares `register-only`);
        #   * `canonical`/`fixed`/`debt` on an id that is NOT live fails — a
        #     verdict about a record that no longer exists is not coverage;
        #   * `removed`/`moved` on an id that IS live fails;
        #   * `stale` on an id that IS live fails unless the row carries a
        #     `stale_ack:` — that is the monotonicity rule, enforced per record.
        #     An id that LEFT the catalog is a no-op, because it decrements the
        #     numerator and the denominator together, which is the whole point
        #     of the ruling: a ratio whose denominator moves is not a regression.
        # KNOWN LIMITS, stated rather than hidden: VDB_PACKS is not available in
        # CI, so the raw-fingerprint staleness comparison is SKIPPED here and the
        # script says so on stdout; and this sees the per-make ledgers only, not
        # audit-round ledgers (AUD's finding) — a separate fix, not a blocker.
        run: ruby scripts/lint_review.rb

      - name: Dataset name-shape report (non-blocking until debt is zero)
        run: ruby scripts/lint_dataset.rb --report
